          grep -Fq 'lwod_v4095_hero' android/scripts/V4094HeroPhoenix.gd
          grep -Fq 'lwod_v4095_unique_phoenix' android/scripts/V4094HeroPhoenix.gd
          grep -Fq 'lwod_v4096_hero' android/scripts/V4094HeroPhoenix.gd
          grep -Fq 'lwod_v4096_unique_phoenix' android/scripts/V4094HeroPhoenix.gd
          grep -Fq 'lwod_v4097_hero' android/scripts/V4094HeroPhoenix.gd
          grep -Fq 'lwod_v4097_unique_phoenix' android/scripts/V4094HeroPhoenix.gd
          grep -Fq 'lwod_v4098_hero' android/scripts/V4094HeroPhoenix.gd
          grep -Fq 'lwod_v4098_unique_phoenix' android/scripts/V4094HeroPhoenix.gd
          echo 'NEUE_MODELLE_OK'

      - name: GDScript-Syntax vorab pruefen
        shell: bash
        run: |
          set -euo pipefail
          cat > android/tests/V4098ParseSmoke.gd <<'GD_PARSE'
          extends SceneTree
          func _initialize() -> void:
              var source: Script = load("res://scripts/V4094HeroPhoenix.gd") as Script
              if source == null or not source.can_instantiate():
                  push_error("V4098_PARSE_ERROR")
                  quit(1)
                  return
              print("V4098_PARSE_OK")
              quit(0)
          GD_PARSE
          timeout --signal=TERM --kill-after=5s 60s             godot --headless --path android --quit-after 120 --script res://tests/V4098ParseSmoke.gd             2>&1 | tee /tmp/lwod_parser.log
          if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script' /tmp/lwod_parser.log; then
            echo 'FEHLER: Syntaxpruefung fehlgeschlagen'
            exit 1
          fi
          grep -Fq 'V4098_PARSE_OK' /tmp/lwod_parser.log
          echo 'GDSCRIPT_OK'

