name: LWOD Android V40.7 Grafik Sonnental
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/blank-ps1.yml
permissions:
  contents: read
jobs:
  android:
    name: LWOD Android V40.7 APK
    runs-on: ubuntu-latest
    timeout-minutes: 55
    container:
      image: barichello/godot-ci:4.7.2
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: /usr/lib/android-sdk
    steps:
    - name: Repository laden
      uses: actions/checkout@v4
    - name: V40.4 funktionierende Basis wiederherstellen
      shell: bash
      run: "set -euo pipefail\nwget -q --tries=3 --timeout=60 --https-only -O \"$RUNNER_TEMP/lwod_v404_base.yml\"\
        \ 'https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/56f0951afbb88f543dff9bd1b935dca7e6007311/.github/workflows/blank-ps1.yml'\n\
        test -s \"$RUNNER_TEMP/lwod_v404_base.yml\"\ntest \"$(git hash-object \"$RUNNER_TEMP/lwod_v404_base.yml\"\
        )\" = 'c7a6f3d386b25b8bb867d2a57fe508b884cf4a53' || { echo 'V40.4-Quellversion stimmt nicht'; exit\
        \ 44; }\ncat > \"$RUNNER_TEMP/replay_v404.sh\" <<'REPLAY'\n#!/usr/bin/env bash\nset -euo pipefail\n\
        wanted=\"$1\"\nawk -v wanted=\"$wanted\" '\n  $0 == \"    - name: \" wanted { found=1; next }\n  found\
        \ && $0 == \"      run: |\" { active=1; next }\n  active && /^    - name:/ { exit }\n  active && /^\
        \        / { sub(/^        /, \"\"); print; next }\n  active && /^$/ { print \"\"; next }\n  END {\
        \ if(active != 1) exit 57 }\n' \"$RUNNER_TEMP/lwod_v404_base.yml\" > \"$RUNNER_TEMP/v404_replay_step.sh\"\
        \ntest -s \"$RUNNER_TEMP/v404_replay_step.sh\"\nbash -n \"$RUNNER_TEMP/v404_replay_step.sh\"\nbash\
        \ \"$RUNNER_TEMP/v404_replay_step.sh\"\nREPLAY\nchmod +x \"$RUNNER_TEMP/replay_v404.sh\"\nbash \"$RUNNER_TEMP/replay_v404.sh\"\
        \ 'V40.3 FIX5 Basis aus festem Commit wiederherstellen'\nbash \"$RUNNER_TEMP/replay_v404.sh\" 'V40.4\
        \ Shop und Inventar installieren'\n"
