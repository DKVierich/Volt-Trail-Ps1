      run: "set -euo pipefail\ngodot --headless --path android --script res://tests/V4082GroundSmoke.gd\
        \ > \"$RUNNER_TEMP/v4082_ground.log\" 2>&1 || {\n  cat \"$RUNNER_TEMP/v4082_ground.log\"\n  exit\
        \ 1\n}\ncat \"$RUNNER_TEMP/v4082_ground.log\"\ngrep -Fq 'V4082_GROUND_TEST_OK:' \"$RUNNER_TEMP/v4082_ground.log\"\
        \n"
    - name: V40.8.3 Fünf aufeinanderfolgende Teleports und Dorfausstattung testen
