    - name: Godot Ressourcen importieren
      shell: bash
      run: |
        set -euo pipefail
        bash "$RUNNER_TEMP/replay_v404.sh" 'Godot Ressourcen importieren'
        test -s android/scripts/V404Market.gd
        test -s android/tests/V404WeaponSmoke.gd
    - name: Bisherige Handels- und Dorf-Tests
      shell: bash
      run: |
        set -euo pipefail
        bash "$RUNNER_TEMP/replay_v404.sh" 'Bisherige Spieltests V31 bis FIX5 ausfuehren'
        bash "$RUNNER_TEMP/replay_v404.sh" 'V40.4 Handel und Inventar testen'
    - name: V40.4.1 Waffenslot automatisch testen
      shell: bash
      run: |
        set -euo pipefail
        godot --headless --path android --script res://tests/V404WeaponSmoke.gd > "$RUNNER_TEMP/v4041_weapon.log" 2>&1 || {
          cat "$RUNNER_TEMP/v4041_weapon.log"
          exit 1
        }
        cat "$RUNNER_TEMP/v4041_weapon.log"
        grep -Fq 'V404_WEAPON_TEST_OK:' "$RUNNER_TEMP/v4041_weapon.log"
    - name: LWOD Android V40.4.1 APK erstellen
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p build/android
        godot --headless --path android --export-debug 'Android' "$GITHUB_WORKSPACE/build/android/LWOD-Android-V40.4.1-Waffenslot.apk"
        test -s build/android/LWOD-Android-V40.4.1-Waffenslot.apk
        unzip -t build/android/LWOD-Android-V40.4.1-Waffenslot.apk >/dev/null
        ls -lh build/android/LWOD-Android-V40.4.1-Waffenslot.apk
    - name: Fehlerdiagnose speichern
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: LWOD_V40_4_1_DIAGNOSE
        path: |-
          android/scripts/Main.gd
          android/scripts/V404Market.gd
          android/tests/V404WeaponSmoke.gd
          ${{ runner.temp }}/v4041_weapon.log
        if-no-files-found: warn
        retention-days: 14
    - name: Android V40.4.1 APK hochladen
      uses: actions/upload-artifact@v4
      with:
        name: LWOD_ANDROID_V40_4_1_APK
        path: build/android/LWOD-Android-V40.4.1-Waffenslot.apk
        if-no-files-found: error
        retention-days: 14
