        \ fragment() {\\n    vec2 tile = UV / vec2(0.78, 0.92);\\n    float row = floor(tile.y);\\n    tile.x += mod(row,\
        \ 2.0) * 0.5;\\n    vec2 stone_id = floor(tile);\\n    vec2 tile_part = fract(tile);\\n    vec2 edge = min(tile_part,\
        \ vec2(1.0) - tile_part);\\n    float distance_to_joint = min(edge.x, edge.y);\\n    float stone_mask = smoothstep(0.045,\
        \ 0.085, distance_to_joint);\\n    float variation = fract(sin(dot(stone_id, vec2(31.417, 73.921))) * 43758.5453);\\\
        n    float vein = fract(sin(dot(stone_id + vec2(2.7, 8.3), vec2(13.19, 17.71))) * 18345.137);\\n    vec3 stone = mix(vec3(0.58,\
        \ 0.53, 0.47), vec3(0.73, 0.66, 0.57), variation);\\n    stone *= 0.96 + vein * 0.08;\\n    vec3 mortar = vec3(0.32,\
        \ 0.29, 0.25);\\n    ALBEDO = mix(mortar, stone, stone_mask);\\n    ROUGHNESS = 0.98;\\n    SPECULAR = 0.10;\\n}\\\
        n',encoding='utf-8')\np=Path('android/scripts/V408Regions.gd')\ns=p.read_text(encoding='utf-8')\nassert s.count('func\
