# LWOD Android V18 - V17 GDScript Typfehler repariert
# EINZIGE GitHub-Datei: .github/workflows/lwod-android.yml
# Enthaelt Phoenix-Menue-Grafik kompakt direkt als WebP-Asset. Vollstaendig unter 128 kB kopierbar.
# Originalintro 37617.mp4 ist identisch mit der schon auf GitHub gespeicherten MP4.
name: LWOD Android V18 Phoenix Grafik Compiler Fix

'on':
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/lwod-android.yml'
      - '.github/workflows/blank-ps1.yml'

permissions:
  contents: read

jobs:
  android:
    name: Android V18 APK erstellen
    runs-on: ubuntu-latest
    timeout-minutes: 50
    container:
      image: barichello/godot-ci:4.7.2
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: /usr/lib/android-sdk
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: Android SDK und Godot vorbereiten
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.local/share/godot/export_templates"
          cp -a /root/.config/godot/. "$HOME/.config/godot/"
          cp -a /root/.local/share/godot/export_templates/. "$HOME/.local/share/godot/export_templates/"
          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
          test -x "$JAVA_HOME/bin/java"
          test -s /root/debug.keystore
          sdkmanager --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.1'
          test -d "$ANDROID_HOME/platforms/android-35"
      - name: V7 Buildquelle laden und Pruefsumme kontrollieren
        shell: bash
        run: |
          set -euo pipefail
          # Genau die erfolgreich getestete V7-Quelle, unveraendert herunterladen.
          wget -q --tries=3 --timeout=45 -O "$RUNNER_TEMP/lwod_v7.yml" \
            'https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/896c1f2f07a8f6607c12a781bfaad66544ad5eb1/.github/workflows/blank-ps1.yml'
          test -s "$RUNNER_TEMP/lwod_v7.yml"
          test "$(git hash-object "$RUNNER_TEMP/lwod_v7.yml")" = '065090bc3424b6a18a67b6971ce43dcb063139ea'
          cat > "$RUNNER_TEMP/extract_v7.sh" <<'EXTRACT'
          #!/bin/bash
          set -euo pipefail
          step="$1"
          awk -v step="$step" '
            $0 == "      - name: " step {found=1; next}
            found && /^        run: \|$/ {collect=1; next}
            collect && /^      - name:/ {exit}
            collect && /^          / {sub(/^          /, ""); print; next}
            collect && /^$/ {print; next}
            END {if(!collect) exit 42}
          ' "$RUNNER_TEMP/lwod_v7.yml" > "$RUNNER_TEMP/v7_step.sh"
          test -s "$RUNNER_TEMP/v7_step.sh"
          bash -n "$RUNNER_TEMP/v7_step.sh"
          bash "$RUNNER_TEMP/v7_step.sh"
          EXTRACT
          bash -n "$RUNNER_TEMP/extract_v7.sh"
      - name: Funktionsfaehige V7 Spielwelt und Menues erstellen
        shell: bash
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/extract_v7.sh" 'Funktionierende V6 Spielwelt erstellen'
          test -s android/scripts/Main.gd
          bash "$RUNNER_TEMP/extract_v7.sh" 'V7 Spielfigur Steuerung und Menues'
          test -s android/scripts/V7Addon.gd
      - name: Workflow Vollstaendigkeit pruefen
        shell: bash
        run: |
          set -euo pipefail
          workflow=".github/workflows/lwod-android.yml"
          if [ ! -f "$workflow" ]; then
            workflow=".github/workflows/blank-ps1.yml"
          fi
          test -s "$workflow"
          # Die vorherige Pruefung zaehlte auch ihre eigenen Suchbefehle.
          # Nur das Vorhandensein der echten Abschlussmarker ist entscheidend.
          grep -Eq '^[[:space:]]{10}LWOD_V11_MENU_IMAGE$' "$workflow"
          grep -Eq '^[[:space:]]{10}LWOD_V11_SKIN_GZ$' "$workflow"
          grep -Fq 'LWOD_ANDROID_V18_PHOENIX_APK' "$workflow"
          echo 'V17: Bild und Menu-Code vollstaendig'
      - name: Original 37617 Intro mit Ton einbinden
        shell: bash
        run: |
          set -euo pipefail
          # Das hochgeladene 37617.mp4 hat dieselbe Git-Blob-Pruefsumme
          # wie diese bereits vorhandene Originaldatei: acc61838ea2438a54fd1b35ad363607e0c1efe5b
          wget -q --tries=3 --timeout=45 -O "$RUNNER_TEMP/lwod_intro.mp4" \
            'https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/896c1f2f07a8f6607c12a781bfaad66544ad5eb1/DKVierich_Produktion_PS1_Intro_original.mp4'
          test -s "$RUNNER_TEMP/lwod_intro.mp4"
          test "$(git hash-object "$RUNNER_TEMP/lwod_intro.mp4")" = 'acc61838ea2438a54fd1b35ad363607e0c1efe5b'
          if ! command -v ffmpeg >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          mkdir -p android/assets
          # Video und Originalton bleiben erhalten: Godot liest Ogg Theora + Vorbis.
          ffmpeg -hide_banner -loglevel error -nostdin -y \
            -i "$RUNNER_TEMP/lwod_intro.mp4" \
            -c:v libtheora -q:v 6 -c:a libvorbis -q:a 5 -ac 2 \
            android/assets/dkvierich_intro.ogv
          test -s android/assets/dkvierich_intro.ogv
