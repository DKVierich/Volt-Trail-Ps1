# V30.5: KORRIGIERTER GitHub-Workflow. Baut V30.4 + Ost-Sued-West-Fix.
# V30.3 Vollstaendiger PS1 Build. Basis V30.1 + V30.2 + Sichtreparatur.
# V27 und Memory Card bleiben unveraendert.
name: Lydra World Of Dragon V30.5 - Sonne Osten Sueden Westen
on:
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Quellprojekt auschecken
      uses: actions/checkout@v4
    - name: Werkzeuge installieren
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build unzip curl ffmpeg python3-pil python3-yaml
    - name: Funktionierende V30.1 Build-Schritte laden
      shell: bash
      run: |
        set -euo pipefail
        curl -fL --retry 3 \
          'https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/755ea4e126a0f5e008a477532f21b588f055379e/.github/workflows/blank-ps1.yml' \
          -o "$RUNNER_TEMP/v301_stabil.yml"
        cat > "$RUNNER_TEMP/replay_v301.py" <<'PY'
        import os,sys,subprocess,yaml
        from pathlib import Path
        y=Path(os.environ['RUNNER_TEMP'])/'v301_stabil.yml'
        steps=yaml.safe_load(y.read_text(encoding='utf-8'))['jobs']['build']['steps']
        matches=[s for s in steps if s.get('name')==sys.argv[1] and isinstance(s.get('run'),str)]
        if len(matches)!=1:
            raise RuntimeError('V30.1 Schritt nicht gefunden: '+sys.argv[1])
        print('Replay:',sys.argv[1],flush=True)
        subprocess.run(['bash','-euo','pipefail','-c',matches[0]['run']], check=True, env=os.environ.copy())
        PY
        python3 -m py_compile "$RUNNER_TEMP/replay_v301.py"
    - name: Stabile V27-Quellkette laden
      shell: bash
      run: |
        set -euo pipefail
        python3 "$RUNNER_TEMP/replay_v301.py" 'Stabile V27-Quellkette laden'
    - name: V27 Grundlage – V26 laden
      shell: bash
      run: |
        set -euo pipefail
        python3 "$RUNNER_TEMP/replay_v301.py" 'V27 Grundlage – V26 laden'
