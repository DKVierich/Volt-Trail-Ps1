name: LWOD Android V41.7 Karte Lydra und neue Weltregionen
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/blank-ps1.yml
permissions:
  contents: read
jobs:
  android:
    name: LWOD Android V41.7 APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: barichello/godot-ci:4.7.2
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: /usr/lib/android-sdk
    steps:
    - name: Repository laden
      uses: actions/checkout@v4
    - name: Grundpakete bereitstellen
      shell: bash
      run: |
        set -euo pipefail
        if ! python3 -c 'import yaml' >/dev/null 2>&1; then
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-yaml
        fi
    - name: Bestehendes Spiel inklusive NPCs und Sonnental wiederherstellen
      shell: bash
      run: |
        set -euo pipefail
        wget -q --tries=3 --timeout=60 --https-only -O "$RUNNER_TEMP/lwod_4094_original.yml" \
          'https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/71e1462a498cf34943c37807df9bc1b2cdece637/.github/workflows/blank-ps1.yml'
        python3 - <<'PY_REBUILD'
        from pathlib import Path
        import subprocess, os, yaml, hashlib
        p = Path(os.environ['RUNNER_TEMP']) / 'lwod_4094_original.yml'
        data = p.read_bytes()
        blob_sha = hashlib.sha1(('blob %d\0' % len(data)).encode() + data).hexdigest()
        assert blob_sha == 'df81453c567051bb0813926abca84d6ba2467196', 'Unerwarteter Basisstand'
        steps = yaml.safe_load(data)['jobs']['android']['steps']
        assert len(steps) == 10
        for i in (2,3,4,5):
            name = steps[i]['name']
            print('REKONSTRUKTION:', name, flush=True)
            subprocess.run(['timeout','--signal=TERM','--kill-after=5s','1200s',
                'bash','-e','-u','-o','pipefail','-c',steps[i]['run']],check=True)
        print('BASIS_OK: Alle bisherigen Spielinhalte vorhanden',flush=True)
        PY_REBUILD
    - name: 3D-Modell-Werkzeuge bereitstellen
      shell: bash
      run: |
        set -euo pipefail
        if ! python3 -c 'import numpy, PIL' >/dev/null 2>&1; then
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-numpy python3-pil
        fi
        python3 -c 'import numpy, PIL; print("MODEL_DEPENDENCIES_OK")'
    - name: V41.6 3D-Modelle und Fluganimation bereitstellen
      shell: bash
      run: |
        set -euo pipefail
