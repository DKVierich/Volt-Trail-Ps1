    - name: FIX75 Kampfdesign und Testszene vorbereiten
      shell: bash
      run: "set -euo pipefail\nmkdir -p build/diagnose\ncat > android/tests/V473VisualSmoke.gd <<'V473_TEST'\nextends SceneTree\n\
        const B = preload(\"res://scripts/V469Battle.gd\")\n\nfunc _initialize() -> void:\n    call_deferred(\"_run\")\n\n\
        func _fail(msg: String) -> void:\n    push_error(\"FIX75: \" + msg)\n    quit(1)\n\nfunc _run() -> void:\n    var\
        \ b := B.new()\n    root.add_child(b)\n    b._build_battle_screen()\n    if b._screen == null or b._actions == null:\n\
        \        _fail(\"battle UI was not built\")\n        return\n    var panel: PanelContainer = b._hud.get_node_or_null(\"\
        BottomPanel\") as PanelContainer\n    var camera: Camera3D = b._arena.get_node_or_null(\"Camera3D\") as Camera3D\n\
        \    if panel == null or camera == null:\n        _fail(\"camera or panel missing\")\n        return\n    if camera.position.y\
        \ < 5.0 or camera.position.z > 7.3 or camera.fov > 55:\n        _fail(\"new close elevated camera was not applied\"\
        )\n        return\n    if panel.anchor_top < 0.58:\n        _fail(\"button panel must stay at the bottom\")\n    \
        \    return\n    b._show_choices(B.hero_actions())\n    if b._actions.get_child_count() != 7:\n        _fail(\"hero\
        \ action count changed\")\n        return\n    for button in b._actions.get_children():\n        if not (button is\
        \ Button) or button.custom_minimum_size.y < 56.0:\n            _fail(\"buttons not enlarged\")\n            return\n\
        \    if b._arena.get_child_count() < 75:\n        _fail(\"decorated arena missing\")\n        return\n    if B.companion_actions().size()!=5\
        \ or B.binding_chance(20,86)<0.4:\n        _fail(\"combat logic regression\")\n        return\n    var ground_mesh:\
        \ MeshInstance3D = b._arena.get_child(0) as MeshInstance3D\n    if ground_mesh == null or not (ground_mesh.material_override\
        \ is ShaderMaterial):\n        _fail(\"forest ground shader missing\")\n        return\n    var moss_count: int =\
        \ 0\n    for child in b._arena.get_children():\n        if String(child.name).begins_with(\"Moosstein_\"):\n     \
        \       moss_count += 1\n    if moss_count < 16:\n        _fail(\"moss rocks and fern clusters missing\")\n      \
        \  return\n    if not b.has_method(\"_v475_idle\") or not b.has_method(\"_v475_impact\"):\n        _fail(\"idle animation\
        \ or impact feedback missing\")\n        return\n    for button in b._actions.get_children():\n        if button is\
        \ Button and button.get_theme_font_size(\"font_size\") < 25:\n            _fail(\"new larger button font missing\"\
        )\n            return\n    print(\"FIX75_VISUAL_TEST_OK: high-resolution arena, forest ring, enhanced dragon, responsive\
        \ large buttons\")\n    quit(0)\nV473_TEST\npython3 - <<'FIX75_ASSERT'\nfrom pathlib import Path\ns=Path('android/scripts/V469Battle.gd').read_text(encoding='utf-8')\n\
        for name in ['func _v475_forest_ground(','func _v475_idle(','func _v475_impact(','msaa_3d = Viewport.MSAA_2X','screen_space_aa\
        \ = Viewport.SCREEN_SPACE_AA_FXAA','WaldbodenMoos_','Steinkreis_','func _finish_binding()','func _on_save_pressed()','func\
        \ _sync_team_and_save_buttons()']:\n    assert name in s,name\ncompile(Path('android/tests/V473VisualSmoke.gd').read_text(),'<gdscript-test-text>','exec')\
        \ if False else None\nprint('FIX75_STATIC_OK: gameplay binding unchanged')\nFIX75_ASSERT\n"
    - name: FIX75 Android Updateversion eindeutig setzen
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''FIX75_VERSION''

        from pathlib import Path

        p=Path(''android/export_presets.cfg'')

        s=p.read_text(encoding=''utf-8'')

        assert ''version/name="4.1.7.73"'' in s, ''FIX75: graphic upgrade not applied''

        s=s.replace(''version/name="4.1.7.73"'',''version/name="4.1.7.75"'',1)

        # Increment a version-code in the export to allow clean Android updates.

        import re

        m=re.search(r''(?m)^version/code=(\d+)$'',s)

        assert m, ''FIX75: Android version code missing''

        s=s[:m.start()]+f''version/code={int(m.group(1))+2}''+s[m.end():]

        p.write_text(s,encoding=''utf-8'')

        print(''FIX75_ANDROID_VERSION_OK'')

        FIX75_VERSION

        '
