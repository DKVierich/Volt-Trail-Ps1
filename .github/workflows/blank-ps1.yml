name: LWOD FIX32 - Rundere PS1-Modelle
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Quellprojekt auschecken
      uses: actions/checkout@v4
    - name: Werkzeuge installieren
      shell: bash
      run: 'set -euo pipefail

        sudo apt-get update

        sudo apt-get install -y cmake ninja-build unzip curl ffmpeg python3-pil python3-yaml

        '
    - name: FIX28.1 Workflow-Vollstaendigkeit und Artefakt-Stufen pruefen
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY_WORKFLOW_INTEGRITY'\nfrom pathlib import Path\nimport yaml\np=Path('.github/workflows/blank-ps1.yml')\nb=p.read_bytes()\nw=yaml.safe_load(b)\nsteps=w['jobs']['build']['steps']\nexpected=64\nif len(steps)!=expected:\n    raise SystemExit('Workflow wurde abgeschnitten: '+str(len(steps))+' statt '+str(expected)+' Schritte!')\nif len(b)>=125000:\n    raise SystemExit('Workflow zu gross fuer zuverlaessige mobile Uebertragung: '+str(len(b))+' Bytes')\nif steps[-1].get('name') != 'GitHub Artefakt-ID nach dem Upload erzwingen':\n    raise SystemExit('Workflow-Ende fehlt: Artefakt-ID-Pruefung nicht gefunden.')\nuploads=[s for s in steps if s.get('uses')=='actions/upload-artifact@v4' and s.get('id')=='lydra_ps1_artifact']\nif len(uploads)!=1 or uploads[0].get('with',{}).get('if-no-files-found')!='error':\n    raise SystemExit('GitHub Artefakt-Upload fehlt oder ist nicht strikt.')\nprint('FIX28.1: Vollstaendiger Workflow mit',len(steps),'Schritten erkannt; Groesse',len(b),'Bytes.')\nPY_WORKFLOW_INTEGRITY\n"
