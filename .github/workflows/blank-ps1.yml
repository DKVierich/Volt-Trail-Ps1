                else setRGB0(tile,10,21,40);
                addPrim(ot[db],tile);
            }
            /* Options page receives a plain dark panel below its three rows. */
            if(vt_v314_phase==3) {
                aligned=(prim_used+3u)&~3u;
                if(aligned+sizeof(TILE)>sizeof(prim_arena[db]))return;
                tile=(TILE *)(prim_arena[db]+aligned);
                prim_used=aligned+sizeof(TILE);
                setTile(tile);
                setXY0(tile,97,132);
                setWH(tile,135,80);
                setRGB0(tile,12,19,37);
                addPrim(ot[db],tile);
