          helpers = r'''
          static int vt_v21_party_position(int species) {
              int i;
              for (i = 0; i < vt_v21_count; i++)
                  if (vt_v21_party[i] == species) return i;
              return -1;
          }

          static void vt_v21_autofill(void) {
              int species;
              for (species = 1; species < 5 && vt_v21_count < 3; species++) {
                  if (vt_v20_owned(species) && vt_v21_party_position(species) < 0) {
                      vt_v21_party[vt_v21_count++] = species;
