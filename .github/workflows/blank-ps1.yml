        from pathlib import Path

        p = Path(''android/scripts/V27Terrain.gd'')

        s = p.read_text(encoding=''utf-8'')

        assert s.startswith(''extends Node3D\n''), ''Unexpected V27Terrain header''

        assert ''V4091Palette'' not in s, ''Palette already installed''

        s = s.replace(''extends Node3D\n'', ''extends Node3D\nconst V4091Palette = preload(\"res://scripts/V4091Palette.gd\")\n'',
        1)

        start = s.index(''func color_at(x: float, z: float, height: float) -> Color:'')

        end = s.index(''\nfunc _emit_vertex('', start)

        block = s[start:end]

        assert block.count(''return c'') == 1, ''Terrain color function changed unexpectedly''

        block = block.replace(''return c'', ''return V4091Palette.stylize(self, x, z, height, c)'', 1)

        s = s[:start] + block + s[end:]

        p.write_text(s, encoding=''utf-8'')

        assert s.count(''V4091Palette.stylize('') == 1

        print(''V4091_COLOR_PATCH_OK'')

        LWOD_4091_PATCH

