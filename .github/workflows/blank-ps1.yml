          }

          static void vt_v241_bridge(int z) {
              int i;
              if (!vt_v241_visible(0,z,850))return;
              /* Blue river and a broad raised wooden crossing on the main road. */
              vt_v241_flat(-760,z-85,760,z+85,34,37,108,176);
              vt_v241_flat(-115,z-95,115,z+95,28,154,112,73);
              for (i=-2;i<=2;i++) {
