    - name: FIX27 Hauskamera C-Deklarationen robust pruefen
      shell: bash
      run: "set -euo pipefail\npython3 - <<'FIX22_CHECK'\nfrom pathlib import Path\nimport os\ns=(Path(os.environ['PROJECT_DIR'])/'src/main.c').read_text(encoding='utf-8')\nfor term in ('static int vt_v31997_house_ray_blocked(void) {',\n             'camera_pos.vz = CAMERA_Z + (vt_v28_camera_blend * 2);',\n             'camera_pos.vy = 48 + (vt_v28_camera_blend * 2) / 5;',\n             'hold_frames=9;', 'LYDRA_FIX12_GLOBAL_PERCENT 75',\n             'vt_v241_building(-175,125,52,1,1);',\n             'valid geographic transition keeps its new location'):\n    if term not in s: raise RuntimeError('FIX22: expected unchanged feature missing: '+term)\nif s.count('static int vt_v31997_house_ray_blocked(void) {')!=1:\n    raise RuntimeError('FIX22: camera helper duplicate')\n# FIX27: C-Dependency order based on the actual source, with flexible whitespace.\nimport re\npatterns=(\n r'\\}\\s*vt_v281_blocker_t\\s*;',\n r'\\bstatic\\s+const\\s+vt_v281_blocker_t\\s+vt_v281_houses\\s*\\[\\s*\\]',\n r'\\bstatic\\s+int\\s+vt_v281_abs\\s*\\(\\s*int\\s+\\w+\\s*\\)\\s*\\{',\n r'\\bstatic\\s+int\\s+vt_v281_camera_obstructed\\s*\\(\\s*void\\s*\\)\\s*\\{',\n r'\\bstatic\\s+int\\s+vt_v31997_house_ray_blocked\\s*\\(\\s*void\\s*\\)\\s*\\{',\n)\nocc=[list(re.finditer(p,s,re.S)) for p in patterns]\nif any(len(ms)!=1 for ms in occ):\n    raise RuntimeError('FIX27: missing or duplicated house/ray C declaration: '+str([len(ms) for ms in occ]))\npos=[ms[0].start() for ms in occ]\nif pos!=sorted(pos):\n    raise RuntimeError('FIX27: house/ray C declarations in wrong order: '+str(pos))\nprint('FIX27: collider types and ray ordered correctly; no exact trig helper signature assumed')\nassert Path('artifacts/KAMERA_FIX22_DIAGNOSE.txt').stat().st_size>180\nprint('FIX22: rotated camera ray, house pull-in, stable city/region collision and 75-percent input verified')\nFIX22_CHECK\n"
