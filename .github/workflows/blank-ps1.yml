name: LWOD Android V41.7 FIX62 Pflasterwege in allen Doerfern und fehlende Verbindungen
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/blank-ps1.yml
permissions:
  contents: read
jobs:
  android:
    name: LWOD Android V41.7 FIX62 APK
    runs-on: ubuntu-latest
    timeout-minutes: 55
    container:
      image: barichello/godot-ci:4.7.2
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: /usr/lib/android-sdk
    steps:
    - name: FIX39 Sicherung laden
      uses: actions/checkout@v4
      with:
        ref: 9b01d317fffd8d5abf0b2d0afbffb8846c44f1c6
    - name: Python und YAML bereitstellen
      shell: bash
      run: "set -euo pipefail\nif ! command -v python3 >/dev/null 2>&1 || ! python3 -c 'import yaml' >/dev/null 2>&1; then\n\
        \  apt-get update -qq\n  DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 python3-yaml\nfi\n"
    - name: FIX39 Schritte sichern
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PYREPLAY'\nimport hashlib,os,subprocess,yaml\nfrom pathlib import Path\nraw=Path('.github/workflows/blank-ps1.yml').read_bytes()\n\
        assert hashlib.sha1(('blob %d\\0'%len(raw)).encode()+raw).hexdigest()=='148a908318b1d91002357f1acfa18fbf60e347c3','FIX39\
        \ source checksum mismatch'\nsteps=yaml.safe_load(raw)['jobs']['android']['steps']\nassert len(steps)==21 and steps[10]['name'].startswith('FIX39\
        \ Sichtweite und Terrain') and steps[16]['name'].startswith('FIX39 Sichtweite und Chunk')\nfolder=Path(os.environ['RUNNER_TEMP'])/'fix41_base';folder.mkdir(exist_ok=True)\n\
        for i in range(2,17):\n    s=steps[i];assert s.get('shell')=='bash' and 'if' not in s\n    f=folder/('%02d.sh'%i);f.write_text(s['run']+'\\\
        n',encoding='utf-8');subprocess.run(['bash','-n',str(f)],check=True)\n    print('FIX39 gesichert',i,s['name'],flush=True)\n\
        PYREPLAY\n"
    - name: Erfolgreichen FIX19 Stand laden
      uses: actions/checkout@v4
      with:
        ref: a50b23c0dbeebc464305c0451b98245a0632aebc
    - name: FIX39 vollstaendig rekonstruieren
      shell: bash
      run: "set -euo pipefail\nfor i in 02 03 04 05 06 07 08 09 10; do\n  echo \"::group::FIX39 Installationsschritt $i\"\n\
        \  bash --noprofile --norc -e -o pipefail \"$RUNNER_TEMP/fix41_base/$i.sh\"\n  echo '::endgroup::'\ndone\n"
    - name: FIX54 Dungeon-Dekoration und Statuen installieren
      shell: bash
      run: "set -euo pipefail\nmkdir -p android/scripts android/tests\ncat > 'android/scripts/V441Layout.gd' <<'FIX54_V441LAYOUT'\n\
        extends RefCounted\n# Shared coordinates for ruin, dungeon, player ground and camera.\nconst T = preload(\"res://scripts/V417Territories.gd\"\
        )\nconst OUTER_X: float = 64.0\nconst OUTER_Z: float = 72.0\n# Open-air stairwell, physically cut out of the terrain.\
        \ No portal movement.\nconst START_Z: float = -24.0\nconst END_Z: float = -56.0\nconst DEPTH: float = 18.0\nconst\
        \ HALF_WIDTH: float = 5.2\nconst HALL_BACK: float = -128.0\nconst ENTRY: Vector2 = Vector2(0,START_Z)\n\nstatic func\
        \ centre() -> Vector2:\n    return T.city_world(\"Ruine\")\n\nstatic func forward() -> Vector2:\n    return T.gate_direction(\"\
        Ruine\",\"Ruine\").normalized()\n\nstatic func right() -> Vector2:\n    var d: Vector2 = forward()\n    return Vector2(d.y,-d.x)\n\
        \nstatic func local(p: Vector3) -> Vector2:\n    var q: Vector2 = Vector2(p.x,p.z)-centre()\n    return Vector2(q.dot(right()),q.dot(forward()))\n\
        \nstatic func world(q: Vector2) -> Vector2:\n    return centre()+right()*q.x+forward()*q.y\n\nstatic func base(terrain:\
        \ Node) -> float:\n    # Top tread is exactly at the rendered ground at the entrance.\n    var c: Vector2 = world(ENTRY)\n\
        \    return float(terrain.call(\"surface_height_at\",c.x,c.y)) if is_instance_valid(terrain) else 0.0\n\nstatic func\
        \ outside_height(terrain: Node,q: Vector2) -> float:\n    var p: Vector2 = world(q)\n    return float(terrain.call(\"\
        surface_height_at\",p.x,p.y)) if is_instance_valid(terrain) else 0.0\n\nstatic func in_stair(q: Vector2) -> bool:\n\
        \    return absf(q.x) <= HALF_WIDTH and q.y <= START_Z and q.y >= END_Z\n\nstatic func in_hall(q: Vector2) -> bool:\n\
        \    return absf(q.x)<34.0 and q.y<=END_Z and q.y>HALL_BACK\n\nstatic func level(q: Vector2) -> float:\n    return\
        \ -DEPTH*clampf((START_Z-q.y)/(START_Z-END_Z),0.0,1.0)\n\nstatic func in_dungeon(terrain: Node,p: Vector3) -> bool:\n\
        \    var q: Vector2 = local(p)\n    var rel: float = p.y-base(terrain)\n    if absf(q.x)<=HALF_WIDTH and q.y>START_Z\
        \ and q.y<=START_Z+4.5:\n        return p.y<=outside_height(terrain,q)+2.5\n    if in_stair(q):\n        return rel\
        \ <= level(q)+2.5\n    return in_hall(q) and rel < -9.0\n\nstatic func walk_on_dungeon(terrain: Node,p: Vector3) ->\
        \ bool:\n    var q: Vector2 = local(p)\n    return in_stair(q) or (in_hall(q) and p.y<base(terrain)-9.0)\n\nstatic\
        \ func dungeon_floor(terrain: Node,p: Vector3) -> float:\n    return base(terrain)+level(local(p))\n\nstatic func\
        \ at(terrain: Node,q: Vector2,underground: bool) -> Vector3:\n    var w: Vector2 = world(q)\n    var y: float = base(terrain)+level(q)\
        \ if underground else outside_height(terrain,q)\n    return Vector3(w.x,y+0.085,w.y)\n\n# Exact rectangle subtraction.\
        \ Each piece lies outside a different half-plane;\n# vertices interpolate original terrain triangle heights, avoiding\
        \ cracks.\n# Vector3 here uses castle-local x,z and original world y as height.\nstatic func _split(poly: PackedVector3Array,axis:\
        \ int,edge: float,sign_value: float) -> Array[PackedVector3Array]:\n    var inner := PackedVector3Array()\n    var\
        \ outer := PackedVector3Array()\n    if poly.is_empty(): return [inner,outer]\n    var prev: Vector3 = poly[poly.size()-1]\n\
        \    var dp: float = (prev[axis]-edge)*sign_value\n    for cur in poly:\n        var dc: float = (cur[axis]-edge)*sign_value\n\
        \        if (dp>=0.0)!=(dc>=0.0):\n            var cross: Vector3 = prev.lerp(cur,dp/(dp-dc))\n            inner.append(cross)\n\
        \            outer.append(cross)\n        if dc>=0.0: inner.append(cur)\n        else: outer.append(cur)\n       \
        \ prev=cur\n        dp=dc\n    return [inner,outer]\n\nstatic func cut_triangle(poly: PackedVector3Array) -> Array[PackedVector3Array]:\n\
        \    var pieces: Array[PackedVector3Array] = []\n    var rest: PackedVector3Array = poly\n    for bound in [[0,-HALF_WIDTH,1.0],[0,HALF_WIDTH,-1.0],[2,END_Z,1.0],[2,START_Z,-1.0]]:\n\
        \        var split: Array[PackedVector3Array] = _split(rest,int(bound[0]),float(bound[1]),float(bound[2]))\n     \
        \   if split[1].size()>=3: pieces.append(split[1])\n        rest=split[0]\n        if rest.size()<3: break\n    return\
        \ pieces\n\n# Dedicated collision bit: only actual castle walls and ceilings affect the camera.\nconst CAMERA_WALL_MASK:\
        \ int = 1 << 19\nconst CAMERA_MIN_DISTANCE: float = 2.15\nconst CAMERA_MAX_HEIGHT: float = 5.80\nconst CAMERA_DISTANCE:\
        \ float = 4.5\nconst CAMERA_MAX_DISTANCE: float = 7.5\n\nstatic func camera_focus(actor: Vector3,pitch: float) ->\
        \ Vector3:\n    # Keep the actor in the frame even if the roof limits the actual orbit height.\n    return actor+Vector3.UP*clampf(1.26-(pitch-0.32)*1.45,0.10,2.65)\n\
        \nstatic func camera_floor(terrain: Node,q: Vector2) -> float:\n    if in_stair(q): return base(terrain)+level(q)\n\
        \    if in_hall(q): return base(terrain)-DEPTH\n    return outside_height(terrain,q)\n\nstatic func camera_zone(q:\
        \ Vector2) -> bool:\n    if in_hall(q): return absf(q.x)<32.4 and q.y>HALL_BACK+0.9\n    if q.y>=END_Z and q.y<=START_Z+4.5:\
        \ return absf(q.x)<HALF_WIDTH-0.55\n    # Open courtyard on the entrance side, not through its side walls.\n    return\
        \ q.y>START_Z+4.5 and q.y<START_Z+10.0 and absf(q.x)<HALF_WIDTH-0.55\n\nstatic func dungeon_camera(terrain: Node,hero:\
        \ CharacterBody3D,cam: Camera3D,yaw: float,pitch: float) -> void:\n    var actor: Vector3 = hero.global_position\n\
        \    var focus: Vector3 = camera_focus(actor,pitch)\n    var space: PhysicsDirectSpaceState3D = hero.get_world_3d().direct_space_state\n\
        \    # Do not shorten the camera into the character. Prefer an alternate shoulder\n    # or side on the staircase\
        \ instead, keeping a proper third-person distance.\n    # Use the same pitch input as the exterior camera, with a\
        \ safe indoor range.\n    var eye_height: float = clampf(3.55+(pitch-0.32)*2.65,1.60,5.60)\n    var best: Vector3\
        \ = actor+Vector3(sin(yaw)*3.0,eye_height,cos(yaw)*3.0)\n    if not in_hall(local(best)) and local(best).y<=START_Z+4.5:\n\
        \        best.y=minf(best.y,base(terrain)+3.90)\n    var fallback: Vector3 = best\n    var have_fallback: bool = false\n\
        \    var solved: bool = false\n    for angle in [0.0,0.52,-0.52,1.05,-1.05,1.57,-1.57,2.1,-2.1,3.14159265]:\n    \
        \    var turn: float = yaw+float(angle)\n        var back := Vector3(sin(turn),0.0,cos(turn))\n        for distance\
        \ in [CAMERA_DISTANCE,4.0,3.5,3.0,2.6,2.2]:\n            var candidate: Vector3 = actor+back*float(distance)+Vector3.UP*eye_height\n\
        \            var c: Vector2 = local(candidate)\n            if not camera_zone(c): continue\n            # Keep the\
        \ raised view below the covered entrance at the top of the stairs.\n            if not in_hall(c) and c.y<=START_Z+4.5:\n\
        \                candidate.y=minf(candidate.y,base(terrain)+3.90)\n            if candidate.y<camera_floor(terrain,c)+0.85:\n\
        \                candidate.y=camera_floor(terrain,c)+0.85\n                if not in_hall(c) and c.y<=START_Z+4.5\
        \ and candidate.y>base(terrain)+3.90: continue\n            if candidate.y>actor.y+CAMERA_MAX_HEIGHT: continue\n \
        \           if in_hall(c) and candidate.y>base(terrain)-DEPTH+10.4: continue\n            # Sample the line against\
        \ the analytical stair/floor, not unrelated\n            # terrain, player, companion or NPC collision shapes.\n \
        \           var above_floor: bool = true\n            for fraction in [0.25,0.5,0.75]:\n                var sample:\
        \ Vector3 = focus.lerp(candidate,float(fraction))\n                if sample.y<camera_floor(terrain,local(sample))+0.20:\n\
        \                    above_floor=false\n                    break\n            if not above_floor: continue\n    \
        \        if not have_fallback:\n                fallback=candidate\n                have_fallback=true\n         \
        \   var ray := PhysicsRayQueryParameters3D.create(focus,candidate,CAMERA_WALL_MASK,[hero.get_rid()])\n           \
        \ var hit: Dictionary = space.intersect_ray(ray)\n            if not hit.is_empty(): continue\n            # A second\
        \ ray gives clearance around the near plane at the camera.\n            var padding_ray := PhysicsRayQueryParameters3D.create(candidate,candidate+back*0.30,CAMERA_WALL_MASK,[hero.get_rid()])\n\
        \            if not space.intersect_ray(padding_ray).is_empty(): continue\n            best=candidate\n          \
        \  solved=true\n            break\n        if solved: break\n    # Even a transient collision at a seam must never\
        \ place the lens inside the hero.\n    if not solved and have_fallback: best=fallback\n    cam.global_position=best\n\
        \    cam.look_at(focus)\nFIX54_V441LAYOUT\ncat > 'android/scripts/V441Castle.gd' <<'FIX54_V441CASTLE'\nextends Node3D\n\
        const L = preload(\"res://scripts/V441Layout.gd\")\nvar game: Node\nvar terrain: Node\nvar stones: Array[Transform3D]\
