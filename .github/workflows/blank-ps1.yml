    - name: Video-Uebergaenge und interaktive Menueauswahl aktivieren
      shell: bash
      run: "set -euo pipefail\ncat > \"$RUNNER_TEMP/patch_video_menu.py\" <<'LYDRA_PATCH_PY'\n#!/usr/bin/env python3\n\
        \"\"\"Replace the static title and duplicate labels with an interactive video-derived menu.\"\"\"\nimport\
        \ os,re\nfrom pathlib import Path\np=Path(os.environ['PROJECT_DIR'])/'src/main.c'\ns=p.read_text(encoding='utf-8')\n\
        def once(old,new):\n    global s\n    n=s.count(old)\n    if n!=1:raise RuntimeError('V31.7 title patch\
        \ anchor count=%d: %r'%(n,old[:80]))\n    s=s.replace(old,new,1)\n\n# The logo presentation is automatic:\
        \ intro frames 0-3, title frames 4-6,\n# then wait for START while flashing the prompt.\n# Use whitespace-independent\
        \ anchors: the base YAML strips eight indentation columns.\nonce('else if(++vt_v314_elapsed>=150)', 'else\
        \ if(++vt_v314_elapsed>=180)')\ns,n=re.subn(r'(\\} else if\\(\\+\\+vt_v314_elapsed>=180\\) \\{\\s*)vt_v314_phase=1;',\n\
        \            r'\\g<1>vt_v314_phase=0;',s,count=1)\nif n!=1:raise RuntimeError('Intro phase transition not\
        \ found')\nstart_phase=r'\\} else if\\(vt_v314_phase==1\\) \\{\\s*if\\(pressed&\\(PAD_START\\|PAD_CROSS\\\
        )\\)'\nreplacement=('} else if(vt_v314_phase==0) {\\n'\n             '    if((pressed&(PAD_START|PAD_CROSS))\
        \ || ++vt_v314_elapsed>=126) {\\n'\n             '        vt_v314_phase=1; vt_v314_elapsed=0;\\n'\n    \
        \         '    }\\n'\n             '} else if(vt_v314_phase==1) {\\n'\n             '    if(pressed&(PAD_START|PAD_CROSS))')\n\
        s,n=re.subn(start_phase,lambda _:replacement,s,count=1)\nif n!=1:raise RuntimeError('Title transition anchor\
        \ not found')\n\n# Video has exactly three menu slots, no extra INTRO line.\nonce('vt_v314_cursor=(vt_v314_cursor+3)%4;',\
        \ 'vt_v314_cursor=(vt_v314_cursor+2)%3;')\nonce('vt_v314_cursor=(vt_v314_cursor+1)%4;', 'vt_v314_cursor=(vt_v314_cursor+1)%3;')\n\
        choice=r\"\"\"static int vt_v314_choice_frame(void) {\n    if(vt_v314_phase==-1){\n        if(vt_v314_elapsed<24)return\
        \ 0;\n        if(vt_v314_elapsed<64)return 1;\n        if(vt_v314_elapsed<112)return 2;\n        return\
        \ 3;\n    }\n    if(vt_v314_phase==0){\n        if(vt_v314_elapsed<30)return 4;\n        if(vt_v314_elapsed<75)return\
        \ 5;\n        return 6;\n    }\n    if(vt_v314_phase==1)return 6;\n    return 7;\n}\n\"\"\"\npat=r'static\
        \ int vt_v314_choice_frame\\(void\\)\\s*\\{\\s*if\\(vt_v314_phase==-1\\)return -1;\\s*return 7;\\s*\\}'\n\
        s,n=re.subn(pat,lambda _:choice.strip(),s,count=1)\nif n!=1:raise RuntimeError('Title-frame selector missing')\n\
        \n# Keep artwork supplied by user; no second dark menu and no duplicate words.\ns,n=re.subn(r'if\\(vt_v314_phase>=2\\\
        ) \\{\\s*/\\* Place an opaque ink-blue submenu tile behind the text\\.',\n            'if(vt_v314_phase==3)\
        \ {\\n    /* Place an opaque ink-blue submenu tile behind the text.',s,count=1)\nif n!=1:raise RuntimeError('Submenu\
        \ panel anchor not found')\nonce('setXY0(panel,190,157);','setXY0(panel,94,159);')\nonce('setWH(panel,130,83);','setWH(panel,150,81);')\n\
        once('FntOpen(196, 162, 124, 76, 0, 512); /* title menu */',\n     'FntOpen(105, 167, 120, 70, 0, 512);\
        \ /* title menu cursor / options */')\n\n# The branded intro artwork includes the studio text already.\n\
        once('if(vt_v314_elapsed>12)FntPrint(6,\"DKVierich Produktion\");',\n     '/* Logo and DKVierich Produktion\
