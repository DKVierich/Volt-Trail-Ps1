    - name: Godot-Karte und Gebiete importieren
      shell: bash
      run: 'set -euo pipefail

        timeout --signal=TERM --kill-after=5s 160s godot --headless --path android --import 2>&1 | tee /tmp/lwod417fix1_import.log

        if grep -Eiq ''SCRIPT ERROR:|Parse Error:|Failed to load script'' /tmp/lwod417fix1_import.log; then exit 1; fi

        printf ''V417_FIX1_IMPORT_OK\n''

        '
    - name: Weltpositionen, Wege, Regionen und Karte testen
      shell: bash
      run: 'set -euo pipefail

        timeout --signal=TERM --kill-after=5s 120s godot --headless --path android --quit-after 300 --script res://tests/V417WorldSmoke.gd 2>&1 | tee /tmp/lwod417fix1_smoke.log

        if grep -Eiq ''SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid call'' /tmp/lwod417fix1_smoke.log; then exit 1; fi

        grep -Fq ''V417_WORLD_MAP_OK:'' /tmp/lwod417fix1_smoke.log

        mkdir -p build/diagnose

        cp /tmp/lwod417fix1_smoke.log build/diagnose/V417_Weltkarte_Pruefung.log

        '
    - name: V41.7 FIX2 APK erstellen und pruefen
      shell: bash
      run: 'set -euo pipefail

        mkdir -p build/android

        APK="$GITHUB_WORKSPACE/build/android/LWOD-Android-V41.7-FIX2.apk"

        timeout --signal=TERM --kill-after=5s 900s godot --headless --path android --export-debug Android "$APK" 2>&1 | tee /tmp/lwod417fix1_export.log

        if grep -Eiq ''SCRIPT ERROR:|Parse Error:|Failed to load script'' /tmp/lwod417fix1_export.log; then exit 1; fi

        test -s "$APK"

        unzip -t "$APK" >/dev/null

        ls -lh "$APK"

        '
    - name: V41.7 FIX2 APK bereitstellen
      uses: actions/upload-artifact@v4
      with:
        name: LWOD_ANDROID_V41_7_FIX2_APK
        path: build/android/LWOD-Android-V41.7-FIX2.apk
        if-no-files-found: error
        retention-days: 14
    - name: Pruefprotokoll sichern
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: LWOD_V41_7_FIX1_DIAGNOSE
        path: build/diagnose
        if-no-files-found: warn
        retention-days: 14
