          #!/usr/bin/env python3
          '''V29.2: unobtrusive exploration HUD, location names, compass and follow yaw.'''
          import os, re
          from pathlib import Path
          p=Path(os.environ['PROJECT_DIR'])/'src/main.c'
          s=p.read_text(encoding='utf-8')

          def once(old,new):
              global s
