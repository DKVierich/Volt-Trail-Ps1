      - {name: Basis 31, shell: bash, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 31'}
      - {name: Basis 32, shell: bash, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 32'}
      - {name: Basis 33, shell: bash, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 33'}
