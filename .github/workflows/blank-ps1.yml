        def fnspan(name):
            match=list(re.finditer(r'\bstatic\s+(?:void|int)\s+'+re.escape(name)+r'\s*\([^;]*?\)\s*\{',s,re.S))
            if len(match)!=1:raise RuntimeError(f'Need exactly one {name}, got {len(match)}')
            start=match[0].start();i=match[0].end();depth=1;state='code'
