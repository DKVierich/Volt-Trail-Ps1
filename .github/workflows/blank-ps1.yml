      name: Erfolgreichen APK Upload bestaetigen
      run: 'set -euo pipefail

        test -n "$APK_ARTIFACT_ID"

        test -n "$APK_ARTIFACT_URL"

        printf ''### Android APK Download\n\n[FIX75 APK herunterladen](%s)\n'' "$APK_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

