name: LWOD Android V40.6.2 Fundmeldung oben links
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/blank-ps1.yml
permissions:
  contents: read
jobs:
  android:
    name: LWOD Android V40.6.2 APK
    runs-on: ubuntu-latest
    timeout-minutes: 55
    container:
      image: barichello/godot-ci:4.7.2
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: /usr/lib/android-sdk
    steps:
    - name: Repository laden
      uses: actions/checkout@v4
    - name: V40.4 funktionierende Basis wiederherstellen
      shell: bash
      run: |
        set -euo pipefail
        wget -q --tries=3 --timeout=60 --https-only -O "$RUNNER_TEMP/lwod_v404_base.yml" 'https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/56f0951afbb88f543dff9bd1b935dca7e6007311/.github/workflows/blank-ps1.yml'
        test -s "$RUNNER_TEMP/lwod_v404_base.yml"
        test "$(git hash-object "$RUNNER_TEMP/lwod_v404_base.yml")" = 'c7a6f3d386b25b8bb867d2a57fe508b884cf4a53' || { echo 'V40.4-Quellversion stimmt nicht'; exit 44; }
        cat > "$RUNNER_TEMP/replay_v404.sh" <<'REPLAY'
        #!/usr/bin/env bash
        set -euo pipefail
        wanted="$1"
        awk -v wanted="$wanted" '
          $0 == "    - name: " wanted { found=1; next }
          found && $0 == "      run: |" { active=1; next }
          active && /^    - name:/ { exit }
          active && /^        / { sub(/^        /, ""); print; next }
          active && /^$/ { print ""; next }
          END { if(active != 1) exit 57 }
        ' "$RUNNER_TEMP/lwod_v404_base.yml" > "$RUNNER_TEMP/v404_replay_step.sh"
        test -s "$RUNNER_TEMP/v404_replay_step.sh"
        bash -n "$RUNNER_TEMP/v404_replay_step.sh"
        bash "$RUNNER_TEMP/v404_replay_step.sh"
        REPLAY
        chmod +x "$RUNNER_TEMP/replay_v404.sh"
        bash "$RUNNER_TEMP/replay_v404.sh" 'V40.3 FIX5 Basis aus festem Commit wiederherstellen'
        bash "$RUNNER_TEMP/replay_v404.sh" 'V40.4 Shop und Inventar installieren'
