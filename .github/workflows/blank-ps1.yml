        \        int w=side?64:256;\n        aligned=(prim_used+3u)&~3u;\n        if(aligned+sizeof(POLY_FT4)>sizeof(prim_arena[db]))return;\n\
        \        q=(POLY_FT4 *)(prim_arena[db]+aligned);\n        prim_used=aligned+sizeof(POLY_FT4);\n        setPolyFT4(q);\n\
        \        setXY4(q,left,0,left+w,0,left,240,left+w,240);\n        setUV4(q,0,0,w-1,0,0,239,w-1,239);\n  \
        \      setTPage(q,1,0,side?768:640,0);\n        q->clut=getClut(640,242);\n        setSemiTrans(q,0);setShadeTex(q,0);\n\
        \        setRGB0(q,128,128,128);\n        addPrim(ot[db],q);\n    }\n}\n\"\"\")\n\nfor fn in ('vt_v314_input','vt_v314_draw','vt_v3172_menu_slots','vt_v314_hud'):\n\
