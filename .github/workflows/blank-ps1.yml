name: LWOD Android V41.7 FIX74 Kampfgrafik und sicherer kompakter Workflow
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/blank-ps1.yml
permissions:
  contents: read
jobs:
  android:
    name: LWOD Android V41.7 FIX74 APK
    runs-on: ubuntu-latest
    timeout-minutes: 55
    container:
      image: barichello/godot-ci:4.7.2
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: /usr/lib/android-sdk
    steps:
    - name: FIX39 Sicherung laden
      uses: actions/checkout@v4
      with:
        ref: 9b01d317fffd8d5abf0b2d0afbffb8846c44f1c6
    - name: Python und YAML bereitstellen
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v python3 >/dev/null 2>&1 || ! python3 -c 'import yaml' >/dev/null 2>&1; then
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 python3-yaml
        fi
    - name: FIX39 Schritte sichern
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYREPLAY'
        import hashlib,os,subprocess,yaml
        from pathlib import Path
        raw=Path('.github/workflows/blank-ps1.yml').read_bytes()
        assert hashlib.sha1(('blob %d\0'%len(raw)).encode()+raw).hexdigest()=='148a908318b1d91002357f1acfa18fbf60e347c3','FIX39 source checksum mismatch'
        steps=yaml.safe_load(raw)['jobs']['android']['steps']
        assert len(steps)==21 and steps[10]['name'].startswith('FIX39 Sichtweite und Terrain') and steps[16]['name'].startswith('FIX39 Sichtweite und Chunk')
        folder=Path(os.environ['RUNNER_TEMP'])/'fix41_base';folder.mkdir(exist_ok=True)
        for i in range(2,17):
            s=steps[i];assert s.get('shell')=='bash' and 'if' not in s
            f=folder/('%02d.sh'%i);f.write_text(s['run']+'\n',encoding='utf-8');subprocess.run(['bash','-n',str(f)],check=True)
            print('FIX39 gesichert',i,s['name'],flush=True)
        PYREPLAY
    - name: Erfolgreichen FIX19 Stand laden
      uses: actions/checkout@v4
      with:
        ref: a50b23c0dbeebc464305c0451b98245a0632aebc
    - name: FIX67 Alte Spielbasis mit Neustartschutz rekonstruieren
      shell: bash
      run: |
        set -euo pipefail
        # FIX67: A failure in the deeply nested V7 -> V40.2 source recovery must
        # not silently discard the underlying game. Keep immutable original scripts.
        test -s "$RUNNER_TEMP/fix41_base/02.sh"
        test -s "$RUNNER_TEMP/fix41_base/10.sh"
        LOGDIR="$RUNNER_TEMP/lwod_fix67_recovery"
        mkdir -p "$LOGDIR" build/diagnose
        for attempt in 1 2; do
          echo "::group::FIX67 Basisaufbau – Versuch $attempt/2"
          if [ "$attempt" -eq 2 ]; then
            # Clear only generated project files. The pinned FIX19 checkout and
            # original replay scripts in RUNNER_TEMP remain untouched.
            git reset --hard HEAD
            git clean -fdx
            mkdir -p build/diagnose
          fi
          logfile="$LOGDIR/FIX67_Basis_Versuch_${attempt}.log"
          echo "FIX67_VERSUCH_START=$attempt" | tee "$logfile"
          failed=0
          for i in 02 03 04 05 06 07 08 09 10; do
            echo "::group::FIX39 Originalinstallation $i"
            set +e
            bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/fix41_base/$i.sh" 2>&1 | tee -a "$logfile"
            status=${PIPESTATUS[0]}
            set -e
            echo '::endgroup::'
            if [ "$status" -ne 0 ]; then
              echo "FIX67_BASIS_FEHLER: Versuch $attempt, Schritt $i, Exit $status" | tee -a "$logfile"
              failed=1
              break
            fi
          done
          echo '::endgroup::'
          cp -f "$LOGDIR"/*.log build/diagnose/ || true
          if [ "$failed" -eq 0 ]; then
            echo 'FIX67_BASE_REBUILT_OK: vollständige Originalspielbasis vorhanden'
            exit 0
          fi
          if [ "$attempt" -eq 1 ]; then
            echo '::warning::Alte Basisrekonstruktion fehlgeschlagen; einmaliger sauberer Wiederholungsversuch'
          fi
        done
        echo '::error::Auch der zweite Basisaufbau ist gescheitert. Siehe FIX67_Basis_Versuch_*.log in Testprotokolle.'
        exit 1
    - name: FIX74 Vollstaendige bewährte FIX72 Spielbasis und Kampflogik installieren
      shell: bash
      run: |
        set -euo pipefail
        # Restore known-successful FIX72 gameplay modules from immutable historical workflow.
        # This avoids copying ~110 KB of pre-encoded installation steps onto a mobile GitHub editor.
        wget -q --tries=3 --timeout=60 --https-only \
          -O "$RUNNER_TEMP/lwod_fix72_source.yml" \
          'https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/4a5bc925bdafad616f3a28a6fbd2c72662169fc1/.github/workflows/blank-ps1.yml'
        test -s "$RUNNER_TEMP/lwod_fix72_source.yml"
        test "$(git hash-object "$RUNNER_TEMP/lwod_fix72_source.yml")" = 'c9e6973851d76b26b16c03eab5edcb49b6db7b1e' || {
          echo '::error::FIX72 source checksum mismatch'; exit 1;
        }
        python3 - <<'FIX74_REPLAY'
        import os, subprocess, yaml
        from pathlib import Path
        source = Path(os.environ['RUNNER_TEMP'])/'lwod_fix72_source.yml'
        steps = yaml.safe_load(source.read_text(encoding='utf-8'))['jobs']['android']['steps']
        assert len(steps) == 31, 'FIX72 workflow structure changed'
        assert 'Dungeon' in steps[5]['name'] and 'Kampfkamera' in steps[14]['name']
        # Only replay original FIX72 installation steps, not its test/export/upload steps.
        for i in range(5,15):
            step = steps[i]
            print(f'FIX74_RESTORE_STEP_{i}: {step["name"]}', flush=True)
            subprocess.run(['bash','--noprofile','--norc','-e','-o','pipefail','-c',step['run']], check=True)
        print('FIX74_BASE_OK: FIX72 gameplay fully installed', flush=True)
        FIX74_REPLAY
