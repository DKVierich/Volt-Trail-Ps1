    - name: FIX31 bis FIX33 Godot-Tests
      shell: bash
      run: |
        set -euo pipefail
        for i in 09 10 11 12; do
          echo "::group::FIX31 Originalschritt $i"
          bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/fix32_original/$i.sh"
          echo "::endgroup::"
        done
        grep -Fq "FIX32_GARDEN_OK:" build/diagnose/FIX31_Wurzelheim_Test.log
        grep -Fq "FIX33_TOUCH_ROADS_OK:" build/diagnose/FIX31_Wurzelheim_Test.log
    - name: FIX33 Android APK exportieren und pruefen
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p build/android build/diagnose
        APK="$GITHUB_WORKSPACE/build/android/LWOD-Android-V41.7-FIX33.apk"
        rm -f "$APK"
        timeout --signal=TERM --kill-after=5s 900s godot --headless --path android --export-debug Android "$APK" 2>&1 | tee build/diagnose/FIX33_APK_Export.log
        if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script' build/diagnose/FIX33_APK_Export.log; then
          exit 1
        fi
        test -s "$APK"
        unzip -t "$APK" >/dev/null
        unzip -Z1 "$APK" | grep -Fx 'AndroidManifest.xml' >/dev/null
        ls -lh "$APK"
        sha256sum "$APK"
    - name: FIX33 APK als Download hochladen
      id: apk_upload
      uses: actions/upload-artifact@v4
      with:
        name: LWOD_ANDROID_V41_7_FIX33_APK
        path: build/android/LWOD-Android-V41.7-FIX33.apk
        if-no-files-found: error
        compression-level: 0
        retention-days: 14
    - name: Erfolgreichen APK Upload bestaetigen
      shell: bash
      env:
        APK_ARTIFACT_ID: ${{ steps.apk_upload.outputs.artifact-id }}
        APK_ARTIFACT_URL: ${{ steps.apk_upload.outputs.artifact-url }}
      run: |
        set -euo pipefail
        test -n "$APK_ARTIFACT_ID"
        test -n "$APK_ARTIFACT_URL"
        printf '### Android APK Download\n\n[FIX33 APK herunterladen](%s)\n' "$APK_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
    - name: FIX33 Testprotokolle hochladen
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: LWOD_FIX33_TESTPROTOKOLLE
        path: build/diagnose
        if-no-files-found: warn
        retention-days: 14
