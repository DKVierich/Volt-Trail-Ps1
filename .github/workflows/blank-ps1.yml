
name: Build Volt Trail PS1 V16 German Quests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build unzip curl jq tar \
            ffmpeg python3-pil python3-yaml

      - name: Prepare stable V15 sources
        shell: bash
        run: |
          set -euo pipefail

          V15_COMMIT="59eebc807fc3adbce97f7099c790b9c930f9a1c6"

          curl --retry 3 -fsSL \
            "https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/$V15_COMMIT/.github/workflows/blank-ps1.yml" \
            -o "$RUNNER_TEMP/v15-fixed.yml"

          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          import yaml

          path = Path(os.environ["RUNNER_TEMP"]) / "v15-fixed.yml"
          steps = yaml.safe_load(
              path.read_text(encoding="utf-8")
          )["jobs"]["build"]["steps"]

          for wanted in [
              "Load V15 source instructions",
              "Prepare V14 project"
          ]:
              matches = [
                  step for step in steps
                  if step.get("name") == wanted
              ]

              if len(matches) != 1:
                  raise RuntimeError(
                      "Required V15 step missing: " + wanted
                  )

              print("Running:", wanted, flush=True)

              subprocess.run(
                  ["bash", "-euo", "pipefail", "-c", matches[0]["run"]],
                  env=os.environ.copy(),
                  check=True
              )
          PY

      - name: Restore V15 game and intro
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          import yaml

          path = Path(os.environ["RUNNER_TEMP"]) / "v15-fixed.yml"
          steps = yaml.safe_load(path.read_text())["jobs"]["build"]["steps"]

          for wanted in [
              "Restore V14 game and intro",
              "Add corrected V15 NPC world"
          ]:
              matches = [
                  step for step in steps
                  if step.get("name") == wanted
              ]

              if len(matches) != 1:
                  raise RuntimeError("V15 step missing: " + wanted)

              print("Restoring:", wanted, flush=True)

              subprocess.run(
                  ["bash", "-euo", "pipefail", "-c", matches[0]["run"]],
                  env=os.environ.copy(),
                  check=True
              )

          print("Stable V15 source restored")
          PY

      - name: Apply V16 German dialogue and quests
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          import textwrap
          from pathlib import Path

          path = Path(os.environ["PROJECT_DIR"]) / "src/main.c"
          code = path.read_text(encoding="utf-8")

          def replace_once(old, new):
              global code
              count = code.count(old)
              if count != 1:
                  raise RuntimeError(
                      "V16 source marker mismatch: "
                      + old[:70] + " matches=" + str(count)
                  )
              code = code.replace(old, new, 1)

          # Update the visible game version.
          replace_once(
              "VOLT TRAIL V15 - %s",
              "VOLT TRAIL V16 - %s"
          )

          # Add quest and dialogue state.
          replace_once(
              "static int vt_npc_dialog = -1;",
              """
          static int vt_npc_dialog = -1;
          static int vt_npc_page = 0;
          static int vt_walk_quest = 0;
          static int vt_walk_quest_start = 0;
          static int vt_moss_quest = 0;
              """.strip()
          )

          # Add two tasks and German dialogue pages.
          quest_code = r'''
          static void vt_begin_dialog(int npc) {
              vt_npc_dialog = npc;
              vt_npc_page = 0;

              /* Quest 1: walk 40 steps. */
              if (npc == 0) {
                  if (vt_walk_quest == 0) {
                      vt_walk_quest = 1;
                      vt_walk_quest_start = step_count;
                  } else if (
                      vt_walk_quest == 1 &&
                      step_count - vt_walk_quest_start >= 40
                  ) {
                      vt_walk_quest = 2;
                      companion_level++;
                      companion_hp = 24;

                      if (companion_level >= 8) {
                          evolved = 1;
                      }
                  }
              }

              /* Quest 2: catch a Mosslet. */
              if (npc == 1) {
                  if (vt_moss_quest == 0) {
                      vt_moss_quest = 1;
                  } else if (
                      vt_moss_quest == 1 &&
                      caught_mosslet > 0
                  ) {
                      vt_moss_quest = 2;
                      companion_hp = 24;
                  }
              }
          }

          static const char *vt_dialog_text(
              int npc, int page
          ) {
              if (npc == 0) {
                  if (vt_walk_quest == 2) {
                      if (page == 0)
                          return "FUEHRER: GUT GEMACHT!";
                      if (page == 1)
                          return "SPARKIT ERHAELT EIN LEVEL!";
                      return "AUFGABE ABGESCHLOSSEN.";
                  }

                  if (page == 0)
                      return "FUEHRER: LAUFE 40 SCHRITTE.";
                  if (page == 1)
                      return "KOMM DANN ZU MIR ZURUECK.";
                  return "BELOHNUNG: SPARKIT +1 LEVEL.";
              }

              if (npc == 1) {
                  if (vt_moss_quest == 2) {
                      if (page == 0)
                          return "BEWOHNER: TOLL GEMACHT!";
                      if (page == 1)
                          return "DEIN TEAM WURDE GEHEILT!";
                      return "DANKE FUER DEINE HILFE!";
                  }

                  if (page == 0)
                      return "BEWOHNER: FANGE EIN MOSSLET!";
                  if (page == 1)
                      return "BRING ES ZU MIR ZURUECK.";
                  return "BELOHNUNG: VOLLE LEBENSPUNKTE.";
              }

              if (npc == 2) {
                  if (page == 0)
                      return "FORSCHER: HALLO, ENTDECKER!";
                  if (page == 1)
                      return "HIER GIBT ES KRISTALLE.";
                  return "SEI VORSICHTIG IM GEBIRGE!";
              }

              if (npc == 3) {
                  if (badges > 0) {
                      if (page == 0)
                          return "WAECHTER: GLUECKWUNSCH!";
                      if (page == 1)
                          return "DU HAST DEN ORDEN!";
                      return "DIE ARENA KENNT DEINEN MUT.";
                  }

                  if (page == 0)
                      return "WAECHTER: WILLKOMMEN!";
                  if (page == 1)
                      return "DIE ARENA WARTET AUF DICH.";
                  return "BESIEGE DEN ARENA-ANFUEHRER!";
              }

              return "HALLO, REISENDER!";
          }
          '''

          replace_once(
              "static void vt_npc_model(",
              quest_code + "\nstatic void vt_npc_model("
          )

          # Replace the previous one-page dialogue controls.
          begin_key = "vt_npc_near = vt_find_npc();"
          end_key = "if (action_flash > 0) action_flash--;"

          if code.count(begin_key) != 1:
              raise RuntimeError("NPC controls not found")

          position = code.index(begin_key)
          start = code.rfind("\n", 0, position) + 1

          stop = code.find(end_key, position)
          if stop < 0:
              raise RuntimeError("Controller boundary missing")

          stop = code.rfind("\n", 0, stop) + 1

          controls = r'''
          vt_npc_near = vt_find_npc();

          /* Close conversations during battles. */
          if (game_mode != 0) {
              vt_npc_dialog = -1;
              vt_npc_page = 0;
          }

          /* Reset quest progress when starting over. */
          if (pressed & PAD_START) {
              vt_npc_dialog = -1;
              vt_npc_page = 0;
              vt_walk_quest = 0;
              vt_moss_quest = 0;
              vt_walk_quest_start = 0;
          }

          /* Triangle opens or closes conversations. */
          if (
              game_mode == 0 &&
              (pressed & PAD_TRIANGLE)
          ) {
              if (vt_npc_dialog >= 0) {
                  vt_npc_dialog = -1;
                  vt_npc_page = 0;
              } else if (vt_npc_near >= 0) {
                  vt_begin_dialog(vt_npc_near);
              }
          }

          /* X advances to the next dialogue page. */
          if (
              game_mode == 0 &&
              vt_npc_dialog >= 0
          ) {
              if (pressed & PAD_CROSS) {
                  vt_npc_page++;

                  if (vt_npc_page >= 3) {
                      vt_npc_dialog = -1;
                      vt_npc_page = 0;
                  }

                  /* Never start a battle with the
                     same press used for dialogue. */
                  pressed &= ~PAD_CROSS;
              }

              /* Keep the player in place while
                 an NPC dialogue is open. */
              if (vt_npc_dialog >= 0) {
                  pad &= ~(
                      PAD_LEFT | PAD_RIGHT |
                      PAD_UP | PAD_DOWN
                  );
              }
          }
          '''

          controls = textwrap.indent(
              textwrap.dedent(controls).strip("\n"),
              "        "
          ) + "\n\n"

          code = code[:start] + controls + code[stop:]

          # Locate the exploration HUD by C syntax
          # instead of fragile exact indentation.
          hud_marker = "static void draw_hud(void) {"
          hud = code.find(hud_marker)

          if hud < 0:
              raise RuntimeError("HUD function missing")

          first = re.search(
              r"(?m)^[ \t]*if[ \t]*\("
              r"[ \t]*game_mode[ \t]*==[ \t]*0"
              r"[ \t]*\)[ \t]*\{",
              code[hud:]
          )

          if first is None:
              raise RuntimeError("Exploration HUD missing")

          first_pos = hud + first.start()

          second = re.search(
              r"(?m)^[ \t]*\}[ \t]*else"
              r"[ \t]+if[ \t]*\("
              r"[ \t]*game_mode[ \t]*==[ \t]*1"
              r"[ \t]*\)[ \t]*\{",
              code[first_pos:]
          )

          if second is None:
              raise RuntimeError("Battle HUD boundary missing")

          second_pos = first_pos + second.start()

          german_hud = r'''
              if (game_mode == 0) {
                  if (vt_npc_dialog >= 0) {
                      FntPrint(
                          1, "%s\n\n",
                          vt_dialog_text(
                              vt_npc_dialog, vt_npc_page
                          )
                      );

                      FntPrint(
                          1, "X WEITER / DREIECK ENDE\n"
                      );

                  } else if (vt_npc_near >= 0) {
                      FntPrint(
                          1, "DREIECK SPRECHEN\n\n"
                      );

                      FntPrint(
                          1, "X KAMPF / D-PAD GEHEN\n"
                      );

                  } else {
                      FntPrint(
                          1, "D-PAD GEHEN X KAMPF\n\n"
                      );

                      FntPrint(
                          1, "DREIECK REDEN START RESET\n"
                      );
                  }
          '''

          code = (
              code[:first_pos]
              + german_hud
              + code[second_pos:]
          )

          # Translate additional visible HUD labels.
          translations = {
              "BADGE %d/1 TEAM %d STEPS %d":
                  "ORDEN %d/1 TEAM %d SCHR %d",
              "X ATTACK O CATCH (%d)":
                  "X ANGRIFF O FANGEN (%d)",
              "VICTORY! X CONTINUE":
                  "SIEG! X WEITER",
              "TEAM GETS STRONGER":
                  "TEAM WIRD STAERKER",
              "SPARKIT NEEDS REST":
                  "SPARKIT BRAUCHT RUHE",
              "X RECOVER":
                  "X HEILEN"
          }

          for old, new in translations.items():
              code = code.replace(old, new)

          # Validate the preserved PS1 systems.
          required = [
              "VOLT TRAIL V16",
              "vt_play_intro();",
              "vt_player(px, pz + 73);",
              "vt_sparkit(",
              "vt_mosslet(",
              "vt_begin_dialog(",
              "vt_dialog_text(",
              "PAD_TRIANGLE",
              "FntFlush(0);",
              "FntFlush(1);"
          ]

          for marker in required:
              if marker not in code:
                  raise RuntimeError(
                      "Missing V16 feature: " + marker
                  )

          path.write_text(code, encoding="utf-8")

          print("Volt Trail V16 source ready")
          print("German multi-page dialogues added")
          print("Walking quest and reward added")
          print("Mosslet capture quest and reward added")
          print("V15 intro, 3D world and combat preserved")
          PY

      - name: Install PSn00bSDK
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          import yaml

          path = Path(os.environ["RUNNER_TEMP"]) / "v15-fixed.yml"
          steps = yaml.safe_load(path.read_text())["jobs"]["build"]["steps"]

          matches = [
              step for step in steps
              if step.get("name") == "Install PSn00bSDK"
          ]

          if len(matches) != 1:
              raise RuntimeError("PSn00bSDK setup missing")

          subprocess.run(
              ["bash", "-euo", "pipefail", "-c", matches[0]["run"]],
              env=os.environ.copy(),
              check=True
          )
          PY

      - name: Build Volt Trail V16
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            -S "$PROJECT_DIR" \
            -B "$GITHUB_WORKSPACE/build" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PSN00BSDK_CMAKE" \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build "$GITHUB_WORKSPACE/build" --verbose

      - name: Collect PS1 files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          for file in \
            VTRAIL.bin VTRAIL.cue \
            VTRAIL.exe VTRAIL.elf
          do
            SOURCE="$GITHUB_WORKSPACE/build/$file"

            if [ ! -s "$SOURCE" ]; then
              echo "::error::Missing file: $file"
              exit 1
            fi

            cp "$SOURCE" "$GITHUB_WORKSPACE/artifacts/"
          done

          ls -lh "$GITHUB_WORKSPACE/artifacts"

      - name: Upload Volt Trail V16
        uses: actions/upload-artifact@v4
        with:
          name: VoltTrail-PS1-V16-German-Quests
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
