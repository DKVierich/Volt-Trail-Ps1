        \      _v461_shared_paving.shader = V461_PAVING_SHADER\n    return _v461_shared_paving\n\n'''\ns=s.replace(marker,material_code+marker,1)\n\
        p.write_text(s,encoding='utf-8')\n\n# No changes to terrain height, city locations, path count or collision.\nassert\
