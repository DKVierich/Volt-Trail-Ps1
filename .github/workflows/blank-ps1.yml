
# LWOD FIX35R HD - nicht automatisch uebersetzen lassen!
name: LWOD FIX35R HD PS1
'on':
  workflow_dispatch:
    inputs:
      video_width:
        description: "PS1-Breite: 640 HD oder 320 stabil"
        type: choice
        required: true
        default: "640"
        options: ["640", "320"]
  push:
    branches: [main]
    paths: [.github/workflows/blank-ps1.yml]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LWOD_VIDEO_WIDTH: ${{ github.event.inputs.video_width || '640' }}
    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Werkzeuge installieren
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build unzip curl ffmpeg python3-pil python3-yaml

      - name: Originalschritte herunterladen und pruefen
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1
          curl -fLSs --retry 3 "$BASE/c8b67d5645df4cf58e5ff8cdc07f5b623c76db96/.github/workflows/blank-ps1.yml" -o "$RUNNER_TEMP/lwod32.yml"
          python3 - <<'PY'
          import hashlib, yaml, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          expected={'32':('34a7d142602d6fc5c48a682aeec5f0508e372c9a',64)}
          for v,(sha,n) in expected.items():
              data=(root/('lwod'+v+'.yml')).read_bytes()
              git=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert git==sha, 'FIX'+v+' unvollstaendig: '+git
              steps=yaml.safe_load(data)['jobs']['build']['steps']
              assert len(steps)==n, 'FIX'+v+' Anzahl Schritte falsch'
          print('Original FIX32 unveraendert und geprueft')
          PY
          cat > "$RUNNER_TEMP/lwod_run.py" <<'PYREPLAY'
          import sys,os,yaml,subprocess
          from pathlib import Path
          ver='32'
          idx=int(sys.argv[1])
          base=Path(os.environ['RUNNER_TEMP'])/'lwod32.yml'
          step=yaml.safe_load(base.read_bytes())['jobs']['build']['steps'][idx]
          print('FIX'+ver,idx,step['name'],flush=True)
          subprocess.run(['bash','-euo','pipefail','-c',step['run']],check=True)
          PYREPLAY

