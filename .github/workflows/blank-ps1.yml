      - {name: Basis 49, shell: bash, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 49'}
      - {name: Basis 50, shell: bash, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 50'}
      - {name: Basis 51, shell: bash, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 51'}
      - {name: Basis 52, shell: bash, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 52'}
      - {name: Basis 53, shell: bash, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 53'}
      - {name: Basis 54, shell: bash, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 54'}

      - name: Verfeinerte FIX33-Modelle anwenden
        shell: bash
        run: |
          python3 "$RUNNER_TEMP/lwod_fix40_step.py" 'FIX33 Geometrie verbessern'

      - name: FIX33 Grafikverifikation
        shell: bash
        run: |
          python3 "$RUNNER_TEMP/lwod_fix40_step.py" 'FIX33 pruefen'

      - name: Sichere Bildschirmaufteilung verifizieren
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_SCREEN'
          from pathlib import Path
          import re,os

          p=Path(os.environ['PROJECT_DIR'])/'src/main.c'
          s=p.read_text(encoding='utf-8')

          for symbol,value in [
              ('SCREEN_W','320'),
              ('SCREEN_H','240')
          ]:
              pattern=(
                  r'(?m)^\s*#\s*define\s+'
                  +symbol+r'\s+'+value+r'\b'
              )
              assert re.search(pattern,s), symbol+' falsch'

          assert 'LWOD_FIX33_GEOMETRY' in s, 'FIX33 Modelle fehlen'
          print('320x240 und FIX33 aktiv; kein 640er-Displaymodus')
          PY_SCREEN

      - name: PS1 Compiler installieren
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/lwod_run.py" 55
          grep -q '^PSN00BSDK_CMAKE=' "$GITHUB_ENV"

      - name: PS1 Spiel kompilieren
        shell: bash
        run: |
          set -euo pipefail
          : "${PSN00BSDK_CMAKE:?PS1 SDK Variable fehlt}"
          test -f "$PSN00BSDK_CMAKE"
          python3 "$RUNNER_TEMP/lwod_run.py" 56

      - name: Fehlerdiagnose hochladen
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: LWOD_FIX40_BUILD_LOG
          path: |
            artifacts/FIX25_BUILD_LOG.txt
            artifacts/FIX25_ERSTE_FEHLER.txt
          if-no-files-found: warn
          retention-days: 14

      - name: PS1 BIN und CUE erstellen
        shell: bash
        run: |
          set -euo pipefail
          for i in 58 59 60 61; do
            python3 "$RUNNER_TEMP/lwod_run.py" "$i"
          done

          folder="$RUNNER_TEMP/lydra_ps1_spiel"
          test -s "$folder/LWOD_FIX32.bin"
          test -s "$folder/LWOD_FIX32.cue"

          mv "$folder/LWOD_FIX32.bin" "$folder/LWOD_FIX40.bin"

          sed 's/LWOD_FIX32[.]bin/LWOD_FIX40.bin/g' \
            "$folder/LWOD_FIX32.cue" > "$folder/LWOD_FIX40.cue"

          rm "$folder/LWOD_FIX32.cue"
          grep -qi 'LWOD_FIX40.bin' "$folder/LWOD_FIX40.cue"

      - name: LWOD FIX40 herunterladen
        uses: actions/upload-artifact@v4
        with:
          name: LWOD_FIX40_STABIL
          path: ${{ runner.temp }}/lydra_ps1_spiel/
          if-no-files-found: error
          retention-days: 14
