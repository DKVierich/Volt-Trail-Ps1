        \ * vec4(VERTEX,1.0)).xz;\n}\nvoid fragment() {\n    vec2 tile = (use_world_space ? stone_world_uv : UV) / vec2(0.78,\
        \ 0.92);''',1)\nsh.write_text(shader,encoding='utf-8')\n\nmaterial_anchor='# FIX58: Wurzelheim-like path surface used\
        \ by every village and intercity road.'\nassert s.count(material_anchor)==1, 'FIX62: missing road renderer anchor'\n\
        world_material='''# FIX62: baked Wurzelheim and original road meshes have no path UVs.\nvar _v462_world_paving: ShaderMaterial\n\
        var _v462_road_lift: float = 0.0\n\nfunc _v462_paving_world() -> ShaderMaterial:\n    if _v462_world_paving == null:\n\
        \        _v462_world_paving = ShaderMaterial.new()\n        _v462_world_paving.shader = V461_PAVING_SHADER\n     \
        \   _v462_world_paving.set_shader_parameter(\"use_world_space\",true)\n    return _v462_world_paving\n\n'''\ns=s.replace(material_anchor,world_material+material_anchor,1)\n\
        \n# Raise only *new* connection and overlay surfaces above the old plain road\n# without affecting collision, original\
        \ geometry or the flight system.\nvertex='st.add_vertex(Vector3(p.x,_ground(p.x,p.y)+0.12,p.y))'\nassert s.count(vertex)>=2,'FIX62:\
        \ ground-road vertex anchor missing'\nrv=re.search(r'(?ms)^func _v456_road_vertex\\(.*?(?=^func |^static func |\\\
        Z)',s)\nassert rv and vertex in rv.group(), 'FIX62: active V456 road renderer not found'\nnew_rv=rv.group().replace(vertex,'st.add_vertex(Vector3(p.x,_ground(p.x,p.y)+0.12+_v462_road_lift,p.y))',1)\n\
        s=s[:rv.start()]+new_rv+s[rv.end():]\n\n# Wurzelheim has a distinct baked single-mesh ground network, so the shared\n\
