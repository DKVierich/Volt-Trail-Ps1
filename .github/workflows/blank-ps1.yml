        """
        b=lzma.decompress(base64.b64decode(''.join(payload.split()),validate=True))
        nv,nf,ne=struct.unpack_from('<III',b)
        assert (nv,nf,ne)==(5290,10244,334)
        pos=12
        cols=[]
        for j in range(6):
            fmt='h' if j<3 else 'b'
            size=struct.calcsize('<'+fmt)*nv
            delta=struct.unpack_from('<'+str(nv)+fmt,b,pos); pos+=size
            acc=0; col=[]
            for d in delta:
                acc+=d; col.append(acc)
            cols.append(col)
        # 16-bit differences of indices are restored independently of the vertices.
        n=nf*3+ne*2
        indices=[]; acc=0
        for d in struct.unpack_from('<'+str(n)+'h',b,pos):
            acc+=d; indices.append(acc)
        assert pos+n*2==len(b)
        raw=b[:12]+b''.join(struct.pack('<HHHBBB',*v) for v in zip(*cols))+struct.pack('<'+str(n)+'H',*indices)
        assert len(raw)==110422
        assert hashlib.sha256(raw).hexdigest()=='a44b12e9bc27689d6e79fdd476d83d1ab5bd8c779c9aee87596739cdfddb931f', 'FIX9 Mesh-Daten stimmen nicht'
        encoded=base64.b64encode(gzip.compress(raw,mtime=0)).decode()
        script='extends RefCounted\nconst PAYLOAD: String = "'+encoded+'"\n\nstatic func bytes() -> PackedByteArray:\n    return Marshalls.base64_to_raw(PAYLOAD).decompress_dynamic(110422, FileAccess.COMPRESSION_GZIP)\n'
        p=Path('android/scripts/V417MountainReliefData.gd');p.write_text(script,encoding='utf-8')
        print('FIX9_MESH_OK: 5290 vertices, 10244 faces, 334 boundary edges')

        import json
        patches=json.loads(gzip.decompress(base64.b64decode('',validate=True)))
        for name,(before,after,ops) in patches.items():
            p=Path(name); old=p.read_bytes()
            assert hashlib.sha256(old).hexdigest()==before, name
            rows=old.decode().splitlines(keepends=True)
            for start,end,replacement in reversed(ops):
                rows[start:end]=replacement
            result=''.join(rows).encode()
            assert hashlib.sha256(result).hexdigest()==after, name
            p.write_bytes(result)
        print('FIX9_MODEL_SCRIPTS_OK')
        PYMESH9
