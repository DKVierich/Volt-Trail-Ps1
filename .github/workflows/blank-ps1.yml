            vt_v3188_tile(107,162,3,3,48,193,245);
            vt_v3188_tile(210,162,3,3,48,193,245);
            vt_v3188_tile(107,198,3,3,48,193,245);
            vt_v3188_tile(210,198,3,3,48,193,245);

