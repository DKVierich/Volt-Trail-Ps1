        \        raise SystemExit('FEHLER: Variable nicht vor vt_v314_input deklariert: ' + decl)\nfor marker in\
        \ ('vt_v318_frame_rgb555(current)', 'vt_load_game(void)',\n               'vt_v3182_menu_8bpp[38400]', 'vt_v3182_clut[256]'):\n\
