              vt_v24_ground_patch(-720, 40, 90, 16, 12, 34, 108, 58, 26, 92, 48);
              vt_v24_ground_patch(-480, 1120, 120, 8, 4, 38, 98, 64, 30, 88, 54);

              /* Main road through the region. */
              for (z = 60; z <= 760; z += 70) {
                  int width = 84 + (z / 24);
                  vt_v24_path_band(z, width, 118, 91, 60);
              }

              /* Distant mountains and horizon landmarks. */
              for (i = -3; i <= 3; i++) {
                  vt_v24_peak(i * 210, 760 + (i & 1) * 70,
                              110 + (i & 1) * 30,
                              140 + (i + 3) * 8,
