        python3 - <<'PY_DIAG'
        from pathlib import Path
        import re
        out=Path('build/diagnose/Steuerung_Kandidaten.txt')
        keys=re.compile(r'joystick|touch|drag|deadzone|input|velocity|walk|move|smoothing|lerp|hero',re.I)
        scripts=sorted(Path('android/scripts').glob('*.gd'))
        with out.open('w',encoding='utf-8') as f:
            f.write('LWOD V41.5 control/renderer audit (no runtime movement code edited)\n')
            f.write('Files: '+str(len(scripts))+'\n\n')
            for p in scripts:
                lines=p.read_text(encoding='utf-8',errors='replace').splitlines()
                matches=[(i+1,s.strip()) for i,s in enumerate(lines) if keys.search(s)]
                if matches:
                    f.write('### '+str(p)+'\n')
                    for i,s in matches[:140]:
                        f.write(f'{i}: {s[:220]}\n')
                    if len(matches)>140: f.write(f'...more matches: {len(matches)-140}\n')
                    f.write('\n')
        print('V4150_DIAG_OK:',out)
        PY_DIAG
        cp android/project.godot build/diagnose/project.godot
    - name: NPCs und Markt-Kollisionen testen
      shell: bash
      run: |
        set -euo pipefail
        for script in V4093CharacterSmoke.gd V4092Fix5MotionMarketSmoke.gd; do
          timeout --signal=TERM --kill-after=5s 100s \
            godot --headless --path android --quit-after 300 --script "res://tests/$script" \
            2>&1 | tee "/tmp/$script.log"
          if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Invalid call|Failed to load script' "/tmp/$script.log"; then
            exit 1
          fi
        done
        echo 'NPC_TESTS_OK'
