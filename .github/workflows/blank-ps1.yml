        python3 -m py_compile /tmp/LWOD_FIX13.py
        python3 /tmp/LWOD_FIX13.py
        mkdir -p android/tests
        cat > android/tests/V417Fix13Smoke.gd <<'GDFIX13'
        extends SceneTree
        const SkyScript = preload("res://scripts/V26SkyWorldMap.gd")
        const Landmarks = preload("res://scripts/V417Landmarks.gd")
        const T = preload("res://scripts/V417Territories.gd")

        func _initialize() -> void:
            call_deferred("_run")

        func fail(message: String) -> void:
            push_error("FIX13: " + message)
            quit(1)

        func _run() -> void:
            var g := Node3D.new()
            root.add_child(g)
            var camera := Camera3D.new()
            g.add_child(camera)
            camera.far = 35000.0
            camera.make_current()
            var sky := SkyScript.new()
            g.add_child(sky)
            sky.game = g
            # Use the real sky creation and day/night update, not mock spheres.
            sky.call("_build_sky")
            camera.global_position = Vector3(16800.0, 65.0, 826.0)
            for i in range(48):
                sky.day_clock = float(i)/48.0
                sky.call("_apply_day_night")
                for body in [sky.sun_node,sky.moon_node]:
                    var mesh_body: MeshInstance3D = body as MeshInstance3D
                    var dist: float = mesh_body.global_position.distance_to(camera.global_position)
                    var radius: float = mesh_body.scale.x * mesh_body.mesh.get_aabb().size.x * 0.5
                    if absf(dist-32000.0) > 0.3 or dist-radius < 29700.0 or dist+radius >= camera.far:
                        fail("celestial geometry intersects map or far clip")
                        return
                    var material: StandardMaterial3D = mesh_body.material_override as StandardMaterial3D
                    if material == null or material.no_depth_test:
                        fail("mountain depth test disabled")
                        return
                var before: Vector3 = sky.sun_node.global_position
                camera.rotate_y(0.21)
                sky.call("_apply_day_night")
                if sky.sun_node.global_position.distance_to(before) > 0.1:
                    fail("sun follows camera rotation")
                    return
            sky.day_clock = 0.05
            sky.call("_apply_day_night")
            if sky.sun_node.global_position.x <= camera.global_position.x or not sky.sun_node.visible:
                fail("sunrise no longer east")
                return
            sky.day_clock = 0.45
            sky.call("_apply_day_night")
            if sky.sun_node.global_position.x >= camera.global_position.x or not sky.sun_node.visible:
                fail("sunset no longer west")
                return
            var landscape := Landmarks.new()
            g.add_child(landscape)
            var center: Vector2 = T.city_world("Aschefurt")
            var volcano: Node3D = landscape.call("_create", "Aschefurt",center) as Node3D
            var peaks: int = 0
            var lava: int = 0
            for item in volcano.get_children():
                var obj: MeshInstance3D = item as MeshInstance3D
                if obj == null:
                    fail("unexpected remnant in volcano")
                    return
                var mat: StandardMaterial3D = obj.material_override as StandardMaterial3D
                if mat == null:
                    fail("missing volcanic material")
                    return
                if obj.mesh is CylinderMesh:
                    peaks += 1
                elif obj.mesh is BoxMesh and mat.albedo_color.is_equal_approx(Color("#b24f31")):
                    lava += 1
                else:
                    fail("obsolete water, bridge or other slab at Aschefurt")
                    return
            if peaks != 18 or lava != 7:
                fail("volcanic formations or lava missing")
                return
            if center.distance_to(Vector2(16800,826)) > 0.01:
                fail("Aschefurt position changed")
                return
            # FIX17: FIX16 intentionally replaced 14 routes with 10 unique roads.
            # The separate FIX16 smoke test checks connectivity, crossings and gates.
            if T.ROUTES.size() != 10:
                fail("expected 10 intercity roads after FIX16")
                return
            print("V417_FIX13_OK: 48 sky phases, camera rotation, depth test, volcano peaks and lava, no legacy river or slabs")
            quit(0)
        GDFIX13
