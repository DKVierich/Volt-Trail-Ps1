    - name: FIX62 Android APK exportieren und pruefen
      run: "set -euo pipefail\nmkdir -p build/android build/diagnose\nAPK=\"$GITHUB_WORKSPACE/build/android/LWOD-Android-V41.7-FIX62.apk\"\
        \nrm -f \"$APK\"\ntimeout --signal=TERM --kill-after=5s 900s godot --headless --path android --export-debug Android\
        \ \"$APK\" 2>&1 | tee build/diagnose/FIX62_APK_Export.log\nif grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load\
        \ script' build/diagnose/FIX62_APK_Export.log; then\n  exit 1\nfi\ntest -s \"$APK\"\nunzip -t \"$APK\" >/dev/null\n\
        unzip -Z1 \"$APK\" | grep -Fx 'AndroidManifest.xml' >/dev/null\nls -lh \"$APK\"\nsha256sum \"$APK\"\n"
      shell: bash
    - id: apk_upload
      name: FIX62 APK als Download hochladen
      uses: actions/upload-artifact@v4
      with:
        compression-level: 0
        if-no-files-found: error
        name: LWOD_ANDROID_V41_7_FIX62_APK
        path: build/android/LWOD-Android-V41.7-FIX62.apk
        retention-days: 14
    - env:
        APK_ARTIFACT_ID: ${{ steps.apk_upload.outputs.artifact-id }}
        APK_ARTIFACT_URL: ${{ steps.apk_upload.outputs.artifact-url }}
      name: Erfolgreichen APK Upload bestaetigen
      run: 'set -euo pipefail

        test -n "$APK_ARTIFACT_ID"

        test -n "$APK_ARTIFACT_URL"

        printf ''### Android APK Download\n\n[FIX62 APK herunterladen](%s)\n'' "$APK_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

        '
      shell: bash
    - if: always()
      name: FIX62 Testprotokolle hochladen
      uses: actions/upload-artifact@v4
      with:
        if-no-files-found: warn
        name: LWOD_FIX62_TESTPROTOKOLLE
        path: build/diagnose
        retention-days: 14
