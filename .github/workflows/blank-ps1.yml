      - {name: Basis 42, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 42'}
      - {name: Basis 43, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 43'}
      - {name: Basis 44, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 44'}
      - {name: Basis 45, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 45'}
      - {name: Basis 46, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 46'}
      - {name: Basis 47, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 47'}
      - {name: Basis 48, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 48'}
      - {name: Basis 49, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 49'}
      - {name: Basis 50, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 50'}
