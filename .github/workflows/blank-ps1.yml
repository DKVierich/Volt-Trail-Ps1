    - name: Video-Szenen als voll deckende PS1-Bilder umwandeln
      shell: bash
      run: "set -euo pipefail\ncat > \"$RUNNER_TEMP/make_intro_frames.py\" <<'LYDRA_GEN_PY'\n#!/usr/bin/env python3\nimport\
        \ os,base64,struct\nfrom pathlib import Path\nfrom PIL import Image\nhome=Path(os.environ['RUNNER_TEMP'])/'lydra_new_menu'\n\
        images=[]\nfor i in range(8):\n    p=home/f'frame_{i}.jpg'\n    if not p.exists():raise RuntimeError('Frame missing:\
        \ '+str(p))\n    with Image.open(p) as img:\n        img=img.convert('RGB')\n        if img.size!=(160,120):raise\
        \ RuntimeError('Frame size mismatch '+str(img.size))\n        # PS1 treats RGB555 color 0x0000 as transparent, even\
        \ for opaque polygons.\n        # 0x8000 represents truly opaque black when setSemiTrans(q,0).\n        # Change ONLY\
        \ zero pixels: preserve all other source-video colors.\n        colors=[]\n        for r,g,b in img.getdata():\n \
        \           value=((b>>3)<<10)|((g>>3)<<5)|(r>>3)\n            colors.append(value if value else 0x8000)\n       \
        \ assert 0 not in colors, 'Transparent pixel left in title texture'\n    images.append(colors)\nlines=['/* Frames\
        \ captured from user-provided 38942.mp4, resized for PS1. */',\n       '#ifndef LYDRA_V314_FRAMES_H','#define LYDRA_V314_FRAMES_H']\n\
        for i,colors in enumerate(images):\n    lines.append('static const unsigned short vt_v314_image_%d[19200] __attribute__((aligned(4)))\
        \ = {'%i)\n    for j in range(0,len(colors),16):\n        lines.append(' '+','.join('0x%04x'%v for v in colors[j:j+16])+',')\n\
        \    lines.append('};')\nlines.append('static const unsigned short *const vt_v314_images[8] = {')\nlines.append(','.join('vt_v314_image_%d'%i\
        \ for i in range(8))+'};')\nlines.append('#endif')\nsrc=Path(os.environ['PROJECT_DIR'])/'src'\nassert (src/'main.c').exists()\n\
        p=src/'lydra_v314_frames.h'\np.write_text('\\n'.join(lines)+'\\n',encoding='utf-8')\nif p.stat().st_size<750_000:raise\
        \ RuntimeError('Generated header truncated')\nprint('User video frames installed:',p,p.stat().st_size)\nLYDRA_GEN_PY\n\
        python3 \"$RUNNER_TEMP/make_intro_frames.py\"\n"
