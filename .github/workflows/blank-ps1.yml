                    elif c=='/' and n=='*':state='block';i+=1
                    elif c=='"':state='str'
                    elif c=="'":state='chr'
                    elif c=='{':depth+=1
                    elif c=='}':depth-=1
                elif state=='line':
                    if c=='\n':state='code'
                elif state=='block':
                    if c=='*' and n=='/':state='code';i+=1
                else:
