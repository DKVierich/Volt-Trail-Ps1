
name: Build Volt Trail PS1 V18 Dragon Fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build unzip curl jq tar \
            ffmpeg python3-pil python3-yaml

      - name: Load original V18 build
        shell: bash
        run: |
          set -euo pipefail

          V18_COMMIT="3c8af158a543c87b33cb09e6e7cac25cc2f597da"

          curl --retry 3 -fsSL \
            "https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/$V18_COMMIT/.github/workflows/blank-ps1.yml" \
            -o "$RUNNER_TEMP/v18-original.yml"

          cat > "$RUNNER_TEMP/run_v18_step.py" <<'PY'
          import os
          import sys
          import subprocess
          from pathlib import Path

          import yaml

          workflow = (
              Path(os.environ["RUNNER_TEMP"])
              / "v18-original.yml"
          )

          data = yaml.safe_load(
              workflow.read_text(encoding="utf-8")
          )

          steps = data["jobs"]["build"]["steps"]

          wanted = sys.argv[1]

          matches = [
              step for step in steps
              if step.get("name") == wanted
          ]

          if len(matches) != 1:
              raise RuntimeError(
                  "V18 build step not found: " + wanted
              )

          print("Running:", wanted, flush=True)

          subprocess.run(
              [
                  "bash",
                  "-euo",
                  "pipefail",
                  "-c",
                  matches[0]["run"]
              ],
              env=os.environ.copy(),
              check=True
          )
          PY

          python3 "$RUNNER_TEMP/run_v18_step.py" \
            "Load working V17 controller fix"

      - name: Prepare game project
        shell: bash
        run: |
          set -euo pipefail

          python3 "$RUNNER_TEMP/run_v18_step.py" \
            "Prepare game project"

      - name: Restore V17 intro and gameplay
        shell: bash
        run: |
          set -euo pipefail

          python3 "$RUNNER_TEMP/run_v18_step.py" \
            "Restore V17 game intro and menu"

      - name: Restore V18 dragons and graphics
        shell: bash
        run: |
          set -euo pipefail

          python3 "$RUNNER_TEMP/run_v18_step.py" \
            "Apply V18 dragon models and UI"

      - name: Repair V18 battle menu compiler error
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path

          source = (
              Path(os.environ["PROJECT_DIR"])
              / "src"
              / "main.c"
          )

          code = source.read_text(
              encoding="utf-8"
          )

          # The battle HP-bar renderer appears
          # before the main-menu state variable
          # is defined in the original V17 code.
          #
          # Add a forward declaration.
          # The existing initialized definition
          # stays in place.

          marker = (
              "static void "
              "vt_v18_battle_bars(void) {"
          )

          declaration = (
              "static int vt_menu_open;\n\n"
              + marker
          )

          if code.count(marker) != 1:
              raise RuntimeError(
                  "V18 battle renderer not found "
                  "exactly once"
              )

          if code.count(
              "static int vt_menu_open = 0;"
          ) != 1:
              raise RuntimeError(
                  "Original menu state missing"
              )

          code = code.replace(
              marker,
              declaration,
              1
          )

          # Confirm that important V18
          # features remain present.
          required = [
              "VOLT TRAIL V18",
              "vt_dragon_wing(",
              "vt_dragon_sparks(",
              "vt_v18_battle_bars();",
              "vt_menu_open",
              "vt_menu_choice",
              "vt_save_game(void)",
              "vt_load_game(void)",
              "InitCARD(1);",
              "PAD_CROSS",
              "PAD_SQUARE",
              "PAD_CIRCLE",
              "PAD_TRIANGLE",
              "PAD_START",
              "vt_play_intro();"
          ]

          for feature in required:
              if feature not in code:
                  raise RuntimeError(
                      "Required feature missing: "
                      + feature
                  )

          source.write_text(
              code,
              encoding="utf-8"
          )

          print("V18 COMPILER FIX APPLIED")
          print("Forward declaration added")
          print("Dragon models preserved")
          print("Battle HP bars preserved")
          print("Main menu preserved")
          print("Memory Card functions preserved")
          print("Controller fix preserved")
          PY

      - name: Install PSn00bSDK
        shell: bash
        run: |
          set -euo pipefail

          python3 "$RUNNER_TEMP/run_v18_step.py" \
            "Install PSn00bSDK"

      - name: Build Volt Trail V18 Fixed
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            -S "$PROJECT_DIR" \
            -B "$GITHUB_WORKSPACE/build" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PSN00BSDK_CMAKE" \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build \
            "$GITHUB_WORKSPACE/build" \
            --verbose

      - name: Collect PS1 game files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          for file in \
            VTRAIL.bin \
            VTRAIL.cue \
            VTRAIL.exe \
            VTRAIL.elf
          do
            SOURCE="$GITHUB_WORKSPACE/build/$file"

            if [ ! -s "$SOURCE" ]; then
              echo "::error::Missing file: $file"
              exit 1
            fi

            cp "$SOURCE" \
              "$GITHUB_WORKSPACE/artifacts/"
          done

          ls -lh "$GITHUB_WORKSPACE/artifacts"

      - name: Upload Volt Trail V18 Fixed
        uses: actions/upload-artifact@v4
        with:
          name: VoltTrail-PS1-V18-Dragon-Fix
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
