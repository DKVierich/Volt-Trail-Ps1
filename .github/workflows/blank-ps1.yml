        \        ring.append(centre+Vector2(sin(a),cos(a))*21.7)\n    _make_path(root,ring,8.2,Color(\"#bca27c\"))\n    #\
        \ Preserve the two authentic historical gate directions/positions.\n    for gate in V417Territories.gate_names(\"\
        Sonnental\"):\n        var d: Vector2 = V417Territories.gate_direction(\"Sonnental\",gate)\n        var route := PackedVector2Array([\n\
        \            centre+d*7.8,\n            centre+d*23.0,\n            centre+d*46.0\n        ])\n        _make_path(root,route,7.6,Color(\"\
        #bca27c\"))\n    # Paved centre between the old circular plaza and the fountain.\n    var centre_ring := PackedVector2Array()\n\
        \    for j in range(41):\n        var a: float = TAU*float(j)/40.0\n        centre_ring.append(centre+Vector2(sin(a),cos(a))*9.5)\n\
        \    _make_path(root,centre_ring,7.0,Color(\"#b6a28b\"))\n    _v462_road_lift = 0.0\n\n'''\nmarker='# FIX58: Wurzelheim-like\
        \ path surface used by every village and intercity road.'\nassert s.count(marker)==1\ns=s.replace(marker,extra+marker,1)\n\
        \n# Install Sonnental paving every time the long-distance road network is built.\n# Not in _process() -- no additional\
        \ frame cost.\nbuilder=re.search(r'(?ms)^func _build_long_distance_roads\\(.*?(?=^func |^static func |^const |^var\
        \ |\\Z)',s)\nassert builder and '_make_path(network,' in builder.group(),'FIX62: intercity builder changed'\nassert\
        \ '_v462_pave_sonnental()' not in builder.group()\nb=s[builder.start():builder.end()]\nb=b.rstrip()+'''\\n    _v462_pave_sonnental()\\\
        n\\n'''\ns=s[:builder.start()]+b+s[builder.end():]\n\nassert s.count('func _v431_ground_paths(')==1\nassert s.count('path.material_override\
        \ = _v462_paving_world()')==1\nassert s.count('func _create_town_paths(')==1\nassert s.count('_v462_restore_inner_roads(root,centre,city)')==1\n\
        assert s.count('func _v462_pave_sonnental()')==1\nassert s.count('    _v462_pave_sonnental()')==1\nassert s.count('func\
        \ _make_path(')==1\np.write_text(s,encoding='utf-8')\n\ncfg=Path('android/export_presets.cfg')\nt=cfg.read_text(encoding='utf-8')\n\
        assert t.count('version/code=4231')==1 and t.count('version/name=\"4.1.7.61\"')==1\ncfg.write_text(t.replace('version/code=4231','version/code=4232',1).replace('version/name=\"\
        4.1.7.61\"','version/name=\"4.1.7.62\"',1),encoding='utf-8')\n\nsmoke=Path('android/tests/V462AllRoadsSmoke.gd')\n\
        smoke.write_text('''extends SceneTree\nconst Roads = preload(\"res://scripts/V408Regions.gd\")\n\nfunc _initialize()\
        \ -> void:\n    call_deferred(\"_run\")\n\nfunc _fail(message: String) -> void:\n    push_error(\"FIX62: \" + message)\n\
        \    quit(1)\n\nfunc _run() -> void:\n    var regions := Roads.new()\n    root.add_child(regions)\n    var material:\
        \ ShaderMaterial = regions._v462_paving_world()\n    if material == null or material.shader == null:\n        _fail(\"\
