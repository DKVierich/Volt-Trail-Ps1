        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 240s godot --headless --editor --path android --import 2>&1 | tee /tmp/lwod4130_import.log
          if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to import|Error importing' /tmp/lwod4130_import.log; then
            echo 'GLB-IMPORTFEHLER'; exit 1
          fi
          for file in LWOD_Heldin_V4130.glb LWOD_Phoenix_Violett_V4130.glb; do
            test -s "android/assets/characters/$file"
          done
          echo V4130_IMPORT_OK
      - name: V41.3 Skinning, Animation und Einbindung testen
        shell: bash
        run: |
          set -euo pipefail
          cat > android/tests/V4130RigSmoke.gd <<'GD_V4130_TEST'
          extends SceneTree
          class TestGame:
              extends Node3D
              var hero: Node3D
              var phoenix: Node3D

          func _initialize() -> void:
              call_deferred("_run")

          func _find_rig(n: Node) -> Skeleton3D:
              if n is Skeleton3D:
                  return n as Skeleton3D
              for c in n.get_children():
                  var rig: Skeleton3D = _find_rig(c)
                  if rig != null: return rig
              return null

          func _find_anim(n: Node) -> AnimationPlayer:
              if n is AnimationPlayer:
                  return n as AnimationPlayer
              for c in n.get_children():
                  var a: AnimationPlayer = _find_anim(c)
                  if a != null: return a
              return null

          func _contains_clip(player: AnimationPlayer, text: String) -> bool:
              if player == null: return false
              for key in player.get_animation_list():
                  if String(key).to_lower().contains(text.to_lower()):return true
              return false

          func _run() -> void:
              var paths: Array[String] = ["res://assets/characters/LWOD_Heldin_V4130.glb", "res://assets/characters/LWOD_Phoenix_Violett_V4130.glb"]
              for path in paths:
                  var res: PackedScene = load(path) as PackedScene
                  if res == null:
                      push_error("V4130: GLB nicht importierbar: " + path)
                      quit(1)
                      return
                  var inst: Node = res.instantiate()
                  root.add_child(inst)
                  var skel: Skeleton3D = _find_rig(inst)
                  var anim: AnimationPlayer = _find_anim(inst)
                  if skel == null or anim == null or skel.get_bone_count() < 9:
                      push_error("V4130: Echte Knochen oder AnimationPlayer fehlen: " + path)
                      quit(2)
                      return
                  if path.contains("Heldin"):
                      if not _contains_clip(anim,"Idle") or not _contains_clip(anim,"Walk"):
                          push_error("V4130: Idle und Walk fehlen")
                          quit(3)
                          return
                  else:
                      if not _contains_clip(anim,"Flap") or not _contains_clip(anim,"Glide"):
                          push_error("V4130: Flap und Glide fehlen")
                          quit(4)
                          return
                  # Check that skinned joints actually move when animation advances.
                  var bone_name: String = "LeftLeg" if path.contains("Heldin") else "WingL"
                  var clip_name: String = "Walk" if path.contains("Heldin") else "Flap"
                  var bone_index: int = skel.find_bone(bone_name)
                  if bone_index < 0:
                      push_error("V4130: Animierter Knochen fehlt: " + bone_name)
                      quit(7)
                      return
                  var matching_clip: String = ""
                  for c in anim.get_animation_list():
                      if String(c).to_lower().contains(clip_name.to_lower()):
                          matching_clip = String(c)
                          break
                  if matching_clip.is_empty():
                      push_error("V4130: Clip nicht gefunden: " + clip_name)
                      quit(8)
                      return
                  anim.play(matching_clip)
                  anim.advance(0.22)
                  var pose_a: Quaternion = skel.get_bone_pose_rotation(bone_index)
                  anim.advance(0.41)
                  var pose_b: Quaternion = skel.get_bone_pose_rotation(bone_index)
                  if pose_a.angle_to(pose_b) < 0.025:
                      push_error("V4130: Knochen bewegt sich nicht: " + bone_name)
                      quit(9)
                      return
                  inst.queue_free()
              var g := TestGame.new()
              root.add_child(g)
              g.hero = Node3D.new()
              g.phoenix = Node3D.new()
              g.add_child(g.hero)
              g.add_child(g.phoenix)
              var loader: Script = load("res://scripts/V4094HeroPhoenix.gd") as Script
              if loader == null or not loader.can_instantiate():
                  push_error("V4130: Ladeskript nicht gültig")
                  quit(5)
                  return
              var helper: Node = loader.new()
              g.add_child(helper)
              helper.call("setup",g)
              helper.call("_bind_characters")
              var hv: Node3D = g.hero.get_node_or_null("LWOD_V4094_HeroVisual") as Node3D
              var pv: Node3D = g.phoenix.get_node_or_null("LWOD_V4094_PhoenixVisual") as Node3D
              if hv == null or pv == null or not hv.has_meta("lwod_v4130_hero") or not pv.has_meta("lwod_v4130_unique_phoenix"):
                  push_error("V4130: Figuren wurden im Spiel nicht eingebunden")
                  quit(6)
                  return
              helper.call("_process",0.08)
              print("V4130_SKINNED_CHARACTER_OK: 15 und 10 Knochen, 4 Clips, echte Pose-Bewegung")
              quit(0)
          GD_V4130_TEST
          timeout --signal=TERM --kill-after=5s 115s godot --headless --path android --quit-after 250 --script res://tests/V4130RigSmoke.gd 2>&1 | tee /tmp/lwod4100_rig.log
          if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Invalid call|Failed to load script|ERROR: Cannot load' /tmp/lwod4100_rig.log; then
            exit 1
          fi
          grep -Fq 'V4130_SKINNED_CHARACTER_OK:' /tmp/lwod4100_rig.log
      - name: NPCs und Markt-Kollisionen testen
        shell: bash
        run: |
          set -euo pipefail
          for script in V4093CharacterSmoke.gd V4092Fix5MotionMarketSmoke.gd; do
            timeout --signal=TERM --kill-after=5s 100s \
              godot --headless --path android --quit-after 300 --script "res://tests/$script" \
              2>&1 | tee "/tmp/$script.log"
            if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Invalid call|Failed to load script' "/tmp/$script.log"; then
              exit 1
            fi
          done
          echo 'NPC_TESTS_OK'
      - name: V41.3 APK bauen und pruefen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android
          APK="$GITHUB_WORKSPACE/build/android/LWOD-Android-V41.3.apk"
          timeout --signal=TERM --kill-after=5s 900s godot --headless --path android --export-debug Android "$APK" 2>&1 | tee /tmp/lwod4130_export.log
          if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script' /tmp/lwod4130_export.log; then
            exit 1
          fi
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          ls -lh "$APK"
      - name: Fertige APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: LWOD_ANDROID_V41_3_APK
          path: build/android/LWOD-Android-V41.3.apk
          if-no-files-found: error
          retention-days: 14
