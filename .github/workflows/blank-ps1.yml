      - name: FIX23 Android APK exportieren und pruefen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android build/diagnose
          APK="$GITHUB_WORKSPACE/build/android/LWOD-Android-V41.7-FIX23.apk"
          rm -f "$APK"
          timeout --signal=TERM --kill-after=5s 900s godot --headless --path android --export-debug Android "$APK" 2>&1 | tee build/diagnose/FIX23_APK_Export.log
          if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script' build/diagnose/FIX23_APK_Export.log; then
            exit 1
          fi
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -Z1 "$APK" | grep -Fx 'AndroidManifest.xml' >/dev/null
          ls -lh "$APK"
          sha256sum "$APK"
