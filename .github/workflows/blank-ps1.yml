    - name: V36 FIX1 Kameratest nach Kameraupdate messen
      shell: bash
      run: "set -euo pipefail\ntest -s android/tests/V34TouchSmoke.gd\ntest \"$(grep -Fxc '    var actual_look: float = (-cam.global_basis.z).y' android/tests/V34TouchSmoke.gd)\" -eq 1\n# SceneTree.process_frame wird VOR Node._process gesendet.\n# Deshalb in der Testszene die reale Kameramethode einmal direkt anwenden,\n# bevor die Kamerarichtung gemessen wird. Keine Spielfunktionen veraendern.\nsed -i '/^    var actual_look: float = (-cam.global_basis.z).y$/i\\    ctrl.call(\"_update_camera\", 1.0 / 60.0)' android/tests/V34TouchSmoke.gd\ntest \"$(grep -Fxc '    ctrl.call(\"_update_camera\", 1.0 / 60.0)' android/tests/V34TouchSmoke.gd)\" -eq 1\ngodot --headless --path android --script res://tests/V34TouchSmoke.gd > \"$RUNNER_TEMP/lwod_v36_fix1_touch.log\" 2>&1 || {\n  cat \"$RUNNER_TEMP/lwod_v36_fix1_touch.log\"\n  exit 1\n}\ncat \"$RUNNER_TEMP/lwod_v36_fix1_touch.log\"\ngrep -Fq 'V34_TEST_OK:' \"$RUNNER_TEMP/lwod_v36_fix1_touch.log\"\n"
