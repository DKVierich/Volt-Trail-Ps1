                vt_pyramid(x,-1-bounce/3,z-38,8,22,236,136,41);
                draw_box(x-12,15,z+13,6,201,128,38);
                draw_box(x+12,15,z+13,6,201,128,38);
                /* Colorful triangular membranes, visibly dragon-like in the PS1 silhouette. */
                a=(SVECTOR){(short)(x-11-px),(short)(-22-bounce/3),(short)(z-pz),0};
