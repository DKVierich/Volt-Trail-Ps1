# Lydra World Of Dragon - FIX39 STABIL
# Intro + Hauptmenü schärfer, Menüfenster bereinigt
# NICHT automatisch übersetzen lassen

name: LWOD FIX39 STABIL - Intro Menu HD

'on':
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - .github/workflows/blank-ps1.yml

permissions:
  contents: read

jobs:
  build:
    name: LWOD FIX39 erstellen
    runs-on: ubuntu-latest

    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Werkzeuge installieren
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build unzip curl ffmpeg python3-pil python3-yaml

      - name: FIX36 Referenz laden
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --location --silent --show-error --retry 3 \
            'https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/efb8cdbb05262caf1a714bae16fccaa5984b719a/.github/workflows/blank-ps1.yml' \
            -o "$RUNNER_TEMP/fix36.yml"

          python3 - <<'PY_VERIFY'
          from pathlib import Path
          import os, hashlib, yaml, textwrap

          root = Path(os.environ['RUNNER_TEMP'])
          source = root / 'fix36.yml'
          raw = source.read_bytes()

          blob = hashlib.sha1(
              b'blob ' + str(len(raw)).encode() + b'\0' + raw
          ).hexdigest()

          expected = '3f40dc4623f5fe438329b12c33e8453c9177e1f0'
          if blob != expected:
              raise SystemExit('FIX36 Referenz unvollstaendig oder veraendert')

          steps = yaml.safe_load(raw)['jobs']['build']['steps']
          if len(steps) != 68:
              raise SystemExit('FIX36 Schrittzahl unerwartet: ' + str(len(steps)))

          script = """
          import os, sys, yaml, subprocess
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "fix36.yml"
          steps = yaml.safe_load(path.read_bytes())["jobs"]["build"]["steps"]

          step_name = sys.argv[1]
          found = [
              x for x in steps
              if x.get("name") == step_name and isinstance(x.get("run"), str)
          ]

          if len(found) != 1:
              raise SystemExit("FIX36 Schritt fehlt oder mehrfach: " + step_name)

          subprocess.run(
              ["bash", "-euo", "pipefail", "-c", found[0]["run"]],
              check=True
          )
          """
          (root / 'fix39_step.py').write_text(
              textwrap.dedent(script),
              encoding='utf-8'
          )
          print('FIX39: Referenz und Replay-Datei bereit')
          PY_VERIFY

      - name: FIX35R Vorbereitung wiederherstellen
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/fix39_step.py" 'FIX35R-Patch aus festem GitHub-Stand laden'
          test -s "$RUNNER_TEMP/lwod_fix36_replay.py"
          echo "FIX39: Fehlende Vorbereitungsdatei wurde erzeugt."

      - name: FIX32 Basis vorbereiten
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/fix39_step.py" 'FIX32 Basis vorbereiten'
          test -s "$RUNNER_TEMP/lwod_run.py"
          echo "FIX39: Basis erfolgreich vorbereitet."

      - name: Originalbasis 03 bis 54 ausführen
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 3 54); do
            python3 "$RUNNER_TEMP/lwod_run.py" "$i"
          done
          echo "FIX39: Basis 03-54 abgeschlossen."

      - name: FIX33 3D-Modelle laden
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/fix39_step.py" 'FIX33 Geometrie verbessern'

      - name: FIX33 Grafik prüfen
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/fix39_step.py" 'FIX33 pruefen'

      - name: Intro und Hauptmenü erheblich schärfer machen
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_UI_HD'
          from pathlib import Path
          from PIL import Image, ImageFilter, ImageOps, ImageDraw
          import os

          project = Path(os.environ['PROJECT_DIR'])

          exts = {'.png', '.bmp', '.jpg', '.jpeg'}
          files = [
              p for p in project.rglob('*')
              if p.is_file() and p.suffix.lower() in exts
          ]

          def score(path, keys):
              name = path.name.lower()
              full = str(path).lower()
              s = 0
              for k in keys:
                  if k in name:
                      s += 8
                  if k in full:
                      s += 3
              return s

          def sharpen_and_upscale(path):
              try:
                  img = Image.open(path).convert('RGBA')
              except Exception:
                  return False

              w, h = img.size
              if w < 2 or h < 2:
                  return False

              backup = path.with_suffix(path.suffix + '.fix39bak')
              if not backup.exists():
                  backup.write_bytes(path.read_bytes())

              img = ImageOps.autocontrast(img.convert('RGB')).convert('RGBA')
              img = img.resize((w * 2, h * 2), Image.LANCZOS)
              img = img.filter(ImageFilter.UnsharpMask(radius=2.2, percent=220, threshold=2))
              img.save(path)
              print('Geschaerft:', path)
              return True

          def make_clean_panel(path):
              try:
                  img = Image.open(path).convert('RGBA')
              except Exception:
                  return False

              w, h = img.size
              if w < 32 or h < 24:
                  return False

              backup = path.with_suffix(path.suffix + '.fix39bak')
              if not backup.exists():
                  backup.write_bytes(path.read_bytes())

              panel = Image.new('RGBA', (w, h), (8, 20, 44, 255))
              d = ImageDraw.Draw(panel)

              # Außenrahmen
              d.rectangle((0, 0, w - 1, h - 1), outline=(18, 90, 170, 255), width=2)
              d.rectangle((3, 3, w - 4, h - 4), outline=(70, 180, 255, 255), width=1)

              # Titelbalken
              title_h = max(12, h // 5)
              d.rectangle((5, 5, w - 6, 5 + title_h), fill=(65, 165, 225, 255))
              d.line((5, 5 + title_h, w - 6, 5 + title_h), fill=(10, 40, 90, 255), width=1)

              # Innenfläche
              d.rectangle((6, 6 + title_h, w - 7, h - 7), fill=(13, 33, 64, 255))

              panel.save(path)
              print('Sauberes Menüfenster erzeugt:', path)
              return True

          intro_keys = ['dkvierich', 'produktion', 'intro', 'splash', 'boot', 'logo']
          menu_bg_keys = ['lydra', 'menu', 'title', 'mainmenu', 'hauptmenu', 'background']
          panel_keys = ['option', 'window', 'panel', 'frame', 'box', 'menubox']

          intro_candidates = sorted(
              [(score(p, intro_keys), p) for p in files],
              key=lambda x: (-x[0], str(x[1]))
          )
          menu_candidates = sorted(
              [(score(p, menu_bg_keys), p) for p in files],
              key=lambda x: (-x[0], str(x[1]))
          )
          panel_candidates = sorted(
              [(score(p, panel_keys), p) for p in files],
              key=lambda x: (-x[0], str(x[1]))
          )

          touched = 0

          # Intro-Bild verbessern
          for s, p in intro_candidates[:3]:
              if s > 0:
                  touched += int(sharpen_and_upscale(p))

          # Hauptmenü-Hintergrund verbessern
          used_menu = 0
          for s, p in menu_candidates:
              if s <= 0:
                  continue
              if 'option' in p.name.lower() or 'panel' in p.name.lower() or 'window' in p.name.lower():
                  continue
              touched += int(sharpen_and_upscale(p))
              used_menu += 1
              if used_menu >= 3:
                  break

          # Problem aus Bild 2 beheben:
          # Menüfenster / Optionsfenster sauber neu zeichnen
          fixed_panel = 0
          for s, p in panel_candidates:
              if s <= 0:
                  continue
              if make_clean_panel(p):
                  touched += 1
                  fixed_panel += 1
              if fixed_panel >= 3:
                  break

          print('FIX39 UI-Dateien angepasst:', touched)
          PY_UI_HD

      - name: Bildschirmauflösung prüfen
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_DISPLAY'
          from pathlib import Path
          import os, re

          source = Path(os.environ['PROJECT_DIR']) / 'src/main.c'
          s = source.read_text(encoding='utf-8')

          if not re.search(r'(?m)^\s*#\s*define\s+SCREEN_W\s+320\b', s):
              raise SystemExit('FIX39: SCREEN_W ist nicht 320')

          if not re.search(r'(?m)^\s*#\s*define\s+SCREEN_H\s+240\b', s):
              raise SystemExit('FIX39: SCREEN_H ist nicht 240')

          if 'LWOD_FIX33_GEOMETRY' not in s:
              raise SystemExit('FIX39: FIX33-Geometrie fehlt')

          print('FIX39: 320x240 aktiv und FIX33-Geometrie vorhanden.')
          PY_DISPLAY

      - name: PS1 SDK installieren
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/lwod_run.py" 55
          grep -q '^PSN00BSDK_CMAKE=' "$GITHUB_ENV" || {
            echo '::error::PSN00BSDK_CMAKE fehlt nach SDK-Installation'
            exit 1
          }

      - name: PS1 kompilieren
        shell: bash
        run: |
          set -euo pipefail
          : "${PSN00BSDK_CMAKE:?PS1 SDK nicht geladen}"
          test -f "$PSN00BSDK_CMAKE"
          python3 "$RUNNER_TEMP/lwod_run.py" 56

      - name: Fehlerprotokoll hochladen
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: LWOD_FIX39_FEHLER
          path: |
            artifacts/FIX25_BUILD_LOG.txt
            artifacts/FIX25_ERSTE_FEHLER.txt
          if-no-files-found: warn
          retention-days: 14

      - name: PS1 Disc fertigstellen
        shell: bash
        run: |
          set -euo pipefail
          for i in 58 59 60 61; do
            python3 "$RUNNER_TEMP/lwod_run.py" "$i"
          done

          folder="$RUNNER_TEMP/lydra_ps1_spiel"
          test -s "$folder/LWOD_FIX32.bin"
          test -s "$folder/LWOD_FIX32.cue"

          mv "$folder/LWOD_FIX32.bin" "$folder/LWOD_FIX39.bin"

          sed 's/LWOD_FIX32[.]bin/LWOD_FIX39.bin/g' \
            "$folder/LWOD_FIX32.cue" > "$folder/LWOD_FIX39.cue"

          rm "$folder/LWOD_FIX32.cue"
          grep -qi 'LWOD_FIX39.bin' "$folder/LWOD_FIX39.cue"

          echo "FIX39: BIN und CUE fertig."

      - name: Spiel als Artefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: LWOD_FIX39_STABIL
          path: ${{ runner.temp }}/lydra_ps1_spiel/
          if-no-files-found: error
          retention-days: 14
