      shell: "bash"
      run: "set -euo pipefail\npython3 - <<'LYDRA_FIX9_VERIFY'\nimport os\nfrom pathlib import Path\ns=(Path(os.environ['PROJECT_DIR'])/'src/main.c').read_text(encoding='utf-8')\nassert 'vt_v24_path_band(' not in s\nassert s.count('static void vt_v31987_ground_rect(')==1\nassert 'if (x1==0 && x2==0 && width==85) return;' in s\nassert 'vt_v241_path(0,z,0,z+100,85);' in s\nfor left,right,z,width in ((-550,550,370,56),(-450,450,850,45),(-400,400,1100,46)):\n assert f'vt_v241_path({left},{z},{right},{z},{width});' not in s\n assert f'vt_v241_path({left},{z},-85,{z},{width});' in s\n assert f'vt_v241_path(85,{z},{right},{z},{width});' in s\nfor x in ('near_cells=10','far_cells=12','vt_save_game(void)',\n          'vt_load_game(void)', 'vt_v3194_perf_hud(', 'vt_v31813_draw_start('):\n assert x in s,x\nfor filename in ('WEG_FIX7_DIAGNOSE.txt','WEG_FIX8_DIAGNOSE.txt','WEG_FIX9_DIAGNOSE.txt'):\n assert (Path('artifacts')/filename).stat().st_size>150,filename\nprint('FIX9: shared road material and preserved game systems verified')\nLYDRA_FIX9_VERIFY\n"
    - name: "FIX11 Einheitliche Bewegung und Kamera mit VBlank-Glaettung"
      shell: "bash"
      run: "set -euo pipefail\npython3 - <<'LYDRA_FIX11_SPEED'\nfrom pathlib import Path\nimport os\npath=Path(os.environ['PROJECT_DIR'])/'src/main.c'\ns=path.read_text(encoding='utf-8')\nanchor='static void vt_v293_move(unsigned int pad) {'\nif s.count(anchor)!=1:raise RuntimeError('FIX11: Bewegungsfunktion nicht eindeutig')\na=s.index(anchor)\nb=s.find('\\n}',a)\nif b<0:raise RuntimeError('FIX11: Bewegungsende fehlt')\nmove=s[a:b+2]\n# Fixed control constants are the same for ALL regions and both sides of town.\nconstants='''/* FIX11: Einheitliche Steuerung fuer Dorf und Freiland, ohne Positions-Zonen.\n   Q8: 256=alte Vollgeschwindigkeit. Senken, wenn das gesamte Spiel zu schnell ist. */\n#define LYDRA_FIX11_MOVE_Q8 94\n#define LYDRA_FIX11_TURN_Q8 82\n'''\npatches=[\n('static unsigned int previous_vblank=0;',\n '''static unsigned int previous_vblank=0;\n    static int smoothed_dt_q8=256;'''),\n('unsigned int elapsed;', 'unsigned int elapsed=1;'),\n('int dt=1,forward=0,turn=0,target,dx=0,dz=0;',\n 'int forward=0,turn=0,target,dx=0,dz=0;'),\n('int vx,vz,desired_turn,delta,inc;',\n 'int vx,vz,desired_turn,delta,inc,dt_q8;'),\n('''    if(previous_vblank) {\n        elapsed=now-previous_vblank;\n        if(elapsed>=2u && elapsed<=5u)dt=2;\n    }\n    previous_vblank=now;''',\n '''    /* FIX11: Use real elapsed VBlanks even when the busy town runs at 8-12 FPS.\n       Old code turned >5 missed VBlanks into one step, making town movement slow.\n       Discard very long pauses, smooth 1..8 VBlanks across several frames. */\n    if(previous_vblank) {\n        unsigned int delta_vblank=now-previous_vblank;\n        if(delta_vblank>=1u && delta_vblank<=10u)elapsed=delta_vblank;\n    }\n    previous_vblank=now;\n    if(elapsed>8u)elapsed=8u;\n    smoothed_dt_q8+=((int)elapsed*256-smoothed_dt_q8)/3;\n    if(smoothed_dt_q8<256)smoothed_dt_q8=256;\n    if(smoothed_dt_q8>2048)smoothed_dt_q8=2048;\n    dt_q8=smoothed_dt_q8;'''),\n('''        turn_q8=turn_fraction_q8=0;\n        started=1;''',\n '''        turn_q8=turn_fraction_q8=0;\n        smoothed_dt_q8=256;\n        started=1;'''),\n('''        desired_turn=turn*45*256;\n        delta=desired_turn-turn_q8;\n        turn_q8+=(delta*dt)/3;\n        turn_fraction_q8+=turn_q8*dt;''',\n '''        int blend_q8=dt_q8/4;\n        if(blend_q8>256)blend_q8=256; /* prevent easing overshoot */\n        desired_turn=turn*45*LYDRA_FIX11_TURN_Q8;\n        delta=desired_turn-turn_q8;\n        turn_q8+=(delta*blend_q8)/256;\n        turn_fraction_q8+=(turn_q8*dt_q8)/256;'''),\n('target=forward*17920;',\n 'target=forward*((17920*LYDRA_FIX11_MOVE_Q8)/256);'),\n('speed_q10+=3840*dt;',\n 'speed_q10+=(((3840*LYDRA_FIX11_MOVE_Q8)/256)*dt_q8)/256;'),\n('speed_q10-=3840*dt;',\n 'speed_q10-=(((3840*LYDRA_FIX11_MOVE_Q8)/256)*dt_q8)/256;'),\n('frac_x+=vx*dt;',\n 'frac_x+=(vx*dt_q8)/256;'),\n('frac_z+=vz*dt;',\n 'frac_z+=(vz*dt_q8)/256;'),\n]\nfor old,new in patches:\n    if move.count(old)!=1:raise RuntimeError('FIX11: Ausgangscode geaendert: '+old[:65])\n    move=move.replace(old,new,1)\ns=s[:a]+move+s[b+2:]\ns=s.replace(anchor,constants+'\\n'+anchor,1)\nif s.count('LYDRA_FIX11_MOVE_Q8')<3:raise RuntimeError('FIX11: constants not integrated')\nfor marker in ('vt_v31987_ground_rect(', 'vt_v3194_perf_hud(',\n               'vt_save_game(void)', 'vt_load_game(void)', 'vt_v31813_draw_start('):\n    if marker not in s:raise RuntimeError('FIX11: ererbte Funktion fehlt: '+marker)\npath.write_text(s,encoding='utf-8')\nPath('artifacts').mkdir(exist_ok=True)\nPath('artifacts/TEMPO_FIX11_DIAGNOSE.txt').write_text(\n  'LYDRA WORLD OF DRAGON V31.9.8.6 - FIX11\\\\n'\n  'Stadt=Freiland: Bewegung Q8 94, Kameradrehung Q8 82, keine Zonen\\\\n'\n  'VSync wird bis 8 VBlanks ausgewertet und geglaettet; lange Pausen verworfen.\\\\n'\n  'Keine Aenderung an Landschaft, Kollision, Speicher, Intro oder Rendering.\\\\n',\n  encoding='utf-8')\nprint('FIX11: gleiche Eingabegeschwindigkeit in allen Regionen, VBlank-Zeit geglaettet')\nLYDRA_FIX11_SPEED\n"
