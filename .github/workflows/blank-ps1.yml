        import json,sys,pathlib,hashlib
        patch=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
        for item in patch['files']:
            path=pathlib.Path(item['path'])
            data=path.read_text(encoding='utf-8')
            digest=lambda s: hashlib.sha256(s.encode('utf-8')).hexdigest()
            is_quest_npcs = str(path) == 'android/scripts/V37VillageQuests.gd'
            # V37 wird bereits von der festen Basis erzeugt und kann andere
            # unbeteiligte Quest-Korrekturen enthalten. NUR die eindeutige NPC-Stelle
            # ersetzen, statt eine veraltete Pruefsumme der kompletten Datei zu fordern.
            if not is_quest_npcs and digest(data)!=item['before_sha256']:
                raise SystemExit('V4092_FIX3: Quelldatei unerwartet veraendert: '+str(path))
            for edit in item['edits']:
                before_count=data.count(edit['old'])
                after_count=data.count(edit['new'])
                if before_count != 1 or after_count != 0:
                    raise SystemExit('V4092_FIX3: NPC-Patch-Stelle fehlt, ist bereits ersetzt oder mehrdeutig in '+str(path)+': '+str((before_count,after_count)))
                data=data.replace(edit['old'],edit['new'],1)
                if data.count(edit['new']) != 1:
                    raise SystemExit('V4092_FIX3: Ersatzstelle nicht eindeutig: '+str(path))
            if not is_quest_npcs and digest(data)!=item['sha256']:
                raise SystemExit('V4092_FIX3: Zieldatei-Pruefsumme ungueltig: '+str(path))
            # Das originale Sonnental-Questskript bleibt bis auf die eine
            # kontrollierte Bewegungsstelle bytegenau erhalten.
            path.write_text(data,encoding='utf-8')
            print('FIX3_UPDATED:',path,'SHA256=',digest(data))
        PYAPPLY
        echo "94e0ce7d767692ce76640018c70f752f0cd9ba761f27a52e81dc2602d2d0860f  android/tests/V4092NPCMotionSmoke.gd" | sha256sum -c -
