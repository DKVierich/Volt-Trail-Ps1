name: LWOD Android V40.9.4 Spielfigur und Phönix
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/blank-ps1.yml
permissions:
  contents: read
jobs:
  android:
    name: LWOD Android V40.9.4 APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    container:
      image: barichello/godot-ci:4.7.2
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: /usr/lib/android-sdk
    steps:
    - name: Repository laden
      uses: actions/checkout@v4
    - name: Python YAML bereitstellen
      shell: bash
      run: |
        set -euo pipefail
        if ! python3 -c 'import yaml' >/dev/null 2>&1; then
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-yaml
        fi
    - name: V40.9.2 FIX5 unveraenderlich wiederherstellen
      shell: bash
      run: |
        set -euo pipefail
        wget -q --tries=3 --timeout=60 --https-only -O "$RUNNER_TEMP/lwod_4093_base.yml" 'https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/319c331849f1fb679438320c4d8ccff04a6a8414/.github/workflows/blank-ps1.yml'
        printf '%s  %s\n' '720b27c7c31010a2abd8f70c4bfa3c39dffaf202f56ccb3434410ad92a805d60' "$RUNNER_TEMP/lwod_4093_base.yml" | sha256sum -c -
        python3 - <<'PYREBUILD'
        import yaml,subprocess,os
        from pathlib import Path
        p=Path(os.environ['RUNNER_TEMP'])/'lwod_4093_base.yml'
        steps=yaml.safe_load(p.read_text())['jobs']['android']['steps']
        assert len(steps)==28
        assert steps[23]['name'].startswith('V40.9.2 FIX5')
        for index in range(2,25):
            item=steps[index]
            script=item.get('run')
            if not script:
                raise SystemExit('V4093: erwarteter Basisschritt ohne Skript: '+str(index))
            print('V4093_REBUILD: '+str(index)+' '+item['name'],flush=True)
            subprocess.run(['bash','-e','-u','-o','pipefail','-c',script],check=True)
        print('V4093_REBUILD_OK: V40.9.2 FIX5 bereit',flush=True)
        PYREBUILD
