
name: Build Lydra World Of Dragon V26

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build unzip curl \
            ffmpeg python3-pil python3-yaml

      - name: Load stable V25
        shell: bash
        run: |
          set -euo pipefail

          BASE="7176f799eb454be40960c415a64c336b2b24fed7"

          curl -fLsS --retry 4 \
            "https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/$BASE/.github/workflows/blank-ps1.yml" \
            -o "$RUNNER_TEMP/v25.yml"

          cat > "$RUNNER_TEMP/v25_step.py" <<'PY'
          import os
          import sys
          import subprocess
          from pathlib import Path
          import yaml

          path = Path(os.environ["RUNNER_TEMP"]) / "v25.yml"
          data = yaml.safe_load(path.read_text(encoding="utf-8"))
          steps = data["jobs"]["build"]["steps"]

          wanted = sys.argv[1]
          found = [s for s in steps if s.get("name") == wanted]

          if len(found) != 1:
              raise RuntimeError("V25 step missing: " + wanted)

          print("Running:", wanted, flush=True)

          subprocess.run(
              ["bash", "-euo", "pipefail", "-c", found[0]["run"]],
              env=os.environ.copy(),
              check=True
          )
          PY

          python3 "$RUNNER_TEMP/v25_step.py" \
            "Load working V24.3 instructions"

      - name: Prepare game
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/v25_step.py" \
            "Prepare existing game project"

      - name: Restore original gameplay
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/v25_step.py" \
            "Restore working V24.3 game"

      - name: Restore Lydra V25
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/v25_step.py" \
            "Apply Lydra name and V25 graphics"

      - name: Improve V26 dragon and world models
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["PROJECT_DIR"]) / "src/main.c"
          code = path.read_text(encoding="utf-8")

          def enhance(name, addition):
              global code

              pattern = (
                  r"\bstatic\s+void\s+"
                  + re.escape(name)
                  + r"\s*\([^;]*?\)\s*\{"
              )

              matches = list(re.finditer(pattern, code, re.S))

              if len(matches) != 1:
                  raise RuntimeError(
                      "V26 model missing: " + name
                  )

              start = matches[0].end()
              depth = 1
              position = start

              while depth > 0 and position < len(code):
                  if code[position] == "{":
                      depth += 1
                  elif code[position] == "}":
                      depth -= 1
                  position += 1

              if depth != 0:
                  raise RuntimeError(
                      "Invalid model structure: " + name
                  )

              insert_at = position - 1

              code = (
                  code[:insert_at]
                  + "\n"
                  + addition
                  + "\n"
                  + code[insert_at:]
              )

          # More detailed companion dragon.
          enhance("vt_sparkit", r'''
              /* V26: additional horns and claws. */
              vt_pyramid(
                  x - 13, -24, z - 13,
                  5, 17, 250, 188, 68
              );
              vt_pyramid(
                  x + 13, -24, z - 13,
                  5, 17, 250, 188, 68
              );
              draw_box(
                  x - 12, 38, z - 13,
                  4, 232, 214, 181
              );
              draw_box(
                  x + 12, 38, z - 13,
                  4, 232, 214, 181
              );
              vt_pyramid(
                  x + 20, 8, z + 30,
                  6, 12, 235, 150, 60
              );
          ''')

          # Improve all four wild dragon variations.
          enhance("vt_v19_wild_dragon", r'''
              /* V26: stronger wings and back plates. */
              vt_dragon_wing(
                  x, z, -1, 44,
                  flap ? 12 : -4,
                  r * 3 / 4,
                  g * 3 / 4,
                  b * 3 / 4
              );
              vt_dragon_wing(
                  x, z, 1, 44,
                  flap ? -4 : 12,
                  r * 3 / 4,
                  g * 3 / 4,
                  b * 3 / 4
              );
              vt_pyramid(
                  x, -3, z + 4,
                  5, 13, r, g, b
              );
              vt_pyramid(
                  x, 3, z + 16,
                  5, 11, r, g, b
              );
              draw_box(
                  x - 12, 40, z - 9,
                  4, 221, 207, 170
              );
              draw_box(
                  x + 12, 40, z - 9,
                  4, 221, 207, 170
              );
          ''')

          # Add depth to existing trees.
          enhance("vt_v24_tree", r'''
              /* V26: layered foliage and branches. */
              vt_pyramid(
                  x - 11, -16, z + 8,
                  11 + scale / 5,
                  20 + scale / 2,
                  rr + 8,
                  gg + 6,
                  bb + 4
              );
              vt_pyramid(
                  x + 11, -24, z - 7,
                  10 + scale / 5,
                  18 + scale / 2,
                  rr,
                  gg + 12,
                  bb
              );
              draw_box(
                  x + 4, 21, z + 3,
                  4, 112, 75, 47
              );
          ''')

          # Add windows and an entrance to houses.
          enhance("vt_v24_house", r'''
              /* V26: entrance and window details. */
              draw_box(
                  x - 19, 9, z - 24,
                  5, 68, 143, 197
              );
              draw_box(
                  x + 19, 9, z - 24,
                  5, 68, 143, 197
              );
              draw_box(
                  x, 31, z - 25,
                  8, 105, 72, 49
              );
              vt_pyramid(
                  x + 17, -24, z + 7,
                  6, 14,
                  roof_r, roof_g, roof_b
              );
          ''')

          required = [
              "LYDRA WORLD OF DRAGON",
              "lydra_v25_nature();",
              "vt_v24_draw_overworld();",
              "vt_v23_field_dragon();",
              "vt_v18_battle_bars();",
              "vt_save_game(void)",
              "vt_load_game(void)",
              "vt_play_intro();",
              "V26: additional horns",
              "V26: layered foliage"
          ]

          for marker in required:
              if marker not in code:
                  raise RuntimeError(
                      "Missing game component: " + marker
                  )

          path.write_text(code, encoding="utf-8")

          print("LYDRA WORLD OF DRAGON V26")
          print("Dragon models enhanced")
          print("Trees and houses enhanced")
          print("Original gameplay preserved")
          PY

      - name: Install PSn00bSDK
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/v25_step.py" \
            "Install PSn00bSDK"

      - name: Build Lydra V26
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/v25_step.py" \
            "Build Lydra World Of Dragon"

      - name: Collect PS1 game files
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/v25_step.py" \
            "Collect PS1 game files"

      - name: Upload Lydra V26
        uses: actions/upload-artifact@v4
        with:
          name: Lydra-World-Of-Dragon-PS1-V26
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
