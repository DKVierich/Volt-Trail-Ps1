    - name: V30.2 360-Grad-Gelaende-Fix anwenden
      shell: bash
      run: |
        set -euo pipefail
        test -n "${PROJECT_DIR:-}" && test -f "$PROJECT_DIR/src/main.c"
        cat > "$RUNNER_TEMP/lydra_v302_world_fix.py" <<'PY'
        #!/usr/bin/env python3
        # V30.2 full 360 degree terrain and full-circle distant skyline.
        # Based on V30.1; no changes to saves, input, doors or combat.
        import os
        import re
        from pathlib import Path

        path=Path(os.environ['PROJECT_DIR'])/'src/main.c'
        s=path.read_text(encoding='utf-8')

        def span(name):
            match=list(re.finditer(r'\bstatic\s+void\s+'+re.escape(name)+r'\s*\([^;]*?\)\s*\{',s,re.S))
            if len(match)!=1:
                raise RuntimeError('V30.2 missing/duplicate function '+name+': '+str(len(match)))
            p=match[0].end()
            depth=1
            state='normal'
            while p<len(s) and depth:
                c=s[p]
                nxt=s[p+1] if p+1<len(s) else ''
                if state=='normal':
                    if c=='/' and nxt=='/':state='line';p+=1
                    elif c=='/' and nxt=='*':state='block';p+=1
                    elif c=='"':state='string'
                    elif c=="'":state='char'
                    elif c=='{':depth+=1
                    elif c=='}':depth-=1
                elif state=='line':
                    if c=='\n':state='normal'
                elif state=='block':
                    if c=='*' and nxt=='/':state='normal';p+=1
                elif state=='string' or state=='char':
                    if c=='\\':p+=1
                    elif (state=='string' and c=='"') or (state=='char' and c=="'"):
                        state='normal'
                p+=1
            if depth:
                raise RuntimeError('V30.2 unclosed function '+name)
            return match[0].start(),p

        ground=r'''
        /* V30.2: A complete 360 degree terrain ring with deterministic coverage.
           The previous V30.1 patch exhausted its far-cell budget while scanning
           south-to-north, starving directions at the end of the scan.
           This version fits a full ring in a bounded polygon budget (no FOV cull).
           Render near tiles at the same height as the existing world floor. */
        static void vt_v300_extend_ground(void) {
            int gx,gz,ix,iz;
            int r1,g1,b1,r2,g2,b2;
            const int near_step=140, near_cells=16;
            const int far_step=380, far_cells=16;
            if(region==1) {
                r1=84;g1=134;b1=128;r2=62;g2=108;b2=112;
            } else if(region==2) {
                r1=116;g1=143;b1=87;r2=78;g2=111;b2=77;
            } else {
                r1=85;g1=162;b1=90;r2=54;g2=132;b2=75;
            }
            /* Centered on player, independently of where camera faces. */
            gx=(px/near_step)*near_step-(near_cells/2)*near_step;
            gz=(pz/near_step)*near_step-(near_cells/2)*near_step;
            vt_v24_ground_patch(gx,gz,near_step,near_cells,near_cells,
                                r1,g1,b1,r2,g2,b2);

            /* Outer 16x16 square spans 6080 world units; overlapping center
               suppresses only 4x4 cells which the higher-detail inner terrain covers.
               ALL remaining far cells are drawn, not just the first N in row order. */
            gx=(px/far_step)*far_step-(far_cells/2)*far_step;
            gz=(pz/far_step)*far_step-(far_cells/2)*far_step;
            for(iz=0;iz<far_cells;iz++) {
                for(ix=0;ix<far_cells;ix++) {
                    int x=gx+ix*far_step;
                    int z=gz+iz*far_step;
                    int dx=x+far_step/2-px;
                    int dz=z+far_step/2-pz;
                    int shade=vt_v300_hash(x,z)&3;
                    if(vt_v300_abs(dx)<720 && vt_v300_abs(dz)<720)
                        continue;
                    vt_v241_flat(x,z,x+far_step,z+far_step,36,
                                  r1-shade*3,g1-shade*3,b1-shade*2);
                }
            }
        }
        '''

        horizon=r'''
        /* V30.2: Continuous ring of far peaks, so turning 180 degrees doesn't
           reveal a completely empty backdrop. Peaks are visual only and remain
           attached to the camera-centered horizon, never to the collision world. */
        static void vt_v300_horizon(void) {
            int i;
            for(i=0;i<24;i++) {
                int angle=(i*4096)/24;
                int x=px+(vt_v293_sin(angle)*3320)/1024;
                int z=pz+(vt_v293_cos(angle)*3320)/1024;
                int height=260+((i*7+region*3)%5)*47;
                int r=98,g=143,b=176;
                if(region==1) {r=96;g=165;b=202;height+=75;}
                else if(region==2) {r=111;g=137;b=161;height+=40;}
                vt_v24_peak(x,z,740+(i%3)*45,height,r,g,b);
                if((i&1)==0) {
                    int xx=px+(vt_v293_sin(angle)*2470)/1024;
                    int zz=pz+(vt_v293_cos(angle)*2470)/1024;
                    vt_v24_peak(xx,zz,440,150+(i%3)*20,
                        region==1?82:73,region==1?132:125,region==1?151:97);
                }
            }
        }
        '''
        for name,new in [('vt_v300_extend_ground',ground),('vt_v300_horizon',horizon)]:
            a,b=span(name)
            s=s[:a]+new.strip()+'\n'+s[b:]

        required=(
            'vt_v301_sun();', 'vt_v301_day_night_hud();',
            'vt_v293_move((unsigned int)pad);', 'vt_v281_resolve_movement();',
            'vt_v282_draw_house_npcs(', 'vt_opt_draw_page();',
            'vt_v292_draw_exploration_hud();', 'vt_save_game(void)',
            'vt_load_game(void)',
        )
        for item in required:
            if item not in s:
                raise RuntimeError('V30.2 missing preserved system: '+item)
        if 'if(rendered>=VT_V300_FAR_CELL_BUDGET)return;' in s:
            raise RuntimeError('V30.2 still contains one-sided cell budget cutoff')
        if s.count('static void vt_v300_extend_ground(void)')!=1 or s.count('static void vt_v300_horizon(void)')!=1:
            raise RuntimeError('V30.2 functions were duplicated')
        path.write_text(s,encoding='utf-8')
        print('V30.2: centered 16x16 near mesh, 360-degree coarse 16x16 ring.')
        print('V30.2: no camera-direction filter / scan-order limit; full distant mountains.')
        print('V30.2: preserved V30.1 game systems and Memory Card layout.')
        PY
        python3 "$RUNNER_TEMP/lydra_v302_world_fix.py"
    - name: V30.3 Sicht, Boden, Himmel und HUD reparieren
      shell: bash
      run: |
        set -euo pipefail
        cat > "$RUNNER_TEMP/lydra_v303_patch.py" <<'PY'
        #!/usr/bin/env python3
        """V30.3 view-space clipping and OT capacity correction for actual PS1 source.
        Input must be V30.2 source created from the successful V30.1 chain + V30.2 fix.
        """
        import os
        import re
        from pathlib import Path
        p=Path(os.environ['PROJECT_DIR']) / 'src/main.c'
        s=p.read_text(encoding='utf-8')

        def once(old,new):
            global s
            n=s.count(old)
            if n!=1: raise RuntimeError('V30.3 expected one anchor %r, found %d'%(old[:90],n))
            s=s.replace(old,new,1)

        def span(name):
            matches=list(re.finditer(r'\bstatic\s+void\s+'+re.escape(name)+r'\s*\([^;]*?\)\s*\{',s,re.S))
            if len(matches)!=1: raise RuntimeError('V30.3 missing or duplicate function %s: %d'%(name,len(matches)))
            p0=matches[0].end(); pos=p0; depth=1; state='code'
            while pos<len(s) and depth:
                c=s[pos]; nxt=s[pos+1] if pos+1<len(s) else ''
                if state=='code':
                    if c=='/' and nxt=='/':state='line';pos+=1
                    elif c=='/' and nxt=='*':state='block';pos+=1
                    elif c=='"':state='string'
                    elif c=="'":state='char'
                    elif c=='{':depth+=1
                    elif c=='}':depth-=1
                elif state=='line':
                    if c=='\n':state='code'
                elif state=='block':
                    if c=='*' and nxt=='/':state='code';pos+=1
                elif state in ('string','char'):
                    if c=='\\':pos+=1
                    elif (state=='string' and c=='"') or (state=='char' and c=="'"):state='code'
                pos+=1
            if depth:raise RuntimeError('V30.3 unbalanced function '+name)
            return matches[0].start(),pos

        def replace_func(name,definition):
            global s
            a,b=span(name)
            s=s[:a]+definition.strip()+'\n'+s[b:]

        # Original engine discards triangles based on UNROTATED Z. When the camera turns
        # this makes perfectly visible landscape disappear. Correct in camera/view space.
        once('#define OT_LEN 256','#define OT_LEN 1024')
        once('static unsigned char prim_arena[2][65536]', 'static unsigned char prim_arena[2][131072]')
        once('bucket = (int)(depth >> 2);','bucket = (int)(depth >> 3);')
        anchor='static void draw_triangle3(SVECTOR *v0, SVECTOR *v1, SVECTOR *v2, int r, int g, int b) {'
        once(anchor, '''/* Camera functions/globals are defined farther down by V29.3. */
        static int vt_v292_cam_yaw;
        static int vt_v293_sin(int angle);
        static int vt_v293_cos(int angle);
        '''+anchor)
        # Original old clipping from V7: remove the three unrotated z+CAMERA_Z checks.
        clip=re.compile(r'/\* Never project a vertex behind the camera or across the near plane\. \*/\s*if\s*\(v0->vz\s*\+\s*CAMERA_Z\s*<\s*NEAR_Z\s*\|\|\s*v1->vz\s*\+\s*CAMERA_Z\s*<\s*NEAR_Z\s*\|\|\s*v2->vz\s*\+\s*CAMERA_Z\s*<\s*NEAR_Z\)\s*return\s*;',re.S)
        clipping='''/* V30.3: view-space near clipping matching the rotating camera. */
            {
                int sn=vt_v293_sin(vt_v292_cam_yaw);
                int cs=vt_v293_cos(vt_v292_cam_yaw);
                long z0=((long)v0->vz*cs-(long)v0->vx*sn)/1024 + CAMERA_Z - 70;
                long z1=((long)v1->vz*cs-(long)v1->vx*sn)/1024 + CAMERA_Z - 70;
                long z2=((long)v2->vz*cs-(long)v2->vx*sn)/1024 + CAMERA_Z - 70;
                if(z0<NEAR_Z || z1<NEAR_Z || z2<NEAR_Z)return;
            }'''
        s,n=clip.subn(clipping,s,count=1)
        if n!=1:raise RuntimeError('V30.3: original erroneous unrotated near-plane test not found')

        # Old prototype front-only ground overlaps V30.2 terrain; avoid z-fighting.
        replace_func('draw_ground', '''static void draw_ground(void) {
            /* V30.3: Terrain is supplied by vt_v300_extend_ground in the world renderer.
               The old fixed front-only ground caused overlapping surfaces and polygons. */
        }''')

        # Near and far terrain are both generated around player regardless of camera angle;
        # the far tiles sit below the near tiles to avoid overpainting the avatar.
        replace_func('vt_v300_extend_ground',r'''
        static void vt_v300_extend_ground(void) {
            int ix, iz, gx, gz;
            int r1,g1,b1,r2,g2,b2;
            const int near_step=140, near_cells=16;
            const int far_step=420, far_cells=14;
            if(region==1){r1=84;g1=134;b1=128;r2=62;g2=108;b2=112;}
            else if(region==2){r1=116;g1=143;b1=87;r2=78;g2=111;b2=77;}
            else {r1=85;g1=162;b1=90;r2=54;g2=132;b2=75;}
            /* Coarse 360-degree ring first: stable in fixed world coordinates. */
            gx=(px/far_step)*far_step-(far_cells/2)*far_step;
            gz=(pz/far_step)*far_step-(far_cells/2)*far_step;
            for(iz=0;iz<far_cells;iz++)for(ix=0;ix<far_cells;ix++){
                int x=gx+ix*far_step, z=gz+iz*far_step;
                int dx=x+far_step/2-px, dz=z+far_step/2-pz;
                int shade=vt_v300_hash(x,z)&3;
                /* Only skip cells fully inside the detailed center. */
                if(vt_v300_abs(dx)+far_step/2<840 &&
                   vt_v300_abs(dz)+far_step/2<840)continue;
                vt_v241_flat(x,z,x+far_step,z+far_step,44,
                    r1-shade*3,g1-shade*3,b1-shade*2);
            }
            /* Fine center extends in every direction, without a directional cutoff. */
            gx=(px/near_step)*near_step-(near_cells/2)*near_step;
            gz=(pz/near_step)*near_step-(near_cells/2)*near_step;
            vt_v24_ground_patch(gx,gz,near_step,near_cells,near_cells,
                                r1,g1,b1,r2,g2,b2);
        }
        ''')

        # Scenic mountain loop retains a full ring but uses a regular spacing and
        # bounded number of polygons, with enough arc overlap to avoid giant gaps.
        replace_func('vt_v300_horizon',r'''
        static void vt_v300_horizon(void) {
            int i;
            for(i=0;i<24;i++) {
                int angle=(i*4096)/24;
                int x=px+(vt_v293_sin(angle)*2600)/1024;
                int z=pz+(vt_v293_cos(angle)*2600)/1024;
                int high=260+((i*7+region*3)%5)*37;
                int r=93,g=140,b=179;
                if(region==1){r=104;g=162;b=201;high+=75;}
                else if(region==2){r=109;g=140;b=168;high+=40;}
                vt_v24_peak(x,z,790,high,r,g,b);
            }
        }
        ''')

        # Slightly look down so ground fills more of the screen, with a more centered
        # follow view. Keep original obstruction blend for houses.
        if 'camera_rot.vx = 104 + vt_v28_camera_blend / 3;' in s:
            once('camera_rot.vx = 104 + vt_v28_camera_blend / 3;',
                 'camera_rot.vx = 160 + vt_v28_camera_blend / 4;')
        if 'camera_pos.vy = 72 + vt_v28_camera_blend / 3;' in s:
            once('camera_pos.vy = 72 + vt_v28_camera_blend / 3;',
                 'camera_pos.vy = 48 + vt_v28_camera_blend / 4;')

        # Cleaner counter next to compass. Preserve actual frame-based timekeeping.
        once('FntPrint(4,"TAG %3d%%\\nNAC %3d%%\\n",tag,nacht);',
             'FntPrint(4,"T %3d%%\\nN %3d%%\\n",tag,nacht);')

        # Daytime sky and a screen-space sun are drawn behind the polygons; night gets
        # a darker sky and moon. This avoids the 3-D sun being culled by the GTE far limit.
        replace_func('vt_v301_sun',r'''
        static void vt_v301_sun(void) {
            unsigned int t=vt_v301_clock%7200u;
            int daytime=t<4800u;
            int sx,sy,alt;
            TILE *disc;
            unsigned int aligned;
            if(daytime){
                alt=(t<2400u)?(int)t:(int)(4800u-t);
                draw[db].r0=(unsigned char)(64+alt/120);
                draw[db].g0=(unsigned char)(112+alt/80);
                draw[db].b0=(unsigned char)(180+alt/110);
                sx=24+(int)(t*270u/4800u);
                sy=86-alt/42;
            } else {
                alt=(int)(t-4800u);
                draw[db].r0=12;
                draw[db].g0=25;
                draw[db].b0=55;
                sx=30+alt*245/2400;
                sy=45;
            }
            aligned=(prim_used+3u)&~3u;
            if(aligned+sizeof(TILE)>sizeof(prim_arena[db]))return;
            disc=(TILE*)(prim_arena[db]+aligned);
            prim_used=aligned+sizeof(TILE);
            setTile(disc);
            setXY0(disc,sx-(daytime?12:8),sy-(daytime?12:8));
            setWH(disc,daytime?24:16,daytime?24:16);
            if(daytime)setRGB0(disc,255,231,129);
            else setRGB0(disc,194,217,241);
            /* High-depth OT entry draws behind scenery, not over the player's face. */
            addPrim(ot[db]+OT_LEN-2,disc);
        }
        ''')

        required=['vt_v293_move((unsigned int)pad);','vt_v281_resolve_movement();',
                  'vt_v282_draw_house_npcs(', 'vt_opt_draw_page();','vt_save_game(void)',
                  'vt_load_game(void)','vt_v292_draw_exploration_hud();']
        for feature in required:
            if feature not in s:raise RuntimeError('V30.3 missing gameplay feature '+feature)
        assert s.count('static void vt_v300_extend_ground(void)')==1
        assert s.count('static void vt_v301_sun(void)')==1
        p.write_text(s,encoding='utf-8')
        print('V30.3: camera-aware near clipping, longer depth sorting, balanced 360° terrain.')
        print('V30.3: removed duplicate front-only ground; tuned camera, sun/moon and time label.')
        print('Existing save/card structure, controls, capture, NPCs, indoor houses untouched.')
        PY
        python3 "$RUNNER_TEMP/lydra_v303_patch.py"
    - name: V30.4 Sonne und Mond weltfest ausrichten
      shell: bash
      run: |
        set -euo pipefail
        test -s "$PROJECT_DIR/src/main.c"
        cat > "$RUNNER_TEMP/lydra_v304_sonne.py" <<'PY'
        #!/usr/bin/env python3
        """Fix sky-body rotation without changing gameplay or Memory Card layout."""
        import os,re
        from pathlib import Path
        p=Path(os.environ['PROJECT_DIR'])/'src/main.c'
        s=p.read_text(encoding='utf-8')
        pattern=r'(?ms)^static void vt_v301_sun\(void\)\s*\{.*?^\}'
        new_code='/* V30.4: celestial body has a compass bearing independent of the camera.\n   Day: east -> south -> west. The moon travels the same path at night.\n   A distant sky object uses angular projection, so it also stays steady\n   when the player walks or the camera turns. */\nstatic void vt_v301_sun(void) {\n    unsigned int t=vt_v301_clock%7200u;\n    int day=(t<4800u);\n    int segment=day?(int)t:(int)(t-4800u);\n    int duration=day?4800:2400;\n    int half=duration/2;\n    int rise=(segment<half)?segment:(duration-segment);\n    int bearing=3072-(segment*2048)/duration;\n    int relative=(bearing-vt_v292_cam_yaw+2048)&4095;\n    int sx,sy;\n    TILE *disc;\n    unsigned int aligned;\n\n    relative-=2048;\n    /* Preserve existing day/night sky illumination regardless of camera. */\n    if(day) {\n        draw[db].r0=(unsigned char)(64+rise/120);\n        draw[db].g0=(unsigned char)(112+rise/80);\n        draw[db].b0=(unsigned char)(180+rise/110);\n    } else {\n        draw[db].r0=12;\n        draw[db].g0=25;\n        draw[db].b0=55;\n    }\n    /* Approximately 72-degree horizontal field of view: hide objects outside it.\n       In particular, never draw a sun/moon permanently in the same screen spot. */\n    if(relative < -490 || relative > 490)return;\n    sx=160-(relative*160)/490;\n    sy=day?(89-rise/47):(79-rise/42);\n    aligned=(prim_used+3u)&~3u;\n    if(aligned+sizeof(TILE)>sizeof(prim_arena[db]))return;\n    disc=(TILE*)(prim_arena[db]+aligned);\n    prim_used=aligned+sizeof(TILE);\n    setTile(disc);\n    setXY0(disc,sx-(day?12:8),sy-(day?12:8));\n    setWH(disc,day?24:16,day?24:16);\n    if(day)setRGB0(disc,255,231,129);\n    else setRGB0(disc,194,217,241);\n    addPrim(ot[db]+OT_LEN-2,disc);\n}'
        s,count=re.subn(pattern,lambda m:new_code,s)
        if count!=1:
            raise RuntimeError('V30.4 sun function missing or duplicated: '+str(count))
        for marker in ('vt_v301_day_night_hud();','vt_v293_move((unsigned int)pad);',
                       'vt_v281_resolve_movement();','vt_v282_draw_house_npcs(',
                       'vt_opt_draw_page();','vt_save_game(void)','vt_load_game(void)'):
