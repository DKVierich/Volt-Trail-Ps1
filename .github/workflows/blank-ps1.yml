
name: Build Volt Trail PS1 V13

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build unzip curl jq tar \
            ffmpeg python3-pil python3-yaml

      - name: Prepare project and V12 backup
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/VoltTrail_PS1_AndroidReady_V7.zip"
          VIDEO="$GITHUB_WORKSPACE/DKVierich_Produktion_PS1_Intro_original.mp4"

          test -f "$ZIP" || {
            echo "::error::Original V7 ZIP missing"
            exit 1
          }

          test -f "$VIDEO" || {
            echo "::error::Intro video missing"
            exit 1
          }

          COMMIT="9fe565d33d905521e42d05b09ad6bfbe5b9bc3a5"

          curl --retry 3 -fsSL \
            "https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/$COMMIT/.github/workflows/blank-ps1.yml" \
            -o "$RUNNER_TEMP/v12.yml"

          DEST="$RUNNER_TEMP/v13-project"
          mkdir -p "$DEST"
          unzip -q "$ZIP" -d "$DEST"

          CMAKE_FILE="$(find "$DEST" -type f -name CMakeLists.txt -print -quit)"

          if [ -z "$CMAKE_FILE" ]; then
            echo "::error::Project files missing"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$CMAKE_FILE")"

          for f in CMakeLists.txt src/main.c iso.xml system.cnf; do
            test -f "$PROJECT_DIR/$f" || exit 1
          done

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Restore working V12 game and intro
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          import yaml

          path = Path(os.environ["RUNNER_TEMP"]) / "v12.yml"
          steps = yaml.safe_load(path.read_text())["jobs"]["build"]["steps"]

          for wanted in [
              "Convert DKVierich intro",
              "Apply V12 graphics and gameplay"
          ]:
              matches = [
                  step for step in steps
                  if step.get("name") == wanted
              ]

              if len(matches) != 1:
                  raise RuntimeError("Missing V12 step: " + wanted)

              print("Running:", wanted, flush=True)

              subprocess.run(
                  ["bash", "-euo", "pipefail", "-c", matches[0]["run"]],
                  check=True,
                  env=os.environ.copy()
              )

          print("V12 game and intro restored")
          PY

      - name: Apply V13 graphics improvements
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["PROJECT_DIR"]) / "src/main.c"
          code = path.read_text(encoding="utf-8")

          def replace_once(old, new):
              global code

              if code.count(old) != 1:
                  raise RuntimeError(
                      "Source marker not found: " + old[:80]
                  )

              code = code.replace(old, new, 1)

          # Move the camera projection closer.
          replace_once(
              "gte_SetGeomScreen(180);",
              "gte_SetGeomScreen(225);"
          )

          # Update game title.
          replace_once(
              "VOLT TRAIL V12 - %s",
              "VOLT TRAIL V13 - %s"
          )

          # Add a walking animation state.
          replace_once(
              "static void vt_sparkit(int x, int z) {",
              "static int vt_walk_phase = 0;\n\n"
              "static void vt_sparkit(int x, int z) {"
          )

          # Replace Sparkit's static model with
          # a gently animated version.
          start = code.index(
              "static void vt_sparkit(int x, int z) {"
          )

          end = code.index(
              "static void vt_mosslet(",
              start
          )

          sparkit = r'''
          static void vt_sparkit(int x, int z) {
              int bounce = 0;
              int left_lift = 0;
              int right_lift = 0;

              if (vt_walk_phase != 0) {
                  if (
                      vt_walk_phase >= 8 &&
                      vt_walk_phase < 24
                  ) {
                      bounce = 5;
                  }

                  if (vt_walk_phase < 16) {
                      left_lift = 5;
                  } else {
                      right_lift = 5;
                  }
              }

              /* Body */
              draw_box(
                  x, 20 - bounce, z, 14,
                  238, 181, 38
              );

              /* Head */
              draw_box(
                  x, 2 - bounce, z - 4, 12,
                  255, 211, 65
              );

              /* Ears */
              vt_pyramid(
                  x - 10, -6 - bounce, z - 3,
                  7, 23, 255, 203, 42
              );

              vt_pyramid(
                  x + 10, -6 - bounce, z - 3,
                  7, 23, 255, 203, 42
              );

              /* Eyes */
              draw_box(
                  x - 6, -1 - bounce, z - 14,
                  3, 22, 31, 52
              );

              draw_box(
                  x + 6, -1 - bounce, z - 14,
                  3, 22, 31, 52
              );

              /* Electric tail */
              draw_box(
                  x + 19, 18 - bounce, z + 5,
                  7, 244, 148, 25
              );

              /* Animated feet */
              draw_box(
                  x - 8,
                  34 - bounce - left_lift,
                  z - 2,
                  5, 180, 110, 35
              );

              draw_box(
                  x + 8,
                  34 - bounce - right_lift,
                  z - 2,
                  5, 180, 110, 35
              );
          }

          '''

          code = code[:start] + sparkit + code[end:]

          # Animate only when the D-pad is pressed.
          replace_once(
              "        draw_ground();",
              """
          if (
            game_mode == 0 &&
            (pad & (PAD_LEFT | PAD_RIGHT | PAD_UP | PAD_DOWN))
          ) {
            vt_walk_phase = (vt_walk_phase + 1) & 31;
          } else {
            vt_walk_phase = 0;
          }

          draw_ground();
              """.rstrip()
          )

          # More recognizable features for Mosslet.
          start = code.index("static void vt_mosslet(")
          end = code.index("static void vt_draw_panel(", start)

          mosslet = code[start:end]
          closing = mosslet.rfind("}")

          if closing < 0:
              raise RuntimeError("Mosslet model invalid")

          extra = r'''
              /* Leaf crest */
              vt_pyramid(
                  x, -13, z + 1,
                  11, 19,
                  49, 170, 78
              );

              /* Small feet */
              draw_box(
                  x - 10, 38, z,
                  6, 40, 113, 54
              );

              draw_box(
                  x + 10, 38, z,
                  6, 40, 113, 54
              );
          '''

          mosslet = (
              mosslet[:closing] +
              extra + "\n" +
              mosslet[closing:]
          )

          code = code[:start] + mosslet + code[end:]

          # Add trees and smaller foreground plants.
          replace_once(
              "              vt_gate(335);",
              """
              /* More vegetation */
              vt_tree(-185, 145);
              vt_tree(185, 155);
              vt_tree(-230, 405);
              vt_tree(230, 420);

              vt_pyramid(
                  -88, 29, 205,
                  15, 18,
                  38, 138, 68
              );

              vt_pyramid(
                  88, 29, 205,
                  15, 18,
                  42, 151, 72
              );

              /* Slightly closer arena gate */
              vt_gate(310);
              """.rstrip()
          )

          # Additional crystals.
          replace_once(
              "                  vt_crystal(-90, 235);",
              """
                  vt_crystal(-90, 235);
                  vt_crystal(-170, 185);
                  vt_crystal(170, 205);
              """.rstrip()
          )

          # Verify essential features are still present.
          checks = [
              "VOLT TRAIL V13",
              "vt_walk_phase",
              "gte_SetGeomScreen(225)",
              "FntFlush(0);",
              "FntFlush(1);",
              "vt_play_intro();"
          ]

          for marker in checks:
              if marker not in code:
                  raise RuntimeError(
                      "Required feature missing: " + marker
                  )

          path.write_text(code, encoding="utf-8")

          print("V13 graphics successfully applied")
          print("Sparkit walking animation added")
          print("Mosslet details added")
          print("Camera and vegetation improved")
          print("V12 intro and gameplay preserved")
          PY

      - name: Install PSn00bSDK
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          import yaml

          path = Path(os.environ["RUNNER_TEMP"]) / "v12.yml"
          steps = yaml.safe_load(path.read_text())["jobs"]["build"]["steps"]

          matches = [
              step for step in steps
              if step.get("name") == "Download PSn00bSDK"
          ]

          if len(matches) != 1:
              raise RuntimeError("V12 SDK setup not found")

          subprocess.run(
              ["bash", "-euo", "pipefail", "-c", matches[0]["run"]],
              check=True,
              env=os.environ.copy()
          )
          PY

      - name: Build Volt Trail V13
        shell: bash
        run: |
          set -euxo pipefail

          cmake -S "$PROJECT_DIR" \
            -B "$GITHUB_WORKSPACE/build" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PSN00BSDK_CMAKE" \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build "$GITHUB_WORKSPACE/build" --verbose

      - name: Collect PS1 files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          for file in VTRAIL.bin VTRAIL.cue VTRAIL.exe VTRAIL.elf; do
            SOURCE="$GITHUB_WORKSPACE/build/$file"

            if [ ! -s "$SOURCE" ]; then
              echo "::error::Missing PS1 file: $file"
              exit 1
            fi

            cp "$SOURCE" "$GITHUB_WORKSPACE/artifacts/"
          done

          ls -lh "$GITHUB_WORKSPACE/artifacts"

      - name: Upload Volt Trail V13
        uses: actions/upload-artifact@v4
        with:
          name: VoltTrail-PS1-V13-Animated-World
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
