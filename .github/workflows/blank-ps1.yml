name: LWOD Android V41.7 FIX6 Stadtverteilung und Kartenrenderer Reparatur
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/blank-ps1.yml
permissions:
  contents: read
jobs:
  android:
    name: LWOD Android V41.7 FIX6 APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: barichello/godot-ci:4.7.2
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: /usr/lib/android-sdk
    steps:
    - name: Repository laden
      uses: actions/checkout@v4
    - name: Python 3 und PyYAML zuerst installieren
      shell: bash
      run: "set -euo pipefail\n# The Godot CI container may not ship python3; bootstrap it before V41.6 replay.\nif ! command\
        \ -v python3 >/dev/null 2>&1 || ! python3 -c 'import yaml' >/dev/null 2>&1; then\n  apt-get update -qq\n  DEBIAN_FRONTEND=noninteractive\
        \ apt-get install -y -qq python3 python3-yaml\nfi\npython3 -c 'import yaml, sys; print(\"V417_FIX2_PYTHON_OK\", sys.version.split()[0],\
        \ yaml.__version__)'\n"
    - name: Stabiles V41.6-Spiel wiederherstellen
      shell: bash
      run: "set -euo pipefail\n# Freeze the confirmed working V41.6 version; this is only a source for replaying the original\
        \ build steps.\nwget --quiet --tries=3 --timeout=60 --https-only -O \"$RUNNER_TEMP/lwod_v416.yml\" \\\n  'https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/0f29ac00fe9a7a2037ed39b8df994a37fd0672f8/.github/workflows/blank-ps1.yml'\n\
        python3 - <<'PYREPLAY'\nimport hashlib,os,subprocess\nfrom pathlib import Path\np=Path(os.environ['RUNNER_TEMP'])/'lwod_v416.yml'\n\
        data=p.read_bytes()\nsha=hashlib.sha1(('blob %d\\0'%len(data)).encode()+data).hexdigest()\nif sha!='9331c8c07ba758bda5dc9ec6068534330e7dc3b8':\n\
        \    raise SystemExit('V41.6 Basis-Workflow hat eine unerwartete Prüfsumme')\ntry:\n    import yaml\nexcept ImportError:\n\
        \    subprocess.run(['apt-get','update','-qq'],check=True)\n    subprocess.run(['apt-get','install','-y','-qq','python3-yaml'],check=True)\n\
        \    import yaml\nsteps=yaml.safe_load(data)['jobs']['android']['steps']\nif len(steps)!=16 or 'V41.6' not in steps[10]['name']:\n\
        \    raise SystemExit('V41.6 Installationsschritte haben sich unerwartet verändert')\nfor i in range(1,13):\n    step=steps[i]\n\
        \    print('WIEDERHERSTELLEN',i,step['name'],flush=True)\n    subprocess.run(['timeout','--signal=TERM','--kill-after=5s','1200s','bash','-e','-o','pipefail','-c',step['run']],check=True)\n\
        print('V416_BASIS_OK',flush=True)\nPYREPLAY"
