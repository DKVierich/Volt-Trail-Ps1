        \ 51 ausfuehren ==='\nprintf '%s\\n' 'FIX27: volle Kompilierausgabe unter artefakte/FIX25_BUILD_LOG.txt'\npython3 \"$RUNNER_TEMP/lydra_v3185_replay.py\"\
