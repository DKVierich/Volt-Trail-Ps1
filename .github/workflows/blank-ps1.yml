    - Name: FIX35 HD PS1 640x240 Framebuffer und 3D Projektion
      Shell: Bash
      run: "set -euo pipefail\npython3 - <<'PY_FIX35_HD'\nimport os,re\nfrom pathlib import Path\nwidth=int(os.environ.get('LWOD_VIDEO_WIDTH','640'))\n\
        wenn Breite nicht in (320.640):\n raise SystemExit('FIX35: Nur 320 oder 640 Pixel native PS1-Breite erlaubt')\nroot=Path(os.environ['PROJECT_DIR'])\n\
        path=root/'src'/'main.c'\nif not path.is_file():\n raise SystemExit('FIX35: Das Hauptprogramm src/main.c fehlt')\ns=path.read_text(encoding='utf-8')\n\
        report=['LWOD FIX35 HD - PS1 3D-Auflösung',\n 'Angeforderter Modus: %dx240 progressiv'%width,\n 'Original C-Datei:\
        \ %d Zeichen'%len(s)]\nif width==320:\n report.append('Standard 320x240 unveränderlich (höchste Kompatibilität).')\nelse:\n\
        # Native PS1-Modi: 640 Pixel breit bei 240 progressiven Zeilen.\n # Vertikales Framebuffer-Layout verwendet VRAM x=0..639 und\
        y=0..479,\n # x>=640 bleibt für die ursprünglichen Intro-/Menü-Texturseiten verfügbar.\n patterns=[\n ('SCREEN_W',r'(?m)^(\\\
        s*#\\s*define\\s+SCREEN_W\\s+)320(?=\\s|$)'),\n ]\n for label,regex in patterns:\ns,n=re.subn(regex,lambda m:m.group(1)+'640',s)\n\
        \ if n!=1:\n raise SystemExit('FIX35: '+label+' nicht eindeutig 320; ungeprueften PS1-Patch abgebrochen (Treffer\
        \ %d)'%n)\n screen_h=re.search(r'(?m)^\\s*#\\s*define\\s+SCREEN_H\\s+\\(?240\\)?(?=\\s|$)',s)\n if not screen_h:\n \
        \ raise SystemExit('FIX35: SCREEN_H ist nicht 240; keine VRAM-Risiken eingehen')\n\n # Nur das Gameplay's disp[]/draw[]\
        \ arrays, never intro_disp/intro_draw.\n # Halte die Framebuffer getrennt und innerhalb des 1024x512 VRAM der PS1.\n for kind\
        \ in ('Disp','Draw'):\n for index in (0,1):\n pattern=(r'\\bSetDef%sEnv\\s*\\(\\s*&\\s*%s\\s*\\[\\s*%s\\s*\\\
        ]\\s*,[^;]*?\\)\\s*;'\n %(kind,('disp' if kind=='Disp' else 'draw'),index))\n matches=list(re.finditer(pattern,s,flags=re.S))\n\
        \ if len(matches)!=1:\n raise SystemExit('FIX35: SetDef%sEnv %s[%d] erwartet 1 Treffer, fand %d; Original\
        \ unveraendert.'\n %(kind,('disp' if kind=='Disp' else 'draw'),index,len(matches)))\n \
        # db0: oben anzeigen, unten zeichnen; db1: unten anzeigen, oben zeichnen.\ny=(index*240) wenn kind=='Disp' sonst ((1-index)*240)\n\
        \ replacement='SetDef%sEnv(&%s[%d], 0, %d, SCREEN_W, SCREEN_H);'%(kind,('disp' if kind=='Disp' else 'draw'),index,y)\n\
        \ s=s[:matches[0].start()]+replacement+s[matches[0].end():]\n report.append(replacement)\n\n # On 3D\
        Geometrie, die Projektionsskalierung erweitern, anstatt lediglich schwarzen Raum rechts neben der 320px-Szene hinzuzufügen.\n
        def adjust_geom_screen(m):\n val=int(m.group(2))\n if val>2048:\n raise SystemExit('FIX35: Unerwarteter\
        \ GTE Projektionswert '+str(val))\n return m.group(1)+str(val*2)+m.group(3)\ns, projection_count=re.subn(r'(\\bgte_SetGeomScreen\\\
        s*\\(\\s*)(\\d+)(\\s*\\))',adjust_geom_screen,s)\n # Nur fest codierte 160px-Mitte anpassen, makrobasierte Mitte folgt SCREEN_W.\n\
        \ s,center_count=re.subn(r'\\bgte_SetGeomOffset\\s*\\(\\s*160\\s*,\\s*120\\s*\\)',\n 'gte_SetGeomOffset(320,\
        \ 120)',s)\n if projection_count==0:\n raise SystemExit('FIX35: Kein statischer GTE Projektionswert gefunden; Szene\
        \ nicht sicher skaliert')\n if center_count==0 and not re.search(r'gte_SetGeomOffset\\s*\\([^;]*SCREEN_W',s):\n raise\
        \ SystemExit('FIX35: GTE Bildschirmmitte nicht erkannt; Szene nicht sicher zentriert')\n report += ['GTE-Projektionsaufrufe\
        \ vergroessert: '+str(projection_count),\n 'Direkte 160->320 GTE-Mittenkorrekturen: '+str(center_count),\n \
        \ 'Ergebnis: native 640x240, doppelte horizontale Pixelzahl.']\n # Berühren Sie keine festen 320x240 Intro-Bilder; einheimisch\
        Der 3D-Modus wurde geändert,\n # RetroArch-Upscaling bietet eine noch höhere wahrgenommene 3D-Qualität.\n path.write_text(s,encoding='utf-8')\n
        # Überprüfen, ob die bearbeiteten Aufrufe in der geschriebenen Datei vorhanden sind; nicht stillschweigend fortfahren.\np=path.read_text(encoding='utf-8')\n
        \ for token in ['#define SCREEN_W 640',\n 'SetDefDispEnv(&disp[0], 0, 0, SCREEN_W, SCREEN_H);',\n \
        'SetDefDispEnv(&disp[1], 0, 240, SCREEN_W, SCREEN_H);',\n 'SetDefDrawEnv(&draw[0], 0, 240, SCREEN_W,\
        \ SCREEN_H);',\n 'SetDefDrawEnv(&draw[1], 0, 0, SCREEN_W, SCREEN_H);']:\n if token not in p:\n \
        \ raise SystemExit('FIX35: Ausgabepruefung nicht bestanden: '+token)\nartifacts=Path('artifacts')\nartifacts.mkdir(exist_ok=True)\n\
        (artifacts/'FIX35_AUFLOESUNG.txt').write_text('\\n'.join(report)+'\\n',encoding='utf-8')\nprint('\\n'.join(report),flush=True)\n\
        PY_FIX35_HD"
