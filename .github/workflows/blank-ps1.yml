# LWOD FIX35 HD | Kompakter Workflow für praktisch.
Name: LWOD FIX35 HD - PS1 640x240 Grafik und FIX33 Modelle
'An':
  Workflow-Versand:
    Eingaben:
      Videobreite:
        Beschreibung: 'Native PS1-Bildbreite: 640 HD oder 320 stabil'
        Erforderlich: Ja
        Standardwert: '640'
        Typ: Auswahl
        Optionen:
        - '640'
        - '320'
  drücken:
    Zweige:
    - hauptsächlich
    Pfade:
    - .github/workflows/blank-ps1.yml
    - .github/workflows/LWOD_FIX35_HD.yml
Berechtigungen:
  Inhalt: lesen
Jobs:
  bauen:
    läuft auf: ubuntu-latest
    Schritte:
    - Name: Quellprojekt auschecken
      Verwendung: actions/checkout@v4
    - Name: Werkzeuge installieren
      Shell: Bash
      Ausführen: 'set -euo pipefail

        sudo apt-get update

        sudo apt-get install -y cmake ninja-build unzip curl ffmpeg python3-pil python3-yaml

        '
    - Name: FIX35 Originalbasis sicher laden und verifizieren
      Shell: Bash
      run: "set -euo pipefail\nFIX32_URL=\"https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/c8b67d5645df4cf58e5ff8cdc07f5b623c76db96/.github/workflows/blank-ps1.yml\"\
        \ncurl --fail --location --silent --show-error --retry 3 \"$FIX32_URL\" -o \"$RUNNER_TEMP/LWOD_FIX32_PINNED.yml\"\npython3 -\
        \ <<'PY_LWOD_LOAD'\nfrom pathlib import Path\nimport os, hashlib, yaml, json\np=Path(os.environ['RUNNER_TEMP'])/'LWOD_FIX32_PINNED.yml'\n\
        b=p.read_bytes()\nactual=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\\0'+b).hexdigest()\nexpected='34a7d142602d6fc5c48a682aeec5f0508e372c9a'\n\
        if fact!=expected:\n raise SystemExit('FIX32 Referenz-Datei stimmt nicht mehr: '+actual)\ns=yaml.safe_load(b)['jobs']['build']['steps']\n\
        if len(s)!=64 or any('run' not in s[i] for i in range(3,55)):\n raise SystemExit('FIX32 Basis-Workflow unvollstaendig')\n\
        (Path(os.environ['RUNNER_TEMP'])/'LWOD_FIX35_REPLAY.json').write_text(\n json.dumps([{'name':s[i]['name'],'run':s[i]['run']}\
        \ for i in range(3,55)],ensure_ascii=False),encoding='utf8')\nprint('FIX34: Original-FIX32-Basis mit 52 unveraenderten Schritten\
        \ verifiziert.')\nprint('Die aktuellen FIX33-Grafikpatches werden danach separat ausgefuehrt.')\nPY_LWOD_LOAD\n"
    - Name: FIX35 Basis 03-14 - PS1-Grundlage und Compiler vorbereiten
      Shell: Bash
      run: "set -euo pipefail\npython3 - <<'PY_LWOD_REPLAY'\nfrom pathlib import Path\nimport os,json,subprocess\nsteps=json.loads((Path(os.environ['RUNNER_TEMP'])/'LWOD_FIX35_REPLAY.json').read_text(encoding='utf8'))\n\
        for index in range(3,14+1):\n entry=steps[index-3]\n print(f'LWOD BASIS {index:02d}/54: {entry[\"name\"]}',flush=True)\n\
        \ status=subprocess.run(['bash','-euo','pipefail','-c',entry['run']]).returncode\n if status:\n raise SystemExit(f'PS1-Basisschritt\
        \ {index} fehlgeschlagen: {entry[\"name\"]} (Exit {status})')\nprint('Alle Schritte dieser Basisgruppe erfolgreich.',flush=True)\n\
        PY_LWOD_REPLAY\n"
