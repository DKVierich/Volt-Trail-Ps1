    - name: V40.9.2 FIX1 Sonnental Modellkopien und Modelltest korrigieren
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYFIX1'
        from pathlib import Path
        model = Path('android/scripts/V408Regions.gd')
        test = Path('android/tests/V4092SonnentalModelsSmoke.gd')
        assert model.is_file() and test.is_file(), 'V40.9.2 Dateien nicht gefunden'
        current = model.read_text(encoding='utf-8')
        old = '            image.name = "SonnentalModell"\n'
        new = ('            image.name = "SonnentalModell_%03d" % (cloned + 1)\n'
               '            image.set_meta("lwod_sonnental_clone", true)\n')
        assert current.count(old) == 1, 'Sonnental Mesh-Kopierstelle unerwartet'
        model.write_text(current.replace(old, new), encoding='utf-8')
        current = test.read_text(encoding='utf-8')
        old = ('    var count: int = 1 if root is MeshInstance3D and '
               'String(root.name)=="SonnentalModell" else 0\n')
        new = ('    var count: int = 1 if root is MeshInstance3D '
               'and root.has_meta("lwod_sonnental_clone") '
               'and (root as MeshInstance3D).mesh != null else 0\n')
        assert current.count(old) == 1, 'Sonnental Teststelle unerwartet'
        test.write_text(current.replace(old, new), encoding='utf-8')
        assert 'SonnentalModell_%03d' in model.read_text(encoding='utf-8')
        assert 'root.has_meta("lwod_sonnental_clone")' in test.read_text(encoding='utf-8')
        print('V4092_FIX1_PATCH_OK: eindeutige Modellnamen, Mesh-Marker und stabile Erkennung')
        PYFIX1
