        matches = list(re.finditer(rx, s, re.S))
        if len(matches) != 1:
            raise RuntimeError(f'Need exactly one old START draw function, found {len(matches)}')
        a = matches[0].start()
        b = matches[0].end()
        depth = 1
        state = 'code'
        while b < len(s) and depth:
            c = s[b]
            n = s[b + 1] if b + 1 < len(s) else ''
            if state == 'code':
                if c == '/' and n == '/':
                    state = 'line'; b += 1
                elif c == '/' and n == '*':
                    state = 'block'; b += 1
                elif c == '"':
                    state = 'str'
                elif c == "'":
                    state = 'char'
                elif c == '{':
                    depth += 1
                elif c == '}':
                    depth -= 1
            elif state == 'line':
                if c == '\n':
                    state = 'code'
            elif state == 'block':
                if c == '*' and n == '/':
                    state = 'code'; b += 1
            elif state in ('str', 'char'):
                if c == '\\':
                    b += 1
                elif (state == 'str' and c == '"') or (state == 'char' and c == "'"):
                    state = 'code'
            b += 1
        if depth:
            raise RuntimeError('Old START function has unbalanced braces')

        # Built-in Ubuntu fonts; sampled into literal small PS1 GPU rectangles. This
        # does not import or display a separate picture and does not touch the logo art.
        font_candidates = [
            '/usr/share/fonts/truetype/liberation2/LiberationSerif-Regular.ttf',
            '/usr/share/fonts/truetype/liberation/LiberationSerif-Regular.ttf',
            '/usr/share/fonts/truetype/dejavu/DejaVuSerif.ttf'
        ]
        font_file = next((f for f in font_candidates if Path(f).is_file()), None)
        if font_file is None:
            raise RuntimeError('No TTF serif font installed on the GitHub Ubuntu runner')
        font = ImageFont.truetype(font_file, 21)
        bbox = font.getbbox('START')
        width, height = bbox[2] - bbox[0], bbox[3] - bbox[1]
        if not 50 <= width <= 80 or not 10 <= height <= 20:
            raise RuntimeError(f'Unexpected START dimensions {width}x{height}')
        canvas = Image.new('L', (width, height), 0)
        draw = ImageDraw.Draw(canvas)
        draw.text((-bbox[0], -bbox[1]), 'START', font=font, fill=255)

        # Runs of opaque pixels yield crisp, compact geometry without large block font.
        pixels = canvas.load()
        runs = []
        for y in range(height):
            x = 0
            while x < width:
                if pixels[x, y] < 100:
                    x += 1
                    continue
                start = x
                while x < width and pixels[x, y] >= 100:
                    x += 1
                runs.append((start, y, x - start))
        if not 30 < len(runs) < 250:
            raise RuntimeError(f'Unusual serif font raster {len(runs)} runs')

