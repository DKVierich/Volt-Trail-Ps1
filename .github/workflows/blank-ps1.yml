          # Camera framing: minimize the steep elevation that pushed avatar below roofs.
          # The occlusion-aware low foundations above keep the player visually readable.
          once('camera_rot.vx = 104 + vt_v28_camera_blend;',
               'camera_rot.vx = 104 + vt_v28_camera_blend / 3;')
          once('camera_pos.vy = 62 + vt_v28_camera_blend / 2;',
               'camera_pos.vy = 62 + vt_v28_camera_blend / 3;')

          # A little amber scale glint for Sparkit, but keep its original animation.
          append_function('vt_sparkit', r'''
              /* V29: warm glint matching the reference fantasy color palette. */
              vt_pyramid(x, -17-bounce/4, z+16, 5, 10, 250, 217, 99);
