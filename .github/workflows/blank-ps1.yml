        RUNNER_TEMP\"])/\"lydra_v3185_replay_steps.json\"\ns=json.loads(p.read_text(encoding=\"utf-8\"))\ni=int(sys.argv[1])\n\
        if i<2 or i>54 or not isinstance(s[i],str):\n    raise RuntimeError(\"Invalid base step: \"+str(i))\nsubprocess.run([\"\
