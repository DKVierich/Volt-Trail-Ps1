name: LWOD Android V40.3 FIX4 Marktplatz
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/lwod-android.yml
    - .github/workflows/blank-ps1.yml
permissions:
  contents: read
jobs:
  android:
    name: LWOD Android V40.3 FIX4 APK
    runs-on: ubuntu-latest
    timeout-minutes: 55
    container:
      image: barichello/godot-ci:4.7.2
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: /usr/lib/android-sdk
    steps:
    - name: Repository laden
      uses: actions/checkout@v4
    - name: V40.2 Grundlage inkl. FIX4 Dateien kompakt wiederherstellen
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/lwod_fix3"
        cat <<'LWOD_FIX4_PACKAGE' | base64 -d > "$RUNNER_TEMP/lwod_fix3.tar.gz"
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        LWOD_FIX4_PACKAGE
        printf '%s  %s\n' 'edd9d456694049aee1de56de6c503c686d2cabb1d738354cea054ac5ef7a25a6' "$RUNNER_TEMP/lwod_fix3.tar.gz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/lwod_fix3.tar.gz" -C "$RUNNER_TEMP/lwod_fix3"
        for n in $(seq -w 1 22); do
          file="$RUNNER_TEMP/lwod_fix3/base/$n.sh"
          bash -n "$file"
          echo "::group::V40.2 Grundlage $n/22"
          if bash "$file" > "$RUNNER_TEMP/lwod_fix3/base_$n.log" 2>&1; then
            tail -n 10 "$RUNNER_TEMP/lwod_fix3/base_$n.log"
          else
            cat "$RUNNER_TEMP/lwod_fix3/base_$n.log"
            echo "::error::V40.2 Grundlage Schritt $n fehlgeschlagen"
            exit 1
          fi
          echo "::endgroup::"
        done
    - name: FIX4 Brunnen zentrieren alte Reste entfernen und drei Haendler einsetzen
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p android/scripts android/tests
        cp "$RUNNER_TEMP/lwod_fix3/assets/V403Fix4Sonnental.gd" android/scripts/V403Fix4Sonnental.gd
        cp "$RUNNER_TEMP/lwod_fix3/assets/V403Fix4Smoke.gd" android/tests/V403Fix4Smoke.gd
        printf '%s  %s\n' 'dbeeae44a021d836c3f9d3dc425b768dc71d802d533f2989a321dfbb72c75921' 'android/scripts/V403Fix4Sonnental.gd' | sha256sum -c -
        printf '%s  %s\n' '2670766a04d43ca4ed2cf949bfdb2640ee4679613b6af979a3c6967e97119857' 'android/tests/V403Fix4Smoke.gd' | sha256sum -c -
        # Additive Fix3-Szene startet nach V40.2; Quest-/Save-Implementierung unveraendert.
        test "$(grep -Fxc '    v402.setup(self)' android/scripts/Main.gd)" -eq 1
        awk '
          {print}
          $0 == "    v402.setup(self)" {
            print "    var v403_fix4 = load(\"res://scripts/V403Fix4Sonnental.gd\").new()"
            print "    add_child(v403_fix4)"
            print "    v403_fix4.setup(self)"
            found++
          }
          END {if(found != 1) exit 43}
        ' android/scripts/Main.gd > "$RUNNER_TEMP/main_fix3.gd"
        test -s "$RUNNER_TEMP/main_fix3.gd"
        mv "$RUNNER_TEMP/main_fix3.gd" android/scripts/Main.gd
        grep -Fqx '    v403_fix4.setup(self)' android/scripts/Main.gd
        sed -i 's@version/code=41@version/code=43@; s@version/name="4.0.2"@version/name="4.0.3.4"@' android/export_presets.cfg
        grep -Fqx 'version/code=43' android/export_presets.cfg
        grep -Fqx 'version/name="4.0.3.4"' android/export_presets.cfg
        echo 'V40.3 FIX4: Sonnental mit Brunnen in Mitte, 3 Staenden und 3 Haendlern; 36 andere Siedlungen unveraendert.'
    - name: Godot Ressourcen importieren
      shell: bash
      run: |
        set -euo pipefail
        godot --headless --path android --editor --import --quit
        test -s android/scripts/V24Regions.gd
        test -s android/scripts/V25BiomeWorld.gd
        test -s android/scripts/V26SkyWorldMap.gd
        test -s android/scripts/V27Terrain.gd
        test -s android/scripts/V27WorldMap.gd
        test -s android/scripts/V27CameraMap.gd
        test -s android/scripts/V28DualStick.gd
        test -s android/scripts/V29IndependentSticks.gd
        test -s android/scripts/V30MovementRepair.gd
        test -s android/scripts/V31TerrainMotion.gd
        test -s android/scripts/V32TouchRouter.gd
        test -s android/scripts/V33TouchCamera.gd

        test -s android/scripts/V38VillageLife.gd

        test -s android/tests/V39NPCSmoke.gd
        test -s android/scripts/V40Sonnental.gd
        test -s android/tests/V40SonnentalSmoke.gd
        test -s android/scripts/V402CharacterHUD.gd
        test -s android/tests/V402CharacterSmoke.gd

        test -s android/scripts/V403Fix4Sonnental.gd
        test -s android/tests/V403Fix4Smoke.gd
    - name: Bisherige Godot-Tests V31 bis V40.2 unveraendert ausfuehren
      shell: bash
      run: |
        set -euo pipefail
        for n in 01 02 03 04 05 06 07 08; do
          file="$RUNNER_TEMP/lwod_fix3/tests/$n.sh"
          bash -n "$file"
          echo "::group::V40.2 Regressionstest $n/8"
          if bash "$file" > "$RUNNER_TEMP/lwod_fix3/test_$n.log" 2>&1; then
            tail -n 8 "$RUNNER_TEMP/lwod_fix3/test_$n.log"
          else
            cat "$RUNNER_TEMP/lwod_fix3/test_$n.log"
            echo "::error::Regressionstest $n ist fehlgeschlagen"
            exit 1
          fi
          echo "::endgroup::"
        done
    - name: V40.3 FIX4 Sonnental und drei Haendler automatisch testen
      shell: bash
      run: |
        set -euo pipefail
        godot --headless --path android --script res://tests/V403Fix4Smoke.gd > "$RUNNER_TEMP/v403_fix4_smoke.log" 2>&1 || {
          cat "$RUNNER_TEMP/v403_fix4_smoke.log"
          exit 1
        }
        cat "$RUNNER_TEMP/v403_fix4_smoke.log"
        grep -Fq 'V403_FIX4_TEST_OK:' "$RUNNER_TEMP/v403_fix4_smoke.log"
    - name: LWOD Android V40.3 FIX4 APK erstellen
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p build/android
        godot --headless --path android --export-debug 'Android' \
          "$GITHUB_WORKSPACE/build/android/LWOD-Android-V40.3-FIX4-Markt.apk"
        test -s build/android/LWOD-Android-V40.3-FIX4-Markt.apk
        unzip -t build/android/LWOD-Android-V40.3-FIX4-Markt.apk > /dev/null

        echo "APK wurde erzeugt:"
        ls -lh build/android/LWOD-Android-V40.3-FIX4-Markt.apk
    - name: Fehlerdiagnose bereitstellen
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: LWOD_V40_3_FIX4_DIAGNOSE
        path: 'android/scripts/Main.gd

          android/scripts/V403Fix4Sonnental.gd

          android/tests/V403Fix4Smoke.gd

          ${{ runner.temp }}/v403_fix4_smoke.log

          ${{ runner.temp }}/lwod_fix3/base_*.log'
        if-no-files-found: warn
        retention-days: 14
    - name: LWOD Android V40.3 FIX4 APK hochladen
      uses: actions/upload-artifact@v4
      with:
        name: LWOD_ANDROID_V40_3_FIX4_APK
        path: build/android/LWOD-Android-V40.3-FIX4-Markt.apk
        if-no-files-found: error
        retention-days: 14
