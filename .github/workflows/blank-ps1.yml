
name: Build Volt Trail PS1 V14 3D Characters

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install required tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build unzip curl jq tar \
            ffmpeg python3-pil python3-yaml

      - name: Prepare working V13 project
        shell: bash
        run: |
          set -euo pipefail

          V13_COMMIT="ae833b495606ae72abfb53ef4fd65a95f9a51e50"

          curl --retry 3 -fsSL \
            "https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/$V13_COMMIT/.github/workflows/blank-ps1.yml" \
            -o "$RUNNER_TEMP/v13.yml"

          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          import yaml

          path = Path(os.environ["RUNNER_TEMP"]) / "v13.yml"
          data = yaml.safe_load(path.read_text())
          steps = data["jobs"]["build"]["steps"]

          wanted = "Prepare project and V12 backup"
          matches = [
              step for step in steps
              if step.get("name") == wanted
          ]

          if len(matches) != 1:
              raise RuntimeError("V13 preparation missing")

          subprocess.run(
              ["bash", "-euo", "pipefail", "-c", matches[0]["run"]],
              env=os.environ.copy(),
              check=True
          )

          print("V13 project preparation completed")
          PY

      - name: Restore V13 intro and gameplay
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          import yaml

          path = Path(os.environ["RUNNER_TEMP"]) / "v13.yml"
          data = yaml.safe_load(path.read_text())
          steps = data["jobs"]["build"]["steps"]

          wanted_steps = [
              "Restore working V12 game and intro",
              "Apply V13 camera and 3D animation"
          ]

          for wanted in wanted_steps:
              matches = [
                  step for step in steps
                  if step.get("name") == wanted
              ]

              if len(matches) != 1:
                  raise RuntimeError(
                      "Required V13 step missing: " + wanted
                  )

              print("Running:", wanted, flush=True)

              subprocess.run(
                  ["bash", "-euo", "pipefail", "-c", matches[0]["run"]],
                  env=os.environ.copy(),
                  check=True
              )

          print("V13 intro, controls and gameplay restored")
          PY

      - name: Apply V14 graphics and characters
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path

          path = (
              Path(os.environ["PROJECT_DIR"])
              / "src"
              / "main.c"
          )

          code = path.read_text(encoding="utf-8")

          def replace_once(old, new):
              global code

              count = code.count(old)
              if count != 1:
                  raise RuntimeError(
                      "V14 source marker not found: "
                      + old[:80]
                      + " (matches: "
                      + str(count)
                      + ")"
                  )

              code = code.replace(old, new, 1)

          # Update the version number.
          replace_once(
              "VOLT TRAIL V13 - %s",
              "VOLT TRAIL V14 - %s"
          )

          # Slightly closer camera.
          replace_once(
              "gte_SetGeomScreen(225);",
              "gte_SetGeomScreen(235);"
          )

          # Create a detailed, animated player.
          player_code = r'''
          static void vt_player(int x, int z) {
              int stride = 0;

              if (vt_walk_phase != 0) {
                  stride = vt_walk_phase < 16 ? 5 : -5;
              }

              /* Blue shirt and jacket. */
              draw_box(
                  x, 19, z,
                  12, 45, 101, 211
              );

              /* Human head. */
              draw_box(
                  x, -1, z - 2,
                  9, 231, 179, 129
              );

              /* Brown hair. */
              draw_box(
                  x, -11, z - 1,
                  9, 79, 49, 32
              );

              /* Left arm. */
              draw_box(
                  x - 17, 18 + stride, z,
                  5, 54, 116, 223
              );

              /* Right arm. */
              draw_box(
                  x + 17, 18 - stride, z,
                  5, 54, 116, 223
              );

              /* Hands. */
              draw_box(
                  x - 17, 27 + stride, z,
                  4, 222, 171, 126
              );

              draw_box(
                  x + 17, 27 - stride, z,
                  4, 222, 171, 126
              );

              /* Animated trousers and legs. */
              draw_box(
                  x - 7, 36 - stride, z,
                  6, 35, 52, 109
              );

              draw_box(
                  x + 7, 36 + stride, z,
                  6, 35, 52, 109
              );

              /* Shoes. */
              draw_box(
                  x - 7, 46 - stride, z - 3,
                  5, 47, 42, 43
              );

              draw_box(
                  x + 7, 46 + stride, z - 3,
                  5, 47, 42, 43
              );
          }
          '''

          # Insert the new player function
          # before Mosslet's function.
          replace_once(
              "static void vt_mosslet(",
              player_code + "\nstatic void vt_mosslet("
          )

          # Replace the old two-box player.
          start_marker = (
              "/* Player marker and detailed V12 creatures. */"
          )

          if code.count(start_marker) != 1:
              raise RuntimeError("Old player section not found")

          start = code.index(start_marker)

          # Find the existing Sparkit call in this scene.
          end = code.index(
              "              vt_sparkit(",
              start
          )

          new_scene = (
              "/* Animated V14 player model. */\n"
              "              vt_player(px, pz + 73);\n\n"
          )

          code = (
              code[:start]
              + new_scene
              + code[end:]
          )

          # Add more features to Sparkit's face.
          spark_start = code.index(
              "static void vt_sparkit(int x, int z) {"
          )
          spark_end = code.index(
              "static void vt_player(",
              spark_start
          )

          spark = code[spark_start:spark_end]
          closing = spark.rfind("}")

          if closing < 0:
              raise RuntimeError("Sparkit function invalid")

          spark_details = r'''
              /* Small orange cheek markings. */
              draw_box(
                  x - 12, 6 - bounce, z - 13,
                  3, 244, 111, 42
              );

              draw_box(
                  x + 12, 6 - bounce, z - 13,
                  3, 244, 111, 42
              );
          '''

          spark = (
              spark[:closing]
              + spark_details
              + "\n"
              + spark[closing:]
          )

          code = (
              code[:spark_start]
              + spark
              + code[spark_end:]
          )

          # Add more details to Mosslet.
          moss_start = code.index(
              "static void vt_mosslet("
          )
          moss_end = code.index(
              "static void vt_draw_panel(",
              moss_start
          )

          moss = code[moss_start:moss_end]
          closing = moss.rfind("}")

          if closing < 0:
              raise RuntimeError("Mosslet function invalid")

          moss_details = r'''
              /* Dark eyes. */
              draw_box(
                  x - 6, 1, z - 17,
                  3, 19, 37, 31
              );

              draw_box(
                  x + 6, 1, z - 17,
                  3, 19, 37, 31
              );

              /* Extra leaf details. */
              vt_pyramid(
                  x - 15, 5, z + 4,
                  8, 17, 50, 159, 67
              );

              vt_pyramid(
                  x + 15, 5, z + 4,
                  8, 17, 50, 159, 67
              );
          '''

          moss = (
              moss[:closing]
              + moss_details
              + "\n"
              + moss[closing:]
          )

          code = (
              code[:moss_start]
              + moss
              + code[moss_end:]
          )

          # Add more scenery near the path.
          extra_scenery = (
              "vt_gate(310);\n"
              "              vt_tree(-210, 115);\n"
              "              vt_tree(210, 125);\n"
              "              vt_tree(-230, 355);\n"
              "              vt_tree(230, 365);\n"
              "\n"
              "              /* Door and window details. */\n"
              "              draw_box(\n"
              "                  -108, 15, 246, 9,\n"
              "                  49, 60, 113\n"
              "              );\n"
              "              draw_box(\n"
              "                  119, 15, 255, 9,\n"
              "                  49, 60, 113\n"
              "              );\n"
              "\n"
              "              /* Small roadside bushes. */\n"
              "              vt_pyramid(\n"
              "                  -82, 31, 175,\n"
              "                  12, 19, 39, 141, 61\n"
              "              );\n"
              "              vt_pyramid(\n"
              "                  82, 31, 185,\n"
              "                  12, 19, 47, 154, 69\n"
              "              );"
          )

          replace_once(
              "vt_gate(310);",
              extra_scenery
          )

          # Verify the important old features.
          required = [
              "VOLT TRAIL V14",
              "vt_player(px, pz + 73);",
              "vt_sparkit(",
              "vt_mosslet(",
              "vt_walk_phase",
              "vt_play_intro();",
              "FntFlush(0);",
              "FntFlush(1);"
          ]

          for marker in required:
              if marker not in code:
                  raise RuntimeError(
                      "Important feature missing: " + marker
                  )

          path.write_text(code, encoding="utf-8")

          print("Volt Trail V14 graphics patch complete")
          print("Animated 3D player added")
          print("Sparkit and Mosslet improved")
          print("Landscape details added")
          print("V13 intro and controls preserved")
          PY

      - name: Install PSn00bSDK
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          import yaml

          path = Path(os.environ["RUNNER_TEMP"]) / "v13.yml"
          data = yaml.safe_load(path.read_text())
          steps = data["jobs"]["build"]["steps"]

          matches = [
              step for step in steps
              if step.get("name") == "Install PSn00bSDK"
          ]

          if len(matches) != 1:
              raise RuntimeError("V13 SDK setup missing")

          subprocess.run(
              ["bash", "-euo", "pipefail", "-c", matches[0]["run"]],
              env=os.environ.copy(),
              check=True
          )
          PY

      - name: Build Volt Trail V14
        shell: bash
        run: |
          set -euxo pipefail

          cmake -S "$PROJECT_DIR" \
            -B "$GITHUB_WORKSPACE/build" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PSN00BSDK_CMAKE" \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build \
            "$GITHUB_WORKSPACE/build" \
            --verbose

      - name: Collect PS1 files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          for file in \
            VTRAIL.bin VTRAIL.cue VTRAIL.exe VTRAIL.elf
          do
            SOURCE="$GITHUB_WORKSPACE/build/$file"

            if [ ! -s "$SOURCE" ]; then
              echo "::error::Missing PS1 file: $file"
              exit 1
            fi

            cp "$SOURCE" \
              "$GITHUB_WORKSPACE/artifacts/"
          done

          ls -lh "$GITHUB_WORKSPACE/artifacts"

      - name: Upload Volt Trail V14
        uses: actions/upload-artifact@v4
        with:
          name: VoltTrail-PS1-V14-3D-Characters
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
