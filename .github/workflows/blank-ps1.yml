    - name: V31.9.2.1 Timing-Pruefung korrigiert – kein falscher Build-Abbruch
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'LYDRA_V31921_CHECK'
        import os,re
        from pathlib import Path
        source=(Path(os.environ['PROJECT_DIR'])/'src/main.c').read_text(encoding='utf-8')

        # The descriptive comment is ABOVE the C function. V31.9.2 incorrectly
        # searched for it inside the function, causing a false failure on step 65.
        marker='V31.9.2: movement and camera use elapsed video refreshes'
        if source.count(marker)!=1:
            raise SystemExit('::error::V31.9.2 timing patch marker missing or duplicated')

        # Extract the real function with balanced braces; do not use the next
        # unrelated function name to guess where the code ends.
        header=re.search(r'\bstatic\s+void\s+vt_v293_move\s*\(\s*unsigned\s+int\s+pad\s*\)\s*\{',source)
        if not header:
            raise SystemExit('::error::V31.9.2 movement function missing')
        level=1
        pos=header.end()
        while pos<len(source) and level>0:
            if source[pos]=='{':level+=1
            elif source[pos]=='}':level-=1
            pos+=1
        if level!=0:
            raise SystemExit('::error::V31.9.2 movement function has unbalanced braces')
        block=source[header.start():pos]

        for x in ('VSync(-1)','turn*36*256','target=forward*14336;',
                  'frac_x+=vx*dt;','vt_v292_yaw_target=vt_v292_cam_yaw;'):
            if x not in block:
                raise SystemExit('::error::V31.9.2 missing movement feature: '+x)
        for x in ('V31.9.1: lighter far-terrain LOD','V31.9.0: sparse distant objects',
                  'vt_v281_resolve_movement();','vt_v31813_draw_start(',
                  'vt_v3172_menu_slots(', 'vt_save_game(void)', 'vt_load_game(void)'):
            if x not in source:
                raise SystemExit('::error::Retained gameplay feature missing: '+x)
        print('V31.9.2.1: timing code present; incorrect comment-boundary test repaired.')
        print('Existing collision, menu, saves, and optimized landscape found.')
        LYDRA_V31921_CHECK
    - name: V31.9.3.1 Renderer an tatsächlichen Boden-Code anpassen
      shell: bash
      run: |
        set -euo pipefail
        cat > "$RUNNER_TEMP/lydra_v31931_patch.py" <<'LYDRA_V31931_PATCH'
        #!/usr/bin/env python3
        """V31.9.3.1: conservative legacy-ground de-duplication.
        Keep gameplay safe when older code differs; never fail on an unsupported routine.
        """
        from pathlib import Path
        import os, re
        p=Path(os.environ['PROJECT_DIR'])/'src'/'main.c'
        s=p.read_text(encoding='utf-8')

        def span(name):
            pat=r'\bstatic\s+void\s+'+re.escape(name)+r'\s*\([^;]*?\)\s*\{'
            hits=list(re.finditer(pat,s,re.S))
            if len(hits)!=1: raise RuntimeError('Definition missing or duplicate: '+name)
            a=hits[0].start(); start=hits[0].end(); i=start;depth=1;mode='code'
            while i<len(s) and depth:
                c=s[i]; n=s[i+1] if i+1<len(s) else ''
                if mode=='code':
                    if c=='/' and n=='/':mode='line';i+=1
                    elif c=='/' and n=='*':mode='comment';i+=1
                    elif c=='"':mode='string'
                    elif c=="'":mode='char'
                    elif c=='{':depth+=1
                    elif c=='}':depth-=1
                elif mode=='line':
                    if c=='\n': mode='code'
                elif mode=='comment':
                    if c=='*' and n=='/':mode='code';i+=1
                else:
                    if c=='\\':i+=1
                    elif (mode=='string' and c=='"') or (mode=='char' and c=="'"):mode='code'
                i+=1
            if depth:raise RuntimeError('Unbalanced function: '+name)
            return a,i,start

        legacy_a,legacy_b,body_a=span('vt_v241_ground')
        near_a,near_b,_=span('vt_v300_extend_ground')
        near=s[near_a:near_b]
        for needle in ('const int near_step=180,near_cells=14;',
                       'vt_v24_ground_patch(gx,gz,near_step,near_cells,near_cells,',
                       'const int far_step=560,far_cells=12;'):
            if needle not in near:raise RuntimeError('Unable to verify safe primary ground: '+needle)

        original=s[legacy_a:legacy_b]
        # The exact legacy V25 routine emitted two triangles per 110-unit grid cell
        # at height 35. The real current build may have rewritten that routine.
        # Only disable the recognized ground-only implementation, never unrecognized code.
        recognized=(re.search(r'\bdraw_triangle3\s*\(',original) is not None
                    and re.search(r'\b35\b',original) is not None
                    and re.search(r'\bstep\s*=\s*110\b',original) is not None
                    and re.search(r'\bfor\s*\(',original) is not None
                    and not any(token in original for token in ('draw_box(', 'vt_v24_tree(', 'vt_v28_house(', 'vt_v282_')))
        if recognized:
            replacement='''/* V31.9.3.1: proven V25 duplicate 110-unit ground mesh disabled.
           V31.9.1 near and far ground continue to render, with existing collision. */
        static void vt_v241_ground(void) {
            /* Legacy ground intentionally empty; current ground covers this area. */
        }'''
            s=s[:legacy_a]+replacement+s[legacy_b:]
            result='REMOVED_VERIFIED_V25_DUPLICATE'
        else:
            # Never silently rip out unknown game code. Record this case in artifact.
            result='PRESERVED_UNRECOGNIZED_LEGACY_GROUND'

        for token in ('vt_v281_resolve_movement();','vt_v31813_draw_start(',
                      'vt_v3172_menu_slots(', 'vt_save_game(void)', 'vt_load_game(void)',
                      'V31.9.2: movement and camera use elapsed video refreshes'):
            if token not in s:raise RuntimeError('Expected gameplay component missing: '+token)

        p.write_text(s,encoding='utf-8')
        art=Path('artifacts');art.mkdir(exist_ok=True)
        (art/'RENDERER_PRUEFUNG_V31_9_3_1.txt').write_text('V31.9.3.1: '+result+'\n',encoding='utf-8')
        print('V31.9.3.1 result:',result)
        print('Legacy function snippet:',repr(original[:260]))
        print('Player collision, menu, save and camera paths retained.')
        LYDRA_V31931_PATCH
        python3 "$RUNNER_TEMP/lydra_v31931_patch.py"
