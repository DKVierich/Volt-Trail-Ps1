name: LWOD Android V41.7 FIX8 Natuerliches Gebirge
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/blank-ps1.yml
permissions:
  contents: read
jobs:
  android:
    name: LWOD Android V41.7 FIX8 APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: barichello/godot-ci:4.7.2
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: /usr/lib/android-sdk
    steps:
    - name: Repository laden
      uses: actions/checkout@v4
    - name: Python 3 und PyYAML zuerst installieren
      shell: bash
      run: |
        set -euo pipefail
        # The Godot CI container may not ship python3; bootstrap it before V41.6 replay.
        if ! command -v python3 >/dev/null 2>&1 || ! python3 -c 'import yaml' >/dev/null 2>&1; then
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 python3-yaml
        fi
        python3 -c 'import yaml, sys; print("V417_FIX2_PYTHON_OK", sys.version.split()[0], yaml.__version__)'
    - name: Stabiles V41.6-Spiel wiederherstellen
      shell: bash
      run: |-
        set -euo pipefail
        # Freeze the confirmed working V41.6 version; this is only a source for replaying the original build steps.
        wget --quiet --tries=3 --timeout=60 --https-only -O "$RUNNER_TEMP/lwod_v416.yml" \
          'https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/0f29ac00fe9a7a2037ed39b8df994a37fd0672f8/.github/workflows/blank-ps1.yml'
        python3 - <<'PYREPLAY'
        import hashlib,os,subprocess
        from pathlib import Path
        p=Path(os.environ['RUNNER_TEMP'])/'lwod_v416.yml'
        data=p.read_bytes()
        sha=hashlib.sha1(('blob %d\0'%len(data)).encode()+data).hexdigest()
        if sha!='9331c8c07ba758bda5dc9ec6068534330e7dc3b8':
            raise SystemExit('V41.6 Basis-Workflow hat eine unerwartete Prüfsumme')
        try:
            import yaml
        except ImportError:
            subprocess.run(['apt-get','update','-qq'],check=True)
            subprocess.run(['apt-get','install','-y','-qq','python3-yaml'],check=True)
            import yaml
        steps=yaml.safe_load(data)['jobs']['android']['steps']
        if len(steps)!=16 or 'V41.6' not in steps[10]['name']:
            raise SystemExit('V41.6 Installationsschritte haben sich unerwartet verändert')
        for i in range(1,13):
            step=steps[i]
            print('WIEDERHERSTELLEN',i,step['name'],flush=True)
            subprocess.run(['timeout','--signal=TERM','--kill-after=5s','1200s','bash','-e','-o','pipefail','-c',step['run']],check=True)
        print('V416_BASIS_OK',flush=True)
        PYREPLAY
    - name: V41.7 FIX3 Regionen und 3D-Landschaften installieren
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p android/scripts android/tests build/diagnose
