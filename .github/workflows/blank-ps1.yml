name: LWOD Android V41.7 FIX9 Kompakter Bergrelief Build
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/blank-ps1.yml
permissions:
  contents: read
jobs:
  android:
    name: LWOD Android V41.7 FIX9 APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: barichello/godot-ci:4.7.2
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: /usr/lib/android-sdk
    steps:
    - name: Repository laden
      uses: actions/checkout@v4
    - name: Python 3 und PyYAML zuerst installieren
      shell: bash
      run: |
        set -euo pipefail
        # The Godot CI container may not ship python3; bootstrap it before V41.6 replay.
        if ! command -v python3 >/dev/null 2>&1 || ! python3 -c 'import yaml' >/dev/null 2>&1; then
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 python3-yaml
        fi
        python3 -c 'import yaml, sys; print("V417_FIX2_PYTHON_OK", sys.version.split()[0], yaml.__version__)'
    - name: FIX7 Basis aus gesichertem Git-Commit laden
      shell: bash
      run: |
        set -euo pipefail
        wget --quiet --tries=3 --timeout=60 --https-only -O "$RUNNER_TEMP/lwod_fix7.yml" \
          'https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/8738de87c3b9fb7bd42d2beab4631c9dcb8c3696/.github/workflows/blank-ps1.yml'
        python3 - <<'PYREPLAY'
        import hashlib, os, subprocess, yaml
        from pathlib import Path
        p=Path(os.environ['RUNNER_TEMP'])/'lwod_fix7.yml'
        b=p.read_bytes()
        assert hashlib.sha1(('blob %d\0'%len(b)).encode()+b).hexdigest()=='75c246edd556f8a6136a7df96df96aa2efb46384', 'FIX7 Basis unvollstaendig'
        steps=yaml.safe_load(b)['jobs']['android']['steps']
        assert 'FIX7' in steps[6]['name'] and 'FIX6' in steps[5]['name']
        for i in range(2,7):
            print('WIEDERHERSTELLEN',i,steps[i]['name'],flush=True)
            subprocess.run(['timeout','--signal=TERM','--kill-after=5s','1200s','bash','-e','-o','pipefail','-c',steps[i]['run']],check=True)
        print('FIX7_BASIS_OK',flush=True)
        PYREPLAY
