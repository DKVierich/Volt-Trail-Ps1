      - name: Verfeinerte FIX33-Modelle anwenden
        shell: bash
        run: python3 "$RUNNER_TEMP/lwod_fix40_step.py" 'FIX33 Geometrie verbessern'

      - name: FIX33 Grafikverifikation
        shell: bash
        run: python3 "$RUNNER_TEMP/lwod_fix40_step.py" 'FIX33 pruefen'

      - name: FIX41 Hauspolygone und Bodenfarben korrigieren
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'LWOD_FIX41_PY'
          #!/usr/bin/env python3
          """LWOD FIX41: reduce near-house mesh overlap and road/grass checker tint.
          No physics, world positions, camera, video resolution or game saves are touched.
          """
          from pathlib import Path
          import os,re
          src=Path(os.environ['PROJECT_DIR'])/'src/main.c'
          s=src.read_text(encoding='utf-8')
          if 'LWOD_FIX41_VISUAL' in s:
              raise SystemExit('FIX41 already applied')
          
          def span(data,name):
              rx=r'\bstatic\s+void\s+'+re.escape(name)+r'\s*\([^;]*?\)\s*\{'
              m=list(re.finditer(rx,data,re.S))
              if len(m)!=1:
                  raise SystemExit('FIX41 expected one function '+name+', found '+str(len(m)))
              begin=m[0].start(); i=m[0].end(); depth=1; mode='code'
              while i<len(data) and depth:
                  c=data[i]; nxt=data[i+1] if i+1<len(data) else ''
                  if mode=='code':
                      if c=='/' and nxt=='/': mode='line';i+=1
                      elif c=='/' and nxt=='*': mode='comment';i+=1
                      elif c=='"': mode='string'
                      elif c=="'": mode='char'
                      elif c=='{': depth+=1
                      elif c=='}': depth-=1
                  elif mode=='line':
                      if c=='\n': mode='code'
                  elif mode=='comment':
                      if c=='*' and nxt=='/':mode='code';i+=1
                  else:
                      if c=='\\':i+=1
                      elif (mode=='string' and c=='"') or (mode=='char' and c=="'"):mode='code'
                  i+=1
              if depth:raise SystemExit('FIX41 unbalanced function '+name)
              return begin,i
          
          # Fix 1: FIX33 appended a *second* front-facade ornament set over the
          # existing FIX28+FIX30 front. Keep the already working FIX30 version instead.
          a,b=span(s,'vt_v241_building'); house=s[a:b]
          mark='/* FIX33: beam work, deep windows, stone sills and a lintel over the door.'
          anchor='if (inside) vt_v282_draw_house_npcs(x,z);'
          if house.count(mark)!=1 or house.count(anchor)!=1:
              raise SystemExit('FIX41 house facade/NPC anchors changed')
          start=house.index(mark); end=house.index(anchor,start)
          removed=house[start:end]
          if removed.count('vt_v2822_quad(')<10 or 'if (!inside && !occluded)' not in removed:
              raise SystemExit('FIX41 expected duplicate FIX33 geometry not found')
          house=(house[:start]+ '/* LWOD_FIX41_VISUAL: duplicate FIX33 facade removed; FIX30 facade kept. */\n    '
                 +house[end:])
          # Limit the older front ornament mesh to the nearby street, not distant houses.
          old='if (d>175 && d<750) vt_v2822_facade(x,z,s,roof,style);'
          new='if (d>175 && d<440) vt_v2822_facade(x,z,s,roof,style);'
          if house.count(old)!=1:raise SystemExit('FIX41 unexpected FIX30 facade distance')
          house=house.replace(old,new,1)
          s=s[:a]+house+s[b:]
          
          # Fix 2: soften the brown/green checker-block material without
          # altering road geometry, triangle vertices, collision or map generation.
          a,b=span(s,'vt_v31987_ground_rect'); ground=s[a:b]
          changes={
            'int tone=(cell-3)*2;':'int tone=(cell-3);',
            'if (cell==0 || cell==4) {rr-=14;gg-=11;bb-=8;}':
                'if (cell==0 || cell==4) {rr-=4;gg-=3;bb-=2;}',
            'else if (cell==2 || cell==5) {rr+=10;gg+=7;bb+=5;}':
                'else if (cell==2 || cell==5) {rr+=3;gg+=2;bb+=2;}',
            'if (cell==1 || cell==6) {rr-=8;gg-=10;bb-=6;}':
                'if (cell==1 || cell==6) {rr-=3;gg-=3;bb-=2;}',
            'if (cell==3) {rr+=4;gg+=6;bb+=2;}':
                'if (cell==3) {rr+=2;gg+=2;bb+=1;}',
          }
          for old,new in changes.items():
              if ground.count(old)!=1:raise SystemExit('FIX41 ground palette anchor changed: '+old)
              ground=ground.replace(old,new,1)
          s=s[:a]+ground+s[b:]
          
          # Invariants: prevent accidental regressions to old 640-wide screen or gameplay.
          for token in ('LWOD_FIX32_MESH','LWOD_FIX33_GEOMETRY','vt_v2822_facade(',
           'vt_v281_resolve_movement();','vt_save_game(void)','vt_load_game(void)',
           'LYDRA_FIX12_GLOBAL_PERCENT 75','vt_v282_draw_house_npcs(x,z)',
           'no automatic region 0->1 from step count','no automatic region 1->2 from step count'):
              if token not in s:raise SystemExit('FIX41 retained feature missing: '+token)
          for dim,val in [('SCREEN_W','320'),('SCREEN_H','240')]:
              if not re.search(r'(?m)^\s*#\s*define\s+'+dim+r'\s+'+val+r'\b',s):
                  raise SystemExit('FIX41 resolution unexpectedly changed: '+dim)
          if s.count('LWOD_FIX41_VISUAL')!=1:
              raise SystemExit('FIX41 duplicated/missing visual patch')
          src.write_text(s,encoding='utf-8')
          report=Path('artifacts/FIX41_GRAFIK_DIAGNOSE.txt')
          report.parent.mkdir(exist_ok=True)
          report.write_text(
              'LWOD FIX41 - gezielte Rendering-Korrektur\n'
              'Haeuser: zusaetzliche FIX33-Fassadenpolygone entfernt, bestehende FIX30-Fassade bleibt.\n'
              'FIX30-Fassaden-LOD 750 -> 440, weniger entfernte Ueberlagerungen.\n'
              'Weg/Gras: Farbmodulation stark verringert, Geometrie unveraendert.\n'
              'Kamera, NPC, Kollision, Speicher, Intro und Bildschirm 320x240 unveraendert.\n'
              'Drachen/Spieler-Abstand und genaue Ursache blauer Bodenkanten noch nicht identifiziert.\n',
              encoding='utf-8')
          print(report.read_text(encoding='utf-8'))
          LWOD_FIX41_PY

      - name: Sichere Bildschirmaufteilung verifizieren
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_SCREEN'
          from pathlib import Path
          import re,os
          p=Path(os.environ['PROJECT_DIR'])/'src/main.c'
          s=p.read_text(encoding='utf-8')
          for symbol,value in [('SCREEN_W','320'),('SCREEN_H','240')]:
              assert re.search(r'(?m)^\s*#\s*define\s+'+symbol+r'\s+'+value+r'\b',s), symbol+' falsch'
          assert 'LWOD_FIX33_GEOMETRY' in s, 'FIX33 Modelle fehlen'
          print('320x240 und FIX33 aktiv; kein 640er-Displaymodus')
          PY_SCREEN

      - name: PS1 Compiler installieren
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/lwod_run.py" 55
          grep -q '^PSN00BSDK_CMAKE=' "$GITHUB_ENV"

      - name: PS1 Spiel kompilieren
        shell: bash
        run: |
          set -euo pipefail
          : "${PSN00BSDK_CMAKE:?PS1 SDK Variable fehlt}"
          test -f "$PSN00BSDK_CMAKE"
          python3 "$RUNNER_TEMP/lwod_run.py" 56

      - name: Fehlerdiagnose hochladen
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: LWOD_FIX41_BUILD_LOG
          path: |
            artifacts/FIX25_BUILD_LOG.txt
            artifacts/FIX25_ERSTE_FEHLER.txt
          if-no-files-found: warn
          retention-days: 14

      - name: PS1 BIN und CUE erstellen
        shell: bash
        run: |
          set -euo pipefail
          for i in 58 59 60 61; do
            python3 "$RUNNER_TEMP/lwod_run.py" "$i"
          done
          folder="$RUNNER_TEMP/lydra_ps1_spiel"
          test -s "$folder/LWOD_FIX32.bin"
          test -s "$folder/LWOD_FIX32.cue"
          mv "$folder/LWOD_FIX32.bin" "$folder/LWOD_FIX41.bin"
          sed 's/LWOD_FIX32[.]bin/LWOD_FIX41.bin/g' "$folder/LWOD_FIX32.cue" > "$folder/LWOD_FIX41.cue"
          rm "$folder/LWOD_FIX32.cue"
          grep -qi 'LWOD_FIX41.bin' "$folder/LWOD_FIX41.cue"

      - name: LWOD FIX41 herunterladen
        uses: actions/upload-artifact@v4
        with:
          name: LWOD_FIX41_GRAFIKFIX
          path: ${{ runner.temp }}/lydra_ps1_spiel/
          if-no-files-found: error
          retention-days: 14
