name: LWOD Android V41.7 FIX33 Kurven und Touch-Ernte
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/blank-ps1.yml
permissions:
  contents: read
jobs:
  android:
    name: LWOD Android V41.7 FIX33 APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    container:
      image: barichello/godot-ci:4.7.2
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: /usr/lib/android-sdk
    steps:
    - name: Erfolgreichen FIX19 Stand laden
      uses: actions/checkout@v4
      with:
        ref: a50b23c0dbeebc464305c0451b98245a0632aebc
    - name: Python und YAML bereitstellen
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v python3 >/dev/null 2>&1 || ! python3 -c 'import yaml' >/dev/null 2>&1; then
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 python3-yaml
        fi
    - name: Bewaehrten FIX31 Workflow laden und pruefen
      shell: bash
      run: |
        set -euo pipefail
        wget --quiet --tries=3 --timeout=60 --https-only -O "$RUNNER_TEMP/fix31.yml" 'https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/02db69aebd1ad61d1778439da5d8cb22df964599/.github/workflows/blank-ps1.yml'
        python3 - <<'PYREPLAY'
        import hashlib, os, subprocess, yaml
        from pathlib import Path
        p=Path(os.environ['RUNNER_TEMP'])/'fix31.yml'
        data=p.read_bytes()
        sha=hashlib.sha1(('blob %d\0'%len(data)).encode()+data).hexdigest()
        assert sha=='26c4391fba381b6e81f0d3fbb3a090a328210150', 'FIX31 source checksum mismatch: '+sha
        steps=yaml.safe_load(data)['jobs']['android']['steps']
        assert len(steps)==17 and steps[8]['name'].startswith('FIX31 Wurzelheim') and steps[12]['name'].startswith('FIX31 Baumplattformen')
        folder=Path(os.environ['RUNNER_TEMP'])/'fix32_original'; folder.mkdir(exist_ok=True)
        for i in range(2,13):
            step=steps[i]; assert step['shell']=='bash' and 'if' not in step
            f=folder/('%02d.sh'%i); f.write_text(step['run']+'\n',encoding='utf-8'); subprocess.run(['bash','-n',str(f)],check=True)
        PYREPLAY
    - name: FIX31 Spielinhalte rekonstruieren
      shell: bash
      run: |
        set -euo pipefail
        for i in 02 03 04 05 06 07 08; do
          echo "::group::FIX31 Originalschritt $i"
          bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/fix32_original/$i.sh"
          echo "::endgroup::"
        done
    - name: FIX32 Wurzelheim Wege und Gemuese installieren
      shell: bash
      run: |
        set -euo pipefail
        base64 -d <<'FIX32_PAYLOAD' | gzip -dc > "$RUNNER_TEMP/lwod_fix32.py"
