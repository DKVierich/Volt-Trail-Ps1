    - name: V31.4 Alle acht Frames pruefen und PS1 RGB555-Bilder erzeugen
      shell: bash
      run: |
        set -euo pipefail
        cat > "$RUNNER_TEMP/lydra_v314_generate.py" <<'LYDRA_V314_GENERATE'
        #!/usr/bin/env python3
        import hashlib,os,struct
        from pathlib import Path
        from PIL import Image
        home=Path(os.environ['RUNNER_TEMP'])/'lydra_intro'
        expected=['85c0f276604235c3ba0bcc171b8fda820923b0ffb7e6fae14d7bc18cf6b121fb', 'a0edca40951764503090e9d463edddb72af32856e8b7f19b89d92c3e2cecb5d1', '0a64b3ccdd642082f87bc81e281b3bc9a1a2b4672d50f151dcff7641d0bea2e1', '7601d2d5df646a05b8ff00c2f894539839c076ecdc412a529150811855e0dc82', '858733b30951cf6e7ba4a3348f08d22439019da2404c0c6ce7dd5669b165d7d8', '42261548fa3be4c007168959e64f7263a3214663e06544d49b9fafb6bccf10d4', 'e8dd964dd4d96b925537f7e832d12417ac4a198d90dd9e61d4cb109ffe243ec3', '2d3de676a7e4da61dad5e454a6bf52d5d2d115899cbfaf03c0a2e38408cd04eb']
        frames=[]
        for i,sha in enumerate(expected):
            file=home/f'scene_{i}.jpg'
            if not file.is_file():raise RuntimeError(f'Intro-Bild {i} fehlt')
            data=file.read_bytes()
            if hashlib.sha256(data).hexdigest()!=sha:
                raise RuntimeError(f'Intro-Bild {i}: Daten unvollstaendig')
            with Image.open(file) as img:
                img=img.convert('RGB')
                if img.size!=(160,120):raise RuntimeError('Falsche Introbild-Abmessung')
                pixels=[]
                for r,g,b in img.getdata():
                    pixels.append(((b>>3)<<10)|((g>>3)<<5)|(r>>3))
            frames.append(pixels)
        assert len(frames)==8
        lines=['/* Lydra V31.4: PS1 RGB555 video keyframes. */',
               '#ifndef LYDRA_V314_FRAMES_H','#define LYDRA_V314_FRAMES_H']
        for i,px in enumerate(frames):
            lines.append(f'static const unsigned short vt_v314_image_{i}[19200] __attribute__((aligned(4))) = {{')
            for j in range(0,len(px),16):
                lines.append(' '+','.join('0x%04x'%v for v in px[j:j+16])+',')
            lines.append('};')
        lines.append('static const unsigned short *const vt_v314_images[8] = {')
        lines.append(','.join('vt_v314_image_%d'%i for i in range(8))+'};')
        lines.append('#endif')
        source=Path(os.environ['PROJECT_DIR'])/'src'
        assert source.is_dir(),f'Spielquellverzeichnis fehlt: {source}'
        output=source/'lydra_v314_frames.h'
        output.write_text('\n'.join(lines)+'\n',encoding='utf-8')
        if output.stat().st_size<800_000:raise RuntimeError('Intro-C-Header nicht vollstaendig')
        print('Alle acht PS1-Intro-Bilder sind verifiziert und in RGB555 konvertiert:',output.stat().st_size,'Bytes')
        LYDRA_V314_GENERATE
        python3 "$RUNNER_TEMP/lydra_v314_generate.py"
    - name: V31.4 Intro und PS1-Hauptmenue in V31.3 einbauen
      shell: bash
      run: |
        set -euo pipefail
        cat > "$RUNNER_TEMP/lydra_v314_title.py" <<'LYDRA_V314_MENU_PATCH'
        #!/usr/bin/env python3
        '''Integrates native PS1 title screen/menu in existing Lydra V31.3 main.c.
        No save-format changes; does not attempt to decode MP4 on real PS1 hardware.
        '''
        import os
        from pathlib import Path
        p=Path(os.environ['PROJECT_DIR'])/'src/main.c'
        s=p.read_text(encoding='utf-8')


        def once(old,new):
            global s
            n=s.count(old)
            if n!=1:
                raise RuntimeError('V31.4: expected one source marker, got %d: %r'%(n,old[:105]))
            s=s.replace(old,new,1)

        helpers=r'''
        /* LYDRA V31.4: hardware-safe title / intro; 8 original MP4 keyframes in RGB555.
           Video/audio codec H.264/AAC is intentionally NOT injected into a PS1 binary.
           Texture uses only VRAM x=640..799 y=0..119, away from the two framebuffers
           and the font upload area at x>=960. Memory Card bytes are unchanged. */
        #include "lydra_v314_frames.h"
        static int vt_v314_active=1;
        static int vt_v314_phase=0;      /* 0 intro, 1 blinking START, 2 main, 3 options */
        static int vt_v314_elapsed=0;
        static int vt_v314_vram_frame=-1;
        static int vt_v314_cursor=0,vt_v314_opt_cursor=0;
        static const char *vt_v314_message="";
        static unsigned int vt_v314_blink=0;

        static void vt_v314_input(unsigned int pressed) {
            vt_v314_blink++;
            if(vt_v314_phase==0) {
                if(pressed&(PAD_START|PAD_CROSS)) {
                    vt_v314_elapsed=460;
                    vt_v314_phase=1;
                } else if(++vt_v314_elapsed>=460) {
                    vt_v314_phase=1;
                }
            } else if(vt_v314_phase==1) {
                if(pressed&(PAD_START|PAD_CROSS)) {
                    vt_v314_phase=2;
                    vt_v314_message="";
                }
            } else if(vt_v314_phase==2) {
                if(pressed&PAD_UP) vt_v314_cursor=(vt_v314_cursor+3)%4;
                if(pressed&PAD_DOWN) vt_v314_cursor=(vt_v314_cursor+1)%4;
                if(pressed&PAD_TRIANGLE)vt_v314_phase=1;
                if(pressed&(PAD_CROSS|PAD_START)) {
                    if(vt_v314_cursor==0) {
                        vt_v314_active=0;vt_menu_open=0;vt_menu_page=0;
                        vt_v314_message="";
                    } else if(vt_v314_cursor==1) {
                        int result=vt_load_game();
                        if(result==1) {
                            vt_v314_active=0;vt_menu_open=0;vt_menu_page=0;
                            vt_v314_message="";
                        } else {
                            vt_v314_message=(result==-1)?"DATEI UNGUELTIG":"KEIN SPIELSTAND";
                        }
                    } else if(vt_v314_cursor==2) {
                        vt_v314_phase=3;vt_v314_opt_cursor=0;
                        vt_v314_message="";
                    } else {
                        vt_v314_phase=0;vt_v314_elapsed=0;
                        vt_v314_message="";
                    }
                }
            } else if(vt_v314_phase==3) {
                if(pressed&PAD_UP)vt_v314_opt_cursor=(vt_v314_opt_cursor+2)%3;
                if(pressed&PAD_DOWN)vt_v314_opt_cursor=(vt_v314_opt_cursor+1)%3;
                if(pressed&PAD_TRIANGLE)vt_v314_phase=2;
                if(vt_v314_opt_cursor==0) {
                    if((pressed&PAD_LEFT) && vt_opt_volume>0)vt_opt_volume-=10;
                    if((pressed&PAD_RIGHT) && vt_opt_volume<100)vt_opt_volume+=10;
                    if(pressed&(PAD_LEFT|PAD_RIGHT))vt_opt_apply_volume();
                } else if(vt_v314_opt_cursor==1) {
                    if((pressed&PAD_LEFT) && vt_opt_text_speed>1)vt_opt_text_speed--;
                    if((pressed&PAD_RIGHT) && vt_opt_text_speed<3)vt_opt_text_speed++;
                } else if(pressed&(PAD_CROSS|PAD_START))vt_v314_phase=2;
            }
            if(vt_v314_active) {
                /* Keep world clock, walking, NPC interaction and combat paused in title. */
                vt_menu_open=1;vt_menu_page=0;
            }
        }

        static int vt_v314_choice_frame(void) {
            static const int stages[8]={0,55,112,171,224,278,330,378};
            int i;
            if(vt_v314_phase!=0)return 7;
            for(i=7;i>0;i--)if(vt_v314_elapsed>=stages[i])return i;
            return 0;
        }

        static void vt_v314_draw(void) {
            POLY_FT4 *q;
            unsigned int aligned;
            RECT texture_rect;
            int current=vt_v314_choice_frame();
            int brightness=128;
            if(current!=vt_v314_vram_frame) {
                setRECT(&texture_rect,640,0,160,120);
                DrawSync(0);
                LoadImage(&texture_rect,(u_long *)(void *)vt_v314_images[current]);
                DrawSync(0);
                vt_v314_vram_frame=current;
            }
            if(vt_v314_phase==0) {
                static const int stages[8]={0,55,112,171,224,278,330,378};
                int elapsed=vt_v314_elapsed-stages[current];
                /* Each image softly fades in; no movie decoder required. */
                if(elapsed<16)brightness=32+elapsed*6;
                if(brightness>128)brightness=128;
                if(brightness<0)brightness=0;
            }
            if(vt_v314_phase>=2) {
                /* Place an opaque ink-blue submenu tile behind the text.
                   Insert it BEFORE the image primitive: the game's OT is LIFO. */
                TILE *panel;
                unsigned int panel_aligned=(prim_used+3u)&~3u;
                if(panel_aligned+sizeof(TILE)<=sizeof(prim_arena[db])) {
                    panel=(TILE *)(prim_arena[db]+panel_aligned);
                    prim_used=panel_aligned+sizeof(TILE);
                    setTile(panel);
                    setXY0(panel,190,157);
                    setWH(panel,130,83);
                    setRGB0(panel,13,19,36);
                    addPrim(ot[db],panel);
                }
            }
            aligned=(prim_used+3u)&~3u;
            if(aligned+sizeof(POLY_FT4)>sizeof(prim_arena[db]))return;
            q=(POLY_FT4 *)(prim_arena[db]+aligned);
            prim_used=aligned+sizeof(POLY_FT4);
            setPolyFT4(q);
            setXY4(q,0,0,320,0,0,240,320,240);
            setUV4(q,0,0,159,0,0,119,159,119);
            setTPage(q,2,0,640,0);
            setSemiTrans(q,0);
            setShadeTex(q,0);
            setRGB0(q,brightness,brightness,brightness);
            /* Existing render order draws the world first, then this full-screen quad. */
            addPrim(ot[db],q);
        }

        static void vt_v314_hud(void) {
            if(vt_v314_phase==0) {
                if(vt_v314_elapsed>100 && (vt_v314_blink&63u)<40u)
                    FntPrint(4,"  START = UEBERSPRINGEN");
            } else if(vt_v314_phase==1) {
                if((vt_v314_blink%70u)<39u)FntPrint(4,"   START");
            } else if(vt_v314_phase==2) {
                FntPrint(5,"%c NEUES SPIEL\n\n",vt_v314_cursor==0?'>':' ');
                FntPrint(5,"%c LADEN\n\n",vt_v314_cursor==1?'>':' ');
                FntPrint(5,"%c OPTIONEN\n\n",vt_v314_cursor==2?'>':' ');
                FntPrint(5,"%c INTRO\n",vt_v314_cursor==3?'>':' ');
                if(vt_v314_message[0])FntPrint(4,"%s",vt_v314_message);
            } else if(vt_v314_phase==3) {
                FntPrint(5,"OPTIONEN\n\n");
                FntPrint(5,"%c TON %d%%\n\n",vt_v314_opt_cursor==0?'>':' ',vt_opt_volume);
                FntPrint(5,"%c TEXT %d\n\n",vt_v314_opt_cursor==1?'>':' ',vt_opt_text_speed);
                FntPrint(5,"%c ZURUECK\n",vt_v314_opt_cursor==2?'>':' ');
            }
            FntFlush(4);FntFlush(5);
        }
        '''

        # Replace the old V17 boot splash so that only the new V31.4 intro is shown.
        # All gameplay initialization remains outside that presentation-only call.
        if 'vt_play_intro();' in s:
            once('vt_play_intro();','/* V31.4: legacy title splash replaced by new intro. */')

        # Insert title helpers just before the HUD; V29-31 systems are already declared.
        once('static void draw_hud(void) {',helpers+'\nstatic void draw_hud(void) {\n    if(vt_v314_active) { vt_v314_hud(); return; }')

        # Fonts: 0-3 are the existing streams; add two separate title streams.
        once('FntOpen(247, 6, 69, 65, 0, 128);',
             'FntOpen(247, 6, 69, 65, 0, 128);\n    FntOpen(108, 217, 205, 20, 0, 128); /* title START */\n    FntOpen(196, 162, 124, 76, 0, 512); /* title menu */')

        # All menu controls already follow this line. Hide input from the old menus.
        once('        previous_pad = pad;',
             '        previous_pad = pad;\n        if(vt_v314_active) {\n            vt_v314_input((unsigned int)pressed);\n            pad=0;pressed=0;\n        }')

        # The old menu panel is scheduled *before* world primitives, i.e. is drawn on top.
        # Use the same exact point for the full-screen image; leave existing in-game panel alone.
        once('        vt_draw_menu_panel();',
             '        if(vt_v314_active)vt_v314_draw();\n        else vt_draw_menu_panel();')

        for feature in ('vt_v281_resolve_movement();','vt_v282_draw_house_npcs(',
                        'vt_opt_draw_page();','vt_save_game(void)','vt_load_game(void)',
                        'vt_v293_move((unsigned int)pad);','vt_v301_sun(void)',
                        'vt_v292_draw_exploration_hud();'):
            if feature not in s:raise RuntimeError('V31.4 lost existing mechanic '+feature)
        if 'vt_v314_input((unsigned int)pressed)' not in s:raise RuntimeError('V31.4 title controller missing')
        if 'vt_v314_draw();' not in s:raise RuntimeError('V31.4 title drawing missing')
        p.write_text(s,encoding='utf-8')
        print('V31.4 title: PS1 video keyframes, blinking START, new/load/options/replay.')
        print('V31.3 camera, terrain, dragons, combat, saves and ingame menu retained.')
        LYDRA_V314_MENU_PATCH
        python3 "$RUNNER_TEMP/lydra_v314_title.py"
    - name: V31.4 Grafik und Hauptmenue vor Kompilierung pruefen
      shell: bash
      run: |
        set -euo pipefail
        SRC="$PROJECT_DIR/src"
        test -s "$SRC/main.c" || { echo '::error::Spiel-Hauptquelle fehlt'; exit 1; }
        test -s "$SRC/lydra_v314_frames.h" || { echo '::error::Intro-Bilder fehlen'; exit 1; }
        grep -q 'vt_v314_input' "$SRC/main.c" || { echo '::error::Hauptmenue fehlt'; exit 1; }
        grep -q 'vt_v314_image_7' "$SRC/lydra_v314_frames.h" || { echo '::error::Bild 8 fehlt'; exit 1; }
        echo 'Alle Intro-Bilder und das Hauptmenue stehen zur Kompilierung bereit.'
    - name: PS1 SDK installieren
      shell: bash
      run: |
        set -euo pipefail
        python3 "$RUNNER_TEMP/replay_v301.py" 'PS1 SDK installieren – V27 Basis'
    - name: V31.4 PS1-Spiel kompilieren
      shell: bash
      run: |
        set -euo pipefail
        python3 "$RUNNER_TEMP/replay_v301.py" 'Lydra V30.1 fuer PS1 kompilieren'
    - name: Fertige BIN und CUE einsammeln
      shell: bash
      run: |
        set -euo pipefail
        python3 "$RUNNER_TEMP/replay_v301.py" 'Fertige PS1-Dateien einsammeln'
    - name: V31.4 PS1-Dateien vor Upload pruefen
      shell: bash
      run: |
        set -euo pipefail
        ls -lah artifacts/
        for file in VTRAIL.bin VTRAIL.cue VTRAIL.exe VTRAIL.elf; do
          test -s "artifacts/$file" || { echo "::error::PS1 Datei fehlt: $file"; exit 1; }
        done
        grep -qi 'VTRAIL.bin' artifacts/VTRAIL.cue || { echo '::error::CUE verweist nicht auf VTRAIL.bin'; exit 1; }
        echo 'Alle PS1-Dateien sind vorhanden.'
    - name: V31.4 BIN CUE ELF EXE hochladen
      uses: actions/upload-artifact@v4
      with:
        name: Lydra-World-Of-Dragon-V31-4-FIX3-PS1
        path: artifacts/VTRAIL.*
        if-no-files-found: error
        retention-days: 14
    - name: V31.4 PS1-Artefakt wurde hochgeladen
      shell: bash
      run: |
        set -euo pipefail
        for f in VTRAIL.bin VTRAIL.cue VTRAIL.exe VTRAIL.elf; do
            test -s "artifacts/$f" || { echo "::error::Kein PS1-Artefakt: $f"; exit 1; }
        done
        echo "FERTIG: BIN, CUE, EXE, ELF wurden als GitHub-Actions-Artefakt hochgeladen."
