      shell: bash
      run: |
        set -euo pipefail
        cat > "$RUNNER_TEMP/lwod_fix24.py" <<'PYFIX24'
        from pathlib import Path
        import re
        import hashlib
        B = Path('android/scripts')
        Q = Path('android/tests')
        log=[]
        def note(msg):
            print('FIX24:',msg,flush=True); log.append(msg)
        def replace(s,a,b,label,required=False):
            n=s.count(a)
            if n==1:
                note(label); return s.replace(a,b,1)
            if required: raise RuntimeError(f'{label}: expected one anchor, got {n}')
            note(f'KEEP {label}: anchor count {n}'); return s

        def edit(name, fn, base=B):
            p=base/name
            s=p.read_text(encoding='utf-8')
            out=fn(s)
            if out!=s: p.write_text(out,encoding='utf-8')

        def function(s,name):
            m=re.search(r'(?ms)^(?:static )?func '+re.escape(name)+r'\([^\n]*\n.*?(?=^(?:func |static func |const |var |class |@|extends )|\Z)',s)
            if not m: return None
            return m

        def scoped(s,name,fn):
            m=function(s,name)
            if not m:
                note('KEEP missing function '+name); return s
            return s[:m.start()]+fn(m.group())+s[m.end():]

        # The old systems are reconstructed for compatibility, but their discarded
        # geometry no longer needs to be instantiated. Keep all their public methods.
        edit('V25BiomeWorld.gd',lambda s:scoped(s,'setup',lambda q:replace(q,'    _build_regions()\n','    # FIX24: replaced by V27ContinuousTerrain.\n','skip discarded V25 region meshes')))
        edit('V26SkyWorldMap.gd',lambda s:scoped(s,'setup',lambda q:replace(q,'    _build_height_expansion()\n','    # FIX24: continuous terrain owns region height.\n    region_root = Node3D.new()\n    region_root.name = "V424EmptyLegacyHeightRoot"\n    game.add_child(region_root)\n','skip discarded V26 plateau meshes')))

        # V31 and the current fusion controller own floor placement. Remove only the
        # exact former giant box; do not touch start-village or house collision.
        main=(B/'Main.gd').read_text(encoding='utf-8')
        motion=(B/'V31TerrainMotion.gd').read_text(encoding='utf-8')
        assert 'terrain_motion.align_to_ground(hero)' in main and 'func align_to_ground(' in motion

        def ground(s):
            old='    game._box(game, Vector3(0.0,-0.52,0.0), Vector3(WORLD_SIZE,1.0,WORLD_SIZE), Color("#729c72"), true)'
            return scoped(s,'_build_extended_ground',lambda q:replace(q,old,'    pass # FIX24: no flat legacy world slab above canyon','remove exact V23 world slab'))

        def decor21(s):
            s=ground(s)
            def chunk(q):
                # Only remove the fixed-height, purely cosmetic patch loop.
                a=re.search(r'(?m)^    for patch in range\(5\):\n',q)
                if a:
                    b=re.search(r'(?m)^    trunks\.visible_instance_count\s*=',q[a.end():])
                    if b and 'patch_x' in q[a.start():a.end()+b.start()] and 'game._box' in q[a.start():a.end()+b.start()]:
                        q=q[:a.start()]+'    # FIX24: terrain vertex colors replace fixed-Y patches.\n'+q[a.end()+b.start():]
                        note('remove V23 decorative ground patches')
                # Use one height sample per tree/stone, without regenerating the layout.
                old='        var point := Vector2(px,pz)\n'
                if q.count(old)==1 and all(q.count(v)==1 for v in ('Vector3(px,0.4*scale,pz)','Vector3(px,1.05*scale,pz)','Vector3(px,3.1*scale,pz)')):
                    q=q.replace(old,old+'        var v424_terrain: Node = game.get_node_or_null("V27ContinuousTerrain")\n        if not is_instance_valid(v424_terrain):\n            continue\n')
                    anchor='        var scale: float = rng.randf_range(0.8,1.5)\n'
                    if q.count(anchor)!=1:
                        raise RuntimeError('V23 vegetation height anchor changed')
                    q=q.replace(anchor,anchor+'        var v424_y: float = float(v424_terrain.call("surface_height_at",px,pz))\n')
                    for v in ('0.4','1.05','3.1'):
                        q=q.replace(f'Vector3(px,{v}*scale,pz)',f'Vector3(px,v424_y+{v}*scale,pz)')
                    note('V23 trees and rocks follow actual surface')
                else: note('KEEP V23 tree geometry: source differs')
                return q
            s=scoped(s,'_make_chunk',chunk)
            # Leave the cell unallocated if terrain does not yet exist.
            if 'var v424_terrain: Node' in s:
                s=scoped(s,'_stream_chunks',lambda q:replace(q,'    var p: Vector3 = game.hero.global_position\n','    if not is_instance_valid(game.get_node_or_null("V27ContinuousTerrain")):\n        return\n    var p: Vector3 = game.hero.global_position\n','defer V23 decoration until terrain exists',True))
            return s
        edit('V21World.gd',decor21)

        # Keep V24 flowers and grass but avoid a second stone population. Preserve
        # caves/shrines/towers and all their existing game coordinates.
        def decor24(s):
            def chunk(q):
                anchor='        var s: float = rng.randf_range(0.65,1.45)\n'
                coords=['Vector3(x,0.30*s,z)','Vector3(x,0.61*s,z)','Vector3(x,1.20*s,z)']
                if q.count(anchor)!=1 or not all(q.count(v)==1 for v in coords):
                    note('KEEP V24 decor: source differs'); return q
                q=q.replace(anchor,anchor+'        var v424_terrain: Node = game.get_node_or_null("V27ContinuousTerrain")\n        if not is_instance_valid(v424_terrain):\n            continue\n        var v424_y: float = float(v424_terrain.call("surface_height_at",x,z))\n')
                for old,v in zip(coords,['0.30','0.61','1.20']): q=q.replace(old,f'Vector3(x,v424_y+{v}*s,z)')
                # Stones are already rendered by V23, but retain deterministic RNG.
                a='            var stone_base := Basis().scaled(Vector3(s, s * 0.65, s))\n            stones.set_instance_transform(stone_count, Transform3D(stone_base, Vector3(x,v424_y+0.30*s,z)))\n            stone_count += 1\n'
                q=replace(q,a,'            continue # FIX24: V23 supplies ordinary rocks.\n','remove redundant V24 rock population')
                note('V24 grass and flowers follow actual surface')
                return q
            s=scoped(s,'_chunk',chunk)
            if 'var v424_terrain: Node' in s:
                s=scoped(s,'_load_nearby',lambda q:replace(q,'    var p: Vector3 = game.hero.global_position\n','    if not is_instance_valid(game.get_node_or_null("V27ContinuousTerrain")):\n        return\n    var p: Vector3 = game.hero.global_position\n','defer V24 vegetation until terrain exists',True))
            return s
        edit('V24Regions.gd',decor24)

        # Lava strips already follow the continuous terrain. Only delete the second
        # system of seven fixed rectangular lava slabs, retain all 18 rock formations.
        lava_old='''        for k in range(7):
                    var lava: Vector2 = center+Vector2(540.0+float(k)*85.0,-920.0+float(k)*54.0)
                    _block(root,lava,Vector3(105.0,1.5,30.0),"#b24f31",1.0)
        '''
        lava_changed=lava_old in (B/'V417Landmarks.gd').read_text(encoding='utf-8')
        lava_terrain=(B/'V27Terrain.gd').read_text(encoding='utf-8')
        assert 'func _create_lava_visuals() -> void:' in lava_terrain and '    _create_lava_visuals()' in lava_terrain
        if lava_changed:
            edit('V417Landmarks.gd',lambda s:replace(s,lava_old,'        # FIX24: terrain-following lava replaces #b24f31 slabs.\n','remove seven duplicate lava slabs',True))
            edit('V417Fix13Smoke.gd',lambda s:replace(s,'if peaks != 18 or lava != 7:','if peaks != 18 or lava != 0:','update obsolete lava-box expectation',True),Q)

        # Preserve exact terrain geometry, color and horizon dimensions. Reuse a bounded
        # cache of deterministic height/color samples at coincident grid points only.
        def terrain(s):
            def horizon(q):
                old='''            var h: float = height_at(p.x,p.y)
                    ring.append(Vector3(p.x-origin.x,h,p.y-origin.y))
                    colors.append(color_at(p.x,p.y,h))'''
                new='''            var sample: Array = _v424_horizon_sample(p)
                    ring.append(Vector3(p.x-origin.x,float(sample[0]),p.y-origin.y))
                    colors.append(sample[1])'''
                return replace(q,old,new,'cache horizon height and color samples',True)
            s=scoped(s,'_v412_rebuild_horizon',horizon)
            assert '_v424_horizon_sample(p)' in s
            s+='''
        # FIX24: bounded cache, no altered terrain heights and no worker-thread access.
        var v424_horizon_samples: Dictionary = {}
        func _v424_horizon_sample(p: Vector2) -> Array:
            if v424_horizon_samples.has(p):
                return v424_horizon_samples[p]
            if v424_horizon_samples.size() >= 16384:
                v424_horizon_samples.clear()
            var h: float = height_at(p.x,p.y)
            var result: Array = [h,color_at(p.x,p.y,h)]
            v424_horizon_samples[p] = result
            return result
        '''
            if lava_changed:
                s=scoped(s,'_create_lava_visuals',lambda q:replace(q,'        var lava := MeshInstance3D.new()\n','        var lava := MeshInstance3D.new()\n        lava.name = "V424Lavafluss_%d" % arm\n','name actual remaining lava meshes',True))
            return s
        edit('V27Terrain.gd',terrain)

        # Miter the four perimeter ridges. Adjacent sides share exactly the same
        # corner vertices and endpoint profile, instead of laying two full meshes over
        # each other. Keep mountain guard and collision body logic unchanged.
        def border(s):
            uv='''func _v421_uv(side: int, along: float, inward: float) -> Vector2:
            match side:
                0: return Vector2(along,inward*T.V421_NORTH)
                1: return Vector2(100.0-inward*T.V421_SIDE,along)
                2: return Vector2(along,100.0-inward*T.V421_SIDE)
                _: return Vector2(inward*T.V421_SIDE,along)'''
            new='''func _v421_uv(side: int, along: float, inward: float) -> Vector2:
            var f: float = along/100.0
            var x: float = lerpf(inward*T.V421_SIDE,100.0-inward*T.V421_SIDE,f)
            var z: float = lerpf(inward*T.V421_NORTH,100.0-inward*T.V421_SIDE,f)
            match side:
                0: return Vector2(x,inward*T.V421_NORTH)
                1: return Vector2(100.0-inward*T.V421_SIDE,z)
                2: return Vector2(x,100.0-inward*T.V421_SIDE)
                _: return Vector2(inward*T.V421_SIDE,z)'''
            if s.count(uv)!=1: note('KEEP perimeter geometry: anchor differs'); return s
            # At both endpoints, profile/height/color must agree, regardless of side.
            # Smoothly blend into the shared profile in a narrow corner zone.
            q=s.replace(uv,new,1)
            a='''            var profile: float = pow(clampf(1.0-absf(t-crest)/(1.0-crest if t>=crest else crest),0.0,1.0),0.50)'''
            b='''            var corner: float = smoothstep(0.0,3.0,minf(u,100.0-u))
                    peak = lerpf(840.0,peak,corner)
                    crest = lerpf(0.42,crest,corner)
                    var profile: float = pow(clampf(1.0-absf(t-crest)/(1.0-crest if t>=crest else crest),0.0,1.0),0.50)'''
            c='profile*46.0*sin(u*7.21+t*15.7+phase)'
            d='''            colors.append(Color(shade,shade*0.98,shade*0.94))'''
            if any(q.count(a)!=1 for a in (a,c,d)):
                note('KEEP perimeter: profile anchors differ'); return s
            q=q.replace(a,b,1).replace(c,c+'*corner',1).replace(d,'            shade = lerpf(0.53,shade,corner)\n'+d,1)
            note('miter four border meshes, matching endpoint heights and shades')
            return q
        edit('V417MountainWall.gd',border)

        # Do not remove assets just because a static grep cannot see their dynamic
        # references. Retain the stable map and every existing gameplay script/test.
        p=Path('android/export_presets.cfg'); s=p.read_text(encoding='utf-8')
        s=replace(s,'version/code=4193','version/code=4194','APK version code',True)
        s=replace(s,'version/name="4.1.7.23"','version/name="4.1.7.24"','APK version name',True)
        p.write_text(s,encoding='utf-8')
        Path('build/diagnose').mkdir(parents=True,exist_ok=True)
        Path('build/diagnose/FIX24_Bereinigung.log').write_text('\n'.join(log)+'\n',encoding='utf-8')
        print('FIX24_CLEANUP_OK')
        PYFIX24
        python3 -m py_compile "$RUNNER_TEMP/lwod_fix24.py"
        python3 "$RUNNER_TEMP/lwod_fix24.py"
        python3 - <<'PYTEST24'
        from pathlib import Path
        p=Path('android/tests/V417Fix12WorldSmoke.gd')
        s=p.read_text(encoding='utf-8')
        a='    var cells: Dictionary = terrain.get("chunks")'
        assert s.count(a)==1
        b='''    # On the cleaned source, the actual terrain must still create all lava arms.
            if FileAccess.get_file_as_string("res://scripts/V27Terrain.gd").contains("V424Lavafluss_%d"):
                for arm in range(3):
                    var lava_mesh := terrain.get_node_or_null("V424Lavafluss_%d" % arm) as MeshInstance3D
                    if lava_mesh == null or lava_mesh.mesh == null or lava_mesh.mesh.get_surface_count()<1:
                        fail("FIX24 terrain lava missing")
                        return
            var sample_pos: Vector2 = city+Vector2(100.0,100.0)
            var sample: Array = terrain.call("_v424_horizon_sample",sample_pos)
            if absf(float(sample[0])-terrain.height_at(sample_pos.x,sample_pos.y))>0.001:
                fail("FIX24 cache changed terrain height")
                return
            var cached_color: Color = sample[1]
            if not cached_color.is_equal_approx(terrain.color_at(sample_pos.x,sample_pos.y,float(sample[0]))):
                fail("FIX24 cache changed terrain color")
                return
            var sample_cache: Dictionary = terrain.get("v424_horizon_samples")
            var count_before: int = sample_cache.size()
            terrain.call("_v424_horizon_sample",sample_pos)
            if sample_cache.size()!=count_before:
                fail("FIX24 cache did not reuse sample")
                return
        '''
        s=s.replace(a,b+a,1)
        p.write_text(s,encoding='utf-8')
        PYTEST24
    - name: FIX27 Waldbaeume in Doerfern und am Mauerrand installieren
      shell: bash
      run: |
        set -euo pipefail
        cat > "$RUNNER_TEMP/lwod_fix25.py" <<'PYFIX25'
        NATURE='# FIX25: One vegetation system on the exact rendered terrain triangles.\n# Shared low-poly resources; each chunk owns at most five MultiMeshes.\nvar v425_meshes: Dictionary = {}\nvar v425_mat: StandardMaterial3D\nvar v425_road_segments: Array[PackedVector2Array] = []\n\nfunc _v425_prepare() -> void:\n    if not v425_meshes.is_empty():\n        return\n    var bark := CylinderMesh.new()\n    bark.top_radius = 0.33\n    bark.bottom_radius = 0.50\n    bark.height = 1.0\n    bark.radial_segments = 7\n    v425_meshes["Holz"] = bark\n    var crown := SphereMesh.new()\n    crown.radius = 0.5\n    crown.height = 1.0\n    crown.radial_segments = 9\n    crown.rings = 5\n    v425_meshes["Laub"] = crown\n    var pine := CylinderMesh.new()\n    pine.top_radius = 0.07\n    pine.bottom_radius = 0.50\n    pine.height = 1.0\n    pine.radial_segments = 8\n    v425_meshes["Nadeln"] = pine\n    var rock := SphereMesh.new()\n    rock.radius = 0.5\n    rock.height = 1.0\n    rock.radial_segments = 6\n    rock.rings = 3\n    v425_meshes["Fels"] = rock\n    var shrub := SphereMesh.new()\n    shrub.radius = 0.5\n    shrub.height = 1.0\n    shrub.radial_segments = 7\n    shrub.rings = 4\n    v425_meshes["Busch"] = shrub\n    v425_mat = StandardMaterial3D.new()\n    v425_mat.vertex_color_use_as_albedo = true\n    v425_mat.roughness = 0.95\n    for route in V417Territories.ROUTES:\n        var path: PackedVector2Array = V417Territories.road_world(route,true)\n        for i in range(path.size()-1):\n            v425_road_segments.append(PackedVector2Array([path[i],path[i+1]]))\n\nfunc _v425_allowed(p: Vector2, clearance: float) -> bool:\n    var uv: Vector2 = V417Territories.world_to_map(p)\n    if V417Territories.v421_border_at(uv) or V417Territories.v421_no_decoration(p,clearance):\n        return false\n    # Check footprints, not just the centre, at the mountain and outer boundary.\n    for off in [Vector2(clearance,0),Vector2(-clearance,0),Vector2(0,clearance),Vector2(0,-clearance)]:\n        var q: Vector2 = p+off\n        if V417Territories.v421_border_at(V417Territories.world_to_map(q)) or V417Territories.mountain_at(q):\n            return false\n    for city in V417Territories.CITIES:\n        var limit: float = 48.0\n        if V427_WOODED_TOWNS.has(city): limit = 61.0\n        elif city == "Ruine" or city == "Tor": limit = 160.0\n        elif city == "Steinland": limit = 55.0\n        if p.distance_squared_to(V417Territories.city_world(String(city))) < pow(limit+clearance,2):\n            return false\n    for segment in v425_road_segments:\n        var a: Vector2 = segment[0]\n        var b: Vector2 = segment[1]\n        var pad: float = clearance+4.5\n        if p.x < minf(a.x,b.x)-pad or p.x > maxf(a.x,b.x)+pad or p.y < minf(a.y,b.y)-pad or p.y > maxf(a.y,b.y)+pad:\n            continue\n        var near: Vector2 = Geometry2D.get_closest_point_to_segment(p,a,b)\n        if near.distance_squared_to(p) < pad*pad:\n            return false\n    return true\n\n# Reuse the vertex heights that _emit_vertex just calculated for this chunk.\nfunc _v425_ground(p: Vector2) -> float:\n    var step: float = CHUNK/float(RESOLUTION)\n    var a := Vector2(floor(p.x/step)*step,floor(p.y/step)*step)\n    var b: Vector2 = a+Vector2(step,0)\n    var c: Vector2 = a+Vector2(0,step)\n    var d: Vector2 = a+Vector2(step,step)\n    if not (v414_vertex_cache.has(a) and v414_vertex_cache.has(b) and v414_vertex_cache.has(c) and v414_vertex_cache.has(d)):\n        return surface_height_at(p.x,p.y)\n    var f: Vector2 = (p-a)/step\n    var h0: float = float(v414_vertex_cache[a][0])\n    var h1: float = float(v414_vertex_cache[b][0])\n    var h2: float = float(v414_vertex_cache[c][0])\n    var h3: float = float(v414_vertex_cache[d][0])\n    if f.x+f.y<=1.0:\n        return h0+(h1-h0)*f.x+(h2-h0)*f.y\n    return h3+(h2-h3)*(1.0-f.x)+(h1-h3)*(1.0-f.y)\n\nfunc _v425_add(data: Dictionary, kind: String, at: Vector3, dimensions: Vector3, tint: Color, turn: Basis = Basis.IDENTITY) -> void:\n    var shape: Basis = turn.scaled_local(dimensions)\n    data[kind].append([Transform3D(shape,at),tint])\n\n# FIX27: coherent forest clusters in world coordinates (no chunk seams).\nfunc _v426_grove(p: Vector2) -> float:\n    var field: float = 0.50 + 0.27*sin(p.x*0.014+p.y*0.009) + 0.16*cos(p.y*0.025-p.x*0.011) + 0.07*sin(p.x*0.039+p.y*0.018)\n    return smoothstep(0.28,0.74,clampf(field,0.0,1.0))\n\nfunc _v425_forest(root: Node3D, cx: int, cz: int) -> void:\n    _v425_prepare()\n    var batches: Dictionary = {"Holz":[],"Laub":[],"Nadeln":[],"Fels":[],"Busch":[]}\n    var rng := RandomNumberGenerator.new()\n    rng.seed = int(425001+cx*73856093+cz*19349663)\n    var origin := Vector2(float(cx)*CHUNK,float(cz)*CHUNK)\n    var step: float = CHUNK/18.0\n    var trees: int = 0\n    var shrubs: int = 0\n    var rocks: int = 0\n    var logs: int = 0\n    for iz in range(18):\n        for ix in range(18):\n            var p: Vector2 = origin+Vector2((float(ix)+rng.randf_range(0.36,0.64))*step,(float(iz)+rng.randf_range(0.36,0.64))*step)\n            var region: int = V417Territories.region_index(p)\n            var dry: bool = region == 7 or region == 10\n            var stone_land: bool = region == 3 or region == 4 or region == 5 or region == 6\n            var frozen: bool = region == 11\n            var forest: bool = region == 9 or region == 0 or region == 1\n            var marsh: bool = region == 8\n            var grove: float = _v426_grove(p)\n            # 324 candidate cells instead of 196: compensate in non-forest biomes.\n            var chance: float = lerpf(0.53,0.98,grove) if forest else ((0.72 if marsh or frozen else (0.43 if dry or stone_land else 0.82))*196.0/324.0)\n            if rng.randf() > chance:\n                continue\n            if region == 7 and p.distance_to(V417Territories.city_world("Aschefurt")+Vector2(550,-900)) < 720.0:\n                continue\n            var pick: float = rng.randf()\n            var tree_cut: float = 0.0 if dry or stone_land else (lerpf(0.49,0.76,grove) if forest else 0.36)\n            var bush_cut: float = tree_cut + (0.06 if region == 7 or frozen else (0.18 if dry or stone_land else (lerpf(0.27,0.12,grove) if forest else 0.27)))\n            # Choose sizes before testing road/town/mountain clearance.\n            var bush_size: float = 0.0\n            var rock_size: float = 0.0\n            var clearance: float = 6.5 if pick < tree_cut else 3.5\n            if pick >= tree_cut and pick < bush_cut and region != 7:\n                bush_size = rng.randf_range(3.0,4.6) if rng.randf()<0.28 else rng.randf_range(1.1,2.7)\n                clearance = maxf(clearance,bush_size*1.2)\n            elif pick >= tree_cut:\n                var rock_pick: float = rng.randf()\n                rock_size = rng.randf_range(5.5,8.0) if rock_pick<0.20 else (rng.randf_range(2.0,5.0) if rock_pick<0.55 else rng.randf_range(0.55,1.8))\n                clearance = maxf(clearance,rock_size*0.80)\n            if not _v425_allowed(p,clearance):\n                continue\n            var y: float = _v425_ground(p)\n            var local := Vector3(p.x-origin.x,y,p.y-origin.y)\n            var yaw: float = rng.randf_range(0.0,TAU)\n            var rot := Basis(Vector3.UP,yaw)\n            var wood := Color("#72503a").lerp(Color("#473629"),rng.randf()*0.65)\n            var green := Color("#285737").lerp(Color("#65934c"),rng.randf())\n            if marsh: green = Color("#315743").lerp(Color("#60846a"),rng.randf())\n            if frozen: green = Color("#567c85").lerp(Color("#dbe8eb"),rng.randf_range(0.3,0.8))\n            if pick < tree_cut:\n                var h: float = rng.randf_range(8.0,16.0) if not forest else rng.randf_range(10.0,20.0)\n                var width: float = h*rng.randf_range(0.32,0.47)\n                _v427_tree(batches,local,h,width,wood,green,rot,frozen or rng.randf()<0.43)\n                trees += 1\n            elif pick < bush_cut and region != 7:\n                var size: float = bush_size\n                var shade: Color = green if not dry else Color("#8e9270")\n                _v425_add(batches,"Busch",local+Vector3(0,size*0.34,0),Vector3(size*1.35,size*0.9,size),shade,rot)\n                _v425_add(batches,"Busch",local+rot*Vector3(size*0.47,size*0.26,0),Vector3(size*0.87,size*0.68,size*0.8),shade.lightened(0.10),rot)\n                if size >= 3.0:\n                    _v425_add(batches,"Busch",local+rot*Vector3(-size*0.39,size*0.43,size*0.12),Vector3(size*0.90,size*1.12,size*0.87),shade.darkened(0.07),rot)\n                shrubs += 1\n            elif not dry and not stone_land and not frozen and pick>0.92:\n                var length: float = rng.randf_range(5.0,10.0)\n                var direction := Vector2(cos(yaw),sin(yaw))\n                var end_a: Vector2 = p-direction*length*0.5\n                var end_b: Vector2 = p+direction*length*0.5\n                if not _v425_allowed(p,length*0.5+1.0):\n                    continue\n                var radius: float = rng.randf_range(0.35,0.65)\n                var a := Vector3(end_a.x-origin.x,_v425_ground(end_a)+radius,end_a.y-origin.y)\n                var b := Vector3(end_b.x-origin.x,_v425_ground(end_b)+radius,end_b.y-origin.y)\n                var axis: Vector3 = (b-a).normalized()\n                var across: Vector3 = axis.cross(Vector3.UP).normalized()\n                if across.length_squared()<0.01: continue\n                var log_basis := Basis(across,axis,across.cross(axis).normalized())\n                _v425_add(batches,"Holz",(a+b)*0.5,Vector3(radius*2.0,a.distance_to(b),radius*2.0),wood,log_basis)\n                logs += 1\n            else:\n                var size: float = rock_size\n                var shade := Color("#797b70").lerp(Color("#a5a294"),rng.randf())\n                if region == 7: shade = Color("#403839").lerp(Color("#79534a"),rng.randf())\n                if frozen: shade = shade.lerp(Color("#c4d2d8"),0.5)\n                _v425_add(batches,"Fels",local+Vector3(0,size*0.29,0),Vector3(size*rng.randf_range(0.9,1.15 if size>=5.5 else 1.5),size*0.72,size),shade,rot)\n                rocks += 1\n    var town_counts: Vector2i = _v427_add_town_trees(batches,origin)\n    trees += town_counts.x+town_counts.y\n    var decor := Node3D.new()\n    decor.name = "V425Natur"\n    decor.set_meta("trees",trees)\n    decor.set_meta("town_trees",town_counts.x)\n    decor.set_meta("edge_trees",town_counts.y)\n    decor.set_meta("shrubs",shrubs)\n    decor.set_meta("rocks",rocks)\n    decor.set_meta("logs",logs)\n    root.add_child(decor)\n    for key in batches:\n        var entries: Array = batches[key]\n        if entries.is_empty(): continue\n        var mm := MultiMesh.new()\n        mm.transform_format = MultiMesh.TRANSFORM_3D\n        mm.use_colors = true\n        mm.mesh = v425_meshes[key] as Mesh\n        mm.instance_count = entries.size()\n        for i in range(entries.size()):\n            mm.set_instance_transform(i,entries[i][0])\n            mm.set_instance_color(i,entries[i][1])\n        var inst := MultiMeshInstance3D.new()\n        inst.name = String(key)\n        inst.multimesh = mm\n        inst.material_override = v425_mat\n        inst.cast_shadow = GeometryInstance3D.SHADOW_CASTING_SETTING_OFF\n        decor.add_child(inst)\n\n\n# FIX27: both town and forest trees use this single model builder.\nfunc _v427_tree(batches: Dictionary, local: Vector3, h: float, width: float, wood: Color, green: Color, rot: Basis, conifer: bool) -> void:\n    var stem: float = h*0.66\n    var diameter: float = h*0.075\n    _v425_add(batches,"Holz",local+Vector3(0,stem*0.5-0.16,0),Vector3(diameter,stem+0.32,diameter),wood,rot)\n    if conifer:\n        for layer in range(3):\n            var factor: float = 1.0-float(layer)*0.24\n            _v425_add(batches,"Nadeln",local+Vector3(0,h*(0.43+float(layer)*0.19),0),Vector3(width*factor,h*0.39,width*factor),green.lightened(float(layer)*0.045),rot)\n    else:\n        _v425_add(batches,"Laub",local+Vector3(0,h*0.73,0),Vector3(width,h*0.52,width*0.91),green,rot)\n        _v425_add(batches,"Laub",local+rot*Vector3(width*0.24,h*0.79,-width*0.12),Vector3(width*0.69,h*0.42,width*0.72),green.lightened(0.08),rot)\n        _v425_add(batches,"Laub",local+rot*Vector3(-width*0.25,h*0.64,width*0.15),Vector3(width*0.63,h*0.36,width*0.67),green.darkened(0.08),rot)\n\nconst V427_HOUSE_ANGLES = [-158.0,-130.0,-99.0,-66.0,-34.0,32.0,63.0,96.0,129.0,158.0]\nconst V427_HOUSE_RADII = [29.0,26.3,30.0,27.2,28.5,29.0,26.4,29.4,27.5,29.1]\nconst V427_WOODED_TOWNS = ["Sonnental","Hügelruh","Wurzelheim","Moordorf","Frostholm"]\n\nfunc _v427_road_clear(p: Vector2, pad: float) -> bool:\n    for segment in v425_road_segments:\n        var a: Vector2 = segment[0]\n        var b: Vector2 = segment[1]\n        if p.x < minf(a.x,b.x)-pad or p.x > maxf(a.x,b.x)+pad or p.y < minf(a.y,b.y)-pad or p.y > maxf(a.y,b.y)+pad:\n            continue\n        if Geometry2D.get_closest_point_to_segment(p,a,b).distance_squared_to(p) < pad*pad:\n            return false\n    return true\n\nfunc _v427_gate_clear(city: String, p: Vector2) -> bool:\n    var center: Vector2 = V417Territories.city_world(city)\n    for gate in V417Territories.gate_names(city):\n        var d: Vector2 = V417Territories.gate_direction(city,gate)\n        if Geometry2D.get_closest_point_to_segment(p,center,center+d*72.0).distance_to(p) < 9.5:\n            return false\n        if p.distance_to(V417Territories.crystal_point(city,gate)) < 8.0:\n            return false\n    return true\n\nfunc _v427_town_clear(city: String, p: Vector2) -> bool:\n    var center: Vector2 = V417Territories.city_world(city)\n    var rad: float = p.distance_to(center)\n    # Ring path ends at radius 25; wall starts around radius 45.\n    # A 10-12 m tree has a maximum crown radius below 3.4 m.\n    if rad < 34.0 or rad > 39.5:\n        return false\n    for i in range(V427_HOUSE_ANGLES.size()):\n        var a: float = deg_to_rad(float(V427_HOUSE_ANGLES[i]))\n        var house: Vector2 = center+Vector2(sin(a),cos(a))*float(V427_HOUSE_RADII[i])\n        if p.distance_to(house)<10.0:\n            return false\n    return _v427_gate_clear(city,p) and _v427_road_clear(p,9.5) and not V417Territories.v421_no_decoration(p,4.0)\n\nfunc _v427_town_sites(city: String) -> PackedVector2Array:\n    _v425_prepare()\n    var result := PackedVector2Array()\n    var center: Vector2 = V417Territories.city_world(city)\n    # A stable, sparse ring of planted trees behind the homes, not on the plaza.\n    for i in range(36):\n        var a: float = TAU*(float(i)+0.5)/36.0\n        var p: Vector2 = center+Vector2(sin(a),cos(a))*38.5\n        if not _v427_town_clear(city,p):\n            continue\n        var spaced: bool = true\n        for previous in result:\n            if previous.distance_to(p)<12.0:\n                spaced = false\n                break\n        if spaced:\n            result.append(p)\n        if result.size()>=7:\n            break\n    return result\n\nfunc _v427_in_chunk(p: Vector2, origin: Vector2) -> bool:\n    return p.x>=origin.x and p.x<origin.x+CHUNK and p.y>=origin.y and p.y<origin.y+CHUNK\n\nfunc _v427_city_tree(batches: Dictionary, p: Vector2, origin: Vector2, city: String, serial: int, outside: bool) -> void:\n    var rng := RandomNumberGenerator.new()\n    rng.seed = int(427000+roundi(p.x)*7919+roundi(p.y)*104729+serial)\n    var h: float = rng.randf_range(10.0,17.0) if outside else rng.randf_range(10.0,12.0)\n    var width: float = h*rng.randf_range(0.32,0.43)\n    var wood: Color = Color("#72503a").lerp(Color("#473629"),rng.randf()*0.65)\n    var green: Color = Color("#285737").lerp(Color("#65934c"),rng.randf())\n    if city == "Moordorf": green = Color("#315743").lerp(Color("#60846a"),rng.randf())\n    if city == "Frostholm": green = Color("#567c85").lerp(Color("#dbe8eb"),rng.randf_range(0.3,0.8))\n    if city == "Sandhafen" or city == "Aschefurt": green = green.lerp(Color("#8b8755"),0.35)\n    var rot := Basis(Vector3.UP,rng.randf_range(0.0,TAU))\n    var local := Vector3(p.x-origin.x,_v425_ground(p),p.y-origin.y)\n    _v427_tree(batches,local,h,width,wood,green,rot,city == "Frostholm" or rng.randf()<0.43)\n\nfunc _v427_add_town_trees(batches: Dictionary, origin: Vector2) -> Vector2i:\n    var count := Vector2i.ZERO\n    for key in V417Territories.V416_GATE_ANGLES:\n        var city: String = String(key)\n        var center: Vector2 = V417Territories.city_world(city)\n        if center.x<origin.x-75.0 or center.x>origin.x+CHUNK+75.0 or center.y<origin.y-75.0 or center.y>origin.y+CHUNK+75.0:\n            continue\n        var sites: PackedVector2Array = _v427_town_sites(city)\n        for i in range(sites.size()):\n            var p: Vector2 = sites[i]\n            if _v427_in_chunk(p,origin):\n                _v427_city_tree(batches,p,origin,city,i,false)\n                count.x+=1\n        if not V427_WOODED_TOWNS.has(city):\n            continue\n        # Irregular woodland edge outside the wall, with free gate approaches.\n        # Ordinary forest objects start farther out so the two sets do not overlap.\n        for i in range(24):\n            var a: float = TAU*(float(i)+0.25)/24.0\n            var r: float = 54.0+2.0*sin(float(i)*2.4)\n            var p: Vector2 = center+Vector2(sin(a),cos(a))*r\n            if not _v427_in_chunk(p,origin) or not _v427_gate_clear(city,p) or not _v427_road_clear(p,11.0):\n                continue\n            if V417Territories.v421_no_decoration(p,6.5) or V417Territories.v421_border_at(V417Territories.world_to_map(p)):\n                continue\n            _v427_city_tree(batches,p,origin,city,i,true)\n            count.y+=1\n    return count\n'
        from pathlib import Path
        import re
        B=Path('android/scripts')
        Q=Path('android/tests')
        notes=[]
        def note(s):
            print('FIX25:',s,flush=True);notes.append(s)
        def once(s,a,b):
            assert s.count(a)==1, 'FIX25 source anchor not unique: '+a[:120]
            return s.replace(a,b,1)
        def function(s,name):
            m=re.search(r'(?ms)^func '+re.escape(name)+r'\([^\n]*\n.*?(?=^(?:func |static func |const |var |class |@|extends )|\Z)',s)
            assert m, 'FIX25 function missing: '+name
            return m
        def disable(s,name):
            m=function(s,name)
            header=m.group().splitlines()[0]
            # These methods are legacy void decoration builders only.
            assert header.endswith('-> void:')
            note('Disable obsolete '+name)
            return s[:m.start()]+header+'\n    pass # FIX25: superseded by current map/terrain.\n\n'+s[m.end():]
        def edit(name,fn):
            p=B/name; old=p.read_text(encoding='utf-8');new=fn(old);p.write_text(new,encoding='utf-8')
        # FIX27: remove only original small trunk/crown generation, not house plants or NPCs.
        def old_ground(s):
            m=function(s,'_build_ground');q=m.group()
            old='        _tree(Vector3(x, 0, z), rng.randf_range(0.8, 1.35))'
            if old in q:
                q=once(q,old,'        pass # FIX27: replacement trees are streamed with the terrain')
                note('Removed V6 ground tree call')
                return s[:m.start()]+q+s[m.end():]
            if '_tree(' not in q:
                note('Original ground tree call already absent')
                return s
            raise SystemExit('FIX27: unexpected original ground tree call')
        edit('Main.gd',old_ground)
        def old_crowns(s):
            m=function(s,'_upgrade_nature');q=m.group()
            a=q.find('    var rng := RandomNumberGenerator.new()')
            b=q.find('    var plants := RandomNumberGenerator.new()')
            if a>=0 and b>a and 'for i in range(42):' in q[a:b]:
                assert 'Color("#267e61")' in q[a:b] and 'Color("#3b966c")' in q[a:b]
                q=q[:a]+q[b:]
                note('Removed V17 duplicate small crowns; kept plants and stones')
                return s[:m.start()]+q+s[m.end():]
            if 'for i in range(42):' not in q:
