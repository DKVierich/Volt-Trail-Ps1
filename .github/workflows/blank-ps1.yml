        awk '
          {print}
          $0 == "    v403_fix5.setup(self)" {
            print "    var v404_shop = load(\"res://scripts/V404Market.gd\").new()"
            print "    add_child(v404_shop)"
            print "    v404_shop.setup(self)"
            boot++
          }
          $0 == "func _on_new_game_pressed() -> void:" {
            print "    if has_node(\"V404Market\"):"
            print "        get_node(\"V404Market\").reset_new_game()"
            ng++
          }
          $0 == "func _save_game() -> void:" {
            print "    if has_node(\"V404Market\"):"
            print "        get_node(\"V404Market\").save_now()"
            sv++
