name: Build Volt Trail PS1 image

on:
  # Manually start the build from GitHub's Actions tab.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Volt Trail
        uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake unzip curl jq

      - name: Download and locate PSn00bSDK
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/Lameguy64/PSn00bSDK/releases/latest"
          URL="$(curl -fsSL "$API" | jq -r '.assets[] | select((.name | ascii_downcase | contains("linux")) and (.name | endswith(".zip"))) | .browser_download_url' | head -n 1)"

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "No Linux ZIP asset found in the latest PSn00bSDK release."
            echo "Check the release assets at https://github.com/Lameguy64/PSn00bSDK/releases"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/psn00bsdk"
          curl -fL "$URL" -o "$RUNNER_TEMP/psn00bsdk.zip"
          unzip -q "$RUNNER_TEMP/psn00bsdk.zip" -d "$RUNNER_TEMP/psn00bsdk"

          SDK_CMAKE="$(find "$RUNNER_TEMP/psn00bsdk" -path '*/lib/libpsn00b/cmake/sdk.cmake' -print -quit)"
          if [ -z "$SDK_CMAKE" ]; then
            echo "Could not find lib/libpsn00b/cmake/sdk.cmake in the downloaded SDK."
            find "$RUNNER_TEMP/psn00bsdk" -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          SDK_ROOT="${SDK_CMAKE%/lib/libpsn00b/cmake/sdk.cmake}"
          echo "PSN00BSDK=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/bin" >> "$GITHUB_PATH"
          echo "Located SDK at: $SDK_ROOT"

      - name: Verify required files and tools
        run: |
          test -f CMakeLists.txt
          test -f src/main.c
          test -f iso.xml
          cmake --version
          mipsel-none-elf-gcc --version
          mkpsxiso --help || true

      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$PSN00BSDK/lib/libpsn00b/cmake/sdk.cmake"
          cmake --build build --verbose

      - name: List generated PlayStation files
        if: success()
        run: |
          find build -type f \( -iname '*.bin' -o -iname '*.cue' -o -iname '*.exe' \) -printf '%p (%s bytes)\n'

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VoltTrail-PS1-build
          path: |
            build/**/*.bin
            build/**/*.cue
            build/**/*.exe
          if-no-files-found: error
          retention-days: 14
