        \ many stones.\nfunc _v462_pave_sonnental() -> void:\n    if not is_instance_valid(game):\n        return\n    var\
        \ previous: Node = game.get_node_or_null(\"V462SonnentalPflaster\")\n    if is_instance_valid(previous):\n       \
