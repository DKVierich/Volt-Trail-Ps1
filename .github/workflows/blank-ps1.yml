    - name: V31.2 Korrigiert - Kamera Bewegung Performance
      shell: bash
      run: |
        set -euo pipefail
        cat > "$RUNNER_TEMP/lydra_v312_apply.py" <<'LYDRA_V312_PATCH'
        #!/usr/bin/env python3
        """Lydra V31.2: movement acceleration and consistent terrain draw budget."""
        import os,re
        from pathlib import Path
        p=Path(os.environ['PROJECT_DIR'])/'src/main.c'
        s=p.read_text(encoding='utf-8')
        
        def span(name):
            match=list(re.finditer(r'\bstatic\s+(?:void|int)\s+'+re.escape(name)+r'\s*\([^;]*?\)\s*\{',s,re.S))
            if len(match)!=1:
                raise RuntimeError('V31.2 expected exactly one '+name+': '+str(len(match)))
            start=match[0].start();pos=match[0].end();depth=1;state='code'
            while pos<len(s) and depth:
                ch=s[pos];nextc=s[pos+1] if pos+1<len(s) else ''
                if state=='code':
                    if ch=='/' and nextc=='/':state='line';pos+=1
                    elif ch=='/' and nextc=='*':state='block';pos+=1
                    elif ch=='"':state='string'
                    elif ch=="'":state='char'
                    elif ch=='{':depth+=1
                    elif ch=='}':depth-=1
                elif state=='line':
                    if ch=='\n':state='code'
                elif state=='block':
                    if ch=='*' and nextc=='/':state='code';pos+=1
                elif state in ('string','char'):
                    if ch=='\\':pos+=1
                    elif (state=='string' and ch=='"') or (state=='char' and ch=="'"):state='code'
                pos+=1
            if depth:raise RuntimeError('Unclosed function '+name)
            return start,pos
        
        def replace_func(name,new):
            global s
            a,b=span(name)
            s=s[:a]+new.strip()+'\n'+s[b:]
        
        move=r'''
        /* V31.2: accelerate/decelerate subunits and ease turn initiation.
           Input retains UP forward, DOWN backward, LEFT/RIGHT camera only.
           The established movement/collision/save formats are untouched. */
        static void vt_v293_move(unsigned int pad) {
            static int rem_x=0,rem_z=0;
            static int last_x=0,last_z=0,ready=0;
            static int velocity=0;        /* -4096 to 4096, signed running speed */
            static int turn_velocity=0;   /* signed angle units per frame, in Q8 */
            int direction=0,turn=0,desired_turn,desired_velocity;
            int diff,dx=0,dz=0,vx,vz;
            if(!ready || px!=last_x || pz!=last_z) {
                rem_x=rem_z=velocity=0;
                ready=1;
            }
        
            if((pad&PAD_RIGHT) && !(pad&PAD_LEFT))turn=-1;
            else if((pad&PAD_LEFT) && !(pad&PAD_RIGHT))turn=1;
        
            if(turn) {
                desired_turn=turn*20*256; /* full turn is ~1.76 degrees per rendered frame */
                diff=desired_turn-turn_velocity;
                turn_velocity+=(diff/3);
                if(diff>-3 && diff<3)turn_velocity=desired_turn;
                vt_v292_cam_yaw=(vt_v292_cam_yaw+(turn_velocity/256)+4096)&4095;
            } else {
                turn_velocity=0; /* no drift after releasing the camera turn */
            }
            vt_v292_yaw_target=vt_v292_cam_yaw;
        
            if((pad&PAD_UP) && !(pad&PAD_DOWN))direction=1;
            else if((pad&PAD_DOWN) && !(pad&PAD_UP))direction=-1;
            desired_velocity=direction*4096;
            diff=desired_velocity-velocity;
            velocity+=diff/4;
            if(diff>-8 && diff<8)velocity=desired_velocity;
            if(velocity>-30 && velocity<30 && !direction)velocity=0;
            if(velocity) {
                /* X/Z velocity in units * 1024; keep fractional remainder on diagonal headings. */
                vx=(-vt_v293_sin(vt_v292_cam_yaw)*velocity)/1024;
                vz=( vt_v293_cos(vt_v292_cam_yaw)*velocity)/1024;
                rem_x+=vx;
                rem_z+=vz;
                dx=rem_x/1024;
                dz=rem_z/1024;
                rem_x-=dx*1024;
                rem_z-=dz*1024;
                px+=dx; pz+=dz;
                if(px < -WORLD_LIMIT) {px=-WORLD_LIMIT;rem_x=0;velocity=0;}
                if(px >  WORLD_LIMIT) {px= WORLD_LIMIT;rem_x=0;velocity=0;}
                if(pz < -WORLD_LIMIT) {pz=-WORLD_LIMIT;rem_z=0;velocity=0;}
                if(pz >  WORLD_LIMIT) {pz= WORLD_LIMIT;rem_z=0;velocity=0;}
                if(dx || dz)step_count++;
                if(dx || dz) {
                    vt_v293_avatar_yaw=((velocity>0?2048:0)-vt_v292_cam_yaw+4096)&4095;
                    if(dx>0 && dx>= (dz<0?-dz:dz))facing=2;
                    else if(dx<0 && -dx>= (dz<0?-dz:dz))facing=1;
                    else facing=(dz>=0)?3:0;
                }
            } else {
                rem_x=rem_z=0;
            }
            last_x=px;last_z=pz;
        }
        '''
        replace_func('vt_v293_move',move)
        
        # Keep the same terrain extent at a lower polygon cost.
        a,b=span('vt_v300_extend_ground')
        body=s[a:b]
        if 'near_step=140, near_cells=18' not in body:
            raise RuntimeError('Expected V31.1 near terrain settings, found different source')
        body=body.replace('near_step=140, near_cells=18', 'near_step=158, near_cells=16')
        # V31.2 KORRIGIERT: do not rely on C whitespace-specific string matches.
        # Keep ALL distant terrain tiles: this protects full 360-degree visibility
        # while the near terrain mesh (above) uses fewer polygons.
        if 'vt_v241_flat(x,z,x+far_step,z+far_step,44,' not in body:
            raise RuntimeError('V31.2: expected 360-degree far terrain renderer is missing')
        s=s[:a]+body+s[b:]

        # Horizon is a distant visual ring: still closes 360 degrees with 16 wider peaks.
        a,b=span('vt_v300_horizon')
        body=s[a:b]
        if 'for(i=0;i<24;i++)' not in body or '(i*4096)/24' not in body:
            raise RuntimeError('V30.3 horizon changed unexpectedly')
        body=body.replace('for(i=0;i<24;i++)','for(i=0;i<16;i++)',1)
        body=body.replace('(i*4096)/24','(i*4096)/16',1)
        s=s[:a]+body+s[b:]
        
        for name in ('vt_v293_sin','vt_v293_move','vt_v300_extend_ground','vt_v300_horizon','vt_player','vt_sparkit'):
            span(name)
        for feat in ('vt_v281_resolve_movement();','vt_v282_draw_house_npcs(',
                     'vt_opt_draw_page();','vt_save_game(void)','vt_load_game(void)',
                     'vt_v31_oval(', 'vt_v301_sun(void)','vt_v292_draw_exploration_hud();'):
            if feat not in s:raise RuntimeError('V31.2 lost feature '+feat)
        p.write_text(s,encoding='utf-8')
        print('V31.2: eased camera turn/movement; no sideways translation on LEFT/RIGHT.')
        print('V31.2: lower ground draw cost while retaining 360-degree streaming coverage.')
        LYDRA_V312_PATCH
        python3 "$RUNNER_TEMP/lydra_v312_apply.py"

    - name: V31.3 Kamerakonflikt und langsame Bewegung reparieren
      shell: bash
      run: |
        set -euo pipefail
        cat > "$RUNNER_TEMP/lydra_v313_patch.py" <<'LYDRA_V313_PATCH'
        #!/usr/bin/env python3
        # V31.3 remove competing auto-follow yaw, improve movement response and terrain load.
        import os,re
        from pathlib import Path
        p=Path(os.environ['PROJECT_DIR'])/'src/main.c'
        s=p.read_text(encoding='utf-8')
        
        def span(name):
            pattern=r'\bstatic\s+(?:void|int)\s+'+re.escape(name)+r'\s*\([^;]*?\)\s*\{'
            matches=list(re.finditer(pattern,s,re.S))
            if len(matches)!=1:
                raise RuntimeError('V31.3 expected exactly one '+name+': '+str(len(matches)))
            start=matches[0].start();pos=matches[0].end();depth=1;state='code'
            while pos<len(s) and depth:
                ch=s[pos];nex=s[pos+1] if pos+1<len(s) else ''
                if state=='code':
                    if ch=='/' and nex=='/':state='line';pos+=1
                    elif ch=='/' and nex=='*':state='block';pos+=1
                    elif ch=='"':state='string'
                    elif ch=="'":state='char'
                    elif ch=='{':depth+=1
                    elif ch=='}':depth-=1
                elif state=='line':
                    if ch=='\n':state='code'
                elif state=='block':
                    if ch=='*' and nex=='/':state='code';pos+=1
                else:
                    if ch=='\\':pos+=1
                    elif (state=='string' and ch=='"') or (state=='char' and ch=="'"):state='code'
                pos+=1
            if depth:raise RuntimeError('V31.3 unclosed '+name)
            return start,pos
        
        def replace(name,body):
            global s
            a,b=span(name)
            s=s[:a]+body.strip()+'\n'+s[b:]
        
        # Root cause: old V29.2 auto-follow recomputes yaw target from movement dx/dz
        # every frame and fights the manual LEFT/RIGHT camera established in V29.3.
        replace('vt_v292_update_camera',r'''
        static void vt_v292_update_camera(void) {
            /* V31.3: manual camera only, no turning based on walking. */
            vt_v292_last_x=px;
            vt_v292_last_z=pz;
            vt_v292_tracking=1;
            vt_v292_yaw_target=vt_v292_cam_yaw;
        }
        ''')
        
        replace('vt_v293_move',r'''
        /* V31.3: responsive manual camera and faster camera-relative movement.
           Q10 subunits preserve diagonal motion between PS1 frames. */
        static void vt_v293_move(unsigned int pad) {
            static int fraction_x=0,fraction_z=0;
            static int last_px=0,last_pz=0,initialized=0;
            static int speed_q10=0;
            int forward=0,turn=0,target;
            int vx,vz,dx,dz;
            /* Only reset velocity after teleports, not small collision adjustments. */
            if(!initialized || px-last_px>80 || px-last_px< -80 ||
               pz-last_pz>80 || pz-last_pz< -80) {
                fraction_x=fraction_z=0;
                speed_q10=0;
                initialized=1;
            }
            if((pad&PAD_RIGHT) && !(pad&PAD_LEFT))turn=-1;
            else if((pad&PAD_LEFT) && !(pad&PAD_RIGHT))turn=1;
            if(turn)vt_v292_cam_yaw=(vt_v292_cam_yaw+turn*40+4096)&4095;
            vt_v292_yaw_target=vt_v292_cam_yaw;
            if((pad&PAD_UP) && !(pad&PAD_DOWN))forward=1;
            else if((pad&PAD_DOWN) && !(pad&PAD_UP))forward=-1;
            if(!forward) {
                speed_q10=0;
                fraction_x=fraction_z=0;
            } else {
                /* Full 8 units per frame after at most three movement updates. */
                target=forward*8192;
                if(speed_q10<target) {
                    speed_q10+=3072;
                    if(speed_q10>target)speed_q10=target;
                } else if(speed_q10>target) {
                    speed_q10-=3072;
                    if(speed_q10<target)speed_q10=target;
                }
                vx=(-vt_v293_sin(vt_v292_cam_yaw)*speed_q10)/1024;
                vz=( vt_v293_cos(vt_v292_cam_yaw)*speed_q10)/1024;
                fraction_x+=vx;
                fraction_z+=vz;
                dx=fraction_x/1024;
                dz=fraction_z/1024;
                fraction_x-=dx*1024;
                fraction_z-=dz*1024;
                px+=dx;pz+=dz;
                if(px < -WORLD_LIMIT) {px=-WORLD_LIMIT;fraction_x=0;speed_q10=0;}
                if(px > WORLD_LIMIT)  {px=WORLD_LIMIT;fraction_x=0;speed_q10=0;}
                if(pz < -WORLD_LIMIT) {pz=-WORLD_LIMIT;fraction_z=0;speed_q10=0;}
                if(pz > WORLD_LIMIT)  {pz=WORLD_LIMIT;fraction_z=0;speed_q10=0;}
                if(dx||dz) {
                    step_count++;
                    vt_v293_avatar_yaw=((speed_q10>0?2048:0)-vt_v292_cam_yaw+4096)&4095;
                    if(dx>0 && dx>= (dz<0?-dz:dz))facing=2;
                    else if(dx<0 && -dx>= (dz<0?-dz:dz))facing=1;
                    else facing=(dz>=0)?3:0;
                }
            }
            last_px=px;last_pz=pz;
        }
        ''')
        
        # 256 to 196 visible near-field cells, same near-field span (2528 -> 2520).
        a,b=span('vt_v300_extend_ground')
        block=s[a:b]
        old='near_step=158, near_cells=16'
        if block.count(old)!=1:
            raise RuntimeError('V31.3 expected corrected V31.2 near terrain source')
        block=block.replace(old,'near_step=180, near_cells=14',1)
        s=s[:a]+block+s[b:]
        
        for x in ('vt_v281_resolve_movement();','vt_v282_draw_house_npcs(',
                  'vt_opt_draw_page();','vt_save_game(void)','vt_load_game(void)',
                  'vt_v31_oval(','vt_v301_sun(void)','vt_v292_draw_exploration_hud();'):
            if x not in s:raise RuntimeError('V31.3 lost system '+x)
        for name in ('vt_v293_move','vt_v292_update_camera','vt_v300_extend_ground'):
            span(name)
        p.write_text(s,encoding='utf-8')
        print('V31.3: fixed manual camera, 2x movement speed and 23 percent less near terrain.')
        LYDRA_V313_PATCH
        python3 "$RUNNER_TEMP/lydra_v313_patch.py"
