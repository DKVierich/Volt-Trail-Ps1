
name: Build Volt Trail PS1 V13 Fixed

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build unzip curl jq tar \
            ffmpeg python3-pil python3-yaml

      - name: Prepare project and V12 backup
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/VoltTrail_PS1_AndroidReady_V7.zip"
          VIDEO="$GITHUB_WORKSPACE/DKVierich_Produktion_PS1_Intro_original.mp4"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Original V7 ZIP missing"
            exit 1
          fi

          if [ ! -f "$VIDEO" ]; then
            echo "::error::Intro video missing"
            exit 1
          fi

          V12_COMMIT="9fe565d33d905521e42d05b09ad6bfbe5b9bc3a5"

          curl --retry 3 -fsSL \
            "https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/$V12_COMMIT/.github/workflows/blank-ps1.yml" \
            -o "$RUNNER_TEMP/v12.yml"

          DEST="$RUNNER_TEMP/v13-project"
          mkdir -p "$DEST"
          unzip -q "$ZIP" -d "$DEST"

          CMAKE_FILE="$(find "$DEST" -type f -name CMakeLists.txt -print -quit)"

          if [ -z "$CMAKE_FILE" ]; then
            echo "::error::Project files missing"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$CMAKE_FILE")"

          for file in CMakeLists.txt src/main.c iso.xml system.cnf; do
            if [ ! -f "$PROJECT_DIR/$file" ]; then
              echo "::error::Missing $file"
              exit 1
            fi
          done

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Restore working V12 game and intro
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          import yaml

          workflow = Path(os.environ["RUNNER_TEMP"]) / "v12.yml"

          data = yaml.safe_load(
              workflow.read_text(encoding="utf-8")
          )

          steps = data["jobs"]["build"]["steps"]

          wanted_steps = [
              "Convert DKVierich intro",
              "Apply V12 graphics and gameplay"
          ]

          for wanted in wanted_steps:
              matching = [
                  step for step in steps
                  if step.get("name") == wanted
              ]

              if len(matching) != 1:
                  raise RuntimeError(
                      "V12 step missing: " + wanted
                  )

              print("Executing:", wanted, flush=True)

              subprocess.run(
                  [
                      "bash",
                      "-euo",
                      "pipefail",
                      "-c",
                      matching[0]["run"]
                  ],
                  env=os.environ.copy(),
                  check=True
              )

          print("V12 game and intro restored")
          PY

      - name: Apply V13 camera and 3D animation
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path

          path = (
              Path(os.environ["PROJECT_DIR"])
              / "src"
              / "main.c"
          )

          code = path.read_text(encoding="utf-8")

          def replace_once(old, new):
              global code

              count = code.count(old)

              if count != 1:
                  raise RuntimeError(
                      "Patch marker mismatch: "
                      + old[:70]
                      + " - count "
                      + str(count)
                  )

              code = code.replace(old, new, 1)

          # Improve the camera projection.
          replace_once(
              "gte_SetGeomScreen(180);",
              "gte_SetGeomScreen(225);"
          )

          # Update the version shown in the HUD.
          replace_once(
              "VOLT TRAIL V12 - %s",
              "VOLT TRAIL V13 - %s"
          )

          # Add a new animation variable.
          replace_once(
              "static void vt_sparkit(int x, int z) {",
              "static int vt_walk_phase = 0;\n\n"
              "static void vt_sparkit(int x, int z) {"
          )

          # Replace the Sparkit model with
          # an animated version.
          start = code.index(
              "static void vt_sparkit(int x, int z) {"
          )

          end = code.index(
              "static void vt_mosslet(",
              start
          )

          sparkit = r'''
          static void vt_sparkit(int x, int z) {
              int bounce = 0;
              int foot = 0;

              if (vt_walk_phase != 0) {
                  if (
                      vt_walk_phase >= 8 &&
                      vt_walk_phase < 24
                  ) {
                      bounce = 5;
                  }

                  if (vt_walk_phase < 16) {
                      foot = 4;
                  } else {
                      foot = -4;
                  }
              }

              /* Yellow body */
              draw_box(
                  x, 20 - bounce, z, 14,
                  238, 181, 38
              );

              /* Head */
              draw_box(
                  x, 2 - bounce, z - 4, 12,
                  255, 211, 65
              );

              /* Left ear */
              vt_pyramid(
                  x - 10, -6 - bounce, z - 3,
                  7, 23,
                  255, 203, 42
              );

              /* Right ear */
              vt_pyramid(
                  x + 10, -6 - bounce, z - 3,
                  7, 23,
                  255, 203, 42
              );

              /* Left eye */
              draw_box(
                  x - 6, -1 - bounce, z - 14,
                  3, 22, 31, 52
              );

              /* Right eye */
              draw_box(
                  x + 6, -1 - bounce, z - 14,
                  3, 22, 31, 52
              );

              /* Tail */
              draw_box(
                  x + 19, 18 - bounce, z + 5,
                  7, 244, 148, 25
              );

              /* Animated left foot */
              draw_box(
                  x - 8,
                  34 - bounce - foot,
                  z - 2,
                  5, 180, 110, 35
              );

              /* Animated right foot */
              draw_box(
                  x + 8,
                  34 - bounce + foot,
                  z - 2,
                  5, 180, 110, 35
              );
          }

          '''

          code = (
              code[:start]
              + sparkit
              + code[end:]
          )

          # Animate Sparkit only when moving.
          # Construct the C source using Python
          # strings to avoid YAML indentation errors.
          walking_code = (
              "        if (\n"
              "            game_mode == 0 &&\n"
              "            (pad & (PAD_LEFT | PAD_RIGHT | "
              "PAD_UP | PAD_DOWN))\n"
              "        ) {\n"
              "            vt_walk_phase = "
              "(vt_walk_phase + 1) & 31;\n"
              "        } else {\n"
              "            vt_walk_phase = 0;\n"
              "        }\n"
              "\n"
          )

          replace_once(
              "        draw_ground();",
              walking_code
              + "        draw_ground();"
          )

          # Add a leafy crest and feet to Mosslet.
          start = code.index(
              "static void vt_mosslet("
          )

          end = code.index(
              "static void vt_draw_panel(",
              start
          )

          mosslet = code[start:end]
          closing = mosslet.rfind("}")

          if closing < 0:
              raise RuntimeError(
                  "Mosslet function not found"
              )

          details = r'''
              /* Leaf crest */
              vt_pyramid(
                  x, -13, z + 1,
                  11, 19,
                  49, 170, 78
              );

              /* Left foot */
              draw_box(
                  x - 10, 38, z,
                  6, 40, 113, 54
              );

              /* Right foot */
              draw_box(
                  x + 10, 38, z,
                  6, 40, 113, 54
              );
          '''

          mosslet = (
              mosslet[:closing]
              + details
              + "\n"
              + mosslet[closing:]
          )

          code = (
              code[:start]
              + mosslet
              + code[end:]
          )

          # Extra trees and a closer entrance.
          scenery = (
              "vt_tree(-185, 145);\n"
              "              vt_tree(185, 155);\n"
              "              vt_tree(-230, 405);\n"
              "              vt_tree(230, 420);\n"
              "              vt_gate(310);"
          )

          replace_once(
              "vt_gate(335);",
              scenery
          )

          # Extra crystals in the mountain area.
          crystals = (
              "vt_crystal(-90, 235);\n"
              "                  vt_crystal(-170, 185);\n"
              "                  vt_crystal(170, 205);"
          )

          replace_once(
              "vt_crystal(-90, 235);",
              crystals
          )

          # Verify important systems.
          required = [
              "VOLT TRAIL V13",
              "vt_walk_phase",
              "gte_SetGeomScreen(225)",
              "FntFlush(0);",
              "FntFlush(1);",
              "vt_play_intro();"
          ]

          for marker in required:
              if marker not in code:
                  raise RuntimeError(
                      "Missing game feature: "
                      + marker
                  )

          path.write_text(
              code,
              encoding="utf-8"
          )

          print("V13 graphics patch complete")
          print("Animated Sparkit added")
          print("New Mosslet details added")
          print("Camera and landscape improved")
          print("Intro, controls and battle logic kept")
          PY

      - name: Install PSn00bSDK
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          import yaml

          path = (
              Path(os.environ["RUNNER_TEMP"])
              / "v12.yml"
          )

          steps = yaml.safe_load(
              path.read_text(encoding="utf-8")
          )["jobs"]["build"]["steps"]

          matches = [
              step for step in steps
              if step.get("name") == "Download PSn00bSDK"
          ]

          if len(matches) != 1:
              raise RuntimeError(
                  "Original PSn00bSDK setup missing"
              )

          subprocess.run(
              [
                  "bash",
                  "-euo",
                  "pipefail",
                  "-c",
                  matches[0]["run"]
              ],
              check=True,
              env=os.environ.copy()
          )

          print("PSn00bSDK setup complete")
          PY

      - name: Build Volt Trail V13
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            -S "$PROJECT_DIR" \
            -B "$GITHUB_WORKSPACE/build" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PSN00BSDK_CMAKE" \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build \
            "$GITHUB_WORKSPACE/build" \
            --verbose

      - name: Collect PS1 files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            "$GITHUB_WORKSPACE/artifacts"

          for file in \
            VTRAIL.bin \
            VTRAIL.cue \
            VTRAIL.exe \
            VTRAIL.elf
          do
            SOURCE="$GITHUB_WORKSPACE/build/$file"

            if [ ! -s "$SOURCE" ]; then
              echo "::error::Missing PS1 file: $file"
              exit 1
            fi

            cp "$SOURCE" \
              "$GITHUB_WORKSPACE/artifacts/"
          done

          ls -lh \
            "$GITHUB_WORKSPACE/artifacts"

      - name: Upload Volt Trail V13
        uses: actions/upload-artifact@v4
        with:
          name: VoltTrail-PS1-V13-Fixed
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
