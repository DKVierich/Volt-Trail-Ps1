        \ s.count(old_corner)==1,'FIX61: original curve anchor changed'\ns=s.replace(old_corner,new_corner,1)\n\nold_vertex='''func\
        \ _v456_road_vertex(st: SurfaceTool, p: Vector2, tint: Color) -> void:\n    st.set_color(tint)\n    # Use Wurzelheim's\
