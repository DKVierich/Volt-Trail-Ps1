      - name: V40.9.6 3D-Modellgeometrie pruefen
        shell: bash
        run: |
          set -euo pipefail
          cat > android/tests/V4096GeometrySmoke.gd <<'GD_GEOMETRY'
          extends SceneTree
          class TestGame:
              extends Node3D
              var hero: Node3D
              var phoenix: Node3D
          func _initialize() -> void:
              call_deferred("_run")
          func _run() -> void:
              var game := TestGame.new()
              root.add_child(game)
              game.hero = Node3D.new()
              game.phoenix = Node3D.new()
              game.add_child(game.hero)
              game.add_child(game.phoenix)
              var hero_script: Script = load("res://scripts/V4094HeroPhoenix.gd") as Script
              if hero_script == null or not hero_script.can_instantiate():
                  push_error("V4096: Character model could not be loaded")
                  quit(1)
                  return
              var renderer: Node = hero_script.new()
              game.add_child(renderer)
              renderer.call("setup", game)
              renderer.call("_bind_characters")
              var hv: Node3D = game.hero.get_node_or_null("LWOD_V4094_HeroVisual") as Node3D
              var pv: Node3D = game.phoenix.get_node_or_null("LWOD_V4094_PhoenixVisual") as Node3D
              if hv == null or pv == null:
                  push_error("V4096: character visuals missing")
                  quit(2)
                  return
              var armor: MeshInstance3D = hv.get_node_or_null("Figur_Torso") as MeshInstance3D
              var face: MeshInstance3D = hv.get_node_or_null("Gesicht") as MeshInstance3D
              var feather: MeshInstance3D = pv.get_node_or_null("Lebendiger_Phoenix/Fluegel_L/Primaerfeder_4") as MeshInstance3D
              var tail_mesh: MeshInstance3D = pv.get_node_or_null("Lebendiger_Phoenix/Federschweif/Schweif_Hauptfeder_3") as MeshInstance3D
              if armor == null or face == null or feather == null or tail_mesh == null:
                  push_error("V4096: sculpted body, face, flight feather or tail missing")
                  quit(3)
                  return
              if armor.mesh.get_surface_count() < 1 or feather.mesh.get_surface_count() < 1:
                  push_error("V4096: missing procedural mesh surfaces")
                  quit(4)
                  return
              print("V4096_GEOMETRY_OK: sculpted heroine and swept phoenix feathers")
              quit(0)
          GD_GEOMETRY
          timeout --signal=TERM --kill-after=5s 100s \
            godot --headless --path android --quit-after 300 --script res://tests/V4096GeometrySmoke.gd \
            2>&1 | tee /tmp/lwod_geometry.log
          if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Invalid call|Failed to load script' /tmp/lwod_geometry.log; then
            echo 'FEHLER: Godot meldet einen Modellfehler'
            exit 1
          fi
          grep -Fq 'V4096_GEOMETRY_OK:' /tmp/lwod_geometry.log
          echo 'GEOMETRY_OK'

      - name: V40.9.7 Modell und Fluganimation testen
        shell: bash
        run: |
          set -euo pipefail
          cat > android/tests/V4097CharacterAnimationSmoke.gd <<'GD4097TEST'
          extends SceneTree
          class TestGame:
              extends Node3D
              var hero: Node3D
              var phoenix: Node3D
          func _initialize() -> void:
              call_deferred("_run")
          func _run() -> void:
              var g := TestGame.new()
              root.add_child(g)
              g.hero = Node3D.new()
              g.phoenix = Node3D.new()
              g.add_child(g.hero)
              g.add_child(g.phoenix)
              var script: Script = load("res://scripts/V4094HeroPhoenix.gd") as Script
              if script == null or not script.can_instantiate():
                  push_error("V4097: Script nicht ladbar")
                  quit(1)
                  return
              var visuals: Node = script.new()
              g.add_child(visuals)
              visuals.call("setup",g)
              visuals.call("_bind_characters")
              var hv: Node3D = g.hero.get_node_or_null("LWOD_V4094_HeroVisual") as Node3D
              var pv: Node3D = g.phoenix.get_node_or_null("LWOD_V4094_PhoenixVisual") as Node3D
              if hv == null or pv == null or not hv.has_meta("lwod_v4097_hero") or not pv.has_meta("lwod_v4097_unique_phoenix"):
                  push_error("V4097: Figurenmarkierungen fehlen")
                  quit(2)
                  return
              var gem: MeshInstance3D = hv.get_node_or_null("Wappen_Kristall") as MeshInstance3D
              var armor: MeshInstance3D = hv.get_node_or_null("Brustpanzer_L") as MeshInstance3D
              var l: Node3D = pv.get_node_or_null("Lebendiger_Phoenix/Fluegel_L/Fluegelspitze_Gelenk") as Node3D
              var r: Node3D = pv.get_node_or_null("Lebendiger_Phoenix/Fluegel_R/Fluegelspitze_Gelenk") as Node3D
              var crest: Node3D = pv.get_node_or_null("Lebendiger_Phoenix/Federkrone_Gelenk") as Node3D
              if gem == null or armor == null or l == null or r == null or crest == null:
                  push_error("V4097: Detailteile oder Fluegelgelenke fehlen")
                  quit(3)
                  return
              var before: float = l.rotation.z
              visuals.call("_process",0.08)
              if absf(l.rotation.z-before) < 0.001 or absf(l.rotation.z+r.rotation.z) > 0.001:
                  push_error("V4097: Fluegelgelenke bewegen sich nicht synchron")
                  quit(4)
                  return
              var wingbeat: float = l.rotation.z
              for i in range(76):
                  visuals.call("_process",0.08)
              if absf(l.rotation.z-wingbeat) < 0.001:
                  push_error("V4097: Fluegelphase hat sich nicht geaendert")
                  quit(5)
                  return
              print("V4097_MODEL_ANIMATION_OK")
              quit(0)
          GD4097TEST
          timeout --signal=TERM --kill-after=5s 90s \
            godot --headless --path android --quit-after 300 --script res://tests/V4097CharacterAnimationSmoke.gd \
            2>&1 | tee /tmp/lwod_4097_figure.log
          if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Invalid call|Failed to load script' /tmp/lwod_4097_figure.log; then
            exit 1
          fi
          grep -Fq 'V4097_MODEL_ANIMATION_OK' /tmp/lwod_4097_figure.log
          echo 'V4097_TESTS_OK'

      - name: V40.9.8 Fluegel und Schaerfeparameter testen
        shell: bash
        run: |
          set -euo pipefail
          cat > android/tests/V4098ClaritySmoke.gd <<'GD4098TEST'
          extends SceneTree
          class TestGame:
              extends Node3D
              var hero: Node3D
              var phoenix: Node3D
          func _initialize() -> void:
              call_deferred("_run")
          func _run() -> void:
              var g := TestGame.new()
              root.add_child(g)
              g.hero = Node3D.new()
              g.phoenix = Node3D.new()
              g.add_child(g.hero)
              g.add_child(g.phoenix)
              var src: Script = load("res://scripts/V4094HeroPhoenix.gd") as Script
              if src == null or not src.can_instantiate():
                  push_error("V4098: Modell konnte nicht geladen werden")
                  quit(1)
                  return
              var visuals: Node = src.new()
              g.add_child(visuals)
              visuals.call("setup",g)
              visuals.call("_bind_characters")
              var hv: Node3D = g.hero.get_node_or_null("LWOD_V4094_HeroVisual") as Node3D
              var pv: Node3D = g.phoenix.get_node_or_null("LWOD_V4094_PhoenixVisual") as Node3D
              if hv == null or pv == null or not hv.has_meta("lwod_v4098_hero") or not pv.has_meta("lwod_v4098_unique_phoenix"):
                  push_error("V4098: Neue Modelle fehlen")
                  quit(2)
                  return
              var wing: Node3D = pv.get_node_or_null("Lebendiger_Phoenix/Fluegel_L") as Node3D
              if wing == null:
                  push_error("V4098: Fluegel fehlt")
                  quit(3)
                  return
              var count_primaries: int = 0
              for child in wing.get_children():
                  if String(child.name).begins_with("Primaerfeder_"):
                      count_primaries += 1
                      var mesh: MeshInstance3D = child as MeshInstance3D
                      if mesh == null or mesh.mesh == null:
                          push_error("V4098: Federgeometrie fehlt")
                          quit(4)
                          return
                      var mat: StandardMaterial3D = mesh.material_override as StandardMaterial3D
                      if mat == null or (mat.emission_enabled and mat.emission_energy_multiplier > 0.05):
                          push_error("V4098: Feder-Emissionswert zu hoch")
                          quit(5)
                          return
              if count_primaries != 7:
                  push_error("V4098: Unerwartete Anzahl Hauptfedern")
                  quit(6)
                  return
              var before: float = wing.rotation.z
              visuals.call("_process",0.08)
              if absf(wing.rotation.z-before) < 0.001:
                  push_error("V4098: Fluegelanimation fehlt")
                  quit(7)
                  return
              print("V4098_CLARITY_OK: breitere Federn, reduzierte Emission, ruhiger Flug")
              quit(0)
          GD4098TEST
          timeout --signal=TERM --kill-after=5s 90s \
            godot --headless --path android --quit-after 300 --script res://tests/V4098ClaritySmoke.gd \
            2>&1 | tee /tmp/lwod_4098_clarity.log
          if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Invalid call|Failed to load script' /tmp/lwod_4098_clarity.log; then
            exit 1
          fi
          grep -Fq 'V4098_CLARITY_OK:' /tmp/lwod_4098_clarity.log

