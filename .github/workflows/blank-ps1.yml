    - name: V40.6.4 FIX1 Sammelgegenstand und Inventar installieren
      shell: bash
      run: "set -euo pipefail\nmkdir -p android/scripts android/tests\ncat > \"$RUNNER_TEMP/v4064_fix_v7.sh\"\
        \ <<'V4064_PATCH'\n#!/bin/bash\nset -euo pipefail\nfile=\"android/scripts/V7Addon.gd\"\ntest -s \"\
        $file\"\n# Das unabhaengige alte Sammelsystem faelschlich als Quest-Items klassifiziert.\ngrep -Fq\
        \ 'inventory[\"Lichtkristall\"] = int(inventory.get(\"Lichtkristall\", 0)) + 1' \"$file\"\ngrep -Fq\
        \ '_notify(\"Lichtkristall erhalten!\")' \"$file\"\ngrep -Fq '        \"Inventar\":' \"$file\"\nawk\
        \ '\n  $0 == \"        \\\"Inventar\\\":\" {\n      print\n      print \"            var market: Node\
        \ = game.get_node_or_null(\\\"V404Market\\\")\"\n      print \"            if market != null and market.has_method(\\\
        \"open_inventory\\\"):\"\n      print \"                bag_panel.hide()\"\n      print \"        \
        \        market.call(\\\"open_inventory\\\")\"\n      print \"            else:\"\n      print \" \
        \               _open_page(\\\"INVENTAR\\\", \\\"Inventar nicht verfuegbar.\\\")\"\n      skipping\
        \ = 1\n      n_menu++\n      next\n  }\n  skipping && $0 == \"        \\\"Spiel Speichern\\\":\" {skipping=0;\
        \ print; next}\n  skipping {next}\n  $0 == \"    inventory[\\\"Lichtkristall\\\"] = int(inventory.get(\\\
        \"Lichtkristall\\\", 0)) + 1\" {\n      print \"    inventory[\\\"Violettsplitter\\\"] = int(inventory.get(\\\
        \"Violettsplitter\\\", 0)) + 1\"\n      n_collect++\n      next\n  }\n  $0 == \"    _notify(\\\"Lichtkristall\
        \ erhalten!\\\")\" {\n      print \"    var journal: Node = game.get_node_or_null(\\\"V406JournalHUD\\\
        \")\"\n      print \"    if journal != null and journal.has_method(\\\"notify_item_collected\\\"):\"\
        \n      print \"        journal.call(\\\"notify_item_collected\\\", \\\"Violettsplitter\\\", 1)\"\n\
        \      print \"    else:\"\n      print \"        _notify(\\\"Gefunden: Violettsplitter x1\\\")\"\n\
        \      n_notify++\n      next\n  }\n  $0 == \"func _process(delta: float) -> void:\" {\n      print\n\
        \      print \"    # Alte V7-Spielstaende enthalten normale Sammelware unter falschem Questnamen.\"\
        \n      print \"    if inventory.has(\\\"Lichtkristall\\\"):\"\n      print \"        inventory[\\\"\
        Violettsplitter\\\"] = int(inventory.get(\\\"Violettsplitter\\\", 0)) + int(inventory[\\\"Lichtkristall\\\
        \"])\"\n      print \"        inventory.erase(\\\"Lichtkristall\\\")\"\n      n_migrate++\n      next\n\
        \  }\n  $0 == \"        collecting_button.visible = not menus_open and _nearby_collectible() != \\\"\
        \\\"\" {\n      print\n      print \"        if collecting_button.visible:\"\n      print \"      \
        \      collecting_button.text = \\\"✦ Violettsplitter\\\"\"\n      n_prompt++\n      next\n  }\n  {print}\n\
        \  END {\n      if(skipping || n_collect!=1 || n_notify!=1 || n_menu!=1 || n_migrate!=1 || n_prompt!=1){\n\
        \          print \"V4064_PATCH_ERROR: collect=\" n_collect \" notify=\" n_notify \" menu=\" n_menu\
        \ \" migrate=\" n_migrate \" prompt=\" n_prompt > \"/dev/stderr\"\n          exit 70\n      }\n  }\n\
        ' \"$file\" > \"$file.tmp\"\nmv \"$file.tmp\" \"$file\"\ngrep -Fq 'journal.call(\"notify_item_collected\"\
