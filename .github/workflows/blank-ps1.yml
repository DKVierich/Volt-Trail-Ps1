        s=once(s,'            _emit_vertex(st,x0,z0,origin)\n            _emit_vertex(st,x0,z1,origin)\n            _emit_vertex(st,x1,z0,origin)\n            _emit_vertex(st,x1,z0,origin)\n            _emit_vertex(st,x0,z1,origin)\n            _emit_vertex(st,x1,z1,origin)','            if v443_ruin_chunk:\n                _v443_triangle(st,Vector2(x0,z0),Vector2(x0,z1),Vector2(x1,z0),origin)\n                _v443_triangle(st,Vector2(x1,z0),Vector2(x0,z1),Vector2(x1,z1),origin)\n            else:\n                _emit_vertex(st,x0,z0,origin)\n                _emit_vertex(st,x0,z1,origin)\n                _emit_vertex(st,x1,z0,origin)\n                _emit_vertex(st,x1,z0,origin)\n                _emit_vertex(st,x0,z1,origin)\n                _emit_vertex(st,x1,z1,origin)')
        s=once(s,'    var step_size: float = CHUNK / float(RESOLUTION)\n','    var step_size: float = CHUNK / float(RESOLUTION)\n    var v443_ruin_chunk: bool = origin.distance_to(V443Shaft.centre())<CHUNK*1.5+180.0\n')
        s += '\nconst V443Shaft = preload("res://scripts/V441Layout.gd")\n\nfunc _v443_triangle(st: SurfaceTool,a: Vector2,b: Vector2,c: Vector2,origin: Vector2) -> void:\n    # Cheap broad-phase: for all other regions emit original vertices exactly as before.\n    var centre: Vector2 = V443Shaft.centre()\n    if a.distance_squared_to(centre)>36000.0 and b.distance_squared_to(centre)>36000.0 and c.distance_squared_to(centre)>36000.0:\n        for p in [a,b,c]: _emit_vertex(st,p.x,p.y,origin)\n        return\n    var qa: Vector2 = V443Shaft.local(Vector3(a.x,0,a.y))\n    var qb: Vector2 = V443Shaft.local(Vector3(b.x,0,b.y))\n    var qc: Vector2 = V443Shaft.local(Vector3(c.x,0,c.y))\n    if minf(qa.x,minf(qb.x,qc.x))>=V443Shaft.HALF_WIDTH or maxf(qa.x,maxf(qb.x,qc.x))<=-V443Shaft.HALF_WIDTH or minf(qa.y,minf(qb.y,qc.y))>=V443Shaft.START_Z or maxf(qa.y,maxf(qb.y,qc.y))<=V443Shaft.END_Z:\n        for p in [a,b,c]: _emit_vertex(st,p.x,p.y,origin)\n        return\n    # Fill the normal chunk vertex cache even when a triangle crosses the shaft.\n    var poly := PackedVector3Array()\n    for p in [a,b,c]:\n        if not v414_vertex_cache.has(p):\n            var h: float = height_at(p.x,p.y)\n            v414_vertex_cache[p]=[h,color_at(p.x,p.y,h)]\n        var q: Vector2 = V443Shaft.local(Vector3(p.x,0,p.y))\n        poly.append(Vector3(q.x,float(v414_vertex_cache[p][0]),q.y))\n    for piece in V443Shaft.cut_triangle(poly):\n        for i in range(1,piece.size()-1):\n            var v0: Vector3 = piece[0]\n            var v1: Vector3 = piece[i]\n            var v2: Vector3 = piece[i+1]\n            if (v1-v0).cross(v2-v0).length_squared()<0.000001: continue\n            for v in [v0,v1,v2]:\n                var p: Vector2 = V443Shaft.world(Vector2(v.x,v.z))\n                st.set_color(color_at(p.x,p.y,v.y))\n                st.add_vertex(Vector3(p.x-origin.x,v.y,p.y-origin.y))\n'
        p.write_text(s,encoding='utf-8')
        p=Path('android/export_presets.cfg');s=p.read_text(encoding='utf-8')
        s=once(s,'version/code=4209','version/code=4218');s=once(s,'version/name="4.1.7.39"','version/name="4.1.7.48"');p.write_text(s,encoding='utf-8')
        print('FIX41_INSTALL_OK: old pillars removed; real castle and underground layout linked to player and flight')
        FIX41_PATCH
        python3 -m py_compile /tmp/lwod_fix41.py
        python3 /tmp/lwod_fix41.py
    - name: Sicherungen und alle FIX39 Godot-Tests
      shell: bash
      run: |
        set -euo pipefail
        for i in 11 12 13 14 15 16; do
          echo "::group::FIX39 Originaltest $i"
          bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/fix41_base/$i.sh"
          echo '::endgroup::'
        done
    - name: FIX48 Aktive Dungeon-Kamera und Treppenlauf testen
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p build/diagnose
        timeout --signal=TERM --kill-after=5s 140s godot --headless --path android --quit-after 300 --script res://tests/V441RuineSmoke.gd 2>&1 | tee build/diagnose/FIX48_Ruine.log
        if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid call|FIX48: ' build/diagnose/FIX48_Ruine.log; then exit 1; fi
        grep -Fq 'FIX48_RUINE_OK:' build/diagnose/FIX48_Ruine.log
    - name: FIX48 Android APK exportieren und pruefen
      run: |
        set -euo pipefail
        mkdir -p build/android build/diagnose
        APK="$GITHUB_WORKSPACE/build/android/LWOD-Android-V41.7-FIX48.apk"
        rm -f "$APK"
        timeout --signal=TERM --kill-after=5s 900s godot --headless --path android --export-debug Android "$APK" 2>&1 | tee build/diagnose/FIX48_APK_Export.log
        if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script' build/diagnose/FIX48_APK_Export.log; then
          exit 1
        fi
        test -s "$APK"
        unzip -t "$APK" >/dev/null
        unzip -Z1 "$APK" | grep -Fx 'AndroidManifest.xml' >/dev/null
        ls -lh "$APK"
        sha256sum "$APK"
      shell: bash
