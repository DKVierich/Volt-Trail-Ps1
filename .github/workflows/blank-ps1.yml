name: LWOD Android V41.7 FIX27 Dichtere Waelder
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/blank-ps1.yml
permissions:
  contents: read
jobs:
  android:
    name: LWOD Android V41.7 FIX27 APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    container:
      image: barichello/godot-ci:4.7.2
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: /usr/lib/android-sdk
    steps:
    - name: Erfolgreichen FIX19 Stand laden
      uses: actions/checkout@v4
      with:
        ref: a50b23c0dbeebc464305c0451b98245a0632aebc
    - name: Python und YAML bereitstellen
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v python3 >/dev/null 2>&1 || ! python3 -c 'import yaml' >/dev/null 2>&1; then
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 python3-yaml
        fi
    - name: FIX19 Originalschritte aus gesichertem Workflow extrahieren
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import hashlib, os, subprocess, yaml
        from pathlib import Path
        raw = Path('.github/workflows/blank-ps1.yml').read_bytes()
        sha = hashlib.sha1(('blob %d\0' % len(raw)).encode() + raw).hexdigest()
        if sha != 'a3b057011da5de84833a97adc94f161026c5c00a':
            raise SystemExit('FIX19: Falsche Originaldatei: ' + sha)
        steps = yaml.safe_load(raw)['jobs']['android']['steps']
        if len(steps) != 24:
            raise SystemExit('FIX19: Unerwartete Anzahl Schritte')
        assert steps[12]['name'].startswith('V41.7 FIX19 Nordbergwand')
        assert steps[13]['name'] == 'Godot-Gelaende neu importieren'
        assert steps[22]['name'].startswith('V41.7 FIX19 Landschaft')
        assert steps[23]['name'].startswith('V41.7 FIX19 Android-APK bauen')
        dest = Path(os.environ['RUNNER_TEMP']) / 'lwod_fix21_steps'
        dest.mkdir(parents=True, exist_ok=True)
        for i in range(2,23):
            step = steps[i]
            if not isinstance(step.get('run'), str) or step.get('shell') != 'bash' or 'if' in step:
                raise SystemExit('Unerwarteter Originalschritt: ' + str(i))
            script = dest / ('%02d.sh' % i)
            script.write_text(step['run'] + '\n', encoding='utf-8')
            subprocess.run(['bash', '-n', str(script)], check=True)
            print('Gesichert:', i, step['name'], flush=True)
        PY
    - name: Alle FIX19 Spielinhalte wiederherstellen
      shell: bash
      run: |
        set -euo pipefail
        for i in 02 03 04 05 06 07 08 09 10 11 12; do
          echo "::group::FIX19 Originalschritt $i"
          bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/lwod_fix21_steps/$i.sh"
          echo '::endgroup::'
        done
    - name: FIX21 Bergumrandung, Wege und Schlucht korrigieren
      shell: bash
      run: |
        set -euo pipefail
        cat > "$RUNNER_TEMP/lwod_fix21.py" <<'PYFIX21'
        from pathlib import Path
        import re, math
        B=Path('android/scripts'); tests=Path('android/tests')
        def once(s,a,b):
            assert s.count(a)==1, 'FIX21 missing/ambiguous anchor: '+a[:100]
            return s.replace(a,b,1)
        def fun(s,name,new):
            pat=r'(?ms)^(?:static )?func '+re.escape(name)+r'\([^\n]*\n.*?(?=^(?:func |static func |const |var |class |@|extends )|\Z)'
            s,n=re.subn(pat,lambda _:new.rstrip()+'\n\n',s,count=1)
            assert n==1,'FIX21 missing function '+name
            return s
        def edit(p,f):
            s=p.read_text(encoding='utf-8'); p.write_text(f(s),encoding='utf-8')

        def point(x,y,angle):
            return (x+0.62*math.sin(math.radians(angle)),y+0.62*math.cos(math.radians(angle)))
        def vec(p): return 'Vector2(%.7f,%.7f)'%p
        # Delete the two gorge crossings and the red-marked Steinland branch.
        # Steinland remains an accessible landmark, not one of the nine travel destinations.
        new_links=[('Moordorf','Felswacht',[point(63,50,144),(65.0,46),(65.7,44.5),(65.7,43),(65.7,23),(65.7,21.5),(66.1,19.0),(67.5,18.4),point(71,20,-114)]),('Sandhafen','Frostholm',[point(93,58,-30),(89.5,64.2),(85.0,72.0),(80.5,79.5),point(77,86,150)])]
        def territory(s):
            m=re.search(r'(?ms)^const ROUTES = \[\n(.*?)^\]',s); assert m
            old=m[1].splitlines(); keep=[]; removed=0
            for line in old:
                if any('"from":"'+a+'","to":"'+b+'"' in line for a,b in [('Moordorf','Sandhafen'),('Wurzelheim','Frostholm'),('Moordorf','Steinland')]): removed+=1
                else: keep.append(line.rstrip().rstrip(','))
            assert removed==3 and len(keep)==7
            for a,b,via in new_links:
                keep.append('    {"from":"'+a+'","to":"'+b+'","via":['+','.join(map(vec,via))+']}')
            s=s[:m.start()]+'const ROUTES = [\n'+',\n'.join(keep)+'\n]'+s[m.end():]
            for a,b in [('"Wurzelheim": [-84.0,114.0,48.0]','"Wurzelheim": [-84.0,114.0]'),('"Moordorf": [-48.0,114.0,78.0]','"Moordorf": [-48.0,144.0]'),('"Felswacht": [78.0]','"Felswacht": [78.0,-114.0]'),('"Sandhafen": [-84.0,180.0]','"Sandhafen": [180.0,-30.0]'),('"Frostholm": [-84.0]','"Frostholm": [150.0]')]: s=once(s,a,b)
            s=fun(s,'north_at_map','''static func north_at_map(uv: Vector2) -> bool:
            return uv.y <= V421_NORTH and uv.y >= 0.0 and uv.x >= 0.0 and uv.x <= 100.0''')
            s=once(s,'    if north_at_map(uv):\n        return true','    if v421_border_at(uv):\n        return true')
            s=fun(s,'mountain_crosses','''static func mountain_crosses(a: Vector2, b: Vector2) -> bool:
            var u: Vector2 = world_to_map(a)
            var v: Vector2 = world_to_map(b)
            if v421_border_at(u) or v421_border_at(v):
                return true
            if maxf(u.x,v.x)<40.0 or minf(u.x,v.x)>83.0 or minf(u.y,v.y)>79.0:
                return false
            var n: int = maxi(1,ceili(u.distance_to(v)/0.035))
            for i in range(n+1):
                if mountain_at_map(u.lerp(v,float(i)/float(n))):
                    return true
            return false''')
            s=once(s,'    if north_at_map(uv):\n        return map_to_world(Vector2(maxf(57.0,uv.x),9.1))','''    if v421_border_at(uv):
                var q := Vector2(clampf(uv.x,V421_SIDE+0.15,100.0-V421_SIDE-0.15),clampf(uv.y,V421_NORTH+0.15,100.0-V421_SIDE-0.15))
                if not mountain_at_map(q):
                    return map_to_world(q)
                var nearest: Vector2 = CITIES["Sonnental"]
                var best_distance: float = INF
                for city in CITIES:
                    var candidate: Vector2 = CITIES[city]
                    if not mountain_at_map(candidate) and candidate.distance_squared_to(uv)<best_distance:
                        nearest = candidate
                        best_distance = candidate.distance_squared_to(uv)
                return map_to_world(nearest)''')
            # Do not flatten or alter the accepted gorge floor.
            s=fun(s,'bridge_at','''static func bridge_at(_p: Vector2) -> bool:
            return false''')
            s+='''
        # FIX21: the 3D perimeter, movement restriction and map share these limits.
        const V421_SIDE: float = 3.2
        const V421_NORTH: float = 7.4
        static func v421_border_at(uv: Vector2) -> bool:
            return uv.x <= V421_SIDE or uv.x >= 100.0-V421_SIDE or uv.y <= V421_NORTH or uv.y >= 100.0-V421_SIDE

        static func v421_no_decoration(p: Vector2, radius: float = 0.0) -> bool:
            var uv: Vector2 = world_to_map(p)
            return mountain_at_map(uv) or gorge_distance(uv) < GORGE_HALF + radius/METRES_PER_PERCENT
        '''
            return s
        edit(B/'V417Territories.gd',territory)

        # Replace the narrow, differently shaped northern ridge with four textured relief ridges.
        # The inner massif and tunnel remain in the same place.
        BORDER='''func _v419_north() -> void:
            var ring := Node3D.new()
            ring.name = "Kartenumrandung"
            add_child(ring)
            for side in range(4):
                _v421_ridge(ring,side)

        func _v421_uv(side: int, along: float, inward: float) -> Vector2:
            match side:
                0: return Vector2(along,inward*T.V421_NORTH)
                1: return Vector2(100.0-inward*T.V421_SIDE,along)
                2: return Vector2(along,100.0-inward*T.V421_SIDE)
                _: return Vector2(inward*T.V421_SIDE,along)

        func _v421_ridge(ring: Node3D, side: int) -> void:
            # High resolution, smooth shaded, rugged profiles in the FIX8 rock palette.
            const ALONG: int = 144
            const ACROSS: int = 12
            var verts := PackedVector3Array()
            var colors := PackedColorArray()
            var normals := PackedVector3Array()
            var ix := PackedInt32Array()
            var phase: float = float(side)*17.31
            for i in range(ALONG+1):
                var u: float = float(i)*100.0/float(ALONG)
                for j in range(ACROSS+1):
                    var t: float = float(j)/float(ACROSS)
                    var uv: Vector2 = _v421_uv(side,u,t)
                    var p: Vector2 = T.map_to_world(uv)
                    var base: float = _ground(p)
                    var peak: float = 840.0+175.0*sin(u*0.84+phase)+145.0*sin(u*2.17+phase*0.6)+110.0*sin(u*4.9+phase)
                    var crest: float = 0.42+0.09*sin(u*1.52+phase)
                    var profile: float = pow(clampf(1.0-absf(t-crest)/(1.0-crest if t>=crest else crest),0.0,1.0),0.50)
                    var h: float = peak*profile + profile*46.0*sin(u*7.21+t*15.7+phase)
                    if j==0 or j==ACROSS:
                        h = -145.0
                    verts.append(Vector3(p.x,base+h,p.y))
                    var shade: float = clampf(0.53+0.085*sin(u*2.5+t*13.0+phase)+0.055*sin(u*7.2-t*25.0)+0.035*profile,0.36,0.71)
                    colors.append(Color(shade,shade*0.98,shade*0.94))
                    normals.append(Vector3.ZERO)
            for i in range(ALONG):
                for j in range(ACROSS):
                    var a: int = i*(ACROSS+1)+j
                    var b: int = a+ACROSS+1
                    var c: int = a+1
                    var d: int = b+1
                    var tris: PackedInt32Array = PackedInt32Array([a,b,c,b,d,c])
                    if side==1 or side==2:
                        tris = PackedInt32Array([a,c,b,b,c,d])
                    for k in range(0,6,3):
                        var aa: int = tris[k]
                        var bb: int = tris[k+1]
                        var cc: int = tris[k+2]
                        var normal: Vector3 = (verts[cc]-verts[aa]).cross(verts[bb]-verts[aa])
                        if normal.y<0.0:
                            var tmp: int = bb
                            bb = cc
                            cc = tmp
                            normal = -normal
                        normals[aa] += normal
                        normals[bb] += normal
                        normals[cc] += normal
                        ix.append_array(PackedInt32Array([aa,bb,cc]))
            for i in range(normals.size()):
                normals[i] = normals[i].normalized()
            var arrays: Array = []
            arrays.resize(Mesh.ARRAY_MAX)
            arrays[Mesh.ARRAY_VERTEX] = verts
            arrays[Mesh.ARRAY_NORMAL] = normals
            arrays[Mesh.ARRAY_COLOR] = colors
            arrays[Mesh.ARRAY_INDEX] = ix
            var mesh := ArrayMesh.new()
            mesh.add_surface_from_arrays(Mesh.PRIMITIVE_TRIANGLES,arrays)
            var mountain := MeshInstance3D.new()
            mountain.name = ["Nordbergwand","Ostbergwand","Suedbergwand","Westbergwand"][side]
            mountain.mesh = mesh
            var original := get_node_or_null("MassiveFelswand") as MeshInstance3D
            if original != null:
                mountain.material_override = original.material_override
            mountain.cast_shadow = GeometryInstance3D.SHADOW_CASTING_SETTING_OFF
            mountain.ignore_occlusion_culling = true
            mountain.custom_aabb = mesh.get_aabb().grow(24.0)
            ring.add_child(mountain)
            # An independent solid inner collision face, and _guard blocks even flying above peaks.
            var body := StaticBody3D.new()
            body.name = "Randkollision"
            body.collision_layer = 1
            body.collision_mask = 0
            var collider := CollisionShape3D.new()
            var box := BoxShape3D.new()
            var a: Vector2 = T.map_to_world(_v421_uv(side,0.0,1.0))
            var b: Vector2 = T.map_to_world(_v421_uv(side,100.0,1.0))
            var mid: Vector2 = (a+b)*0.5
            box.size = Vector3(8.0,6000.0,21000.0) if side==1 or side==3 else Vector3(21000.0,6000.0,8.0)
            collider.shape = box
            body.add_child(collider)
            ring.add_child(body)
            body.position = Vector3(mid.x,0.0,mid.y)
        '''
        def wall(s):
            s=once(s,'    _v419_bridges()\n','')
            s=fun(s,'_v419_bridges','func _v419_bridges() -> void:\n    pass # FIX21: no bridge meshes or colliders')
            s=fun(s,'_v419_north',BORDER)
            return s
        edit(B/'V417MountainWall.gd',wall)

        # Reuse a genuine interior part of the old relief texture on all four borders.
        # Areas overlap only in the corners; no new polygon stripe art.
        def mapedit(s):
            a=s.index('    var ridge := PackedVector2Array()\n',s.index('func _draw_v419_features'))
            b=s.index('    var gorge := PackedVector2Array()',a)
            s=s[:a]+'''    var tex_size: Vector2 = MOUNTAIN_RELIEF.get_size()
            var source := Rect2(tex_size*Vector2(0.445,0.32),tex_size*Vector2(0.09,0.28))
            for side in range(4):
                var width_pct: float = L.V421_NORTH if side==0 else L.V421_SIDE
                var rect: Rect2
                for segment in range(20):
                    var start: float = float(segment)*5.0
                    match side:
                        0: rect = Rect2(_point(Vector2(start,0.0),area),Vector2(area.size.x*0.05,area.size.y*width_pct/100.0))
                        1: rect = Rect2(_point(Vector2(100.0-width_pct,start),area),Vector2(area.size.x*width_pct/100.0,area.size.y*0.05))
                        2: rect = Rect2(_point(Vector2(start,100.0-width_pct),area),Vector2(area.size.x*0.05,area.size.y*width_pct/100.0))
                        _: rect = Rect2(_point(Vector2(0.0,start),area),Vector2(area.size.x*width_pct/100.0,area.size.y*0.05))
                    draw_rect(rect,Color("#77736c"),true)
                    draw_texture_rect_region(MOUNTAIN_RELIEF,rect,source)
        '''+s[b:]
            # Tunnel symbol is intentionally drawn over its through-road. No bridge strokes.
            start=s.index('    for link in L.ROUTES:',s.index('func _draw_v419_crossings'))
            return s[:start].rstrip()+'\n'
        edit(B/'V417SketchMap.gd',mapedit)

        # Remove old bridge-height special cases; preserve actual gorge depth and color.
        edit(B/'V27Terrain.gd',lambda s:once(s,'    if V417Territories.bridge_at(Vector2(x,z)):\n        return _v419_base_height_at(x,z)\n',''))

        # Suppress the original fixed-Y green patches, trees and stones within the canyon.
        # Keep all ordinary biome vegetation outside the exclusion zone.
        def v21(s):
            a='        var point := Vector2(px,pz)\n'
            s=once(s,a,a+'        if V412Bounds.v421_no_decoration(point,4.0):\n            continue\n')
            a=re.search(r'(?m)^([ \t]+)var patch_z: float = .*$',s)
            if a:
                indent=a[1]; s=s[:a.end()]+ '\n'+indent+'if V412Bounds.v421_no_decoration(Vector2(patch_x,patch_z),20.0):\n'+indent+'    continue'+s[a.end():]
            return s
        edit(B/'V21World.gd',v21)
        # Old streaming decor also uses a fixed Y: if still present, skip its instances near the gorge.
        p=B/'V24Regions.gd'
        if p.exists():
            s=p.read_text(encoding='utf-8')
            a='        var pos := Vector2(x,z)\n'
            if a in s:
                s=once(s,a,a+'        if V421DecorationBounds.v421_no_decoration(pos,2.0):\n            continue\n')
                s=re.sub(r'(?m)^(extends [^\n]+\n)',r'\g<1>const V421DecorationBounds = preload("res://scripts/V417Territories.gd")\n',s,count=1)
                p.write_text(s,encoding='utf-8')
        # Exclude independent decorative objects whose footprint overlaps the gorge.
        # Volcano decorations and all normal towns remain untouched.
        def landmarks(s):
            s=re.sub(r'(?m)^(extends [^\n]+\n)',r'\g<1>const V421Land = preload("res://scripts/V417Territories.gd")\n',s,count=1)
            # The old flat caps perched above isolated Felswacht cones look like floating slabs.
            s=s.replace('            _block(root,center+Vector2(x,-170.0),Vector3(85,12,85),"#575b64",105.0)\n','')
            for sig in ['func _stone(parent: Node3D, p: Vector2, radius: float, height: float, color: String, sides: int = 7) -> void:\n','func _block(parent: Node3D, p: Vector2, dims: Vector3, tint: String, y_offset: float = 0.0) -> void:\n']:
                radius='radius' if '_stone' in sig else 'maxf(dims.x,dims.z)*0.5'
                # Avoid removing existing actual volcano peaks or coastal landmarks at the exterior border.
                s=once(s,sig,sig+'    if V421Land.gorge_distance(V421Land.world_to_map(p)) < V421Land.GORGE_HALF+'+radius+'/V421Land.METRES_PER_PERCENT:\n        return\n')
            return s
        edit(B/'V417Landmarks.gd',landmarks)

        # Update older expectations only where the intentional change requires it.
        for name in ('V417WorldSmoke.gd','V417Fix5Smoke.gd','V417Fix7Smoke.gd','V417Fix13Smoke.gd','V416RoadsSmoke.gd'):
            p=tests/name; s=p.read_text(encoding='utf-8')
            s=s.replace('routes.size() != 10','routes.size() != 9').replace('ROUTES.size() != 10','ROUTES.size() != 9').replace('ROUTES.size()!=10','ROUTES.size()!=9').replace('get_child_count()!=10','get_child_count()!=9')
            s=s.replace('reachable.size() != T.CITIES.size()','reachable.size() != T.CITIES.size()-1 or reachable.has("Steinland")').replace('visited.size()!=T.CITIES.size()','visited.size()!=T.CITIES.size()-1 or visited.has("Steinland")')
            for a,b in [('10 walking paths','9 walking paths'),('10 curved walking paths','9 curved walking paths'),('10 safe routes','9 safe routes'),('10 intercity roads','9 intercity roads'),('10 Wege','9 Wege')]: s=s.replace(a,b)
            p.write_text(s,encoding='utf-8')
        # The old FIX19 test required exactly the bridges that the user asked to remove.
        # Replace only that test with new real-node and geometry assertions.
        p=tests/'V419LandscapeSmoke.gd'
        p.write_text('''extends SceneTree
        const T = preload("res://scripts/V417Territories.gd")
        const Wall = preload("res://scripts/V417MountainWall.gd")
        class FakeGame:
            extends Node3D
            var state: int = 2
            var hero: Node3D
        func _initialize() -> void:
            call_deferred("_run")
        func fail(s: String) -> void:
            push_error("FIX21: "+s)
            quit(1)
        func _run() -> void:
            for uv in [Vector2(0,50),Vector2(100,50),Vector2(20,3),Vector2(20,99),Vector2(-3,20),Vector2(103,50)]:
                if not T.mountain_at_map(uv):
                    fail("open perimeter")
                    return
            for city in T.CITIES:
                if T.mountain_at_map(T.CITIES[city]):
                    fail("city blocked: "+String(city))
                    return
            if T.gorge_depth(Vector2(80.2,55))<400.0 or not T.v421_no_decoration(T.map_to_world(Vector2(80.2,55))):
                fail("gorge lost or decorations allowed")
                return
            var tunnel_found: bool = false
            var frost_found: bool = false
            for road in T.ROUTES:
                if road["from"]=="Moordorf" and road["to"]=="Felswacht":
                    tunnel_found = true
                if road["from"]=="Sandhafen" and road["to"]=="Frostholm":
                    frost_found = true
                var path: PackedVector2Array = T.road_world(road)
                for i in range(path.size()-1):
                    if T.mountain_crosses(path[i],path[i+1]):
                        fail("road intersects rock")
                        return
                    var count: int = maxi(1,ceili(path[i].distance_to(path[i+1])/5.0))
                    for j in range(count+1):
                        var p: Vector2 = path[i].lerp(path[i+1],float(j)/float(count))
                        if T.gorge_depth(T.world_to_map(p))>0.01 or T.bridge_at(p):
                            fail("road crosses gorge")
                            return
            if not tunnel_found or not frost_found:
                fail("new links missing")
                return
            var g := FakeGame.new()
            root.add_child(g)
            g.hero = Node3D.new()
            g.add_child(g.hero)
            var wall := Wall.new()
            g.add_child(wall)
            wall.setup(g)
            if wall.has_node("Schluchtbruecken") or not wall.has_node("Bergtunnel/Tunneltor_Nord") or not wall.has_node("Bergtunnel/Tunneltor_Sued"):
                fail("bridges remain or tunnel portals absent")
                return
            for label in ["Nordbergwand","Ostbergwand","Suedbergwand","Westbergwand"]:
                var mesh := wall.get_node_or_null("Kartenumrandung/"+label) as MeshInstance3D
                if mesh==null or mesh.mesh==null or mesh.mesh.get_surface_count()!=1:
                    fail("missing border relief: "+label)
                    return
            # Even when the hero is flying high, the map cannot be exited.
            for side in [Vector2(3.5,12),Vector2(96.4,12),Vector2(22,7.7),Vector2(22,96.4)]:
                var p: Vector2 = T.map_to_world(side)
                var target: Vector2 = side
                if side.x<4.0: target.x=3.0
                elif side.x>96.0: target.x=97.0
                elif side.y<10.0: target.y=7.2
                else: target.y=97.0
                var q: Vector2 = T.map_to_world(target)
                wall.have_safe=false
                g.hero.global_position=Vector3(p.x,4000.0,p.y)
                wall.call("_guard")
                g.hero.global_position=Vector3(q.x,4000.0,q.y)
                wall.call("_guard")
                if g.hero.global_position.distance_to(Vector3(p.x,4000.0,p.y))>0.1:
                    fail("flight bypassed border")
                    return
            print("FIX19_LANDSCAPE_OK: FIX21 gorge unchanged, tunnel route, no bridges, four perimeter meshes and flight guard")
            quit(0)
        ''',encoding='utf-8')
        p=Path('android/export_presets.cfg'); s=p.read_text(encoding='utf-8'); s=once(s,'version/code=4189','version/code=4191'); s=once(s,'version/name="4.1.7.19"','version/name="4.1.7.21"'); p.write_text(s,encoding='utf-8')
        print('FIX21_INSTALL_OK: new paths, no bridge deck, canyon decor exclusion, four rock borders')
        PYFIX21
        python3 -m py_compile "$RUNNER_TEMP/lwod_fix21.py"
