        ' android/scripts/Main.gd > "$RUNNER_TEMP/Main_v21.gd"
        mv "$RUNNER_TEMP/Main_v21.gd" android/scripts/Main.gd
        grep -Fqx '    minimap.setup(self, expanded_world)' android/scripts/Main.gd
        sed -i 's@version/code=20@version/code=21@' android/export_presets.cfg
