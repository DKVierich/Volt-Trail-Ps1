    - name: Video-Uebergaenge und interaktive Menueauswahl aktivieren
      shell: bash
      run: |
        set -euo pipefail
        cat > "$RUNNER_TEMP/patch_video_menu.py" <<'LYDRA_PATCH_PY'
        #!/usr/bin/env python3
        """Replace the static title and duplicate labels with an interactive video-derived menu."""
        import os,re
        from pathlib import Path
        p=Path(os.environ['PROJECT_DIR'])/'src/main.c'
        s=p.read_text(encoding='utf-8')
        def once(old,new):
            global s
            n=s.count(old)
            if n!=1:raise RuntimeError('V31.7 title patch anchor count=%d: %r'%(n,old[:80]))
            s=s.replace(old,new,1)

        # The logo presentation is automatic: intro frames 0-3, title frames 4-6,
        # then wait for START while flashing the prompt.
        # Use whitespace-independent anchors: the base YAML strips eight indentation columns.
        once('else if(++vt_v314_elapsed>=150)', 'else if(++vt_v314_elapsed>=180)')
        s,n=re.subn(r'(\} else if\(\+\+vt_v314_elapsed>=180\) \{\s*)vt_v314_phase=1;',
                    r'\g<1>vt_v314_phase=0;',s,count=1)
        if n!=1:raise RuntimeError('Intro phase transition not found')
        start_phase=r'\} else if\(vt_v314_phase==1\) \{\s*if\(pressed&\(PAD_START\|PAD_CROSS\)\)'
        replacement=('} else if(vt_v314_phase==0) {\n'
                     '    if((pressed&(PAD_START|PAD_CROSS)) || ++vt_v314_elapsed>=126) {\n'
                     '        vt_v314_phase=1; vt_v314_elapsed=0;\n'
                     '    }\n'
                     '} else if(vt_v314_phase==1) {\n'
                     '    if(pressed&(PAD_START|PAD_CROSS))')
        s,n=re.subn(start_phase,lambda _:replacement,s,count=1)
        if n!=1:raise RuntimeError('Title transition anchor not found')

        # Video has exactly three menu slots, no extra INTRO line.
        once('vt_v314_cursor=(vt_v314_cursor+3)%4;', 'vt_v314_cursor=(vt_v314_cursor+2)%3;')
        once('vt_v314_cursor=(vt_v314_cursor+1)%4;', 'vt_v314_cursor=(vt_v314_cursor+1)%3;')
        choice=r"""static int vt_v314_choice_frame(void) {
            if(vt_v314_phase==-1){
                if(vt_v314_elapsed<24)return 0;
                if(vt_v314_elapsed<64)return 1;
                if(vt_v314_elapsed<112)return 2;
                return 3;
            }
            if(vt_v314_phase==0){
                if(vt_v314_elapsed<30)return 4;
                if(vt_v314_elapsed<75)return 5;
                return 6;
            }
            if(vt_v314_phase==1)return 6;
            return 7;
        }
        """
        pat=r'static int vt_v314_choice_frame\(void\)\s*\{\s*if\(vt_v314_phase==-1\)return -1;\s*return 7;\s*\}'
        s,n=re.subn(pat,lambda _:choice.strip(),s,count=1)
        if n!=1:raise RuntimeError('Title-frame selector missing')

        # Keep artwork supplied by user; no second dark menu and no duplicate words.
        s,n=re.subn(r'if\(vt_v314_phase>=2\) \{\s*/\* Place an opaque ink-blue submenu tile behind the text\.',
                    'if(vt_v314_phase==3) {\n    /* Place an opaque ink-blue submenu tile behind the text.',s,count=1)
        if n!=1:raise RuntimeError('Submenu panel anchor not found')
        once('setXY0(panel,190,157);','setXY0(panel,94,159);')
        once('setWH(panel,130,83);','setWH(panel,150,81);')
        once('FntOpen(196, 162, 124, 76, 0, 512); /* title menu */',
             'FntOpen(105, 167, 120, 70, 0, 512); /* title menu cursor / options */')

        # The branded intro artwork includes the studio text already.
        once('if(vt_v314_elapsed>12)FntPrint(6,"DKVierich Produktion");',
             '/* Logo and DKVierich Produktion come directly from the video frames. */')
        s,n=re.subn(r'if\(vt_v314_elapsed>40 && \(vt_v314_blink%80u\)<54u\)\s*FntPrint\(4,"   START"\);',
                    '/* The intro frames contain the production name; START appears only on title. */',s,count=1)
        if n!=1:raise RuntimeError('Old premature START overlay not found')

        # Show only a moving cursor; names and background are native source-video artwork.
        menu_pat=r'FntPrint\(5,"%c NEUES SPIEL\\n\\n"[^;]*;[\s\S]*?FntPrint\(5,"%c INTRO\\n"[^;]*;'
        menu_cursor=('FntPrint(5,"%c\\n\\n%c\\n\\n%c\\n",\n'
                     '   vt_v314_cursor==0?\'>\':\' \',\n'
                     '   vt_v314_cursor==1?\'>\':\' \',\n'
                     '   vt_v314_cursor==2?\'>\':\' \');')
        s,n=re.subn(menu_pat,lambda _:menu_cursor,s,count=1)
        if n!=1:raise RuntimeError('Original four-choice menu text not found')

        for tag in ('vt_v314_choice_frame(void)','vt_v314_input(unsigned int pressed)',
                    'vt_v281_resolve_movement();','vt_save_game(void)','vt_load_game(void)',
                    'vt_v293_move((unsigned int)pad);'):
            if tag not in s:raise RuntimeError('Gameplay/title function missing: '+tag)
        p.write_text(s,encoding='utf-8')
        print('V31.7 video-derived interactive main menu installed. Saving and gameplay unchanged.')
        LYDRA_PATCH_PY
        python3 "$RUNNER_TEMP/patch_video_menu.py"
