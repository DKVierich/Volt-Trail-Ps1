        \ active'\nassert 'st.generate_normals()' in method and 'road_meshes += 1' in method\nassert 'Color(\"#bca27c\")'\
        \ in method, 'Wurzelheim road palette missing'\nfusion = Path('android/scripts/V414Fusion.gd').read_text(encoding='utf-8')\n\
        for token in ['const BOOST_SECONDS: float = 0.95','const BOOST_CAPACITY: int = 3',\n              'const BOOST_RECHARGE_SECONDS:\
        \ float = 10.0']:\n    assert token in fusion, f'flight mode regression: {token}'\nprint('FIX58_START_GUARD_OK: heavy\
        \ 1.5m x many road strips removed; known-loading 4m lightweight renderer restored; boost intact')\nPYSTARTGUARD\n\
        # FIX61: Import image assets before loading scripts with preload(\"res://...webp\").\n# Running a project without\
        \ an editor import can falsely report \"no resource loaders\"\n# for the atlas, even when an Android export works.\
        \ Keep the atlas and the map intact.\ntest -s android/assets/maps/LWOD_Atlas_HD.webp || {\n  echo '::error::World\
        \ atlas is missing before Godot import'; exit 1;\n}\nset +e\ntimeout --signal=TERM --kill-after=5s 180s godot --headless\
        \ --path android --editor --import \\\n  > build/diagnose/FIX61_Asset_Import.log 2>&1\nimport_status=$?\nset -e\n\
        cat build/diagnose/FIX61_Asset_Import.log\nif [ \"$import_status\" -ne 0 ]; then\n  echo \"::error::Godot resource\
        \ import failed (status=$import_status)\"\n  exit 1\nfi\nif grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script|Import\
        \ failed|Error importing' build/diagnose/FIX61_Asset_Import.log; then\n  echo '::error::Asset importer reported a\
        \ script or resource error'\n  exit 1\nfi\n# Require an import metadata/asset marker, rather than just a zero process\
        \ status.\nif [ ! -f android/assets/maps/LWOD_Atlas_HD.webp.import ]; then\n  echo '::error::Atlas import metadata\
        \ not generated'\n  exit 1\nfi\nif ! grep -Fq 'res://.godot/imported/' android/assets/maps/LWOD_Atlas_HD.webp.import;\
        \ then\n  echo '::error::Atlas import metadata has no Godot imported path'\n  exit 1\nfi\necho 'FIX61_ATLAS_IMPORT_OK:\
        \ world-map texture imported before runtime preload'\n\n# Launch the actual project, not only standalone smoke tests.\n\
        set +e\ntimeout --signal=TERM --kill-after=5s 160s godot --headless --path android --quit-after 90 \\\n  > build/diagnose/FIX61_Projektstart.log\
        \ 2>&1\nlaunch_status=$?\nset -e\ncat build/diagnose/FIX61_Projektstart.log\nif [ \"$launch_status\" -ne 0 ]; then\n\
        \  echo \"::error::Godot project start failed or timed out (status=$launch_status)\"\n  exit 1\nfi\nif grep -Eiq 'SCRIPT\
        \ ERROR:|Parse Error:|Failed to load script|Invalid call' build/diagnose/FIX61_Projektstart.log; then\n  echo '::error::Godot\
        \ script/runtime error during startup'\n  exit 1\nfi\nfor ready in 'V408_WORLD_READY:' 'V4081_TELEPORT_READY:'; do\n\
        \  if ! grep -Fq \"$ready\" build/diagnose/FIX61_Projektstart.log; then\n    echo \"::error::Game readiness marker\
        \ missing: $ready\"\n    exit 1\n  fi\ndone\necho 'FIX61_GAME_START_OK: main scene created, regions and teleport loaded,\
        \ 90 frames completed'\n"
    - name: Sicherungen und alle FIX39 Godot-Tests
      shell: bash
      run: "set -euo pipefail\nfor i in 11 12 13 14 15 16; do\n  echo \"::group::FIX39 Originaltest $i\"\n  bash --noprofile\
        \ --norc -e -o pipefail \"$RUNNER_TEMP/fix41_base/$i.sh\"\n  echo '::endgroup::'\ndone\n"
    - name: FIX54 Dungeon-Dekoration und Kamera testen
      shell: bash
