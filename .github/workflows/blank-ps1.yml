              return dx>-distance && dx<distance && dz>-220 && dz<1120;
          }

          static void vt_v241_flat(int x1,int z1,int x2,int z2,int y,int r,int g,int b) {
              SVECTOR a={x1-px,y,z1-pz,0};
              SVECTOR c={x1-px,y,z2-pz,0};
              SVECTOR d={x2-px,y,z2-pz,0};
              SVECTOR e={x2-px,y,z1-pz,0};
              draw_triangle3(&a,&c,&e,r,g,b);
              draw_triangle3(&e,&c,&d,r*4/5,g*4/5,b*4/5);
          }

          static void vt_v241_path(int x1,int z1,int x2,int z2,int width) {
              /* A continuous, walkable looking road strip between map landmarks. */
              if (!vt_v241_visible((x1+x2)/2,(z1+z2)/2,950)) return;
              if (x1==x2) {
                  vt_v241_flat(x1-width,z1,x1+width,z2,33,164,123,80);
