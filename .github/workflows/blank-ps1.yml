              else vt_v24_ground_patch(gx,gz,110,12,11,57,132,72,39,112,59);
          }
          '''
          # Recreate the V24 world function with additional locations and paths, retaining
          # its original function name (the V24 workflow already calls that name in main).
          new_world = r'''static void vt_v24_draw_overworld(void) {
