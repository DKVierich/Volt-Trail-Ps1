                      vt_pyramid(i * 95, -14, 280 + i * 55, 8, 20, 190, 200, 245);
                  }
                  vt_v24_peak(-360, 860, 120, 180, 50, 82, 92);
                  vt_v24_peak(360, 830, 120, 190, 48, 80, 100);
              }
          }
          '''

          replace_once('static void draw_hud(void) {', helpers + '\nstatic void draw_hud(void) {')

          code, _ = re.subn(r'if \(pz > 420 && region < 2\)', 'if (pz > 1120 && region < 2)', code)
          code, _ = re.subn(r'if \(pz < -420 && region > 0\)', 'if (pz < -1120 && region > 0)', code)
          code, _ = re.subn(r'if \(region==0 && step_count>20\) region=1;', 'if (region==0 && step_count>120) region=1;', code)
          code, _ = re.subn(r'if \(region==1 && step_count>45\) region=2;', 'if (region==1 && step_count>260) region=2;', code)

