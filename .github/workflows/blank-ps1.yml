name: LWOD Android V41.7 FIX76.2 Diagonale Kampfaufstellung
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/blank-ps1.yml
permissions:
  contents: read
jobs:
  android:
    name: LWOD Android V41.7 FIX76.2 APK
    runs-on: ubuntu-latest
    timeout-minutes: 55
    container:
      image: barichello/godot-ci:4.7.2
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: /usr/lib/android-sdk
    steps:
    - name: Unveränderte FIX76-Originalquelle laden
      uses: actions/checkout@v4
      with:
        ref: d8a75b1b92b7018f0448618c2909c791b5d1dedd
    - name: Python und YAML bereitstellen
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v python3 >/dev/null 2>&1 || ! python3 -c 'import yaml' >/dev/null 2>&1; then
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 python3-yaml
        fi
    - name: Vollständige FIX76-Originalschritte prüfen und sichern
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY_SOURCE'
        import hashlib, os, subprocess, yaml
        from pathlib import Path
        raw = Path('.github/workflows/blank-ps1.yml').read_bytes()
        sha = hashlib.sha1(('blob %d\0' % len(raw)).encode() + raw).hexdigest()
        assert sha == 'b0b6e77e05a357f047b9f6c278f4d830be8634dc', 'FIX76: original source checksum mismatch'
        steps = yaml.safe_load(raw)['jobs']['android']['steps']
        assert len(steps) == 27, 'FIX76: original step count changed'
        assert steps[0]['with']['ref'] == '9b01d317fffd8d5abf0b2d0afbffb8846c44f1c6'
        assert steps[3]['with']['ref'] == 'a50b23c0dbeebc464305c0451b98245a0632aebc'
        expected = {
            2: 'FIX39 Schritte sichern',
            4: 'FIX67 Alte Spielbasis mit Neustartschutz rekonstruieren',
            5: 'FIX75 Vollstaendige bewährte FIX72 Spielbasis und Kampflogik installieren',
            6: 'FIX75 HD Kampfarena und Menuegestaltung installieren',
            7: 'FIX75 Kampfdesign und Testszene vorbereiten',
            8: 'FIX76 Android Updateversion eindeutig setzen',
            9: 'FIX76 Kompaktes Kampf-UI Kamera und detailliertere Modelle installieren',
            10: 'FIX61 Weltkarte importieren und echten Spielstart testen',
            11: 'Sicherungen und alle FIX39 Godot-Tests',
            12: 'FIX54 Dungeon-Dekoration und Kamera testen',
            13: 'FIX55 Flugschub und unabhängige Ladezeiten testen',
            14: 'FIX61 Neun Stadtwege Kurven und Flugschub testen',
            15: 'FIX61 Pflasteroptik und Kurven automatisch testen',
            16: 'FIX62 Komplettes Dorfwegenetz und Pflaster nachpruefen',
            17: 'FIX67 Alle Dorfdekorationen und Regionsvarianten testen',
            18: 'FIX67 Freie Wege und sichere Pflanzenpositionen testen',
            19: 'FIX68 Dorfwege und freie Wiesen testen',
            20: 'FIX70 (Regression) Echtkampf- und Menutests',
            21: 'FIX72 Kampfkamera, Teamplatz und Speichern wirklich testen',
            22: 'FIX76 Kampfgrafik und kompaktes UI testen',
            23: 'FIX76 Android APK exportieren und pruefen',
        }
        target = Path(os.environ['RUNNER_TEMP']) / 'lwod_fix76_steps'
        target.mkdir(parents=True, exist_ok=True)
        for i, name in expected.items():
            step = steps[i]
            assert step['name'] == name, (i, name, step['name'])
            assert step['shell'] == 'bash' and set(step) == {'name', 'shell', 'run'}, (i, step.keys())
            script = target / f'{i:02d}.sh'
            script.write_text(step['run'] + '\n', encoding='utf-8')
            subprocess.run(['bash', '-n', str(script)], check=True)
        print('FIX76_ORIGINAL_OK:', len(expected), 'original scripts verified and preserved')
        PY_SOURCE
    - name: FIX39 Sicherung laden
      uses: actions/checkout@v4
      with:
        ref: 9b01d317fffd8d5abf0b2d0afbffb8846c44f1c6
    - name: FIX39 Schritte sichern
      shell: bash
      run: bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/lwod_fix76_steps/02.sh"
    - name: Erfolgreichen FIX19 Stand laden
      uses: actions/checkout@v4
      with:
        ref: a50b23c0dbeebc464305c0451b98245a0632aebc
    - name: FIX67 Alte Spielbasis mit Neustartschutz rekonstruieren
      shell: bash
      run: bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/lwod_fix76_steps/04.sh"
    - name: FIX75 Vollstaendige bewährte FIX72 Spielbasis und Kampflogik installieren
      shell: bash
      run: bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/lwod_fix76_steps/05.sh"
    - name: FIX75 HD Kampfarena und Menuegestaltung installieren
      shell: bash
      run: bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/lwod_fix76_steps/06.sh"
    - name: FIX75 Kampfdesign und Testszene vorbereiten
      shell: bash
      run: bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/lwod_fix76_steps/07.sh"
    - name: FIX76 Android Updateversion eindeutig setzen
      shell: bash
      run: bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/lwod_fix76_steps/08.sh"
    - name: FIX76 Kompaktes Kampf-UI Kamera und detailliertere Modelle installieren
      shell: bash
      run: bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/lwod_fix76_steps/09.sh"
    - name: FIX76.2 Kampfpositionen 7 und 1 Uhr mit mehr Abstand
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY_FORMATION'
        from pathlib import Path
        import re
        p = Path('android/scripts/V469Battle.gd')
        s = p.read_text(encoding='utf-8')
        def replace_once(old, new):
            global s
            assert s.count(old) == 1, 'FIX76.2: missing or ambiguous anchor: ' + old
            s = s.replace(old, new, 1)
        # Model fronts point along -Z. Both groups face each other on the ground.
        # Positive Z is the foreground; camera looks toward negative Z.
        replace_once('_arena_hero.position = Vector3(-2.26,0,0.35)',
                     '_arena_hero.position = Vector3(-2.65,0,2.25)')
        replace_once('_arena_foe.position = Vector3(2.27,0,-0.20)',
                     '_arena_foe.position = Vector3(2.65,0,-2.25)')
        replace_once('_arena_hero.rotation.y = -PI*0.5',
                     '_arena_hero.rotation.y = -atan2(5.3, 4.5)')
        replace_once('_arena_foe.rotation.y = PI*0.5',
                     '_arena_foe.rotation.y = PI - atan2(5.3, 4.5)')
        # Slightly wider elevated framing to keep both models on screen.
        replace_once('camera.position = Vector3(-0.55,5.65,6.40)',
                     'camera.position = Vector3(0,7.2,6.8)')
        replace_once('camera.fov = 49.0', 'camera.fov = 54.0')
        replace_once('camera.look_at(Vector3(0,1.35,0))',
                     'camera.look_at(Vector3(0,1.1,0))')
        assert 'button.custom_minimum_size = Vector2(165,39)' in s
        p.write_text(s, encoding='utf-8')
        # A new Android version code allows installation over FIX76.1.
        cfg = Path('android/export_presets.cfg')
        t = cfg.read_text(encoding='utf-8')
        assert t.count('version/name="4.1.7.76"') == 1
        t = t.replace('version/name="4.1.7.76"', 'version/name="4.1.7.76.2"', 1)
        t, n = re.subn(r'(?m)^version/code=(\d+)$', lambda m: 'version/code='+str(int(m.group(1))+1), t, count=1)
        assert n == 1, 'FIX76.2: version/code missing'
        cfg.write_text(t, encoding='utf-8')
        # The original exporter is retained; only its output filename is changed.
        import os
        exporter = Path(os.environ['RUNNER_TEMP']) / 'lwod_fix76_steps' / '23.sh'
        export = exporter.read_text(encoding='utf-8')
        assert export.count('LWOD-Android-V41.7-FIX76.apk') == 1
        exporter.write_text(export.replace('LWOD-Android-V41.7-FIX76.apk', 'LWOD-Android-V41.7-FIX76.2.apk', 1), encoding='utf-8')
        print('FIX76_2_FORMATION_OK: diagonal positions, distance 6.95, camera, Android version')
        PY_FORMATION
        bash -n "$RUNNER_TEMP/lwod_fix76_steps/23.sh"
    - name: FIX61 Weltkarte importieren und echten Spielstart testen
      shell: bash
      run: bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/lwod_fix76_steps/10.sh"
    - name: Sicherungen und alle FIX39 Godot-Tests
      shell: bash
      run: bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/lwod_fix76_steps/11.sh"
    - name: FIX54 Dungeon-Dekoration und Kamera testen
      shell: bash
      run: bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/lwod_fix76_steps/12.sh"
    - name: FIX55 Flugschub und unabhängige Ladezeiten testen
      shell: bash
      run: bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/lwod_fix76_steps/13.sh"
    - name: FIX61 Neun Stadtwege Kurven und Flugschub testen
      shell: bash
      run: bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/lwod_fix76_steps/14.sh"
    - name: FIX61 Pflasteroptik und Kurven automatisch testen
      shell: bash
      run: bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/lwod_fix76_steps/15.sh"
    - name: FIX62 Komplettes Dorfwegenetz und Pflaster nachpruefen
      shell: bash
      run: bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/lwod_fix76_steps/16.sh"
    - name: FIX67 Alle Dorfdekorationen und Regionsvarianten testen
      shell: bash
      run: bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/lwod_fix76_steps/17.sh"
    - name: FIX67 Freie Wege und sichere Pflanzenpositionen testen
      shell: bash
      run: bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/lwod_fix76_steps/18.sh"
    - name: FIX68 Dorfwege und freie Wiesen testen
      shell: bash
      run: bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/lwod_fix76_steps/19.sh"
    - name: FIX70 (Regression) Echtkampf- und Menutests
      shell: bash
      run: bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/lwod_fix76_steps/20.sh"
    - name: FIX76.2 Button-Test erhalten und Kampfaufstellung testen
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY_TEST'
        from pathlib import Path
        p = Path('android/tests/V471CombatSmoke.gd')
        s = p.read_text(encoding='utf-8')
        old = 'button.custom_minimum_size.y < 45.0'
        new = 'button.custom_minimum_size.y < 38.0'
        assert s.count(old) == 1, 'FIX76.1: original FIX72 size check missing or ambiguous'
        assert '_fail("combat buttons are still too small")' in s
        s = s.replace(old, new, 1)
        anchor = '    if fight._actions.get_child_count()!=7:'
        assert s.count(anchor) == 1, 'FIX76.2: old runtime test anchor missing'
        formation = """    var player_group: Node3D = fight._arena.get_node_or_null("Spielergruppe") as Node3D
            var enemy_group: Node3D = fight._arena.get_node_or_null("WalddracheGegner") as Node3D
            if player_group == null or enemy_group == null:
                _fail("FIX76.2: arena groups missing")
                return
            var hp: Vector3 = player_group.position
            var ep: Vector3 = enemy_group.position
            if hp.x >= -2.5 or hp.z <= 2.0 or ep.x <= 2.5 or ep.z >= -2.0:
                _fail("FIX76.2: 7/1 o'clock formation missing")
                return
            if hp.distance_to(ep) < 6.8:
                _fail("FIX76.2: combat groups still too close")
                return
            var toward: Vector3 = Vector3(ep.x-hp.x,0,ep.z-hp.z).normalized()
            if (-player_group.transform.basis.z).normalized().dot(toward) < 0.98 or (-enemy_group.transform.basis.z).normalized().dot(-toward) < 0.98:
                _fail("FIX76.2: combat groups do not face each other")
                return
            if camera.position.y < 7.0 or camera.position.z > 7.0 or camera.fov < 53.0 or camera.fov > 55.0:
                _fail("FIX76.2: adjusted camera framing missing")
                return
            print("FIX76_2_POSITION_TEST_OK: diagonal formation and facing")
        """
        # Strip only the indentation introduced for the multiline Python literal.
        lines = formation.splitlines()
        formation = lines[0] + '\n' + '\n'.join(line for line in lines[1:] if line.strip()) + '\n'
        s = s.replace(anchor, formation + anchor, 1)
        p.write_text(s, encoding='utf-8')
        print('FIX76_1_TEST_OK: minimum height 38; all other FIX72 checks preserved')
        PY_TEST
    - name: FIX72 Kampfkamera, Teamplatz und Speichern wirklich testen
      shell: bash
      run: bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/lwod_fix76_steps/21.sh"
    - name: FIX76 Kampfgrafik und kompaktes UI testen
      shell: bash
      run: bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/lwod_fix76_steps/22.sh"
    - name: FIX76.2 Android APK exportieren und pruefen
      shell: bash
      run: bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/lwod_fix76_steps/23.sh"
    - id: apk_upload
      name: FIX76.2 APK als Download hochladen
      uses: actions/upload-artifact@v4
      with:
        compression-level: 0
        if-no-files-found: error
        name: LWOD_ANDROID_V41_7_FIX76_2_APK
        path: build/android/LWOD-Android-V41.7-FIX76.2.apk
        retention-days: 14
    - name: Erfolgreichen APK Upload bestaetigen
      shell: bash
      env:
        APK_ARTIFACT_ID: ${{ steps.apk_upload.outputs.artifact-id }}
        APK_ARTIFACT_URL: ${{ steps.apk_upload.outputs.artifact-url }}
      run: |
        set -euo pipefail
        test -n "$APK_ARTIFACT_ID"
        test -n "$APK_ARTIFACT_URL"
        printf '### Android APK Download\n\n[FIX76.2 APK herunterladen](%s)\n' "$APK_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
    - name: FIX76.2 Testprotokolle hochladen
      if: always()
      uses: actions/upload-artifact@v4
      with:
        if-no-files-found: warn
        name: LWOD_FIX76_2_TESTPROTOKOLLE
        path: build/diagnose
        retention-days: 14
