name: LWOD Android V41.7 FIX75 3D Kampfgrafik Wald-Upgrade
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/blank-ps1.yml
permissions:
  contents: read
jobs:
  android:
    name: LWOD Android V41.7 FIX75 APK
    runs-on: ubuntu-latest
    timeout-minutes: 55
    container:
      image: barichello/godot-ci:4.7.2
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: /usr/lib/android-sdk
    steps:
    - name: FIX39 Sicherung laden
      uses: actions/checkout@v4
      with:
        ref: 9b01d317fffd8d5abf0b2d0afbffb8846c44f1c6
    - name: Python und YAML bereitstellen
      shell: bash
      run: "set -euo pipefail\nif ! command -v python3 >/dev/null 2>&1 || ! python3 -c 'import yaml' >/dev/null 2>&1; then\n\
        \  apt-get update -qq\n  DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 python3-yaml\nfi\n"
    - name: FIX39 Schritte sichern
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PYREPLAY'\nimport hashlib,os,subprocess,yaml\nfrom pathlib import Path\nraw=Path('.github/workflows/blank-ps1.yml').read_bytes()\n\
        assert hashlib.sha1(('blob %d\\0'%len(raw)).encode()+raw).hexdigest()=='148a908318b1d91002357f1acfa18fbf60e347c3','FIX39\
        \ source checksum mismatch'\nsteps=yaml.safe_load(raw)['jobs']['android']['steps']\nassert len(steps)==21 and steps[10]['name'].startswith('FIX39\
        \ Sichtweite und Terrain') and steps[16]['name'].startswith('FIX39 Sichtweite und Chunk')\nfolder=Path(os.environ['RUNNER_TEMP'])/'fix41_base';folder.mkdir(exist_ok=True)\n\
        for i in range(2,17):\n    s=steps[i];assert s.get('shell')=='bash' and 'if' not in s\n    f=folder/('%02d.sh'%i);f.write_text(s['run']+'\\\
        n',encoding='utf-8');subprocess.run(['bash','-n',str(f)],check=True)\n    print('FIX39 gesichert',i,s['name'],flush=True)\n\
        PYREPLAY\n"
    - name: Erfolgreichen FIX19 Stand laden
      uses: actions/checkout@v4
      with:
        ref: a50b23c0dbeebc464305c0451b98245a0632aebc
    - name: FIX67 Alte Spielbasis mit Neustartschutz rekonstruieren
      shell: bash
      run: "set -euo pipefail\n# FIX67: A failure in the deeply nested V7 -> V40.2 source recovery must\n# not silently discard\
        \ the underlying game. Keep immutable original scripts.\ntest -s \"$RUNNER_TEMP/fix41_base/02.sh\"\ntest -s \"$RUNNER_TEMP/fix41_base/10.sh\"\
        \nLOGDIR=\"$RUNNER_TEMP/lwod_fix67_recovery\"\nmkdir -p \"$LOGDIR\" build/diagnose\nfor attempt in 1 2; do\n  echo\
        \ \"::group::FIX67 Basisaufbau – Versuch $attempt/2\"\n  if [ \"$attempt\" -eq 2 ]; then\n    # Clear only generated\
        \ project files. The pinned FIX19 checkout and\n    # original replay scripts in RUNNER_TEMP remain untouched.\n \
        \   git reset --hard HEAD\n    git clean -fdx\n    mkdir -p build/diagnose\n  fi\n  logfile=\"$LOGDIR/FIX67_Basis_Versuch_${attempt}.log\"\
        \n  echo \"FIX67_VERSUCH_START=$attempt\" | tee \"$logfile\"\n  failed=0\n  for i in 02 03 04 05 06 07 08 09 10; do\n\
        \    echo \"::group::FIX39 Originalinstallation $i\"\n    set +e\n    bash --noprofile --norc -e -o pipefail \"$RUNNER_TEMP/fix41_base/$i.sh\"\
        \ 2>&1 | tee -a \"$logfile\"\n    status=${PIPESTATUS[0]}\n    set -e\n    echo '::endgroup::'\n    if [ \"$status\"\
        \ -ne 0 ]; then\n      echo \"FIX67_BASIS_FEHLER: Versuch $attempt, Schritt $i, Exit $status\" | tee -a \"$logfile\"\
        \n      failed=1\n      break\n    fi\n  done\n  echo '::endgroup::'\n  cp -f \"$LOGDIR\"/*.log build/diagnose/ ||\
        \ true\n  if [ \"$failed\" -eq 0 ]; then\n    echo 'FIX67_BASE_REBUILT_OK: vollständige Originalspielbasis vorhanden'\n\
        \    exit 0\n  fi\n  if [ \"$attempt\" -eq 1 ]; then\n    echo '::warning::Alte Basisrekonstruktion fehlgeschlagen;\
        \ einmaliger sauberer Wiederholungsversuch'\n  fi\ndone\necho '::error::Auch der zweite Basisaufbau ist gescheitert.\
        \ Siehe FIX67_Basis_Versuch_*.log in Testprotokolle.'\nexit 1\n"
    - name: FIX75 Vollstaendige bewährte FIX72 Spielbasis und Kampflogik installieren
      shell: bash
      run: "set -euo pipefail\n# Restore known-successful FIX72 gameplay modules from immutable historical workflow.\n# This\
        \ avoids copying ~110 KB of pre-encoded installation steps onto a mobile GitHub editor.\nwget -q --tries=3 --timeout=60\
        \ --https-only \\\n  -O \"$RUNNER_TEMP/lwod_fix72_source.yml\" \\\n  'https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/4a5bc925bdafad616f3a28a6fbd2c72662169fc1/.github/workflows/blank-ps1.yml'\n\
        test -s \"$RUNNER_TEMP/lwod_fix72_source.yml\"\ntest \"$(git hash-object \"$RUNNER_TEMP/lwod_fix72_source.yml\")\"\
        \ = 'c9e6973851d76b26b16c03eab5edcb49b6db7b1e' || {\n  echo '::error::FIX72 source checksum mismatch'; exit 1;\n}\n\
        python3 - <<'FIX75_REPLAY'\nimport os, subprocess, yaml\nfrom pathlib import Path\nsource = Path(os.environ['RUNNER_TEMP'])/'lwod_fix72_source.yml'\n\
        steps = yaml.safe_load(source.read_text(encoding='utf-8'))['jobs']['android']['steps']\nassert len(steps) == 31, 'FIX72\
        \ workflow structure changed'\nassert 'Dungeon' in steps[5]['name'] and 'Kampfkamera' in steps[14]['name']\n# Only\
        \ replay original FIX72 installation steps, not its test/export/upload steps.\nfor i in range(5,15):\n    step = steps[i]\n\
        \    print(f'FIX75_RESTORE_STEP_{i}: {step[\"name\"]}', flush=True)\n    subprocess.run(['bash','--noprofile','--norc','-e','-o','pipefail','-c',step['run']],\
        \ check=True)\nprint('FIX75_BASE_OK: FIX72 gameplay fully installed', flush=True)\nFIX75_REPLAY\n"
