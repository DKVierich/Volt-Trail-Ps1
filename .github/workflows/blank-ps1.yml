
name: LWOD Android V40.9.4 FIX1 Spielfigur und Phoenix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/blank-ps1.yml

permissions:
  contents: read

jobs:
  android:
    name: LWOD Android V40.9.4 FIX1 APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: barichello/godot-ci:4.7.2
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: /usr/lib/android-sdk
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python YAML bereitstellen
        shell: bash
        run: |
          set -euo pipefail
          if ! python3 -c 'import yaml' >/dev/null 2>&1; then
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-yaml
          fi

      - name: Vollstaendiges Spiel rekonstruieren, Fehler reparieren und APK bauen
        shell: bash
        run: |
          set -euo pipefail
          ORIGINAL="$RUNNER_TEMP/lwod_v4094_original.yml"
          wget -q --tries=3 --timeout=60 --https-only -O "$ORIGINAL" \
            'https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/71e1462a498cf34943c37807df9bc1b2cdece637/.github/workflows/blank-ps1.yml'

          python3 - <<'PY'
          import hashlib
          import os
          import subprocess
          from pathlib import Path
          import yaml

          original = Path(os.environ['RUNNER_TEMP']) / 'lwod_v4094_original.yml'
          data = original.read_bytes()
          git_blob_sha = hashlib.sha1(
              ('blob %d\0' % len(data)).encode() + data
          ).hexdigest()
          if git_blob_sha != 'df81453c567051bb0813926abca84d6ba2467196':
              raise SystemExit('FEHLER: Originaldatei stimmt nicht mit dem geprueften Stand ueberein')

          steps = yaml.safe_load(data)['jobs']['android']['steps']
          expected = [
              'V40.9.2 FIX5 unveraenderlich wiederherstellen',
              'V40.9.3 Detaillierte NPCs und Haendler installieren',
              'V40.9.3 FIX2 Sonnental Haendler richtig ausrichten',
              'V40.9.4 Spielfigur und violetten Phoenix neu gestalten',
              'V40.9.4 Neue Spielfigur und Phoenix testen',
              'V40.9.3 Neue NPCs und bisherige Kollisionen testen',
              'V40.9.3 APK erstellen und pruefen',
          ]
          if len(steps) != 10 or [s['name'] for s in steps[2:9]] != expected:
              raise SystemExit('FEHLER: Basis-Workflow hat eine unerwartete Struktur')

          def repair_hero():
              p = Path('android/scripts/V4094HeroPhoenix.gd')
              content = p.read_text(encoding='utf-8')
              old = '    for i,p in enumerate([hero_left_arm,hero_right_arm]):'
              new = (
                  '    for i in range(2):\n'
                  '        var p: Node3D = hero_left_arm if i == 0 else hero_right_arm'
              )
              if content.count(old) != 1:
                  raise SystemExit('FEHLER: Die defekte Zeile wurde nicht eindeutig gefunden')
              p.write_text(content.replace(old, new), encoding='utf-8')
              print('FIX1_OK: Godot-Syntaxfehler in Zeile 180 beseitigt', flush=True)

          for i in range(2, 9):
              step = steps[i]
              name = step['name']
              if i == 6:
                  repair_hero()
              print('STARTE:', name, flush=True)
              seconds = 1200 if i == 2 else (900 if i == 8 else 180)
              subprocess.run(
                  ['timeout', '--signal=TERM', '--kill-after=5s',
                   f'{seconds}s', 'bash', '-e', '-u', '-o', 'pipefail',
                   '-c', step['run']],
                  cwd=os.environ['GITHUB_WORKSPACE'], check=True
              )
              print('OK:', name, flush=True)

          old_apk = Path('build/android/LWOD-Android-V40.9.4.apk')
          new_apk = Path('build/android/LWOD-Android-V40.9.4-FIX1.apk')
          if not old_apk.is_file() or old_apk.stat().st_size == 0:
              raise SystemExit('FEHLER: APK wurde nicht erstellt')
          old_apk.replace(new_apk)
          print('ERFOLG: APK erstellt:', new_apk, flush=True)
          PY

      - name: Fertige APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: LWOD_ANDROID_V40_9_4_FIX1_APK
          path: build/android/LWOD-Android-V40.9.4-FIX1.apk
          if-no-files-found: error
          retention-days: 14
