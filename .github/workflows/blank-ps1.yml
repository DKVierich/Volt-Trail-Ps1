name: LWOD Android V40.8.2 FIX2 Kompakt
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/blank-ps1.yml
permissions:
  contents: read
jobs:
  android:
    name: LWOD Android V40.8.2 FIX2 APK
    runs-on: ubuntu-latest
    timeout-minutes: 65
    container:
      image: barichello/godot-ci:4.7.2
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: /usr/lib/android-sdk
    steps:
    - name: Repository laden
      uses: actions/checkout@v4
    - name: Python YAML fuer feste V40.8.1 Basis bereitstellen
      shell: bash
      run: |
        set -euo pipefail
        if ! python3 -c 'import yaml' >/dev/null 2>&1; then
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 python3-yaml
        fi
        python3 -c 'import yaml; print("V4082_PARSER_OK: PyYAML",yaml.__version__)'
    - name: V40.8.1 Basisskript aus unveraenderlichem Commit abrufen
      shell: bash
      run: |
        set -euo pipefail
        wget -q --tries=3 --timeout=60 --https-only -O "$RUNNER_TEMP/lwod_v4081_baseline.yml" 'https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/c20014387aded796ddc5f52c385680081c020b0c/.github/workflows/blank-ps1.yml'
        test -s "$RUNNER_TEMP/lwod_v4081_baseline.yml"
        test "$(git hash-object "$RUNNER_TEMP/lwod_v4081_baseline.yml")" = '6ec7bf5e13844a5531a6161addfea22e1ae48b5c' || { echo '::error::V40.8.1 Quellpruefsumme falsch'; exit 42; }
        cat > "$RUNNER_TEMP/lwod_v4081_replay.py" <<'PYREPLAY'
        import pathlib, subprocess, sys, yaml
        source=pathlib.Path(sys.argv[1])
        mode=sys.argv[2]
        steps=yaml.safe_load(source.read_text(encoding="utf-8"))["jobs"]["android"]["steps"]
        assert len(steps)==25 and steps[10]["name"]=="V40.8.1 Teleportkristalle und Reisezielmenue installieren"
        assert steps[11]["name"]=="Godot Ressourcen importieren"
        assert steps[22]["name"]=="LWOD Android V40.8.1 APK erstellen"
        selected=range(1,11) if mode=="install" else range(11,22)
        for i in selected:
            step=steps[i]
            title=step["name"]
            body=step["run"]
            print("V4082_BASIS_STEP",i,title,flush=True)
            proc=subprocess.run(["bash","-e","-o","pipefail","-c",body])
            if proc.returncode:
                raise SystemExit("V40.8.1 Basisfehler in %s: Exit %d" % (title,proc.returncode))
        print("V4082_BASIS_OK:",mode,flush=True)
        PYREPLAY
        python3 -m py_compile "$RUNNER_TEMP/lwod_v4081_replay.py"
    - name: V40.8.1 Spielwelt, Inventar und Teleport reproduzierbar erstellen
      shell: bash
      run: |
        set -euo pipefail
        python3 "$RUNNER_TEMP/lwod_v4081_replay.py" "$RUNNER_TEMP/lwod_v4081_baseline.yml" install
