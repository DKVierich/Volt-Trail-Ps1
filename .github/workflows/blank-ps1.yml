        \ - <<'FIX25_PARSE'\nimport os,re\nfrom pathlib import Path\nroot=Path('artifacts')\nlog=(root/'FIX25_BUILD_LOG.txt').read_text(encoding='utf-8',errors='replace').splitlines()\n\
        rc=int(os.environ.get('LYDRA_FIX25_BUILD_RC','1'))\nrx=re.compile(r'(?:\\berror:|\\bfatal error:|undefined reference|collect2:|ld:|overflowed\
        \ by|passt nicht in die Region|CMake-Fehler|ninja: Build abgebrochen|make(?:\\[[0-9]+\\])?: \\*\\*\\*|fatal:|Datei oder Verzeichnis nicht gefunden|not\
        \ found)',re.I)\nhits=[(i,line) for i,line in enumerate(log) if rx.search(line)]\nout=['LYDRA V31.9.9.10 FIX25 | Compiler/Linker-Diagnose',\n\
        \ 'Build-Exitcode: '+str(rc),'Ausgabezeilen insgesamt: '+str(len(log)),\n 'Fehlerzeilen gefunden: '+str(len(hits)),'']\n\
        if hits:\n out.append('ERSTE FEHLERMELDUNGEN MIT KONTEXT:')\n for i,_ in hits[:12]:\n out.append('--- Zeile '+str(i+1)+'\
        \ ---')\n for n in range(max(0,i-2),min(len(log),i+4)):\n out.append(f'{n+1:05d} {log[n]}')\nelif rc!=0:\n\
        \ out.append('KEIN EXPLIZITES error: GEFUNDEN. LETZTE 100 LOGZEILEN:')\n out.extend(log[-100:])\nelse:\n out.append('PS1\
        \ Build erfolgreich abgeschlossen.')\n(root/'FIX25_ERSTE_FEHLER.txt').write_text('\\n'.join(out)+'\\n',encoding='utf-8')\nsrc=Path(os.environ.get('PROJECT_DIR',''))/'src'/'main.c'\n\
        if src.is_file():\n # Voller Quelltext hilft, Zeilenangaben aus dem Compiler zurueckzuverfolgen.\n (root/'FIX25_MAIN_C.c').write_bytes(src.read_bytes())\n\
        print('\\n=== FIX27: Erster Compiler-/Linkerfehler ===')\nprint('\\n'.join(out[:130]))\nprint('=== ENDE FIX27 Diagnose ===')\n\
        FIX25_PARSE\nif [ \"$build_rc\" -ne 0 ]; then\n echo \"::error::FIX27: Basis 51 scheiterte mit Exitcode $build_rc. Echte Compilerfehler\
        \ stehen oben und im Diagnose-Artefakt.\"\n exit \"$build_rc\"\nfi\necho 'FIX27: PS1-Komplettbuild erfolgreich. Alle FIX24-Hausdetails\
        \ halten."\n"
