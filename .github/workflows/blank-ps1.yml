        )\n        quit(5)\n        return\n    var helper: Node = loader.new()\n    g.add_child(helper)\n    helper.call(\"setup\"\
        ,g)\n    helper.call(\"_bind_characters\")\n    var hv: Node3D = g.hero.get_node_or_null(\"LWOD_V4094_HeroVisual\") as\
        \ Node3D\n    var pv: Node3D = g.phoenix.get_node_or_null(\"LWOD_V4094_PhoenixVisual\") as Node3D\n    if hv == null or\
        \ pv == null or not hv.has_meta(\"lwod_v4120_hero\") or not pv.has_meta(\"lwod_v4120_unique_phoenix\"):\n        push_error(\"\
        V4120: Figuren wurden im Spiel nicht eingebunden\")\n        quit(6)\n        return\n    helper.call(\"_process\",0.08)\n\
        \    print(\"V4120_SKINNED_CHARACTER_OK: 15 und 10 Knochen, 4 Clips, echte Pose-Bewegung\")\n    quit(0)\nGD_V4120_TEST\n\
        timeout --signal=TERM --kill-after=5s 115s godot --headless --path android --quit-after 250 --script res://tests/V4120RigSmoke.gd\
        \ 2>&1 | tee /tmp/lwod4100_rig.log\nif grep -Eiq 'SCRIPT ERROR:|Parse Error:|Invalid call|Failed to load script|ERROR:\
