            }
        }
        static void vt_v31_flat_shadow(int wx,int wz,int radius) {
            int i;
            SVECTOR center={(short)(wx-px),34,(short)(wz-pz),0};
            for(i=0;i<8;i++){
                int ang=i*512,next=((i+1)&7)*512;
                SVECTOR a={(short)(wx+radius*vt_v293_cos(ang)/1024-px),34,
                           (short)(wz+radius*vt_v293_sin(ang)/1024-pz),0};
                SVECTOR b={(short)(wx+radius*vt_v293_cos(next)/1024-px),34,
                           (short)(wz+radius*vt_v293_sin(next)/1024-pz),0};
                draw_triangle3(&center,&a,&b,31,75,47);
            }
        }
        '''
        indices=[span('vt_player')[0],span('vt_sparkit')[0]]
        idx=min(indices)
        s=s[:idx]+models+'\n'+s[idx:]

        player_extra=r'''
            /* V31: faceted rounded head, narrow neck, shoulders and moving limbs. */
            {
                int step_anim=(step_count&7)<4?3:-3;
                vt_v31_flat_shadow(x,z+4,22);
                vt_v31_oval(x,-35,z-2,10,13,9,224,175,127);
                vt_v31_oval(x,-44,z-6,10,4,8,69,47,29);
                vt_v293_player_box(x,-22,z,7,42,88,181);
                vt_v293_player_box(x-13,-12,z+step_anim,5,206,157,109);
                vt_v293_player_box(x+13,-12,z-step_anim,5,206,157,109);
                vt_v293_player_box(x-6,18,z-step_anim,6,34,57,114);
                vt_v293_player_box(x+6,18,z+step_anim,6,34,57,114);
                vt_v293_player_box(x-6,29,z-step_anim+3,5,57,49,46);
                vt_v293_player_box(x+6,29,z+step_anim+3,5,57,49,46);
                /* Eyes face local minus Z and rotate with the player. */
                vt_v293_player_box(x-4,-35,z-12,2,46,44,40);
