    - name: Godot-Gelaende neu importieren
      shell: bash
      run: |
        set -euo pipefail
        timeout --signal=TERM --kill-after=5s 180s godot --headless --path android --import 2>&1 | tee /tmp/lwod417fix3_import.log
        if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script' /tmp/lwod417fix3_import.log; then exit 1; fi
        echo V417_FIX3_IMPORT_OK
    - name: Staedte, Grenzen, Wege und Kartenbutton testen
      shell: bash
      run: |
        set -euo pipefail
        timeout --signal=TERM --kill-after=5s 125s godot --headless --path android --quit-after 300 --script res://tests/V417WorldSmoke.gd 2>&1 | tee /tmp/lwod417fix3_smoke.log
        if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid call' /tmp/lwod417fix3_smoke.log; then exit 1; fi
        grep -Fq 'V417_FIX3_TERRITORIES_OK:' /tmp/lwod417fix3_smoke.log
        mkdir -p build/diagnose
        cp /tmp/lwod417fix3_smoke.log build/diagnose/V417_FIX3_Gebiete.log
    - name: V41.7 FIX4 Staedte Regionen Vulkan und reale Terrainhoehen testen
      shell: bash
      run: |
        set -euo pipefail
        timeout --signal=TERM --kill-after=5s 120s godot --headless --path android --quit-after 300 --script res://tests/V417Fix4Smoke.gd 2>&1 | tee /tmp/v417_fix4_world.log
        if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid call' /tmp/v417_fix4_world.log; then exit 1; fi
        grep -Fq 'V417_FIX4_WORLD_OK:' /tmp/v417_fix4_world.log
    - name: V41.7 FIX6 Kartenstandorte und Gehwege in der 3D-Welt testen
      shell: bash
      run: |
        set -euo pipefail
        # Godot only returns a success code when 3D cities, 16 actual road routes,
        # borders, map projection, volcano and existing menu integration are coherent.
        timeout --signal=TERM --kill-after=5s 135s \
          godot --headless --path android --quit-after 300 --script res://tests/V417Fix5Smoke.gd \
          2>&1 | tee /tmp/lwod_417_fix5_map.log
        if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Invalid call|Failed to load script' /tmp/lwod_417_fix5_map.log; then
          exit 1
        fi
        grep -Fq 'V417_FIX5_OK:' /tmp/lwod_417_fix5_map.log
        mkdir -p build/diagnose
        cp /tmp/lwod_417_fix5_map.log build/diagnose/V417_FIX5_MAP_TEST.log
    - name: V41.7 FIX7 Bergwand und Gehwege testen
      shell: bash
      run: |
        set -euo pipefail
        timeout --signal=TERM --kill-after=5s 135s godot --headless --path android --quit-after 300 --script res://tests/V417Fix7Smoke.gd 2>&1 | tee /tmp/lwod417fix7_mountain.log
        if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid call' /tmp/lwod417fix7_mountain.log; then exit 1; fi
        grep -Fq 'V417_FIX7_MOUNTAIN_OK:' /tmp/lwod417fix7_mountain.log
        mkdir -p build/diagnose
        cp /tmp/lwod417fix7_mountain.log build/diagnose/V417_FIX7_Bergwand.log
    - name: V41.7 FIX7 Android-APK bauen und pruefen
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p build/android
        APK="$GITHUB_WORKSPACE/build/android/LWOD-Android-V41.7-FIX7.apk"
        timeout --signal=TERM --kill-after=5s 900s godot --headless --path android --export-debug Android "$APK" 2>&1 | tee /tmp/lwod417fix3_export.log
        if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script' /tmp/lwod417fix3_export.log; then exit 1; fi
        test -s "$APK"
        unzip -t "$APK" >/dev/null
        ls -lh "$APK"
    - name: V41.7 FIX7 APK bereitstellen
      uses: actions/upload-artifact@v4
      with:
        name: LWOD_ANDROID_V41_7_FIX7_APK
        path: build/android/LWOD-Android-V41.7-FIX7.apk
        if-no-files-found: error
        retention-days: 14
    - name: V41.7 FIX7 Testprotokoll
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: LWOD_V41_7_FIX7_TESTPROTOKOLLE
        path: build/diagnose
        if-no-files-found: warn
        retention-days: 14
