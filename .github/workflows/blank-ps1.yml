    - name: V41.7 FIX13 Himmelskoerper und Vulkanflaechen korrigieren
      shell: bash
      run: |
        set -euo pipefail
        cat > /tmp/LWOD_FIX13.py <<'PYFIX13'
        from pathlib import Path
        import re
        B = Path('android/scripts')
        def once(s, old, new):
            if s.count(old) != 1:
                raise SystemExit('FIX13: unexpected source: '+old[:160])
            return s.replace(old,new,1)

        def write(p,s):
            p.write_text(s,encoding='utf-8')

        # The V36 celestial meshes were only 2-3 km away, inside today's world.
        # Put them at a fixed angular distance from the actual camera, independent
        # of camera rotation. The existing FIX11 far plane is 35 km. Keep ordinary
        # depth testing: terrain and mountains MUST occlude the disks.
        p=B/'V26SkyWorldMap.gd'
        s=p.read_text(encoding='utf-8')
        s=once(s,'        sun_node.position = Vector3(cos(angle)*3190.0, 154.0 + elevation*2035.0, -198.0)',
               '        _v413_place_sky_body(sun_node, Vector3(cos(angle)*3190.0, 154.0 + elevation*2035.0, -198.0), 264.0)')
        s=once(s,'        moon_node.position = Vector3(cos(moon_angle)*3135.0, 176.0 + sin(moon_angle)*2035.0, 264.0)',
               '        _v413_place_sky_body(moon_node, Vector3(cos(moon_angle)*3135.0, 176.0 + sin(moon_angle)*2035.0, 264.0), 209.0)')
        s=once(s,'func _apply_day_night() -> void:\n','''const V413_CELESTIAL_DISTANCE: float = 32000.0

        func _v413_place_sky_body(body: MeshInstance3D, old_offset: Vector3, old_scale: float) -> void:
            var origin: Vector3 = sky_root.global_position
            var camera: Camera3D = get_viewport().get_camera_3d()
            if is_instance_valid(camera):
                origin = camera.global_position
            # Normalize before scaling: identical east/west direction and angular size.
            var factor: float = V413_CELESTIAL_DISTANCE / old_offset.length()
            body.global_position = origin + old_offset * factor
            body.scale = Vector3.ONE * old_scale * factor
            body.cast_shadow = GeometryInstance3D.SHADOW_CASTING_SETTING_OFF
            # Do not disable depth testing. Only skip optional occlusion culling.
            body.ignore_occlusion_culling = true
            var mat: StandardMaterial3D = body.material_override as StandardMaterial3D
            if mat != null:
                mat.no_depth_test = false

        func _apply_day_night() -> void:
        ''')
        write(p,s)

        # Delete only the obsolete river/bridge/platform group left over from the
        # abandoned Eschefurt meadow design. Real volcanic terrain, lava, and
        # all town/road/map coordinates are deliberately left unchanged.
        p=B/'V417Landmarks.gd'
        s=p.read_text(encoding='utf-8')
        m=re.search(r'(?ms)^    elif id == "Aschefurt":\n(.*?)(?=^    elif id == "Sandhafen":)',s)
        assert m, 'FIX13: volcanic landmark missing'
        block=m.group(0)
        start='        # Keep the old river and bridge at the edge of the volcanic region.\n'
        assert block.count(start)==1, 'FIX13: old river branch missing'
        retained, obsolete=block.split(start,1)
        for needle in ('#4c9eaa','#b6ab96','#9a9386','Vector2(125.0,1680.0)'):
            assert needle in obsolete, 'FIX13: expected obsolete model missing: '+needle
        assert '#b24f31' in retained and 'range(9)' in retained, 'FIX13: volcanic peaks or lava lost'
        s=s[:m.start()]+retained+s[m.end():]
        write(p,s)

        p=Path('android/export_presets.cfg')
        s=p.read_text(encoding='utf-8')
        s,n=re.subn(r'(?m)^version/code=4182$', 'version/code=4183',s,count=1);assert n==1
        s,n=re.subn(r'(?m)^version/name="4\.1\.7\.12"$', 'version/name="4.1.7.13"',s,count=1);assert n==1
        write(p,s)
        print('FIX13_INSTALL_OK: far celestial bodies with depth test; obsolete Aschefurt river, bridge and platform removed; volcano and map retained')
