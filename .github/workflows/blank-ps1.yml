      - {name: Basis 53, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 53'}
      - {name: Basis 54, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 54'}

      - name: FIX33 Modelle laden
        run: python3 "$RUNNER_TEMP/fix37_step.py" 'FIX33 Geometrie verbessern'

      - name: FIX33 Grafik pruefen
        run: python3 "$RUNNER_TEMP/fix37_step.py" 'FIX33 pruefen'

      - name: Display-Aufloesung verifizieren
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_DISPLAY'
          from pathlib import Path
          import re,os
          source=Path(os.environ['PROJECT_DIR'])/'src/main.c'
          s=source.read_text(encoding='utf-8')
          assert re.search(r'(?m)^\s*#\s*define\s+SCREEN_W\s+320\b',s), 'SCREEN_W ist nicht 320'
          assert re.search(r'(?m)^\s*#\s*define\s+SCREEN_H\s+240\b',s), 'SCREEN_H ist nicht 240'
          assert 'LWOD_FIX33_GEOMETRY' in s, 'FIX33 Modelle fehlen'
          print('320x240 aktiv, FIX33 Modelle erhalten.')
          PY_DISPLAY

      - name: PS1 SDK installieren
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/lwod_run.py" 55
          grep -q '^PSN00BSDK_CMAKE=' "$GITHUB_ENV"

      - name: PS1 kompilieren
        shell: bash
        run: |
          set -euo pipefail
          : "${PSN00BSDK_CMAKE:?PS1 SDK nicht geladen}"
          test -f "$PSN00BSDK_CMAKE"
          python3 "$RUNNER_TEMP/lwod_run.py" 56

      - name: Fehlerprotokoll sichern
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: LWOD_FIX37_FEHLER
          path: |
            artifacts/FIX25_BUILD_LOG.txt
            artifacts/FIX25_ERSTE_FEHLER.txt
          if-no-files-found: warn

      - name: PS1 Disc bauen
        shell: bash
        run: |
          set -euo pipefail
          for idx in 58 59 60 61; do
            python3 "$RUNNER_TEMP/lwod_run.py" "$idx"
          done
          folder="$RUNNER_TEMP/lydra_ps1_spiel"
          test -s "$folder/LWOD_FIX32.bin"
          test -s "$folder/LWOD_FIX32.cue"
          mv "$folder/LWOD_FIX32.bin" "$folder/LWOD_FIX37.bin"
          sed 's/LWOD_FIX32[.]bin/LWOD_FIX37.bin/g' "$folder/LWOD_FIX32.cue" > "$folder/LWOD_FIX37.cue"
          rm "$folder/LWOD_FIX32.cue"
          grep -qi 'LWOD_FIX37.bin' "$folder/LWOD_FIX37.cue"

      - name: PS1 Spiel herunterladen
        uses: actions/upload-artifact@v4
        with:
          name: LWOD_FIX37_STABIL
          path: ${{ runner.temp }}/lydra_ps1_spiel/
          if-no-files-found: error
          retention-days: 14
