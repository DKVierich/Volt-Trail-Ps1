          for m in ('LWOD_FIX32_MESH','LWOD_FIX33_GEOMETRY','FIX33: beam work, deep windows',
                    'vt_v281_resolve_movement();','vt_save_game(void)','vt_load_game(void)',
                    'LYDRA_FIX12_GLOBAL_PERCENT 75','vt_v282_draw_house_npcs(x,z)'):
              assert m in s, 'FIX33: missing '+m
          assert s.count('FIX33: beam work, deep windows')==1
          assert Path('artifacts/LWOD_FIX33_GRAFIK.txt').stat().st_size>100
          print('FIX33 renderer, gameplay guards and diagnosis passed')
          LWOD_FIX33_VERIFY

      - name: PS1-Aufloesung 640 oder 320 einstellen
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          mode=os.environ.get('LWOD_VIDEO_WIDTH','640')
          if mode not in ('320','640'): raise SystemExit('Ungueltige Breite: '+mode)
          file=Path(os.environ['PROJECT_DIR'])/'src/main.c'
          source=file.read_text(encoding='utf8')
          if mode=='640':
              source,n=re.subn(r'(?m)^(\s*#\s*define\s+SCREEN_W\s+)320(?=\s|$)',
                               r'\g<1>640',source)
              if n!=1: raise SystemExit('SCREEN_W 320 nicht eindeutig: '+str(n))
              if not re.search(r'(?m)^\s*#\s*define\s+SCREEN_H\s+240\b',source):
                  raise SystemExit('SCREEN_H ist nicht 240')
              for kind in ('Disp','Draw'):
                  ident='disp' if kind=='Disp' else 'draw'
                  for i in (0,1):
                      rx=r'\bSetDef%sEnv\s*\(\s*&\s*%s\s*\[\s*%s\s*\]\s*,[^;]*?\)\s*;'%(kind,ident,i)
                      y=i*240 if kind=='Disp' else (1-i)*240
                      replacement='SetDef%sEnv(&%s[%d], 0, %d, SCREEN_W, SCREEN_H);'%(kind,ident,i,y)
                      source,n=re.subn(rx,replacement,source,flags=re.S)
                      if n!=1: raise SystemExit('Frame-Umstellung nicht eindeutig: '+replacement)
              def widen(m): return m.group(1)+str(int(m.group(2))*2)+m.group(3)
              source,n=re.subn(r'(\bgte_SetGeomScreen\s*\(\s*)(\d+)(\s*\))',widen,source)
              if n<1: raise SystemExit('GTE Projektion nicht gefunden')
              source,n=re.subn(r'\bgte_SetGeomOffset\s*\(\s*160\s*,\s*120\s*\)',
                               'gte_SetGeomOffset(320, 120)',source)
              if n==0 and not re.search(r'gte_SetGeomOffset\s*\([^;]*SCREEN_W',source):
                  raise SystemExit('GTE Bildmitte nicht erkannt')
              file.write_text(source,encoding='utf8')
          print('LWOD PS1 Modus:',mode+'x240')
          PY

      - name: PS1 kompilieren
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/lwod_run.py" 55
          python3 "$RUNNER_TEMP/lwod_run.py" 56

      - name: Compilerfehler sichern
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: LWOD-FIX35R-FEHLER
          path: |
            artifacts/FIX25_BUILD_LOG.txt
            artifacts/FIX25_ERSTE_FEHLER.txt
          if-no-files-found: warn

      - name: PS1 Disc fertigstellen
        shell: bash
        run: |
          set -euo pipefail
          for i in 58 59 60 61; do
            python3 "$RUNNER_TEMP/lwod_run.py" "$i"
          done
          folder="$RUNNER_TEMP/lydra_ps1_spiel"
          test -s "$folder/LWOD_FIX32.bin"
          test -s "$folder/LWOD_FIX32.cue"
          mv "$folder/LWOD_FIX32.bin" "$folder/LWOD_FIX35R.bin"
          sed 's/LWOD_FIX32[.]bin/LWOD_FIX35R.bin/g' "$folder/LWOD_FIX32.cue" > "$folder/LWOD_FIX35R.cue"
          rm "$folder/LWOD_FIX32.cue"
          grep -qi 'LWOD_FIX35R.bin' "$folder/LWOD_FIX35R.cue"

      - name: BIN und CUE herunterladen
        uses: actions/upload-artifact@v4
        with:
          name: LWOD_FIX35R_HD
          path: ${{ runner.temp }}/lydra_ps1_spiel/
          if-no-files-found: error
          retention-days: 14
