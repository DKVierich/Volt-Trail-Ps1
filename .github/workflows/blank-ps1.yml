                vt_v3188_tile(x,y,letter_runs[k][2],1,198+pulse/2,221+pulse/3,255);
            }
        }
        ''' % (array, x0-23, x0+width+5, x0-26, x0+width+24, x0, y0)

        s = s[:a] + new_function + s[b:]

