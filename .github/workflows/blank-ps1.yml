          grep -Fq 'lwod_v4095_unique_phoenix' android/scripts/V4094HeroPhoenix.gd
          echo 'NEUE_MODELLE_OK'

      - name: GDScript-Syntax vorab pruefen
        shell: bash
        run: |
          set -euo pipefail
          cat > android/tests/V4095ParseSmoke.gd <<'GD_PARSE'
          extends SceneTree
          func _initialize() -> void:
              var source: Script = load("res://scripts/V4094HeroPhoenix.gd") as Script
              if source == null or not source.can_instantiate():
                  push_error("V4095_PARSE_ERROR")
                  quit(1)
                  return
              print("V4095_PARSE_OK")
              quit(0)
          GD_PARSE
          timeout --signal=TERM --kill-after=5s 60s             godot --headless --path android --quit-after 120 --script res://tests/V4095ParseSmoke.gd             2>&1 | tee /tmp/lwod_parser.log
          if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script' /tmp/lwod_parser.log; then
            echo 'FEHLER: Syntaxpruefung fehlgeschlagen'
            exit 1
          fi
          grep -Fq 'V4095_PARSE_OK' /tmp/lwod_parser.log
          echo 'GDSCRIPT_OK'

      - name: Neue Spielfigur und Phoenix testen
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 100s \
            godot --headless --path android --quit-after 300 --script res://tests/V4094VisualSmoke.gd \
            2>&1 | tee /tmp/lwod_visual.log
          if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Invalid call|Failed to load script' /tmp/lwod_visual.log; then
            echo 'FEHLER: Laufzeitfehler im Figurenmodell'
            exit 1
          fi
          grep -Fq 'V4094_VISUAL_OK:' /tmp/lwod_visual.log
          echo 'FIGUREN_OK'

      - name: NPCs und Markt-Kollisionen testen
        shell: bash
        run: |
          set -euo pipefail
          for script in V4093CharacterSmoke.gd V4092Fix5MotionMarketSmoke.gd; do
            timeout --signal=TERM --kill-after=5s 100s \
              godot --headless --path android --quit-after 300 --script "res://tests/$script" \
              2>&1 | tee "/tmp/$script.log"
            if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Invalid call|Failed to load script' "/tmp/$script.log"; then
              exit 1
            fi
          done
          echo 'NPC_TESTS_OK'

      - name: APK bauen und validieren
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android
          APK="$GITHUB_WORKSPACE/build/android/LWOD-Android-V40.9.5.apk"
          timeout --signal=TERM --kill-after=5s 900s \
            godot --headless --path android --export-debug Android "$APK"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          ls -lh "$APK"

      - name: Fertige APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: LWOD_ANDROID_V40_9_5_APK
          path: build/android/LWOD-Android-V40.9.5.apk
          if-no-files-found: error
          retention-days: 14
