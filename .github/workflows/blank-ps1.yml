            vt_v3188_tile(%d,183,2,3,102,204,246);
            vt_v3188_tile(%d,183,2,3,102,204,246);
            for(k = 0; k < (int)(sizeof(letter_runs)/sizeof(letter_runs[0])); k++) {
                x = %d + (int)letter_runs[k][0];
