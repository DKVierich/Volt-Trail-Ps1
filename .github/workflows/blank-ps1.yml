          switch_code = r'''static int vt_v21_switch_to(int position) {
              int old_species;
              int new_species;
              int i;

              vt_v21_setup();
              if (!vt_v21_can_switch_to(position)) return 0;

              old_species = vt_v21_party[vt_v21_active];
              if (old_species >= 0 && old_species < 5) {
                  if (companion_hp < 0) companion_hp = 0;
                  if (companion_hp > 24) companion_hp = 24;
                  vt_v21_hp[old_species] = companion_hp;
              }

              new_species = vt_v21_party[position];

              /* Bring the chosen dragon to slot 1; retain all other team members. */
              for (i = position; i > 0; i--)
                  vt_v21_party[i] = vt_v21_party[i - 1];
              vt_v21_party[0] = new_species;

