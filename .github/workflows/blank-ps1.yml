          source.write_text(code,encoding='utf-8')
          print('LYDRA V29: sunny green terrain, river glints, blue peaks, wildflowers, paths')
          print('V28.2 indoor/outdoor NPCs, doorway collisions and per-house roofs preserved')
          print('Low polygon count, original PS1 save data/capture/combat untouched')
