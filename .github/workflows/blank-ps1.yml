        if old.count('target=forward*14336;')!=1:
            raise RuntimeError('Expected currently deployed V31.9.1 movement (V31.7.2 velocity anchor)')
        if old.count('turn*64+')!=1:
            raise RuntimeError('Expected currently deployed V31.9.1 camera turn anchor')

        new=r'''
        /* V31.9.2: movement and camera use elapsed video refreshes, not rendered frames.
           This reduces tempo changes when expensive world frames miss a VBlank.
           Keep UP/DOWN move only, LEFT/RIGHT turn camera only; never add turn drift. */
        static void vt_v293_move(unsigned int pad) {
            static int frac_x=0,frac_z=0;
            static int last_x=0,last_z=0,started=0;
            static int speed_q10=0;
            static int turn_q8=0,turn_fraction_q8=0;
            static unsigned int previous_vblank=0;
            unsigned int now=(unsigned int)VSync(-1);
            unsigned int elapsed;
            int dt=1,forward=0,turn=0,target,dx=0,dz=0;
            int vx,vz,desired_turn,delta,inc;

            /* Do not integrate a long delay after pause, transitions or memory-card I/O.
               A 2-vblank cap avoids large collision-penetrating movement jumps. */
            if(previous_vblank) {
                elapsed=now-previous_vblank;
                if(elapsed>=2u && elapsed<=5u)dt=2;
            }
            previous_vblank=now;

            /* Only a real teleport should reset subpixel motion and acceleration. */
            if(!started || px-last_x>80 || px-last_x< -80 ||
               pz-last_z>80 || pz-last_z< -80) {
                frac_x=frac_z=0;
                speed_q10=0;
                turn_q8=turn_fraction_q8=0;
                started=1;
            }

            if((pad&PAD_RIGHT) && !(pad&PAD_LEFT))turn=-1;
            else if((pad&PAD_LEFT) && !(pad&PAD_RIGHT))turn=1;
            if(turn) {
                /* Q8 fractional angular velocity, eased without momentum on release.
                   36 angle units / vblank versus the old abrupt 64 per game frame. */
                desired_turn=turn*36*256;
                delta=desired_turn-turn_q8;
                turn_q8+=(delta*dt)/3;
                turn_fraction_q8+=turn_q8*dt;
                inc=turn_fraction_q8/256;
                turn_fraction_q8-=inc*256;
                vt_v292_cam_yaw=(vt_v292_cam_yaw+inc+4096)&4095;
            } else {
                turn_q8=0;
                turn_fraction_q8=0;
            }
            vt_v292_yaw_target=vt_v292_cam_yaw;

            if((pad&PAD_UP) && !(pad&PAD_DOWN))forward=1;
            else if((pad&PAD_DOWN) && !(pad&PAD_UP))forward=-1;
            if(!forward) {
                speed_q10=0;
                frac_x=frac_z=0;
