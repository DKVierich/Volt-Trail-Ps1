
name: Build Lydra World Of Dragon V27

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build unzip curl \
            ffmpeg python3-pil python3-yaml

      - name: Load stable V26
        shell: bash
        run: |
          set -euo pipefail

          BASE="351e48f77530f79b09e0e76c4cfe71e8b71e4504"

          curl -fLsS --retry 4 \
            "https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/$BASE/.github/workflows/blank-ps1.yml" \
            -o "$RUNNER_TEMP/v26.yml"

          cat > "$RUNNER_TEMP/v26_step.py" <<'PY'
          import os
          import sys
          import subprocess
          from pathlib import Path
          import yaml

          path = Path(os.environ["RUNNER_TEMP"]) / "v26.yml"
          data = yaml.safe_load(path.read_text(encoding="utf-8"))
          steps = data["jobs"]["build"]["steps"]

          wanted = sys.argv[1]
          matches = [
              step for step in steps
              if step.get("name") == wanted
          ]

          if len(matches) != 1:
              raise RuntimeError("V26 step missing: " + wanted)

          print("Running:", wanted, flush=True)

          subprocess.run(
              ["bash", "-euo", "pipefail", "-c", matches[0]["run"]],
              env=os.environ.copy(),
              check=True
          )
          PY

          python3 "$RUNNER_TEMP/v26_step.py" \
            "Load stable V25"

      - name: Prepare game
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/v26_step.py" \
            "Prepare game"

      - name: Restore gameplay
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/v26_step.py" \
            "Restore original gameplay"

      - name: Restore Lydra V25
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/v26_step.py" \
            "Restore Lydra V25"

      - name: Restore stable V26 models
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/v26_step.py" \
            "Improve V26 dragon and world models"

      - name: Add V27 animations and graphics
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["PROJECT_DIR"]) / "src/main.c"
          code = path.read_text(encoding="utf-8")

          def enhance(name, detail):
              global code

              pattern = (
                  r"\bstatic\s+void\s+"
                  + re.escape(name)
                  + r"\s*\([^;]*?\)\s*\{"
              )

              matches = list(re.finditer(pattern, code, re.S))

              if len(matches) != 1:
                  raise RuntimeError(
                      "V27 model missing: " + name
                  )

              pos = matches[0].end()
              depth = 1

              while pos < len(code) and depth:
                  if code[pos] == "{":
                      depth += 1
                  elif code[pos] == "}":
                      depth -= 1
                  pos += 1

              if depth:
                  raise RuntimeError(
                      "Unclosed function: " + name
                  )

              pos -= 1
              code = (
                  code[:pos]
                  + "\n"
                  + detail
                  + "\n"
                  + code[pos:]
              )

          # Better animated player.
          enhance("vt_player", r'''
              /* V27: adventurer clothing and movement. */
              draw_box(
                  x, 17, z + 11,
                  10, 114, 77, 46
              );

              /* Backpack buckle. */
              draw_box(
                  x, 13, z + 20,
                  3, 208, 177, 94
              );

              /* Belt. */
              draw_box(
                  x, 27, z - 3,
                  10, 65, 50, 46
              );

              /* Moving scarf. */
              draw_box(
                  x + 12,
                  9 + stride / 2,
                  z + 4,
                  5, 211, 65, 58
              );

              /* Face and hair accents. */
              draw_box(
                  x - 4, 1, z - 10,
                  2, 54, 42, 39
              );

              draw_box(
                  x + 4, 1, z - 10,
                  2, 54, 42, 39
              );
          ''')

          # Sparkit and Voltigon animation.
          enhance("vt_sparkit", r'''
              /* V27: animated outer wing tips. */
              vt_dragon_wing(
                  x, z, -1, grown ? 53 : 45,
                  flap ? 13 : -5,
                  r * 3 / 4,
                  g * 3 / 4,
                  b * 3 / 4
              );

              vt_dragon_wing(
                  x, z, 1, grown ? 53 : 45,
                  flap ? -5 : 13,
                  r * 3 / 4,
                  g * 3 / 4,
                  b * 3 / 4
              );

              /* Animated tail detail. */
              vt_pyramid(
                  x + 23,
                  10 - bounce,
                  z + 37,
                  5, 13,
                  250, 214, 91
              );
          ''')

          # More pronounced wings for wild dragons.
          enhance("vt_v19_wild_dragon", r'''
              /* V27: animated outer wing membranes. */
              vt_dragon_wing(
                  x, z, -1, 51,
                  flap ? 16 : -6,
                  r * 2 / 3,
                  g * 2 / 3,
                  b * 2 / 3
              );

              vt_dragon_wing(
                  x, z, 1, 51,
                  flap ? -6 : 16,
                  r * 2 / 3,
                  g * 2 / 3,
                  b * 2 / 3
              );

              /* Additional back scales. */
              vt_pyramid(
                  x, -11, z + 11,
                  5, 15,
                  r, g, b
              );
          ''')

          # More depth in forests.
          enhance("vt_v24_tree", r'''
              /* V27: highlighted foliage. */
              vt_pyramid(
                  x + 7,
                  -34,
                  z - 5,
                  8 + scale / 5,
                  19 + scale / 3,
                  rr + 15,
                  gg + 14,
                  bb + 12
              );
          ''')

          # Roofs and entrances.
          enhance("vt_v24_house", r'''
              /* V27: entrance step. */
              draw_box(
                  x, 40, z - 31,
                  11, 131, 116, 98
              );

              /* Roof accent. */
              vt_pyramid(
                  x - 16,
                  -22,
                  z + 11,
                  5, 12,
                  roof_r,
                  roof_g,
                  roof_b
              );
          ''')

          required = [
              "LYDRA WORLD OF DRAGON",
              "V27: adventurer clothing",
              "V27: animated outer wing tips",
              "V27: highlighted foliage",
              "lydra_v25_nature();",
              "vt_v24_draw_overworld();",
              "vt_v23_field_dragon();",
              "vt_v18_battle_bars();",
              "vt_save_game(void)",
              "vt_load_game(void)",
              "vt_play_intro();"
          ]

          for marker in required:
              if marker not in code:
                  raise RuntimeError(
                      "Missing feature: " + marker
                  )

          path.write_text(code, encoding="utf-8")
          print("LYDRA WORLD OF DRAGON V27")
          print("Player animation improved")
          print("Dragon wings improved")
          print("World models improved")
          print("Original gameplay retained")
          PY

      - name: Install PSn00bSDK
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/v26_step.py" \
            "Install PSn00bSDK"

      - name: Build Lydra V27
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/v26_step.py" \
            "Build Lydra V26"

      - name: Collect game files
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/v26_step.py" \
            "Collect PS1 game files"

      - name: Upload Lydra V27
        uses: actions/upload-artifact@v4
        with:
          name: Lydra-World-Of-Dragon-PS1-V27
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
