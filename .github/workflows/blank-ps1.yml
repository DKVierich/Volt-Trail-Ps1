        2>&1 | tee build/diagnose/FIX54_Ruine.log

        if grep -Eiq ''SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid call|FIX54: '' build/diagnose/FIX54_Ruine.log;
        then exit 1; fi

        grep -Fq ''FIX54_RUINE_OK:'' build/diagnose/FIX54_Ruine.log

        '
