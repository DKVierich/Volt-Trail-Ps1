    - name: Godot Ressourcen importieren
      shell: bash
      run: 'set -euo pipefail

        godot --headless --path android --editor --import --quit

        test -s android/scripts/V24Regions.gd

        test -s android/scripts/V25BiomeWorld.gd

        test -s android/scripts/V26SkyWorldMap.gd

        test -s android/scripts/V27Terrain.gd

        test -s android/scripts/V27WorldMap.gd

        test -s android/scripts/V27CameraMap.gd

        test -s android/scripts/V28DualStick.gd

        test -s android/scripts/V29IndependentSticks.gd

        test -s android/scripts/V30MovementRepair.gd

        test -s android/scripts/V31TerrainMotion.gd

        test -s android/scripts/V32TouchRouter.gd

        test -s android/scripts/V33TouchCamera.gd

        '
    - name: Godot Start und Scriptfehler testen
      shell: bash
      run: "set -euo pipefail\ngodot --headless --path android --quit-after 8 > \"$RUNNER_TEMP/lwod_v29_run.log\"\
        \ 2>&1 || {\n  cat \"$RUNNER_TEMP/lwod_v29_run.log\"\n  exit 1\n}\ncat \"$RUNNER_TEMP/lwod_v29_run.log\"\
        \nif grep -Eq 'SCRIPT ERROR:|Parse Error:|Invalid call\\.|Failed to load script' \"$RUNNER_TEMP/lwod_v29_run.log\"\
        ; then\n  echo '::error::V31 Godot-Skriptfehler gefunden'\n  exit 1\nfi\n"
    - name: V31 Terrainphysik vorhanden
      shell: bash
      run: 'set -euo pipefail

        test -s android/scripts/V31TerrainMotion.gd

        grep -Fq ''align_to_ground'' android/scripts/Main.gd

        test -s android/scripts/V32TouchRouter.gd

        echo ''V31 terrain verified; V32 exclusive touch test follows''

        '
    - name: V34 Echtes Links-Bewegen Rechts-Kamera Multitouch Test
      shell: bash
      run: "set -euo pipefail\ngodot --headless --path android --script res://tests/V34TouchSmoke.gd > \"$RUNNER_TEMP/lwod_v34_touch.log\"\
        \ 2>&1 || {\n  cat \"$RUNNER_TEMP/lwod_v34_touch.log\"\n  exit 1\n}\ncat \"$RUNNER_TEMP/lwod_v34_touch.log\"\
        \ngrep -Fq 'V34_TEST_OK:' \"$RUNNER_TEMP/lwod_v34_touch.log\""
    - name: LWOD Android V34 APK erstellen
      shell: bash
      run: "set -euo pipefail\nmkdir -p build/android\ngodot --headless --path android --export-debug 'Android'\
        \ \\\n  \"$GITHUB_WORKSPACE/build/android/LWOD-Android-V34-LINKS-FIGUR-RECHTS-KAMERA.apk\"\ntest -s build/android/LWOD-Android-V34-LINKS-FIGUR-RECHTS-KAMERA.apk\n\
        unzip -t build/android/LWOD-Android-V34-LINKS-FIGUR-RECHTS-KAMERA.apk > /dev/null\n\necho \"APK wurde erzeugt:\"\
        \nls -lh build/android/LWOD-Android-V34-LINKS-FIGUR-RECHTS-KAMERA.apk\n"
    - name: Fehlerdiagnose bereitstellen
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: LWOD_V34_DIAGNOSE
        path: '${{ runner.temp }}/lwod_v29_run.log

          android/scripts/V24Regions.gd

          android/scripts/V27Terrain.gd

          android/scripts/V27CameraMap.gd

          android/scripts/V27WorldMap.gd

          android/scripts/V28DualStick.gd

          android/scripts/V29IndependentSticks.gd

          android/scripts/Main.gd

          android/scripts/V30MovementRepair.gd

          android/scripts/V31TerrainMotion.gd

          android/scripts/V32TouchRouter.gd

          android/tests/V32TouchSmoke.gd

          android/tests/V33TouchSmoke.gd

          android/scripts/V33TouchCamera.gd

          ${{ runner.temp }}/lwod_v33_touch.log

          ${{ runner.temp }}/lwod_v30_movement_test.log

          android/scripts/TouchOverlay.gd


          ${{ runner.temp }}/lwod_v34_touch.log

          android/tests/V34TouchSmoke.gd'
        if-no-files-found: warn
        retention-days: 14
    - name: Android V34 APK hochladen
      uses: actions/upload-artifact@v4
      with:
        name: LWOD_ANDROID_V34_APK
        path: build/android/LWOD-Android-V34-LINKS-FIGUR-RECHTS-KAMERA.apk
        if-no-files-found: error
        retention-days: 14
