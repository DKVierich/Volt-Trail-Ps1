
# LWOD Android V5 - ETC2/ASTC ohne Python
name: LWOD Android V5 APK Build Fix

'on':
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/lwod-android.yml'
      - '.github/workflows/blank-ps1.yml'

permissions:
  contents: read

jobs:
  android:
    name: Android Test-APK mit Godot 4.7.2
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: barichello/godot-ci:4.7.2
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: /usr/lib/android-sdk

    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Godot-Vorlagen und SDK freigeben
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          mkdir -p "$HOME/.local/share/godot/export_templates"

          cp -a /root/.config/godot/. \
            "$HOME/.config/godot/"

          cp -a /root/.local/share/godot/export_templates/. \
            "$HOME/.local/share/godot/export_templates/"

          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_release.apk"
          test -x "$JAVA_HOME/bin/java"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -s /root/debug.keystore

          grep -q 'export/android/java_sdk_path' \
            "$HOME/.config/godot/editor_settings-4.7.tres"

          grep -q 'export/android/android_sdk_path' \
            "$HOME/.config/godot/editor_settings-4.7.tres"

      - name: Android-SDK 35 bereitstellen
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --sdk_root="$ANDROID_HOME" \
            'platforms;android-35' 'build-tools;35.0.1'

          test -d "$ANDROID_HOME/platforms/android-35"
          test -x "$ANDROID_HOME/build-tools/35.0.1/aapt2"

      - name: Android-Spielwelt V1 vorbereiten
        shell: bash
        run: |
          set -euo pipefail

          wget -q --tries=3 --timeout=30 \
            -O "$RUNNER_TEMP/lwod_android_v1.yml" \
            'https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/d57c0d3d3fa45d6ccf508e0918414c80862d2362/.github/workflows/blank-ps1.yml'

          test -s "$RUNNER_TEMP/lwod_android_v1.yml"

          test "$(git hash-object "$RUNNER_TEMP/lwod_android_v1.yml")" = \
            '639c4582341edf0c3685aa348f2e9497443746fa'

          awk '
            /^      - name: Godot-Projekt und 3D-Welt erstellen$/ {
              phase=1
              next
            }
            phase==1 && /^        run: \|$/ {
              phase=2
              next
            }
            phase==2 && /^      - name: Godot-Projekt importieren$/ {
              exit
            }
            phase==2 && /^          / {
              sub(/^          /, "")
              print
              next
            }
            phase==2 && /^$/ {
              print
              next
            }
          ' "$RUNNER_TEMP/lwod_android_v1.yml" \
            > "$RUNNER_TEMP/create_game.sh"

          test -s "$RUNNER_TEMP/create_game.sh"

          grep -q 'android/scripts/Main.gd' \
            "$RUNNER_TEMP/create_game.sh"

          bash -n "$RUNNER_TEMP/create_game.sh"
          bash "$RUNNER_TEMP/create_game.sh"

          test -s android/project.godot
          test -s android/scripts/Main.gd
          test -s android/export_presets.cfg

      - name: ETC2 ASTC ohne Python aktivieren
        shell: bash
        run: |
          set -euo pipefail

          file="android/project.godot"
          test -s "$file"

          test "$(grep -c '^\[rendering\]$' "$file")" -eq 1

          if grep -q '^textures/vram_compression/import_etc2_astc=' "$file"; then
            sed -i 's@^textures/vram_compression/import_etc2_astc=.*@textures/vram_compression/import_etc2_astc=true@' "$file"
          else
            sed -i '/^\[rendering\]$/a textures/vram_compression/import_etc2_astc=true' "$file"
          fi

          grep -qx 'textures/vram_compression/import_etc2_astc=true' "$file"

          echo "ETC2/ASTC erfolgreich aktiviert"

      - name: Godot-Projekt importieren
        shell: bash
        run: |
          set -euo pipefail

          godot --headless --path android \
            --editor --import --quit

      - name: Android APK erstellen
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/android

          godot --headless --path android \
            --export-debug Android \
            "$GITHUB_WORKSPACE/build/android/LWOD-Android-V5-Test.apk"

          test -s build/android/LWOD-Android-V5-Test.apk

          unzip -t \
            build/android/LWOD-Android-V5-Test.apk \
            >/dev/null

          echo "Android APK erfolgreich erstellt"

      - name: APK herunterladen
        uses: actions/upload-artifact@v4
        with:
          name: LWOD_ANDROID_V5_APK
          path: build/android/LWOD-Android-V5-Test.apk
          if-no-files-found: error
          retention-days: 14
