        cat > "$RUNNER_TEMP/lydra_v311_apply.py" <<'LYDRA_V311_PATCH'
        #!/usr/bin/env python3
        """Patch final V31 source: fixed-point movement, interpolated 64-entry trig and lighter terrain."""
        import os,re
        from pathlib import Path
        p=Path(os.environ['PROJECT_DIR'])/'src/main.c'
        s=p.read_text(encoding='utf-8')

        def span(name):
            pattern=r'\bstatic\s+(?:void|int)\s+'+re.escape(name)+r'\s*\([^;]*?\)\s*\{'
            matches=list(re.finditer(pattern,s,re.S))
            if len(matches)!=1: raise RuntimeError(f'V31.1: expected one {name}, got {len(matches)}')
            a=matches[0].start();i=matches[0].end();depth=1; state='code'
            while i<len(s) and depth:
                c=s[i];n=s[i+1] if i+1<len(s) else ''
                if state=='code':
                    if c=='/' and n=='/':state='line';i+=1
                    elif c=='/' and n=='*':state='block';i+=1
                    elif c=='"':state='string'
                    elif c=="'":state='char'
                    elif c=='{':depth+=1
                    elif c=='}':depth-=1
                elif state=='line':
                    if c=='\n':state='code'
                elif state=='block':
                    if c=='*' and n=='/':state='code';i+=1
                else:
                    if c=='\\':i+=1
                    elif (state=='string' and c=='"') or (state=='char' and c=="'"):state='code'
                i+=1
            if depth: raise RuntimeError('V31.1: unclosed '+name)
            return a,i

        def replace_func(name,code):
            global s
            a,b=span(name)
            s=s[:a]+code.strip()+'\n'+s[b:]

        # Interpolate between LUT entries. Original function jumped in 64-angle increments.
        replace_func('vt_v293_sin',r'''
        static int vt_v293_sin(int angle) {
            unsigned int a=(unsigned int)angle&4095u;
            int i=(int)(a>>6);
            int f=(int)(a&63u);
            int v0=vt_v293_sin_table[i];
            int v1=vt_v293_sin_table[(i+1)&63];
            return v0+((v1-v0)*f)/64;
        }
        ''')

        # Sub-unit velocity accumulator: x/z no longer jump differently at diagonal angles.
        replace_func('vt_v293_move',r'''
        /* V31.1: smooth and collision-aware fixed-point PS1 movement. */
        static void vt_v293_move(unsigned int pad) {
            static int remainder_x=0, remainder_z=0;
            static int previous_x=0, previous_z=0;
            static int initialized=0;
            int direction=0,dx=0,dz=0;
            int vx,vz;

            /* Other mechanics can reposition the player (doors, transitions, collisions).
               Reset fractions after such corrections, without changing save data. */
            if(!initialized || px!=previous_x || pz!=previous_z) {
                remainder_x=0; remainder_z=0; initialized=1;
            }

            /* D-Pad horizontal controls turn the view ONLY, in smaller, even steps.
               24/4096 of a revolution instead of 64/4096 per update. */
            if((pad & PAD_RIGHT) && !(pad & PAD_LEFT))
                vt_v292_cam_yaw=(vt_v292_cam_yaw+4096-24)&4095;
            else if((pad & PAD_LEFT) && !(pad & PAD_RIGHT))
                vt_v292_cam_yaw=(vt_v292_cam_yaw+24)&4095;
            vt_v292_yaw_target=vt_v292_cam_yaw;

            if((pad & PAD_UP) && !(pad & PAD_DOWN))direction=1;
            else if((pad & PAD_DOWN) && !(pad & PAD_UP))direction=-1;

            if(direction) {
                /* Speed: four world units per logic tick, exact independent of angle. */
                vx=direction*(-vt_v293_sin(vt_v292_cam_yaw)*4);
                vz=direction*( vt_v293_cos(vt_v292_cam_yaw)*4);
                remainder_x+=vx;
                remainder_z+=vz;
                dx=remainder_x/1024;
                dz=remainder_z/1024;
                remainder_x-=dx*1024;
                remainder_z-=dz*1024;
                px+=dx;
                pz+=dz;
                if(px < -WORLD_LIMIT) {px=-WORLD_LIMIT;remainder_x=0;}
                if(px > WORLD_LIMIT)  {px= WORLD_LIMIT;remainder_x=0;}
                if(pz < -WORLD_LIMIT) {pz=-WORLD_LIMIT;remainder_z=0;}
                if(pz > WORLD_LIMIT)  {pz= WORLD_LIMIT;remainder_z=0;}
                if(dx||dz)step_count++;
                vt_v293_avatar_yaw=((direction>0?2048:0)-vt_v292_cam_yaw+4096)&4095;
                if(dx>0 && dx>= (dz<0?-dz:dz))facing=2;
                else if(dx<0 && -dx>= (dz<0?-dz:dz))facing=1;
                else facing=(dz>=0)?3:0;
            } else {
                /* Avoid carrying fractions between separate walking bouts. */
                remainder_x=0;
                remainder_z=0;
            }
            previous_x=px;
            previous_z=pz;
        }
        ''')

        # Reduce frame load while keeping a larger ground radius; shorter cells create more triangles.
        a,b=span('vt_v300_extend_ground')
        old=s[a:b]
        if 'near_step=120, near_cells=20' not in old:
            raise RuntimeError('V31.1: V31 terrain layout not found')
        new=old.replace('near_step=120, near_cells=20','near_step=140, near_cells=18')
        s=s[:a]+new+s[b:]

        # Smooth cosmetic animation instead of jumping every 4 or 9 ticks.
        if s.count('int step_anim=(step_count&7)<4?3:-3;')!=1:
            raise RuntimeError('V31.1: player animation anchor changed')
        s=s.replace('int step_anim=(step_count&7)<4?3:-3;',
                    'int step_anim=(vt_v293_sin((step_count&31)*128)*4)/1024;',1)
        if s.count('int flap=((vt_v18_tick/9)&1)?-8:6;')!=1:
            raise RuntimeError('V31.1: dragon animation anchor changed')
        s=s.replace('int flap=((vt_v18_tick/9)&1)?-8:6;',
                    'int flap=(vt_v293_sin((vt_v18_tick*48)&4095)*8)/1024;',1)

        for feat in ('vt_v281_resolve_movement();','vt_v282_draw_house_npcs(',
                     'vt_opt_draw_page();','vt_save_game(void)','vt_load_game(void)',
