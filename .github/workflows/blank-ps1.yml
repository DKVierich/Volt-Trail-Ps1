
name: Build Lydra World Of Dragon V25 Grafik Fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build unzip curl \
            ffmpeg python3-pil python3-yaml

      - name: Load working V24.3 instructions
        shell: bash
        run: |
          set -euo pipefail

          BASE_COMMIT="7886e325c196b8d43576e12f6916831de73be704"

          curl --fail --location --retry 4 \
            "https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/$BASE_COMMIT/.github/workflows/blank-ps1.yml" \
            -o "$RUNNER_TEMP/lydra-base.yml"

          cat > "$RUNNER_TEMP/run_base.py" <<'PY'
          import os
          import sys
          import subprocess
          from pathlib import Path
          import yaml

          path = (
              Path(os.environ["RUNNER_TEMP"])
              / "lydra-base.yml"
          )

          data = yaml.safe_load(
              path.read_text(encoding="utf-8")
          )

          steps = data["jobs"]["build"]["steps"]
          wanted = sys.argv[1]

          matches = [
              step for step in steps
              if step.get("name") == wanted
          ]

          if len(matches) != 1:
              raise RuntimeError(
                  "Missing base step: " + wanted
              )

          print("Executing:", wanted, flush=True)

          subprocess.run(
              [
                  "bash",
                  "-euo",
                  "pipefail",
                  "-c",
                  matches[0]["run"]
              ],
              env=os.environ.copy(),
              check=True
          )
          PY

          python3 "$RUNNER_TEMP/run_base.py" \
            "Load working V18 instructions"

      - name: Prepare existing game project
        shell: bash
        run: |
          set -euo pipefail

          python3 "$RUNNER_TEMP/run_base.py" \
            "Prepare V18 game project"

      - name: Restore working V24.3 game
        shell: bash
        run: |
          set -euo pipefail

          test -n "${PROJECT_DIR:-}" || {
            echo "::error::PROJECT_DIR missing"
            exit 1
          }

          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          import yaml

          source = (
              Path(os.environ["RUNNER_TEMP"])
              / "lydra-base.yml"
          )

          data = yaml.safe_load(
              source.read_text(encoding="utf-8")
          )

          steps = data["jobs"]["build"]["steps"]

          required = [
              "Restore V17 intro and gameplay",
              "Restore V18 dragons and graphics",
              "Apply working V18 compiler fix",
              "Add V19 dragon species and battle effects",
              "Add V20 Dragon Codex and elemental battles",
              "Fix V20 C function declaration",
              "Add V21 three-dragon team and detailed Codex",
              "Apply V22 persistent fainting and battle switching",
              "Apply V23 selected living dragon in overworld",
              "Expand V24 world and improve retro adventure graphics",
              "Apply V24.1 camera background villages and roads fixed",
              "V24.2 Tilt camera and show true ground perspective",
              "V24.3 Improve player framing and battle HP display"
          ]

          for wanted in required:
              matches = [
                  step for step in steps
                  if step.get("name") == wanted
              ]

              if len(matches) != 1:
                  raise RuntimeError(
                      "Required step missing: " + wanted
                  )

              print("Restoring:", wanted, flush=True)

              subprocess.run(
                  [
                      "bash",
                      "-euo",
                      "pipefail",
                      "-c",
                      matches[0]["run"]
                  ],
                  env=os.environ.copy(),
                  check=True
              )

          print("Working V24.3 restored")
          PY

      - name: Apply Lydra name and V25 graphics
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path

          path = (
              Path(os.environ["PROJECT_DIR"])
              / "src"
              / "main.c"
          )

          code = path.read_text(
              encoding="utf-8"
          )

          def replace_once(old, new):
              global code

              count = code.count(old)

              if count != 1:
                  raise RuntimeError(
                      "Source marker missing: "
                      + old[:65]
                  )

              code = code.replace(
                  old,
                  new,
                  1
              )

          # Rename the game.
          if "VOLT TRAIL V24.3" not in code:
              raise RuntimeError(
                  "Original game title missing"
              )

          code = code.replace(
              "VOLT TRAIL V24.3",
              "LYDRA WORLD OF DRAGON"
          )

          # Additional PS1-friendly low-poly nature.
          # No fragile GPU initialization patch.
          nature_code = r'''
          /*
           * LYDRA WORLD OF DRAGON - V25
           * Additional scenery.
           */

          static void lydra_v25_nature(void) {
              int base_x = px / 180;
              int base_z = pz / 180;

              int cx;
              int cz;

              if (game_mode != 0) {
                  return;
              }

              for (
                  cz = base_z;
                  cz <= base_z + 5;
                  cz++
              ) {
                  for (
                      cx = base_x - 3;
                      cx <= base_x + 3;
                      cx++
                  ) {
                      int seed;
                      int wx;
                      int wz;
                      int dx;
                      int dz;
                      int distant;

                      seed = (
                          cx * 19
                          + cz * 29
                          + region * 7
                      ) & 15;

                      if (
                          seed != 0
                          && seed != 3
                          && seed != 7
                      ) {
                          continue;
                      }

                      wx = cx * 180 + seed * 5;
                      wz = cz * 180 + seed * 3;

                      dx = wx - px;
                      dz = wz - pz;

                      /*
                       * Simple visibility check:
                       * skip scenery outside
                       * the active surroundings.
                       */
                      if (
                          dz < 100
                          || dz > 740
                          || dx < -480
                          || dx > 480
                      ) {
                          continue;
                      }

                      /* Keep the main road clear. */
                      if (
                          wx > -115
                          && wx < 115
                      ) {
                          continue;
                      }

                      distant = dz > 450;

                      if (seed == 0) {
                          /* Small boulder. */
                          draw_box(
                              wx,
                              26,
                              wz,
                              8 + (cz & 3),
                              distant ? 103 : 118,
                              distant ? 120 : 111,
                              distant ? 139 : 104
                          );
                      } else if (seed == 3) {
                          /* Bush. */
                          vt_pyramid(
                              wx,
                              23,
                              wz,
                              13,
                              22,
                              distant ? 64 : 37,
                              distant ? 139 : 169,
                              distant ? 111 : 73
                          );
                      } else {
                          /* Small stone. */
                          draw_box(
                              wx,
                              30,
                              wz,
                              5,
                              distant ? 119 : 137,
                              distant ? 135 : 122,
                              distant ? 150 : 101
                          );
                      }
                  }
              }
          }
          '''

          replace_once(
              "static void draw_hud(void) {",
              nature_code
              + "\n"
              + "static void draw_hud(void) {"
          )

          replace_once(
              "        vt_v24_draw_overworld();",
              "        vt_v24_draw_overworld();"
              + "\n"
              + "        lydra_v25_nature();"
          )

          required = [
              "LYDRA WORLD OF DRAGON",
              "lydra_v25_nature();",
              "vt_v24_draw_overworld();",
              "vt_v23_field_dragon();",
              "vt_v18_battle_bars();",
              "vt_save_game(void)",
              "vt_load_game(void)",
              "vt_play_intro();"
          ]

          for marker in required:
              if marker not in code:
                  raise RuntimeError(
                      "Required feature missing: "
                      + marker
                  )

          path.write_text(
              code,
              encoding="utf-8"
          )

          print("LYDRA WORLD OF DRAGON")
          print("V25 graphics applied")
          print("Existing V24.3 gameplay retained")
          PY

      - name: Install PSn00bSDK
        shell: bash
        run: |
          set -euo pipefail

          python3 "$RUNNER_TEMP/run_base.py" \
            "Install PSn00bSDK 0.24 directly"

      - name: Build Lydra World Of Dragon
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            -S "$PROJECT_DIR" \
            -B "$GITHUB_WORKSPACE/build" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PSN00BSDK_CMAKE" \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build \
            "$GITHUB_WORKSPACE/build" \
            --verbose

      - name: Collect PS1 game files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            "$GITHUB_WORKSPACE/artifacts"

          for file in \
            VTRAIL.bin \
            VTRAIL.cue \
            VTRAIL.exe \
            VTRAIL.elf
          do
            source="$GITHUB_WORKSPACE/build/$file"

            if [ ! -s "$source" ]; then
              echo "::error::Missing file: $file"
              exit 1
            fi

            cp "$source" \
              "$GITHUB_WORKSPACE/artifacts/"
          done

          ls -lh \
            "$GITHUB_WORKSPACE/artifacts"

      - name: Upload Lydra V25
        uses: actions/upload-artifact@v4
        with:
          name: Lydra-World-Of-Dragon-PS1-V25
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
