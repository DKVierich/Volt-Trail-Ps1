        import struct, json, pathlib,hashlib
        files=(pathlib.Path('android/assets/characters/LWOD_Heldin_V4099.glb'),pathlib.Path('android/assets/characters/LWOD_Phoenix_Violett_V4099.glb'))
        expected={
          "LWOD_Heldin_V4099.glb": "0a9b71b1e00d0880e5b48838e6b5de4b620e03ec804754ddee6305f020d230cf",
          "LWOD_Phoenix_Violett_V4099.glb": "31a2d7c058d8591b5da7f7c21c3b3e3697b439e2b06817f02c5ee8db8e531061"
        }
        for path in files:
            data=path.read_bytes()
            assert data[:4]==b'glTF' and struct.unpack_from('<I',data,4)[0]==2
            assert hashlib.sha256(data).hexdigest()==expected[path.name],path
            n,tag=struct.unpack_from('<I4s',data,12)
            assert tag==b'JSON'
            obj=json.loads(data[20:20+n])
            assert len(obj.get('skins',[]))==1 and len(obj.get('animations',[]))==2
            assert len(obj['meshes'][0]['primitives'])==1
            a=obj['meshes'][0]['primitives'][0]['attributes']
            assert all(k in a for k in ('JOINTS_0','WEIGHTS_0','TEXCOORD_0','NORMAL'))
            print('V4099_GLB_OK:',path.name,'bones',len(obj['skins'][0]['joints']),'animations',[a['name'] for a in obj['animations']])
        PY_GLB_VERIFY
    - name: Godot importiert beide echten GLB-Modelle
      shell: bash
      run: |
        set -euo pipefail
        timeout --signal=TERM --kill-after=5s 210s godot --headless --editor --path android --import 2>&1 | tee /tmp/lwod4099_import.log
        if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to import|Error importing' /tmp/lwod4099_import.log; then
          echo 'GLB-IMPORTFEHLER'; exit 1
        fi
        for file in LWOD_Heldin_V4099.glb LWOD_Phoenix_Violett_V4099.glb; do
          test -s "android/assets/characters/$file"
        done
        echo V4099_IMPORT_OK
    - name: Skelett, Texturen und Animationen in Godot testen
      shell: bash
      run: |
        set -euo pipefail
        cat > android/tests/V4099RigSmoke.gd <<'GD_V4099_TEST'
        extends SceneTree
        class TestGame:
            extends Node3D
            var hero: Node3D
            var phoenix: Node3D

        func _initialize() -> void:
            call_deferred("_run")

        func _find_rig(n: Node) -> Skeleton3D:
            if n is Skeleton3D:
                return n as Skeleton3D
            for c in n.get_children():
                var rig: Skeleton3D = _find_rig(c)
                if rig != null: return rig
            return null

        func _find_anim(n: Node) -> AnimationPlayer:
            if n is AnimationPlayer:
                return n as AnimationPlayer
            for c in n.get_children():
                var a: AnimationPlayer = _find_anim(c)
                if a != null: return a
            return null

        func _contains_clip(player: AnimationPlayer, text: String) -> bool:
            if player == null: return false
            for key in player.get_animation_list():
                if String(key).to_lower().contains(text.to_lower()):return true
            return false

        func _run() -> void:
            var paths: Array[String] = ["res://assets/characters/LWOD_Heldin_V4099.glb", "res://assets/characters/LWOD_Phoenix_Violett_V4099.glb"]
            for path in paths:
                var res: PackedScene = load(path) as PackedScene
                if res == null:
                    push_error("V4099: GLB nicht importierbar: " + path)
                    quit(1)
                    return
                var inst: Node = res.instantiate()
                root.add_child(inst)
                var skel: Skeleton3D = _find_rig(inst)
                var anim: AnimationPlayer = _find_anim(inst)
                if skel == null or anim == null or skel.get_bone_count() < 9:
                    push_error("V4099: Echte Knochen oder AnimationPlayer fehlen: " + path)
                    quit(2)
                    return
                if path.contains("Heldin"):
                    if not _contains_clip(anim,"Idle") or not _contains_clip(anim,"Walk"):
                        push_error("V4099: Idle und Walk fehlen")
                        quit(3)
                        return
                else:
                    if not _contains_clip(anim,"Flap") or not _contains_clip(anim,"Glide"):
                        push_error("V4099: Flap und Glide fehlen")
                        quit(4)
                        return
                inst.queue_free()
            var g := TestGame.new()
            root.add_child(g)
            g.hero = Node3D.new()
            g.phoenix = Node3D.new()
            g.add_child(g.hero)
            g.add_child(g.phoenix)
            var loader: Script = load("res://scripts/V4094HeroPhoenix.gd") as Script
            if loader == null or not loader.can_instantiate():
                push_error("V4099: Ladeskript nicht gültig")
                quit(5)
                return
            var helper: Node = loader.new()
            g.add_child(helper)
            helper.call("setup",g)
            helper.call("_bind_characters")
            var hv: Node3D = g.hero.get_node_or_null("LWOD_V4094_HeroVisual") as Node3D
            var pv: Node3D = g.phoenix.get_node_or_null("LWOD_V4094_PhoenixVisual") as Node3D
            if hv == null or pv == null or not hv.has_meta("lwod_v4099_hero") or not pv.has_meta("lwod_v4099_unique_phoenix"):
                push_error("V4099: Figuren wurden im Spiel nicht eingebunden")
                quit(6)
                return
            helper.call("_process",0.08)
            print("V4099_SKINNED_CHARACTER_OK: hero 15 bones, phoenix 10 bones, 4 animation clips, 2 textured glb")
            quit(0)
        GD_V4099_TEST
        timeout --signal=TERM --kill-after=5s 115s godot --headless --path android --quit-after 250 --script res://tests/V4099RigSmoke.gd 2>&1 | tee /tmp/lwod4099_rig.log
        if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Invalid call|Failed to load script|ERROR: Cannot load' /tmp/lwod4099_rig.log; then
          exit 1
        fi
        grep -Fq 'V4099_SKINNED_CHARACTER_OK:' /tmp/lwod4099_rig.log
    - name: NPCs und Markt-Kollisionen testen
      shell: bash
      run: |
        set -euo pipefail
        for script in V4093CharacterSmoke.gd V4092Fix5MotionMarketSmoke.gd; do
          timeout --signal=TERM --kill-after=5s 100s \
            godot --headless --path android --quit-after 300 --script "res://tests/$script" \
            2>&1 | tee "/tmp/$script.log"
          if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Invalid call|Failed to load script' "/tmp/$script.log"; then
            exit 1
          fi
        done
        echo 'NPC_TESTS_OK'
    - name: Android-APK bauen und ZIP-Struktur prüfen
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p build/android
        APK="$GITHUB_WORKSPACE/build/android/LWOD-Android-V40.9.9.apk"
        timeout --signal=TERM --kill-after=5s 900s godot --headless --path android --export-debug Android "$APK" 2>&1 | tee /tmp/lwod4099_export.log
        if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script' /tmp/lwod4099_export.log; then
          exit 1
        fi
        test -s "$APK"
        unzip -t "$APK" >/dev/null
        ls -lh "$APK"
    - name: Fertige APK hochladen
      uses: actions/upload-artifact@v4
      with:
        name: LWOD_ANDROID_V40_9_9_APK
        path: build/android/LWOD-Android-V40.9.9.apk
        if-no-files-found: error
        retention-days: 14
