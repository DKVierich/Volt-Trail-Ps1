        #!/usr/bin/env python3
        """V31.7.3 fix title font channels and reposition interactive menu."""
        import os,re
        from pathlib import Path
        p=Path(os.environ['PROJECT_DIR'])/'src/main.c'
        s=p.read_text(encoding='utf-8')

        def once(old,new):
            global s
            count=s.count(old)
            if count!=1:
                raise RuntimeError('V31.7.3 required unique anchor %r: %d' % (old[:85],count))
            s=s.replace(old,new,1)

        def fspan(name):
            pat=r'\bstatic\s+(?:void|int)\s+'+re.escape(name)+r'\s*\([^;]*?\)\s*\{'
            matches=list(re.finditer(pat,s,re.S))
            if len(matches)!=1:
                raise RuntimeError('V31.7.3 expected function '+name+': '+str(len(matches)))
            start=matches[0].start()
            pos=matches[0].end()
            depth=1;state='code'
            while pos<len(s) and depth:
                ch=s[pos];nx=s[pos+1] if pos+1<len(s) else ''
                if state=='code':
                    if ch=='/' and nx=='/':state='line';pos+=1
                    elif ch=='/' and nx=='*':state='block';pos+=1
                    elif ch=='"':state='str'
                    elif ch=="'":state='char'
                    elif ch=='{':depth+=1
                    elif ch=='}':depth-=1
                elif state=='line':
                    if ch=='\n':state='code'
                elif state=='block':
                    if ch=='*' and nx=='/':state='code';pos+=1
                else:
                    if ch=='\\':pos+=1
                    elif (state=='str' and ch=='"') or (state=='char' and ch=="'"):state='code'
                pos+=1
            if depth:raise RuntimeError('V31.7.3 unbalanced braces '+name)
            return start,pos

        def edit(name,func):
            global s
            a,b=fspan(name)
            old=s[a:b]
            new=func(old)
            if old==new:raise RuntimeError('V31.7.3 no edit made in '+name)
            s=s[:a]+new+s[b:]

        # Never assume FntOpen stream numbers: IDs depend on how many earlier calls
        # succeeded. In the last build, the title stream was accidentally used by
        # the day/night HUD, explaining the clock printed at screen y=217.
        once('static void vt_v301_day_night_hud(void) {',
             'static int vt_v3173_time_font=-1;\n'
             'static int vt_v3173_start_font=-1;\n'
             'static int vt_v3173_menu_font=-1;\n'
             'static void vt_v301_day_night_hud(void) {')

        once('FntOpen(177, 6, 68, 42, 0, 128); /* day-night meter */',
             'vt_v3173_time_font=FntOpen(177, 6, 68, 42, 0, 128); /* day-night meter */')
        once('FntOpen(108, 217, 205, 20, 0, 128); /* title START */',
             'vt_v3173_start_font=FntOpen(110, 207, 120, 24, 0, 128); /* blinking START */')
        once('FntOpen(106, 144, 117, 80, 0, 512); /* interactive menu text, stream 6 */',
             'vt_v3173_menu_font=FntOpen(106, 141, 116, 76, 0, 512); /* real menu text */')
        # The production name is already present in the video artwork; its additional
        # font stream is unused and would waste one of the eight available streams.
        once('FntOpen(73, 108, 212, 30, 0, 128); /* centered production splash */',
             '/* V31.7.3: production text is embedded in the intro artwork. */')

        def clock(c):
            if c.count('FntPrint(4,')!=1:raise RuntimeError('Unexpected clock font write')
            return c.replace('FntPrint(4,','FntPrint(vt_v3173_time_font,')
        edit('vt_v301_day_night_hud',clock)

        # Only change the 4th stream FntFlush in the *exploration* HUD; keep the
        # original in-game menu and other stream numbers intact.
        def exploration(c):
            if c.count('FntFlush(4);')!=1:raise RuntimeError('V31.7.3 time flush missing')
            return c.replace('FntFlush(4);','FntFlush(vt_v3173_time_font);')
        edit('vt_v292_draw_exploration_hud',exploration)

        def title_hud(c):
            if c.count('FntPrint(6,')<1 or c.count('FntPrint(5,')<1:
                raise RuntimeError('V31.7.3 unexpected title font usage')
            c=c.replace('FntPrint(6,','FntPrint(vt_v3173_menu_font,')
            c=c.replace('FntPrint(5,','FntPrint(vt_v3173_start_font,')
            if 'FntPrint(7,' in c:
                # The logo is already in the MP4-derived artwork; no duplicate logo.
                raise RuntimeError('V31.7.3 unexpected production overlay')
            old='FntFlush(5);FntFlush(6);FntFlush(7);'
            if c.count(old)!=1:raise RuntimeError('V31.7.3 title flush pattern absent')
            c=c.replace(old,'FntFlush(vt_v3173_start_font);FntFlush(vt_v3173_menu_font);')
            return c
        edit('vt_v314_hud',title_hud)

        # Replace large, touching opaque rectangles with inset rows separated by
        # visible gaps, within the blue central artwork frame. The actual font
        # string goes on top through its own stream.
        def slots(c):
            c=c.replace('setXY0(tile,103,140+17*i);','setXY0(tile,103,139+18*i);')
            c=c.replace('setWH(tile,122,17);','setWH(tile,124,16);')
            if 'setXY0(tile,103,139+18*i);' not in c or 'setWH(tile,124,16);' not in c:
                raise RuntimeError('V31.7.3 menu layout mismatch')
            # The options background should sit below all the options rows in draw
            # order. Existing PS1 OT LIFO order is retained.
            return c
        edit('vt_v3172_menu_slots',slots)

        for f in ('vt_v314_hud','vt_v314_draw','vt_v314_input','vt_v292_draw_exploration_hud',
                  'vt_v301_day_night_hud','vt_v3172_menu_slots'):
            fspan(f)
        for token in ('vt_v281_resolve_movement();','vt_v282_draw_house_npcs(',
                      'vt_opt_draw_page();','vt_save_game(void)','vt_load_game(void)',
                      'vt_v293_move((unsigned int)pad);','vt_v314_cursor==0',
                      'vt_v314_cursor==1','vt_v314_cursor==2','vt_v314_active=1'):
            if token not in s:raise RuntimeError('V31.7.3 missing gameplay system: '+token)
        if 'FntPrint(4,"TAG' in s or 'FntFlush(5);FntFlush(6);FntFlush(7);' in s:
            raise RuntimeError('V31.7.3 leftover hardcoded font IDs')

        p.write_text(s,encoding='utf-8')
        print('V31.7.3 menu text uses FntOpen return IDs, rows are aligned to artwork.')
        print('V31.7.3 clock uses its own screen-fixed font and stays at top right.')
