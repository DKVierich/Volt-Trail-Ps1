                  raise RuntimeError(f'V23 function {name} expected once, found {len(matches)}')
              a=matches[0].start()
              op=source.index('{',a,matches[0].end())
              depth=0
              quoted=False
              char_quoted=False
              escaped=False
              line_comment=False
              block_comment=False
              j=op
              while j<len(source):
                  c=source[j]
                  nextc=source[j+1] if j+1<len(source) else ''
                  if line_comment:
