        # The center at 160 and baseline around y=186 match the original title screen.
        x0 = (320 - width) // 2
        y0 = 177
        array = ',\n'.join('    {%d,%d,%d}' % run for run in runs)
        new_function = '''/* V31.8.14: compact, pale-icy serif START matching the Lydra fantasy logo.
           Blinks in 90-frame periods; no menu window until the actual START press. */
        static void vt_v31813_draw_start(void)
