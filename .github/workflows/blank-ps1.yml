                c=s[i]
                n=s[i+1] if i+1<len(s) else ''
                if mode=='code':
                    if c=='/' and n=='/':mode='line';i+=1
                    elif c=='/' and n=='*':mode='block';i+=1
                    elif c=='"':mode='string'
                    elif c=="'":mode='char'
                    elif c=='{':depth+=1
                    elif c=='}':depth-=1
                elif mode=='line':
                    if c=='\n':mode='code'
                elif mode=='block':
                    if c=='*' and n=='/':mode='code';i+=1
                else:
                    if c=='\\':i+=1
                    elif (mode=='string' and c=='"') or (mode=='char' and c=="'"):mode='code'
                i+=1
            if depth:raise RuntimeError('Unbalanced braces in '+name)
            return begin,i

