    - name: Sicherungen und alle FIX39 Godot-Tests
      shell: bash
      run: |
        set -euo pipefail
        for i in 11 12 13 14 15 16; do
          echo "::group::FIX39 Originaltest $i"
          bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/fix41_base/$i.sh"
          echo '::endgroup::'
        done
    - name: FIX42 Burgruine Decken Kamera und Rueckweg testen
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p build/diagnose
        timeout --signal=TERM --kill-after=5s 140s godot --headless --path android --quit-after 300 --script res://tests/V441RuineSmoke.gd 2>&1 | tee build/diagnose/FIX41_Ruine.log
        if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid call|FIX41: ' build/diagnose/FIX41_Ruine.log; then exit 1; fi
        grep -Fq 'FIX42_RUINE_OK:' build/diagnose/FIX41_Ruine.log
    - name: FIX42 Android APK exportieren und pruefen
      run: |
        set -euo pipefail
        mkdir -p build/android build/diagnose
        APK="$GITHUB_WORKSPACE/build/android/LWOD-Android-V41.7-FIX42.apk"
        rm -f "$APK"
        timeout --signal=TERM --kill-after=5s 900s godot --headless --path android --export-debug Android "$APK" 2>&1 | tee build/diagnose/FIX42_APK_Export.log
        if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script' build/diagnose/FIX42_APK_Export.log; then
          exit 1
        fi
        test -s "$APK"
        unzip -t "$APK" >/dev/null
        unzip -Z1 "$APK" | grep -Fx 'AndroidManifest.xml' >/dev/null
        ls -lh "$APK"
        sha256sum "$APK"
      shell: bash
    - id: apk_upload
      name: FIX42 APK als Download hochladen
      uses: actions/upload-artifact@v4
      with:
        compression-level: 0
        if-no-files-found: error
        name: LWOD_ANDROID_V41_7_FIX42_APK
        path: build/android/LWOD-Android-V41.7-FIX42.apk
        retention-days: 14
    - env:
        APK_ARTIFACT_ID: ${{ steps.apk_upload.outputs.artifact-id }}
        APK_ARTIFACT_URL: ${{ steps.apk_upload.outputs.artifact-url }}
      name: Erfolgreichen APK Upload bestaetigen
      run: |
        set -euo pipefail
        test -n "$APK_ARTIFACT_ID"
