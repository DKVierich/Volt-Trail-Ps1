          code, n = re.subn(r'#define\s+WORLD_LIMIT\s+\d+', '#define WORLD_LIMIT 1600', code, count=1)
          if n != 1:
              raise RuntimeError('WORLD_LIMIT definition missing')

          helpers = r'''
          /* V24: A much larger retro-adventure overworld inspired by the sense of
           * scale of late-N64/PS1 fantasy games. The art remains original low-poly.
           */
          static void vt_v24_ground_patch(int x0, int z0, int step, int nx, int nz,
                                          int r1, int g1, int b1,
                                          int r2, int g2, int b2) {
              int zi, xi;
              for (zi = 0; zi < nz; zi++) {
                  for (xi = 0; xi < nx; xi++) {
                      int wx = x0 + xi * step;
                      int wz = z0 + zi * step;
                      SVECTOR a = {wx - px, 35, wz - pz, 0};
                      SVECTOR b = {wx + step - px, 35, wz - pz, 0};
                      SVECTOR c = {wx - px, 35, wz + step - pz, 0};
                      SVECTOR d = {wx + step - px, 35, wz + step - pz, 0};
                      if (((xi + zi) & 1) == 0) {
                          draw_triangle3(&a, &c, &b, r1, g1, b1);
                          draw_triangle3(&b, &c, &d, r2, g2, b2);
                      } else {
                          draw_triangle3(&a, &c, &b, r2, g2, b2);
                          draw_triangle3(&b, &c, &d, r1, g1, b1);
                      }
                  }
              }
          }

          static void vt_v24_peak(int x, int z, int width, int height,
