                  draw_box(0, 2, 520, 18, 64, 126, 235);
                  vt_v24_ruin_arch(0, 610, 156, 149, 132);
                  for (i = -6; i <= 6; i++) {
                      vt_v24_tree(-500 + i * 85, 250 + ((i & 1) ? 40 : -20), 10 + (i & 3) * 2, i % 3);
                      vt_v24_tree(-540 + i * 90, 520 + ((i & 1) ? -10 : 36), 13 + ((i + 1) & 3) * 2, (i + 1) % 3);
                  }
              } else if (region == 1) {
