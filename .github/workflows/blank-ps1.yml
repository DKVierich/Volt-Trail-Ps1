    - name: Godot Ressourcen importieren
      shell: bash
      run: |
        set -euo pipefail
        godot --headless --path android --editor --import --quit
        test -s android/scripts/PhoenixMenu.gd
    - name: Godot Skripte zur Laufzeit testen
      shell: bash
      run: |
        set -euo pipefail
        godot --headless --path android --quit-after 6 > "$RUNNER_TEMP/lwod_v21_test.log" 2>&1 || {
          cat "$RUNNER_TEMP/lwod_v21_test.log"
          exit 1
        }
        cat "$RUNNER_TEMP/lwod_v21_test.log"
        if grep -Eq 'SCRIPT ERROR:|Parse Error:|Invalid call\.|Failed to load script' "$RUNNER_TEMP/lwod_v21_test.log"; then
          echo '::error::Godot-Skriptfehler im V23-Laufzeittest'
          exit 1
        fi
    - name: LWOD Android V23 APK erstellen
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p build/android
        godot --headless --path android --export-debug 'Android' \
          "$GITHUB_WORKSPACE/build/android/LWOD-Android-V23.apk"
        test -s build/android/LWOD-Android-V23.apk
        unzip -t build/android/LWOD-Android-V23.apk >/dev/null
    - name: Fehlerdiagnose speichern
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: LWOD_V23_DIAGNOSE
        path: '${{ runner.temp }}/lwod_v21_test.log

          android/scripts/V19TerrainSafety.gd

          android/scripts/V21World.gd
          android/scripts/V21Minimap.gd

          '
        if-no-files-found: warn
        retention-days: 14
    - name: V23 APK bereitstellen
      uses: actions/upload-artifact@v4
      with:
        name: LWOD_ANDROID_V23_RIESENWELT_APK
        path: build/android/LWOD-Android-V23.apk
        if-no-files-found: error
        retention-days: 14
