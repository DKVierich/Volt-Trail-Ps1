# Lydra World Of Dragon - Android V7
# Als Datei .github/workflows/lwod-android.yml speichern.
# Die PS1-Datei blank-ps1.yml NICHT ersetzen.
name: LWOD Android V8 - PS1 Original Intro und Hauptmenue

'on':
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/lwod-android.yml'
      - '.github/workflows/blank-ps1.yml'

permissions:
  contents: read

jobs:
  android:
    name: Android V8 PS1 Design APK erstellen
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: barichello/godot-ci:4.7.2
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: /usr/lib/android-sdk
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: Godot Android Entwicklungsumgebung
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -a /root/.config/godot/. "$HOME/.config/godot/"
          cp -a /root/.local/share/godot/export_templates/. "$HOME/.local/share/godot/export_templates/"
          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
          test -x "$JAVA_HOME/bin/java"
          test -s /root/debug.keystore
          sdkmanager --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.1'
          test -d "$ANDROID_HOME/platforms/android-35"
      - name: Funktionierende V6 Spielwelt erstellen
        shell: bash
        run: |
          set -euo pipefail
          wget -q --tries=3 --timeout=40 -O "$RUNNER_TEMP/lwod_v6.yml" \
            'https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/f9ee20ef7eb39d9923712709d9113343f4a0ba8d/.github/workflows/blank-ps1.yml'
          test -s "$RUNNER_TEMP/lwod_v6.yml"
          test "$(git hash-object "$RUNNER_TEMP/lwod_v6.yml")" = 'be0bc2274b23129b4dc7999d79af36703d2ef192'
          awk '
            /^      - name: Godot Android Projekt erstellen$/ {found=1; next}
            found==1 && /^        run: \|$/ {part=1; next}
            part==1 && /^      - name: Godot Projekt importieren$/ {exit}
            part==1 && /^          / {sub(/^          /, ""); print; next}
            part==1 && /^$/ {print; next}
          ' "$RUNNER_TEMP/lwod_v6.yml" > "$RUNNER_TEMP/build_world.sh"
          test -s "$RUNNER_TEMP/build_world.sh"
          grep -q 'android/scripts/Main.gd' "$RUNNER_TEMP/build_world.sh"
          bash -n "$RUNNER_TEMP/build_world.sh"
          bash "$RUNNER_TEMP/build_world.sh"
          test -s android/scripts/Main.gd
          test -s android/scripts/TouchOverlay.gd
          test -s android/project.godot
      - name: V7 Spielfigur Steuerung und Menues
