                  for (i = -4; i <= 4; i++) {
                      vt_v24_peak(-520, 240 + i * 120, 92, 122 + (i & 1) * 24, 68, 92, 118);
                      vt_v24_peak(520, 240 + i * 120, 92, 126 + ((i + 1) & 1) * 20, 74, 100, 126);
                  }
                  for (i = -3; i <= 3; i++) {
