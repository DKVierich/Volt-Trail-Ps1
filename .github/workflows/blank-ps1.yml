    - name: V41.1 GLB-Modelle mit Godot importieren
      shell: bash
      run: "set -euo pipefail\ntimeout --signal=TERM --kill-after=5s 240s godot --headless --editor --path android --import 2>&1 | tee\
        \ /tmp/lwod4110_import.log\nif grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to import|Error importing' /tmp/lwod4110_import.log;\
        \ then\n  echo 'GLB-IMPORTFEHLER'; exit 1\nfi\nfor file in LWOD_Heldin_V4110.glb LWOD_Phoenix_Violett_V4110.glb; do\n  test\
        \ -s \"android/assets/characters/$file\"\ndone\necho V4110_IMPORT_OK\n"
    - name: V41.1 Godot Rig, Animation und Skinning pruefen
      shell: bash
      run: "set -euo pipefail\ncat > android/tests/V4110RigSmoke.gd <<'GD_V4110_TEST'\nextends SceneTree\nclass TestGame:\n    extends\
        \ Node3D\n    var hero: Node3D\n    var phoenix: Node3D\n\nfunc _initialize() -> void:\n    call_deferred(\"_run\")\n\nfunc\
        \ _find_rig(n: Node) -> Skeleton3D:\n    if n is Skeleton3D:\n        return n as Skeleton3D\n    for c in n.get_children():\n\
        \        var rig: Skeleton3D = _find_rig(c)\n        if rig != null: return rig\n    return null\n\nfunc _find_anim(n: Node)\
        \ -> AnimationPlayer:\n    if n is AnimationPlayer:\n        return n as AnimationPlayer\n    for c in n.get_children():\n \
        \       var a: AnimationPlayer = _find_anim(c)\n        if a != null: return a\n    return null\n\nfunc _contains_clip(player:\
        \ AnimationPlayer, text: String) -> bool:\n    if player == null: return false\n    for key in player.get_animation_list():\n\
        \        if String(key).to_lower().contains(text.to_lower()):return true\n    return false\n\nfunc _run() -> void:\n    var\
        \ paths: Array[String] = [\"res://assets/characters/LWOD_Heldin_V4110.glb\", \"res://assets/characters/LWOD_Phoenix_Violett_V4110.glb\"\
        ]\n    for path in paths:\n        var res: PackedScene = load(path) as PackedScene\n        if res == null:\n            push_error(\"\
        V4110: GLB nicht importierbar: \" + path)\n            quit(1)\n            return\n        var inst: Node = res.instantiate()\n\
        \        root.add_child(inst)\n        var skel: Skeleton3D = _find_rig(inst)\n        var anim: AnimationPlayer = _find_anim(inst)\n\
        \        if skel == null or anim == null or skel.get_bone_count() < 9:\n            push_error(\"V4110: Echte Knochen oder AnimationPlayer\
        \ fehlen: \" + path)\n            quit(2)\n            return\n        if path.contains(\"Heldin\"):\n            if not _contains_clip(anim,\"\
        Idle\") or not _contains_clip(anim,\"Walk\"):\n                push_error(\"V4110: Idle und Walk fehlen\")\n               \
        \ quit(3)\n                return\n        else:\n            if not _contains_clip(anim,\"Flap\") or not _contains_clip(anim,\"\
        Glide\"):\n                push_error(\"V4110: Flap und Glide fehlen\")\n                quit(4)\n                return\n \
        \       # Check that skinned joints actually move when animation advances.\n        var bone_name: String = \"LeftLeg\" if path.contains(\"\
        Heldin\") else \"WingL\"\n        var clip_name: String = \"Walk\" if path.contains(\"Heldin\") else \"Flap\"\n        var bone_index:\
        \ int = skel.find_bone(bone_name)\n        if bone_index < 0:\n            push_error(\"V4110: Animierter Knochen fehlt: \"\
        \ + bone_name)\n            quit(7)\n            return\n        var matching_clip: String = \"\"\n        for c in anim.get_animation_list():\n\
        \            if String(c).to_lower().contains(clip_name.to_lower()):\n                matching_clip = String(c)\n          \
        \      break\n        if matching_clip.is_empty():\n            push_error(\"V4110: Clip nicht gefunden: \" + clip_name)\n \
        \           quit(8)\n            return\n        anim.play(matching_clip)\n        anim.advance(0.22)\n        var pose_a: Quaternion\
        \ = skel.get_bone_pose_rotation(bone_index)\n        anim.advance(0.41)\n        var pose_b: Quaternion = skel.get_bone_pose_rotation(bone_index)\n\
        \        if pose_a.angle_to(pose_b) < 0.025:\n            push_error(\"V4110: Knochen bewegt sich nicht: \" + bone_name)\n \
        \           quit(9)\n            return\n        inst.queue_free()\n    var g := TestGame.new()\n    root.add_child(g)\n   \
        \ g.hero = Node3D.new()\n    g.phoenix = Node3D.new()\n    g.add_child(g.hero)\n    g.add_child(g.phoenix)\n    var loader:\
        \ Script = load(\"res://scripts/V4094HeroPhoenix.gd\") as Script\n    if loader == null or not loader.can_instantiate():\n \
        \       push_error(\"V4110: Ladeskript nicht gültig\")\n        quit(5)\n        return\n    var helper: Node = loader.new()\n\
        \    g.add_child(helper)\n    helper.call(\"setup\",g)\n    helper.call(\"_bind_characters\")\n    var hv: Node3D = g.hero.get_node_or_null(\"\
        LWOD_V4094_HeroVisual\") as Node3D\n    var pv: Node3D = g.phoenix.get_node_or_null(\"LWOD_V4094_PhoenixVisual\") as Node3D\n\
        \    if hv == null or pv == null or not hv.has_meta(\"lwod_v4110_hero\") or not pv.has_meta(\"lwod_v4110_unique_phoenix\"):\n\
