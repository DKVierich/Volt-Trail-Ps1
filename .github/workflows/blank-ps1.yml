        \    _v462_pave_sonnental()\"):\n        _fail(\"Sonnental paving was not connected to world initialization\")\n \
        \       return\n    print(\"FIX62_ALL_ROADS_OK: Wurzelheim baked paving, Sonnental plaza, regional inner rings and\
