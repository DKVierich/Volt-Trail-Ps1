      - {name: Basis 53, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 53'}
      - {name: Basis 54, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 54'}

      - name: FIX33 3D-Modelle laden
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/fix38_step.py" \
            'FIX33 Geometrie verbessern'

      - name: FIX33 Grafik kontrollieren
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/fix38_step.py" \
            'FIX33 pruefen'

      # Keine 640x240-Umschaltung.
      # Damit bleiben Intro, Spiel und Bildspeicher
      # im gemeinsamen 320x240-Modus.

      - name: Bildschirmaufloesung pruefen
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY_DISPLAY'
          from pathlib import Path
          import os,re

          source=Path(os.environ['PROJECT_DIR'])/'src/main.c'
          s=source.read_text(encoding='utf-8')

          width=re.search(
              r'(?m)^\s*#\s*define\s+SCREEN_W\s+320\b',s
          )
          height=re.search(
              r'(?m)^\s*#\s*define\s+SCREEN_H\s+240\b',s
          )

          if not width or not height:
              raise SystemExit(
                  'FIX38: Bildaufloesung nicht 320x240'
              )

          if 'LWOD_FIX33_GEOMETRY' not in s:
              raise SystemExit(
                  'FIX38: Verbesserte 3D-Modelle fehlen'
              )

          print('FIX38: 320x240 und FIX33 Modelle aktiv')
          PY_DISPLAY

      - name: PS1 SDK installieren
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/lwod_run.py" 55

          grep -q '^PSN00BSDK_CMAKE=' "$GITHUB_ENV" || {
            echo '::error::PS1 SDK-Variable fehlt'
            exit 1
          }

      - name: PS1 Spiel kompilieren
        shell: bash
        run: |
          set -euo pipefail
          : "${PSN00BSDK_CMAKE:?PS1 SDK nicht geladen}"
          test -f "$PSN00BSDK_CMAKE"

          python3 "$RUNNER_TEMP/lwod_run.py" 56

      - name: Fehlerprotokoll hochladen
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: LWOD_FIX38_FEHLER
          path: |
            artifacts/FIX25_BUILD_LOG.txt
            artifacts/FIX25_ERSTE_FEHLER.txt
          if-no-files-found: warn
          retention-days: 14

      - name: PS1 Disc fertigstellen
        shell: bash
        run: |
          set -euo pipefail

          for i in 58 59 60 61; do
            python3 "$RUNNER_TEMP/lwod_run.py" "$i"
          done

          folder="$RUNNER_TEMP/lydra_ps1_spiel"

          test -s "$folder/LWOD_FIX32.bin"
          test -s "$folder/LWOD_FIX32.cue"

          mv "$folder/LWOD_FIX32.bin" \
             "$folder/LWOD_FIX38.bin"

          sed 's/LWOD_FIX32[.]bin/LWOD_FIX38.bin/g' \
             "$folder/LWOD_FIX32.cue" \
             > "$folder/LWOD_FIX38.cue"

          rm "$folder/LWOD_FIX32.cue"

          grep -qi 'LWOD_FIX38.bin' \
            "$folder/LWOD_FIX38.cue"

          echo "FIX38: BIN und CUE fertig"

      - name: Spiel als ZIP-Artefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: LWOD_FIX38_STABIL
          path: ${{ runner.temp }}/lydra_ps1_spiel/
          if-no-files-found: error
          retention-days: 14
