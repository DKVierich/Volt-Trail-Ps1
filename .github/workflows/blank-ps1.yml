        \    root.add_child(roads)\n    var paving: ShaderMaterial = roads._v461_paving_material()\n    if paving == null\
        \ or paving.shader == null:\n        _fail(\"paving shader not created\")\n        return\n    if not paving.shader.code.contains(\"\
        stone_mask\") or not paving.shader.code.contains(\"UV\"):\n        _fail(\"paving shader missing staggered stone joints\"\
        )\n        return\n    var corners := PackedVector2Array([Vector2(0,0),Vector2(15,0),Vector2(15,20)])\n    var curved:\
        \ PackedVector2Array = roads._v456_smooth_road(corners)\n    if curved.size() < 8 or curved[0] != corners[0] or curved[curved.size()-1]\
        \ != corners[2]:\n        _fail(\"curved road no longer reaches mapped endpoints\")\n        return\n    print(\"\
        FIX61_PAVING_OK: one reusable stone shader, alternating paving joints, road-aligned UVs, smoothly curved routes\"\
        )\n    quit(0)\n''',encoding='utf-8')\nassert test.stat().st_size>100\nprint('FIX61_INSTALL_OK: roads paved with one\
        \ shared shader, wider smooth bends, unchanged 4m mesh resolution')\nPYFIX61\npython3 -m py_compile \"$RUNNER_TEMP/lwod_fix61_paving.py\"\
        \npython3 \"$RUNNER_TEMP/lwod_fix61_paving.py\"\npython3 - <<'PYVERIFY61'\nfrom pathlib import Path\ns=Path('android/scripts/V408Regions.gd').read_text(encoding='utf-8')\n\
        assert 'const V461_PAVING_SHADER = preload(\"res://shaders/LWODPaving.gdshader\")' in s\nassert '_v461_paving_material()'\
        \ in s\nassert 'var traveled: float = 0.0' in s\nassert s.count('_v456_road_vertex(st,') == 6\nassert 'ceili(a.distance_to(b)/4.0)'\
