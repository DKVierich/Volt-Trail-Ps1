name: LWOD Android V40.9.2 FIX3 NPC Bewegungsfehler
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/blank-ps1.yml
permissions:
  contents: read
jobs:
  android:
    name: LWOD Android V40.9.2 FIX3 APK
    runs-on: ubuntu-latest
    timeout-minutes: 70
    container:
      image: barichello/godot-ci:4.7.2
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: /usr/lib/android-sdk
    steps:
    - name: Repository laden
      uses: actions/checkout@v4
    - name: Python YAML fuer feste V40.8.1 Basis bereitstellen
      shell: bash
      run: "set -euo pipefail\nif ! python3 -c 'import yaml' >/dev/null 2>&1; then\n  apt-get update -qq\n\
        \  DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 python3-yaml\nfi\npython3 -c\
        \ 'import yaml; print(\"V4082_PARSER_OK: PyYAML\",yaml.__version__)'\n"
    - name: V40.8.1 Basisskript aus unveraenderlichem Commit abrufen
      shell: bash
      run: "set -euo pipefail\nwget -q --tries=3 --timeout=60 --https-only -O \"$RUNNER_TEMP/lwod_v4081_baseline.yml\"\
        \ 'https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/c20014387aded796ddc5f52c385680081c020b0c/.github/workflows/blank-ps1.yml'\n\
        test -s \"$RUNNER_TEMP/lwod_v4081_baseline.yml\"\ntest \"$(git hash-object \"$RUNNER_TEMP/lwod_v4081_baseline.yml\"\
        )\" = '6ec7bf5e13844a5531a6161addfea22e1ae48b5c' || { echo '::error::V40.8.1 Quellpruefsumme falsch';\
        \ exit 42; }\ncat > \"$RUNNER_TEMP/lwod_v4081_replay.py\" <<'PYREPLAY'\nimport pathlib, subprocess,\
        \ sys, yaml\nsource=pathlib.Path(sys.argv[1])\nmode=sys.argv[2]\nsteps=yaml.safe_load(source.read_text(encoding=\"\
        utf-8\"))[\"jobs\"][\"android\"][\"steps\"]\nassert len(steps)==25 and steps[10][\"name\"]==\"\
        V40.8.1 Teleportkristalle und Reisezielmenue installieren\"\nassert steps[11][\"name\"]==\"Godot\
        \ Ressourcen importieren\"\nassert steps[22][\"name\"]==\"LWOD Android V40.8.1 APK erstellen\"\
        \nselected=range(1,11) if mode==\"install\" else range(11,22)\nfor i in selected:\n    step=steps[i]\n\
        \    title=step[\"name\"]\n    body=step[\"run\"]\n    print(\"V4082_BASIS_STEP\",i,title,flush=True)\n\
        \    proc=subprocess.run([\"bash\",\"-e\",\"-o\",\"pipefail\",\"-c\",body])\n    if proc.returncode:\n\
        \        raise SystemExit(\"V40.8.1 Basisfehler in %s: Exit %d\" % (title,proc.returncode))\n\
        print(\"V4082_BASIS_OK:\",mode,flush=True)\nPYREPLAY\npython3 -m py_compile \"$RUNNER_TEMP/lwod_v4081_replay.py\"\
        \n"
    - name: V40.8.1 Spielwelt, Inventar und Teleport reproduzierbar erstellen
      shell: bash
      run: 'set -euo pipefail

        python3 "$RUNNER_TEMP/lwod_v4081_replay.py" "$RUNNER_TEMP/lwod_v4081_baseline.yml" install

        '
