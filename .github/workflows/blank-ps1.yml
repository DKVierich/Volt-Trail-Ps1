        #!/usr/bin/env python3
        # V31.8.14: real PS1 title prompt in a small elegant serif, no extra image.
        from pathlib import Path
        import os, re
        from PIL import Image, ImageDraw, ImageFont

        p = Path(os.environ['PROJECT_DIR']) / 'src' / 'main.c'
        s = p.read_text(encoding='utf-8')

        # We only replace the old START glyph renderer, preserving controller logic.
        name = 'vt_v31813_draw_start'
