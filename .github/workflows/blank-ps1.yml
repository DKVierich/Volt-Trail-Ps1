    - name: V31.9.4 FPS Diagnose und sichtbaren 3D-Aufwand reduzieren
      shell: bash
      run: |
        set -euo pipefail
        cat > "$RUNNER_TEMP/lydra_v3194_patch.py" <<'LYDRA_V3194_PATCH'
        #!/usr/bin/env python3
        """V31.9.4: conservative rendering LOD reduction + visible true game-frame FPS.

        The overlay counts actual overworld frames against VSync blank counter.
        No changes to movement, physics, 7-second intro, menu, or save data.
        """
        import os,re
        from pathlib import Path
        p=Path(os.environ['PROJECT_DIR'])/'src/main.c'
        s=p.read_text(encoding='utf-8')

        def span(name):
            hits=list(re.finditer(r'\bstatic\s+void\s+'+re.escape(name)+r'\s*\([^;]*?\)\s*\{',s,re.S))
            if len(hits)!=1: raise RuntimeError(f'Expected one {name}, found {len(hits)}')
            a=hits[0].start(); i=hits[0].end(); depth=1; state='code'
            while i<len(s) and depth:
                c=s[i]; nxt=s[i+1] if i+1<len(s) else ''
                if state=='code':
                    if c=='/' and nxt=='/':state='line';i+=1
                    elif c=='/' and nxt=='*':state='comment';i+=1
                    elif c=='"':state='string'
                    elif c=="'":state='char'
                    elif c=='{':depth+=1
                    elif c=='}':depth-=1
                elif state=='line':
                    if c=='\n':state='code'
                elif state=='comment':
                    if c=='*' and nxt=='/':state='code';i+=1
                else:
                    if c=='\\':i+=1
                    elif (state=='string' and c=='"') or (state=='char' and c=="'"):state='code'
                i+=1
            if depth:raise RuntimeError('Unbalanced function: '+name)
            return a,i

        a,b=span('vt_v300_extend_ground'); body=s[a:b]
        old='const int near_step=180,near_cells=14;'
        if body.count(old)!=1 or body.count('const int far_step=560,far_cells=12;')!=1:
            raise RuntimeError('Unexpected V31.9.3.1 terrain layout; refusing unsafe edit')
        if 'vt_v24_ground_patch(gx,gz,near_step,near_cells,near_cells,' not in body:
            raise RuntimeError('Critical near terrain draw function not found')
        body=body.replace(old,'const int near_step=180,near_cells=10; /* V31.9.4: 100 near squares instead of 196 */')
        s=s[:a]+body+s[b:]
        a,b=span('vt_v300_mid_detail'); body=s[a:b]
        if body.count('amount>=12')!=1:raise RuntimeError('Unexpected mid detail density')
        s=s[:a]+body.replace('amount>=12','amount>=8 /* V31.9.4 distant vegetation budget */')+s[b:]

        a,b=span('vt_v292_draw_exploration_hud')
        fn=s[a:b]
        if 'vt_v3194_perf_hud(' in s:raise RuntimeError('FPS hook already inserted')
        fn=fn[:-1]+'    vt_v3194_perf_hud();\n}'
        s=s[:a]+fn+s[b:]

        a,b=span('vt_v292_draw_exploration_hud')
        helper=r'''
        /* V31.9.4: draw FPS in the bottom-right, without touching title/menu.
         * Measured over >=60 vertical retraces (about one second NTSC).
         * This value counts actual game frames, not Android screen recordings.
         * F + two digits, fixed world-HUD coordinates. Debug build only. */
        static void vt_v3188_tile(int x,int y,int w,int h,int red,int green,int blue);
        static void vt_v3194_glyph(int x,int y,const unsigned char *rows)
        {
            int yy,xx;
            for(yy=0;yy<5;yy++)for(xx=0;xx<3;xx++) {
                if(rows[yy]&(1<<(2-xx)))
                    vt_v3188_tile(x+2*xx,y+2*yy,2,2,214,241,255);
            }
        }
        static void vt_v3194_perf_hud(void)
        {
            static const unsigned char glyphs[11][5]={
                {7,5,5,5,7}, /* 0 */
                {2,6,2,2,7}, /* 1 */
                {7,1,7,4,7}, /* 2 */
                {7,1,7,1,7}, /* 3 */
                {5,5,7,1,1}, /* 4 */
                {7,4,7,1,7}, /* 5 */
                {7,4,7,5,7}, /* 6 */
                {7,1,1,1,1}, /* 7 */
                {7,5,7,5,7}, /* 8 */
                {7,5,7,1,7}, /* 9 */
                {7,4,6,4,4}  /* F */
            };
            static unsigned int start_vblank=0,frames=0;
            static int fps=0;
            unsigned int now=(unsigned int)VSync(-1);
            if(!start_vblank)start_vblank=now;
            frames++;
            if(now-start_vblank>=60u) {
                unsigned int elapsed=now-start_vblank;
                fps=(int)((frames*60u+elapsed/2u)/elapsed);
                if(fps>99)fps=99;
                frames=0;
                start_vblank=now;
            }
            vt_v3188_tile(270,215,38,16,8,18,42);
            vt_v3188_tile(270,215,38,1,48,137,204);
            vt_v3194_glyph(274,218,glyphs[10]);
            vt_v3194_glyph(286,218,glyphs[fps/10]);
            vt_v3194_glyph(296,218,glyphs[fps%10]);
        }
        '''
        s=s[:a]+helper+'\n'+s[a:]
        for feature in ('vt_v281_resolve_movement();','vt_v31813_draw_start(',
                        'vt_v3172_menu_slots(', 'vt_save_game(void)','vt_load_game(void)',
                        'V31.9.2: movement and camera use elapsed video refreshes'):
            if feature not in s:raise RuntimeError('Missing preserved feature: '+feature)
        if s.count('V31.9.4: draw FPS in the bottom-right')!=1 or s.count('vt_v3194_perf_hud();')!=1:
            raise RuntimeError('FPS insertion count invalid')
        p.write_text(s,encoding='utf-8')
        print('V31.9.4: near terrain 14x14 -> 10x10; far 12x12 unchanged')
        print('V31.9.4: distant scenery budget 12 -> 8, game FPS HUD inserted')
        print('V31.9.4: title, input, memory card, physics, dragon systems retained')
        LYDRA_V3194_PATCH
        python3 "$RUNNER_TEMP/lydra_v3194_patch.py"
