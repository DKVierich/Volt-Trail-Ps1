        if 'FntFlush(4);FntFlush(5);FntFlush(6);' in s:
            raise RuntimeError('Old font index collision still exists')
        p.write_text(s,encoding='utf-8')
        print('V31.7.2: Title fonts 5/6/7, time display remains font 4.')
        print('V31.7.2: Menu choices are interactive labels over independently highlighted rows.')
        print('V31.7.2: World render paused in title, faster movement/camera while playing.')

