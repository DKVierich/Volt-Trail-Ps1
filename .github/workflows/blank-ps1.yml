    - name: V31.7.2 Aktives Video-Menue HUD und Geschwindigkeit reparieren
      shell: bash
      run: |
        set -euo pipefail
        cat > "$RUNNER_TEMP/lydra_v3172_patch.py" <<'LYDRA_V3172_PATCH'
        #!/usr/bin/env python3
        '''V31.7.2: correct font stream numbers, replace artwork's inert slots by real menu,
        prevent 3D world rendering during the title, tune gameplay response.
        '''
        import os,re
        from pathlib import Path
        p=Path(os.environ['PROJECT_DIR'])/'src/main.c'
        s=p.read_text(encoding='utf-8')

        def once(old,new):
            global s
            n=s.count(old)
            if n!=1:
                raise RuntimeError('V31.7.2 required source marker count=%d: %r' % (n,old[:90]))
            s=s.replace(old,new,1)

        def function_span(name):
            pattern=r'\bstatic\s+(?:void|int)\s+'+re.escape(name)+r'\s*\([^;]*?\)\s*\{'
            hits=list(re.finditer(pattern,s,re.S))
            if len(hits)!=1:raise RuntimeError('V31.7.2 function missing or repeated: '+name)
            pos=hits[0].end(); depth=1; state='code'
            while pos<len(s) and depth:
                ch=s[pos]; nx=s[pos+1] if pos+1<len(s) else ''
                if state=='code':
                    if ch=='/' and nx=='/':state='line';pos+=1
                    elif ch=='/' and nx=='*':state='block';pos+=1
                    elif ch=='"':state='string'
                    elif ch=="'":state='char'
                    elif ch=='{':depth+=1
                    elif ch=='}':depth-=1
                elif state=='line':
