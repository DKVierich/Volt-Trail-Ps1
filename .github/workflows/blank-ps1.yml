        cat > android/scripts/V23Backpack.gd <<'LWOD_V23_BACKPACK'
        extends CanvasLayer

        # V23: eigener, sicher sichtbarer Rucksack-Button.
        # Der Button verwendet die urspruengliche V7-Menuefunktion direkt.
        var game: Node3D
        var overlay: Control
        var bag: Button
        var addon: Node

        func setup(root: Node3D) -> void:
            game = root
            layer = 30
            overlay = Control.new()
            overlay.name = "V23HUDOverlay"
            overlay.mouse_filter = Control.MOUSE_FILTER_IGNORE
            add_child(overlay)
            overlay.set_anchors_and_offsets_preset(Control.PRESET_FULL_RECT)

            bag = Button.new()
            bag.name = "RucksackButtonV23"
            bag.anchor_left = 1.0
            bag.anchor_right = 1.0
            bag.offset_left = -171.0
            bag.offset_right = -16.0
            bag.offset_top = 211.0
            bag.offset_bottom = 286.0
            bag.focus_mode = Control.FOCUS_NONE
            bag.mouse_filter = Control.MOUSE_FILTER_STOP
            bag.text = "RUCKSACK"
            bag.tooltip_text = "Rucksack und Spielmenue"
            bag.add_theme_font_size_override("font_size", 18)
            bag.add_theme_color_override("font_color", Color("#f7e2bd"))
            bag.add_theme_color_override("font_hover_color", Color("#ffffff"))
            var texture: Texture2D = load("res://assets/v22_backpack.png") as Texture2D
            if texture != null:
                bag.icon = texture
                bag.expand_icon = true
                bag.icon_alignment = HORIZONTAL_ALIGNMENT_LEFT
            var base := StyleBoxFlat.new()
            base.bg_color = Color(0.09, 0.05, 0.17, 0.82)
            base.border_color = Color("#d8b27b")
            base.set_border_width_all(2)
            base.set_corner_radius_all(13)
            for state_name in ["normal", "hover", "pressed", "focus"]:
                bag.add_theme_stylebox_override(state_name, base)
            overlay.add_child(bag)
            bag.pressed.connect(_open_bag)

            # Alte Schaltflaeche nicht mehr zeichnen, Signal/Spielmenue bleiben vorhanden.
            if game.backpack_button != null:
                game.backpack_button.hide()
            for child in game.get_children():
                if child.has_method("_toggle_bag"):
                    addon = child
                    break
            if addon != null:
                # Menue nach links setzen, damit es nicht unter dem HUD-Button liegt.
                var old_panel = addon.get("bag_panel")
                if old_panel is Control:
                    (old_panel as Control).position = Vector2(690, 116)
            else:
                push_warning("V23: V7-Menuecontroller fehlt. Rucksack nutzt Originalsignal.")
            set_process(true)
            print("V23: eigenstaendiger Rucksack-Button und 8 Eintraege aktiv")

        func _open_bag() -> void:
            if game == null or game.state != 2:
                return
            if addon != null and is_instance_valid(addon):
                addon.call("_toggle_bag")
            elif game.backpack_button != null:
                game.backpack_button.pressed.emit()
            else:
                push_warning("V23: Rucksack-Menuecontroller nicht vorhanden")

        func _process(_delta: float) -> void:
            if game == null:
                return
            overlay.visible = game.state == 2
            if game.backpack_button != null and game.backpack_button.visible:
                game.backpack_button.hide()
        LWOD_V23_BACKPACK
