    - name: V41.4 Skinning, Animation und Einbindung testen
      shell: bash
      run: |
        set -euo pipefail
        cat > android/tests/V4140RigSmoke.gd <<'GD_V4140_TEST'
        extends SceneTree
        class TestGame:
            extends Node3D
            var hero: Node3D
            var phoenix: Node3D

        func _initialize() -> void:
            call_deferred("_run")

        func _find_rig(n: Node) -> Skeleton3D:
            if n is Skeleton3D:
                return n as Skeleton3D
            for c in n.get_children():
                var rig: Skeleton3D = _find_rig(c)
                if rig != null: return rig
            return null

        func _find_anim(n: Node) -> AnimationPlayer:
            if n is AnimationPlayer:
                return n as AnimationPlayer
            for c in n.get_children():
                var a: AnimationPlayer = _find_anim(c)
                if a != null: return a
            return null

        func _contains_clip(player: AnimationPlayer, text: String) -> bool:
            if player == null: return false
            for key in player.get_animation_list():
                if String(key).to_lower().contains(text.to_lower()):return true
            return false

        func _run() -> void:
            var paths: Array[String] = ["res://assets/characters/LWOD_Heldin_V4140.glb", "res://assets/characters/LWOD_Phoenix_Violett_V4140.glb"]
            for path in paths:
                var res: PackedScene = load(path) as PackedScene
                if res == null:
                    push_error("V4140: GLB nicht importierbar: " + path)
                    quit(1)
                    return
                var inst: Node = res.instantiate()
                root.add_child(inst)
                var skel: Skeleton3D = _find_rig(inst)
                var anim: AnimationPlayer = _find_anim(inst)
                if skel == null or anim == null or skel.get_bone_count() < 9:
                    push_error("V4140: Echte Knochen oder AnimationPlayer fehlen: " + path)
                    quit(2)
                    return
                if path.contains("Heldin"):
                    if not _contains_clip(anim,"Idle") or not _contains_clip(anim,"Walk"):
                        push_error("V4140: Idle und Walk fehlen")
                        quit(3)
                        return
                else:
                    if not _contains_clip(anim,"Flap") or not _contains_clip(anim,"Glide"):
                        push_error("V4140: Flap und Glide fehlen")
                        quit(4)
                        return
                # Check that skinned joints actually move when animation advances.
                var bone_name: String = "LeftLeg" if path.contains("Heldin") else "WingL"
                var clip_name: String = "Walk" if path.contains("Heldin") else "Flap"
                var bone_index: int = skel.find_bone(bone_name)
                if bone_index < 0:
                    push_error("V4140: Animierter Knochen fehlt: " + bone_name)
                    quit(7)
                    return
                var matching_clip: String = ""
                for c in anim.get_animation_list():
                    if String(c).to_lower().contains(clip_name.to_lower()):
                        matching_clip = String(c)
                        break
                if matching_clip.is_empty():
                    push_error("V4140: Clip nicht gefunden: " + clip_name)
                    quit(8)
                    return
                anim.play(matching_clip)
                anim.advance(0.22)
                var pose_a: Quaternion = skel.get_bone_pose_rotation(bone_index)
                anim.advance(0.41)
                var pose_b: Quaternion = skel.get_bone_pose_rotation(bone_index)
                if pose_a.angle_to(pose_b) < 0.025:
                    push_error("V4140: Knochen bewegt sich nicht: " + bone_name)
                    quit(9)
                    return
                inst.queue_free()
            var g := TestGame.new()
            root.add_child(g)
            g.hero = Node3D.new()
            g.phoenix = Node3D.new()
            g.add_child(g.hero)
            g.add_child(g.phoenix)
            var loader: Script = load("res://scripts/V4094HeroPhoenix.gd") as Script
            if loader == null or not loader.can_instantiate():
                push_error("V4140: Ladeskript nicht gültig")
                quit(5)
                return
            var helper: Node = loader.new()
            g.add_child(helper)
            helper.call("setup",g)
            helper.call("_bind_characters")
            var hv: Node3D = g.hero.get_node_or_null("LWOD_V4094_HeroVisual") as Node3D
            var pv: Node3D = g.phoenix.get_node_or_null("LWOD_V4094_PhoenixVisual") as Node3D
            if hv == null or pv == null or not hv.has_meta("lwod_v4140_hero") or not pv.has_meta("lwod_v4140_unique_phoenix"):
                push_error("V4140: Figuren wurden im Spiel nicht eingebunden")
                quit(6)
                return
            helper.call("_process",0.08)
            print("V4140_SKINNED_CHARACTER_OK: 15 und 10 Knochen, 4 Clips, echte Pose-Bewegung")
            quit(0)
        GD_V4140_TEST
        timeout --signal=TERM --kill-after=5s 115s godot --headless --path android --quit-after 250 --script res://tests/V4140RigSmoke.gd 2>&1 | tee /tmp/lwod4100_rig.log
        if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Invalid call|Failed to load script|ERROR: Cannot load' /tmp/lwod4100_rig.log; then
          exit 1
        fi
        grep -Fq 'V4140_SKINNED_CHARACTER_OK:' /tmp/lwod4100_rig.log
    - name: V41.5 Touch, Tastatur und sofortige Laufanimation pruefen
      shell: bash
      run: |
        set -euo pipefail
        cat > android/tests/V4140ResponsiveWalk.gd <<'GD4140_WALK'
        extends SceneTree
        class TestGame:
            extends Node3D
            var hero: Node3D
            var phoenix: Node3D
        func _initialize() -> void:
            call_deferred("_run")
        func _run() -> void:
            var g := TestGame.new()
            root.add_child(g)
            g.hero = Node3D.new()
            g.phoenix = Node3D.new()
            g.add_child(g.hero)
            g.add_child(g.phoenix)
            var src: Script = load("res://scripts/V4094HeroPhoenix.gd") as Script
            if src == null or not src.can_instantiate():
                push_error("V4140: loader invalid")
                quit(1)
                return
            var visual: Node = src.new()
            g.add_child(visual)
            visual.call("setup",g)
            visual.call("_bind_characters")
            var animator: AnimationPlayer = visual.get("hero_anim") as AnimationPlayer
            if animator == null:
                push_error("V4140: no AnimationPlayer")
                quit(2)
                return
            visual.call("_process",0.016)
            g.hero.position.x = 0.06
            visual.call("_process",0.016)
            var clip: String = String(animator.current_animation)
            if not clip.to_lower().contains("walk"):
                push_error("V4140: walking animation starts too late: " + clip)
                quit(3)
                return
            for i in range(12):
                visual.call("_process",0.016)
            clip = String(animator.current_animation)
            if not clip.to_lower().contains("idle"):
                push_error("V4140: idle transition did not occur: " + clip)
                quit(4)
                return
            # Simulated left thumb without any physical movement.
            var base_pos: Vector3 = g.hero.position
            var rect: Vector2 = visual.get_viewport().get_visible_rect().size
            var press := InputEventScreenTouch.new()
            press.index = 7
            press.pressed = true
            press.position = Vector2(rect.x*0.13,rect.y*0.80)
            visual.call("_input", press)
            var finger := InputEventScreenDrag.new()
            finger.index = 7
            finger.position = press.position+Vector2(0,-26)
            visual.call("_input", finger)
            clip = String(animator.current_animation)
            if not clip.to_lower().contains("walk"):
                push_error("V4150: Touch fails to trigger walk immediately: "+clip)
                quit(5)
                return
            if g.hero.position != base_pos:
                push_error("V4150: Visual input changed physical player position")
                quit(6)
                return
            var release := InputEventScreenTouch.new()
            release.index = 7
            release.pressed = false
            release.position = finger.position
            visual.call("_input", release)
            for frame in range(12):
                visual.call("_process",0.016)
            if not String(animator.current_animation).to_lower().contains("idle"):
                push_error("V4150: Animation did not return to idle after release")
                quit(7)
                return
            print("V4150_TOUCH_FIRST_EVENT_OK: movement visuals before displacement")
            print("V4140_WALK_REACTS_FIRST_FRAME_OK")
            quit(0)
        GD4140_WALK
        timeout --signal=TERM --kill-after=5s 90s \
          godot --headless --path android --quit-after 300 --script res://tests/V4140ResponsiveWalk.gd \
          2>&1 | tee /tmp/lwod4140_walk.log
        if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Invalid call|Failed to load script' /tmp/lwod4140_walk.log; then
          exit 1
        fi
        grep -Fq 'V4140_WALK_REACTS_FIRST_FRAME_OK' /tmp/lwod4140_walk.log
        grep -Fq 'V4150_TOUCH_FIRST_EVENT_OK' /tmp/lwod4140_walk.log
    - name: V41.6 Eigenflug, Abstand, Bremsen und Endposition testen
      shell: bash
      run: |
        set -euo pipefail
        cat > android/tests/V416PhoenixSmoke.gd <<'V416_SMOKE'
        extends SceneTree
        class FakeGame:
            extends Node3D
            var hero: Node3D
            var phoenix: Node3D
            var state: int = 2

        func _initialize() -> void:
            call_deferred("_test")

        func _test() -> void:
            var g := FakeGame.new()
            g.name = "Game"
            root.add_child(g)
            g.hero = Node3D.new()
            g.phoenix = Node3D.new()
            g.add_child(g.hero)
            g.add_child(g.phoenix)
            var code: Script = load("res://scripts/V416PhoenixFlight.gd") as Script
            if code == null or not code.can_instantiate():
                push_error("V416: companion flight script cannot load")
                quit(1)
                return
            var follow: Node = code.new()
            follow.name = "V416PhoenixFlight"
            g.add_child(follow)
            follow.call("setup", g)
            var initial: Vector3 = g.phoenix.position
            # A finger-speed-like fast player change must NOT immediately teleport the bird.
            g.hero.position.z = -1.1
            follow.call("_process",0.016)
            if g.phoenix.position.distance_to(initial) > 0.28:
                push_error("V416: phoenix still tied directly to player")
                quit(2)
                return
            for i in range(110):
                g.hero.position.z -= 0.052
                follow.call("_process",0.016)
            var gained: float = g.phoenix.position.distance_to(initial)
            if gained < 0.45 or gained > 9.0:
                push_error("V416: chase acceleration or distance unrealistic: " + str(gained))
                quit(3)
                return
            for i in range(280):
                follow.call("_process",0.016)
            if float(follow.get("flight_speed")) > 0.25:
                push_error("V416: phoenix failed to brake and stop")
                quit(4)
                return
            var stopped_at: Vector3 = g.phoenix.position
            for i in range(70):
                follow.call("_process",0.016)
            if g.phoenix.position.distance_to(stopped_at) > 0.12:
                push_error("V416: idle phoenix still glued to a moving camera/target")
                quit(5)
                return
            print("V416_FOLLOW_OK: smooth independent chase, braking, stable hover")
            quit(0)
        V416_SMOKE
        # Refuse to build if some other code can drag the companion again.
        python3 - <<'PY_V416_GUARD'
