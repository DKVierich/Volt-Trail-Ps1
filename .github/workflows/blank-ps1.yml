              draw_box(x + 18, 6, z, 10, r, g, b);
              draw_box(x, -18, z, 12, r, g, b);
          }

          static void vt_v24_path_band(int z, int width, int r, int g, int b) {
              int x0 = -width;
              int x1 = width;
              SVECTOR a = {x0 - px, 34, z - pz, 0};
              SVECTOR b0 = {x1 - px, 34, z - pz, 0};
