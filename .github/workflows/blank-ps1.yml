        }
        '''
        once('static void vt_v314_draw(void) {',menus+'\nstatic void vt_v314_draw(void) {')
        def fix_title_render(src):
            # Remove old unused submenu rectangle; the new overlay occupies the correct slot area.
            target='if(vt_v314_phase==3) {'
            if src.count(target)!=1:raise RuntimeError('Old options panel unexpected')
            src=src.replace(target,'if(0) { /* replaced by V31.7.2 menu overlay */',1)
            anchor='    aligned=(prim_used+3u)&~3u;\n    if(aligned+sizeof(POLY_FT4)'
            if src.count(anchor)!=1:raise RuntimeError('Title textured quad anchor missing')
            src=src.replace(anchor,'    vt_v3172_menu_slots();\n'+anchor,1)
            return src
        edit_function('vt_v314_draw',fix_title_render)

        # Disable costly 3D scene when title is visible (but do not touch the active save
        # structure, controls or geometry). Declare active flag before world function.
        once('static int vt_v314_active=1;', '/* vt_v314_active declared before overworld drawing below. */')
        once('static void vt_v24_draw_overworld(void) {',
