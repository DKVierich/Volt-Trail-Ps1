      - name: V29.3 Kameraschwenk und Laufrichtung reparieren
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/lydra_v293_steuerung_patch.py" <<'PY'
          #!/usr/bin/env python3
          """V29.3: Camera-relative forward/backward, turn-only L/R, direction-facing hero.
          
          Applied after all previous V29.2 build steps and before PSn00bSDK build.
          """
          import math
          import os
          import re
          from pathlib import Path
          
          source = Path(os.environ['PROJECT_DIR']) / 'src/main.c'
          s = source.read_text(encoding='utf-8')
          
          
          def function_span(name):
              pat = r'\bstatic\s+void\s+' + re.escape(name) + r'\s*\([^;]*?\)\s*\{'
              matches = list(re.finditer(pat, s, re.S))
              if len(matches) != 1:
                  raise RuntimeError('V29.3: function ' + name + ' was found ' + str(len(matches)) + ' times')
              m = matches[0]
              i, depth, state = m.end(), 1, 'code'
              while i < len(s) and depth:
                  ch = s[i]
                  nex = s[i + 1] if i + 1 < len(s) else ''
                  if state == 'code':
                      if ch == '/' and nex == '/': state = 'line'; i += 1
                      elif ch == '/' and nex == '*': state = 'block'; i += 1
                      elif ch == '"': state = 'string'
                      elif ch == "'": state = 'char'
                      elif ch == '{': depth += 1
                      elif ch == '}': depth -= 1
                  elif state == 'line':
                      if ch == '\n': state = 'code'
                  elif state == 'block':
                      if ch == '*' and nex == '/': state = 'code'; i += 1
                  else:
                      if ch == '\\': i += 1
                      elif (state == 'string' and ch == '"') or (state == 'char' and ch == "'"):
                          state = 'code'
                  i += 1
              if depth: raise RuntimeError('V29.3: Unclosed C function ' + name)
              return m.start(), m.end(), i - 1, i
          
          
          # 64-sample fixed-point sine table, avoids float/fpu and new SDK dependencies.
          vals = [round(1024 * math.sin((i * 2 * math.pi) / 64)) for i in range(64)]
          values = ',\n    '.join(', '.join(str(v) for v in vals[i:i+8]) for i in range(0,64,8))
          
          helpers = r'''
          /* V29.3: camera-relative movement, classic tank-style turning.
             0..4095 angular units, lookup only: cheap on original PlayStation.
             Buttons are the *logical* buttons after the existing OPTIONS remapper. */
          static const short vt_v293_sin_table[64] = {
              __SINE_VALUES__
          };
          static int vt_v293_sin(int angle) {
              return vt_v293_sin_table[((angle + 32) & 4095) >> 6];
          }
          static int vt_v293_cos(int angle) {
              return vt_v293_sin(angle + 1024);
          }
          static int vt_v293_avatar_yaw = 2048;
          static int vt_v293_model_x = 0;
          static int vt_v293_model_z = 0;
          static void vt_v293_rotate_mesh_point(int x,int z,int *out_x,int *out_z) {
              int dx=x-vt_v293_model_x;
              int dz=z-vt_v293_model_z;
              int sn=vt_v293_sin(vt_v293_avatar_yaw);
              int cs=vt_v293_cos(vt_v293_avatar_yaw);
              *out_x=vt_v293_model_x + (dx*cs + dz*sn)/1024;
              *out_z=vt_v293_model_z + (-dx*sn + dz*cs)/1024;
          }
          static void vt_v293_player_box(int x,int y,int z,int size,int r,int g,int b) {
              int a,c;
              vt_v293_rotate_mesh_point(x,z,&a,&c);
              draw_box(a,y,c,size,r,g,b);
          }
          static void vt_v293_player_pyramid(int x,int y,int z,int size,int height,int r,int g,int b) {
              int a,c;
              vt_v293_rotate_mesh_point(x,z,&a,&c);
              vt_pyramid(a,y,c,size,height,r,g,b);
          }
          static void vt_v293_move(unsigned int pad) {
              int direction=0;
              int dx,dz;
              /* RIGHT looks right: rotate the scenery left; LEFT looks left.
                 Rotation matrix uses world-to-view yaw, so right is negative yaw. */
              if ((pad & PAD_RIGHT) && !(pad & PAD_LEFT))
                  vt_v292_cam_yaw=(vt_v292_cam_yaw+4096-64)&4095;
              else if ((pad & PAD_LEFT) && !(pad & PAD_RIGHT))
                  vt_v292_cam_yaw=(vt_v292_cam_yaw+64)&4095;
              vt_v292_yaw_target=vt_v292_cam_yaw;
          
              if ((pad & PAD_UP) && !(pad & PAD_DOWN)) direction=1;
              else if ((pad & PAD_DOWN) && !(pad & PAD_UP)) direction=-1;
              if (!direction) return;
          
              /* Camera forward in world coordinates: (-sin(yaw), 0, cos(yaw)).
                 D-Pad DOWN goes backwards; horizontal buttons never translate. */
              dx=direction*(-vt_v293_sin(vt_v292_cam_yaw)*4)/1024;
              dz=direction*(vt_v293_cos(vt_v292_cam_yaw)*4)/1024;
              px += dx;
              pz += dz;
              if(px < -WORLD_LIMIT) px=-WORLD_LIMIT;
              if(px > WORLD_LIMIT) px=WORLD_LIMIT;
              if(pz < -WORLD_LIMIT) pz=-WORLD_LIMIT;
              if(pz > WORLD_LIMIT) pz=WORLD_LIMIT;
              if(dx || dz) step_count++;
          
              /* V27's face decorations sit on local -Z. Rotate that face towards
                 the movement vector; when reversing, the figure looks backwards. */
              vt_v293_avatar_yaw = ((direction>0 ? 2048 : 0) - vt_v292_cam_yaw + 4096)&4095;
              if (dx>0 && dx>= (dz<0?-dz:dz)) facing=2;
              else if (dx<0 && -dx>= (dz<0?-dz:dz)) facing=1;
              else facing=(dz>=0)?3:0;
          }
          '''.replace('__SINE_VALUES__', values)
          
          # The legacy world-relative move must be replaced: simply adding turn input
          # would still cause the reversed movement visible in the screenshots.
          lines = s.splitlines(keepends=True)
          start_positions = [i for i,line in enumerate(lines) if re.match(r'^\s*if\s*\(\s*pad\s*&\s*PAD_LEFT\s*\)\s*\{\s*px\s*-=', line)]
          if len(start_positions) != 1:
              raise RuntimeError('V29.3: could not locate original left/right/up/down movement; found '+str(len(start_positions)))
          start = start_positions[0]
          expected = (
              ("PAD_LEFT", "px"), ("PAD_RIGHT", "px"),
              ("PAD_UP", "pz"), ("PAD_DOWN", "pz"),
          )
          for i,(button, axis) in enumerate(expected):
              line = lines[start+i]
              if not (f'pad & {button}' in line and re.search(r'\b'+axis+r'\s*[+-]=',line)
                      and 'step_count++' in line and 'facing=' in line):
                  raise RuntimeError('V29.3: unexpected movement body '+repr(line))
          lines[start:start+4] = ['            vt_v293_move((unsigned int)pad);\n']
          s = ''.join(lines)
          
          # Prevent V29.2 camera-follow code from undoing the D-Pad turn in the
          # same frame. Movement and camera now share one explicit heading.
          a,opening,closing,end = function_span('vt_v292_update_camera')
          s = s[:a] + '''static void vt_v292_update_camera(void) {
              /* V29.3: manual turn-only D-Pad yaw, no automatic direction switch. */
              vt_v292_yaw_target = vt_v292_cam_yaw;
          }''' + s[end:]
          
          # The player has stylized axis-aligned meshes. Turn its facial accents,
          # hair, clothing and body details around the model center without changing
          # the world geometry, NPCs, or the companion dragon.
          a,opening,closing,end = function_span('vt_player')
          body = s[opening:closing]
          old_boxes = len(re.findall(r'\bdraw_box\s*\(',body))
          old_pyramids = len(re.findall(r'\bvt_pyramid\s*\(',body))
          if old_boxes < 2:
              raise RuntimeError('V29.3: vt_player mesh calls changed: '+str(old_boxes))
          body = re.sub(r'\bdraw_box\s*\(', 'vt_v293_player_box(', body)
          body = re.sub(r'\bvt_pyramid\s*\(', 'vt_v293_player_pyramid(', body)
          body = '\n    vt_v293_model_x=x; vt_v293_model_z=z;\n' + body
          s = s[:opening] + body + s[closing:]
          
          # The V29.2 HUD helper originally declares yaw below vt_player. Move the two
          # global yaw definitions above vt_player so the movement helpers compile in C99.
          yaw_decls='static int vt_v292_cam_yaw=0;\nstatic int vt_v292_yaw_target=0;\n'
          if s.count(yaw_decls)!=1:
              raise RuntimeError('V29.3: camera variables not found at expected anchor')
          s=s.replace(yaw_decls,'',1)
          # Put helpers before vt_player: vt_pyramid and draw_box are already defined.
          a,opening,closing,end = function_span('vt_player')
          s = s[:a] + yaw_decls + helpers + '\n' + s[a:]
          
          # Rename movement instructions in OPTIONS; keep saved key assignments untouched.
          s=s.replace('"GEHEN HOCH", "GEHEN RUNTER", "GEHEN LINKS", "GEHEN RECHTS",',
                      '"VORWAERTS", "RUECKWAERTS", "KAMERA LINKS", "KAMERA RECHTS",')
          
          checks = [
           'vt_v293_move((unsigned int)pad);',
           'vt_v292_yaw_target = vt_v292_cam_yaw;',
           'vt_v293_player_box(',
           'vt_v293_player_pyramid(',
           'vt_v293_avatar_yaw',
           'vt_v281_resolve_movement();',
           'vt_v292_draw_exploration_hud();',
           'vt_v282_draw_house_npcs(x,z);',
           'vt_opt_draw_page();',
           'vt_save_game(void)', 'vt_load_game(void)', 'vt_v21_party[3]',
          ]
          for marker in checks:
              if marker not in s: raise RuntimeError('V29.3 retained feature missing: '+marker)
          if s.count('vt_v293_move((unsigned int)pad);') != 1:
              raise RuntimeError('V29.3: duplicate movement hook')
          source.write_text(s, encoding='utf-8')
          print('V29.3: Up/Down forward and backward relative to camera; Left/Right turn only')
          print('V29.3: Player body decorations rotate with movement; original worlds and save files untouched')
          print('V29.3: Rotated',old_boxes,'boxes and',old_pyramids,'pyramids in player mesh')
          PY
          python3 "$RUNNER_TEMP/lydra_v293_steuerung_patch.py"

      - name: V30.0 – 360 Grad Boden, Ferngebirge und LOD
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PROJECT_DIR:-}" && test -f "$PROJECT_DIR/src/main.c"
          cat > "$RUNNER_TEMP/lydra_v300_world_patch.py" <<'PY'
          #!/usr/bin/env python3
          """Lydra V30.0: camera-safe 360-degree terrain, distance LOD and skyline.
          Apply to the fully reconstructed V29.3 C source, before the PSn00bSDK build.
          Does not modify save data, collision, NPC state, combat or input mappings.
          """
          import os
          import re
          from pathlib import Path
          
          src=Path(os.environ['PROJECT_DIR'])/'src/main.c'
          code=src.read_text(encoding='utf-8')
          
          def function_span(name):
              pat=r'\bstatic\s+void\s+'+re.escape(name)+r'\s*\([^;]*?\)\s*\{'
              matches=list(re.finditer(pat,code,re.S))
              if len(matches)!=1: raise RuntimeError('V30.0: expected one function '+name+': '+str(len(matches)))
              m=matches[0];pos=m.end();depth=1;state='normal'
              while pos<len(code) and depth:
                  ch=code[pos];nxt=code[pos+1] if pos+1<len(code) else ''
                  if state=='normal':
                      if ch=='/' and nxt=='/':state='line';pos+=1
                      elif ch=='/' and nxt=='*':state='block';pos+=1
                      elif ch=='"':state='string'
                      elif ch=="'":state='character'
                      elif ch=='{':depth+=1
                      elif ch=='}':depth-=1
                  elif state=='line':
                      if ch=='\n':state='normal'
                  elif state=='block':
                      if ch=='*' and nxt=='/':state='normal';pos+=1
                  elif state in ('string','character'):
                      if ch=='\\':pos+=1
                      elif (ch=='"' if state=='string' else ch=="'"):state='normal'
                  pos+=1
              if depth:raise RuntimeError('V30.0: unbalanced braces '+name)
              return m.start(),m.end(),pos-1,pos
          
          if 'static void vt_v300_extend_ground(void)' in code:
              raise RuntimeError('V30.0: patch was already applied')
          for dependency in ('vt_v293_sin(', 'vt_v293_cos(', 'vt_v292_cam_yaw',
                             'vt_v281_resolve_movement();', 'vt_v282_draw_house_npcs(',
                             'vt_v292_draw_exploration_hud();', 'vt_opt_draw_page();',
                             'vt_save_game(void)', 'vt_load_game(void)'):
              if dependency not in code:raise RuntimeError('V30.0 missing V29.3 dependency: '+dependency)
          
          addon=r'''
          /* LYDRA V30.0: 360-degree terrain around the moving player.
             No new physics: collision and Memory Card formats are unchanged.
             Nearby terrain stays flat (Y=35) to keep the hero above ground. */
          #define VT_V300_NEAR_STEP 130
          #define VT_V300_NEAR_CELLS 14
          #define VT_V300_FAR_STEP 250
          #define VT_V300_FAR_CELLS 16
          #define VT_V300_FAR_CELL_BUDGET 138
          
          static int vt_v300_abs(int n) { return n<0?-n:n; }
          static int vt_v300_forward(int dx, int dz) {
              return (-dx*vt_v293_sin(vt_v292_cam_yaw)
                       +dz*vt_v293_cos(vt_v292_cam_yaw))/1024;
          }
          static int vt_v300_lateral(int dx, int dz) {
              return (dx*vt_v293_cos(vt_v292_cam_yaw)
                      +dz*vt_v293_sin(vt_v292_cam_yaw))/1024;
          }
          static int vt_v300_in_view(int dx, int dz, int slack) {
              int ahead=vt_v300_forward(dx,dz);
              if(ahead < -slack || ahead>3450)return 0;
              return vt_v300_abs(vt_v300_lateral(dx,dz))
                     < (ahead>0 ? ahead : 0) + slack;
          }
          static int vt_v300_hash(int x,int z) {
              unsigned int a=(unsigned int)(x/250);
              unsigned int b=(unsigned int)(z/250);
              unsigned int h=a*374761393u+b*668265263u+(unsigned int)region*1274126177u;
              h^=h>>13; h*=1274126177u; h^=h>>16;
              return (int)(h&255u);
          }
          static void vt_v300_extend_ground(void) {
              int gx,gz,ix,iz,rendered=0;
              int r1,g1,b1,r2,g2,b2;
              /* Two LOD rings: near mesh is centered in X and Z, unlike the old
                 positive-Z-only patch. Medium distance uses larger triangles. */
              if(region==1) {
                  r1=84;g1=134;b1=128;r2=62;g2=108;b2=112;
              } else if(region==2) {
                  r1=116;g1=143;b1=87;r2=78;g2=111;b2=77;
              } else {
                  r1=85;g1=162;b1=90;r2=54;g2=132;b2=75;
              }
              gx=(px/VT_V300_NEAR_STEP)*VT_V300_NEAR_STEP-7*VT_V300_NEAR_STEP;
              gz=(pz/VT_V300_NEAR_STEP)*VT_V300_NEAR_STEP-7*VT_V300_NEAR_STEP;
              vt_v24_ground_patch(gx,gz,VT_V300_NEAR_STEP,
                 VT_V300_NEAR_CELLS,VT_V300_NEAR_CELLS,
                 r1,g1,b1,r2,g2,b2);
          
              gx=(px/VT_V300_FAR_STEP)*VT_V300_FAR_STEP-8*VT_V300_FAR_STEP;
              gz=(pz/VT_V300_FAR_STEP)*VT_V300_FAR_STEP-8*VT_V300_FAR_STEP;
              for(iz=0;iz<VT_V300_FAR_CELLS;iz++) {
                  for(ix=0;ix<VT_V300_FAR_CELLS;ix++) {
                      int wx=gx+ix*VT_V300_FAR_STEP;
                      int wz=gz+iz*VT_V300_FAR_STEP;
                      int dx=wx+VT_V300_FAR_STEP/2-px;
                      int dz=wz+VT_V300_FAR_STEP/2-pz;
                      int n=vt_v300_hash(wx,wz)&3;
                      /* Hide large low-detail triangles under the detailed center;
                         leave generous overlap behind it to prevent visible holes. */
                      if(vt_v300_abs(dx)<670 && vt_v300_abs(dz)<670)continue;
                      if(!vt_v300_in_view(dx,dz,410))continue;
                      if(rendered>=VT_V300_FAR_CELL_BUDGET)return;
                      vt_v241_flat(wx,wz,wx+VT_V300_FAR_STEP,wz+VT_V300_FAR_STEP,
                                   36,r1-(n*3),g1-(n*3),b1-(n*2));
                      rendered++;
                  }
              }
          }
          
          /* A virtual skyline: stable compass-relative mountain silhouettes.
             It follows the camera position rather than building thousands of faraway
             3-D objects. Landscape detail is kept out of physics and saves. */
          static void vt_v300_horizon(void) {
              int i;
              for(i=0;i<16;i++) {
                  int angle=i*256;
                  int mx=px+(vt_v293_sin(angle)*2450)/1024;
                  int mz=pz+(vt_v293_cos(angle)*2450)/1024;
                  int ahead=vt_v300_forward(mx-px,mz-pz);
                  int wide=275+(i%3)*65;
                  int high=310+((i*7+region*3)%5)*63;
                  int r=96,g=135,b=169;
                  if(ahead<370 || !vt_v300_in_view(mx-px,mz-pz,540))continue;
                  if(region==1){r=91;g=151;b=192;high+=85;}
                  if(region==2){r=108;g=127;b=156;high+=30;}
                  vt_v24_peak(mx,mz,wide,high,r,g,b);
                  /* Lower foothills give mountain bases a transition to ground. */
                  if((i&1)==0) {
                      int hx=px+(vt_v293_sin(angle)*1530)/1024;
                      int hz=pz+(vt_v293_cos(angle)*1530)/1024;
                      vt_v24_peak(hx,hz,220,120+(i%3)*26,
                         region==1?80:73,region==1?131:121,region==1?139:91);
                  }
              }
          }
          
          /* Distant forest/detail patch, aligned to the world grid for stable visuals.
             Cheap pseudo-random placement ensures plants do not move when player walks. */
          static void vt_v300_mid_detail(void) {
              int ix,iz,amount=0;
              int x0=(px/300)*300-1500;
              int z0=(pz/300)*300-1500;
              for(iz=0;iz<11;iz++)for(ix=0;ix<11;ix++) {
                  int x=x0+ix*300;
                  int z=z0+iz*300;
                  int dx=x-px,dz=z-pz;
                  int h=vt_v300_hash(x,z);
                  if(vt_v300_abs(dx)<510 && vt_v300_abs(dz)<510)continue;
                  if(vt_v300_abs(dx)>1450 || vt_v300_abs(dz)>1450)continue;
                  if(!vt_v300_in_view(dx,dz,200))continue;
                  if((h&7)>2 || amount>=16)continue;
                  /* No scenery in the middle of the original north-south road. */
                  if(vt_v300_abs(x)<135)continue;
                  if(region==1) {
                      draw_box(x,16,z,11,72,150,181);
                      vt_pyramid(x,-14,z,13,31,125,207,232);
                  } else if(region==2) {
                      vt_v24_tree(x,z,10+(h&3)*2,2);
                  } else {
                      vt_v24_tree(x,z,12+(h&3)*2,h%3);
                  }
                  amount++;
              }
          }
          '''
          
          # Insert helpers into world helper section (after existing triangle/peak/tree helpers,
          # before vt_v241_ground). Their forward references are already available in V29.3.
          a,opening,closing,end=function_span('vt_v241_ground')
          code=code[:a]+addon+'\n'+code[a:]
          a,opening,closing,end=function_span('vt_v241_ground')
          # Replace the old asymmetric patch body, retain function name and caller intact.
          code=code[:opening]+'\n    vt_v300_extend_ground();\n'+code[closing:]
          
          # Draw mid/far decoration in the existing world function, with all original
          # architecture, doors, NPCs, battles and PS1 UI still controlled by older code.
          a,opening,closing,end=function_span('vt_v24_draw_overworld')
          body=code[opening:closing]
          needle='vt_v241_ground();'
          if body.count(needle)!=1: raise RuntimeError('V30.0: overworld ground anchor changed')
          body=body.replace(needle,needle+'\n    vt_v300_horizon();\n    vt_v300_mid_detail();',1)
          code=code[:opening]+body+code[closing:]
          
          if code.count('vt_v300_extend_ground();')!=1 or code.count('vt_v300_horizon();')!=1:
              raise RuntimeError('V30.0: duplicate/absent drawing hook')
          for marker in ('vt_v293_move((unsigned int)pad);', 'vt_v281_resolve_movement();',
                         'vt_v282_draw_house_npcs(', 'vt_v292_draw_exploration_hud();',
                         'vt_v21_party[3]'):
              if marker not in code:raise RuntimeError('V30.0: lost existing feature '+marker)
          src.write_text(code,encoding='utf-8')
          print('V30.0: near 360-degree terrain (14x14), frustum-culled distant ring (<=138 tiles).')
          print('V30.0: 16 skyline segments, region-specific colors, up to 16 distant forest props.')
          print('V30.0: unchanged physics/controls/menus/Memory Card. PS1 runtime test outstanding.')
          PY
          python3 "$RUNNER_TEMP/lydra_v300_world_patch.py"
          echo "V30.0 Welt-Patch erstellt; unveraenderter PS1 Build folgt."


      - name: V30.1 Sichtbarkeit Spieler Himmel Sonne Tag Nacht und Menuefenster
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/lydra_v301_visibility_patch.py" <<'PY'
          #!/usr/bin/env python3
          """V30.1: visibility fixes, fuller sky, compact menu panel and simple day/night display."""
          import os, re
          from pathlib import Path
          p=Path(os.environ['PROJECT_DIR'])/'src/main.c'
          s=p.read_text(encoding='utf-8')
          def once(old,new):
              global s
              hits=s.count(old)
              if hits!=1:
                  raise RuntimeError('V30.1 anchor not found uniquely: %r count=%d'%(old[:80],hits))
              s=s.replace(old,new,1)
          replacements=[
              ('#define VT_V300_NEAR_CELLS 14','#define VT_V300_NEAR_CELLS 18'),
              ('#define VT_V300_FAR_CELLS 16','#define VT_V300_FAR_CELLS 20'),
              ('#define VT_V300_FAR_CELL_BUDGET 138','#define VT_V300_FAR_CELL_BUDGET 220'),
              ('if(ahead < -slack || ahead>3450)return 0;','if(ahead < -(slack*4) || ahead>4300)return 0;'),
          ]
          for old,new in replacements:
              once(old,new)
          once('draw_box(a,y,c,size,r,g,b);','draw_box(a,y-12,c,size,r,g,b);')
          once('vt_pyramid(a,y,c,size,height,r,g,b);','vt_pyramid(a,y-12,c,size,height,r,g,b);')
          if 'camera_pos.vy = 62 + vt_v28_camera_blend / 3;' in s:
              once('camera_pos.vy = 62 + vt_v28_camera_blend / 3;','camera_pos.vy = 76 + vt_v28_camera_blend / 3;')
          if 'camera_pos.vz = CAMERA_Z - vt_v28_camera_blend;' in s:
              once('camera_pos.vz = CAMERA_Z - vt_v28_camera_blend;','camera_pos.vz = CAMERA_Z - vt_v28_camera_blend - 36;')
          once('setXY0(panel, 11, 65);','setXY0(panel, 24, 70);')
          once('setWH(panel, 298, 169);','setWH(panel, 214, 112);')
          once('FntOpen(247, 6, 69, 65, 0, 128); /* compass */',
               'FntOpen(247, 6, 69, 65, 0, 128); /* compass */\n    FntOpen(204, 6, 40, 56, 0, 128); /* day-night */')
          pat=r'''static void vt_v292_draw_compass\(void\) \{.*?
          \}
          static void vt_v292_draw_exploration_hud\(void\) \{'''
          repl=r'''static void vt_v292_draw_compass(void) {
              static const char *letters[4]={"N","O","S","W"};
              int heading=((vt_v292_cam_yaw+512)&4095)/1024;
              FntPrint(3,"  %s
%s + %s
  %s
",
                  letters[heading],letters[(heading+3)&3],
                  letters[(heading+1)&3],letters[(heading+2)&3]);
          }
          static void vt_v301_draw_daynight(void) {
              int cycle=(step_count*3)%240;
              int day=(cycle<120)?(100-(cycle*100)/120):((cycle-120)*100/120);
              int night=100-day;
              if(day<0)day=0; if(day>100)day=100;
              if(night<0)night=0; if(night>100)night=100;
              FntPrint(4,"TAG
%3d%%
NACHT
%3d%%
",day,night);
          }
          static void vt_v301_draw_sun(void) {
              int fx, fz, side_x, side_z;
              fx = px + (-vt_v293_sin(vt_v292_cam_yaw)*2100 + vt_v293_cos(vt_v292_cam_yaw)*760)/1024;
              fz = pz + ( vt_v293_cos(vt_v292_cam_yaw)*2100 + vt_v293_sin(vt_v292_cam_yaw)*760)/1024;
              side_x = fx + (vt_v293_cos(vt_v292_cam_yaw)*110)/1024;
              side_z = fz + (vt_v293_sin(vt_v292_cam_yaw)*110)/1024;
              draw_box(fx,-250,fz,26,252,226,105);
              vt_pyramid(fx,-250,fz,36,18,255,236,136);
              draw_box(side_x,-246,side_z,10,255,241,170);
          }
          static void vt_v292_draw_exploration_hud(void) {'''
          s,n=re.subn(pat,repl,s,flags=re.S)
          if n!=1:
              raise RuntimeError('V30.1 compass/day-night block not replaced')
          once('vt_v292_draw_compass();','vt_v292_draw_compass();\n              vt_v301_draw_daynight();')
          once('FntFlush(0);FntFlush(1);FntFlush(3);','FntFlush(0);FntFlush(1);FntFlush(3);FntFlush(4);')
          once('vt_v241_ground();
    vt_v300_horizon();
    vt_v300_mid_detail();',
               'vt_v241_ground();
    vt_v300_horizon();
    vt_v301_draw_sun();
    vt_v300_mid_detail();')
          for marker in ('vt_v293_move((unsigned int)pad);','vt_v281_resolve_movement();','vt_v282_draw_house_npcs(','vt_opt_draw_page();','vt_save_game(void)','vt_load_game(void)'):
              if marker not in s:
                  raise RuntimeError('V30.1 lost feature: '+marker)
          p.write_text(s,encoding='utf-8')
          print('V30.1: farther ground ring and wider frustum behind the camera.')
          print('V30.1: lifted player mesh, higher/farther chase camera, compact menu panel.')
          print('V30.1: top-right compass + day/night readout, simple stylized sun in the sky.')
          PY
          python3 "$RUNNER_TEMP/lydra_v301_visibility_patch.py"
          echo "V30.1 Sichtbarkeits-Patch erstellt; unveraenderter PS1 Build folgt."
      - name: PS1 SDK installieren – V27 Basis
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/run_v27_step.py" "Install PSn00bSDK"

      - name: Lydra V30.1 fuer PS1 kompilieren
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/run_v27_step.py" "Build Lydra V27"

      - name: Fertige PS1-Dateien einsammeln
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/run_v27_step.py" "Collect game files"

      - name: PS1 Artefakte pruefen
        shell: bash
        run: |
          set -euo pipefail
          for f in VTRAIL.bin VTRAIL.cue VTRAIL.exe VTRAIL.elf; do
            test -s "artifacts/$f" || { echo "Fehlende PS1-Datei: $f"; exit 1; }
          done
          echo "V30.0 Dateien vorhanden. RetroArch- und Hardwaretest stehen noch aus."

      - name: Lydra V30.1 herunterladen
        uses: actions/upload-artifact@v4
        with:
          name: Lydra-World-Of-Dragon-PS1-V30-1
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
