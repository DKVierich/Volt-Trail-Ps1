    - name: FIX74 Android APK exportieren und pruefen
      run: |
        set -euo pipefail
        mkdir -p build/android build/diagnose
        APK="$GITHUB_WORKSPACE/build/android/LWOD-Android-V41.7-FIX74.apk"
        rm -f "$APK"
        timeout --signal=TERM --kill-after=5s 900s godot --headless --path android --export-debug Android "$APK" 2>&1 | tee build/diagnose/FIX72_APK_Export.log
        if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script' build/diagnose/FIX72_APK_Export.log; then
          exit 1
        fi
        test -s "$APK"
        unzip -t "$APK" >/dev/null
        unzip -Z1 "$APK" | grep -Fx 'AndroidManifest.xml' >/dev/null
        ls -lh "$APK"
        sha256sum "$APK"
      shell: bash
    - id: apk_upload
      name: FIX74 APK als Download hochladen
      uses: actions/upload-artifact@v4
      with:
        compression-level: 0
        if-no-files-found: error
        name: LWOD_ANDROID_V41_7_FIX74_APK
        path: build/android/LWOD-Android-V41.7-FIX74.apk
        retention-days: 14
    - env:
        APK_ARTIFACT_ID: ${{ steps.apk_upload.outputs.artifact-id }}
        APK_ARTIFACT_URL: ${{ steps.apk_upload.outputs.artifact-url }}
      name: Erfolgreichen APK Upload bestaetigen
      run: |
        set -euo pipefail
        test -n "$APK_ARTIFACT_ID"
        test -n "$APK_ARTIFACT_URL"
        printf '### Android APK Download\n\n[FIX72 APK herunterladen](%s)\n' "$APK_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
      shell: bash
