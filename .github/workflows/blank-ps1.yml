        grep -Fqx 'version/name="4.0.4"' android/export_presets.cfg
        echo 'V40.4: Handel, Guthaben, echtes Inventar, Speicherstand und Rucksack-Integration installiert'
    - name: Godot Ressourcen importieren
      shell: bash
      run: |
        set -euo pipefail
        bash "$RUNNER_TEMP/replay_v403fix5.sh" 'Godot Ressourcen importieren'
        test -s android/scripts/V404Market.gd
        test -s android/tests/V404MarketSmoke.gd
    - name: Bisherige Spieltests V31 bis FIX5 ausfuehren
      shell: bash
      run: |
        set -euo pipefail
        bash "$RUNNER_TEMP/replay_v403fix5.sh" 'Bisherige Godot-Tests V31 bis V40.2 unveraendert ausfuehren'
        bash "$RUNNER_TEMP/replay_v403fix5.sh" 'V40.3 FIX5 Dorfbereinigung automatisch testen'
    - name: V40.4 Handel und Inventar testen
      shell: bash
      run: |
        set -euo pipefail
        godot --headless --path android --script res://tests/V404MarketSmoke.gd > "$RUNNER_TEMP/lwod_v404_market.log" 2>&1 || {
          cat "$RUNNER_TEMP/lwod_v404_market.log"
          exit 1
        }
        cat "$RUNNER_TEMP/lwod_v404_market.log"
        grep -Fq 'V404_TEST_OK:' "$RUNNER_TEMP/lwod_v404_market.log"
    - name: LWOD Android V40.4 APK erstellen
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p build/android
        godot --headless --path android --export-debug 'Android' "$GITHUB_WORKSPACE/build/android/LWOD-Android-V40.4-Handel.apk"
        test -s build/android/LWOD-Android-V40.4-Handel.apk
        unzip -t build/android/LWOD-Android-V40.4-Handel.apk >/dev/null
        ls -lh build/android/LWOD-Android-V40.4-Handel.apk
    - name: Fehlerdiagnose hochladen
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: LWOD_V40_4_DIAGNOSE
        path: |-
          android/scripts/Main.gd
          android/scripts/V404Market.gd
          android/tests/V404MarketSmoke.gd
          ${{ runner.temp }}/lwod_v404_market.log
        if-no-files-found: warn
        retention-days: 14
    - name: V40.4 APK hochladen
      uses: actions/upload-artifact@v4
      with:
        name: LWOD_ANDROID_V40_4_APK
        path: build/android/LWOD-Android-V40.4-Handel.apk
        if-no-files-found: error
        retention-days: 14
