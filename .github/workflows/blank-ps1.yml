
name: Build Volt Trail PS1 V15 Fixed

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build unzip curl jq tar \
            ffmpeg python3-pil python3-yaml

      - name: Load V15 source instructions
        shell: bash
        run: |
          set -euo pipefail

          # Fixed GitHub commit containing the
          # complete previous V15 source patches.
          V15_COMMIT="f1c4982a52b06bfeb86331a8cedc77ca9bebc178"

          curl --retry 3 -fsSL \
            "https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/$V15_COMMIT/.github/workflows/blank-ps1.yml" \
            -o "$RUNNER_TEMP/v15-source.yml"

          python3 - <<'PY'
          import os
          from pathlib import Path
          import yaml

          path = (
              Path(os.environ["RUNNER_TEMP"])
              / "v15-source.yml"
          )

          data = yaml.safe_load(
              path.read_text(encoding="utf-8")
          )

          steps = data["jobs"]["build"]["steps"]
          names = [step.get("name") for step in steps]

          required = [
              "Prepare V14 project",
              "Restore working V14 game",
              "Add V15 NPCs and larger world",
              "Install PSn00bSDK"
          ]

          for name in required:
              if names.count(name) != 1:
                  raise RuntimeError(
                      "Required V15 step missing: " + name
                  )

          print("Original V15 instructions loaded")
          PY

      - name: Prepare V14 project
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          import yaml

          path = (
              Path(os.environ["RUNNER_TEMP"])
              / "v15-source.yml"
          )

          steps = yaml.safe_load(
              path.read_text()
          )["jobs"]["build"]["steps"]

          matches = [
              step for step in steps
              if step.get("name") == "Prepare V14 project"
          ]

          if len(matches) != 1:
              raise RuntimeError("V14 preparation missing")

          subprocess.run(
              [
                  "bash", "-euo", "pipefail",
                  "-c", matches[0]["run"]
              ],
              env=os.environ.copy(),
              check=True
          )

          print("V14 project prepared")
          PY

      - name: Restore V14 game and intro
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          import yaml

          path = (
              Path(os.environ["RUNNER_TEMP"])
              / "v15-source.yml"
          )

          steps = yaml.safe_load(
              path.read_text()
          )["jobs"]["build"]["steps"]

          matches = [
              step for step in steps
              if step.get("name") ==
              "Restore working V14 game"
          ]

          if len(matches) != 1:
              raise RuntimeError("V14 restore step missing")

          subprocess.run(
              [
                  "bash", "-euo", "pipefail",
                  "-c", matches[0]["run"]
              ],
              env=os.environ.copy(),
              check=True
          )

          print("V14 game and intro restored")
          PY

      - name: Add corrected V15 NPC world
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          import yaml

          path = (
              Path(os.environ["RUNNER_TEMP"])
              / "v15-source.yml"
          )

          steps = yaml.safe_load(
              path.read_text()
          )["jobs"]["build"]["steps"]

          matches = [
              step for step in steps
              if step.get("name") ==
              "Add V15 NPCs and larger world"
          ]

          if len(matches) != 1:
              raise RuntimeError("V15 graphics step missing")

          script = matches[0]["run"]

          # The previous V15 version searched
          # for HUD text using exact indentation.
          # Replace only that fragile search.

          begin_marker = "start_marker = ("
          end_marker = (
              "exploration_hud = r" + "'" * 3
          )

          if script.count(begin_marker) != 1:
              raise RuntimeError(
                  "Old HUD search marker changed"
              )

          begin = script.index(begin_marker)
          end = script.index(end_marker, begin)

          corrected_search = r"""
          import re

          # Search by C syntax, ignoring indentation.
          hud_part = code[hud_start:]

          first = re.search(
              r"(?m)^[ \t]*if[ \t]*\("
              r"[ \t]*game_mode[ \t]*==[ \t]*0"
              r"[ \t]*\)[ \t]*\{",
              hud_part
          )

          if first is None:
              raise RuntimeError(
                  "Exploration HUD not found"
              )

          start = hud_start + first.start()

          second = re.search(
              r"(?m)^[ \t]*\}[ \t]*else"
              r"[ \t]+if[ \t]*\("
              r"[ \t]*game_mode[ \t]*==[ \t]*1"
              r"[ \t]*\)[ \t]*\{",
              code[start:]
          )

          if second is None:
              raise RuntimeError(
                  "Battle HUD boundary not found"
              )

          end = start + second.start()

          """

          # YAML removes the common indentation
          # when reading the original run block.
          import textwrap

          corrected_search = textwrap.dedent(
              corrected_search
          )

          script = (
              script[:begin]
              + corrected_search
              + script[end:]
          )

          # Check Python syntax before executing
          # the graphics and NPC modifications.
          opening = "python3 - <<'PY'\n"
          closing = "\nPY"

          if opening not in script:
              raise RuntimeError(
                  "Python patch opening not found"
              )

          python_source = script.split(
              opening, 1
          )[1].rsplit(closing, 1)[0]

          compile(
              python_source,
              "volttrail_v15_fixed.py",
              "exec"
          )

          print(
              "V15 NPC patch syntax checked",
              flush=True
          )

          subprocess.run(
              [
                  "bash", "-euo", "pipefail",
                  "-c", script
              ],
              env=os.environ.copy(),
              check=True
          )

          print("V15 NPC world applied")
          PY

      - name: Install PSn00bSDK
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          import yaml

          path = (
              Path(os.environ["RUNNER_TEMP"])
              / "v15-source.yml"
          )

          steps = yaml.safe_load(
              path.read_text()
          )["jobs"]["build"]["steps"]

          matches = [
              step for step in steps
              if step.get("name") == "Install PSn00bSDK"
          ]

          if len(matches) != 1:
              raise RuntimeError(
                  "PSn00bSDK setup missing"
              )

          subprocess.run(
              [
                  "bash", "-euo", "pipefail",
                  "-c", matches[0]["run"]
              ],
              env=os.environ.copy(),
              check=True
          )

          print("PSn00bSDK ready")
          PY

      - name: Build Volt Trail V15
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            -S "$PROJECT_DIR" \
            -B "$GITHUB_WORKSPACE/build" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PSN00BSDK_CMAKE" \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build \
            "$GITHUB_WORKSPACE/build" \
            --verbose

      - name: Collect PS1 files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          for file in \
            VTRAIL.bin \
            VTRAIL.cue \
            VTRAIL.exe \
            VTRAIL.elf
          do
            SOURCE="$GITHUB_WORKSPACE/build/$file"

            if [ ! -s "$SOURCE" ]; then
              echo "::error::Missing PS1 file: $file"
              exit 1
            fi

            cp "$SOURCE" \
              "$GITHUB_WORKSPACE/artifacts/"
          done

          ls -lh "$GITHUB_WORKSPACE/artifacts"

      - name: Upload Volt Trail V15
        uses: actions/upload-artifact@v4
        with:
          name: VoltTrail-PS1-V15-Fixed
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
