        \ baked Wurzelheim path material changed'\nnew_wm=wm.group().replace('path.material_override = _material(Color.WHITE,true)','path.material_override\
        \ = _v462_paving_world()',1)\ns=s[:wm.start()]+new_wm+s[wm.end():]\n\n# Existing regional ring and gate roads omit\
        \ the inner village links. Restore\n# an 8m inner ring and four short connectors to the original ring radius.\nregion_fn=re.search(r'(?ms)^func\
        \ _create_town_paths\\(.*?(?=^func |^static func |^const |^var |\\Z)',s)\nassert region_fn and '_make_path(' in region_fn.group()\
        \ and 'city: String' in region_fn.group().splitlines()[0],'FIX62: regional roads signature changed'\nassert '_v462_restore_inner_roads('\
        \ not in region_fn.group()\nregional=region_fn.group().rstrip()+'''\\n    _v462_restore_inner_roads(root,centre,city)\\\
        n\\n'''\ns=s[:region_fn.start()]+regional+s[region_fn.end():]\n\n# Place decorative connection geometry only, not\
        \ new ground colliders.\n# Wurzelheim uses its own complete path network and remains untouched here.\nextra='''# FIX62:\
        \ Previously missing connections from village plaza to outer ring.\nfunc _v462_restore_inner_roads(root: Node3D, centre:\
        \ Vector2, city: String) -> void:\n    if city == \"Wurzelheim\":\n        return\n    var inner := PackedVector2Array()\n\
        \    for j in range(49):\n        var a: float = TAU*float(j)/48.0\n        inner.append(centre+Vector2(sin(a),cos(a))*9.0)\n\
        \    _v462_road_lift = 0.075\n    _make_path(root,inner,6.0,Color(\"#bca27c\"))\n    # Connect the old 22.5m ring\
        \ to the inner plaza in four directions.\n    for k in range(4):\n        var a: float = TAU*float(k)/4.0\n      \
        \  var direction := Vector2(sin(a),cos(a))\n        var side := Vector2(-direction.y,direction.x)\n        var strip\
        \ := PackedVector2Array([\n            centre+direction*8.1,\n            centre+direction*15.3+side*0.55,\n     \
        \       centre+direction*23.2\n        ])\n        _make_path(root,strip,4.35,Color(\"#bca27c\"))\n    _v462_road_lift\
        \ = 0.0\n\n# FIX62: Sonnental's legacy V403 roads use another, untextured mesh system.\n# Build a very small paved\
