    - name: V41.2 GLB Dateien in Godot importieren
      shell: bash
      run: "set -euo pipefail\ntimeout --signal=TERM --kill-after=5s 240s godot --headless --editor --path android --import 2>&1\
        \ | tee /tmp/lwod4120_import.log\nif grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to import|Error importing' /tmp/lwod4120_import.log;\
        \ then\n  echo 'GLB-IMPORTFEHLER'; exit 1\nfi\nfor file in LWOD_Heldin_V4120.glb LWOD_Phoenix_Violett_V4120.glb; do\n \
        \ test -s \"android/assets/characters/$file\"\ndone\necho V4120_IMPORT_OK\n"
    - name: V41.2 Skinning, Animation und Einbindung testen
      shell: bash
      run: "set -euo pipefail\ncat > android/tests/V4120RigSmoke.gd <<'GD_V4120_TEST'\nextends SceneTree\nclass TestGame:\n   \
        \ extends Node3D\n    var hero: Node3D\n    var phoenix: Node3D\n\nfunc _initialize() -> void:\n    call_deferred(\"_run\"\
        )\n\nfunc _find_rig(n: Node) -> Skeleton3D:\n    if n is Skeleton3D:\n        return n as Skeleton3D\n    for c in n.get_children():\n\
        \        var rig: Skeleton3D = _find_rig(c)\n        if rig != null: return rig\n    return null\n\nfunc _find_anim(n:\
        \ Node) -> AnimationPlayer:\n    if n is AnimationPlayer:\n        return n as AnimationPlayer\n    for c in n.get_children():\n\
        \        var a: AnimationPlayer = _find_anim(c)\n        if a != null: return a\n    return null\n\nfunc _contains_clip(player:\
        \ AnimationPlayer, text: String) -> bool:\n    if player == null: return false\n    for key in player.get_animation_list():\n\
        \        if String(key).to_lower().contains(text.to_lower()):return true\n    return false\n\nfunc _run() -> void:\n  \
        \  var paths: Array[String] = [\"res://assets/characters/LWOD_Heldin_V4120.glb\", \"res://assets/characters/LWOD_Phoenix_Violett_V4120.glb\"\
        ]\n    for path in paths:\n        var res: PackedScene = load(path) as PackedScene\n        if res == null:\n        \
        \    push_error(\"V4120: GLB nicht importierbar: \" + path)\n            quit(1)\n            return\n        var inst:\
        \ Node = res.instantiate()\n        root.add_child(inst)\n        var skel: Skeleton3D = _find_rig(inst)\n        var anim:\
        \ AnimationPlayer = _find_anim(inst)\n        if skel == null or anim == null or skel.get_bone_count() < 9:\n         \
        \   push_error(\"V4120: Echte Knochen oder AnimationPlayer fehlen: \" + path)\n            quit(2)\n            return\n\
        \        if path.contains(\"Heldin\"):\n            if not _contains_clip(anim,\"Idle\") or not _contains_clip(anim,\"\
        Walk\"):\n                push_error(\"V4120: Idle und Walk fehlen\")\n                quit(3)\n                return\n\
        \        else:\n            if not _contains_clip(anim,\"Flap\") or not _contains_clip(anim,\"Glide\"):\n             \
        \   push_error(\"V4120: Flap und Glide fehlen\")\n                quit(4)\n                return\n        # Check that\
        \ skinned joints actually move when animation advances.\n        var bone_name: String = \"LeftLeg\" if path.contains(\"\
        Heldin\") else \"WingL\"\n        var clip_name: String = \"Walk\" if path.contains(\"Heldin\") else \"Flap\"\n       \
        \ var bone_index: int = skel.find_bone(bone_name)\n        if bone_index < 0:\n            push_error(\"V4120: Animierter\
        \ Knochen fehlt: \" + bone_name)\n            quit(7)\n            return\n        var matching_clip: String = \"\"\n \
        \       for c in anim.get_animation_list():\n            if String(c).to_lower().contains(clip_name.to_lower()):\n    \
        \            matching_clip = String(c)\n                break\n        if matching_clip.is_empty():\n            push_error(\"\
        V4120: Clip nicht gefunden: \" + clip_name)\n            quit(8)\n            return\n        anim.play(matching_clip)\n\
        \        anim.advance(0.22)\n        var pose_a: Quaternion = skel.get_bone_pose_rotation(bone_index)\n        anim.advance(0.41)\n\
        \        var pose_b: Quaternion = skel.get_bone_pose_rotation(bone_index)\n        if pose_a.angle_to(pose_b) < 0.025:\n\
        \            push_error(\"V4120: Knochen bewegt sich nicht: \" + bone_name)\n            quit(9)\n            return\n\
        \        inst.queue_free()\n    var g := TestGame.new()\n    root.add_child(g)\n    g.hero = Node3D.new()\n    g.phoenix\
