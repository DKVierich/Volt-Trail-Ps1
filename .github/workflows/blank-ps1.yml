      - name: Godot Start und Scriptfehler testen
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path android --quit-after 8 > "$RUNNER_TEMP/lwod_v29_run.log" 2>&1 || {
            cat "$RUNNER_TEMP/lwod_v29_run.log"
