        once('if(turn)vt_v292_cam_yaw=(vt_v292_cam_yaw+turn*56+4096)&4095;',
             'if(turn)vt_v292_cam_yaw=(vt_v292_cam_yaw+turn*64+4096)&4095;')

        # Verify the critical systems and prevent a silently green build with the wrong UI.
