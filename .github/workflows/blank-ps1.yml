        \ android --quit-after 300 --script res://tests/V462AllRoadsSmoke.gd 2>&1 | tee build/diagnose/FIX62_Alle_Wege.log\n\
        if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid call|FIX62: ' build/diagnose/FIX62_Alle_Wege.log;\
        \ then\n  echo '::error::Wurzelheim, Sonnental oder Dorfwegetest fehlgeschlagen'; exit 1\nfi\ngrep -Fq 'FIX62_ALL_ROADS_OK:'\
