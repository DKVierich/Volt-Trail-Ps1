    - name: FIX27 Basis 51 PS1 mit vollstaendigem Compilerprotokoll
      shell: bash
      run: "set -uo pipefail\nmkdir -p artifacts\n# Der bisherige Wrapper meldete nur CalledProcessError / exit code 1.\n# Das eigentliche Compiler-Stderr und der Linker-Status bleiben jetzt erhalten.\necho '=== FIX27: Originalen, UNVERAENDERTEN V31.8.5 Build-Schritt 51 ausfuehren ==='\nprintf '%s\\n' 'FIX27: volle Kompilierausgabe unter artifacts/FIX25_BUILD_LOG.txt'\npython3 \"$RUNNER_TEMP/lydra_v3185_replay.py\" 51 2>&1 | tee artifacts/FIX25_BUILD_LOG.txt\nbuild_rc=${PIPESTATUS[0]}\nexport LYDRA_FIX25_BUILD_RC=\"$build_rc\"\npython3 - <<'FIX25_PARSE'\nimport os,re\nfrom pathlib import Path\nroot=Path('artifacts')\nlog=(root/'FIX25_BUILD_LOG.txt').read_text(encoding='utf-8',errors='replace').splitlines()\nrc=int(os.environ.get('LYDRA_FIX25_BUILD_RC','1'))\nrx=re.compile(r'(?:\\berror:|\\bfatal error:|undefined reference|collect2:|ld:|overflowed by|will not fit in region|CMake Error|ninja: build stopped|make(?:\\[[0-9]+\\])?: \\*\\*\\*|fatal:|No such file or directory|not found)',re.I)\nhits=[(i,line) for i,line in enumerate(log) if rx.search(line)]\nout=['LYDRA V31.9.9.10 FIX25 | Compiler/Linker-Diagnose',\n     'Build-Exitcode: '+str(rc),'Ausgabezeilen insgesamt: '+str(len(log)),\n     'Fehlerzeilen gefunden: '+str(len(hits)),'']\nif hits:\n    out.append('ERSTE FEHLERMELDUNGEN MIT KONTEXT:')\n    for i,_ in hits[:12]:\n        out.append('--- Zeile '+str(i+1)+' ---')\n        for n in range(max(0,i-2),min(len(log),i+4)):\n            out.append(f'{n+1:05d} {log[n]}')\nelif rc!=0:\n    out.append('KEIN EXPLIZITES error: GEFUNDEN. LETZTE 100 LOGZEILEN:')\n    out.extend(log[-100:])\nelse:\n    out.append('PS1 Build erfolgreich abgeschlossen.')\n(root/'FIX25_ERSTE_FEHLER.txt').write_text('\\n'.join(out)+'\\n',encoding='utf-8')\nsrc=Path(os.environ.get('PROJECT_DIR',''))/'src'/'main.c'\nif src.is_file():\n    # Voller Quelltext hilft, Zeilenangaben aus dem Compiler zurueckzuverfolgen.\n    (root/'FIX25_MAIN_C.c').write_bytes(src.read_bytes())\nprint('\\n=== FIX27: Erste Compiler-/Linkerfehler ===')\nprint('\\n'.join(out[:130]))\nprint('=== ENDE FIX27 Diagnose ===')\nFIX25_PARSE\nif [ \"$build_rc\" -ne 0 ]; then\n  echo \"::error::FIX27: Basis 51 scheiterte mit Exitcode $build_rc. Echte Compilerfehler stehen oben und im Diagnose-Artefakt.\"\n  exit \"$build_rc\"\nfi\necho 'FIX27: PS1-Komplettbuild erfolgreich. Alle FIX24-Hausdetails beibehalten.'\n"
    - name: FIX27 Fehlermeldungen als Artefakt sichern
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: LYDRA-FIX27-PS1-BUILD-DIAGNOSE
        path: 'artifacts/FIX25_BUILD_LOG.txt

          artifacts/FIX25_ERSTE_FEHLER.txt

          artifacts/FIX25_MAIN_C.c'
        if-no-files-found: warn
        retention-days: 14
