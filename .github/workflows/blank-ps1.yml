# LWOD ANDROID V34 - VOLLSTAENDIGES GITHUB-SKRIPT ZUM KOPIEREN
# LINKS Bewegung, RECHTS Kamera; ohne Schrift an den Steuerkreisen.
# Figuren und Kamera werden nur einmal pro Renderbild synchronisiert.
# Sonne, Mond und Wolken vergroessert; APK inklusive Artifact-Upload.
# Datei unter .github/workflows/blank-ps1.yml bzw. lwod-android.yml einsetzen.
name: LWOD Android V34 Links Bewegen Rechts Kamera
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/lwod-android.yml
    - .github/workflows/blank-ps1.yml
permissions:
  contents: read
jobs:
  android:
    name: LWOD Android V34 APK
    runs-on: ubuntu-latest
    timeout-minutes: 55
    container:
      image: barichello/godot-ci:4.7.2
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: /usr/lib/android-sdk
    steps:
    - name: Repository laden
      uses: actions/checkout@v4
    - name: Godot und Android SDK vorbereiten
      shell: bash
      run: 'set -euo pipefail

        mkdir -p "$HOME/.config/godot" "$HOME/.local/share/godot/export_templates"

        cp -a /root/.config/godot/. "$HOME/.config/godot/"

        cp -a /root/.local/share/godot/export_templates/. "$HOME/.local/share/godot/export_templates/"

        test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"

        test -x "$JAVA_HOME/bin/java"

        test -s /root/debug.keystore

        sdkmanager --sdk_root="$ANDROID_HOME" ''platforms;android-35'' ''build-tools;35.0.1''

        test -d "$ANDROID_HOME/platforms/android-35"

        '
    - name: V23-Quelle herunterladen und richtige Pruefsumme pruefen
      shell: bash
      run: "set -euo pipefail\nwget -q --tries=3 --timeout=45 \\\n  -O \"$RUNNER_TEMP/lwod_v23.yml\" \\\n  'https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/2b1332ef7b51655427065cd8ec8371af1e7773dc/.github/workflows/blank-ps1.yml'\n\
        test -s \"$RUNNER_TEMP/lwod_v23.yml\"\nsource_hash=\"$(git hash-object \"$RUNNER_TEMP/lwod_v23.yml\")\"\n\
        if [ \"$source_hash\" != \"f2417eca21fc0e9ac53a9e678b139a68e26ccdc8\" ]; then\n  echo \"::error::V23-Quellversion\
        \ passt nicht. Erwartet: f2417eca21fc0e9ac53a9e678b139a68e26ccdc8, erhalten: $source_hash\"\n  exit 22\n\
        fi\necho \"V23-Quelle korrekt: $source_hash\"\ncat > \"$RUNNER_TEMP/replay_v23.sh\" <<'REPLAY_V23'\n#!/bin/bash\n\
        set -euo pipefail\nname=\"$1\"\nawk -v name=\"$name\" '\n  $0 == \"    - name: \" name { found=1; next }\n\
        \  found && $0 == \"      run: |\" { active=1; next }\n  active && /^    - name:/ { exit }\n  active &&\
        \ /^        / { sub(/^        /, \"\"); print; next }\n  active && /^$/ { print \"\"; next }\n  END { if\
        \ (active != 1) exit 57 }\n' \"$RUNNER_TEMP/lwod_v23.yml\" > \"$RUNNER_TEMP/v23_step.sh\"\ntest -s \"$RUNNER_TEMP/v23_step.sh\"\
        \nbash -n \"$RUNNER_TEMP/v23_step.sh\"\necho \"V23 Basis: $name\"\nbash \"$RUNNER_TEMP/v23_step.sh\"\nREPLAY_V23\n\
        chmod +x \"$RUNNER_TEMP/replay_v23.sh\"\n"
    - name: FFmpeg statisch ohne apt und ohne xz bereitstellen
      shell: bash
      run: "set -euo pipefail\nif command -v ffmpeg >/dev/null 2>&1; then\n  echo 'FFmpeg ist bereits im Container\
        \ vorhanden'\nelse\n  echo 'Statische FFmpeg-Datei als gzip-Archiv von GitHub laden'\n  command -v gzip\
        \ >/dev/null\n  command -v sha256sum >/dev/null\n  wget -q --show-progress --https-only --tries=3 --timeout=90\
        \ \\\n    -O \"$RUNNER_TEMP/ffmpeg-linux-x64.gz\" \\\n    'https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-linux-x64.gz'\n\
        \  test -s \"$RUNNER_TEMP/ffmpeg-linux-x64.gz\"\n  printf '%s  %s\\n' \\\n    'bfe8a8fc511530457b528c48d77b5737527b504a3797a9bc4866aeca69c2dffa'\
        \ \\\n    \"$RUNNER_TEMP/ffmpeg-linux-x64.gz\" | sha256sum -c -\n  gzip -dc \"$RUNNER_TEMP/ffmpeg-linux-x64.gz\"\
        \ > /usr/local/bin/ffmpeg\n  chmod 0755 /usr/local/bin/ffmpeg\nfi\nffmpeg -hide_banner -version | head -n\
        \ 1\ntest -x \"$(command -v ffmpeg)\"\n"
