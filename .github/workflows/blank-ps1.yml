# LWOD Android V23: Welt 32000x32000, 36 Siedlungen, eigener Rucksack.
# Als .github/workflows/lwod-android.yml speichern (PS1-Workflow separat behalten).
name: LWOD Android V23 Riesenwelt und Rucksack FIX
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/lwod-android.yml
    - .github/workflows/blank-ps1.yml
permissions:
  contents: read
jobs:
  android:
    name: Android V23 APK erstellen
    runs-on: ubuntu-latest
    timeout-minutes: 50
    container:
      image: barichello/godot-ci:4.7.2
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: /usr/lib/android-sdk
    steps:
    - name: Repository laden
      uses: actions/checkout@v4
    - name: Android SDK und Godot vorbereiten
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.config/godot" "$HOME/.local/share/godot/export_templates"
        cp -a /root/.config/godot/. "$HOME/.config/godot/"
        cp -a /root/.local/share/godot/export_templates/. "$HOME/.local/share/godot/export_templates/"
        test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
        test -x "$JAVA_HOME/bin/java"
        test -s /root/debug.keystore
        sdkmanager --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.1'
        test -d "$ANDROID_HOME/platforms/android-35"
    - name: Bewaehrte V18-Quelle fest herunterladen
      shell: bash
      run: |
        set -euo pipefail
        wget -q --tries=3 --timeout=45 \
          -O "$RUNNER_TEMP/lwod_v18.yml" \
          'https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/d30dd9c5727420b12b26ff167cd5ed1313b95f39/.github/workflows/blank-ps1.yml'
        test -s "$RUNNER_TEMP/lwod_v18.yml"
        test "$(git hash-object "$RUNNER_TEMP/lwod_v18.yml")" = \
          '2d2309c00cd95184cecfe21f38095d42ca0179f3'
        cat > "$RUNNER_TEMP/v18_replay.sh" <<'LWOD_REPLAY'
        #!/bin/bash
        set -euo pipefail
        wanted="$1"
        sourcefile="$RUNNER_TEMP/lwod_v18.yml"
        target="$RUNNER_TEMP/lwod_step.sh"
        awk -v name="$wanted" '  $0 == "      - name: " name { found=1; next }
          found && $0 == "        run: |" { active=1; next }
          active && /^      - name:/ { exit }
          active && /^          / { sub(/^          /, ""); print; next }
          active && /^$/ { print ""; next }
          END { if (active != 1) exit 57 }
        ' "$sourcefile" > "$target"
        test -s "$target"
        bash -n "$target"
        echo "V18 Buildschritt: $wanted"
        bash "$target"
        LWOD_REPLAY
        chmod +x "$RUNNER_TEMP/v18_replay.sh"
    - name: V18 Spielweltbasis vorbereiten
      shell: bash
      run: |
        set -euo pipefail
        bash "$RUNNER_TEMP/v18_replay.sh" 'V7 Buildquelle laden und Pruefsumme kontrollieren'
    - name: V18 Spielwelt und Menues erstellen
      shell: bash
      run: |
        set -euo pipefail
        bash "$RUNNER_TEMP/v18_replay.sh" 'Funktionsfaehige V7 Spielwelt und Menues erstellen'
        test -s android/scripts/Main.gd
    - name: Originalintro 37617 mit Ton integrieren
      shell: bash
      run: |
        set -euo pipefail
        bash "$RUNNER_TEMP/v18_replay.sh" 'Original 37617 Intro mit Ton einbinden'
        test -s android/assets/dkvierich_intro.ogv
    - name: Phönix-Hauptmenue und Funktionen behalten
      shell: bash
      run: |
        set -euo pipefail
        bash "$RUNNER_TEMP/v18_replay.sh" 'Bestaetigtes Phoenix Menue und klickbare Aktionen einbauen'
        test -s android/assets/phoenix_menu.webp
        test -s android/scripts/PhoenixMenu.gd
    - name: V18 Modelle und Landschaft uebernehmen
      shell: bash
      run: |
        set -euo pipefail
        bash "$RUNNER_TEMP/v18_replay.sh" 'V18 Phoenix Kamera Gebirge Haeuser und Boden repariert'
        test -s android/scripts/V17Visual.gd
        grep -Fqx '    graphic_upgrade.setup(self)' android/scripts/Main.gd
    - name: V19 Bergkollision Kameraschutz Bergformen
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p android/scripts
        cat > android/scripts/V19TerrainSafety.gd <<'LWOD_V19_TERRAIN'
        extends Node

        # LWOD V19: echte Gebirgskollision, stabile Verfolgungskamera und weichere Gebirgsformen.
        # Aendert keine Spielstaende, Menues, Figurenmodelle oder Hauskollisionen.

        var game: Node3D
        var ridge_body: StaticBody3D
        const LIMIT_X := 77.0
        const LIMIT_Z_NEAR := 63.0
        const LIMIT_Z_FAR := -80.0
        const CAM_MARGIN := 0.52

        func setup(root: Node3D) -> void:
            game = root
            _create_mountain_range()
            _create_world_boundaries()
            print("LWOD V19: Gebirge und Kamera-Kollisionsschutz aktiv")

        func _vertex(st: SurfaceTool, faces: PackedVector3Array, p: Vector3, col: Color) -> void:
            st.set_color(col)
            st.add_vertex(p)
            faces.append(p)

        func _triangle(st: SurfaceTool, faces: PackedVector3Array, a: Vector3, b: Vector3, c: Vector3, col: Color) -> void:
            _vertex(st, faces, a, col)
            _vertex(st, faces, b, col)
            _vertex(st, faces, c, col)

        func _quad(st: SurfaceTool, faces: PackedVector3Array, a: Vector3, b: Vector3, c: Vector3, d: Vector3, col: Color) -> void:
            _triangle(st, faces, a, b, c, col)
            _triangle(st, faces, a, c, d, col)

        func _create_mountain_range() -> void:
            # Die alte V17-Bergfassade besass keine Kollision. Ihr Ersetzen
            # vermeidet doppelte Berge und haessliche grosse Dreiecksflächen.
            var old_ridge := game.get_node_or_null("V17Gebirgszuege")
            if old_ridge is Node3D:
                (old_ridge as Node3D).visible = false

            var front: PackedVector3Array = PackedVector3Array()
            var lower: PackedVector3Array = PackedVector3Array()
            var ridge: PackedVector3Array = PackedVector3Array()
            var back: PackedVector3Array = PackedVector3Array()
            var n: int = 41

            for i in range(n):
                var f: float = float(i)
                var x: float = -100.0 + f * 5.0
                var variation: float = sin(f * 0.40) * 2.8 + sin(f * 0.93) * 1.3
                var height: float = 12.7 + variation + 1.5 * cos(f * 0.18)
                front.append(Vector3(x, -0.10, -76.0 - sin(f * 0.29) * 0.9))
                lower.append(Vector3(x + sin(f * 0.30) * 0.9, height * 0.42, -82.3))
                ridge.append(Vector3(x + sin(f * 0.43) * 1.1, height, -91.5 - cos(f * 0.37) * 1.3))
                back.append(Vector3(x, height * 0.50, -101.0))

            var st := SurfaceTool.new()
            st.begin(Mesh.PRIMITIVE_TRIANGLES)
            var faces := PackedVector3Array()
            var stone := [Color("#647787"), Color("#708390"), Color("#566d7b"), Color("#84959d")]
            for i in range(n - 1):
                _quad(st, faces, front[i], front[i + 1], lower[i + 1], lower[i], stone[i % stone.size()])
                _quad(st, faces, lower[i], lower[i + 1], ridge[i + 1], ridge[i], stone[(i + 2) % stone.size()])
                _quad(st, faces, ridge[i], ridge[i + 1], back[i + 1], back[i], Color("#526b7d"))
                # Helle Gipfel als schmale Schicht, keine einzeln schwebenden Dreiecke.
                if i % 3 != 1:
                    var u: Vector3 = lower[i].lerp(ridge[i], 0.78) + Vector3(0.0, 0.05, 0.04)
                    var v: Vector3 = lower[i + 1].lerp(ridge[i + 1], 0.78) + Vector3(0.0, 0.05, 0.04)
                    _quad(st, faces, u, v, ridge[i + 1] + Vector3(0, 0.02, 0), ridge[i] + Vector3(0, 0.02, 0), Color("#c2cdd1"))

            st.generate_normals()
            var mesh := st.commit()
            var mountain_visual := MeshInstance3D.new()
            mountain_visual.name = "V19Felsgebirge"
            mountain_visual.mesh = mesh
            var rock := StandardMaterial3D.new()
            rock.vertex_color_use_as_albedo = true
            rock.roughness = 0.96
            rock.cull_mode = BaseMaterial3D.CULL_DISABLED
            mountain_visual.material_override = rock
            game.add_child(mountain_visual)

            # Dieselben Dreiecke werden als statische Kollision genutzt.
            ridge_body = StaticBody3D.new()
            ridge_body.name = "V19GebirgsKollision"
            var shape := ConcavePolygonShape3D.new()
            shape.set_faces(faces)
            shape.backface_collision = true
            var collision := CollisionShape3D.new()
            collision.shape = shape
            ridge_body.add_child(collision)
            game.add_child(ridge_body)

        func _add_invisible_wall(parent: StaticBody3D, pos: Vector3, dims: Vector3) -> void:
            var col := CollisionShape3D.new()
            var box := BoxShape3D.new()
            box.size = dims
            col.shape = box
            col.position = pos
            parent.add_child(col)

        func _create_world_boundaries() -> void:
            # Ein Backup-Schutz hinter der Felsflanke verhindert das Verlassen
            # der bisherigen Karte selbst bei sehr schnellen Bewegungen.
            var perimeter := StaticBody3D.new()
            perimeter.name = "V19Weltgrenzen"
            game.add_child(perimeter)
            _add_invisible_wall(perimeter, Vector3(0, 13, -82.0), Vector3(210, 26, 1.2))
            _add_invisible_wall(perimeter, Vector3(0, 13, LIMIT_Z_NEAR), Vector3(156, 26, 1.2))
            _add_invisible_wall(perimeter, Vector3(-LIMIT_X, 13, -9), Vector3(1.2, 26, 148))
            _add_invisible_wall(perimeter, Vector3(LIMIT_X, 13, -9), Vector3(1.2, 26, 148))

        func _ray_clipped(start: Vector3, desired: Vector3) -> Vector3:
            var direction: Vector3 = desired - start
            var total: float = direction.length()
            if total < 0.5:
                return desired
            var query := PhysicsRayQueryParameters3D.create(start, desired)
            var excluded: Array[RID] = [game.hero.get_rid()]
            query.exclude = excluded
            query.hit_back_faces = true
            var result: Dictionary = game.get_world_3d().direct_space_state.intersect_ray(query)
            if result.is_empty():
                return desired
            var hit_point: Vector3 = result["position"]
            var allowed: float = maxf(1.0, start.distance_to(hit_point) - CAM_MARGIN)
            allowed = minf(total, allowed)
            return start + direction.normalized() * allowed

        func _physics_process(delta: float) -> void:
            if game == null or game.hero == null or game.camera_node == null:
                return
            if game.state != 2:
                return

            # Alte Speicherpositionen ausserhalb der bisherigen Kartenkollision
            # einmal auf den sicheren Bereich korrigieren.
            var current: Vector3 = game.hero.global_position
            var safe_x: float = clampf(current.x, -LIMIT_X + 1.7, LIMIT_X - 1.7)
            var safe_z: float = clampf(current.z, LIMIT_Z_FAR + 3.0, LIMIT_Z_NEAR - 2.0)
            if not is_equal_approx(safe_x, current.x) or not is_equal_approx(safe_z, current.z):
                game.hero.global_position = Vector3(safe_x, maxf(current.y, 0.1), safe_z)

            var center: Vector3 = game.hero.global_position + Vector3(0, 1.40, 0)
            var a: float = game.hero.rotation.y
            var behind: Vector3 = Vector3(sin(a), 0.0, cos(a))
            var wanted: Vector3 = game.hero.global_position + behind * 6.8 + Vector3(0, 4.6, 0)
            var corrected: Vector3 = _ray_clipped(center, wanted)
            var smoothed: Vector3 = game.camera_node.global_position.lerp(corrected, minf(1.0, delta * 9.0))
            # Zweite Pruefung nach dem Glaetten verhindert Durchdringen
            # bei engen Hausecken oder schneller Kameradrehung.
            smoothed = _ray_clipped(center, smoothed)
            game.camera_node.global_position = smoothed
            game.camera_node.look_at(center)
        LWOD_V19_TERRAIN
        test -s android/scripts/V19TerrainSafety.gd
        test "$(grep -Fxc '    graphic_upgrade.setup(self)' android/scripts/Main.gd)" -eq 1
        awk '
          { print }
          $0 == "    graphic_upgrade.setup(self)" {
            print "    var v19_safety = load(\"res://scripts/V19TerrainSafety.gd\").new()"
            print "    add_child(v19_safety)"
            print "    v19_safety.setup(self)"
            n++
          }
          END { if (n != 1) exit 44 }
        ' android/scripts/Main.gd > "$RUNNER_TEMP/Main_v19.gd"
        mv "$RUNNER_TEMP/Main_v19.gd" android/scripts/Main.gd
        grep -Fqx '    v19_safety.setup(self)' android/scripts/Main.gd
        sed -i 's@version/code=18@version/code=19@' android/export_presets.cfg
        sed -i 's@version/name="1.8"@version/name="1.9"@' android/export_presets.cfg
        grep -Fqx 'version/code=19' android/export_presets.cfg
        echo 'V19: Gebirgskollision, Weltgrenzen und Kamera eingebaut'
    - name: V20 Kamera Bergsilhouette und Hausdaecher
      shell: bash
      run: |
        set -euo pipefail
        cat > android/scripts/V20CameraTerrain.gd <<'LWOD_V20_TERRAIN'
        extends Node

        # LWOD V20: nur Landschaft und Kamera. V19-Spielwelt und Menues bleiben erhalten.
        # Die Berge stehen hinter der bisherigen Weltgrenze. Kamerakollision als Kugel.

        var game: Node3D
        var ball: SphereShape3D
        var roofs: Array[MeshInstance3D] = []
        var roof_centers: Array[Vector3] = []
        var previous_camera_option: int = 0
        var seen_time: float = 0.0

        func setup(root: Node3D) -> void:
            game = root
            process_priority = 100
            ball = SphereShape3D.new()
            ball.radius = 0.36
            var old_safety := game.get_node_or_null("V19TerrainSafety")
            if old_safety == null:
                for node in game.get_children():
                    if node.get_script() is Script and str(node.get_script().resource_path).ends_with("V19TerrainSafety.gd"):
                        old_safety = node
                        break
            if old_safety != null:
                old_safety.set_physics_process(false)
            # Die V19-Felsfassade direkt hinter der Kartengrenze ausblenden.
            var old_visual := game.get_node_or_null("V19Felsgebirge")
            if old_visual is VisualInstance3D:
                old_visual.visible = false
            var old_collision := game.get_node_or_null("V19GebirgsKollision")
            if old_collision is StaticBody3D:
                old_collision.collision_layer = 0
                old_collision.collision_mask = 0
            # Alte einzelne weit entfernte Kegelberge aus der V6-Landschaft ausblenden.
            for child in game.get_children():
                if child is MeshInstance3D:
                    var instance := child as MeshInstance3D
                    if instance.mesh is CylinderMesh:
                        var cyl := instance.mesh as CylinderMesh
                        if cyl.height >= 14.0 and cyl.bottom_radius >= 7.0:
                            instance.visible = false
            _build_mountain_slope()
            _find_house_roofs()
            print("LWOD V20: Kamerakugel, flache Bergkette und Haus-Dachsicht aktiv")

        func _add_tri(st: SurfaceTool, collision_vertices: PackedVector3Array, a: Vector3, b: Vector3, c: Vector3, shade: Color) -> void:
            st.set_color(shade)
            st.add_vertex(a)
            st.add_vertex(b)
            st.add_vertex(c)
            collision_vertices.append_array(PackedVector3Array([a, b, c]))

        func _build_mountain_slope() -> void:
            # Kein hoher senkrechter Abschluss direkt am Spieler mehr.
            # 5 Hoehenprofile, nur hinter z=-93; die Weltgrenze liegt bei z=-82.
            var points: Array[PackedVector3Array] = []
            var rows_z := [-96.0, -106.0, -116.0, -128.0, -142.0]
            for row in range(rows_z.size()):
                var line := PackedVector3Array()
                for i in range(51):
                    var f: float = float(i)
                    var x: float = -100.0 + f * 4.0
                    var wave: float = sin(f * 0.28) * 1.6 + sin(f * 0.71) * 0.65 + cos(f * 0.13) * 1.2
                    var height: float = 0.0
                    if row == 1:
                        height = 2.2 + wave * 0.25
                    elif row == 2:
                        height = 8.7 + wave * 1.2
                    elif row == 3:
                        height = 10.0 + wave * 0.9
                    elif row == 4:
                        height = 4.0 + wave * 0.4
                    line.append(Vector3(x, height, rows_z[row] + sin(f * 0.29) * 1.1))
                points.append(line)
            var colors := [Color("#6f8e85"), Color("#687d7c"), Color("#768892"), Color("#526878")]
            var st := SurfaceTool.new()
            st.begin(Mesh.PRIMITIVE_TRIANGLES)
            var faces := PackedVector3Array()
            for row in range(4):
                for i in range(50):
                    var a: Vector3 = points[row][i]
                    var b: Vector3 = points[row][i + 1]
                    var c: Vector3 = points[row + 1][i]
                    var d: Vector3 = points[row + 1][i + 1]
                    var tone: Color = colors[row].lightened(0.035 * float(i % 4))
                    _add_tri(st, faces, a, c, d, tone)
                    _add_tri(st, faces, a, d, b, tone)
            st.generate_normals()
            var visual := MeshInstance3D.new()
            visual.name = "V20Berglandschaft"
            visual.mesh = st.commit()
            var rock := StandardMaterial3D.new()
            rock.vertex_color_use_as_albedo = true
            rock.roughness = 0.96
            rock.cull_mode = BaseMaterial3D.CULL_DISABLED
            visual.material_override = rock
            game.add_child(visual)

            # Dieselbe sichtbare Geometrie erhaelt Kollision (statisch, ausserhalb der Karte).
            var solid := StaticBody3D.new()
            solid.name = "V20Bergkollision"
            var shape := ConcavePolygonShape3D.new()
            shape.set_faces(faces)
            shape.backface_collision = true
            var collider := CollisionShape3D.new()
            collider.shape = shape
            solid.add_child(collider)
            game.add_child(solid)

        func _find_house_roofs() -> void:
            for node in game.get_children():
                if not (node is Node3D) or node == game.hero:
                    continue
                var root := node as Node3D
                var is_house := false
                var roof: MeshInstance3D = null
                for child in root.get_children():
                    if child is StaticBody3D:
                        is_house = true
                    elif child is MeshInstance3D:
                        var visual := child as MeshInstance3D
                        if visual.mesh is ArrayMesh:
                            roof = visual
                if is_house and roof != null:
                    roofs.append(roof)
                    roof_centers.append(root.global_position)

        func _update_roofs() -> void:
            var pos: Vector3 = game.hero.global_position
            for i in range(roofs.size()):
                if not is_instance_valid(roofs[i]):
                    continue
                var dist: float = Vector2(pos.x, pos.z).distance_to(Vector2(roof_centers[i].x, roof_centers[i].z))
                # Die groessere Grenze beim Wiedereinblenden vermeidet Flackern.
                if dist < 5.7:
                    roofs[i].visible = false
                elif dist > 7.0:
                    roofs[i].visible = true

        func _clearance(from_pos: Vector3, to_pos: Vector3) -> Dictionary:
            var motion: Vector3 = to_pos - from_pos
            var query := PhysicsShapeQueryParameters3D.new()
            query.shape = ball
            query.transform = Transform3D(Basis(), from_pos)
            query.motion = motion
            query.exclude = [game.hero.get_rid()]
            query.collision_mask = 1
            query.collide_with_bodies = true
            var fractions: PackedFloat32Array = game.get_world_3d().direct_space_state.cast_motion(query)
            var fraction: float = 1.0
            if fractions.size() > 0:
                fraction = clampf(fractions[0], 0.0, 1.0)
            # Sicherheitsabstand zum Hindernis, auch bei schnellen Schwenks.
            var length: float = motion.length()
            var distance: float = maxf(0.0, length * fraction - 0.18)
            return {"pos": from_pos + motion.normalized() * distance, "fraction": fraction, "distance": distance}

        func _physics_process(delta: float) -> void:
            if game == null or game.hero == null or game.camera_node == null:
                return
            if game.state != 2:
                return
            var current_pos: Vector3 = game.hero.global_position
            var safe_x: float = clampf(current_pos.x, -75.0, 75.0)
            var safe_z: float = clampf(current_pos.z, -77.0, 60.0)
            if absf(current_pos.x - safe_x) > 0.1 or absf(current_pos.z - safe_z) > 0.1:
                game.hero.global_position = Vector3(safe_x, maxf(current_pos.y, 0.1), safe_z)
            _update_roofs()
            var center: Vector3 = game.hero.global_position + Vector3(0, 1.5, 0)
            var heading: float = game.hero.rotation.y
            var back := Vector3(sin(heading), 0.0, cos(heading))
            var side := Vector3(cos(heading), 0.0, -sin(heading))
            var candidates: Array[Vector3] = [
                center + back * 6.7 + Vector3.UP * 2.8,
                center + back * 5.8 + side * 2.7 + Vector3.UP * 4.4,
                center + back * 5.8 - side * 2.7 + Vector3.UP * 4.4,
                center + back * 4.2 + Vector3.UP * 6.3
            ]
            var best: Vector3 = candidates[0]
            var best_index: int = 0
            var best_score: float = -10000.0
            for i in range(candidates.size()):
                var info: Dictionary = _clearance(center, candidates[i])
                var amount: float = float(info["distance"])
                var score: float = amount - (0.0 if i == 0 else 0.85)
                if float(info["fraction"]) < 0.55:
                    score -= 2.0
                if i == previous_camera_option:
                    score += 0.55
                if score > best_score:
                    best_score = score
                    best = info["pos"]
                    best_index = i
            previous_camera_option = best_index
            var current: Vector3 = game.camera_node.global_position
            var speed: float = 11.0 if center.distance_to(best) < center.distance_to(current) else 4.6
            var smooth: Vector3 = current.lerp(best, minf(1.0, delta * speed))
            # Noch ein Kugel-Test nach der Glaettung: keine Kamera-Durchdringung.
            var safety: Dictionary = _clearance(center, smooth)
            game.camera_node.global_position = safety["pos"]
            game.camera_node.look_at(center)
        LWOD_V20_TERRAIN
        test -s android/scripts/V20CameraTerrain.gd
        printf '%s  %s\n' 'd2a0adf1c358658fe4b803723ac19a8d591e08c162ed2a34be12655327d5f638' 'android/scripts/V20CameraTerrain.gd' | sha256sum -c -
        test "$(grep -Fxc '    v19_safety.setup(self)' android/scripts/Main.gd)" -eq 1
        awk '
          { print }
          $0 == "    v19_safety.setup(self)" {
            print "    var v20_camera = load(\"res://scripts/V20CameraTerrain.gd\").new()"
            print "    v20_camera.name = \"V20CameraTerrain\""
            print "    add_child(v20_camera)"
            print "    v20_camera.setup(self)"
            n++
          }
          END { if (n != 1) exit 43 }
        ' android/scripts/Main.gd > "$RUNNER_TEMP/Main_v20.gd"
        mv "$RUNNER_TEMP/Main_v20.gd" android/scripts/Main.gd
        grep -Fqx '    v20_camera.setup(self)' android/scripts/Main.gd
        sed -i 's@version/code=19@version/code=20@' android/export_presets.cfg
        sed -i 's@version/name="1.9"@version/name="2.0"@' android/export_presets.cfg
        grep -Fqx 'version/code=20' android/export_presets.cfg
        echo 'V20: Kugelkamera, weiter entferntes Gebirge und Dach-Ausblendung installiert'
    - name: V21 Weltkarte Minimap Tag Nacht und Rucksackposition
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p android/scripts
        cat > android/scripts/V21World.gd <<'LWOD_V21_WORLD'
        extends Node

        # Android V21: große zusammenhängende Karte, Tag/Nacht und sichere Kamera.
        # Die bewährten Menüs, Eingaben und Spielstände der V20-Basis bleiben erhalten.
        const LIMIT := 288.0
        const CYCLE_SECONDS := 480.0

        var game: Node3D
        var v20_camera: Node
        var cam_shape: SphereShape3D
        var sun: DirectionalLight3D
        var sky: Environment
        var day_clock := 0.0
        var previous_camera_option := 0
        var settlements: Array[Dictionary] = [
            {"name": "Nordhafen", "pos": Vector2(-165.0, -155.0)},
            {"name": "Kristallpass", "pos": Vector2(170.0, -170.0)},
            {"name": "Dämmerwald", "pos": Vector2(-170.0, 160.0)},
            {"name": "Südwacht", "pos": Vector2(175.0, 160.0)}
        ]
        var routes: Array[PackedVector2Array] = []

        func setup(root: Node3D) -> void:
            game = root
            process_priority = 170
            cam_shape = SphereShape3D.new()
            cam_shape.radius = 0.40
            v20_camera = game.get_node_or_null("V20CameraTerrain")
            if v20_camera != null:
                v20_camera.set_physics_process(false)  # Alte 150x150-Begrenzung aus V20 deaktivieren
            _disable_old_perimeter()
            _build_extended_ground()
            _build_roads()
            _build_outposts()
            _build_forests()
            _build_outer_mountains()
            _build_new_perimeter()
            _find_sun_and_sky()
            print("LWOD V21: Karte 600x600, vier Siedlungen, Kompass und Tag/Nacht eingerichtet")

        func _disable_old_perimeter() -> void:
            for label in ["V19Weltgrenzen", "V19GebirgsKollision", "V20Bergkollision"]:
                var body := game.get_node_or_null(label)
                if body is CollisionObject3D:
                    body.collision_layer = 0
                    body.collision_mask = 0
            for label in ["V19Felsgebirge", "V20Berglandschaft"]:
                var visual := game.get_node_or_null(label)
                if visual is Node3D:
                    visual.visible = false
            var old_v17 := game.get_node_or_null("V17Gebirgszuege")
            if old_v17 is Node3D:
                old_v17.visible = false

        func _build_extended_ground() -> void:
            # Alte Dorfmitte behält ihren Boden; neue Fläche liegt 2cm tiefer.
            game._box(game, Vector3(0.0, -0.51, 0.0), Vector3(600.0, 1.0, 600.0), Color("#729d6e"), true)
            var rng := RandomNumberGenerator.new()
            rng.seed = 20261121
            for i in range(100):
                var x: float = rng.randf_range(-280.0, 280.0)
                var z: float = rng.randf_range(-280.0, 280.0)
                if absf(x) < 86.0 and z > -90.0 and z < 72.0:
                    continue
                var scale_x: float = rng.randf_range(5.0, 16.0)
                var scale_z: float = rng.randf_range(4.0, 12.0)
                var shade := Color("#76a874") if i % 3 == 0 else Color("#699667")
                game._box(game, Vector3(x, -0.001, z), Vector3(scale_x, 0.01, scale_z), shade)

        func _road(a: Vector2, b: Vector2, width: float = 5.5) -> void:
            var dx: float = b.x - a.x
            var dz: float = b.y - a.y
            var length: float = sqrt(dx * dx + dz * dz)
            if length < 0.1:
                return
            var center := Vector3((a.x + b.x) * 0.5, 0.026, (a.y + b.y) * 0.5)
            var mesh := game._box(game, center, Vector3(width, 0.035, length + 1.0), Color("#b9a37d")) as MeshInstance3D
            mesh.rotation.y = atan2(dx, dz)

        func _route(points: PackedVector2Array) -> void:
            routes.append(points)
            for i in range(points.size() - 1):
                _road(points[i], points[i + 1])

        func _build_roads() -> void:
            # Bestehender Sonnental-Pfad bleibt im Startdorf unverändert.
            _route(PackedVector2Array([Vector2(0,-62), Vector2(-32,-83), Vector2(-105,-123), Vector2(-165,-155)]))
            _route(PackedVector2Array([Vector2(0,-62), Vector2(44,-104), Vector2(104,-143), Vector2(170,-170)]))
            _route(PackedVector2Array([Vector2(0,52), Vector2(-35,91), Vector2(-100,119), Vector2(-170,160)]))
            _route(PackedVector2Array([Vector2(0,52), Vector2(39,94), Vector2(105,133), Vector2(175,160)]))
            _route(PackedVector2Array([Vector2(-170,160), Vector2(-209,30), Vector2(-165,-155)]))
            _route(PackedVector2Array([Vector2(175,160), Vector2(216,25), Vector2(170,-170)]))

        func _outpost_house(pos: Vector3, house_type: int) -> void:
            var root := Node3D.new()
            root.name = "V21Haus"
            root.position = pos
            game.add_child(root)
            var stone: Color = [Color("#dacdb3"), Color("#bbc9c4"), Color("#cbb99e"), Color("#d6ceca")][house_type % 4]
            game._box(root, Vector3(0,1.5,0), Vector3(5.0,3.0,5.0), stone, true)
            if house_type % 3 == 0:
                game._cone(root, Vector3(0,3.75,0), 3.6, 1.5, Color("#674a5d"), 8)
            else:
                game._roof(root, 5.0, 5.0, Color("#765762") if house_type % 2 == 0 else Color("#595872"))
            game._box(root, Vector3(0,1.05,2.56), Vector3(1.0,2.05,0.12), Color("#6e513d"))
            for x in [-1.45,1.45]:
                game._box(root, Vector3(x,1.95,2.58), Vector3(0.75,0.78,0.12), Color("#64a3c4"))
            if house_type % 2 == 0:
                game._box(root, Vector3(1.7,4.05,-0.8), Vector3(0.43,1.7,0.43), Color("#6d6060"))

        func _build_outposts() -> void:
            for s in range(settlements.size()):
                var center: Vector2 = settlements[s]["pos"]
                for i in range(6):
                    var side: float = -1.0 if i % 2 == 0 else 1.0
                    var row: float = float(i / 2)
                    _outpost_house(Vector3(center.x + side * (10.0 + float(s % 2)*1.5), 0, center.y + (row - 1.0) * 13.0), s + i)
                game._box(game, Vector3(center.x, 0.70, center.y + 22.0), Vector3(3.0,1.4,0.25), Color("#75563e"))

        func _build_forests() -> void:
            var rng := RandomNumberGenerator.new()
            rng.seed = 882007
            for i in range(210):
                var x: float = rng.randf_range(-275.0,275.0)
                var z: float = rng.randf_range(-275.0,275.0)
                if absf(x) < 18.0 and z > -75.0 and z < 70.0:
                    continue
                var near_settlement := false
                for entry in settlements:
                    var p: Vector2 = entry["pos"]
                    if Vector2(x,z).distance_to(p) < 23.0:
                        near_settlement = true
                        break
                if near_settlement:
                    continue
                game._tree(Vector3(x,0,z), rng.randf_range(0.75,1.55))
            for i in range(80):
                var x: float = rng.randf_range(-265.0,265.0)
                var z: float = rng.randf_range(-265.0,265.0)
                if absf(x) < 80.0 and absf(z) < 85.0:
                    continue
                game._box(game, Vector3(x,0.045,z), Vector3(0.8,0.10,0.7), Color("#808880") if i % 2 == 0 else Color("#9b9a82"))

        func _build_outer_mountains() -> void:
            # Gebirge sichtbar HINTER x/z=+/-300, nicht als Wand vor dem Spieler.
            var surface := SurfaceTool.new()
            surface.begin(Mesh.PRIMITIVE_TRIANGLES)
            var rock_colors := [Color("#778e8a"), Color("#607d83"), Color("#71858c"), Color("#5b7682")]
            for side in range(4):
                for i in range(45):
                    var t: float = -350.0 + float(i) * (700.0/45.0)
                    var u: float = -350.0 + float(i+1) * (700.0/45.0)
                    var h0: float = 8.0 + 9.0 * absf(sin(float(i)*0.35+float(side))) + 4.0 * absf(cos(float(i)*0.51))
                    var h1: float = 8.0 + 9.0 * absf(sin(float(i+1)*0.35+float(side))) + 4.0 * absf(cos(float(i+1)*0.51))
                    var base0: Vector3
                    var base1: Vector3
                    var rise0: Vector3
                    var rise1: Vector3
                    var peak0: Vector3
                    var peak1: Vector3
                    if side <= 1:
                        var sign_z: float = -1.0 if side == 0 else 1.0
                        base0 = Vector3(t, -0.1, sign_z*304.0)
                        base1 = Vector3(u, -0.1, sign_z*304.0)
                        rise0 = Vector3(t, h0*0.35, sign_z*320.0)
                        rise1 = Vector3(u, h1*0.35, sign_z*320.0)
                        peak0 = Vector3(t, h0, sign_z*355.0)
                        peak1 = Vector3(u, h1, sign_z*355.0)
                    else:
                        var sign_x: float = -1.0 if side == 2 else 1.0
                        base0 = Vector3(sign_x*304.0,-0.1,t)
                        base1 = Vector3(sign_x*304.0,-0.1,u)
                        rise0 = Vector3(sign_x*320.0,h0*0.35,t)
                        rise1 = Vector3(sign_x*320.0,h1*0.35,u)
                        peak0 = Vector3(sign_x*355.0,h0,t)
                        peak1 = Vector3(sign_x*355.0,h1,u)
                    _quad(surface,base0,base1,rise1,rise0,rock_colors[(i+side)%4])
                    _quad(surface,rise0,rise1,peak1,peak0,rock_colors[(i+side+2)%4])
            surface.generate_normals()
            var mesh := MeshInstance3D.new()
            mesh.name = "V21AussenGebirge"
            mesh.mesh = surface.commit()
            var m := StandardMaterial3D.new()
            m.vertex_color_use_as_albedo = true
            m.roughness = 1.0
            m.cull_mode = BaseMaterial3D.CULL_DISABLED
            mesh.material_override = m
            game.add_child(mesh)

        func _quad(st: SurfaceTool,a: Vector3,b: Vector3,c: Vector3,d: Vector3,col: Color) -> void:
            st.set_color(col)
            st.add_vertex(a)
            st.add_vertex(c)
            st.add_vertex(b)
            st.set_color(col)
            st.add_vertex(a)
            st.add_vertex(d)
            st.add_vertex(c)

        func _build_new_perimeter() -> void:
            var wall := StaticBody3D.new()
            wall.name = "V21AussenGrenze"
            game.add_child(wall)
            for item in [
                [Vector3(0,15,-297),Vector3(595,30,1)],
                [Vector3(0,15,297),Vector3(595,30,1)],
                [Vector3(-297,15,0),Vector3(1,30,595)],
                [Vector3(297,15,0),Vector3(1,30,595)]]:
                var collider := CollisionShape3D.new()
                var shape := BoxShape3D.new()
                shape.size = item[1]
                collider.shape = shape
                collider.position = item[0]
                wall.add_child(collider)

        func _find_sun_and_sky() -> void:
            for node in game.get_children():
                if node is DirectionalLight3D and sun == null:
                    sun = node as DirectionalLight3D
                if node is WorldEnvironment and sky == null:
                    sky = (node as WorldEnvironment).environment

        func is_day() -> bool:
            return fposmod(day_clock,1.0) < 0.5

        func seconds_left_in_period() -> int:
            var p: float = fposmod(day_clock,1.0)
            var limit: float = 0.5 if p < 0.5 else 1.0
            return int(ceil((limit-p)*CYCLE_SECONDS))

        func _update_lighting(delta: float) -> void:
            day_clock = fposmod(day_clock + delta/CYCLE_SECONDS, 1.0)
            var phase: float = day_clock*TAU
            var horizon: float = sin(phase)
            var daylight: float = clampf((horizon+0.20)*2.0,0.0,1.0)
            if sun != null:
                sun.rotation = Vector3(-phase,-0.6,0)
                sun.light_energy = lerpf(0.10,1.35,daylight)
            if sky != null:
                sky.background_color = Color("#101b39").lerp(Color("#88bce0"),daylight)
                sky.ambient_light_energy = lerpf(0.26,0.75,daylight)

        func _clearance(start: Vector3, destination: Vector3) -> Dictionary:
            var move: Vector3 = destination - start
            if move.length() < 0.01:
                return {"pos":destination,"distance":0.0,"fraction":1.0}
            var q := PhysicsShapeQueryParameters3D.new()
            q.shape = cam_shape
            q.transform = Transform3D(Basis(),start)
            q.motion = move
            q.exclude = [game.hero.get_rid()]
            q.collision_mask = 1
            q.collide_with_bodies = true
            var result: PackedFloat32Array = game.get_world_3d().direct_space_state.cast_motion(q)
            var fraction: float = 1.0
            if result.size() > 0:
                fraction = clampf(result[0],0.0,1.0)
            var d: float = maxf(0.0,move.length()*fraction-0.20)
            return {"pos":start+move.normalized()*d,"distance":d,"fraction":fraction}

        func _physics_process(delta: float) -> void:
            if game == null:
                return
            if game.state != 2 or game.hero == null or game.camera_node == null:
                return
            _update_lighting(delta)
            var pos: Vector3 = game.hero.global_position
            # Nur die neue äußere Kartenbegrenzung verwenden.
            var x: float = clampf(pos.x,-LIMIT,LIMIT)
            var z: float = clampf(pos.z,-LIMIT,LIMIT)
            if absf(x-pos.x)>0.1 or absf(z-pos.z)>0.1:
                game.hero.global_position = Vector3(x,maxf(pos.y,0.1),z)
            if v20_camera != null:
                v20_camera._update_roofs()
            var center: Vector3 = game.hero.global_position + Vector3(0,1.5,0)
            var facing: float = game.hero.rotation.y
            var back: Vector3 = Vector3(sin(facing),0,cos(facing))
            var side: Vector3 = Vector3(cos(facing),0,-sin(facing))
            var targets: Array[Vector3] = [
                center+back*6.6+Vector3.UP*2.8,
                center+back*5.8+side*2.4+Vector3.UP*4.2,
                center+back*5.8-side*2.4+Vector3.UP*4.2,
                center+back*4.3+Vector3.UP*6.1
            ]
            var best: Vector3 = targets[0]
            var chosen: int = 0
            var best_score: float = -100000.0
            for i in range(targets.size()):
                var info: Dictionary = _clearance(center,targets[i])
                var score: float = float(info["distance"])-(0.0 if i==0 else 0.9)
                if float(info["fraction"]) < 0.55:
                    score-=2.0
                if previous_camera_option==i:
                    score+=0.45
                if score>best_score:
                    best_score=score
                    best=info["pos"]
                    chosen=i
            previous_camera_option=chosen
            var current: Vector3 = game.camera_node.global_position
            var speed: float = 10.0 if center.distance_to(best)<center.distance_to(current) else 4.7
            var smoothed: Vector3 = current.lerp(best,minf(1.0,delta*speed))
            var safe: Dictionary = _clearance(center,smoothed)
            game.camera_node.global_position=safe["pos"]
            game.camera_node.look_at(center)
        LWOD_V21_WORLD
        cat > android/scripts/V21Minimap.gd <<'LWOD_V21_MAP'
        extends Control

        # Dynamische Karte: Norden oben, Osten rechts. Rucksack direkt darunter.
        var game: Node3D
        var world: Node
        var map_center := Vector2(118.0,118.0)
        var radius := 91.0
        var zoom := 1.10

        func setup(root: Node3D, expansion: Node) -> void:
            game = root
            world = expansion
            mouse_filter = Control.MOUSE_FILTER_IGNORE
            anchor_left = 1.0
            anchor_right = 1.0
            anchor_top = 0.0
            anchor_bottom = 0.0
            offset_left = -252.0
            offset_right = -16.0
            offset_top = 10.0
            offset_bottom = 292.0
            clip_contents = true
            _move_backpack()
            set_process(true)
            print("LWOD V21: Mini-Map, Kompass, Tag/Nacht rechts oben")

        func _move_backpack() -> void:
            if game.backpack_button == null:
                return
            var bag: Control = game.backpack_button
            bag.anchor_left = 1.0
            bag.anchor_right = 1.0
            bag.anchor_top = 0.0
            bag.anchor_bottom = 0.0
            bag.offset_left = -164.0
            bag.offset_right = -86.0
            bag.offset_top = 301.0
            bag.offset_bottom = 374.0

        func _process(_delta: float) -> void:
            if game != null and game.state == 2:
                queue_redraw()

        func _mappos(x: float,z: float) -> Vector2:
            var p: Vector3 = game.hero.global_position
            return map_center + Vector2((x-p.x)*zoom,(z-p.z)*zoom)

        func _write(at: Vector2, text: String, color: Color, sz: int = 15) -> void:
            draw_string(ThemeDB.fallback_font,at,text,HORIZONTAL_ALIGNMENT_LEFT,-1,sz,color)

        func _draw() -> void:
            if game == null or game.hero == null or world == null:
                return
            var gold := Color("#f8d79a")
            draw_rect(Rect2(0,0,236,292),Color(0.025,0.04,0.09,0.72),true)
            draw_rect(Rect2(0,0,236,292),Color(0.80,0.59,0.91,0.68),false,2.0)
            _write(Vector2(13,22),"LYDRA  ·  KARTE",gold,16)
            draw_circle(map_center,radius,Color(0.075,0.17,0.19,0.95))
            draw_arc(map_center,radius,0,TAU,80,Color("#d9b87a"),3.0)
            # Gitter folgt der Spielerposition und liefert ein Gefühl für Entfernungen.
            var player: Vector3 = game.hero.global_position
            for i in range(-4,5):
                var x: float = float(i)*25.0
                var px: float = map_center.x+(x-fposmod(player.x,25.0))*zoom
                if px > 28.0 and px < 208.0:
                    draw_line(Vector2(px,36),Vector2(px,200),Color(1,1,1,0.08),1.0)
                var py: float = map_center.y+(x-fposmod(player.z,25.0))*zoom
                if py > 28.0 and py < 208.0:
                    draw_line(Vector2(35,py),Vector2(201,py),Color(1,1,1,0.08),1.0)
            # Wege und Ortschaften, passend zu den tatsächlichen Weltkoordinaten.
            for route in world.routes:
                for i in range(route.size()-1):
                    var a: Vector2 = _mappos(route[i].x,route[i].y)
                    var b: Vector2 = _mappos(route[i+1].x,route[i+1].y)
                    if a.distance_to(map_center)<radius*2.8 or b.distance_to(map_center)<radius*2.8:
                        draw_line(a,b,Color("#ccb78e"),3.0,true)
            for entry in world.settlements:
                var location: Vector2 = entry["pos"]
                var p: Vector2 = _mappos(location.x,location.y)
                if p.distance_to(map_center)<radius-9.0:
                    draw_circle(p,5.0,Color("#ffe5a5"))
                    _write(p+Vector2(8,-7),str(entry["name"]),Color("#fff5d8"),11)
            # Norden bleibt oben; der weiße Pfeil zeigt die Blickrichtung der Heldin.
            var face: float = game.hero.rotation.y
            var direction := Vector2(-sin(face),-cos(face))
            var sideways := Vector2(-direction.y,direction.x)
            draw_colored_polygon(PackedVector2Array([
                map_center+direction*16.0,
                map_center-direction*8.0+sideways*7.0,
                map_center-direction*8.0-sideways*7.0
            ]),Color("#f9f5ff"))
            draw_circle(map_center,3.5,Color("#a458eb"))
            _write(Vector2(113,38),"N",gold,18)
            _write(Vector2(113,209),"S",gold,18)
            _write(Vector2(30,123),"W",gold,16)
            _write(Vector2(194,123),"O",gold,16)
            # Tag-/Nachtanzeige zeigt die verbleibende Zeit bis zum Wechsel.
            var daytime: bool = world.is_day()
            var remain: int = world.seconds_left_in_period()
            var minutes: int = remain/60
            var seconds: int = remain%60
            draw_circle(Vector2(24,240),7.0,Color("#ffd57b") if daytime else Color("#c8cff7"))
            if not daytime:
                draw_circle(Vector2(27,237),6.0,Color(0.025,0.04,0.09,1.0))
            var label: String = "TAG" if daytime else "NACHT"
            _write(Vector2(43,244),"%s  %02d:%02d" % [label,minutes,seconds],Color("#fff4dd"),16)
            var phase: float = fposmod(world.day_clock,0.5)/0.5
            draw_rect(Rect2(13,259,210,9),Color("#30364e"),true)
            draw_rect(Rect2(13,259,210.0*phase,9),Color("#f4bb74") if daytime else Color("#7b77c9"),true)
            draw_rect(Rect2(13,259,210,9),Color("#d6b982"),false,1.0)
        LWOD_V21_MAP
        printf '%s  %s\n' '0d7b9e48670cd27762503a699c1966a4c97a1a7c699d9d23506348d62ac04457' 'android/scripts/V21World.gd' | sha256sum -c -
        printf '%s  %s\n' 'e0e509ec326f19e280fb9c4294fe4a38931dbee07fadd7399015d79120e86327' 'android/scripts/V21Minimap.gd' | sha256sum -c -
        test "$(grep -Fxc '    v20_camera.setup(self)' android/scripts/Main.gd)" -eq 1
