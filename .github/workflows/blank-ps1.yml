          cat > android/tests/V422AtlasSmoke.gd <<'GDSMOKE422'
          extends SceneTree
          const Map = preload("res://scripts/V417SketchMap.gd")
          const T = preload("res://scripts/V417Territories.gd")
          class FakeGame:
              extends Node
              var hero: Node3D
          func _initialize() -> void:
              call_deferred("_run")
          func fail(s: String) -> void:
              push_error("FIX22: "+s)
              quit(1)
          func _run() -> void:
              var texture: Texture2D = load("res://assets/maps/LWOD_Atlas_HD.webp") as Texture2D
              if texture==null or texture.get_width()!=3072 or texture.get_height()!=1248:
                  fail("HD atlas missing or wrong dimensions")
                  return
              if T.ROUTES.size()!=9 or T.CITIES.size()!=11:
                  fail("world geography changed")
                  return
              var game := FakeGame.new()
              root.add_child(game)
              game.hero = Node3D.new()
              game.add_child(game.hero)
              var start: Vector2 = T.city_world("Sonnental")
              game.hero.position = Vector3(start.x,0.0,start.y)
              var panel := Panel.new()
              root.add_child(panel)
              panel.size = Vector2(1340,650)
              var title := Label.new()
              title.text = "LYDRA - FARBIGE WELTKARTE"
              panel.add_child(title)
              var close := Button.new()
              close.text = "Zurueck zum Spiel"
              panel.add_child(close)
              var view := Control.new()
              panel.add_child(view)
              view.size = Vector2(1300,530)
              var atlas: Control = Map.new()
              view.add_child(atlas)
              atlas.size = view.size
              atlas.call("setup",game)
              await process_frame
              await process_frame
              var area: Rect2 = atlas.call("_layout")
              var pin: Vector2 = atlas.call("_point",T.world_to_map(start),area)
              var expected: Vector2 = area.position+Vector2(0.12,0.18)*area.size
              if pin.distance_to(expected)>0.01 or close.text!="Zurück zum Spiel":
                  fail("marker projection or menu theme")
                  return
              print("FIX22_ATLAS_SMOKE_OK: HD texture, UI frame, live coordinates and nine roads")
              quit(0)
