          fi
      - name: V31 Terrainphysik vorhanden
        shell: bash
        run: |
          set -euo pipefail
          test -s android/scripts/V31TerrainMotion.gd
          grep -Fq 'align_to_ground' android/scripts/Main.gd
          test -s android/scripts/V32TouchRouter.gd
          echo 'V31 terrain verified; V32 exclusive touch test follows'
      - name: V32 Echte Links-Rechts-Multitouch Tests
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path android --script res://tests/V32TouchSmoke.gd > "$RUNNER_TEMP/lwod_v32_touch_test.log" 2>&1 || {
            cat "$RUNNER_TEMP/lwod_v32_touch_test.log"
            exit 1
          }
          cat "$RUNNER_TEMP/lwod_v32_touch_test.log"
          grep -Fq 'V32_TOUCH_TEST_OK:' "$RUNNER_TEMP/lwod_v32_touch_test.log"
      - name: LWOD Android V32 APK erstellen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android
          godot --headless --path android --export-debug 'Android' \
            "$GITHUB_WORKSPACE/build/android/LWOD-Android-V32-Steuerung.apk"
          test -s build/android/LWOD-Android-V32-Steuerung.apk
          unzip -t build/android/LWOD-Android-V32-Steuerung.apk > /dev/null
      - name: Fehlerdiagnose bereitstellen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: LWOD_V32_DIAGNOSE
          path: |
            ${{ runner.temp }}/lwod_v29_run.log
            android/scripts/V24Regions.gd
            android/scripts/V27Terrain.gd
            android/scripts/V27CameraMap.gd
            android/scripts/V27WorldMap.gd
            android/scripts/V28DualStick.gd
            android/scripts/V29IndependentSticks.gd
            android/scripts/Main.gd
            android/scripts/V30MovementRepair.gd
            android/scripts/V31TerrainMotion.gd
            android/scripts/V32TouchRouter.gd
            android/tests/V32TouchSmoke.gd
            ${{ runner.temp }}/lwod_v30_movement_test.log
            android/scripts/TouchOverlay.gd
          if-no-files-found: warn
          retention-days: 14
      - name: Android V32 APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: LWOD_ANDROID_V32_STEUERUNG_APK
          path: build/android/LWOD-Android-V32-Steuerung.apk
          if-no-files-found: error
          retention-days: 14
