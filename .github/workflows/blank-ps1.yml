      shell: bash
      run: |
        set -euo pipefail
        base64 -d > "$RUNNER_TEMP/lydra_v3187_source.webp" <<'LYDRA_V3187_WEBP'
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
