name: LWOD Android V41.7 FIX41 Echte Burgruine und Dungeon
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/blank-ps1.yml
permissions:
  contents: read
jobs:
  android:
    name: LWOD Android V41.7 FIX41 APK
    runs-on: ubuntu-latest
    timeout-minutes: 55
    container:
      image: barichello/godot-ci:4.7.2
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: /usr/lib/android-sdk
    steps:
    - name: FIX39 Sicherung laden
      uses: actions/checkout@v4
      with:
        ref: 9b01d317fffd8d5abf0b2d0afbffb8846c44f1c6
    - name: Python und YAML bereitstellen
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v python3 >/dev/null 2>&1 || ! python3 -c 'import yaml' >/dev/null 2>&1; then
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 python3-yaml
        fi
    - name: FIX39 Schritte sichern
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYREPLAY'
        import hashlib,os,subprocess,yaml
        from pathlib import Path
        raw=Path('.github/workflows/blank-ps1.yml').read_bytes()
        assert hashlib.sha1(('blob %d\0'%len(raw)).encode()+raw).hexdigest()=='148a908318b1d91002357f1acfa18fbf60e347c3','FIX39 source checksum mismatch'
        steps=yaml.safe_load(raw)['jobs']['android']['steps']
        assert len(steps)==21 and steps[10]['name'].startswith('FIX39 Sichtweite und Terrain') and steps[16]['name'].startswith('FIX39 Sichtweite und Chunk')
        folder=Path(os.environ['RUNNER_TEMP'])/'fix41_base';folder.mkdir(exist_ok=True)
        for i in range(2,17):
            s=steps[i];assert s.get('shell')=='bash' and 'if' not in s
            f=folder/('%02d.sh'%i);f.write_text(s['run']+'\n',encoding='utf-8');subprocess.run(['bash','-n',str(f)],check=True)
            print('FIX39 gesichert',i,s['name'],flush=True)
        PYREPLAY
    - name: Erfolgreichen FIX19 Stand laden
      uses: actions/checkout@v4
      with:
        ref: a50b23c0dbeebc464305c0451b98245a0632aebc
    - name: FIX39 vollstaendig rekonstruieren
      shell: bash
      run: |
        set -euo pipefail
        for i in 02 03 04 05 06 07 08 09 10; do
          echo "::group::FIX39 Installationsschritt $i"
          bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/fix41_base/$i.sh"
          echo '::endgroup::'
        done
    - name: FIX41 Burgruine und Untergrund-Dungeon installieren
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p android/scripts android/tests
        cat > 'android/scripts/V441Layout.gd' <<'FIX41_V441LAYOUT'
        extends RefCounted
        # Shared coordinates for ruin, dungeon, player ground and camera.
        const T = preload("res://scripts/V417Territories.gd")
        const OUTER_X: float = 64.0
        const OUTER_Z: float = 72.0
        const ENTRY: Vector2 = Vector2(0,-40)
        const SPAWN: Vector2 = Vector2(0,-44)
        const EXIT: Vector2 = Vector2(0,-49)
        const BACK: Vector2 = Vector2(0,-34)

        static func centre() -> Vector2:
            return T.city_world("Ruine")

        static func forward() -> Vector2:
            return T.gate_direction("Ruine","Ruine").normalized()

        static func right() -> Vector2:
            var d: Vector2 = forward()
            return Vector2(d.y,-d.x)

        static func local(p: Vector3) -> Vector2:
            var q: Vector2 = Vector2(p.x,p.z)-centre()
            return Vector2(q.dot(right()),q.dot(forward()))

        static func world(q: Vector2) -> Vector2:
            return centre()+right()*q.x+forward()*q.y

        static func base(terrain: Node) -> float:
            var c: Vector2 = centre()
            return float(terrain.call("surface_height_at",c.x,c.y)) if is_instance_valid(terrain) else 0.0

        static func outside_height(terrain: Node,q: Vector2) -> float:
            var p: Vector2 = world(q)
            return float(terrain.call("surface_height_at",p.x,p.y)) if is_instance_valid(terrain) else 0.0

        static func in_dungeon(terrain: Node,p: Vector3) -> bool:
            var q: Vector2 = local(p)
            return absf(q.x)<37.0 and q.y>-54.0 and q.y<42.0 and p.y<base(terrain)-12.0

        static func level(q: Vector2) -> float:
            # 12 m descent along a 28 m stair passage, followed by level halls.
            return -24.0-12.0*clampf((q.y+44.0)/28.0,0.0,1.0)

        static func dungeon_floor(terrain: Node,p: Vector3) -> float:
            return base(terrain)+level(local(p))

        static func at(terrain: Node,q: Vector2,underground: bool) -> Vector3:
            var w: Vector2 = world(q)
            var y: float = base(terrain)+level(q) if underground else outside_height(terrain,q)
            return Vector3(w.x,y+0.085,w.y)
        FIX41_V441LAYOUT
        cat > 'android/scripts/V441Castle.gd' <<'FIX41_V441CASTLE'
        extends Node3D
        const L = preload("res://scripts/V441Layout.gd")
        var game: Node
        var terrain: Node
        var stones: Array[Transform3D] = []
        var colors: PackedColorArray = PackedColorArray()
        var rng := RandomNumberGenerator.new()
        var wall_body: StaticBody3D
        var dungeon_body: StaticBody3D
        var cooldown: float = 0.0
        var base_y: float = 0.0
        var stone_mat: StandardMaterial3D
        var torch_mat: StandardMaterial3D

        func setup(owner_game: Node,land: Node) -> void:
            name = "V441VerfalleneBurg"
            game = owner_game
            terrain = land
            rng.seed = 441731
            base_y = L.base(terrain)
            var c: Vector2 = L.centre()
            var d: Vector2 = L.forward()
            position = Vector3(c.x,base_y,c.y)
            rotation.y = atan2(d.x,d.y)
            wall_body = StaticBody3D.new()
            wall_body.name = "BurgKollision"
            add_child(wall_body)
            dungeon_body = StaticBody3D.new()
            dungeon_body.name = "DungeonKollision"
            add_child(dungeon_body)
            stone_mat = StandardMaterial3D.new()
            stone_mat.vertex_color_use_as_albedo = true
            stone_mat.roughness = 1.0
            torch_mat = StandardMaterial3D.new()
            torch_mat.albedo_color = Color("#ffbd58")
            torch_mat.emission_enabled = true
            torch_mat.emission = Color("#ff8d32")
            torch_mat.emission_energy_multiplier = 1.6
            _castle()
            _dungeon()
            _commit_stones()
            process_priority = 900
            set_process(is_instance_valid(game))

        func _ground(q: Vector2) -> float:
            return L.outside_height(terrain,q)-base_y

        func _stone(p: Vector3,size: Vector3,col: Color,yaw: float = 0.0,roll: float = 0.0) -> void:
            var b := Basis(Vector3.UP,yaw)*Basis(Vector3.FORWARD,roll)
            stones.append(Transform3D(b.scaled_local(size),p))
            colors.append(col)

        func _solid(body: StaticBody3D,p: Vector3,size: Vector3,yaw: float = 0.0) -> void:
            var shape := BoxShape3D.new()
            shape.size = size
            var slot := CollisionShape3D.new()
            slot.shape = shape
            slot.position = p
            slot.rotation.y = yaw
            body.add_child(slot)

        func _stone_color(dark: bool = false) -> Color:
            var a := Color("#57534f") if dark else Color("#77776b")
            var b := Color("#827b70") if dark else Color("#aaa597")
            return a.lerp(b,rng.randf())

        func _wall(a: Vector2,b: Vector2,height: float,thick: float,ruined: bool = true,underground: bool = false,floor_y: float = -36.0) -> void:
            var span: float = a.distance_to(b)
            var yaw: float = -atan2((b-a).y,(b-a).x)
            var count: int = maxi(1,ceili(span/3.6))
            var unit: float = span/float(count)
            for i in range(count):
                var q: Vector2 = a.lerp(b,(float(i)+0.5)/float(count))
                var g: float = floor_y if underground else _ground(q)
                var h: float = height
                if ruined:
                    h = height*(0.67+0.23*sin(float(i)*1.07+span)+rng.randf_range(0.0,0.19))
                var rows: int = maxi(2,ceili(h/1.75))
                var row_h: float = h/float(rows)
                # Individual stone courses: small varying joints, no giant grey lintel slab.
                for row in range(rows):
                    var col: Color = _stone_color(underground)
                    var y: float = g-0.35+(float(row)+0.5)*row_h
                    var offset: float = rng.randf_range(-0.04,0.04)
                    _stone(Vector3(q.x,y,q.y),Vector3(unit-0.06,row_h-0.045,thick+offset),col,yaw)
                _solid(dungeon_body if underground else wall_body,Vector3(q.x,g+h*0.5-0.4,q.y),Vector3(unit+0.04,h+0.8,thick),yaw)

        func _tower(q: Vector2,r: float,h: float,opening: float) -> void:
            var sides: int = 16
            for i in range(sides):
                var a: float = TAU*float(i)/float(sides)
                var b: float = TAU*float(i+1)/float(sides)
                if absf(wrapf((a+b)*0.5-opening,-PI,PI))<0.39:
                    continue
                var start: Vector2 = q+Vector2(cos(a),sin(a))*r
                var finish: Vector2 = q+Vector2(cos(b),sin(b))*r
                _wall(start,finish,h+2.8*sin(float(i)*0.55),2.3,true)

        func _arch(q: Vector2,width: float,height: float,depth: float) -> void:
            var ground: float = _ground(q)
            var r: float = width*0.5
            var spring: float = height-r
            for side in [-1.0,1.0]:
                for j in range(5):
                    var p := Vector3(q.x+float(side)*(r+0.85),ground+(float(j)+0.5)*spring/5.0,q.y)
                    _stone(p,Vector3(1.65,spring/5.0-0.045,depth),_stone_color())
                _solid(wall_body,Vector3(q.x+float(side)*(r+0.85),ground+spring*0.5,q.y),Vector3(1.65,spring,depth))
            for i in range(13):
                var angle: float = PI*(float(i)+0.5)/13.0
                var p := Vector3(q.x+cos(angle)*(r+0.65),ground+spring+sin(angle)*(r+0.65),q.y)
                _stone(p,Vector3(1.5,1.35,depth),_stone_color(),0.0,angle-PI*0.5)

        func _sign(parent: Node3D,message: String,p: Vector3) -> void:
            var label := Label3D.new()
            label.text = message
            label.font_size = 54
            label.outline_size = 12
            label.pixel_size = 0.035
            label.modulate = Color("#f7ddb0")
            label.billboard = BaseMaterial3D.BILLBOARD_ENABLED
            label.position = p
            parent.add_child(label)

        func _castle() -> void:
            # Road and existing travel crystal enter through this 16 m gap.
            _wall(Vector2(-64,72),Vector2(-8,72),13.5,3.2)
            _wall(Vector2(8,72),Vector2(64,72),13.5,3.2)
            _arch(Vector2(0,72),16,14,3.2)
            # Broken side walls give the castle a naturally collapsed silhouette.
            _wall(Vector2(-64,72),Vector2(-64,31),14,3.2)
            _wall(Vector2(-64,23),Vector2(-64,-72),16,3.2)
            _wall(Vector2(64,72),Vector2(64,-12),15,3.2)
            _wall(Vector2(64,-23),Vector2(64,-72),14,3.2)
            _wall(Vector2(-64,-72),Vector2(-15,-72),15,3.2)
            _wall(Vector2(-8,-72),Vector2(64,-72),13.0,3.2)
            _tower(Vector2(-54,63),9.5,24,PI*1.5)
            _tower(Vector2(54,63),9.5,29,PI*1.5)
            _tower(Vector2(-54,-63),9.5,22,PI*0.5)
            _tower(Vector2(54,-63),9.5,27,PI*0.5)
            # Two roofless wings: accessible openings and ruined partitions.
            for side in [-1.0,1.0]:
                var x: float = float(side)*37.0
                _wall(Vector2(x-11,-28),Vector2(x+11,-28),10,2)
                _wall(Vector2(x-11,-28),Vector2(x-11,14),9,2)
                _wall(Vector2(x+11,-28),Vector2(x+11,14),7.5,2)
                _wall(Vector2(x-11,14),Vector2(x-4,14),7,2)
                _wall(Vector2(x+4,14),Vector2(x+11,14),6,2)
                _wall(Vector2(x-11,-7),Vector2(x-4,-7),5,1.8)
                _wall(Vector2(x+4,-7),Vector2(x+11,-7),5,1.8)
            # Open keep at the far end of the courtyard; its arch is the dungeon entrance.
            _wall(Vector2(-17,-54),Vector2(17,-54),15,2.6)
            _wall(Vector2(-17,-54),Vector2(-17,-40),13,2.6)
            _wall(Vector2(17,-54),Vector2(17,-40),11,2.6)
            _wall(Vector2(-17,-40),Vector2(-3.8,-40),10,2.6)
            _wall(Vector2(3.8,-40),Vector2(17,-40),10,2.6)
            _arch(L.ENTRY,7.6,7.5,2.6)
            _sign(self,"Untergrund-Dungeon",Vector3(0,_ground(L.ENTRY)+8.3,-39.8))
            # Grounded rubble in the wall breaks and wings, never on the road/teleporter.
            for i in range(95):
                var side: float = -1.0 if i%2==0 else 1.0
                var q := Vector2(side*rng.randf_range(48,61),rng.randf_range(-49,47))
                var w: float = rng.randf_range(0.7,2.4)
                _stone(Vector3(q.x,_ground(q)+w*0.30,q.y),Vector3(w,w*0.62,w*rng.randf_range(0.7,1.35)),_stone_color(),rng.randf_range(0,TAU),rng.randf_range(-0.26,0.26))
            set_meta("castle_size",Vector2(128,144))

        func _floor_box(q: Vector2,y: float,size: Vector2) -> void:
            _stone(Vector3(q.x,y-0.5,q.y),Vector3(size.x,1.0,size.y),Color("#59534d"))

        func _light(q: Vector2,y: float) -> void:
            var fixture := MeshInstance3D.new()
            var m := SphereMesh.new()
            m.radius = 0.24
            m.height = 0.48
            fixture.mesh = m
            fixture.material_override = torch_mat
            fixture.position = Vector3(q.x,y,q.y)
            add_child(fixture)
            var light := OmniLight3D.new()
            light.light_color = Color("#ffbd75")
            light.light_energy = 1.6
            light.omni_range = 19.0
            light.shadow_enabled = false
            light.position = fixture.position
            add_child(light)

        func _dungeon() -> void:
            # Discrete visible stair treads; movement uses a continuous matching slope.
            _floor_box(Vector2(0,-47),-24,8*Vector2(1,0.75))
            for i in range(48):
                var z: float = -44.0+(float(i)+0.5)*28.0/48.0
                var y: float = L.level(Vector2(0,z))
                _floor_box(Vector2(0,z),y,Vector2(8,28.0/48.0+0.03))
            # Sloped wall foundations follow the stair down; no ground snapping to surface.
            for i in range(8):
                var a: float = -50.0+float(i)*4.25
                var b: float = a+4.25
                var y: float = L.level(Vector2(0,b))
                var h: float = -16.0-y
                for x in [-4.8,4.8]:
                    _wall(Vector2(x,a),Vector2(x,b),h,1.5,false,true,y)
            _wall(Vector2(-4.8,-51),Vector2(4.8,-51),9,1.5,false,true,-24)
            # Large main chamber plus side rooms, all connected.
            _floor_box(Vector2(0,12),-36,Vector2(68,56))
            _wall(Vector2(-34,-16),Vector2(-4.8,-16),12,2,false,true)
            _wall(Vector2(4.8,-16),Vector2(34,-16),12,2,false,true)
            _wall(Vector2(-34,-16),Vector2(-34,40),12,2,false,true)
            _wall(Vector2(34,-16),Vector2(34,40),12,2,false,true)
            _wall(Vector2(-34,40),Vector2(34,40),12,2,false,true)
            for x in [-15.0,15.0]:
                _wall(Vector2(x,-16),Vector2(x,0),9,1.6,false,true)
                _wall(Vector2(x,8),Vector2(x,23),9,1.6,false,true)
                _wall(Vector2(x,31),Vector2(x,40),9,1.6,false,true)
            # Ceiling over chamber and stairs (camera remains below it).
            _stone(Vector3(0,-23,12),Vector3(70,1.5,58),Color("#3b3936"))
            _stone(Vector3(0,-15.5,-33),Vector3(12,1.3,36),Color("#403d38"))
            _solid(dungeon_body,Vector3(0,-23,12),Vector3(70,1.5,58))
            _solid(dungeon_body,Vector3(0,-15.5,-33),Vector3(12,1.3,36))
            for p in [Vector2(-3.2,-41),Vector2(3.2,-26),Vector2(0,0),Vector2(0,26),Vector2(-25,12),Vector2(25,12)]:
                _light(p,L.level(p)+4.0)
            _sign(self,"Ausgang zur Burgruine",Vector3(0,-20,-49))
            _sign(self,"Alte Gewölbe",Vector3(0,-30,-13))
            set_meta("dungeon_steps",48)

        func _commit_stones() -> void:
            var mesh := BoxMesh.new()
            mesh.size = Vector3.ONE
            var mm := MultiMesh.new()
            mm.transform_format = MultiMesh.TRANSFORM_3D
            mm.use_colors = true
            mm.mesh = mesh
            mm.instance_count = stones.size()
            for i in range(stones.size()):
                mm.set_instance_transform(i,stones[i])
                mm.set_instance_color(i,colors[i])
            var batch := MultiMeshInstance3D.new()
            batch.name = "BurgUndDungeonSteinmauerwerk"
            batch.multimesh = mm
            batch.material_override = stone_mat
            batch.cast_shadow = GeometryInstance3D.SHADOW_CASTING_SETTING_OFF
            add_child(batch)
            stones.clear()
            colors.clear()

        func _move_to(hero: CharacterBody3D,q: Vector2,under: bool) -> void:
            hero.global_position = L.at(terrain,q,under)
            hero.velocity = Vector3.ZERO
            var cam: Camera3D = game.get("camera_node") as Camera3D
            if is_instance_valid(cam):
                cam.global_position = hero.global_position+Vector3(0,3.0,5.0)
                cam.look_at(hero.global_position+Vector3.UP*1.5)
            cooldown = 1.2

        func _dungeon_camera(hero: CharacterBody3D) -> void:
            # The old outdoor camera may try to move above terrain. Keep its horizontal
            # orbit but constrain the actual view to the underground room and its walls.
            var cam: Camera3D = game.get("camera_node") as Camera3D
            if not is_instance_valid(cam): return
            var focus: Vector3 = hero.global_position+Vector3.UP*1.45
            var offset: Vector3 = cam.global_position-focus
            offset.y = 0.0
            if offset.length_squared()<0.01: offset = hero.global_transform.basis.z
            offset.y = 0.0
            var target: Vector3 = focus+offset.normalized()*4.2+Vector3.UP*1.25
            var space: PhysicsDirectSpaceState3D = get_world_3d().direct_space_state
            var ray := PhysicsRayQueryParameters3D.create(focus,target,hero.collision_mask,[hero.get_rid()])
            var hit: Dictionary = space.intersect_ray(ray)
            if not hit.is_empty():
                var impact: Vector3 = hit["position"]
                target = focus.lerp(impact,0.82)
            if target.distance_squared_to(focus)<0.04: target = focus+Vector3.UP*0.25
            cam.global_position = target
            cam.look_at(focus)

        func _process(delta: float) -> void:
            cooldown = maxf(0.0,cooldown-delta)
            if not is_instance_valid(game) or int(game.get("state"))!=2:
                return
            var hero: CharacterBody3D = game.get("hero") as CharacterBody3D
            if not is_instance_valid(hero) or bool(hero.get_meta("v414_fused",false)):
                return
            var p: Vector3 = hero.global_position
            var q: Vector2 = L.local(p)
            if L.in_dungeon(terrain,p):
                _dungeon_camera(hero)
                if cooldown<=0.0 and q.distance_to(L.EXIT)<1.8:
                    _move_to(hero,L.BACK,false)
            elif cooldown<=0.0 and q.distance_to(L.ENTRY)<1.8 and absf(p.y-L.outside_height(terrain,q))<2.0:
                _move_to(hero,L.SPAWN,true)
        FIX41_V441CASTLE
        cat > 'android/tests/V441RuineSmoke.gd' <<'FIX41_V441RUINESMOKE'
        extends SceneTree
        const L = preload("res://scripts/V441Layout.gd")
        const Castle = preload("res://scripts/V441Castle.gd")
        const Landmarks = preload("res://scripts/V417Landmarks.gd")
        const Motion = preload("res://scripts/V31TerrainMotion.gd")
        class TestTerrain:
            extends Node3D
            func surface_height_at(_x: float,_z: float) -> float:
                return 12.0
        class TestGame:
            extends Node3D
            var state: int = 2
            var hero: CharacterBody3D
            var camera_node: Camera3D
        func _initialize() -> void:
            call_deferred("_run")
        func _fail(msg: String) -> void:
            push_error("FIX41: "+msg)
            quit(1)
        func _run() -> void:
            var g := TestGame.new()
            root.add_child(g)
            var t := TestTerrain.new()
            t.name = "V27ContinuousTerrain"
            g.add_child(t)
            g.hero = CharacterBody3D.new()
            g.add_child(g.hero)
            g.hero.global_position = L.at(t,Vector2.ZERO,false)
            var landmarks := Landmarks.new()
            g.add_child(landmarks)
            landmarks.game = g
            landmarks.terrain = t
            var ruin: Node3D = landmarks._create("Ruine",L.centre())
            var castle: Node3D = ruin.get_node_or_null("V441VerfalleneBurg") as Node3D
            if castle==null or ruin.get_child_count()!=1:
                _fail("old blocks still generated or castle missing")
                return
            castle.set_process(false)
            var mesh: MultiMeshInstance3D = castle.get_node("BurgUndDungeonSteinmauerwerk") as MultiMeshInstance3D
            if mesh.multimesh.instance_count<1000 or castle.get_node("BurgKollision").get_child_count()<100 or castle.get_node("DungeonKollision").get_child_count()<30:
                _fail("missing real masonry or collisions")
                return
            if castle.get_meta("dungeon_steps",0)!=48:
                _fail("descent missing")
                return
            g.hero.global_position = L.at(t,L.ENTRY,false)
            castle.call("_process",1.3)
            if not L.in_dungeon(t,g.hero.global_position) or L.local(g.hero.global_position).distance_to(L.SPAWN)>0.1:
                _fail("walking through arch does not enter dungeon")
                return
            var motion := Motion.new()
            motion.terrain=t
            var start: float = float(motion.call("_floor_at",g.hero.global_position))
            var end: float = float(motion.call("_floor_at",L.at(t,Vector2(0,-16),true)))
            if absf(start-end-12.0)>0.01 or absf(end-(12.0-36.0))>0.01:
                _fail("walking height does not follow underground staircase")
                return
            g.hero.global_position = L.at(t,L.EXIT,true)
            castle.call("_process",1.3)
            if L.in_dungeon(t,g.hero.global_position) or L.local(g.hero.global_position).distance_to(L.BACK)>0.1:
                _fail("return to surface failed")
                return
            g.free()
            print("FIX41_RUINE_OK: real castle replacement, wall collisions, 48 stairs, underground floor and exit")
            quit(0)
        FIX41_V441RUINESMOKE
        cat > '/tmp/lwod_fix41.py' <<'FIX41_PATCH'
        from pathlib import Path
        import re, os
        B=Path('android/scripts')
        Q=Path('android/tests')

        def once(s,a,b):
            assert s.count(a)==1, f'FIX41 source anchor {s.count(a)}: {a[:110]}'
            return s.replace(a,b,1)

        def edit(name,fn):
            p=B/name
            p.write_text(fn(p.read_text(encoding='utf-8')),encoding='utf-8')

        def landmarks(s):
            # Remove the exact former 4 pillars and oversized floating lintel at the source.
            pat=r'(?ms)^    elif id == "Ruine":\n.*?(?=^    elif |^    return root)'
            m=re.search(pat,s)
            assert m and '_block(' in m[0], 'FIX41: original ruin branch not found'
            s,n=re.subn(pat,'''    elif id == "Ruine":
                var castle := preload("res://scripts/V441Castle.gd").new()
                root.add_child(castle)
                castle.setup(game,terrain)
        ''',s,count=1)
            assert n==1
            return s
        edit('V417Landmarks.gd',landmarks)

        def motion(s):
            anchor='func _floor_at(p: Vector3) -> float:\n'
            return once(s,anchor,anchor+'''    if is_instance_valid(terrain) and V441Layout.in_dungeon(terrain,p):
                return V441Layout.dungeon_floor(terrain,p)
        ''')+'\nconst V441Layout = preload("res://scripts/V441Layout.gd")\n'
        edit('V31TerrainMotion.gd',motion)

        def fusion(s):
            anchor='func toggle_fusion() -> void:\n    if not _playing():\n        return\n'
            return once(s,anchor,anchor+'''    var v441_actor: CharacterBody3D = game.get("hero") as CharacterBody3D
            var v441_terrain: Node = game.get_node_or_null("V27ContinuousTerrain")
            if is_instance_valid(v441_actor) and is_instance_valid(v441_terrain) and V441Layout.in_dungeon(v441_terrain,v441_actor.global_position):
                return # Flight is not available in the underground rooms.
        ''')+'\nconst V441Layout = preload("res://scripts/V441Layout.gd")\n'
        edit('V414Fusion.gd',fusion)
        # Suppress the old outdoor camera floor clamp only while underground. There is also
        # a collision-aware dungeon camera fallback in V441Castle itself.
        p=B/'V27CameraMap.gd'
        s=p.read_text(encoding='utf-8')
        anchor='        desired.y = maxf(desired.y,ground+1.25)'
        if s.count(anchor)==1:
            s=s.replace(anchor,'        if not V441Layout.in_dungeon(terrain,hero.global_position):\n    '+anchor,1)
            s+='\nconst V441Layout = preload("res://scripts/V441Layout.gd")\n'
            p.write_text(s,encoding='utf-8')
            print('FIX41 outdoor camera clamp patched')
        else:
            print('FIX41 dungeon camera fallback active')
        # Old decoration exclusion was 160 m around Ruine, covering entire 128 x 144 m castle.
        # Preserve it, existing map / teleporter / landscape and the old streaming fixes.
        p=B/'V27Terrain.gd';s=p.read_text(encoding='utf-8');assert 'city == "Ruine"' in s
        p=Path('android/export_presets.cfg');s=p.read_text(encoding='utf-8')
        s=once(s,'version/code=4209','version/code=4211');s=once(s,'version/name="4.1.7.39"','version/name="4.1.7.41"');p.write_text(s,encoding='utf-8')
        print('FIX41_INSTALL_OK: old pillars removed; real castle and underground layout linked to player and flight')
        FIX41_PATCH
        python3 -m py_compile /tmp/lwod_fix41.py
        python3 /tmp/lwod_fix41.py
    - name: Sicherungen und alle FIX39 Godot-Tests
      shell: bash
      run: |
        set -euo pipefail
        for i in 11 12 13 14 15 16; do
          echo "::group::FIX39 Originaltest $i"
          bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/fix41_base/$i.sh"
          echo '::endgroup::'
        done
    - name: FIX41 Burgruine Treppe und Dungeon-Rueckweg testen
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p build/diagnose
        timeout --signal=TERM --kill-after=5s 140s godot --headless --path android --quit-after 300 --script res://tests/V441RuineSmoke.gd 2>&1 | tee build/diagnose/FIX41_Ruine.log
        if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid call|FIX41: ' build/diagnose/FIX41_Ruine.log; then exit 1; fi
        grep -Fq 'FIX41_RUINE_OK:' build/diagnose/FIX41_Ruine.log
    - name: FIX41 Android APK exportieren und pruefen
      run: |
        set -euo pipefail
        mkdir -p build/android build/diagnose
        APK="$GITHUB_WORKSPACE/build/android/LWOD-Android-V41.7-FIX41.apk"
        rm -f "$APK"
        timeout --signal=TERM --kill-after=5s 900s godot --headless --path android --export-debug Android "$APK" 2>&1 | tee build/diagnose/FIX41_APK_Export.log
        if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script' build/diagnose/FIX41_APK_Export.log; then
          exit 1
        fi
        test -s "$APK"
        unzip -t "$APK" >/dev/null
        unzip -Z1 "$APK" | grep -Fx 'AndroidManifest.xml' >/dev/null
        ls -lh "$APK"
        sha256sum "$APK"
      shell: bash
    - id: apk_upload
      name: FIX41 APK als Download hochladen
      uses: actions/upload-artifact@v4
      with:
        compression-level: 0
        if-no-files-found: error
        name: LWOD_ANDROID_V41_7_FIX41_APK
        path: build/android/LWOD-Android-V41.7-FIX41.apk
        retention-days: 14
    - env:
        APK_ARTIFACT_ID: ${{ steps.apk_upload.outputs.artifact-id }}
        APK_ARTIFACT_URL: ${{ steps.apk_upload.outputs.artifact-url }}
      name: Erfolgreichen APK Upload bestaetigen
      run: |
        set -euo pipefail
        test -n "$APK_ARTIFACT_ID"
        test -n "$APK_ARTIFACT_URL"
        printf '### Android APK Download\n\n[FIX41 APK herunterladen](%s)\n' "$APK_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
      shell: bash
    - if: always()
      name: FIX41 Testprotokolle hochladen
      uses: actions/upload-artifact@v4
      with:
        if-no-files-found: warn
        name: LWOD_FIX41_TESTPROTOKOLLE
        path: build/diagnose
        retention-days: 14
