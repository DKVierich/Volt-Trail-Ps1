        if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid call|FIX61: ' build/diagnose/FIX61_Wegenetz.log;\
        \ then\n  exit 1\nfi\ngrep -Fq 'FIX61_ROADS_OK:' build/diagnose/FIX61_Wegenetz.log\n"
