    - name: V41.4 Gewichtete Gelenke und GLB-Struktur pruefen
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY_WEIGHTS_4140'
        import json, struct
        from pathlib import Path
        import numpy as np
        root=Path('android/assets/characters')
        files=[('LWOD_Heldin_V4140.glb', 15, [('LeftArm','LeftForearm'),('RightArm','RightForearm'),('LeftLeg','LeftShin'),('RightLeg','RightShin')]),
               ('LWOD_Phoenix_Violett_V4140.glb',10,[('WingL','TipL'),('WingR','TipR'),('Body','Tail')])]
        for filename, bones, pairs in files:
            raw=(root/filename).read_bytes()
            assert raw[:4]==b'glTF' and struct.unpack_from('<I',raw,8)[0]==len(raw)
            json_len=struct.unpack_from('<I',raw,12)[0]
            data=json.loads(raw[20:20+json_len])
            bin_start=20+json_len+8
            assert len(data['skins'][0]['joints'])==bones
            name_to_i={n.get('name',''):i for i,n in enumerate(data['nodes'])}
            skin_nodes=data['skins'][0]['joints']
            joint_names={i:data['nodes'][node].get('name','') for i,node in enumerate(skin_nodes)}
            prim=data['meshes'][0]['primitives'][0]
            def accessor(idx):
                a=data['accessors'][idx]; view=data['bufferViews'][a['bufferView']]
                typ={'VEC4':4,'VEC3':3,'VEC2':2,'SCALAR':1}[a['type']]
                dtype={5126:'<f4',5123:'<u2',5125:'<u4'}[a['componentType']]
                start=bin_start+view.get('byteOffset',0)+a.get('byteOffset',0)
                return np.frombuffer(raw,dtype=dtype,count=a['count']*typ,offset=start).reshape(-1,typ)
            joint=accessor(prim['attributes']['JOINTS_0'])
            weight=accessor(prim['attributes']['WEIGHTS_0'])
            assert np.all(np.isfinite(weight))
            assert np.allclose(weight.sum(axis=1),1.0,atol=2.e-5)
            assert np.all(joint< bones)
            total_mixed=int(np.count_nonzero(np.sum(weight>0.05,axis=1)>1))
            assert total_mixed>120, f'{filename}: only {total_mixed} mixed vertices'
            for first,second in pairs:
                ia=skin_nodes.index(name_to_i[first]); ib=skin_nodes.index(name_to_i[second])
                present_a=(joint==ia)&(weight>0.07)
                present_b=(joint==ib)&(weight>0.07)
                both=np.any(present_a,axis=1)&np.any(present_b,axis=1)
                count=int(both.sum())
                assert count>12, f'{filename}: joint blend missing: {first}/{second} ({count})'
                print('BLEND_OK',first,second,count)
            print('V4140_WEIGHT_OK',filename,'mixed_vertices',total_mixed)
        PY_WEIGHTS_4140
