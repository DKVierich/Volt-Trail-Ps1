
name: Build Volt Trail PS1 V17 Controller Fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build unzip curl jq tar \
            ffmpeg python3-pil python3-yaml

      - name: Load original V17 instructions
        shell: bash
        run: |
          set -euo pipefail

          V17_COMMIT="5f9301604f3fdbad966c96f439fb23c891bc7c1d"

          curl --retry 3 -fsSL \
            "https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/$V17_COMMIT/.github/workflows/blank-ps1.yml" \
            -o "$RUNNER_TEMP/v17-original.yml"

          python3 - <<'PY'
          import os
          from pathlib import Path
          import yaml

          path = (
              Path(os.environ["RUNNER_TEMP"])
              / "v17-original.yml"
          )

          data = yaml.safe_load(
              path.read_text(encoding="utf-8")
          )

          names = [
              step.get("name")
              for step in data["jobs"]["build"]["steps"]
          ]

          required = [
              "Prepare stable V16 project",
              "Restore V16 gameplay and intro",
              "Add V17 menu controls and Memory Card",
              "Install PSn00bSDK"
          ]

          for name in required:
              if names.count(name) != 1:
                  raise RuntimeError(
                      "Original step missing: " + name
                  )

          print("Original V17 workflow verified")
          PY

      - name: Prepare original project
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          import yaml

          path = (
              Path(os.environ["RUNNER_TEMP"])
              / "v17-original.yml"
          )

          steps = yaml.safe_load(
              path.read_text()
          )["jobs"]["build"]["steps"]

          name = "Prepare stable V16 project"

          matches = [
              step for step in steps
              if step.get("name") == name
          ]

          if len(matches) != 1:
              raise RuntimeError(name)

          subprocess.run(
              [
                  "bash", "-euo", "pipefail",
                  "-c", matches[0]["run"]
              ],
              env=os.environ.copy(),
              check=True
          )

          print("Project prepared")
          PY

      - name: Restore working V16 game
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          import yaml

          path = (
              Path(os.environ["RUNNER_TEMP"])
              / "v17-original.yml"
          )

          steps = yaml.safe_load(
              path.read_text()
          )["jobs"]["build"]["steps"]

          name = "Restore V16 gameplay and intro"

          matches = [
              step for step in steps
              if step.get("name") == name
          ]

          if len(matches) != 1:
              raise RuntimeError(name)

          subprocess.run(
              [
                  "bash", "-euo", "pipefail",
                  "-c", matches[0]["run"]
              ],
              env=os.environ.copy(),
              check=True
          )

          print("Intro and game restored")
          PY

      - name: Restore V17 menu and repair controller
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          import yaml

          workflow = (
              Path(os.environ["RUNNER_TEMP"])
              / "v17-original.yml"
          )

          steps = yaml.safe_load(
              workflow.read_text()
          )["jobs"]["build"]["steps"]

          name = "Add V17 menu controls and Memory Card"

          matches = [
              step for step in steps
              if step.get("name") == name
          ]

          if len(matches) != 1:
              raise RuntimeError(name)

          # Recreate the original V17 game.
          subprocess.run(
              [
                  "bash", "-euo", "pipefail",
                  "-c", matches[0]["run"]
              ],
              env=os.environ.copy(),
              check=True
          )

          source = (
              Path(os.environ["PROJECT_DIR"])
              / "src"
              / "main.c"
          )

          code = source.read_text(
              encoding="utf-8"
          )

          # CRITICAL CONTROLLER FIX:
          #
          # InitCARD(0) disables automatic
          # controller polling in the PS1 BIOS.
          #
          # InitCARD(1) keeps pad input enabled.
          old = "    InitCARD(0);"
          new = "    InitCARD(1);"

          if code.count(old) != 1:
              raise RuntimeError(
                  "Controller initialization "
                  "not found exactly once"
              )

          code = code.replace(
              old, new, 1
          )

          # Confirm that the menu, controller,
          # Memory Card and game are present.
          required = [
              "InitCARD(1);",
              "StartPAD();",
              "StartCARD();",
              "vt_menu_open",
              "vt_menu_choice",
              "PAD_CROSS",
              "PAD_SQUARE",
              "PAD_CIRCLE",
              "PAD_TRIANGLE",
              "vt_save_game(void)",
              "vt_load_game(void)",
              "vt_play_intro();"
          ]

          for marker in required:
              if marker not in code:
                  raise RuntimeError(
                      "Missing feature: " + marker
                  )

          source.write_text(
              code, encoding="utf-8"
          )

          print("CONTROLLER FIX APPLIED")
          print("InitCARD(0) changed to InitCARD(1)")
          print("PS1 pad polling remains enabled")
          print("V17 menu and gameplay preserved")
          PY

      - name: Install PSn00bSDK
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          import yaml

          path = (
              Path(os.environ["RUNNER_TEMP"])
              / "v17-original.yml"
          )

          steps = yaml.safe_load(
              path.read_text()
          )["jobs"]["build"]["steps"]

          name = "Install PSn00bSDK"

          matches = [
              step for step in steps
              if step.get("name") == name
          ]

          if len(matches) != 1:
              raise RuntimeError(name)

          subprocess.run(
              [
                  "bash", "-euo", "pipefail",
                  "-c", matches[0]["run"]
              ],
              env=os.environ.copy(),
              check=True
          )
          PY

      - name: Build Volt Trail V17 Fixed
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            -S "$PROJECT_DIR" \
            -B "$GITHUB_WORKSPACE/build" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PSN00BSDK_CMAKE" \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build \
            "$GITHUB_WORKSPACE/build" \
            --verbose

      - name: Collect PS1 files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          for file in \
            VTRAIL.bin \
            VTRAIL.cue \
            VTRAIL.exe \
            VTRAIL.elf
          do
            SOURCE="$GITHUB_WORKSPACE/build/$file"

            if [ ! -s "$SOURCE" ]; then
              echo "::error::Missing file: $file"
              exit 1
            fi

            cp "$SOURCE" \
              "$GITHUB_WORKSPACE/artifacts/"
          done

          ls -lh "$GITHUB_WORKSPACE/artifacts"

      - name: Upload corrected V17
        uses: actions/upload-artifact@v4
        with:
          name: VoltTrail-PS1-V17-Controller-Fix
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
