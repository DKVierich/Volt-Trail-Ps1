    - name: V31.8.3 PS1 Intro und Menue korrekt deklarieren
      shell: bash
      run: "set -euo pipefail\ncat > \"$RUNNER_TEMP/lydra_v3182_patch.py\" <<'LYDRA_V3182_PATCH'\n#!/usr/bin/env python3\n\
        \"\"\"V31.8.2: 320x240 8bpp menu via two texture pages; 7s intro via VSync(-1).\"\"\"\nfrom pathlib import Path\n\
        import os,re\nfrom PIL import Image\n\nroot=Path(os.environ['PROJECT_DIR'])/'src'\npath=root/'main.c'\ns=path.read_text(encoding='utf-8')\n\
        \ndef fspan(name):\n    matches=list(re.finditer(r'\\bstatic\\s+(?:int|void)\\s+'+re.escape(name)+r'\\s*\\([^;]*?\\\
        )\\s*\\{',s,re.S))\n    if len(matches)!=1:raise RuntimeError('V31.8.2 Funktion erwartet: '+name+' ('+str(len(matches))+')')\n\
        \    begin=matches[0].start();i=matches[0].end();dep=1;state='code'\n    while dep and i<len(s):\n        ch=s[i];nx=s[i+1]\
        \ if i+1<len(s) else ''\n        if state=='code':\n            if ch=='/' and nx=='/':state='line';i+=1\n  \
        \          elif ch=='/' and nx=='*':state='block';i+=1\n            elif ch=='\"':state='string'\n          \
        \  elif ch==\"'\":state='char'\n            elif ch=='{':dep+=1\n            elif ch=='}':dep-=1\n        elif\
        \ state=='line':\n            if ch=='\\n':state='code'\n        elif state=='block':\n            if ch=='*'\
        \ and nx=='/':state='code';i+=1\n        else:\n            if ch=='\\\\':i+=1\n            elif (state=='string'\
        \ and ch=='\"') or (state=='char' and ch==\"'\"):state='code'\n        i+=1\n    if dep:raise RuntimeError('Unbalancierte\
        \ Funktion: '+name)\n    return begin,i\n\ndef replace(name,body):\n    global s\n    a,b=fspan(name);s=s[:a]+body.strip()+\"\
        \\n\"+s[b:]\n\nmenu_img=Path(os.environ['RUNNER_TEMP'])/'lydra_v318_video/menu_hires.jpg'\nwith Image.open(menu_img)\
        \ as img:\n    img=img.convert('RGB').quantize(colors=256,method=Image.Quantize.MEDIANCUT,dither=Image.Dither.NONE)\n\
        \    if img.size!=(320,240):raise RuntimeError('Menu 320x240 fehlt')\n    ind=bytes(img.getdata());palette=img.getpalette()\
        \ or []\n    palette=palette+[0]*(768-len(palette))\n\n# The 8bpp frame spans VRAM x=640..799 (160 16-bit words),\
        \ y=0..239.\n# Two TPages for 256+64 screen pixels. CLUT at x=640,y=242.\nwords=[ind[i]|(ind[i+1]<<8) for i in\
        \ range(0,len(ind),2)]\nclut=[]\nfor k in range(256):\n    r,g,b=palette[3*k:3*k+3]\n    color=((b>>3)<<10)|((g>>3)<<5)|(r>>3)\n\
        \    clut.append(color if color!=0 else 0x8000)\nassert len(words)==38400 and len(clut)==256 and all(clut)\n\
        head=['/* V31.8.2 - original menu from 39017.png; 320x240 indexed color */',\n      '#ifndef LYDRA_V3182_HIRES_MENU_H','#define\
        \ LYDRA_V3182_HIRES_MENU_H',\n      'static const unsigned short vt_v3182_menu_8bpp[38400] __attribute__((aligned(4)))\
        \ = {']\nfor i in range(0,len(words),24):\n    head.append(' '+','.join('0x%04X'%x for x in words[i:i+24])+',')\n\
        head.append('};')\nhead.append('static const unsigned short vt_v3182_clut[256] __attribute__((aligned(4))) =\
        \ {')\nfor i in range(0,len(clut),16):\n    head.append(' '+','.join('0x%04X'%x for x in clut[i:i+16])+',')\n\
        head+=['};','#endif']\n(root/'lydra_v3182_menu.h').write_text('\\n'.join(head)+'\\n',encoding='utf-8')\n\n# Engine-independent\
        \ intro duration. 60 vblanks / second for this NTSC title.\n# Camera/render delays must NOT make 7s turn into\
        \ a minute.\nhelpers=r\"\"\"\n#include \"lydra_v3182_menu.h\"\nstatic unsigned int vt_v3182_intro_vblank=0;\n\
        static int vt_v3182_intro_started=0;\nstatic int vt_v3182_menu_uploaded=0;\n\"\"\"\nneedle='static void vt_v314_input(unsigned\
        \ int pressed) {'\nif s.count(needle)!=1:raise RuntimeError('V31.8.2 Choice anchor missing')\ns=s.replace(needle,helpers+'\\\
        n'+needle,1)\n\nreplace('vt_v314_input',r\"\"\"\nstatic void vt_v314_input(unsigned int pressed) {\n    vt_v314_blink++;\n\
        \    if(vt_v314_phase==-1) {\n        unsigned int now=(unsigned int)VSync(-1);\n        if(!vt_v3182_intro_started)\
        \ {\n            vt_v3182_intro_vblank=now;\n            vt_v3182_intro_started=1;\n        }\n        vt_v314_elapsed=(int)(now-vt_v3182_intro_vblank);\n\
        \        if(vt_v314_elapsed>=420) {\n            vt_v314_phase=2;\n            vt_v314_elapsed=0;\n         \
        \   vt_v314_cursor=0;\n            vt_v314_message=\"\";\n            vt_v3182_menu_uploaded=0;\n        }\n\
        \    } else if(vt_v314_phase==2) {\n        if(pressed&PAD_UP)vt_v314_cursor=(vt_v314_cursor+2)%3;\n        if(pressed&PAD_DOWN)vt_v314_cursor=(vt_v314_cursor+1)%3;\n\
        \        if(pressed&PAD_TRIANGLE) {\n            vt_v314_phase=-1;\n            vt_v314_elapsed=0;\n        \
        \    vt_v314_vram_frame=-1;\n            vt_v3182_intro_started=0;\n            vt_v3182_menu_uploaded=0;\n \
        \       } else if(pressed&(PAD_CROSS|PAD_START)) {\n            if(vt_v314_cursor==0) {\n                vt_v314_active=0;vt_menu_open=0;vt_menu_page=0;\n\
        \                vt_v314_message=\"\";\n            } else if(vt_v314_cursor==1) {\n                int result=vt_load_game();\n\
        \                if(result==1) {\n                    vt_v314_active=0;vt_menu_open=0;vt_menu_page=0;\n     \
        \               vt_v314_message=\"\";\n                } else vt_v314_message=(result==-1)?\"DATEI UNGUELTIG\"\
        :\"KEIN SPIELSTAND\";\n            } else {\n                vt_v314_phase=3;vt_v314_opt_cursor=0;\n        \
        \        vt_v314_message=\"\";\n            }\n        }\n    } else if(vt_v314_phase==3) {\n        if(pressed&PAD_UP)vt_v314_opt_cursor=(vt_v314_opt_cursor+2)%3;\n\
        \        if(pressed&PAD_DOWN)vt_v314_opt_cursor=(vt_v314_opt_cursor+1)%3;\n        if(pressed&PAD_TRIANGLE)vt_v314_phase=2;\n\
        \        if(vt_v314_opt_cursor==0) {\n            if((pressed&PAD_LEFT) && vt_opt_volume>0)vt_opt_volume-=10;\n\
        \            if((pressed&PAD_RIGHT) && vt_opt_volume<100)vt_opt_volume+=10;\n            if(pressed&(PAD_LEFT|PAD_RIGHT))vt_opt_apply_volume();\n\
        \        } else if(vt_v314_opt_cursor==1) {\n            if((pressed&PAD_LEFT) && vt_opt_text_speed>1)vt_opt_text_speed--;\n\
        \            if((pressed&PAD_RIGHT) && vt_opt_text_speed<3)vt_opt_text_speed++;\n        } else if(pressed&(PAD_CROSS|PAD_START))vt_v314_phase=2;\n\
        \    }\n    if(vt_v314_active) {vt_menu_open=1;vt_menu_page=0;}\n}\n\"\"\")\n\nreplace('vt_v314_draw',r\"\"\"\
        \nstatic void vt_v314_draw(void) {\n    RECT texture_rect;\n    unsigned int aligned;\n    POLY_FT4 *q;\n   \
        \ int current=vt_v314_choice_frame();\n    int side;\n    if(current < 0)return;\n\n    if(current < 28) {\n\
        \        /* Intro frames retain their small texture page to preserve PS1 RAM. */\n        if(current != vt_v314_vram_frame)\
        \ {\n            DrawSync(0);  /* Do not overwrite texture during previous GPU draw. */\n            setRECT(&texture_rect,640,0,160,120);\n\
        \            LoadImage(&texture_rect,(u_long *)(void *)vt_v318_frame_rgb555(current));\n            DrawSync(0);\n\
        \            vt_v314_vram_frame=current;\n            vt_v3182_menu_uploaded=0;\n        }\n        aligned=(prim_used+3u)&~3u;\n\
        \        if(aligned+sizeof(POLY_FT4)>sizeof(prim_arena[db]))return;\n        q=(POLY_FT4 *)(prim_arena[db]+aligned);\n\
        \        prim_used=aligned+sizeof(POLY_FT4);\n        setPolyFT4(q);\n        setXY4(q,0,0,320,0,0,240,320,240);\n\
        \        setUV4(q,0,0,159,0,0,119,159,119);\n        setTPage(q,2,0,640,0);\n        setSemiTrans(q,0);setShadeTex(q,0);\n\
        \        setRGB0(q,128,128,128);\n        addPrim(ot[db],q);\n        return;\n    }\n    if(!vt_v3182_menu_uploaded)\
        \ {\n        /* Direct indexed upload: no 19,200-pixel palette expansion per frame. */\n        DrawSync(0);\n\
        \        setRECT(&texture_rect,640,0,160,240);\n        LoadImage(&texture_rect,(u_long *)(void *)vt_v3182_menu_8bpp);\n\
        \        setRECT(&texture_rect,640,242,256,1);\n        LoadImage(&texture_rect,(u_long *)(void *)vt_v3182_clut);\n\
        \        DrawSync(0);\n        vt_v3182_menu_uploaded=1;\n        vt_v314_vram_frame=28;\n    }\n\n    /* Opaque\
        \ selectable rows, painted over BOTH texture quads in OT order. */\n    vt_v3172_menu_slots();\n    for(side=0;side<2;side++)\
        \ {\n        int left=side?256:0;\n        int w=side?64:256;\n        aligned=(prim_used+3u)&~3u;\n        if(aligned+sizeof(POLY_FT4)>sizeof(prim_arena[db]))return;\n\
        \        q=(POLY_FT4 *)(prim_arena[db]+aligned);\n        prim_used=aligned+sizeof(POLY_FT4);\n        setPolyFT4(q);\n\
        \        setXY4(q,left,0,left+w,0,left,240,left+w,240);\n        setUV4(q,0,0,w-1,0,0,239,w-1,239);\n       \
        \ setTPage(q,1,0,side?768:640,0);\n        q->clut=getClut(640,242);\n        setSemiTrans(q,0);setShadeTex(q,0);\n\
        \        setRGB0(q,128,128,128);\n        addPrim(ot[db],q);\n    }\n}\n\"\"\")\n\nfor fn in ('vt_v314_input','vt_v314_draw','vt_v3172_menu_slots','vt_v314_hud'):\n\
        \    fspan(fn)\nfor marker in ('vt_v318_frame_rgb555(current)','vt_load_game(void)','vt_save_game(void)',\n \
        \              'vt_v3173_menu_font','vt_v3173_time_font','vt_v281_resolve_movement();'):\n    if marker not in\
        \ s:raise RuntimeError('V31.8.2 retained feature missing: '+marker)\npath.write_text(s,encoding='utf-8')\nprint('V31.8.2:\
        \ new 320x240 indexed background, 7-second VBlank intro and unchanged playable game.')\n\nLYDRA_V3182_PATCH\n\
        python3 \"$RUNNER_TEMP/lydra_v3182_patch.py\"\n"
