            after=cb(before)
            if before==after:raise RuntimeError(f'No actual change to {name}')
            s=s[:a]+after+s[b:]

        def patch_input(src):
            # The V31.8.12 controller changes from intro (-1) directly to open menu (2).
            # Insert an explicit title gate (4) instead; all options/game paths are preserved.
            pat=r'(if\s*\(\s*vt_v314_elapsed\s*>=\s*420\s*\)\s*\{\s*)vt_v314_phase\s*=\s*2\s*;'
            src,n=re.subn(pat,r'\g<1>vt_v314_phase=4;\n        vt_v314_blink=0;',src,count=1)
            if n!=1:raise RuntimeError('Could not locate the seven-second intro completion')
            pat=r'\}\s*else\s+if\s*\(\s*vt_v314_phase\s*==\s*2\s*\)\s*\{'
