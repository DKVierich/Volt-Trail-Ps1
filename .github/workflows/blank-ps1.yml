    - name: Sicherungen und alle FIX39 Godot-Tests
      shell: bash
      run: |
        set -euo pipefail
        for i in 11 12 13 14 15 16; do
          echo "::group::FIX39 Originaltest $i"
          bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/fix41_base/$i.sh"
          echo '::endgroup::'
        done
    - name: FIX54 Dungeon-Dekoration und Kamera testen
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p build/diagnose
        timeout --signal=TERM --kill-after=5s 140s godot --headless --path android --quit-after 300 --script res://tests/V441RuineSmoke.gd 2>&1 | tee build/diagnose/FIX54_Ruine.log
        if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid call|FIX54: ' build/diagnose/FIX54_Ruine.log; then exit 1; fi
        grep -Fq 'FIX54_RUINE_OK:' build/diagnose/FIX54_Ruine.log
    - name: FIX55 Flugschub und unabhängige Ladezeiten testen
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p build/diagnose
        timeout --signal=TERM --kill-after=5s 150s godot --headless --path android --quit-after 300 --script res://tests/V455BoostSmoke.gd 2>&1 | tee build/diagnose/FIX55_Flugschub.log
        if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid call|FIX55: ' build/diagnose/FIX55_Flugschub.log; then exit 1; fi
        grep -Fq 'FIX55_BOOST_OK:' build/diagnose/FIX55_Flugschub.log
    - name: FIX61 Neun Stadtwege Kurven und Flugschub testen
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p build/diagnose
        set -o pipefail
        timeout --signal=TERM --kill-after=5s 150s godot --headless --path android --quit-after 300 --script res://tests/V456RoadsSmoke.gd 2>&1 | tee build/diagnose/FIX61_Wegenetz.log
        if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid call|FIX61: ' build/diagnose/FIX61_Wegenetz.log; then
          exit 1
        fi
        grep -Fq 'FIX61_ROADS_OK:' build/diagnose/FIX61_Wegenetz.log
    - name: FIX61 Pflasteroptik und Kurven automatisch testen
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p build/diagnose
        timeout --signal=TERM --kill-after=5s 120s godot --headless --path android --quit-after 300 --script res://tests/V461PavingSmoke.gd 2>&1 | tee build/diagnose/FIX61_Pflasterwege.log
        if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid call|FIX61: ' build/diagnose/FIX61_Pflasterwege.log; then
          echo '::error::Pflasterweg- oder Kurventest fehlgeschlagen'; exit 1
        fi
        grep -Fq 'FIX61_PAVING_OK:' build/diagnose/FIX61_Pflasterwege.log
    - name: FIX62 Komplettes Dorfwegenetz und Pflaster nachpruefen
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p build/diagnose
        timeout --signal=TERM --kill-after=5s 120s godot --headless --path android --quit-after 300 --script res://tests/V462AllRoadsSmoke.gd 2>&1 | tee build/diagnose/FIX62_Alle_Wege.log
        if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid call|FIX62: ' build/diagnose/FIX62_Alle_Wege.log; then
          echo '::error::Wurzelheim, Sonnental oder Dorfwegetest fehlgeschlagen'; exit 1
        fi
        grep -Fq 'FIX62_ALL_ROADS_OK:' build/diagnose/FIX62_Alle_Wege.log
    - name: FIX64 Alle Dorfdekorationen und Regionsvarianten testen
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p build/diagnose
        timeout --signal=TERM --kill-after=5s 140s godot --headless --path android --quit-after 300 --script res://tests/V463VillagesSmoke.gd 2>&1 | tee build/diagnose/FIX64_Doerfer.log
        if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid call|FIX64: ' build/diagnose/FIX64_Doerfer.log; then
          echo '::error::FIX64 Dorf-Dekoration kann nicht geladen werden'; exit 1
        fi
        grep -Fq 'FIX64_VILLAGES_OK:' build/diagnose/FIX64_Doerfer.log
    - name: FIX64 Android APK exportieren und pruefen
      run: |
        set -euo pipefail
        mkdir -p build/android build/diagnose
        APK="$GITHUB_WORKSPACE/build/android/LWOD-Android-V41.7-FIX64.apk"
        rm -f "$APK"
        timeout --signal=TERM --kill-after=5s 900s godot --headless --path android --export-debug Android "$APK" 2>&1 | tee build/diagnose/FIX64_APK_Export.log
        if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script' build/diagnose/FIX64_APK_Export.log; then
          exit 1
        fi
        test -s "$APK"
        unzip -t "$APK" >/dev/null
        unzip -Z1 "$APK" | grep -Fx 'AndroidManifest.xml' >/dev/null
        ls -lh "$APK"
        sha256sum "$APK"
      shell: bash
    - id: apk_upload
      name: FIX64 APK als Download hochladen
      uses: actions/upload-artifact@v4
      with:
        compression-level: 0
        if-no-files-found: error
        name: LWOD_ANDROID_V41_7_FIX64_APK
        path: build/android/LWOD-Android-V41.7-FIX64.apk
