        for token in ('static int vt_v281_camera_obstructed(void)',\n              'hold_frames=9;',\n              'camera_pos.vy\
        \ = 62;',\n              'int wanted = vt_v281_camera_obstructed() ? 52 : 0;',\n              'camera_pos.vy\
        \ = 48 + (vt_v28_camera_blend * 2) / 5;',\n              'LYDRA_FIX12_GLOBAL_PERCENT 75',\n              'valid\
        \ geographic transition keeps its new location',\n              'vt_v241_building(-175,125,52,1,1);'):\n    if\
        \ token not in s:raise RuntimeError('FIX21 source verify '+token)\nif Path('artifacts/KAMERA_FIX21_2_DIAGNOSE.txt').stat().st_size<180:\n\
        \    raise RuntimeError('FIX21 missing camera report')\nprint('FIX21.2 camera validated without changes to movement\
