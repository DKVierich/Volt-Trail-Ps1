name: LWOD Android V41.2 Violet Hair and Phoenix Wings
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/blank-ps1.yml
permissions:
  contents: read
jobs:
  android:
    name: LWOD Android V41.2 APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: barichello/godot-ci:4.7.2
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: /usr/lib/android-sdk
    steps:
    - name: Repository laden
      uses: actions/checkout@v4
    - name: Grundpakete bereitstellen
      shell: bash
      run: "set -euo pipefail\nif ! python3 -c 'import yaml' >/dev/null 2>&1; then\n  apt-get update -qq\n  DEBIAN_FRONTEND=noninteractive\
        \ apt-get install -y -qq python3-yaml\nfi\n"
    - name: Bestehendes Spiel inklusive NPCs und Sonnental wiederherstellen
      shell: bash
      run: "set -euo pipefail\nwget -q --tries=3 --timeout=60 --https-only -O \"$RUNNER_TEMP/lwod_4094_original.yml\" \\\n  'https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/71e1462a498cf34943c37807df9bc1b2cdece637/.github/workflows/blank-ps1.yml'\n\
        python3 - <<'PY_REBUILD'\nfrom pathlib import Path\nimport subprocess, os, yaml, hashlib\np = Path(os.environ['RUNNER_TEMP'])\
        \ / 'lwod_4094_original.yml'\ndata = p.read_bytes()\nblob_sha = hashlib.sha1(('blob %d\\0' % len(data)).encode() + data).hexdigest()\n\
        assert blob_sha == 'df81453c567051bb0813926abca84d6ba2467196', 'Unerwarteter Basisstand'\nsteps = yaml.safe_load(data)['jobs']['android']['steps']\n\
        assert len(steps) == 10\nfor i in (2,3,4,5):\n    name = steps[i]['name']\n    print('REKONSTRUKTION:', name, flush=True)\n\
        \    subprocess.run(['timeout','--signal=TERM','--kill-after=5s','1200s',\n        'bash','-e','-u','-o','pipefail','-c',steps[i]['run']],check=True)\n\
        print('BASIS_OK: Alle bisherigen Spielinhalte vorhanden',flush=True)\nPY_REBUILD\n"
    - name: 3D-Modell-Werkzeuge bereitstellen
      shell: bash
      run: "set -euo pipefail\nif ! python3 -c 'import numpy, PIL' >/dev/null 2>&1; then\n  apt-get update -qq\n  DEBIAN_FRONTEND=noninteractive\
        \ apt-get install -y -qq python3-numpy python3-pil\nfi\npython3 -c 'import numpy, PIL; print(\"MODEL_DEPENDENCIES_OK\"\
        )'\n"
