              }

              /* Original polygon mountains, drawn as recognizable distant destinations. */
              for (i=-2;i<=2;i++) {
                  int zz=1270+((i+2)&1)*75;
                  int xx=i*350;
                  if (vt_v241_visible(xx,zz,1600))
                      vt_v24_peak(xx,zz,190,220+(i+2)*17,62,99,139);
              }

              if(region==0) {
                  /* SUNMEADOW: larger village, crossroad, bridge, lookout and ruins. */
                  vt_v241_building(-205,265,43,0,1);
                  vt_v241_building(15,330,52,1,1);
                  vt_v241_building(208,280,42,0,0);
                  vt_v241_building(-380,395,49,1,0);
                  vt_v241_building(365,397,46,0,1);
                  vt_v241_building(-100,500,37,0,0);
                  vt_v241_building(165,495,38,1,0);
                  vt_v241_sign(-110,170);
                  vt_v241_sign(140,465);
                  vt_v241_fence(-130,230);
                  vt_v241_fence(140,230);
                  vt_v241_fence(-130,540);
                  vt_v241_fence(140,540);
                  vt_v241_npc(-115,328,0);
                  vt_v241_npc(120,368,1);
                  vt_v241_npc(-300,465,1);
                  vt_v241_npc(255,490,0);
                  vt_v241_bridge(715);
                  vt_v241_ruins(350,880);
                  vt_v241_ruins(-295,1110);
              } else if(region==1) {
                  /* CRYSTAL PASS: tall rock silhouettes and crystal outcrops. */
                  for (i=-4;i<=8;i++) {
                      z=i*160+120;
                      if(vt_v241_visible(-480,z,1050))vt_v24_peak(-480,z,125,165,88,112,152);
                      if(vt_v241_visible(480,z,1050))vt_v24_peak(480,z,125,175,75,108,153);
                      if(vt_v241_visible(-250,z,800)) {
                          draw_box(-250,12,z,17,87,181,206);
                          vt_pyramid(-250,-20,z,17,52,133,219,244);
                      }
                      if(vt_v241_visible(250,z,800)) {
                          draw_box(250,12,z,17,109,195,216);
                          vt_pyramid(250,-20,z,17,50,147,220,248);
                      }
                  }
                  vt_v241_ruins(-190,780);
                  vt_v241_sign(122,250);
                  vt_v241_npc(-115,335,0);
                  vt_v241_npc(115,585,1);
              } else {
                  /* STORM ARENA: wide gate, approach road, stone watchtowers. */
                  vt_v241_building(-390,365,53,0,1);
                  vt_v241_building(370,375,53,0,1);
                  if(vt_v241_visible(0,875,990)) {
                      draw_box(-165,12,875,60,141,89,60);
                      draw_box(165,12,875,60,141,89,60);
                      draw_box(0,-35,875,66,216,161,74);
                      vt_pyramid(-165,-70,875,65,80,210,115,67);
                      vt_pyramid(165,-70,875,65,80,210,115,67);
                  }
                  vt_v241_ruins(-330,740);
                  vt_v241_ruins(335,715);
                  vt_v241_sign(115,265);
                  vt_v241_npc(-115,420,0);
                  vt_v241_npc(125,550,1);
              }
          }'''

          # Put helper definitions immediately before the old world function.
          old_def='static void vt_v24_draw_overworld(void) {'
          once(old_def,new_helpers+'\n'+old_def)
          a,b=function_range(code,'vt_v24_draw_overworld')
          code=code[:a]+new_world+code[b:]

          # Avoid large scene geometry being placed over the player by moving the
          # overworld call ahead of character meshes (directly after ground).
          once('        vt_v24_draw_overworld();\n        draw_hud();', '        draw_hud();')
          once('        draw_ground();', '        draw_ground();\n        vt_v24_draw_overworld();')

          # The original V17 memory-card reader rejected coordinates outside +/-500.
          # A larger world must also accept the larger coordinates when loading saves.
          # Keep the 17-word checksum and all existing save fields unchanged.
          for axis in (2,3):
              for operator, old_limit in (('<','-500'),('>','500')):
                  old='(int32_t)w[%d] %s %s' % (axis,operator,old_limit)
                  new='(int32_t)w[%d] %s %s' % (axis,operator,('-WORLD_LIMIT' if operator=='<' else 'WORLD_LIMIT'))
                  once(old,new)

          # The old world used 1120 as region transition for walkable roads; preserve it.
          required=[
              'VOLT TRAIL V24.1', 'vt_v241_ground();', 'vt_v241_bridge(715);',
              'vt_v241_building(', 'vt_v241_npc(', 'vt_v241_path(',
              'vt_v241_visible(', 'vt_v24_draw_overworld();',
              '#define CAMERA_Z 255', 'vt_v23_field_dragon();',
              'vt_v21_party[3]', 'vt_save_game(void)', 'vt_load_game(void)',
              'InitCARD(1);', 'vt_play_intro();',
          ]
          for term in required:
              if term not in code: raise RuntimeError('Missing V24.1 feature: '+term)
          source.write_text(code,encoding='utf-8')
          print('V24.1 large low-poly world ready')
          print('V24.1 wider camera, large buildings, villagers, signs, bridges and paths')
          print('Original V23/V24 gameplay, dragon team, codex, intro and saves untouched')
          PY

      - name: V24.2 Tilt camera and show true ground perspective
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          source = Path(os.environ['PROJECT_DIR']) / 'src/main.c'
          code = source.read_text(encoding='utf-8')

          def once(old, new):
              global code
              count = code.count(old)
              if count != 1:
                  raise RuntimeError('V24.2 camera anchor not found uniquely: '
                                     + repr(old) + ' count=' + str(count))
              code = code.replace(old, new, 1)

          # Keep all existing characters, NPCs, missions, combat, menu and save format.
          once('VOLT TRAIL V24.1 - %s', 'VOLT TRAIL V24.2 - %s')
          once('VOLT TRAIL V24.1 - MENUE', 'VOLT TRAIL V24.2 - MENUE')

          # The previous camera was almost horizontal, making all terrain appear
          # as a thin strip near the horizon. Pitch downward approximately 15 deg
          # (PS1 uses 4096 angular units per full revolution), then move the
          # camera upwards so near grass and the paths fill the lower screen.
          # Set these immediately before the real rendering matrix is generated;
          # this is more robust than matching the initial camera declarations.
          once('RotMatrix(&camera_rot, &m);',
               'camera_rot.vx = 170;  /* approx. 15 degrees towards ground */\n'
               '        camera_pos.vy = 110; /* camera above the landscape */\n'
               '        RotMatrix(&camera_rot, &m);')

          # Slightly larger geometry projection compensates for the long-distance
          # camera, leaving a spacious view without shrinking the player too much.
          once('gte_SetGeomScreen(180);', 'gte_SetGeomScreen(205);')

          # The V24.1 draw order (ground, props, characters, HUD) is preserved.
          # The existing nearby terrain streaming already draws ground all around
          # the player; it becomes visible once the camera is pitched downward.
          needed = [
              'VOLT TRAIL V24.2', 'camera_rot.vx = 170;',
              'camera_pos.vy = 110;', 'gte_SetGeomScreen(205);',
              'vt_v24_draw_overworld();', 'vt_v241_ground();',
              'vt_v241_bridge(715);', 'vt_v21_party[3]',
              'vt_v23_field_dragon();', 'vt_save_game(void)',
              'vt_load_game(void)', 'InitCARD(1);', 'vt_play_intro();'
          ]
          for marker in needed:
              if marker not in code:
                  raise RuntimeError('V24.2 expected feature missing: ' + marker)

          source.write_text(code, encoding='utf-8')
          print('V24.2: camera pitched down, elevated and projection improved')
          print('V24.2: nearby terrain and long roads can fill more screen height')
          print('V24.2: V24.1 villages, forests, bridge and mountain props kept')
          print('V24.2: dragon team, battles, codex, intro and saves unchanged')
          PY

      - name: Install PSn00bSDK 0.24 directly
        shell: bash
        run: |
          set -euo pipefail

          # Fixed release avoids the GitHub API rate limit (HTTP 403).
          SDK_URL="https://github.com/Lameguy64/PSn00bSDK/releases/download/v0.24/PSn00bSDK-0.24-Linux.zip"
          SDK_ARCHIVE="$RUNNER_TEMP/PSn00bSDK-0.24-Linux.zip"
          SDK_DIR="$RUNNER_TEMP/psn00bsdk"

          echo "Downloading the same PSn00bSDK release used by V20..."
          curl --fail --location --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 3 \
            --connect-timeout 20 \
            "$SDK_URL" -o "$SDK_ARCHIVE"

          test -s "$SDK_ARCHIVE" || {
            echo "::error::PSn00bSDK archive was not downloaded"
            exit 1
          }

          rm -rf "$SDK_DIR"
          mkdir -p "$SDK_DIR"
          unzip -q "$SDK_ARCHIVE" -d "$SDK_DIR"

          SDK_CMAKE="$(find "$SDK_DIR" \
            -type f -path '*/lib/libpsn00b/cmake/sdk.cmake' \
            -print -quit)"

          if [ -z "$SDK_CMAKE" ]; then
            echo "::error::PSn00bSDK CMake toolchain missing"
            exit 1
          fi

          SDK_ROOT="${SDK_CMAKE%/lib/libpsn00b/cmake/sdk.cmake}"
          SDK_COMPILER="$(find "$SDK_ROOT" \
            -type f -name mipsel-none-elf-gcc -print -quit)"
          SDK_ISO="$(find "$SDK_ROOT" \
            -type f -name mkpsxiso -print -quit)"

          if [ -z "$SDK_COMPILER" ] || [ -z "$SDK_ISO" ]; then
            echo "::error::PS1 compiler or CD image builder missing"
            exit 1
          fi

          chmod +x "$SDK_COMPILER" "$SDK_ISO"
          printf 'PSN00BSDK_CMAKE=%s\n' "$SDK_CMAKE" >> "$GITHUB_ENV"
          printf '%s\n' "$(dirname "$SDK_COMPILER")" >> "$GITHUB_PATH"
          printf '%s\n' "$(dirname "$SDK_ISO")" >> "$GITHUB_PATH"

          echo "PSn00bSDK 0.24 installed."
          echo "CMake toolchain: $SDK_CMAKE"
          echo "PS1 compiler: $SDK_COMPILER"

      - name: Build Volt Trail V24.2 3D Landschaft
        shell: bash
        run: |
          set -euxo pipefail
          cmake \
            -S "$PROJECT_DIR" \
            -B "$GITHUB_WORKSPACE/build" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PSN00BSDK_CMAKE" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$GITHUB_WORKSPACE/build" --verbose

      - name: Collect PS1 files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          for file in VTRAIL.bin VTRAIL.cue VTRAIL.exe VTRAIL.elf; do
            SOURCE="$GITHUB_WORKSPACE/build/$file"
            if [ ! -s "$SOURCE" ]; then
              echo "::error::Missing PS1 file: $file"
              exit 1
            fi
            cp "$SOURCE" "$GITHUB_WORKSPACE/artifacts/"
          done
          ls -lh "$GITHUB_WORKSPACE/artifacts"

      - name: Upload Volt Trail V24.2
        uses: actions/upload-artifact@v4
        with:
          name: VoltTrail-PS1-V24-2-3D-Landschaft
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
