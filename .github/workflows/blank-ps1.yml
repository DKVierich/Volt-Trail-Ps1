    - name: V35 Wolken ueber gesamten Himmel - 96 mehrteilige Wolkenbaenke
      shell: bash
      run: "set -euo pipefail\nfile=android/scripts/V26SkyWorldMap.gd\ntest -s \"$file\"\ntest \"$(grep -Fxc ' \
        \   for i in range(8):' \"$file\")\" -eq 1\ntest \"$(grep -Fxc '    sun_node = MeshInstance3D.new()' \"\
        $file\")\" -eq 1\ncat > \"$RUNNER_TEMP/lwod_v35_clouds.gdpart\" <<'LWOD_V35_CLOUDS'\n    # Wolkenhimmel\
        \ V35: 96 Wolkenbaenke auf dem ganzen Himmel, statt 8 Scheiben.\n    # Pro Wolkenbank eine MultiMesh-Instanz:\
        \ viele weiche 3D-Teile, weniger Drawcalls.\n    var cloud_rng := RandomNumberGenerator.new()\n    cloud_rng.seed\
        \ = 202611350\n    var puff_mesh := SphereMesh.new()\n    puff_mesh.radius = 1.0\n    puff_mesh.height =\
        \ 2.0\n    puff_mesh.radial_segments = 10\n    puff_mesh.rings = 6\n    var cloud_material := StandardMaterial3D.new()\n\
        \    cloud_material.albedo_color = Color(0.96, 0.97, 1.0, 0.83)\n    cloud_material.transparency = BaseMaterial3D.TRANSPARENCY_ALPHA\n\
        \    cloud_material.shading_mode = BaseMaterial3D.SHADING_MODE_UNSHADED\n    cloud_material.cull_mode =\
        \ BaseMaterial3D.CULL_DISABLED\n    for cloud_i in range(96):\n        var bank := MultiMeshInstance3D.new()\n\
        \        bank.name = \"Wolkenbank_%03d\" % cloud_i\n        bank.material_override = cloud_material\n  \
        \      var mm := MultiMesh.new()\n        mm.transform_format = MultiMesh.TRANSFORM_3D\n        mm.mesh\
        \ = puff_mesh\n        var puff_count: int = cloud_rng.randi_range(9, 14)\n        mm.instance_count = puff_count\n\
        \        var col: int = cloud_i % 12\n        var row: int = int(cloud_i / 12)\n        var x: float = (float(col)\
        \ - 5.5) * 180.0 + cloud_rng.randf_range(-75.0, 75.0)\n        var z: float = (float(row) - 3.5) * 275.0\
        \ + cloud_rng.randf_range(-80.0, 80.0)\n        var height: float = cloud_rng.randf_range(155.0, 315.0)\n\
        \        bank.position = Vector3(x, height, z)\n        var bank_width: float = cloud_rng.randf_range(45.0,\
        \ 125.0)\n        for puff_i in range(puff_count):\n            var a: float = cloud_rng.randf_range(0.0,\
        \ TAU)\n            var distance: float = cloud_rng.randf_range(0.0, bank_width)\n            var ox: float\
        \ = cos(a) * distance\n            var oz: float = sin(a) * distance * 0.85\n            var oy: float =\
        \ cloud_rng.randf_range(-12.0, 21.0)\n            var size: float = cloud_rng.randf_range(17.0, 37.0)\n\
        \            var scale_vec := Vector3(size * cloud_rng.randf_range(0.9, 1.5),\n                size * cloud_rng.randf_range(0.78,\
        \ 1.30),\n                size * cloud_rng.randf_range(0.85, 1.55))\n            mm.set_instance_transform(puff_i,\n\
        \                Transform3D(Basis().scaled(scale_vec), Vector3(ox, oy, oz)))\n        bank.multimesh =\
        \ mm\n        cloud_root.add_child(bank)\nLWOD_V35_CLOUDS\nawk -v replacement=\"$RUNNER_TEMP/lwod_v35_clouds.gdpart\"\
        \ '\n  $0 == \"    for i in range(8):\" && !found {\n    while ((getline line < replacement) > 0) print\
        \ line\n    close(replacement)\n    skip=1; found=1; next\n  }\n  skip && $0 == \"    sun_node = MeshInstance3D.new()\"\
        \ {\n    skip=0\n    print\n    next\n  }\n  !skip { print }\n  END { if (!found || skip) exit 22 }\n' \"\
        $file\" > \"$RUNNER_TEMP/V26SkyWorldMap_v35.gd\"\nmv \"$RUNNER_TEMP/V26SkyWorldMap_v35.gd\" \"$file\"\n\
        # 96 Wolkenbaenke statt zentraler Wolkenansammlung; weiter Ziehbereich.\nsed -i 's/c.position.x > 165.0/c.position.x\
        \ > 1160.0/; s/c.position.x = -165.0/c.position.x = -1160.0/' \"$file\"\ntest \"$(grep -Fc 'range(96)' \"\
        $file\")\" -eq 1\ngrep -Fq 'c.position.x > 1160.0' \"$file\"\n# Bestehende Himmelskoerper, Touch-Steuerung\
        \ und Spielwelt bleiben unveraendert.\ngrep -Fq 'sun_node.scale = Vector3.ONE * 24.0' \"$file\"\ngrep -Fq\
        \ 'moon_node.scale = Vector3.ONE * 19.0' \"$file\"\nsed -i 's@version/code=34@version/code=35@' android/export_presets.cfg\n\
        sed -i 's@version/name=\"3.4\"@version/name=\"3.5\"@' android/export_presets.cfg\ngrep -Fqx 'version/code=35'\
        \ android/export_presets.cfg\necho 'V35: 96 verteilte Wolkenbaenke erzeugt, Sonne und Mond erhalten'\n"
    - name: V36 Sonne und Mond korrekt hinter Wolken rendern
      shell: bash
      run: "set -euo pipefail\nfile=\"android/scripts/V26SkyWorldMap.gd\"\ntest -s \"$file\"\n# V35-Wolken als blickdichte\
        \ 3D-Koerper zeichnen: sie schreiben in den Tiefenpuffer.\n# Sonne und Mond werden auf eine weiter entfernte\
        \ Umlaufbahn verschoben.\n# Die Skalierung erfolgt proportional, damit ihre sichtbare Groesse gleich bleibt.\n\
        grep -Fqx '    cloud_material.albedo_color = Color(0.96, 0.97, 1.0, 0.83)' \"$file\"\ngrep -Fqx '    cloud_material.transparency\
        \ = BaseMaterial3D.TRANSPARENCY_ALPHA' \"$file\"\ngrep -Fqx '    sun_node.scale = Vector3.ONE * 24.0' \"\
        $file\"\ngrep -Fqx '    moon_node.scale = Vector3.ONE * 19.0' \"$file\"\ngrep -Fqx '        sun_node.position\
        \ = Vector3(cos(angle)*290.0, 14.0 + elevation*185.0, -18.0)' \"$file\"\ngrep -Fqx '        moon_node.position\
        \ = Vector3(cos(moon_angle)*285.0, 16.0 + sin(moon_angle)*185.0, 24.0)' \"$file\"\nawk '\n  $0 == \"   \
        \ cloud_material.albedo_color = Color(0.96, 0.97, 1.0, 0.83)\" {print \"    cloud_material.albedo_color\
        \ = Color(0.96, 0.97, 1.0, 1.0)\"; a++; next}\n  $0 == \"    cloud_material.transparency = BaseMaterial3D.TRANSPARENCY_ALPHA\"\
        \ {print \"    cloud_material.transparency = BaseMaterial3D.TRANSPARENCY_DISABLED\"; b++; next}\n  $0 ==\
        \ \"    sun_node.scale = Vector3.ONE * 24.0\" {print \"    sun_node.scale = Vector3.ONE * 264.0\"; c++;\
        \ next}\n  $0 == \"    moon_node.scale = Vector3.ONE * 19.0\" {print \"    moon_node.scale = Vector3.ONE\
        \ * 209.0\"; d++; next}\n  $0 == \"        sun_node.position = Vector3(cos(angle)*290.0, 14.0 + elevation*185.0,\
        \ -18.0)\" {print \"        sun_node.position = Vector3(cos(angle)*3190.0, 154.0 + elevation*2035.0, -198.0)\"\
        ; e++; next}\n  $0 == \"        moon_node.position = Vector3(cos(moon_angle)*285.0, 16.0 + sin(moon_angle)*185.0,\
        \ 24.0)\" {print \"        moon_node.position = Vector3(cos(moon_angle)*3135.0, 176.0 + sin(moon_angle)*2035.0,\
        \ 264.0)\"; f++; next}\n  {print}\n  END { if(a!=1 || b!=1 || c!=1 || d!=1 || e!=1 || f!=1) exit 36 }\n\
        ' \"$file\" > \"$RUNNER_TEMP/lwod_v36_sky.gd\"\nmv \"$RUNNER_TEMP/lwod_v36_sky.gd\" \"$file\"\n# Vor der\
        \ Sonne liegende Wolken verdecken sie ab jetzt physikalisch korrekt.\ntest \"$(grep -Fc 'cloud_material.transparency\
        \ = BaseMaterial3D.TRANSPARENCY_DISABLED' \"$file\")\" -eq 1\ngrep -Fq 'sun_node.position = Vector3(cos(angle)*3190.0'\
        \ \"$file\"\ngrep -Fq 'moon_node.position = Vector3(cos(moon_angle)*3135.0' \"$file\"\ngrep -Fq 'for cloud_i\
        \ in range(96):' \"$file\"\nsed -i 's@version/code=35@version/code=36@; s@version/name=\"3.5\"@version/name=\"\
        3.6\"@' android/export_presets.cfg\ngrep -Fqx 'version/code=36' android/export_presets.cfg\necho 'V36 SKY\
        \ DEPTH OK: 96 Wolkenbaenke verdecken Sonne und Mond bei Ueberlappung'\n"
