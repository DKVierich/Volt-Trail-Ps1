    - name: "Stabile PS1 Basis 12 bis 49 vollstaendig ausfuehren"
      shell: "bash"
      run: "set -euo pipefail\npython3 - <<'LYDRA_GROUPED_BASE'\nimport os, subprocess\nfrom pathlib import Path\nrunner=Path(os.environ['RUNNER_TEMP'])/'lydra_v3185_replay.py'\nassert runner.is_file(), 'Stable build runner is missing'\nenv=os.environ.copy()\ngithub_env=Path(env['GITHUB_ENV'])\ngithub_path=Path(env['GITHUB_PATH'])\n# The runner normally applies these changes between GitHub steps. Because\n# several original steps are bundled here, we explicitly reload them.\ndef load_github_env(text, dest):\n    lines=text.splitlines(); i=0\n    while i<len(lines):\n        entry=lines[i]; i+=1\n        if not entry or entry.startswith('#'):continue\n        if '<<' in entry and ('=' not in entry or entry.index('<<')<entry.index('=')):\n            key,stop=entry.split('<<',1)\n            val=[]\n            while i<len(lines) and lines[i]!=stop:\n                val.append(lines[i]); i+=1\n            if i>=len(lines):raise RuntimeError('Unterminated GITHUB_ENV multiline entry')\n            i+=1\n            dest[key]='\\n'.join(val)\n        elif '=' in entry:\n            key,val=entry.split('=',1)\n            dest[key]=val\n        else:\n            raise RuntimeError('Unexpected GITHUB_ENV entry')\ndef sync_changes():\n    if github_env.exists():load_github_env(github_env.read_text(encoding='utf-8'),env)\n    if github_path.exists():\n        paths=[p for p in github_path.read_text(encoding='utf-8').splitlines() if p]\n        original_path=os.environ.get('PATH','')\n        env['PATH']=':'.join(reversed(paths))+(':' if paths else '')+original_path\nfor i in range(12,50):\n    print(f'LYDRA pinned baseline: {i:02d}/49',flush=True)\n    subprocess.run(['python3',str(runner),str(i)],check=True,env=env)\n    sync_changes()\nprint('Baseline replay steps 12..49 completed successfully.',flush=True)\nLYDRA_GROUPED_BASE\n"
