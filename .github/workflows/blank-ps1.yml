# Lydra World Of Dragon - Android APK Test V1
# Als NEUE Datei speichern: .github/workflows/lwod-android.yml
# PS1-Workflow blank-ps1.yml NICHT ersetzen.
name: LWOD Android APK Test V1

'on':
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/lwod-android.yml'

permissions:
  contents: read

jobs:
  build_android:
    name: Eigenstaendige Android-App erstellen
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    timeout-minutes: 35

    steps:
      - name: Repository lesen
        uses: actions/checkout@v4

      - name: Godot-Projekt und 3D-Welt erstellen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/scenes android/scripts

          cat > android/project.godot <<'GODOT_PROJECT'
          config_version=5

          [application]
          config/name="Lydra World Of Dragon"
          run/main_scene="res://scenes/Main.tscn"

          [display]
          window/size/viewport_width=1280
          window/size/viewport_height=720
          window/stretch/mode="canvas_items"
          window/handheld/orientation=0

          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          GODOT_PROJECT

          cat > android/scenes/Main.tscn <<'GODOT_SCENE'
          [gd_scene load_steps=2 format=3]

          [ext_resource type="Script" path="res://scripts/Main.gd" id="1"]

          [node name="LydraWorld" type="Node3D"]
          script = ExtResource("1")
          GODOT_SCENE

          cat > android/scripts/Main.gd <<'GODOT_SCRIPT'
          extends Node3D

          const SPEED := 5.1
          const TURN_SPEED := 1.95
          const GRAVITY := 22.0

          var hero: CharacterBody3D
          var dragon: Node3D
          var view: Camera3D
          var message: Label
          var heading := 0.0
          var time_passed := 0.0
          var buttons := {"up": false, "down": false, "left": false, "right": false}

          func mat(color: Color) -> StandardMaterial3D:
              var m := StandardMaterial3D.new()
              m.albedo_color = color
              m.roughness = 0.88
              m.cull_mode = BaseMaterial3D.CULL_DISABLED
              return m

          func cube(parent: Node3D, pos: Vector3, size: Vector3, color: Color, solid: bool = false) -> void:
              var mesh := MeshInstance3D.new()
              var shape := BoxMesh.new()
              shape.size = size
              mesh.mesh = shape
              mesh.material_override = mat(color)
              mesh.position = pos
              parent.add_child(mesh)
              if solid:
                  var body := StaticBody3D.new()
                  var collider := CollisionShape3D.new()
                  var box := BoxShape3D.new()
                  box.size = size
                  collider.shape = box
                  body.position = pos
                  body.add_child(collider)
                  parent.add_child(body)

          func cone(parent: Node3D, pos: Vector3, radius: float, height: float, color: Color) -> void:
              var mesh := MeshInstance3D.new()
              var shape := CylinderMesh.new()
              shape.top_radius = 0.05
              shape.bottom_radius = radius
              shape.height = height
              shape.radial_segments = 8
              mesh.mesh = shape
              mesh.position = pos
              mesh.material_override = mat(color)
              parent.add_child(mesh)

          func sphere(parent: Node3D, pos: Vector3, radius: float, color: Color) -> void:
              var mesh := MeshInstance3D.new()
              var shape := SphereMesh.new()
              shape.radius = radius
              shape.height = 2.0 * radius
              shape.radial_segments = 12
              shape.rings = 6
              mesh.mesh = shape
              mesh.position = pos
              mesh.material_override = mat(color)
              parent.add_child(mesh)

          func house(x: float, z: float, idx: int) -> void:
              var root := Node3D.new()
              root.position = Vector3(x, 0, z)
              add_child(root)
              var wall := Color("#dfd1b6") if idx % 2 == 0 else Color("#d5dad4")
              cube(root, Vector3(0, 1.5, 0), Vector3(5, 3, 5), wall, true)
              cone(root, Vector3(0, 3.82, 0), 3.7, 1.7, Color("#76565b"))
              cube(root, Vector3(0, 1.0, 2.55), Vector3(1.2, 2.0, 0.13), Color("#795238"))
              for side in [-1.0, 1.0]:
                  cube(root, Vector3(side * 1.6, 1.9, 2.56), Vector3(0.8, 0.85, 0.12), Color("#70b8dc"))
                  cube(root, Vector3(side * 2.28, 1.5, 2.55), Vector3(0.17, 2.8, 0.18), Color("#8a6241"))

          func tree(pos: Vector3, scale_factor: float) -> void:
              cube(self, pos + Vector3(0, 1.1 * scale_factor, 0), Vector3(0.47, 2.2, 0.47) * scale_factor, Color("#765038"))
              cone(self, pos + Vector3(0, 3.1 * scale_factor, 0), 1.55 * scale_factor, 2.85 * scale_factor, Color("#236d51"))
              cone(self, pos + Vector3(0, 4.2 * scale_factor, 0), 1.09 * scale_factor, 2.1 * scale_factor, Color("#318b61"))

          func _ready() -> void:
              var world_env := WorldEnvironment.new()
              var e := Environment.new()
              e.background_mode = Environment.BG_COLOR
              e.background_color = Color("#8bc4eb")
              e.ambient_light_source = Environment.AMBIENT_SOURCE_COLOR
              e.ambient_light_color = Color("#c5d9ee")
              e.ambient_light_energy = 0.68
              world_env.environment = e
              add_child(world_env)
              var sun := DirectionalLight3D.new()
              sun.rotation_degrees = Vector3(-42, -28, 0)
              sun.light_energy = 1.5
              add_child(sun)

              cube(self, Vector3(0, -0.45, -12), Vector3(140, 0.9, 140), Color("#659b6d"), true)
              cube(self, Vector3(0, 0.025, -20), Vector3(4.8, 0.05, 86), Color("#b9a782"))
              for i in 5:
                  house(-9.0, -12.0 - i * 10.0, i)
                  house(9.0, -12.0 - i * 10.0, i + 5)
              var rng := RandomNumberGenerator.new()
              rng.seed = 3421
              for i in 40:
                  var x := rng.randf_range(-63.0, 63.0)
                  var z := rng.randf_range(-65.0, 50.0)
                  if absf(x) > 15.0 or z > 20.0:
                      tree(Vector3(x, 0, z), rng.randf_range(0.7, 1.35))
              for i in 12:
                  cone(self, Vector3(-62.0 + 11.0 * i, 8, -78.0), 9, 17, Color("#85939b"))

              hero = CharacterBody3D.new()
              hero.position = Vector3(0, 0.1, 10)
              add_child(hero)
              var col := CollisionShape3D.new()
              var capsule := CapsuleShape3D.new()
              capsule.radius = 0.35
              capsule.height = 1.9
              col.shape = capsule
              col.position.y = 0.95
              hero.add_child(col)
              cube(hero, Vector3(0, 1.1, 0), Vector3(0.67, 0.94, 0.4), Color("#356bc6"))
              sphere(hero, Vector3(0, 1.89, 0), 0.31, Color("#e4ba92"))
              cube(hero, Vector3(0, 2.13, -0.03), Vector3(0.58, 0.19, 0.5), Color("#5b483b"))
              for s in [-1.0, 1.0]:
                  cube(hero, Vector3(s * 0.22, 0.44, 0), Vector3(0.23, 0.83, 0.27), Color("#454d63"))
                  cube(hero, Vector3(s * 0.47, 1.12, 0), Vector3(0.19, 0.66, 0.24), Color("#dfad89"))

              dragon = Node3D.new()
              add_child(dragon)
              sphere(dragon, Vector3.ZERO, 0.48, Color("#8554bc"))
              sphere(dragon, Vector3(0, 0.38, -0.31), 0.32, Color("#a471d8"))
              for s in [-1.0, 1.0]:
                  cube(dragon, Vector3(s * 0.6, 0.14, 0), Vector3(0.95, 0.09, 0.69), Color("#976ed4"))
              cone(dragon, Vector3(0, 0.63, -0.4), 0.19, 0.38, Color("#e9c7a2"))

              view = Camera3D.new()
              view.current = true
              view.fov = 66.0
              add_child(view)
              view.position = Vector3(0, 4.6, 18)
              view.look_at(hero.position + Vector3(0, 1.2, 0))
              setup_touch()
              load_game()

          func touch_button(text: String, p: Vector2, action: String) -> void:
              var b := Button.new()
              b.text = text
              b.position = p
              b.size = Vector2(144, 91)
              b.add_theme_font_size_override("font_size", 25)
              b.modulate = Color(1, 1, 1, 0.86)
              b.focus_mode = Control.FOCUS_NONE
              get_node("HUD").add_child(b)
              b.button_down.connect(func() -> void: buttons[action] = true)
              b.button_up.connect(func() -> void: buttons[action] = false)

          func setup_touch() -> void:
              var hud := CanvasLayer.new()
              hud.name = "HUD"
              add_child(hud)
              var title := Label.new()
              title.text = "LYDRA  |  SONNENTAL"
              title.position = Vector2(26, 18)
              title.add_theme_font_size_override("font_size", 29)
              hud.add_child(title)
              message = Label.new()
              message.text = "3D Android Testwelt"
              message.position = Vector2(28, 61)
              message.add_theme_font_size_override("font_size", 21)
              hud.add_child(message)
              touch_button("VOR", Vector2(165, 500), "up")
              touch_button("ZURUECK", Vector2(165, 604), "down")
              touch_button("LINKS", Vector2(17, 604), "left")
              touch_button("RECHTS", Vector2(313, 604), "right")
              var save := Button.new()
              save.text = "SPEICHERN"
              save.position = Vector2(1023, 602)
              save.size = Vector2(230, 91)
              save.add_theme_font_size_override("font_size", 25)
              hud.add_child(save)
              save.pressed.connect(save_game)

          func save_game() -> void:
              var f := FileAccess.open("user://lwod_android_test.save", FileAccess.WRITE)
              if f != null:
                  f.store_var(hero.position)
                  f.store_float(heading)
                  message.text = "Spielstand gespeichert"

          func load_game() -> void:
              if not FileAccess.file_exists("user://lwod_android_test.save"):
                  return
              var f := FileAccess.open("user://lwod_android_test.save", FileAccess.READ)
              if f != null:
                  var pos = f.get_var()
                  if pos is Vector3:
                      hero.position = pos
                  heading = f.get_float()

          func _physics_process(delta: float) -> void:
              time_passed += delta
              var turn := 0.0
              if buttons["left"] or Input.is_key_pressed(KEY_LEFT) or Input.is_key_pressed(KEY_A):
                  turn -= 1.0
              if buttons["right"] or Input.is_key_pressed(KEY_RIGHT) or Input.is_key_pressed(KEY_D):
                  turn += 1.0
              heading += turn * TURN_SPEED * delta
              hero.rotation.y = heading
              var drive := 0.0
              if buttons["up"] or Input.is_key_pressed(KEY_UP) or Input.is_key_pressed(KEY_W):
                  drive += 1.0
              if buttons["down"] or Input.is_key_pressed(KEY_DOWN) or Input.is_key_pressed(KEY_S):
                  drive -= 1.0
              var direction := Vector3(-sin(heading), 0, -cos(heading))
              hero.velocity.x = direction.x * drive * SPEED
              hero.velocity.z = direction.z * drive * SPEED
              if not hero.is_on_floor():
                  hero.velocity.y -= GRAVITY * delta
              else:
                  hero.velocity.y = -0.08
              hero.move_and_slide()
              var side := Vector3(cos(heading), 0, -sin(heading))
              var behind := Vector3(sin(heading), 0, cos(heading))
              var target := hero.position + side * 1.8 + behind * 1.25 + Vector3(0, 1.65 + sin(time_passed * 3.5) * 0.18, 0)
              dragon.position = dragon.position.lerp(target, minf(1, delta * 3.4))
              dragon.rotation.y = heading
              var desired := hero.position + behind * 6.6 + Vector3(0, 4.3, 0)
              view.position = view.position.lerp(desired, minf(1, delta * 5.0))
              view.look_at(hero.position + Vector3(0, 1.35, 0))
          GODOT_SCRIPT

          cat > android/export_presets.cfg <<'EXPORT_PRESET'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          patches=PackedStringArray()
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="0.1"
          package/unique_name="org.dkvierich.lydraandroid"
          package/name="Lydra World Of Dragon"
          package/signed=true
          EXPORT_PRESET

      - name: Godot-Projekt importieren
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path android --editor --import --quit

      - name: Android APK bauen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build/android"
          godot --headless --path android --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/android/LWOD-Android-Test.apk"
          test -s "$GITHUB_WORKSPACE/build/android/LWOD-Android-Test.apk"

      - name: APK herunterladen
        uses: actions/upload-artifact@v4
        with:
          name: LWOD_ANDROID_TEST_APK
          path: build/android/LWOD-Android-Test.apk
          if-no-files-found: error
          retention-days: 14
