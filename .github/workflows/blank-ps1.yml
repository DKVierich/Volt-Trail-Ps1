    - name: V40.8.2 Terrain, Dorfplateaus und Wege kontrollieren
      shell: bash
      run: "set -euo pipefail\ngodot --headless --path android --script res://tests/V4082GroundSmoke.gd > \"$RUNNER_TEMP/v4082_ground.log\"\
        \ 2>&1 || {\n  cat \"$RUNNER_TEMP/v4082_ground.log\"\n  exit 1\n}\ncat \"$RUNNER_TEMP/v4082_ground.log\"\ngrep -Fq\
        \ 'V4082_GROUND_TEST_OK:' \"$RUNNER_TEMP/v4082_ground.log\"\n"
    - name: V40.8.3 Fünf aufeinanderfolgende Teleports und Dorfausstattung testen
      shell: bash
      run: |
        set -euo pipefail
        # Der wiederholte Reise-Test prueft fuenf Teleports und alle Stadtfunktionen.
        godot --headless --path android --script res://tests/V4083TravelVillageSmoke.gd > "$RUNNER_TEMP/v4083_repeated.log" 2>&1 || {
          cat "$RUNNER_TEMP/v4083_repeated.log"
          exit 1
        }
        cat "$RUNNER_TEMP/v4083_repeated.log"
        grep -Fq 'V4083_TRAVEL_VILLAGES_OK:' "$RUNNER_TEMP/v4083_repeated.log"
    - name: LWOD Android V40.8.3 APK erstellen
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p build/android
        godot --headless --path android --export-debug 'Android' "$GITHUB_WORKSPACE/build/android/LWOD-Android-V40.8.3-Regionaldoerfer.apk"
        test -s build/android/LWOD-Android-V40.8.3-Regionaldoerfer.apk
        unzip -t build/android/LWOD-Android-V40.8.3-Regionaldoerfer.apk >/dev/null
        ls -lh build/android/LWOD-Android-V40.8.3-Regionaldoerfer.apk
    - name: V40.8.3 Fehlerdiagnose
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: LWOD_V40_8_3_DIAGNOSE
        path: 'android/scripts/Main.gd

          android/scripts/V404Market.gd

          android/tests/V404WeaponSmoke.gd

          ${{ runner.temp }}/v4043_weapon.log

          android/tests/V4043UISmoke.gd

          ${{ runner.temp }}/v4043_ui.log

          android/scripts/V405QuestMarkers.gd

          android/tests/V405QuestMarkersSmoke.gd

          ${{ runner.temp }}/v405_markers.log

          android/scripts/V408Regions.gd

          android/tests/V408RegionSmoke.gd

          ${{ runner.temp }}/v408_regions.log'
        if-no-files-found: warn
        retention-days: 14
    - name: V40.8.3 APK hochladen
      uses: actions/upload-artifact@v4
      with:
        name: LWOD_ANDROID_V40_8_3_APK
        path: build/android/LWOD-Android-V40.8.3-Regionaldoerfer.apk
        if-no-files-found: error
        retention-days: 14
