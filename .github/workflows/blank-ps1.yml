            ind=$0; sub(/[^ \t].*$/,"",ind)
            print ind "    if has_node(\"V404Market\"):"
            print ind "        get_node(\"V404Market\").open_inventory()"
            menu++
          }
          END { if(boot!=1 || ng!=1 || sv!=1 || ld!=1 || menu!=2) exit 44 }
