    - name: FIX19 Hauskollision und einheitliches Tempo pruefen
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY_FIX19_VERIFY'\nimport os\nfrom pathlib import Path\np=Path(os.environ['PROJECT_DIR'])/'src/main.c'\ns=p.read_text(encoding='utf-8')\nrequired=('vt_v241_building(-175,125,52,1,1);',\n          '{0,-175,125,52}',\n          '{0,-175,125,0,0,24,0,0,1,0}',\n          'steps=(span+4)/5;',\n          'vt_v281_is_blocked(nx,nz)',\n          'LYDRA_FIX12_GLOBAL_PERCENT 75',\n          'vt_save_game(void)', 'vt_load_game(void)')\nfor token in required:\n if token not in s:raise RuntimeError('FIX19 verification failed: '+token)\nif s.count('static void vt_v281_resolve_movement(void)')!=1:\n raise RuntimeError('FIX19 duplicate collision code')\nif not Path('artifacts/KOLLISION_FIX19_DIAGNOSE.txt').stat().st_size>140:\n raise RuntimeError('FIX19 diagnosis missing')\nprint('FIX19: no central-road home, swept walls, guarded region change; speed 75%')\nPY_FIX19_VERIFY\n"
    - name: FIX20 Staedte erhalten und ungewollte Gebietswechsel stoppen
      shell: bash
      run: "set -euo pipefail\ncat > \"$RUNNER_TEMP/lydra_fix20_cities.py\" <<'LYDRA_FIX20_SCRIPT'\n#!/usr/bin/env python3\n\"\"\"FIX20: Preserve complete towns, only physically cross region boundaries.\"\"\"\nfrom pathlib import Path\nimport os,re\np=Path(os.environ['PROJECT_DIR'])/'src/main.c'\ns=p.read_text(encoding='utf-8')\n\n# Original world geometry uses physical map borders at z=+/-1120.\n# A second legacy system changes region after 120/260 walking steps,\n# even when the player is still in the town.  It hides the city's houses\n# because vt_v24_draw_overworld selects its buildings by region.\nfor old_region,new_region in ((0,1),(1,2)):\n    pattern=(r'if\\s*\\(\\s*region\\s*==\\s*'+str(old_region)+\n             r'\\s*&&\\s*step_count\\s*>\\s*\\d+\\s*\\)\\s*'\n             r'region\\s*=\\s*'+str(new_region)+r'\\s*;')\n    text=f'/* FIX20: no automatic region {old_region}->{new_region} from step count. */'\n    s,n=re.subn(pattern,text,s)\n    if n!=1:\n        raise RuntimeError(f'FIX20: unexpected step-count region transition {old_region}->{new_region}: {n}; no changes saved')\n\n# Preserve original forward/backward gate changes; no arbitrary teleport.\nforward=r'if\\s*\\(\\s*pz\\s*>\\s*1120\\s*&&\\s*region\\s*<\\s*2\\s*\\)'\nbackward=r'if\\s*\\(\\s*pz\\s*<\\s*-1120\\s*&&\\s*region\\s*>\\s*0\\s*\\)'\nif not re.search(forward,s) or not re.search(backward,s):\n    raise RuntimeError('FIX20: original geographic region gates not recognized')\n\n# FIX19 inadvertently overwrote a new region's mapped coordinates with old\n# coordinates if it was entered while walking.  Accept map-entry coordinates\n# and reset collision history for the new area.  No speed/camera modifications.\ninvalid=r'if\\s*\\(\\s*traveling\\s*&&\\s*span\\s*>\\s*120\\s*\\)\\s*\\{\\s*px\\s*=\\s*old_x\\s*;\\s*pz\\s*=\\s*old_z\\s*;\\s*\\}'\ns,n=re.subn(invalid,'/* FIX20: valid geographic transition keeps its new location. */',s)\nif n!=1:\n    raise RuntimeError('FIX20: unexpected FIX19 region-position reset: '+str(n))\n\n# All original Sunmeadow homes + 6 Crystal Pass homes + arena homes remain.\n# FIX19's relocated house remains in sync with its collision and NPC.\nregions={\n  'Sunmeadow': ['vt_v241_building(-205,265,43,0,1);',\n                'vt_v241_building(-175,125,52,1,1);',\n                'vt_v241_building(208,280,42,0,0);'],\n  'Crystal Pass': ['vt_v241_building(-145,450,42,0,1);',\n                   'vt_v241_building(145,310,44,1,0);',\n                   'vt_v241_building(-145,635,42,1,1);',\n                   'vt_v241_building(145,770,42,0,0);',\n                   'vt_v241_building(-145,985,43,0,1);',\n                   'vt_v241_building(145,1055,43,1,0);'],\n  'Storm Arena': ['vt_v241_building(-390,365,53,0,1);',\n                  'vt_v241_building(370,375,53,0,1);',\n                  'vt_v241_building(-165,590,41,0,1);',\n                  'vt_v241_building(175,680,42,1,0);']\n}\nfor town,buildings in regions.items():\n    for call in buildings:\n        if s.count(call)!=1: raise RuntimeError(f'FIX20: house missing or duplicated in {town}: {call}')\nfor token in ('LYDRA_FIX12_GLOBAL_PERCENT 75', 'vt_v281_resolve_movement();',\n              'vt_v281_is_blocked(nx,nz)', 'vt_v24_draw_overworld();',\n              '{0,-175,125,52}', '{0,-175,125,0,0,24,0,0,1,0}',\n              'vt_v31987_ground_rect(', 'vt_save_game(void)', 'vt_load_game(void)',\n              'vt_v3194_perf_hud('):\n    if token not in s: raise RuntimeError('FIX20 lost stable feature '+token)\n\np.write_text(s,encoding='utf-8')\nPath('artifacts').mkdir(exist_ok=True)\nPath('artifacts/STAEDTE_FIX20_DIAGNOSE.txt').write_text(\n   'FIX20: 3 settlements retained: Sunmeadow 7, Crystal Pass 6, Storm Arena 6 houses.\\n'\n   'No region switches after step_count=120/260; only geographical z+/-1120 gates.\\n'\n   'FIX19 on-road house remains relocated with NPC and collider; region crossing retains position.\\n'\n   'Movement and camera unchanged from FIX12 global 75 percent.\\n',encoding='utf-8')\nprint('FIX20: city geometry preserved; step-count region switching disabled; mapped region positions retained')\nLYDRA_FIX20_SCRIPT\npython3 \"$RUNNER_TEMP/lydra_fix20_cities.py\"\n"
    - name: FIX20 Staedte und 75 Prozent Tempo pruefen
