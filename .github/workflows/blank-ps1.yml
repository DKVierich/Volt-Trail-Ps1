name: LWOD Android V40.2 Figuren und HUD
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/lwod-android.yml
    - .github/workflows/blank-ps1.yml
permissions:
  contents: read
jobs:
  android:
    name: LWOD Android V40.2 APK
    runs-on: ubuntu-latest
    timeout-minutes: 55
    container:
      image: barichello/godot-ci:4.7.2
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: /usr/lib/android-sdk
    steps:
    - name: Repository laden
      uses: actions/checkout@v4
    - name: Godot und Android SDK vorbereiten
      shell: bash
      run: 'set -euo pipefail

        mkdir -p "$HOME/.config/godot" "$HOME/.local/share/godot/export_templates"

        cp -a /root/.config/godot/. "$HOME/.config/godot/"

        cp -a /root/.local/share/godot/export_templates/. "$HOME/.local/share/godot/export_templates/"

        test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"

        test -x "$JAVA_HOME/bin/java"

        test -s /root/debug.keystore

        sdkmanager --sdk_root="$ANDROID_HOME" ''platforms;android-35'' ''build-tools;35.0.1''

        test -d "$ANDROID_HOME/platforms/android-35"

        '
    - name: V23-Quelle herunterladen und richtige Pruefsumme pruefen
      shell: bash
      run: "set -euo pipefail\nwget -q --tries=3 --timeout=45 \\\n  -O \"$RUNNER_TEMP/lwod_v23.yml\" \\\n  'https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/2b1332ef7b51655427065cd8ec8371af1e7773dc/.github/workflows/blank-ps1.yml'\ntest -s \"$RUNNER_TEMP/lwod_v23.yml\"\nsource_hash=\"$(git hash-object \"$RUNNER_TEMP/lwod_v23.yml\")\"\nif [ \"$source_hash\" != \"f2417eca21fc0e9ac53a9e678b139a68e26ccdc8\" ]; then\n  echo \"::error::V23-Quellversion passt nicht. Erwartet: f2417eca21fc0e9ac53a9e678b139a68e26ccdc8, erhalten: $source_hash\"\n  exit 22\nfi\necho \"V23-Quelle korrekt: $source_hash\"\ncat > \"$RUNNER_TEMP/replay_v23.sh\" <<'REPLAY_V23'\n#!/bin/bash\nset -euo pipefail\nname=\"$1\"\nawk -v name=\"$name\" '\n  $0 == \"    - name: \" name { found=1; next }\n  found && $0 == \"      run: |\" { active=1; next }\n  active && /^    - name:/ { exit }\n  active && /^        / { sub(/^        /, \"\"); print; next }\n  active && /^$/ { print \"\"; next }\n  END { if (active != 1) exit 57 }\n' \"$RUNNER_TEMP/lwod_v23.yml\" > \"$RUNNER_TEMP/v23_step.sh\"\ntest -s \"$RUNNER_TEMP/v23_step.sh\"\nbash -n \"$RUNNER_TEMP/v23_step.sh\"\necho \"V23 Basis: $name\"\nbash \"$RUNNER_TEMP/v23_step.sh\"\nREPLAY_V23\nchmod +x \"$RUNNER_TEMP/replay_v23.sh\"\n"
    - name: FFmpeg statisch ohne apt und ohne xz bereitstellen
      shell: bash
      run: "set -euo pipefail\nif command -v ffmpeg >/dev/null 2>&1; then\n  echo 'FFmpeg ist bereits im Container vorhanden'\nelse\n  echo 'Statische FFmpeg-Datei als gzip-Archiv von GitHub laden'\n  command -v gzip >/dev/null\n  command -v sha256sum >/dev/null\n  wget -q --show-progress --https-only --tries=3 --timeout=90 \\\n    -O \"$RUNNER_TEMP/ffmpeg-linux-x64.gz\" \\\n    'https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-linux-x64.gz'\n  test -s \"$RUNNER_TEMP/ffmpeg-linux-x64.gz\"\n  printf '%s  %s\\n' \\\n    'bfe8a8fc511530457b528c48d77b5737527b504a3797a9bc4866aeca69c2dffa' \\\n    \"$RUNNER_TEMP/ffmpeg-linux-x64.gz\" | sha256sum -c -\n  gzip -dc \"$RUNNER_TEMP/ffmpeg-linux-x64.gz\" > /usr/local/bin/ffmpeg\n  chmod 0755 /usr/local/bin/ffmpeg\nfi\nffmpeg -hide_banner -version | head -n 1\ntest -x \"$(command -v ffmpeg)\"\n"
    - name: V23-Spielwelt und Menues vollstaendig wiederherstellen
      shell: bash
      run: 'set -euo pipefail

        cat <<''LWOD_STEP_5_B64'' | base64 -d | gzip -dc > "$RUNNER_TEMP/lwod_fix33_step_5.sh"

        

        LWOD_STEP_5_B64

        bash -n "$RUNNER_TEMP/lwod_fix33_step_5.sh"

        bash "$RUNNER_TEMP/lwod_fix33_step_5.sh"

        '
    - name: V24 Seen Fluesse Hoehlen und regionale Vegetation
      shell: bash
      run: 'set -euo pipefail

        cat <<''LWOD_STEP_6_B64'' | base64 -d | gzip -dc > "$RUNNER_TEMP/lwod_fix33_step_6.sh"

        

        LWOD_STEP_6_B64

        bash -n "$RUNNER_TEMP/lwod_fix33_step_6.sh"

        bash "$RUNNER_TEMP/lwod_fix33_step_6.sh"

        '
    - name: V25 Hoehenprofile Vulkan Eis Wueste Berge und Mammutwald
      shell: bash
      run: 'set -euo pipefail

        cat <<''LWOD_STEP_7_B64'' | base64 -d | gzip -dc > "$RUNNER_TEMP/lwod_fix33_step_7.sh"

        

        LWOD_STEP_7_B64

        bash -n "$RUNNER_TEMP/lwod_fix33_step_7.sh"

        bash "$RUNNER_TEMP/lwod_fix33_step_7.sh"

        '
    - name: V26 Regionen hoeher Himmel Wolken Sonne Mond und klickbare Weltkarte
      shell: bash
      run: 'set -euo pipefail

        cat <<''LWOD_STEP_8_B64'' | base64 -d | gzip -dc > "$RUNNER_TEMP/lwod_fix33_step_8.sh"

        

        LWOD_STEP_8_B64

        bash -n "$RUNNER_TEMP/lwod_fix33_step_8.sh"

        bash "$RUNNER_TEMP/lwod_fix33_step_8.sh"

        '
    - name: V27 natuerliche Huegellandschaft Weltkarte und freie Touchkamera
      shell: bash
      run: 'set -euo pipefail

        cat <<''LWOD_STEP_9_B64'' | base64 -d | gzip -dc > "$RUNNER_TEMP/lwod_fix33_step_9.sh"

        

        LWOD_STEP_9_B64

        bash -n "$RUNNER_TEMP/lwod_fix33_step_9.sh"

        bash "$RUNNER_TEMP/lwod_fix33_step_9.sh"

        '
    - name: V28 Touch-Steuerung rechts Figur links Kamera reparieren
      shell: bash
      run: 'set -euo pipefail

        cat <<''LWOD_STEP_10_B64'' | base64 -d | gzip -dc > "$RUNNER_TEMP/lwod_fix33_step_10.sh"

        

        LWOD_STEP_10_B64

        bash -n "$RUNNER_TEMP/lwod_fix33_step_10.sh"

        bash "$RUNNER_TEMP/lwod_fix33_step_10.sh"

        '
    - name: V29 echte Figurenbewegung rechts und freie Kamera links
      shell: bash
      run: 'set -euo pipefail

        cat <<''LWOD_STEP_11_B64'' | base64 -d | gzip -dc > "$RUNNER_TEMP/lwod_fix33_step_11.sh"

        

        LWOD_STEP_11_B64

        bash -n "$RUNNER_TEMP/lwod_fix33_step_11.sh"

        bash "$RUNNER_TEMP/lwod_fix33_step_11.sh"

        '
    - name: V30 Kollision und Startposition reparieren
      shell: bash
      run: 'set -euo pipefail

        cat <<''LWOD_STEP_12_B64'' | base64 -d | gzip -dc > "$RUNNER_TEMP/lwod_fix33_step_12.sh"

        

        LWOD_STEP_12_B64

        bash -n "$RUNNER_TEMP/lwod_fix33_step_12.sh"

        bash "$RUNNER_TEMP/lwod_fix33_step_12.sh"

        '
    - name: V31 Terrainkollision und Bewegung dauerhaft reparieren
      shell: bash
      run: 'set -euo pipefail

        cat <<''LWOD_STEP_13_B64'' | base64 -d | gzip -dc > "$RUNNER_TEMP/lwod_fix33_step_13.sh"

        

        LWOD_STEP_13_B64

        bash -n "$RUNNER_TEMP/lwod_fix33_step_13.sh"

        bash "$RUNNER_TEMP/lwod_fix33_step_13.sh"

        '
    - name: V32 Touchbereiche verbindlich trennen
      shell: bash
      run: 'set -euo pipefail

        cat <<''LWOD_STEP_14_B64'' | base64 -d | gzip -dc > "$RUNNER_TEMP/lwod_fix33_step_14.sh"

        

        LWOD_STEP_14_B64

        bash -n "$RUNNER_TEMP/lwod_fix33_step_14.sh"

        bash "$RUNNER_TEMP/lwod_fix33_step_14.sh"

        '
    - name: V33 Blick in den Himmel und unabhängige Links-Rechts-Steuerung
      shell: bash
      run: 'set -euo pipefail

        cat <<''LWOD_STEP_15_B64'' | base64 -d | gzip -dc > "$RUNNER_TEMP/lwod_fix33_step_15.sh"

        

        LWOD_STEP_15_B64

        bash -n "$RUNNER_TEMP/lwod_fix33_step_15.sh"

        bash "$RUNNER_TEMP/lwod_fix33_step_15.sh"

        '
    - name: V34 Steuerung LINKS Figur RECHTS Kamera Himmel vergroessern
      shell: bash
      run: 'set -euo pipefail

        cat <<''V34_PATCH_B64'' | base64 -d | gzip -dc > "$RUNNER_TEMP/lwod_v34_patch.sh"

        

        V34_PATCH_B64

        bash -n "$RUNNER_TEMP/lwod_v34_patch.sh"

        bash "$RUNNER_TEMP/lwod_v34_patch.sh"'
    - name: V35 Wolken ueber gesamten Himmel - 96 mehrteilige Wolkenbaenke
      shell: bash
      run: "set -euo pipefail\nfile=android/scripts/V26SkyWorldMap.gd\ntest -s \"$file\"\ntest \"$(grep -Fxc '    for i in range(8):' \"$file\")\" -eq 1\ntest \"$(grep -Fxc '    sun_node = MeshInstance3D.new()' \"$file\")\" -eq 1\ncat > \"$RUNNER_TEMP/lwod_v35_clouds.gdpart\" <<'LWOD_V35_CLOUDS'\n    # Wolkenhimmel V35: 96 Wolkenbaenke auf dem ganzen Himmel, statt 8 Scheiben.\n    # Pro Wolkenbank eine MultiMesh-Instanz: viele weiche 3D-Teile, weniger Drawcalls.\n    var cloud_rng := RandomNumberGenerator.new()\n    cloud_rng.seed = 202611350\n    var puff_mesh := SphereMesh.new()\n    puff_mesh.radius = 1.0\n    puff_mesh.height = 2.0\n    puff_mesh.radial_segments = 10\n    puff_mesh.rings = 6\n    var cloud_material := StandardMaterial3D.new()\n    cloud_material.albedo_color = Color(0.96, 0.97, 1.0, 0.83)\n    cloud_material.transparency = BaseMaterial3D.TRANSPARENCY_ALPHA\n    cloud_material.shading_mode = BaseMaterial3D.SHADING_MODE_UNSHADED\n    cloud_material.cull_mode = BaseMaterial3D.CULL_DISABLED\n    for cloud_i in range(96):\n        var bank := MultiMeshInstance3D.new()\n        bank.name = \"Wolkenbank_%03d\" % cloud_i\n        bank.material_override = cloud_material\n        var mm := MultiMesh.new()\n        mm.transform_format = MultiMesh.TRANSFORM_3D\n        mm.mesh = puff_mesh\n        var puff_count: int = cloud_rng.randi_range(9, 14)\n        mm.instance_count = puff_count\n        var col: int = cloud_i % 12\n        var row: int = int(cloud_i / 12)\n        var x: float = (float(col) - 5.5) * 180.0 + cloud_rng.randf_range(-75.0, 75.0)\n        var z: float = (float(row) - 3.5) * 275.0 + cloud_rng.randf_range(-80.0, 80.0)\n        var height: float = cloud_rng.randf_range(155.0, 315.0)\n        bank.position = Vector3(x, height, z)\n        var bank_width: float = cloud_rng.randf_range(45.0, 125.0)\n        for puff_i in range(puff_count):\n            var a: float = cloud_rng.randf_range(0.0, TAU)\n            var distance: float = cloud_rng.randf_range(0.0, bank_width)\n            var ox: float = cos(a) * distance\n            var oz: float = sin(a) * distance * 0.85\n            var oy: float = cloud_rng.randf_range(-12.0, 21.0)\n            var size: float = cloud_rng.randf_range(17.0, 37.0)\n            var scale_vec := Vector3(size * cloud_rng.randf_range(0.9, 1.5),\n                size * cloud_rng.randf_range(0.78, 1.30),\n                size * cloud_rng.randf_range(0.85, 1.55))\n            mm.set_instance_transform(puff_i,\n                Transform3D(Basis().scaled(scale_vec), Vector3(ox, oy, oz)))\n        bank.multimesh = mm\n        cloud_root.add_child(bank)\nLWOD_V35_CLOUDS\nawk -v replacement=\"$RUNNER_TEMP/lwod_v35_clouds.gdpart\" '\n  $0 == \"    for i in range(8):\" && !found {\n    while ((getline line < replacement) > 0) print line\n    close(replacement)\n    skip=1; found=1; next\n  }\n  skip && $0 == \"    sun_node = MeshInstance3D.new()\" {\n    skip=0\n    print\n    next\n  }\n  !skip { print }\n  END { if (!found || skip) exit 22 }\n' \"$file\" > \"$RUNNER_TEMP/V26SkyWorldMap_v35.gd\"\nmv \"$RUNNER_TEMP/V26SkyWorldMap_v35.gd\" \"$file\"\n# 96 Wolkenbaenke statt zentraler Wolkenansammlung; weiter Ziehbereich.\nsed -i 's/c.position.x > 165.0/c.position.x > 1160.0/; s/c.position.x = -165.0/c.position.x = -1160.0/' \"$file\"\ntest \"$(grep -Fc 'range(96)' \"$file\")\" -eq 1\ngrep -Fq 'c.position.x > 1160.0' \"$file\"\n# Bestehende Himmelskoerper, Touch-Steuerung und Spielwelt bleiben unveraendert.\ngrep -Fq 'sun_node.scale = Vector3.ONE * 24.0' \"$file\"\ngrep -Fq 'moon_node.scale = Vector3.ONE * 19.0' \"$file\"\nsed -i 's@version/code=34@version/code=35@' android/export_presets.cfg\nsed -i 's@version/name=\"3.4\"@version/name=\"3.5\"@' android/export_presets.cfg\ngrep -Fqx 'version/code=35' android/export_presets.cfg\necho 'V35: 96 verteilte Wolkenbaenke erzeugt, Sonne und Mond erhalten'\n"
    - name: V36 Sonne und Mond korrekt hinter Wolken rendern
      shell: bash
      run: "set -euo pipefail\nfile=\"android/scripts/V26SkyWorldMap.gd\"\ntest -s \"$file\"\n# V35-Wolken als blickdichte 3D-Koerper zeichnen: sie schreiben in den Tiefenpuffer.\n# Sonne und Mond werden auf eine weiter entfernte Umlaufbahn verschoben.\n# Die Skalierung erfolgt proportional, damit ihre sichtbare Groesse gleich bleibt.\ngrep -Fqx '    cloud_material.albedo_color = Color(0.96, 0.97, 1.0, 0.83)' \"$file\"\ngrep -Fqx '    cloud_material.transparency = BaseMaterial3D.TRANSPARENCY_ALPHA' \"$file\"\ngrep -Fqx '    sun_node.scale = Vector3.ONE * 24.0' \"$file\"\ngrep -Fqx '    moon_node.scale = Vector3.ONE * 19.0' \"$file\"\ngrep -Fqx '        sun_node.position = Vector3(cos(angle)*290.0, 14.0 + elevation*185.0, -18.0)' \"$file\"\ngrep -Fqx '        moon_node.position = Vector3(cos(moon_angle)*285.0, 16.0 + sin(moon_angle)*185.0, 24.0)' \"$file\"\nawk '\n  $0 == \"    cloud_material.albedo_color = Color(0.96, 0.97, 1.0, 0.83)\" {print \"    cloud_material.albedo_color = Color(0.96, 0.97, 1.0, 1.0)\"; a++; next}\n  $0 == \"    cloud_material.transparency = BaseMaterial3D.TRANSPARENCY_ALPHA\" {print \"    cloud_material.transparency = BaseMaterial3D.TRANSPARENCY_DISABLED\"; b++; next}\n  $0 == \"    sun_node.scale = Vector3.ONE * 24.0\" {print \"    sun_node.scale = Vector3.ONE * 264.0\"; c++; next}\n  $0 == \"    moon_node.scale = Vector3.ONE * 19.0\" {print \"    moon_node.scale = Vector3.ONE * 209.0\"; d++; next}\n  $0 == \"        sun_node.position = Vector3(cos(angle)*290.0, 14.0 + elevation*185.0, -18.0)\" {print \"        sun_node.position = Vector3(cos(angle)*3190.0, 154.0 + elevation*2035.0, -198.0)\"; e++; next}\n  $0 == \"        moon_node.position = Vector3(cos(moon_angle)*285.0, 16.0 + sin(moon_angle)*185.0, 24.0)\" {print \"        moon_node.position = Vector3(cos(moon_angle)*3135.0, 176.0 + sin(moon_angle)*2035.0, 264.0)\"; f++; next}\n  {print}\n  END { if(a!=1 || b!=1 || c!=1 || d!=1 || e!=1 || f!=1) exit 36 }\n' \"$file\" > \"$RUNNER_TEMP/lwod_v36_sky.gd\"\nmv \"$RUNNER_TEMP/lwod_v36_sky.gd\" \"$file\"\n# Vor der Sonne liegende Wolken verdecken sie ab jetzt physikalisch korrekt.\ntest \"$(grep -Fc 'cloud_material.transparency = BaseMaterial3D.TRANSPARENCY_DISABLED' \"$file\")\" -eq 1\ngrep -Fq 'sun_node.position = Vector3(cos(angle)*3190.0' \"$file\"\ngrep -Fq 'moon_node.position = Vector3(cos(moon_angle)*3135.0' \"$file\"\ngrep -Fq 'for cloud_i in range(96):' \"$file\"\nsed -i 's@version/code=35@version/code=36@; s@version/name=\"3.5\"@version/name=\"3.6\"@' android/export_presets.cfg\ngrep -Fqx 'version/code=36' android/export_presets.cfg\necho 'V36 SKY DEPTH OK: 96 Wolkenbaenke verdecken Sonne und Mond bei Ueberlappung'\n"
    - name: V37 Dorfbewohner Dialoge Lichtkristall Quest und Belohnung
      shell: bash
      run: "set -euo pipefail\nmkdir -p android/scripts android/tests\ncat <<'LWOD_V37_SCRIPT_B64' | base64 -d | gzip -dc > android/scripts/V37VillageQuests.gd\\nLWOD_V37_SCRIPT_B64\nprintf '%s  %s\\n' '82b639f20ba4a0403a65c56f8d6df6c0537f3868101d1fb8c3240d3e6f711e79' 'android/scripts/V37VillageQuests.gd' | sha256sum -c -\n# Neues Spiel setzt nur den Questfortschritt zurueck; bestehende Saves bleiben unberuehrt.\nawk '\n  {print}\n  $0 == \"    touch_v33.setup(self)\" {\n    print \"    var village_v37 = load(\\\"res://scripts/V37VillageQuests.gd\\\").new()\"\n    print \"    add_child(village_v37)\"\n    print \"    village_v37.setup(self)\"\n    boot++\n  }\n  $0 == \"func _on_new_game_pressed() -> void:\" { in_new=1 }\n  in_new && $0 == \"    _show_playing()\" {\n    print \"    var village_v37 = get_node_or_null(\\\"V37VillageQuests\\\")\"\n    print \"    if village_v37 != null:\"\n    print \"        village_v37.reset_new_game()\"\n    in_new=0\n    reset++\n  }\n  END { if(boot!=1 || reset!=1) exit 87 }\n' android/scripts/Main.gd > \"$RUNNER_TEMP/lwod_v37_main.gd\"\nmv \"$RUNNER_TEMP/lwod_v37_main.gd\" android/scripts/Main.gd\nsed -i 's@version/code=36@version/code=37@; s@version/name=\"3.6\"@version/name=\"3.7\"@' android/export_presets.cfg\ntest -s android/scripts/V37VillageQuests.gd\ngrep -Fqx '    village_v37.setup(self)' android/scripts/Main.gd\ngrep -Fq 'village_v37.reset_new_game()' android/scripts/Main.gd\ngrep -Fqx 'version/code=37' android/export_presets.cfg\necho 'V37: Bewohner, Gespraeche, Lichtkristall-Quest und Belohnung eingebaut'\n"
    - name: V38 NPC Modelle Fantasy Dialoge Dorfleben und Tagesablauf
      shell: bash
      run: "set -euo pipefail\nmkdir -p android/scripts android/tests\ncat <<'LWOD_V38_SCRIPT_B64' | base64 -d | gzip -dc > android/scripts/V38VillageLife.gd\\nLWOD_V38_SCRIPT_B64\nprintf '%s  %s\\n' '4ec389f7efe869eca4e8122056dd0931850f8aafa1d44f9948e452581d3290f0' 'android/scripts/V38VillageLife.gd' | sha256sum -c -\n# Bestehende V37-Dialoge behalten; nur normale Bewohner erhalten Antwortoptionen.\nawk '\n  index($0, \"_show_dialog(str(person[\") > 0 {\n    print \"        var village_v38: Node = game.get_node_or_null(\" sprintf(\"%cV38VillageLife%c\", 34, 34) \")\"\n    print \"        if village_v38 != null:\"\n    print \"            village_v38.talk_to_villager(index)\"\n    print \"        else:\"\n    print \"    \" $0\n    changed++\n    next\n  }\n  {print}\n  END {if(changed != 1) exit 88}\n' android/scripts/V37VillageQuests.gd > \"$RUNNER_TEMP/lwod_v38_quest.gd\"\nmv \"$RUNNER_TEMP/lwod_v38_quest.gd\" android/scripts/V37VillageQuests.gd\n# Add-on erst NACH der funktionierenden V37-Quest starten.\nawk '\n  {print}\n  $0 == \"    village_v37.setup(self)\" {\n    print \"    var village_v38 = load(\" sprintf(\"%cres://scripts/V38VillageLife.gd%c\", 34, 34) \").new()\"\n    print \"    add_child(village_v38)\"\n    print \"    village_v38.setup(self)\"\n    added++\n  }\n  END {if(added != 1) exit 89}\n' android/scripts/Main.gd > \"$RUNNER_TEMP/lwod_v38_main.gd\"\nmv \"$RUNNER_TEMP/lwod_v38_main.gd\" android/scripts/Main.gd\nsed -i 's@version/code=37@version/code=38@;s@version/name=\"3.7\"@version/name=\"3.8\"@' android/export_presets.cfg\ntest -s android/scripts/V38VillageLife.gd\ngrep -Fqx '    village_v38.setup(self)' android/scripts/Main.gd\ngrep -Fqx 'version/code=38' android/export_presets.cfg\nprintf 'V38: Modelle, Gespräche, Dorfdekoration und Abendablauf eingefügt\\n'\n"
    - name: V39 NPC Wege Blickrichtung und Namensschilder reparieren
      shell: bash
      run: 'set -euo pipefail

        mkdir -p android/scripts android/tests

        cat <<''LWOD_V39_QUEST'' | base64 -d | gzip -dc > android/scripts/V37VillageQuests.gd

        

        LWOD_V39_QUEST

        printf ''%s  %s\n'' ''9d3ff12c7ca78a370263329f3f94832460f80b1335738dfaab0eec0d4a95a8d7'' ''android/scripts/V37VillageQuests.gd'' | sha256sum -c -

        cat <<''LWOD_V39_LIFE'' | base64 -d | gzip -dc > android/scripts/V38VillageLife.gd

        

        LWOD_V39_LIFE

        printf ''%s  %s\n'' ''a61da7ed8975a6f75503de0b8e281b120633655ad377dac764a6ccc3d88ece1b'' ''android/scripts/V38VillageLife.gd'' | sha256sum -c -

        cat <<''LWOD_V39_TEST'' | base64 -d | gzip -dc > android/tests/V39NPCSmoke.gd

        

        LWOD_V39_TEST

        printf ''%s  %s\n'' ''d4713718a7a1b21e5cc595120643161c1c5aa1f5c1e84ebdc8db7da69b70c2f7'' ''android/tests/V39NPCSmoke.gd'' | sha256sum -c -

        # Laufzeit-Skript und UI werden ersetzt, Questdaten und Save-Dateien nicht.

        sed -i ''s@version/code=38@version/code=39@; s@version/name="3.8"@version/name="3.9"@'' android/export_presets.cfg

        if ! grep -Fqx ''version/code=39'' android/export_presets.cfg; then echo ''::error::V39 Android Versionsnummer fehlt''; exit 39; fi

        grep -Fq ''walk_target'' android/scripts/V37VillageQuests.gd

        grep -Fq ''outline_size = 12'' android/scripts/V38VillageLife.gd

        echo ''V39: NPC-Wegpunkte, echte Blickrichtung, grosse Namensschilder installiert''

        '
    - name: V40.1 Sonnental Grafikupgrade und Phoenix Feinschliff
      shell: bash
      run: "set -euo pipefail\nmkdir -p android/scripts android/tests\n# V39 bleibt vollständig bestehen; V40.1 ist eine zusätzliche Ebene.\ncat <<'LWOD_V401_ADDON' | base64 -d | gzip -dc > android/scripts/V40Sonnental.gd\\nLWOD_V401_ADDON\nprintf '%s  %s\\n' '76803b2c77c20b692566c19d2990a1e274e3f6121df5d009efe6018d3160e08d' 'android/scripts/V40Sonnental.gd' | sha256sum -c -\ncat <<'LWOD_V401_TEST' | base64 -d | gzip -dc > android/tests/V40SonnentalSmoke.gd\\nLWOD_V401_TEST\nprintf '%s  %s\\n' '17f5432fb4681bc85ccc7ec0c0056568b88d34b02b36a5fbe6272cb713e6346a' 'android/tests/V40SonnentalSmoke.gd' | sha256sum -c -\n# Add-on direkt nach V38 starten, damit V39-NPCs und Quest vorher bestehen.\ntest \"$(grep -Fxc '    village_v38.setup(self)' android/scripts/Main.gd)\" -eq 1\nawk '\n  { print }\n  $0 == \"    village_v38.setup(self)\" {\n    print \"    var sonnental_v40 = load(\\\"res://scripts/V40Sonnental.gd\\\").new()\"\n    print \"    add_child(sonnental_v40)\"\n    print \"    sonnental_v40.setup(self)\"\n    found++\n  }\n  END { if (found != 1) exit 40 }\n' android/scripts/Main.gd > \"$RUNNER_TEMP/main_v40.gd\"\ntest -s \"$RUNNER_TEMP/main_v40.gd\"\nmv \"$RUNNER_TEMP/main_v40.gd\" android/scripts/Main.gd\ngrep -Fqx '    sonnental_v40.setup(self)' android/scripts/Main.gd\nsed -i 's@version/code=39@version/code=40@; s@version/name=\"3.9\"@version/name=\"4.0.1\"@' android/export_presets.cfg\ngrep -Fqx 'version/code=40' android/export_presets.cfg\ngrep -Fqx 'version/name=\"4.0.1\"' android/export_presets.cfg\necho 'V40.1: zehn Bestands-Haeuser, neue Wegdetails, Vegetation und Phoenix hinzugefuegt'\n"
    - name: V40.2 Spielfigur NPCs Phoenix und UI verbessern
      shell: bash
      run: "set -euo pipefail\nmkdir -p android/scripts android/tests\ncat <<'LWOD_V402_ADDON' | base64 -d | gzip -dc > android/scripts/V402CharacterHUD.gd\\nLWOD_V402_ADDON\nprintf '%s  %s\\n' '0dd1d4b482376d95ca3709558721c92c7d98b6f1c07431ed9861ba6d6af2ba66' 'android/scripts/V402CharacterHUD.gd' | sha256sum -c -\ncat <<'LWOD_V402_TEST' | base64 -d | gzip -dc > android/tests/V402CharacterSmoke.gd\\nLWOD_V402_TEST\nprintf '%s  %s\\n' '670bd1b5e8e3f3d37901e58a931b0e9026bb76cd72f1c94d2c7d009c382e7cae' 'android/tests/V402CharacterSmoke.gd' | sha256sum -c -\n# V40.1 und alle bisherigen Spielsysteme bleiben erhalten.\ntest \"$(grep -Fxc '    sonnental_v40.setup(self)' android/scripts/Main.gd)\" -eq 1\nawk '\n  {print}\n  $0 == \"    sonnental_v40.setup(self)\" {\n    print \"    var v402 = load(\" sprintf(\"%cres://scripts/V402CharacterHUD.gd%c\", 34, 34) \").new()\"\n    print \"    add_child(v402)\"\n    print \"    v402.setup(self)\"\n    found++\n  }\n  END { if(found != 1) exit 42 }\n' android/scripts/Main.gd > \"$RUNNER_TEMP/main_v402.gd\"\ntest -s \"$RUNNER_TEMP/main_v402.gd\"\nmv \"$RUNNER_TEMP/main_v402.gd\" android/scripts/Main.gd\ngrep -Fqx '    v402.setup(self)' android/scripts/Main.gd\nsed -i 's@version/code=40@version/code=41@; s@version/name=\"4.0.1\"@version/name=\"4.0.2\"@' android/export_presets.cfg\ngrep -Fqx 'version/code=41' android/export_presets.cfg\ngrep -Fqx 'version/name=\"4.0.2\"' android/export_presets.cfg\necho 'V40.2: Modelle, Phoenix-Federglanz und Quest-Anzeige aktiv'\n"
