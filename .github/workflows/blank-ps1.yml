      - name: Fix V20 C function declaration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          source = (
              Path(os.environ["PROJECT_DIR"])
              / "src" / "main.c"
          )
          code = source.read_text(encoding="utf-8")

          # C requires a declaration before the first call.
          # Accept either whitespace style of the restored source.
          import re
          prototype = "static int vt_v20_owned(int slot);"
          function = re.search(
              r"(?m)^\s*static\s+int\s+vt_load_game\s*"
              r"\(\s*void\s*\)\s*\{",
              code
          )
          definition = re.search(
              r"(?m)^\s*static\s+int\s+vt_v20_owned\s*"
              r"\(\s*int\s+slot\s*\)\s*\{",
              code
          )
          if function is None or definition is None:
              raise RuntimeError("V20 save/load source markers missing")
          if function.start() >= definition.start():
              raise RuntimeError("Unexpected C function order")
          if prototype in code:
              raise RuntimeError("C prototype already inserted")
          code = (
              code[:function.start()]
              + prototype + "\n\n"
              + code[function.start():]
          )

          for marker in (
              "VOLT TRAIL V20",
              "DRACHEN KODEX",
              "vt_v20_seen_mask",
              "vt_v20_active_dragon",
              "vt_v20_attack_damage();",
              "vt_save_game(void)",
              "InitCARD(1);",
          ):
              if marker not in code:
                  raise RuntimeError("Missing gameplay feature: " + marker)

          source.write_text(code, encoding="utf-8")
          print("Fixed C declaration of vt_v20_owned")
          print("Dragon Codex, game saves and battle controls kept")
          PY

      - name: Add V21 three-dragon team and detailed Codex
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          path = Path(os.environ['PROJECT_DIR']) / 'src/main.c'
          code = path.read_text(encoding='utf-8')

          def once(old, new):
              global code
              n = code.count(old)
              if n != 1:
                  raise RuntimeError(f'V21 expected exactly one {old[:90]!r}, found {n}')
              code = code.replace(old, new, 1)

          def function_body_span(src, fname):
              match = re.search(r'\bstatic\s+(?:void|int)\s+'+re.escape(fname)+r'\s*\([^;]*?\)\s*\{',src)
              if not match:
                  raise RuntimeError('Function missing: '+fname)
              start = match.start()
              op = src.index('{', match.start(), match.end())
              depth = 0
              in_quote = False
              in_char = False
              in_line_comment = False
              in_block_comment = False
              escaped = False
              i = op
              while i < len(src):
                  ch=src[i]; nextch=src[i+1] if i+1<len(src) else ''
                  if in_line_comment:
                      if ch == '\n':in_line_comment=False
                  elif in_block_comment:
                      if ch=='*' and nextch=='/': in_block_comment=False;i+=1
                  elif in_quote or in_char:
                      if escaped:escaped=False
                      elif ch=='\\':escaped=True
                      elif in_quote and ch=='"':in_quote=False
                      elif in_char and ch=="'":in_char=False
                  elif ch=='/' and nextch=='/':in_line_comment=True;i+=1
                  elif ch=='/' and nextch=='*':in_block_comment=True;i+=1
                  elif ch=='"':in_quote=True
                  elif ch=="'":in_char=True
                  elif ch=='{':depth+=1
                  elif ch=='}':
                      depth-=1
                      if depth==0:return start,op,i+1
