      run: "set -euo pipefail\npython3 - <<'LYDRA_V31981_CHECK'\nimport os,re\nfrom pathlib import Path\ns=(Path(os.environ['PROJECT_DIR'])/'src/main.c').read_text(encoding='utf-8')\nfeatures = (\n 'vt_v31981_far_tile(', 'near_step=180,near_cells=10', 'far_step=560,far_cells=12',\n 'int w1 = (width + ((z + 70) / 24 - z / 24)) * 3 / 4;',\n 'draw_triangle3(&b0, &c, &d, r, g, b);',\n 'vt_v3194_perf_hud(', 'vt_save_game(void)', 'vt_load_game(void)',\n 'target=forward*17920;', 'desired_turn=turn*45*256;',\n)\nfor item in features:\n    if item not in s: raise RuntimeError('V31.9.8.1 regression: '+item)\n# No all-literal legacy ground-call is allowed within the overworld renderer.\n# The dynamic moving ground may use variables gx,gz and must remain unchanged.\nbody = s.split('static void vt_v24_draw_overworld(void)',1)[1]\nbody = body.split('static void ',1)[0]\nfixed = r'\\bvt_v24_ground_patch\\s*\\(\\s*(?:[-+]?\\d+\\s*,\\s*){10}[-+]?\\d+\\s*\\)\\s*;'\nif re.search(fixed,body,re.S):\n    raise RuntimeError('V31.9.8.1 FIX4: static duplicate ground remains')\nif not Path('artifacts/BODENFIX_V31_9_8_1_DIAGNOSE.txt').exists():\n    raise RuntimeError('V31.9.8.1 FIX4: missing terrain diagnostic file')\nif 'r * 4 / 5, g * 4 / 5' in s and 'vt_v24_path_band' in s:\n    print('Other functions may use differential shading; road itself checked above.')\n# Only two calls to the original triangle renderer per road strip.\nstart=s.find('static void vt_v24_path_band(')\nend=s.find('\\n}',start) if start>=0 else -1\nif start<0 or end<0 or s[start:end].count('draw_triangle3(')!=2:\n    raise RuntimeError('V31.9.8.1 road geometry budget unexpectedly changed')\nprint('V31.9.8.1 geometry and core gameplay static checks: OK')\n\nLYDRA_V31981_CHECK\n"
