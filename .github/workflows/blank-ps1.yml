        #!/usr/bin/env python3
        """Lydra V31.8.12: verified 16px text pitch and permanently anchored highlight."""
        from pathlib import Path
        import os, re

        p = Path(os.environ['PROJECT_DIR']) / 'src/main.c'
        s = p.read_text(encoding='utf-8')

        def span(name):
            rx = r'\bstatic\s+(?:void|int)\s+'+re.escape(name)+r'\s*\([^;]*?\)\s*\{'
            ms = list(re.finditer(rx,s,re.S))
            if len(ms) != 1:
                raise RuntimeError(f'V31.8.8 requires one {name}, found {len(ms)}')
            a = ms[0].start(); i=ms[0].end(); depth=1; mode='code'
            while depth and i < len(s):
                c=s[i]; n=s[i+1] if i+1<len(s) else ''
                if mode=='code':
                    if c=='/' and n=='/':mode='line';i+=1
                    elif c=='/' and n=='*':mode='comment';i+=1
                    elif c=='"':mode='string'
                    elif c=="'":mode='char'
                    elif c=='{':depth+=1
                    elif c=='}':depth-=1
