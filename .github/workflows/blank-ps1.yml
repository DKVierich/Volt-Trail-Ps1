        LWOD_FIX3_PACKAGE\nprintf '%s  %s\\n' '87890f4e4f5033e7070b77efef8c44cda97d916428dfd7afd7abc5ec9216b7a3' \"$RUNNER_TEMP/lwod_fix3.tar.gz\"\
        \ | sha256sum -c -\ntar -xzf \"$RUNNER_TEMP/lwod_fix3.tar.gz\" -C \"$RUNNER_TEMP/lwod_fix3\"\nfor n in $(seq -w 1 22); do\n  file=\"$RUNNER_TEMP/lwod_fix3/base/$n.sh\"\
        \n  bash -n \"$file\"\n  echo \"::group::V40.2 Grundlage $n/22\"\n  if bash \"$file\" > \"$RUNNER_TEMP/lwod_fix3/base_$n.log\" 2>&1; then\n\
        \    tail -n 10 \"$RUNNER_TEMP/lwod_fix3/base_$n.log\"\n  else\n    cat \"$RUNNER_TEMP/lwod_fix3/base_$n.log\"\n    echo \"::error::V40.2\
        \ Grundlage Schritt $n fehlgeschlagen\"\n    exit 1\n  fi\n  echo \"::endgroup::\"\ndone\n"
    - name: FIX3 Sonnental Runddorf inkl. NPCs, Steinmauer und Holztore einsetzen
      shell: bash
      run: "set -euo pipefail\nmkdir -p android/scripts android/tests\ncp \"$RUNNER_TEMP/lwod_fix3/assets/V403Fix3Sonnental.gd\" android/scripts/V403Fix3Sonnental.gd\n\
        cp \"$RUNNER_TEMP/lwod_fix3/assets/V403Fix3Smoke.gd\" android/tests/V403Fix3Smoke.gd\nprintf '%s  %s\\n' 'f2a8bcc44cf324ff9a8e19d1d04ab4f0d0832e2a193fa7980b0850a5d9da3156'\
        \ 'android/scripts/V403Fix3Sonnental.gd' | sha256sum -c -\nprintf '%s  %s\\n' '2cafb1792c730805c64a0fcf0ad5695fa9e5d2a6969dead028729e237ffca7d5'\
        \ 'android/tests/V403Fix3Smoke.gd' | sha256sum -c -\n# Additive Fix3-Szene startet nach V40.2; Quest-/Save-Implementierung unveraendert.\n\
        test \"$(grep -Fxc '    v402.setup(self)' android/scripts/Main.gd)\" -eq 1\nawk '\n  {print}\n  $0 == \"    v402.setup(self)\" {\n   \
        \ print \"    var v403_fix3 = load(\\\"res://scripts/V403Fix3Sonnental.gd\\\").new()\"\n    print \"    add_child(v403_fix3)\"\n    print\
        \ \"    v403_fix3.setup(self)\"\n    found++\n  }\n  END {if(found != 1) exit 43}\n' android/scripts/Main.gd > \"$RUNNER_TEMP/main_fix3.gd\"\
        \ntest -s \"$RUNNER_TEMP/main_fix3.gd\"\nmv \"$RUNNER_TEMP/main_fix3.gd\" android/scripts/Main.gd\ngrep -Fqx '    v403_fix3.setup(self)'\
        \ android/scripts/Main.gd\nsed -i 's@version/code=41@version/code=42@; s@version/name=\"4.0.2\"@version/name=\"4.0.3\"@' android/export_presets.cfg\n\
        grep -Fqx 'version/code=42' android/export_presets.cfg\ngrep -Fqx 'version/name=\"4.0.3\"' android/export_presets.cfg\necho 'V40.3 FIX3:\
        \ Nur Sonnental komplett als Runddorf umgebaut; 36 andere Siedlungen bleiben unveraendert.'\n"
    - name: Godot Ressourcen importieren
      shell: bash
      run: 'set -euo pipefail

        godot --headless --path android --editor --import --quit

        test -s android/scripts/V24Regions.gd

        test -s android/scripts/V25BiomeWorld.gd

        test -s android/scripts/V26SkyWorldMap.gd

        test -s android/scripts/V27Terrain.gd

        test -s android/scripts/V27WorldMap.gd

        test -s android/scripts/V27CameraMap.gd

        test -s android/scripts/V28DualStick.gd

        test -s android/scripts/V29IndependentSticks.gd

        test -s android/scripts/V30MovementRepair.gd

        test -s android/scripts/V31TerrainMotion.gd

        test -s android/scripts/V32TouchRouter.gd

        test -s android/scripts/V33TouchCamera.gd


        test -s android/scripts/V38VillageLife.gd


        test -s android/tests/V39NPCSmoke.gd

        test -s android/scripts/V40Sonnental.gd

        test -s android/tests/V40SonnentalSmoke.gd

        test -s android/scripts/V402CharacterHUD.gd

        test -s android/tests/V402CharacterSmoke.gd


        test -s android/scripts/V403Fix3Sonnental.gd

        test -s android/tests/V403Fix3Smoke.gd

        '
    - name: Bisherige Godot-Tests V31 bis V40.2 unveraendert ausfuehren
      shell: bash
      run: "set -euo pipefail\nfor n in $(seq -w 1 8); do\n  file=\"$RUNNER_TEMP/lwod_fix3/tests/$n.sh\"\n  bash -n \"$file\"\n  echo \"::group::V40.2\
        \ Regressionstest $n/8\"\n  if bash \"$file\" > \"$RUNNER_TEMP/lwod_fix3/test_$n.log\" 2>&1; then\n    tail -n 8 \"$RUNNER_TEMP/lwod_fix3/test_$n.log\"\
        \n  else\n    cat \"$RUNNER_TEMP/lwod_fix3/test_$n.log\"\n    echo \"::error::Regressionstest $n ist fehlgeschlagen\"\n    exit 1\n  fi\n\
        \  echo \"::endgroup::\"\ndone\n"
    - name: V40.3 FIX3 Runddorf in Godot testen
      shell: bash
      run: "set -euo pipefail\ngodot --headless --path android --script res://tests/V403Fix3Smoke.gd > \"$RUNNER_TEMP/v403_fix3_smoke.log\" 2>&1\
        \ || {\n  cat \"$RUNNER_TEMP/v403_fix3_smoke.log\"\n  exit 1\n}\ncat \"$RUNNER_TEMP/v403_fix3_smoke.log\"\ngrep -Fq 'V403_FIX3_TEST_OK:'\
        \ \"$RUNNER_TEMP/v403_fix3_smoke.log\"\n"
    - name: LWOD Android V40.3 FIX3 APK erstellen
      shell: bash
      run: "set -euo pipefail\nmkdir -p build/android\ngodot --headless --path android --export-debug 'Android' \\\n  \"$GITHUB_WORKSPACE/build/android/LWOD-Android-V40.3-FIX3-Sonnental.apk\"\
        \ntest -s build/android/LWOD-Android-V40.3-FIX3-Sonnental.apk\nunzip -t build/android/LWOD-Android-V40.3-FIX3-Sonnental.apk > /dev/null\n\
        \necho \"APK wurde erzeugt:\"\nls -lh build/android/LWOD-Android-V40.3-FIX3-Sonnental.apk\n"
    - name: Fehlerdiagnose bereitstellen
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: LWOD_V40_3_FIX3_DIAGNOSE
        path: 'android/scripts/Main.gd

          android/scripts/V403Fix3Sonnental.gd

          android/tests/V403Fix3Smoke.gd

          ${{ runner.temp }}/v403_fix3_smoke.log

          ${{ runner.temp }}/lwod_fix3/base_*.log'
        if-no-files-found: warn
        retention-days: 14
    - name: LWOD Android V40.3 FIX3 APK hochladen
      uses: actions/upload-artifact@v4
      with:
        name: LWOD_ANDROID_V40_3_FIX3_APK
        path: build/android/LWOD-Android-V40.3-FIX3-Sonnental.apk
        if-no-files-found: error
        retention-days: 14
