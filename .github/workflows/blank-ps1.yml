name: LWOD Android V41.7 FIX48 Dungeon-Kamera Abstand und Sicht
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/blank-ps1.yml
permissions:
  contents: read
jobs:
  android:
    name: LWOD Android V41.7 FIX48 APK
    runs-on: ubuntu-latest
    timeout-minutes: 55
    container:
      image: barichello/godot-ci:4.7.2
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: /usr/lib/android-sdk
    steps:
    - name: FIX39 Sicherung laden
      uses: actions/checkout@v4
      with:
        ref: 9b01d317fffd8d5abf0b2d0afbffb8846c44f1c6
    - name: Python und YAML bereitstellen
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v python3 >/dev/null 2>&1 || ! python3 -c 'import yaml' >/dev/null 2>&1; then
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 python3-yaml
        fi
    - name: FIX39 Schritte sichern
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYREPLAY'
        import hashlib,os,subprocess,yaml
        from pathlib import Path
        raw=Path('.github/workflows/blank-ps1.yml').read_bytes()
        assert hashlib.sha1(('blob %d\0'%len(raw)).encode()+raw).hexdigest()=='148a908318b1d91002357f1acfa18fbf60e347c3','FIX39 source checksum mismatch'
        steps=yaml.safe_load(raw)['jobs']['android']['steps']
        assert len(steps)==21 and steps[10]['name'].startswith('FIX39 Sichtweite und Terrain') and steps[16]['name'].startswith('FIX39 Sichtweite und Chunk')
        folder=Path(os.environ['RUNNER_TEMP'])/'fix41_base';folder.mkdir(exist_ok=True)
        for i in range(2,17):
            s=steps[i];assert s.get('shell')=='bash' and 'if' not in s
            f=folder/('%02d.sh'%i);f.write_text(s['run']+'\n',encoding='utf-8');subprocess.run(['bash','-n',str(f)],check=True)
            print('FIX39 gesichert',i,s['name'],flush=True)
        PYREPLAY
    - name: Erfolgreichen FIX19 Stand laden
      uses: actions/checkout@v4
      with:
        ref: a50b23c0dbeebc464305c0451b98245a0632aebc
    - name: FIX39 vollstaendig rekonstruieren
      shell: bash
      run: |
        set -euo pipefail
        for i in 02 03 04 05 06 07 08 09 10; do
          echo "::group::FIX39 Installationsschritt $i"
          bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/fix41_base/$i.sh"
          echo '::endgroup::'
        done
    - name: FIX48 Dungeon-Kamera vom Aussenbild trennen
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p android/scripts android/tests
        cat > 'android/scripts/V441Layout.gd' <<'FIX48_V441LAYOUT'
        extends RefCounted
        # Shared coordinates for ruin, dungeon, player ground and camera.
        const T = preload("res://scripts/V417Territories.gd")
        const OUTER_X: float = 64.0
        const OUTER_Z: float = 72.0
        # Open-air stairwell, physically cut out of the terrain. No portal movement.
        const START_Z: float = -24.0
        const END_Z: float = -56.0
        const DEPTH: float = 18.0
        const HALF_WIDTH: float = 5.2
        const HALL_BACK: float = -128.0
        const ENTRY: Vector2 = Vector2(0,START_Z)

        static func centre() -> Vector2:
            return T.city_world("Ruine")

        static func forward() -> Vector2:
            return T.gate_direction("Ruine","Ruine").normalized()

        static func right() -> Vector2:
            var d: Vector2 = forward()
            return Vector2(d.y,-d.x)

        static func local(p: Vector3) -> Vector2:
            var q: Vector2 = Vector2(p.x,p.z)-centre()
            return Vector2(q.dot(right()),q.dot(forward()))

        static func world(q: Vector2) -> Vector2:
            return centre()+right()*q.x+forward()*q.y

        static func base(terrain: Node) -> float:
            # Top tread is exactly at the rendered ground at the entrance.
            var c: Vector2 = world(ENTRY)
            return float(terrain.call("surface_height_at",c.x,c.y)) if is_instance_valid(terrain) else 0.0

        static func outside_height(terrain: Node,q: Vector2) -> float:
            var p: Vector2 = world(q)
            return float(terrain.call("surface_height_at",p.x,p.y)) if is_instance_valid(terrain) else 0.0

        static func in_stair(q: Vector2) -> bool:
            return absf(q.x) <= HALF_WIDTH and q.y <= START_Z and q.y >= END_Z

        static func in_hall(q: Vector2) -> bool:
            return absf(q.x)<34.0 and q.y<=END_Z and q.y>HALL_BACK

        static func level(q: Vector2) -> float:
            return -DEPTH*clampf((START_Z-q.y)/(START_Z-END_Z),0.0,1.0)

        static func in_dungeon(terrain: Node,p: Vector3) -> bool:
            var q: Vector2 = local(p)
            var rel: float = p.y-base(terrain)
            if absf(q.x)<=HALF_WIDTH and q.y>START_Z and q.y<=START_Z+4.5:
                return p.y<=outside_height(terrain,q)+2.5
            if in_stair(q):
                return rel <= level(q)+2.5
            return in_hall(q) and rel < -9.0

        static func walk_on_dungeon(terrain: Node,p: Vector3) -> bool:
            var q: Vector2 = local(p)
            return in_stair(q) or (in_hall(q) and p.y<base(terrain)-9.0)

        static func dungeon_floor(terrain: Node,p: Vector3) -> float:
            return base(terrain)+level(local(p))

        static func at(terrain: Node,q: Vector2,underground: bool) -> Vector3:
            var w: Vector2 = world(q)
            var y: float = base(terrain)+level(q) if underground else outside_height(terrain,q)
            return Vector3(w.x,y+0.085,w.y)

        # Exact rectangle subtraction. Each piece lies outside a different half-plane;
        # vertices interpolate original terrain triangle heights, avoiding cracks.
        # Vector3 here uses castle-local x,z and original world y as height.
        static func _split(poly: PackedVector3Array,axis: int,edge: float,sign_value: float) -> Array[PackedVector3Array]:
            var inner := PackedVector3Array()
            var outer := PackedVector3Array()
            if poly.is_empty(): return [inner,outer]
            var prev: Vector3 = poly[poly.size()-1]
            var dp: float = (prev[axis]-edge)*sign_value
            for cur in poly:
                var dc: float = (cur[axis]-edge)*sign_value
                if (dp>=0.0)!=(dc>=0.0):
                    var cross: Vector3 = prev.lerp(cur,dp/(dp-dc))
                    inner.append(cross)
                    outer.append(cross)
                if dc>=0.0: inner.append(cur)
                else: outer.append(cur)
                prev=cur
                dp=dc
            return [inner,outer]

        static func cut_triangle(poly: PackedVector3Array) -> Array[PackedVector3Array]:
            var pieces: Array[PackedVector3Array] = []
            var rest: PackedVector3Array = poly
            for bound in [[0,-HALF_WIDTH,1.0],[0,HALF_WIDTH,-1.0],[2,END_Z,1.0],[2,START_Z,-1.0]]:
                var split: Array[PackedVector3Array] = _split(rest,int(bound[0]),float(bound[1]),float(bound[2]))
                if split[1].size()>=3: pieces.append(split[1])
                rest=split[0]
                if rest.size()<3: break
            return pieces

        # Dedicated collision bit: only actual castle walls and ceilings affect the camera.
        const CAMERA_WALL_MASK: int = 1 << 19
        const CAMERA_MIN_DISTANCE: float = 2.15
        const CAMERA_MAX_HEIGHT: float = 3.65

        static func camera_floor(terrain: Node,q: Vector2) -> float:
            if in_stair(q): return base(terrain)+level(q)
            if in_hall(q): return base(terrain)-DEPTH
            return outside_height(terrain,q)

        static func camera_zone(q: Vector2) -> bool:
            if in_hall(q): return absf(q.x)<32.4 and q.y>HALL_BACK+0.9
            if q.y>=END_Z and q.y<=START_Z+4.5: return absf(q.x)<HALF_WIDTH-0.55
            # Open courtyard on the entrance side, not through its side walls.
            return q.y>START_Z+4.5 and q.y<START_Z+10.0 and absf(q.x)<HALF_WIDTH-0.55

        static func dungeon_camera(terrain: Node,hero: CharacterBody3D,cam: Camera3D,yaw: float,_pitch: float) -> void:
            var actor: Vector3 = hero.global_position
            var focus: Vector3 = actor+Vector3.UP*1.26
            var space: PhysicsDirectSpaceState3D = hero.get_world_3d().direct_space_state
            # Do not shorten the camera into the character. Prefer an alternate shoulder
            # or side on the staircase instead, keeping a proper third-person distance.
            var best: Vector3 = actor+Vector3(sin(yaw)*3.0,2.0,cos(yaw)*3.0)
            var fallback: Vector3 = best
            var have_fallback: bool = false
            var solved: bool = false
            for angle in [0.0,0.52,-0.52,1.05,-1.05,1.57,-1.57,2.1,-2.1,3.14159265]:
                var turn: float = yaw+float(angle)
                var back := Vector3(sin(turn),0.0,cos(turn))
                for distance in [3.5,3.0,2.6,2.2]:
                    var candidate: Vector3 = actor+back*float(distance)+Vector3.UP*2.1
                    var c: Vector2 = local(candidate)
                    if not camera_zone(c): continue
                    candidate.y=maxf(candidate.y,camera_floor(terrain,c)+0.85)
                    if candidate.y>actor.y+CAMERA_MAX_HEIGHT: continue
                    if in_hall(c) and candidate.y>base(terrain)-DEPTH+10.4: continue
                    # Sample the line against the analytical stair/floor, not unrelated
                    # terrain, player, companion or NPC collision shapes.
                    var above_floor: bool = true
                    for fraction in [0.25,0.5,0.75]:
                        var sample: Vector3 = focus.lerp(candidate,float(fraction))
                        if sample.y<camera_floor(terrain,local(sample))+0.20:
                            above_floor=false
                            break
                    if not above_floor: continue
                    if not have_fallback:
                        fallback=candidate
                        have_fallback=true
                    var ray := PhysicsRayQueryParameters3D.create(focus,candidate,CAMERA_WALL_MASK,[hero.get_rid()])
                    var hit: Dictionary = space.intersect_ray(ray)
                    if not hit.is_empty(): continue
                    # A second ray gives clearance around the near plane at the camera.
                    var padding_ray := PhysicsRayQueryParameters3D.create(candidate,candidate+back*0.30,CAMERA_WALL_MASK,[hero.get_rid()])
                    if not space.intersect_ray(padding_ray).is_empty(): continue
                    best=candidate
                    solved=true
                    break
                if solved: break
            # Even a transient collision at a seam must never place the lens inside the hero.
            if not solved and have_fallback: best=fallback
            cam.global_position=best
            cam.look_at(focus)
        FIX48_V441LAYOUT
        cat > 'android/scripts/V441Castle.gd' <<'FIX48_V441CASTLE'
        extends Node3D
        const L = preload("res://scripts/V441Layout.gd")
        var game: Node
        var terrain: Node
        var stones: Array[Transform3D] = []
        var colors: PackedColorArray = PackedColorArray()
        var rng := RandomNumberGenerator.new()
        var wall_body: StaticBody3D
        var dungeon_body: StaticBody3D
        var base_y: float = 0.0
        var stone_mat: StandardMaterial3D
        var torch_mat: StandardMaterial3D

        func setup(owner_game: Node,land: Node) -> void:
            name = "V441VerfalleneBurg"
            game = owner_game
            terrain = land
            rng.seed = 441731
            base_y = L.base(terrain)
            var c: Vector2 = L.centre()
            var d: Vector2 = L.forward()
            position = Vector3(c.x,base_y,c.y)
            rotation.y = atan2(d.x,d.y)
            wall_body = StaticBody3D.new()
            wall_body.name = "BurgKollision"
            wall_body.set_collision_layer_value(20,true)
            add_child(wall_body)
            dungeon_body = StaticBody3D.new()
            dungeon_body.name = "DungeonKollision"
            dungeon_body.set_collision_layer_value(20,true)
            add_child(dungeon_body)
            stone_mat = StandardMaterial3D.new()
            stone_mat.vertex_color_use_as_albedo = true
            stone_mat.roughness = 1.0
            torch_mat = StandardMaterial3D.new()
            torch_mat.albedo_color = Color("#ffbd58")
            torch_mat.emission_enabled = true
            torch_mat.emission = Color("#ff8d32")
            torch_mat.emission_energy_multiplier = 1.6
            _castle()
            _dungeon()
            _commit_stones()
            # Camera is owned by the persistent gameplay camera controller, not by this landmark.
            set_physics_process(false)
            set_process(false)

        func _ground(q: Vector2) -> float:
            return L.outside_height(terrain,q)-base_y

        func _stone(p: Vector3,size: Vector3,col: Color,yaw: float = 0.0,roll: float = 0.0) -> void:
            var b := Basis(Vector3.UP,yaw)*Basis(Vector3.FORWARD,roll)
            stones.append(Transform3D(b.scaled_local(size),p))
            colors.append(col)

        func _solid(body: StaticBody3D,p: Vector3,size: Vector3,yaw: float = 0.0) -> void:
            var shape := BoxShape3D.new()
            shape.size = size
            var slot := CollisionShape3D.new()
            slot.shape = shape
            slot.position = p
            slot.rotation.y = yaw
            body.add_child(slot)

        func _stone_color(dark: bool = false) -> Color:
            var a := Color("#57534f") if dark else Color("#77776b")
            var b := Color("#827b70") if dark else Color("#aaa597")
            return a.lerp(b,rng.randf())

        func _wall(a: Vector2,b: Vector2,height: float,thick: float,ruined: bool = true,underground: bool = false,floor_y: float = -36.0) -> void:
            var span: float = a.distance_to(b)
            var yaw: float = -atan2((b-a).y,(b-a).x)
            var count: int = maxi(1,ceili(span/3.6))
            var unit: float = span/float(count)
            for i in range(count):
                var q: Vector2 = a.lerp(b,(float(i)+0.5)/float(count))
                var g: float = floor_y if underground else _ground(q)
                var h: float = height
                if ruined:
                    h = height*(0.67+0.23*sin(float(i)*1.07+span)+rng.randf_range(0.0,0.19))
                var rows: int = maxi(2,ceili(h/0.86))
                var row_h: float = h/float(rows)
                # A recessed continuous core closes every mortar joint underground.
                if underground:
                    _stone(Vector3(q.x,g+h*0.5-0.35,q.y),Vector3(unit+0.08,h,thick-0.20),Color("#38342f"),yaw)
                var along: Vector2 = (b-a).normalized()
                for row in range(rows):
                    var y: float = g-0.35+(float(row)+0.5)*row_h
                    var split: float = 0.34 if (row+i)%2==0 else 0.66
                    for part in range(2):
                        var portion: float = split if part==0 else 1.0-split
                        var midpoint: float = split*0.5 if part==0 else (1.0+split)*0.5
                        var v: Vector2 = q+along*((midpoint-0.5)*unit)
                        var offset: float = rng.randf_range(-0.035,0.035)
                        _stone(Vector3(v.x,y,v.y),Vector3(maxf(0.08,unit*portion-0.035),row_h-0.026,thick+offset),_stone_color(underground),yaw)
                _solid(dungeon_body if underground else wall_body,Vector3(q.x,g+h*0.5-0.4,q.y),Vector3(unit+0.04,h+0.8,thick),yaw)

        func _tower(q: Vector2,r: float,h: float,opening: float) -> void:
            var sides: int = 16
            for i in range(sides):
                var a: float = TAU*float(i)/float(sides)
                var b: float = TAU*float(i+1)/float(sides)
                if absf(wrapf((a+b)*0.5-opening,-PI,PI))<0.39:
                    continue
                var start: Vector2 = q+Vector2(cos(a),sin(a))*r
                var finish: Vector2 = q+Vector2(cos(b),sin(b))*r
                _wall(start,finish,h+2.8*sin(float(i)*0.55),2.3,true)

        func _arch(q: Vector2,width: float,height: float,depth: float) -> void:
            var ground: float = _ground(q)
            var r: float = width*0.5
            var spring: float = height-r
            for side in [-1.0,1.0]:
                for j in range(5):
                    var p := Vector3(q.x+float(side)*(r+0.85),ground+(float(j)+0.5)*spring/5.0,q.y)
                    _stone(p,Vector3(1.65,spring/5.0-0.045,depth),_stone_color())
                _solid(wall_body,Vector3(q.x+float(side)*(r+0.85),ground+spring*0.5,q.y),Vector3(1.65,spring,depth))
            for i in range(13):
                var angle: float = PI*(float(i)+0.5)/13.0
                var p := Vector3(q.x+cos(angle)*(r+0.65),ground+spring+sin(angle)*(r+0.65),q.y)
                _stone(p,Vector3(1.5,1.35,depth),_stone_color(),0.0,angle-PI*0.5)
                var slot := CollisionShape3D.new()
                var shape := BoxShape3D.new()
                shape.size = Vector3(1.5,1.35,depth)
                slot.shape = shape
                slot.position = p
                slot.rotation.z = angle-PI*0.5
                wall_body.add_child(slot)

        func _castle() -> void:
            # Road and existing travel crystal enter through this 16 m gap.
            _wall(Vector2(-64,72),Vector2(-8,72),13.5,3.2)
            _wall(Vector2(8,72),Vector2(64,72),13.5,3.2)
            _arch(Vector2(0,72),16,14,3.2)
            # Broken side walls give the castle a naturally collapsed silhouette.
            _wall(Vector2(-64,72),Vector2(-64,31),14,3.2)
            _wall(Vector2(-64,23),Vector2(-64,-72),16,3.2)
            _wall(Vector2(64,72),Vector2(64,-12),15,3.2)
            _wall(Vector2(64,-23),Vector2(64,-72),14,3.2)
            _wall(Vector2(-64,-72),Vector2(-7,-72),15,3.2)
            _wall(Vector2(7,-72),Vector2(64,-72),13.0,3.2)
            _tower(Vector2(-54,63),9.5,24,PI*1.5)
            _tower(Vector2(54,63),9.5,29,PI*1.5)
            _tower(Vector2(-54,-63),9.5,22,PI*0.5)
            _tower(Vector2(54,-63),9.5,27,PI*0.5)
            # Two roofless wings: accessible openings and ruined partitions.
            for side in [-1.0,1.0]:
                var x: float = float(side)*37.0
                _wall(Vector2(x-11,-28),Vector2(x+11,-28),10,2)
                _wall(Vector2(x-11,-28),Vector2(x-11,14),9,2)
                _wall(Vector2(x+11,-28),Vector2(x+11,14),7.5,2)
                _wall(Vector2(x-11,14),Vector2(x-4,14),7,2)
                _wall(Vector2(x+4,14),Vector2(x+11,14),6,2)
                _wall(Vector2(x-11,-7),Vector2(x-4,-7),5,1.8)
                _wall(Vector2(x+4,-7),Vector2(x+11,-7),5,1.8)
            # Open keep at the far end of the courtyard; its arch is the dungeon entrance.
            _wall(Vector2(-17,-54),Vector2(-7,-54),15,2.6)
            _wall(Vector2(7,-54),Vector2(17,-54),15,2.6)
            _wall(Vector2(-17,-54),Vector2(-17,L.START_Z),13,2.6)
            _wall(Vector2(17,-54),Vector2(17,L.START_Z),11,2.6)
            _wall(Vector2(-17,L.START_Z),Vector2(-L.HALF_WIDTH,L.START_Z),10,2.6)
            _wall(Vector2(L.HALF_WIDTH,L.START_Z),Vector2(17,L.START_Z),10,2.6)
            _arch(L.ENTRY,L.HALF_WIDTH*2.0,10.5,2.6)
            # Grounded rubble in the wall breaks and wings, never on the road/teleporter.
            for i in range(95):
                var side: float = -1.0 if i%2==0 else 1.0
                var q := Vector2(side*rng.randf_range(48,61),rng.randf_range(-49,47))
                var w: float = rng.randf_range(0.7,2.4)
                _stone(Vector3(q.x,_ground(q)+w*0.30,q.y),Vector3(w,w*0.62,w*rng.randf_range(0.7,1.35)),_stone_color(),rng.randf_range(0,TAU),rng.randf_range(-0.26,0.26))
            set_meta("castle_size",Vector2(128,144))

        func _floor_box(q: Vector2,y: float,size: Vector2) -> void:
            _stone(Vector3(q.x,y-0.5,q.y),Vector3(size.x,1.0,size.y),Color("#59534d"))

        func _light(q: Vector2,y: float) -> void:
            var side: float = -1.0 if q.x<0.0 else 1.0
            var wall := Vector3(q.x,y,q.y)
            _stone(wall,Vector3(0.22,0.73,0.48),Color("#302923"))
            _stone(wall-Vector3(side*0.30,0.18,0),Vector3(0.70,0.16,0.18),Color("#44362a"))
            _stone(wall-Vector3(side*0.52,0.10,0),Vector3(0.36,0.28,0.31),Color("#3c3029"))
            var fixture := MeshInstance3D.new()
            fixture.name = "Wandfackel"
            var m := SphereMesh.new()
            m.radius = 0.17
            m.height = 0.64
            m.radial_segments = 8
            m.rings = 4
            fixture.mesh = m
            fixture.material_override = torch_mat
            fixture.position = wall-Vector3(side*0.52,-0.39,0)
            add_child(fixture)
            var light := OmniLight3D.new()
            light.light_color = Color("#ffb36a")
            light.light_energy = 2.4
            light.omni_range = 15.0
            light.shadow_enabled = false
            light.position = wall-Vector3(side*0.9,-0.45,0)
            add_child(light)

        func _roof_seal(label: String,p: Vector3,size: Vector3) -> void:
            _stone(p,size,Color("#3d3933"))
            _solid(dungeon_body,p,size)
            dungeon_body.get_child(dungeon_body.get_child_count()-1).name = label

        func _dungeon() -> void:
            # Shorter, fully roofed descent. Forty-eight contiguous steps descend physically.
            var step_count: int = 48
            var run: float = (L.START_Z-L.END_Z)/float(step_count)
            for i in range(step_count):
                var z: float = L.START_Z-(float(i)+0.5)*run
                var y: float = L.level(Vector2(0,z))
                _floor_box(Vector2(0,z),y,Vector2(L.HALF_WIDTH*2.0,run+0.035))
            # Full-length roof: its two pieces meet at the entrance, not halfway down.
            var shaft_length: float = L.START_Z-L.END_Z
            var roof_bottom: float = 4.5
            for i in range(13):
                var z: float = lerpf(L.START_Z+4.5,L.END_Z,float(i)/12.0)
                for x in [-L.HALF_WIDTH,0.0,L.HALF_WIDTH]:
                    roof_bottom=maxf(roof_bottom,_ground(Vector2(float(x),z))+4.5)
            var roof_y: float = roof_bottom+0.65
            _roof_seal("EingangsVordach",Vector3(0,roof_y,L.START_Z+2.25),Vector3(L.HALF_WIDTH*2.0+4.2,1.8,5.8))
            _roof_seal("TreppenDach",Vector3(0,roof_y,(L.START_Z+L.END_Z)*0.5),Vector3(L.HALF_WIDTH*2.0+4.0,1.8,shaft_length+1.1))
            var sections: int = maxi(1,ceili(shaft_length/2.0))
            for i in range(sections):
                var a: float = lerpf(L.START_Z,L.END_Z,float(i)/float(sections))
                var b: float = lerpf(L.START_Z,L.END_Z,float(i+1)/float(sections))
                var y: float = L.level(Vector2(0,b))-0.65
