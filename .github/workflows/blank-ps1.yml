
name: Build Volt Trail PS1 V8

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build unzip curl jq tar

      - name: Prepare project sources
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$GITHUB_WORKSPACE/CMakeLists.txt" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            ZIP_FILE="$GITHUB_WORKSPACE/VoltTrail_PS1_AndroidReady_V7.zip"

            if [ ! -f "$ZIP_FILE" ]; then
              echo "::error::V7 project ZIP not found"
              exit 1
            fi

            EXTRACT_DIR="$RUNNER_TEMP/volttrail-project"
            mkdir -p "$EXTRACT_DIR"
            unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

            CMAKE_FILE="$(find "$EXTRACT_DIR" -name CMakeLists.txt -type f -print -quit)"

            if [ -z "$CMAKE_FILE" ]; then
              echo "::error::CMakeLists.txt missing"
              exit 1
            fi

            PROJECT_DIR="$(dirname "$CMAKE_FILE")"
          fi

          for file in CMakeLists.txt src/main.c iso.xml system.cnf; do
            if [ ! -f "$PROJECT_DIR/$file" ]; then
              echo "::error::Missing file: $file"
              exit 1
            fi
          done

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Apply Volt Trail V8 controller test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["PROJECT_DIR"]) / "src/main.c"
          code = path.read_text()

          marker = "        previous_pad = pad;"

          if code.count(marker) != 1:
              raise RuntimeError("Controller code not found")

          patch = (
              "\n"
              "        draw[db].r0 = 90;\n"
              "        draw[db].g0 = 0;\n"
              "        draw[db].b0 = 150;\n"
              "        if (pad & PAD_CROSS) {\n"
              "            draw[db].r0 = 0;\n"
              "            draw[db].g0 = 120;\n"
              "            draw[db].b0 = 0;\n"
              "        } else if (pad & (PAD_LEFT | PAD_RIGHT | PAD_UP | PAD_DOWN)) {\n"
              "            draw[db].r0 = 120;\n"
              "            draw[db].g0 = 120;\n"
              "            draw[db].b0 = 0;\n"
              "        }\n"
          )

          code = code.replace(marker, marker + patch, 1)

          code = code.replace(
              "VOLT TRAIL: SHARDS OF THE STORM  /  PS1",
              "VOLT TRAIL V8 - CONTROLLER TEST",
              1
          )

          path.write_text(code)
          print("Volt Trail V8 diagnostic code applied")
          PY

      - name: Download PSn00bSDK
        shell: bash
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/Lameguy64/PSn00bSDK/releases/latest"
          RELEASE_JSON="$RUNNER_TEMP/sdk-release.json"
          curl -fsSL "$API" -o "$RELEASE_JSON"

          FOUND=""

          while IFS=$'\t' read -r NAME URL; do
            [ -n "${URL:-}" ] || continue

            ARCHIVE="$RUNNER_TEMP/sdk-asset"
            EXTRACT_DIR="$RUNNER_TEMP/psn00bsdk"

            rm -f "$ARCHIVE"
            rm -rf "$EXTRACT_DIR"
            mkdir -p "$EXTRACT_DIR"

            if ! curl -fsSL "$URL" -o "$ARCHIVE"; then
              continue
            fi

            case "$NAME" in
              *.zip|*.ZIP)
                unzip -q "$ARCHIVE" -d "$EXTRACT_DIR" || continue
                ;;
              *.tar.gz|*.tgz|*.tar.xz|*.tar.bz2)
                tar -xf "$ARCHIVE" -C "$EXTRACT_DIR" || continue
                ;;
              *)
                continue
                ;;
            esac

            FOUND="$(find "$EXTRACT_DIR" -type f -path '*/lib/libpsn00b/cmake/sdk.cmake' -print -quit)"

            if [ -n "$FOUND" ]; then
              break
            fi
          done < <(
            jq -r '
              .assets[]
              | select((.name | ascii_downcase | contains("linux")))
              | select(
                  (.name | ascii_downcase | endswith(".zip")) or
                  (.name | ascii_downcase | endswith(".tar.gz")) or
                  (.name | ascii_downcase | endswith(".tgz")) or
                  (.name | ascii_downcase | endswith(".tar.xz")) or
                  (.name | ascii_downcase | endswith(".tar.bz2"))
                )
              | [.name, .browser_download_url] | @tsv
            ' "$RELEASE_JSON"
          )

          if [ -z "$FOUND" ]; then
            echo "::error::PSn00bSDK not found"
            exit 1
          fi

          SDK_ROOT="${FOUND%/lib/libpsn00b/cmake/sdk.cmake}"
          SDK_BIN="$(find "$SDK_ROOT" -name mipsel-none-elf-gcc -print -quit | xargs -r dirname)"

          if [ -z "$SDK_BIN" ]; then
            echo "::error::PS1 compiler not found"
            exit 1
          fi

          echo "PSN00BSDK_CMAKE=$FOUND" >> "$GITHUB_ENV"
          echo "$SDK_BIN" >> "$GITHUB_PATH"

          MKPSXISO="$(find "$SDK_ROOT" -name mkpsxiso -print -quit)"

          if [ -n "$MKPSXISO" ]; then
            chmod +x "$MKPSXISO"
            echo "$(dirname "$MKPSXISO")" >> "$GITHUB_PATH"
          fi

      - name: Configure and build PS1 game
        shell: bash
        run: |
          set -euxo pipefail

          cmake -S "$PROJECT_DIR" \
            -B "$GITHUB_WORKSPACE/build" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PSN00BSDK_CMAKE" \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build "$GITHUB_WORKSPACE/build" --verbose

      - name: Collect PS1 game files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          for file in VTRAIL.bin VTRAIL.cue VTRAIL.exe VTRAIL.elf; do
            SOURCE="$GITHUB_WORKSPACE/build/$file"

            if [ ! -s "$SOURCE" ]; then
              echo "::error::Missing game file: $file"
              exit 1
            fi

            cp "$SOURCE" "$GITHUB_WORKSPACE/artifacts/"
          done

          ls -lh "$GITHUB_WORKSPACE/artifacts"

      - name: Upload Volt Trail V8
        uses: actions/upload-artifact@v4
        with:
          name: VoltTrail-PS1-V8-Test
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
