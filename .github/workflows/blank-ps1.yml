        python3 "$RUNNER_TEMP/lwod4140_generator.py"
        python3 - <<'PY_CHECK_4140'
        from pathlib import Path
        import json,struct
        import numpy as np
        root=Path('android/assets/characters')
        expected={'LWOD_Heldin_V4140.glb':(15,{'Idle','Walk'}),
                  'LWOD_Phoenix_Violett_V4140.glb':(10,{'Flap','Glide'})}
        for filename,(bone_count,clips) in expected.items():
            raw=(root/filename).read_bytes()
            assert raw[:4]==b'glTF' and struct.unpack_from('<I',raw,4)[0]==2
            assert struct.unpack_from('<I',raw,8)[0]==len(raw)
            length,chunk=struct.unpack_from('<I4s',raw,12)
            assert chunk==b'JSON'
            model=json.loads(raw[20:20+length])
            assert len(model['skins'])==1
            assert len(model['skins'][0]['joints'])==bone_count
            assert {a['name'] for a in model['animations']}==clips
            assert model['images'] and model['textures'] and len(model['materials'])>=6
            prims=model['meshes'][0]['primitives']
            assert len(prims)>=6
            for prim in prims:
                assert {'POSITION','NORMAL','JOINTS_0','WEIGHTS_0','TEXCOORD_0'}<=set(prim['attributes'])
            def values(accessor):
                a=model['accessors'][accessor]
                v=model['bufferViews'][a['bufferView']]
                start=20+length+8+v.get('byteOffset',0)+a.get('byteOffset',0)
                kind={'SCALAR':1,'VEC4':4,'VEC3':3}[a['type']]
                assert a['componentType']==5126
                return np.frombuffer(raw,dtype='<f4',count=a['count']*kind,offset=start).reshape(-1,kind)
            names=[n.get('name','') for n in model['nodes']]
            if filename.startswith('LWOD_Heldin'):
                materials={m['name']:m for m in model['materials']}
                for key in ('LWOD413_hair','LWOD413_hair_light','LWOD413_hair_dark'):
                    assert key in materials
                    m=materials[key]
                    assert 'emissiveFactor' not in m or sum(m['emissiveFactor'])<0.001
                    rgba=m['pbrMetallicRoughness']['baseColorFactor']
                    assert rgba[2]>rgba[0]*1.30, 'hair not violet enough'
                    assert rgba[2]>rgba[1]*1.35, 'hair not violet enough'
                    assert 'baseColorTexture' not in m['pbrMetallicRoughness']
                assert {'Hair','Head','LeftLeg','RightLeg','LeftArm','RightArm'}<=set(names)
            else:
                assert {'WingL','WingR','TipL','TipR','Tail'}<=set(names)
                # Matte Phoenix color is directly authored into each GLB material: no atlas bleeding.
                for mat in model['materials']:
                    pbr=mat['pbrMetallicRoughness']
                    assert 'baseColorFactor' in pbr, mat['name']
                    assert 'baseColorTexture' not in pbr, mat['name']
                    assert mat.get('alphaMode')=='OPAQUE', mat['name']
                print('V4140_MATTE_PHOENIX_OK')
                for anim in model['animations']:
                    targets={names[c['target']['node']] for c in anim['channels'] if c['target']['path']=='rotation'}
                    assert {'WingL','WingR'}<=targets
                # Test that the authored flap angles actually change across keyframes.
                flap=next(a for a in model['animations'] if a['name']=='Flap')
                wing_channel=next(c for c in flap['channels'] if names[c['target']['node']]=='WingL' and c['target']['path']=='rotation')
                rotation=values(flap['samplers'][wing_channel['sampler']]['output'])
                assert float(np.max(rotation[:,2])-np.min(rotation[:,2]))>0.18
            print('V4140_GLB_OK:',filename,'bones:',bone_count,'clips:',sorted(clips))
        PY_CHECK_4140
    - name: V41.4 Gewichtete Gelenke und GLB-Struktur pruefen
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY_WEIGHTS_4140'
        import json, struct
        from pathlib import Path
        import numpy as np
        root=Path('android/assets/characters')
        files=[('LWOD_Heldin_V4140.glb', 15, [('LeftArm','LeftForearm'),('RightArm','RightForearm'),('LeftLeg','LeftShin'),('RightLeg','RightShin')]),
               ('LWOD_Phoenix_Violett_V4140.glb',10,[('WingL','TipL'),('WingR','TipR'),('Body','Tail')])]
        for filename, bones, pairs in files:
            raw=(root/filename).read_bytes()
            assert raw[:4]==b'glTF' and struct.unpack_from('<I',raw,8)[0]==len(raw)
            json_len=struct.unpack_from('<I',raw,12)[0]
            data=json.loads(raw[20:20+json_len])
            bin_start=20+json_len+8
            assert len(data['skins'][0]['joints'])==bones
            name_to_i={n.get('name',''):i for i,n in enumerate(data['nodes'])}
            skin_nodes=data['skins'][0]['joints']
            joint_names={i:data['nodes'][node].get('name','') for i,node in enumerate(skin_nodes)}
            prim=data['meshes'][0]['primitives'][0]
            def accessor(idx):
                a=data['accessors'][idx]; view=data['bufferViews'][a['bufferView']]
                typ={'VEC4':4,'VEC3':3,'VEC2':2,'SCALAR':1}[a['type']]
                dtype={5126:'<f4',5123:'<u2',5125:'<u4'}[a['componentType']]
                start=bin_start+view.get('byteOffset',0)+a.get('byteOffset',0)
                return np.frombuffer(raw,dtype=dtype,count=a['count']*typ,offset=start).reshape(-1,typ)
            joint=accessor(prim['attributes']['JOINTS_0'])
            weight=accessor(prim['attributes']['WEIGHTS_0'])
            assert np.all(np.isfinite(weight))
            assert np.allclose(weight.sum(axis=1),1.0,atol=2.e-5)
            assert np.all(joint< bones)
            total_mixed=int(np.count_nonzero(np.sum(weight>0.05,axis=1)>1))
            assert total_mixed>120, f'{filename}: only {total_mixed} mixed vertices'
            for first,second in pairs:
                ia=skin_nodes.index(name_to_i[first]); ib=skin_nodes.index(name_to_i[second])
                present_a=(joint==ia)&(weight>0.07)
                present_b=(joint==ib)&(weight>0.07)
                both=np.any(present_a,axis=1)&np.any(present_b,axis=1)
                count=int(both.sum())
                assert count>12, f'{filename}: joint blend missing: {first}/{second} ({count})'
                print('BLEND_OK',first,second,count)
            print('V4140_WEIGHT_OK',filename,'mixed_vertices',total_mixed)
        PY_WEIGHTS_4140
