        #!/usr/bin/env python3
        # V31.8: 7 seconds of moving original footage, then original supplied menu art.
        import os,re
        from pathlib import Path
        from PIL import Image

        home=Path(os.environ['RUNNER_TEMP'])/'lydra_v318_video'
        source=Path(os.environ['PROJECT_DIR'])/'src'
        p=source/'main.c'
        s=p.read_text(encoding='utf-8')

        def span(name):
            rx=r'\bstatic\s+(?:void|int)\s+'+re.escape(name)+r'\s*\([^;]*?\)\s*\{'
            a=list(re.finditer(rx,s,re.S))
            if len(a)!=1:
                raise RuntimeError('V31.8 expected function '+name+': '+str(len(a)))
            start=a[0].start();i=a[0].end();depth=1;state='code'
            while depth and i<len(s):
                c=s[i]; nx=s[i+1] if i+1<len(s) else ''
                if state=='code':
                    if c=='/' and nx=='/':state='line';i+=1
                    elif c=='/' and nx=='*':state='block';i+=1
                    elif c=='"':state='str'
                    elif c=="'":state='char'
                    elif c=='{':depth+=1
                    elif c=='}':depth-=1
                elif state=='line':
                    if c=='\n':state='code'
                elif state=='block':
                    if c=='*' and nx=='/':state='code';i+=1
                else:
                    if c=='\\':i+=1
                    elif (state=='str' and c=='"') or (state=='char' and c=="'"):state='code'
                i+=1
            if depth:raise RuntimeError('V31.8 malformed function: '+name)
            return start,i

        def replace_fn(name,new):
            global s
            start,end=span(name)
            s=s[:start]+new.strip()+'\n'+s[end:]

        # 7.00 seconds at the game's NTSC target update cadence: 28 distinct video frames,
        # each held for 15 of 60 VSync cycles (4 fps). This is actual sampled motion from
        # the user's original seven seconds, not eight unrelated splash still images.
        replace_fn('vt_v314_input',r'''
        static void vt_v314_input(unsigned int pressed) {
            vt_v314_blink++;
            if(vt_v314_phase==-1) {
                ++vt_v314_elapsed;
                if(vt_v314_elapsed>=420) {
                    vt_v314_phase=2;
                    vt_v314_elapsed=0;
                    vt_v314_cursor=0;
                    vt_v314_message="";
                }
            } else if(vt_v314_phase==2) {
                if(pressed&PAD_UP)vt_v314_cursor=(vt_v314_cursor+2)%3;
                if(pressed&PAD_DOWN)vt_v314_cursor=(vt_v314_cursor+1)%3;
                /* Triangle on title replays the seven-second original intro. */
                if(pressed&PAD_TRIANGLE) {
                    vt_v314_phase=-1;
                    vt_v314_elapsed=0;
                    vt_v314_vram_frame=-1;
                } else if(pressed&(PAD_CROSS|PAD_START)) {
                    if(vt_v314_cursor==0) {
                        vt_v314_active=0;vt_menu_open=0;vt_menu_page=0;
                        vt_v314_message="";
                    } else if(vt_v314_cursor==1) {
                        int result=vt_load_game();
                        if(result==1) {
                            vt_v314_active=0;vt_menu_open=0;vt_menu_page=0;
                            vt_v314_message="";
                        } else {
                            vt_v314_message=(result==-1)?"DATEI UNGUELTIG":"KEIN SPIELSTAND";
                        }
                    } else {
                        vt_v314_phase=3;vt_v314_opt_cursor=0;
                        vt_v314_message="";
                    }
                }
            } else if(vt_v314_phase==3) {
                if(pressed&PAD_UP)vt_v314_opt_cursor=(vt_v314_opt_cursor+2)%3;
                if(pressed&PAD_DOWN)vt_v314_opt_cursor=(vt_v314_opt_cursor+1)%3;
                if(pressed&PAD_TRIANGLE)vt_v314_phase=2;
                if(vt_v314_opt_cursor==0) {
                    if((pressed&PAD_LEFT) && vt_opt_volume>0)vt_opt_volume-=10;
                    if((pressed&PAD_RIGHT) && vt_opt_volume<100)vt_opt_volume+=10;
                    if(pressed&(PAD_LEFT|PAD_RIGHT))vt_opt_apply_volume();
                } else if(vt_v314_opt_cursor==1) {
                    if((pressed&PAD_LEFT) && vt_opt_text_speed>1)vt_opt_text_speed--;
                    if((pressed&PAD_RIGHT) && vt_opt_text_speed<3)vt_opt_text_speed++;
                } else if(pressed&(PAD_CROSS|PAD_START))vt_v314_phase=2;
            }
            if(vt_v314_active) {
                vt_menu_open=1;
                vt_menu_page=0;
            }
        }
        ''')
        replace_fn('vt_v314_choice_frame',r'''
        static int vt_v314_choice_frame(void) {
            if(vt_v314_phase==-1) {
                int frame=vt_v314_elapsed/15;
                if(frame<0)frame=0;
                if(frame>27)frame=27;
                return frame;
            }
            return 28; /* EXACT user-supplied 39017.png: no invented background */
        }
        ''')

        # Use the palette-expanded pixels for the GPU upload. The game already draws the
        # textured full-screen quad and its interactive text. Only swap the source pixels.
        needle='LoadImage(&texture_rect,(u_long *)(void *)vt_v314_images[current]);'
        if s.count(needle)!=1:
            raise RuntimeError('V31.8 expected exactly one original title texture upload')
        s=s.replace(needle,'LoadImage(&texture_rect,(u_long *)(void *)vt_v318_frame_rgb555(current));',1)

        # Hide any old intro lettering or flashing START. The original video carries
        # its own imagery; there must be no overlays during its 7 second playback.
        a,b=span('vt_v314_hud')
        hud=s[a:b]
        hud=hud.replace('if(vt_v314_phase==-1) {','if(vt_v314_phase==-1) {\n        /* 7-second intro image has no text overlays. */',1)
        # If old code displays text in the introductory branch, erase that branch only.
        i=hud.index('if(vt_v314_phase==-1) {')
        j=hud.index('} else if(vt_v314_phase==2) {',i)
        hud=hud[:i]+'if(vt_v314_phase==-1) {\n        /* No in-game text while the original video frames play. */\n    '+hud[j:]
        s=s[:a]+hud+s[b:]

        # Original uploaded menu image has NO built-in slot graphics, so draw a blue
        # PS1-style window underneath the existing interactive rows and their labels.
        a,b=span('vt_v3172_menu_slots');fn=s[a:b]
        fn=fn.replace('if(vt_v314_phase==3) {\n        aligned=', 'if(vt_v314_phase==3) {\n        aligned=')
        # Replace old bottom panel with a compact inset, not the huge old options overlay.
        old='''    /* Options page receives a plain dark panel below its three rows. */
            if(vt_v314_phase==3) {'''
        if old not in fn:
            raise RuntimeError('V31.8 previous main menu slot function changed')
        fn=fn.replace(old,'''    /* Opaque ornamental panel behind ALL selectable slots. OT draws LIFO,
               so tiles enqueued here paint BEFORE the individual row tiles. */
            if(vt_v314_phase==2 || vt_v314_phase==3) {''',1)
        fn=fn.replace('setXY0(tile,97,132);','setXY0(tile,96,132);')
        fn=fn.replace('setWH(tile,135,80);','setWH(tile,135,78);')
        fn=fn.replace('setRGB0(tile,12,19,37);','setRGB0(tile,11,25,58);')
        s=s[:a]+fn+s[b:]

        # Recreate header with 28 indexed 160x120 video frames + the EXACT supplied
        # main menu image RGB555. Fixed palette is per-frame and does not use the CD.
        header=['/* V31.8: frames extracted from user 37568.mp4, menu from 39017.png. */',
                '#ifndef LYDRA_V318_FRAMES_H','#define LYDRA_V318_FRAMES_H']
        def rgb555(r,g,b):
            v=((int(b)>>3)<<10)|((int(g)>>3)<<5)|(int(r)>>3)
            return v if v else 0x8000
        n=28
        for k in range(n):
            path=home/('frame_%02d.jpg'%k)
            with Image.open(path) as img:
                rgb=img.convert('RGB')
                if rgb.size!=(160,120):raise RuntimeError('Wrong 4fps video frame dimensions')
                indexed=rgb.quantize(colors=256,method=Image.Quantize.MEDIANCUT,dither=Image.Dither.NONE)
                idx=bytes(indexed.getdata()); raw=(indexed.getpalette() or [])
                raw=raw+[0]*max(0,768-len(raw))
            if len(idx)!=19200:raise RuntimeError('Invalid video frame')
            header.append('static const unsigned char vt_v318_idx_%d[19200] = {'%k)
            for j in range(0,len(idx),32):
                header.append(' '+','.join(str(v) for v in idx[j:j+32])+',')
            header.append('};')
            palette=[rgb555(*raw[3*j:3*j+3]) for j in range(256)]
            header.append('static const unsigned short vt_v318_palette_%d[256] = {'%k)
            for j in range(0,256,16):
                header.append(' '+','.join('0x%04x'%v for v in palette[j:j+16])+',')
            header.append('};')
        header.append('static const unsigned char *const vt_v318_indices[28]={'+','.join('vt_v318_idx_%d'%i for i in range(n))+'};')
        header.append('static const unsigned short *const vt_v318_palettes[28]={'+','.join('vt_v318_palette_%d'%i for i in range(n))+'};')
        with Image.open(home/'menu.jpg') as im:
            colors=[rgb555(*pix) for pix in im.convert('RGB').getdata()]
        if len(colors)!=19200:raise RuntimeError('Original menu image size mismatched')
        header.append('static const unsigned short vt_v318_menu_rgb555[19200] __attribute__((aligned(4))) = {')
        for j in range(0,len(colors),16):
            header.append(' '+','.join('0x%04x'%v for v in colors[j:j+16])+',')
        header.append('};')
        header.append('static unsigned short vt_v318_expanded[19200] __attribute__((aligned(4)));')
        header.append('''static const unsigned short *vt_v318_frame_rgb555(int frame) {
            int i;
            const unsigned char *indices;
            const unsigned short *palette;
            if(frame>=28)return vt_v318_menu_rgb555;
            if(frame<0)frame=0;
            indices=vt_v318_indices[frame];
            palette=vt_v318_palettes[frame];
            for(i=0;i<19200;i++)vt_v318_expanded[i]=palette[indices[i]];
            return vt_v318_expanded;
        }''')
        header.append('#endif')
        h=source/'lydra_v314_frames.h'
        h.write_text('\n'.join(header)+'\n',encoding='utf-8')
        if h.stat().st_size<1_800_000:raise RuntimeError('V31.8 video frames header incomplete')
        for f in ('vt_v314_input','vt_v314_choice_frame','vt_v314_hud','vt_v314_draw','vt_v3172_menu_slots'):
            span(f)
        for token in ('vt_v318_frame_rgb555(current)','vt_v314_active=0','vt_save_game(void)',
                      'vt_load_game(void)','vt_v281_resolve_movement();',
                      'vt_v292_draw_exploration_hud();','vt_opt_draw_page();'):
            if token not in s: raise RuntimeError('V31.8 lost game function '+token)
        p.write_text(s,encoding='utf-8')
        print('V31.8: 7.0s original video as 28 playable full screen frames (4fps),')
        print('then user 39017.png as interactive menu with New/Load/Options.')
        print('Source size',p.stat().st_size,'Frames header size',h.stat().st_size)

        LYDRA_V318_FINAL_PY
        python3 "$RUNNER_TEMP/lydra_v318_final_patch.py"
    - name: V31.7.3 Menu und HUD pruefen
      shell: bash
      run: |
        set -euo pipefail
        SRC="$PROJECT_DIR/src/main.c"
        for marker in 'vt_v3173_time_font=FntOpen(177' 'vt_v3173_menu_font=FntOpen(106' 'FntPrint(vt_v3173_menu_font,' 'FntPrint(vt_v3173_time_font,' 'FntFlush(vt_v3173_time_font);' 'vt_v3172_menu_slots' 'if(vt_v314_active)return;' 'vt_load_game(void)' 'vt_save_game(void)'; do
          grep -Fq "$marker" "$SRC" || { echo "::error::V31.7.3 Spiel-Element fehlt: $marker"; exit 1; }
        done
        if grep -Fq 'FntFlush(5);FntFlush(6);FntFlush(7);' "$SRC"; then
          echo '::error::Alte Schriftfenster-Nummern gefunden'; exit 1
        fi
        echo 'V31.7.3 Titelmenue, Tag/Nacht und Speicherfunktionen bereit.'
    - name: V31.8 28 Video-Frames und Original-Hauptmenue pruefen
      shell: bash
      run: |
        set -euo pipefail
        SRC="$PROJECT_DIR/src"
        test -s "$SRC/main.c"
        test -s "$SRC/lydra_v314_frames.h"
        grep -Fq 'vt_v318_idx_27[19200]' "$SRC/lydra_v314_frames.h"
        grep -Fq 'vt_v318_menu_rgb555[19200]' "$SRC/lydra_v314_frames.h"
        grep -Fq 'vt_v314_elapsed>=420' "$SRC/main.c"
        grep -Fq 'vt_v318_frame_rgb555(current)' "$SRC/main.c"
        grep -Fq 'vt_load_game(void)' "$SRC/main.c"
        grep -Fq 'vt_save_game(void)' "$SRC/main.c"
        grep -Fq 'vt_v3173_time_font=FntOpen(177' "$SRC/main.c"
        echo 'V31.8 geprueft: 28 Originalvideo-Frames, Menuebild, aktive Menuewahl und Save/Load.'
