
name: Build Lydra World Of Dragon PS1 V25

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build unzip curl \
            ffmpeg python3-pil python3-yaml

      - name: Load working V24.3 source
        shell: bash
        run: |
          set -euo pipefail

          V243_COMMIT="7886e325c196b8d43576e12f6916831de73be704"

          curl --fail --location --retry 4 \
            "https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/$V243_COMMIT/.github/workflows/blank-ps1.yml" \
            -o "$RUNNER_TEMP/working-v243.yml"

          cat > "$RUNNER_TEMP/run_v243.py" <<'PY'
          import os
          import sys
          import subprocess
          from pathlib import Path
          import yaml

          source = (
              Path(os.environ["RUNNER_TEMP"])
              / "working-v243.yml"
          )

          data = yaml.safe_load(
              source.read_text(encoding="utf-8")
          )

          steps = data["jobs"]["build"]["steps"]

          wanted = sys.argv[1]

          matches = [
              step for step in steps
              if step.get("name") == wanted
          ]

          if len(matches) != 1:
              raise RuntimeError(
                  "Build step missing: " + wanted
              )

          print("Running:", wanted, flush=True)

          subprocess.run(
              [
                  "bash",
                  "-euo",
                  "pipefail",
                  "-c",
                  matches[0]["run"]
              ],
              env=os.environ.copy(),
              check=True
          )
          PY

          python3 "$RUNNER_TEMP/run_v243.py" \
            "Load working V18 instructions"

      - name: Prepare existing game project
        shell: bash
        run: |
          set -euo pipefail

          python3 "$RUNNER_TEMP/run_v243.py" \
            "Prepare V18 game project"

      - name: Rebuild working V24.3 game
        shell: bash
        run: |
          set -euo pipefail

          test -n "${PROJECT_DIR:-}" || {
            echo "::error::PROJECT_DIR missing"
            exit 1
          }

          cat > "$RUNNER_TEMP/restore_game.py" <<'PY'
          import os
          import subprocess
          from pathlib import Path
          import yaml

          source = (
              Path(os.environ["RUNNER_TEMP"])
              / "working-v243.yml"
          )

          steps = yaml.safe_load(
              source.read_text(encoding="utf-8")
          )["jobs"]["build"]["steps"]

          required = [
              "Restore V17 intro and gameplay",
              "Restore V18 dragons and graphics",
              "Apply working V18 compiler fix",
              "Add V19 dragon species and battle effects",
              "Add V20 Dragon Codex and elemental battles",
              "Fix V20 C function declaration",
              "Add V21 three-dragon team and detailed Codex",
              "Apply V22 persistent fainting and battle switching",
              "Apply V23 selected living dragon in overworld",
              "Expand V24 world and improve retro adventure graphics",
              "Apply V24.1 camera background villages and roads fixed",
              "V24.2 Tilt camera and show true ground perspective",
              "V24.3 Improve player framing and battle HP display"
          ]

          for name in required:
              matches = [
                  step for step in steps
                  if step.get("name") == name
              ]

              if len(matches) != 1:
                  raise RuntimeError(
                      "Required step missing: " + name
                  )

              print("Applying:", name, flush=True)

              subprocess.run(
                  [
                      "bash",
                      "-euo",
                      "pipefail",
                      "-c",
                      matches[0]["run"]
                  ],
                  env=os.environ.copy(),
                  check=True
              )

          print("Working V24.3 restored.")
          PY

          python3 "$RUNNER_TEMP/restore_game.py"

      - name: Add Lydra name and V25 graphics
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path

          path = (
              Path(os.environ["PROJECT_DIR"])
              / "src"
              / "main.c"
          )

          code = path.read_text(encoding="utf-8")

          old_title = "VOLT TRAIL V24.3"
          new_title = "LYDRA WORLD OF DRAGON"

          if old_title not in code:
              raise RuntimeError(
                  "V24.3 title not found"
              )

          code = code.replace(
              old_title,
              new_title
          )

          # PS1 GPU dithering.
          anchor = "    SetDispMask(1);"

          if code.count(anchor) != 1:
              raise RuntimeError(
                  "GPU setup marker missing"
              )

          code = code.replace(
              anchor,
              "    draw[0].dtd = 1;\n"
              "    draw[1].dtd = 1;\n"
              + anchor,
              1
          )

          # Extra original low-poly nature details.
          graphics = r'''
          /*
           * LYDRA V25 - WORLD GRAPHICS
           *
           * Small PS1-friendly scenery.
           * Only nearby, visible details are drawn.
           */

          static void lydra_v25_world_details(void) {
              int cell_x;
              int cell_z;
              int cx;
              int cz;

              cell_x = px / 180;
              cell_z = pz / 180;

              for (
                  cz = cell_z;
                  cz <= cell_z + 5;
                  cz++
              ) {
                  for (
                      cx = cell_x - 3;
                      cx <= cell_x + 3;
                      cx++
                  ) {
                      int seed;
                      int wx;
                      int wz;
                      int dx;
                      int dz;
                      int shade;

                      seed = (
                          cx * 19 +
                          cz * 29 +
                          region * 7
                      ) & 15;

                      if (
                          seed != 0 &&
                          seed != 3 &&
                          seed != 7
                      ) {
                          continue;
                      }

                      wx = cx * 180 + seed * 5;
                      wz = cz * 180 + seed * 3;

                      dx = wx - px;
                      dz = wz - pz;

                      /* Avoid hidden polygons. */
                      if (
                          dz < 100 ||
                          dz > 740 ||
                          dx < -480 ||
                          dx > 480
                      ) {
                          continue;
                      }

                      /* Keep the central road clear. */
                      if (
                          wx > -115 &&
                          wx < 115
                      ) {
                          continue;
                      }

                      /*
                       * Atmospheric coloring:
                       * objects farther away are
                       * slightly cooler in color.
                       */
                      shade = dz > 450;

                      if (seed == 0) {
                          /* Low-poly boulder. */
                          draw_box(
                              wx, 26, wz,
                              8 + (cz & 3),
                              shade ? 103 : 118,
                              shade ? 120 : 111,
                              shade ? 139 : 104
                          );
                      } else if (seed == 3) {
                          /* Green shrub. */
                          vt_pyramid(
                              wx, 23, wz,
                              13, 22,
                              shade ? 64 : 37,
                              shade ? 139 : 169,
                              shade ? 111 : 73
                          );
                      } else {
                          /* Small decorative rock. */
                          draw_box(
                              wx, 30, wz,
                              5,
                              shade ? 119 : 137,
                              shade ? 135 : 122,
                              shade ? 150 : 101
                          );
                      }
                  }
              }
          }
          '''

          marker = "static void draw_hud(void) {"

          if code.count(marker) != 1:
              raise RuntimeError(
                  "HUD insertion marker missing"
              )

          code = code.replace(
              marker,
              graphics + "\n" + marker,
              1
          )

          draw_marker = (
              "        vt_v24_draw_overworld();"
          )

          if code.count(draw_marker) != 1:
              raise RuntimeError(
                  "World rendering marker missing"
              )

          code = code.replace(
              draw_marker,
              draw_marker
              + "\n"
              + "        lydra_v25_world_details();",
              1
          )

          required = [
              "LYDRA WORLD OF DRAGON",
              "lydra_v25_world_details();",
              "vt_v24_draw_overworld();",
              "vt_v23_field_dragon();",
              "vt_v18_battle_bars();",
              "vt_save_game(void)",
              "vt_load_game(void)",
              "vt_play_intro();"
          ]

          for item in required:
              if item not in code:
                  raise RuntimeError(
                      "Game feature missing: " + item
                  )

          path.write_text(
              code,
              encoding="utf-8"
          )

          print("LYDRA WORLD OF DRAGON")
          print("V25 graphics installed")
          print("Existing gameplay preserved")
          PY

      - name: Install PSn00bSDK
        shell: bash
        run: |
          set -euo pipefail

          python3 "$RUNNER_TEMP/run_v243.py" \
            "Install PSn00bSDK 0.24 directly"

      - name: Build Lydra World Of Dragon
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            -S "$PROJECT_DIR" \
            -B "$GITHUB_WORKSPACE/build" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PSN00BSDK_CMAKE" \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build \
            "$GITHUB_WORKSPACE/build" \
            --verbose

      - name: Collect PS1 game files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            "$GITHUB_WORKSPACE/artifacts"

          for file in \
            VTRAIL.bin \
            VTRAIL.cue \
            VTRAIL.exe \
            VTRAIL.elf
          do
            source="$GITHUB_WORKSPACE/build/$file"

            if [ ! -s "$source" ]; then
              echo "::error::Missing $file"
              exit 1
            fi

            cp "$source" \
              "$GITHUB_WORKSPACE/artifacts/"
          done

          ls -lh \
            "$GITHUB_WORKSPACE/artifacts"

      - name: Upload Lydra World Of Dragon
        uses: actions/upload-artifact@v4
        with:
          name: Lydra-World-Of-Dragon-PS1-V25
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
