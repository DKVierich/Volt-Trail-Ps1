    - name: FIX30 PS1 Grafik Hausgroesse Stadtgroesse und Spielbasis pruefen
      shell: bash
      run: |
        set -euo pipefail
        for f in VTRAIL.bin VTRAIL.cue VTRAIL.elf VTRAIL.exe TEMPO_FIX12_DIAGNOSE.txt FLUSS_FIX13_1_DIAGNOSE.txt BERGE_FIX14_DIAGNOSE.txt BERGE_FIX15_DIAGNOSE.txt BAUM_FIX16_DIAGNOSE.txt FELS_FIX17_DIAGNOSE.txt FERNBERGE_FIX18_DIAGNOSE.txt KOLLISION_FIX19_DIAGNOSE.txt STAEDTE_FIX20_DIAGNOSE.txt; do
         test -s "artifacts/$f" || { echo "::error::Fehlende Datei: $f"; exit 1; }
        done
        printf '%s\n' 'Lydra World Of Dragon V31.9.9.3 FIX18' 'Fernberge kleiner, Crystal Pass erhalten, 75-Prozent-Tempo beibehalten.' > artifacts/VERSION_V31_9_9_3_FIX18.txt

        printf "%s\n" "Lydra World Of Dragon V31.9.9.4 FIX19: Kollisionen/Haustuer, keine Wander-Teleports, Stadtweg frei und Bewegung 75 Prozent" > artifacts/VERSION_V31_9_9_4_FIX19.txt

        printf '%s\n' 'LYDRA WORLD OF DRAGON V31.9.9.5 FIX20: all cities present; region travel by coordinates; fixed 75 percent tempo.' > artifacts/VERSION_V31_9_9_5_FIX20.txt

        test -s artifacts/KAMERA_FIX21_2_DIAGNOSE.txt && test -s artifacts/KAMERA_FIX22_DIAGNOSE.txt || { echo '::error::FIX21 Kamera-Diagnose fehlt'; exit 1; }
        printf '%s\n' 'LYDRA WORLD OF DRAGON V31.9.9.6 FIX21.2: near-house camera steadier; FIX20 cities and FIX12 75 percent speed retained.' > artifacts/VERSION_V31_9_9_7_FIX22.txt


        test -s artifacts/BUERGERHAUS_FIX24_DIAGNOSE.txt || { echo "::error::FIX24 Hausdiagnose fehlt"; exit 1; }

        printf '%s\n' 'LYDRA WORLD OF DRAGON V31.9.9.12 FIX27: Kameraray hinter bestehenden V28.1-Kollisionen definiert, FIX24-Buergerhaeuser erhalten.' > artifacts/VERSION_V31_9_9_12_FIX27.txt

        test -s artifacts/GRAFIK_FIX30_DIAGNOSE.txt || { echo "::error::FIX30.1 Grafikdiagnose fehlt"; exit 1; }
        test -s artifacts/GRAFIK_FIX28_DIAGNOSE.txt || { echo "::error::FIX28 Grafikdiagnose fehlt"; exit 1; }
        printf '%s\n' 'LYDRA WORLD OF DRAGON V31.9.9.18 FIX30.1: groessere Hausmodelle und zusaetzliche Stadtgebaeude mit verifizierten Platzierungen.' > artifacts/VERSION_V31_9_9_18_FIX30_1.txt
    - name: FIX30 PS1 BIN CUE EXE ELF als GitHub Artefakt hochladen
      uses: actions/upload-artifact@v4
      id: lydra_ps1_artifact
      with:
        name: Lydra-PS1-V31-9-9-18-FIX30-1-STADT-HAEUSER
        path: artifacts/
        if-no-files-found: error
        retention-days: 14
    - name: GitHub Artefakt-ID nach dem Upload erzwingen
      shell: bash
      run: "set -euo pipefail\nif [ -z \"${LYDRA_ARTIFACT_ID:-}\" ]; then\n  echo '::error::GitHub meldet keine Artefakt-ID trotz Build. Kein gruenes Ergebnis erlauben.'\n  exit 1\nfi\nprintf 'PS1 ZIP wurde von GitHub gespeichert. Artefakt-ID: %s\\n' \"$LYDRA_ARTIFACT_ID\"\n"
      env:
        LYDRA_ARTIFACT_ID: ${{ steps.lydra_ps1_artifact.outputs.artifact-id }}
