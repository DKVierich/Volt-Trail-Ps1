      - name: Godot GDScript importieren und pruefen
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path android --editor --import --quit
          test -s android/scripts/V7Addon.gd
      - name: V7 Spielskript testen
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path android --quit-after 4 > "$RUNNER_TEMP/lwod_v7_runtime.log" 2>&1 || {
            cat "$RUNNER_TEMP/lwod_v7_runtime.log"
            exit 1
          }
          cat "$RUNNER_TEMP/lwod_v7_runtime.log"
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Invalid call\.' "$RUNNER_TEMP/lwod_v7_runtime.log"; then
            echo '::error::GDScript Problem im Laufzeittest'
            exit 1
          fi
      - name: APK V7 exportieren
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android
          godot --headless --path android --export-debug 'Android' \
            "$GITHUB_WORKSPACE/build/android/LWOD-Android-V7.apk"
          test -s build/android/LWOD-Android-V7.apk
          unzip -t build/android/LWOD-Android-V7.apk >/dev/null
      - name: Android APK herunterladen
        uses: actions/upload-artifact@v4
        with:
          name: LWOD_ANDROID_V7_APK
          path: build/android/LWOD-Android-V7.apk
          if-no-files-found: error
          retention-days: 14
