        run: python3 "$RUNNER_TEMP/lwod_run.py" 54

      - name: FIX33 Geometrie verbessern
        run: python3 "$RUNNER_TEMP/lwod_fix36_replay.py" 'FIX33 3D-Haeuser, Baeume und Felsen'

      - name: FIX33 pruefen
        run: python3 "$RUNNER_TEMP/lwod_fix36_replay.py" 'FIX33 Grafik pruefen'

      - name: PS1 Aufloesung waehlen
        run: python3 "$RUNNER_TEMP/lwod_fix36_replay.py" 'PS1-Aufloesung 640 oder 320 einstellen'

      # SDK-Installation und Kompilierung getrennt ausfuehren.
      - name: PS1 SDK installieren und Variablen speichern
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/lwod_run.py" 55
          test -s "$GITHUB_ENV"
          grep -q '^PSN00BSDK_CMAKE=' "$GITHUB_ENV" || {
            echo '::error::PSN00BSDK_CMAKE nicht an den naechsten GitHub-Schritt weitergegeben'
            exit 1
          }

      - name: PS1 kompilieren
        run: |
          set -euo pipefail
          : "${PSN00BSDK_CMAKE:?PS1 SDK wurde nicht uebernommen}"
          test -f "$PSN00BSDK_CMAKE"
          python3 "$RUNNER_TEMP/lwod_run.py" 56

      - name: Fehlerprotokoll fuer GitHub sichern
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: LWOD_FIX36_Buildfehler
          path: |
            artifacts/FIX25_BUILD_LOG.txt
            artifacts/FIX25_ERSTE_FEHLER.txt
          if-no-files-found: warn

      - name: PS1 Finale 52
        run: python3 "$RUNNER_TEMP/lwod_run.py" 58

      - name: PS1 Finale 53
        run: python3 "$RUNNER_TEMP/lwod_run.py" 59

      - name: PS1 Finale 54
        run: python3 "$RUNNER_TEMP/lwod_run.py" 60

      - name: BIN und CUE erstellen
        run: python3 "$RUNNER_TEMP/lwod_run.py" 61

      - name: BIN und CUE fuer FIX36 benennen
        run: |
          set -euo pipefail
          folder="$RUNNER_TEMP/lydra_ps1_spiel"
          test -s "$folder/LWOD_FIX32.bin"
          test -s "$folder/LWOD_FIX32.cue"
          mv "$folder/LWOD_FIX32.bin" "$folder/LWOD_FIX36.bin"
          sed 's/LWOD_FIX32[.]bin/LWOD_FIX36.bin/g' "$folder/LWOD_FIX32.cue" > "$folder/LWOD_FIX36.cue"
          rm "$folder/LWOD_FIX32.cue"
          grep -qi 'LWOD_FIX36.bin' "$folder/LWOD_FIX36.cue"

      - name: PS1 Spiel herunterladen
        uses: actions/upload-artifact@v4
        with:
          name: LWOD_FIX36_HD
          path: ${{ runner.temp }}/lydra_ps1_spiel/
          if-no-files-found: error
          retention-days: 14
