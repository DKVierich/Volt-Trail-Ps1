        edit('V24Regions.gd',lambda s:disable(disable(s,'_make_landmarks'),'_load_nearby'))
        edit('V17Visual.gd',lambda s:disable(s,'_detail_ground'))
        # Keep current regional landmarks but remove the bare rectangular swamp pads
        # and outdated pier planks, NOT the actual village gates, ruins or volcano.
        def landmarks(s):
            a='            _block(root,p+Vector2(5.0,-7.0),Vector3(15,1.5,22),"#55756b")\n'
            b='        for i in range(4):\n            _block(root,center+Vector2(250.0+float(i)*32.0,130.0),Vector3(28,3,95),"#8c6842")\n'
            for old in (a,b):
                if old in s:
