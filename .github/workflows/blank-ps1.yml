
# LWOD FIX37 STABIL - Bilddarstellung reparieren
# PS1 320x240 mit FIX33 Grafikmodellen
name: LWOD FIX37 STABIL - Bildfix

'on':
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - .github/workflows/blank-ps1.yml

permissions:
  contents: read

jobs:
  build:
    name: PS1 Bild und Grafik reparieren
    runs-on: ubuntu-latest
    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Programme installieren
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build unzip curl ffmpeg python3-pil python3-yaml

      - name: FIX36 Basis laden
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            'https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/efb8cdbb05262caf1a714bae16fccaa5984b719a/.github/workflows/blank-ps1.yml' \
            -o "$RUNNER_TEMP/fix36.yml"
          python3 - <<'PY_VERIFY'
          from pathlib import Path
          import os,hashlib,yaml
          root=Path(os.environ['RUNNER_TEMP'])
          source=root/'fix36.yml'
          raw=source.read_bytes()
          blob=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert blob=='3f40dc4623f5fe438329b12c33e8453c9177e1f0', 'FIX36 Basis unvollstaendig'
          data=yaml.safe_load(raw)
          steps=data['jobs']['build']['steps']
          assert len(steps)==68, ('Unerwartete Schrittzahl',len(steps))
          script='import os,sys,yaml,subprocess\nfrom pathlib import Path\npath=Path(os.environ["RUNNER_TEMP"])/"fix36.yml"\nsteps=yaml.safe_load(path.read_bytes())["jobs"]["build"]["steps"]\nname=sys.argv[1]\nfound=[x for x in steps if x.get("name")==name and isinstance(x.get("run"),str)]\nif len(found)!=1:raise SystemExit("FIX36 Schritt fehlt: "+name)\nsubprocess.run(["bash","-euo","pipefail","-c",found[0]["run"]],check=True)\n'
          (root/'fix37_step.py').write_text(script,encoding='utf-8')
          print('FIX36 Bausteine verifiziert')
          PY_VERIFY

      - name: FIX32 Basis vorbereiten
        run: python3 "$RUNNER_TEMP/fix37_step.py" 'FIX32 Basis vorbereiten'

      - {name: Basis 03, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 3'}
      - {name: Basis 04, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 4'}
      - {name: Basis 05, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 5'}
      - {name: Basis 06, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 6'}
      - {name: Basis 07, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 7'}
      - {name: Basis 08, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 8'}
      - {name: Basis 09, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 9'}
      - {name: Basis 10, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 10'}
      - {name: Basis 11, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 11'}
      - {name: Basis 12, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 12'}
      - {name: Basis 13, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 13'}
      - {name: Basis 14, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 14'}
      - {name: Basis 15, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 15'}
      - {name: Basis 16, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 16'}
      - {name: Basis 17, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 17'}
      - {name: Basis 18, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 18'}
      - {name: Basis 19, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 19'}
      - {name: Basis 20, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 20'}
      - {name: Basis 21, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 21'}
      - {name: Basis 22, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 22'}
      - {name: Basis 23, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 23'}
      - {name: Basis 24, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 24'}
      - {name: Basis 25, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 25'}
      - {name: Basis 26, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 26'}
      - {name: Basis 27, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 27'}
      - {name: Basis 28, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 28'}
