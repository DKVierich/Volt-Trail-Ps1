name: Lydra World Of Dragon V31.8 - 7 Sekunden Video und eigenes Hauptmenue
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Quellprojekt auschecken
      uses: actions/checkout@v4
    - name: Werkzeuge installieren
      shell: bash
      run: 'set -euo pipefail

        sudo apt-get update

        sudo apt-get install -y cmake ninja-build unzip curl ffmpeg python3-pil python3-yaml

        '
    - name: Funktionierende V31.6 FIX2 herunterladen
      shell: bash
      run: "set -euo pipefail\ncurl -fLsS --retry 4 --retry-delay 2 'https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/8c17f9bc45d1a3e9481ef1eda51da27fd728eee2/.github/workflows/blank-ps1.yml'\
        \ \\\n  -o \"$RUNNER_TEMP/lydra_v316_base.yml\"\ntest -s \"$RUNNER_TEMP/lydra_v316_base.yml\"\n"
    - name: V31.7 Stabiler Einzel-Schritt-Build vorbereiten
      shell: bash
      run: "set -euo pipefail\ncat > \"$RUNNER_TEMP/lydra_run_base_step.py\" <<'LYDRA_BASE_STEP_PY'\n#!/usr/bin/env python3\n\
        \"\"\"Execute exactly one trusted V31.6 FIX2 build step on this GitHub job runner.\n\nImportant: The outer workflow\
        \ invokes this script in separate GitHub Actions\nsteps, so env additions in GITHUB_ENV are reloaded by GitHub after\
        \ each step.\n\"\"\"\nimport os, sys, subprocess\nfrom pathlib import Path\nimport yaml\n\nif len(sys.argv) != 2:\n\
        \    raise SystemExit('Usage: python3 lydra_run_base_step.py \"EXACT STEP NAME\"')\nworkflow = Path(os.environ['RUNNER_TEMP'])/'lydra_v316_base.yml'\n\
        if not workflow.is_file():\n    raise RuntimeError('V31.6 FIX2 baseline workflow missing')\nsource=yaml.safe_load(workflow.read_text(encoding='utf-8'))\n\
        steps=source['jobs']['build']['steps']\nwanted=sys.argv[1]\nfound=[s for s in steps if s.get('name')==wanted and isinstance(s.get('run'),str)]\n\
        if len(found)!=1:\n    raise RuntimeError('Expected exactly one V31.6 step '+repr(wanted)+', got '+str(len(found)))\n\
        print('V31.6 BASIS:',wanted, flush=True)\nsubprocess.run(['bash','-euo','pipefail','-c',found[0]['run']],\n      \
        \         check=True,env=os.environ.copy())\nprint('FERTIG:',wanted,flush=True)\nLYDRA_BASE_STEP_PY\npython3 -m py_compile\
        \ \"$RUNNER_TEMP/lydra_run_base_step.py\"\n"
    - name: V31.6 Basis | Funktionierende V30.1 Build-Schritte laden
      shell: bash
      run: 'set -euo pipefail

        python3 "$RUNNER_TEMP/lydra_run_base_step.py" ''Funktionierende V30.1 Build-Schritte laden''

        '
    - name: V31.6 Basis | Stabile V27-Quellkette laden
      shell: bash
      run: 'set -euo pipefail

        python3 "$RUNNER_TEMP/lydra_run_base_step.py" ''Stabile V27-Quellkette laden''

        '
    - name: V31.6 Basis | V27 Grundlage – V26 laden
