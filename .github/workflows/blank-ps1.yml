                if(px< -WORLD_LIMIT){px=-WORLD_LIMIT;frac_x=0;speed_q10=0;}
                if(px> WORLD_LIMIT){px= WORLD_LIMIT;frac_x=0;speed_q10=0;}
                if(pz< -WORLD_LIMIT){pz=-WORLD_LIMIT;frac_z=0;speed_q10=0;}
                if(pz> WORLD_LIMIT){pz= WORLD_LIMIT;frac_z=0;speed_q10=0;}
                if(dx||dz) {
                    step_count++;
                    vt_v293_avatar_yaw=((speed_q10>0?2048:0)-vt_v292_cam_yaw+4096)&4095;
                    if(dx>0 && dx >= (dz<0?-dz:dz))facing=2;
