        godot --headless --path android --script res://tests/V4083TravelVillageSmoke.gd > \"$RUNNER_TEMP/v4083_repeated.log\"\
        \ 2>&1 || {\n  cat \"$RUNNER_TEMP/v4083_repeated.log\"\n  exit 1\n}\ncat \"$RUNNER_TEMP/v4083_repeated.log\"\
        \ngrep -Fq 'V4083_TRAVEL_VILLAGES_OK:' \"$RUNNER_TEMP/v4083_repeated.log\"\n"
