name: Lydra World Of Dragon V31.9.2.1 - Timing Pruefung repariert
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Quellprojekt auschecken
      uses: actions/checkout@v4
    - name: Werkzeuge installieren
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build unzip curl ffmpeg python3-pil python3-yaml
    - name: Kompakte V31.8.7 Basis vorbereiten
      shell: bash
      run: |-
        set -euo pipefail
        BASE_URL="https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/5c5c556238ce53f50696fd7e3fdc5dcd3493ca8d/.github/workflows/blank-ps1.yml"
        curl --fail --location --silent --show-error --retry 3 "$BASE_URL" -o "$RUNNER_TEMP/lydra_v3185_base.yml"
        python3 - <<'PY_REPLAY'
        import os,json,yaml,hashlib
        from pathlib import Path
        root=Path(os.environ['RUNNER_TEMP'])
        b=(root/'lydra_v3185_base.yml').read_bytes()
        checksum=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
        if checksum != '5f4aaafe69115d25c482c5a533f972aa8ee16102':
            raise RuntimeError('Stable source does not match pinned original: '+checksum)
        w=yaml.safe_load(b)
        s=w['jobs']['build']['steps']
        if len(s)!=56 or s[55].get('uses')!='actions/upload-artifact@v4':
            raise RuntimeError('Unexpected stable step structure')
        (root/'lydra_v3185_replay_steps.json').write_text(json.dumps([x.get('run') for x in s],ensure_ascii=False),encoding='utf-8')
        (root/'lydra_v3185_replay.py').write_text('''import sys,os,json,subprocess
        from pathlib import Path
        p=Path(os.environ["RUNNER_TEMP"])/"lydra_v3185_replay_steps.json"
        s=json.loads(p.read_text(encoding="utf-8"))
        i=int(sys.argv[1])
        if i<2 or i>54 or not isinstance(s[i],str):
            raise RuntimeError("Invalid base step: "+str(i))
        subprocess.run(["bash","-euo","pipefail","-c",s[i]],check=True)
        ''',encoding='utf-8')
        print('Pinned successful V31.8.5 base verified: 56 steps')
        PY_REPLAY
    - name: 'Basis 02: Stabile V31.8.1 Build-Basis laden und pruefen'
      shell: bash
      run: python3 "$RUNNER_TEMP/lydra_v3185_replay.py" 2
