        # The row tiles are queued before the title quad, hence drawn AFTER it in this OT (LIFO).
        menus=r'''
        static void vt_v3172_menu_slots(void) {
            int i, count, selected;
            TILE *tile;
            unsigned int aligned;
            if(vt_v314_phase!=2 && vt_v314_phase!=3)return;
            count=3;
