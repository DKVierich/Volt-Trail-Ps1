        assert s.count(old_vertex)==1,'FIX61: vertex anchor changed'\ns=s.replace(old_vertex,new_vertex,1)\n\nold_triangles='''\
        \    for i in range(spine.size()-1):\n        _v456_road_vertex(st,left[i],colour)\n        _v456_road_vertex(st,right[i],colour)\n\
        \        _v456_road_vertex(st,right[i+1],colour)\n        _v456_road_vertex(st,left[i],colour)\n        _v456_road_vertex(st,right[i+1],colour)\n\
        \        _v456_road_vertex(st,left[i+1],colour)'''\nnew_triangles='''    var traveled: float = 0.0\n    for i in range(spine.size()-1):\n\
        \        var next_traveled: float = traveled + spine[i].distance_to(spine[i+1])\n        _v456_road_vertex(st,left[i],colour,Vector2(0.0,traveled))\n\
        \        _v456_road_vertex(st,right[i],colour,Vector2(width,traveled))\n        _v456_road_vertex(st,right[i+1],colour,Vector2(width,next_traveled))\n\
        \        _v456_road_vertex(st,left[i],colour,Vector2(0.0,traveled))\n        _v456_road_vertex(st,right[i+1],colour,Vector2(width,next_traveled))\n\
        \        _v456_road_vertex(st,left[i+1],colour,Vector2(0.0,next_traveled))\n        traveled = next_traveled'''\n\
        assert s.count(old_triangles)==1, 'FIX61: original six-triangle vertex anchor changed'\ns=s.replace(old_triangles,new_triangles,1)\n\
        \nold_material='    surface.material_override = _material(Color.WHITE,true)'\nnew_material='    surface.material_override\
        \ = _v461_paving_material()'\nassert s.count(old_material)==1,'FIX61: global road material anchor changed'\ns=s.replace(old_material,new_material,1)\n\
        \nmarker='# FIX58: Wurzelheim-like path surface used by every village and intercity road.'\nassert s.count(marker)==1\n\
        material_code='''# FIX61: one lightweight shader for all paved road meshes, no extra meshes.\nconst V461_PAVING_SHADER\
