        if checksum != '5f4aaafe69115d25c482c5a533f972aa8ee16102':\n    raise RuntimeError('Stable source does not\
        \ match pinned original: '+checksum)\nw=yaml.safe_load(b)\ns=w['jobs']['build']['steps']\nif len(s)!=56\
