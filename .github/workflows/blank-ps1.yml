        #!/usr/bin/env python3
        """V31 source patch for Lydra World Of Dragon's V30.5 PS1 C program."""
        import os, re
        from pathlib import Path

        src=Path(os.environ['PROJECT_DIR'])/'src/main.c'
        s=src.read_text(encoding='utf-8')

        def span(name):
            matches=list(re.finditer(r'\bstatic\s+void\s+'+re.escape(name)+r'\s*\([^;]*?\)\s*\{',s,re.S))
            if len(matches)!=1:
                raise RuntimeError('V31: expected one function '+name+', found '+str(len(matches)))
            p=matches[0].end(); level=1; state='code'; at=p
            while p<len(s) and level:
                c=s[p]; nxt=s[p+1] if p+1<len(s) else ''
                if state=='code':
                    if c=='/' and nxt=='/': state='line';p+=1
                    elif c=='/' and nxt=='*': state='block';p+=1
                    elif c=='"': state='string'
                    elif c=="'": state='char'
                    elif c=='{':level+=1
                    elif c=='}':level-=1
                elif state=='line':
                    if c=='\n':state='code'
                elif state=='block':
                    if c=='*' and nxt=='/':state='code';p+=1
                elif state in ('string','char'):
                    if c=='\\':p+=1
                    elif (state=='string' and c=='"') or (state=='char' and c=="'"): state='code'
                p+=1
            if level: raise RuntimeError('V31 unmatched braces in '+name)
            return matches[0].start(),at,p-1,p

        def append(name, code):
            global s
            a,opening,closing,end=span(name)
            s=s[:closing]+'\n'+code+'\n'+s[closing:]

        def once(old,new):
            global s
            n=s.count(old)
            if n!=1:raise RuntimeError('V31 expected exact anchor %r, got %d'%(old[:90],n))
            s=s.replace(old,new,1)

        for token in ('vt_v293_player_box(', 'vt_v300_extend_ground(void)',
                      'vt_v301_sun(void)', 'vt_v281_resolve_movement();',
                      'vt_v282_draw_house_npcs(', 'vt_v292_draw_exploration_hud();',
                      'vt_save_game(void)', 'vt_load_game(void)', 'vt_v21_party[3]'):
            if token not in s:raise RuntimeError('V31 missing V30.5 subsystem: '+token)
        if 'static void vt_v31_oval(' in s:
            raise RuntimeError('V31 already applied')

        # Correct foreground holes: finer centered terrain, plus real view-space near-plane
        # clipping rather than discarding every triangle with any vertex behind camera.
        a,opening,closing,end=span('vt_v300_extend_ground')
        body=s[opening:closing]
        if 'near_step=140, near_cells=16' not in body:
            raise RuntimeError('V31: unexpected stable V30.5 near-terrain layout')
        body=body.replace('near_step=140, near_cells=16', 'near_step=120, near_cells=20')
        s=s[:opening]+body+s[closing:]

        start,op,cl,finish=span('draw_triangle3')
        body=s[op:cl]
        near=re.compile(r'/\* V30\.3: view-space near clipping matching the rotating camera\. \*/\s*\{.*?\n\s*\}',re.S)
        clip=r'''/* V31: clip the polygon at the rotated camera's near plane.
               Dropping an entire terrain triangle when just one corner is behind
               was the main reason for the blue wedge at the bottom of the screen. */
            if (!vt_v31_clipping) {
                SVECTOR vertices[3]={*v0,*v1,*v2};
                SVECTOR clipped[4];
                long view_z[3];
                int n=0, i, prev=2;
                int sn=vt_v293_sin(vt_v292_cam_yaw);
                int cs=vt_v293_cos(vt_v292_cam_yaw);
                const long near_plane=NEAR_Z+18;
                for(i=0;i<3;i++)
                    view_z[i]=((long)vertices[i].vz*cs-(long)vertices[i].vx*sn)/1024
                              +CAMERA_Z-70;
                for(i=0;i<3;i++) {
                    int old_in=view_z[prev]>=near_plane;
                    int now_in=view_z[i]>=near_plane;
                    if(old_in!=now_in) {
                        long denom=view_z[i]-view_z[prev];
                        long fac=denom ? ((near_plane-view_z[prev])*4096)/denom : 0;
                        SVECTOR cut;
                        if(fac<0)fac=0;if(fac>4096)fac=4096;
                        cut.vx=(short)(vertices[prev].vx+
                               ((long)(vertices[i].vx-vertices[prev].vx)*fac)/4096);
                        cut.vy=(short)(vertices[prev].vy+
                               ((long)(vertices[i].vy-vertices[prev].vy)*fac)/4096);
                        cut.vz=(short)(vertices[prev].vz+
                               ((long)(vertices[i].vz-vertices[prev].vz)*fac)/4096);
                        cut.pad=0;
                        if(n<4)clipped[n++]=cut;
                    }
                    if(now_in && n<4)clipped[n++]=vertices[i];
                    prev=i;
                }
                if(n<3)return;
                if(n!=3 || view_z[0]<near_plane || view_z[1]<near_plane || view_z[2]<near_plane) {
                    vt_v31_clipping=1;
                    draw_triangle3(&clipped[0],&clipped[1],&clipped[2],r,g,b);
                    if(n==4)draw_triangle3(&clipped[0],&clipped[2],&clipped[3],r,g,b);
                    vt_v31_clipping=0;
                    return;
                }
            }'''
        new_body,count=near.subn(clip,body,count=1)
        if count!=1:
            raise RuntimeError('V31: V30.3 camera view clipping block not found')
        s=s[:op]+new_body+s[cl:]
        # Need declaration before draw_triangle3 and definition once.
        start,op,cl,finish=span('draw_triangle3')
        s=s[:start]+'static int vt_v31_clipping=0;\n'+s[start:]

        # Rounder low-poly primitives made of triangular bands rather than a cube.
        models=r'''
        /* V31: eight-sided, faceted oval. ~32 triangles per model detail. */
        static void vt_v31_oval(int wx,int wy,int wz,int rx,int ry,int rz,
