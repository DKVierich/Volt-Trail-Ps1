name: Lydra World Of Dragon V31.8.1 - Video Intro und Hauptmenue YAML Fix
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Quellprojekt auschecken
      uses: actions/checkout@v4
    - name: Werkzeuge installieren
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build unzip curl ffmpeg python3-pil python3-yaml
    - name: Funktionierende V31.6 FIX2 herunterladen
      shell: bash
      run: |
        set -euo pipefail
        curl -fLsS --retry 4 --retry-delay 2 'https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/8c17f9bc45d1a3e9481ef1eda51da27fd728eee2/.github/workflows/blank-ps1.yml' \
          -o "$RUNNER_TEMP/lydra_v316_base.yml"
        test -s "$RUNNER_TEMP/lydra_v316_base.yml"
    - name: V31.7 Stabiler Einzel-Schritt-Build vorbereiten
      shell: bash
      run: |
        set -euo pipefail
        cat > "$RUNNER_TEMP/lydra_run_base_step.py" <<'LYDRA_BASE_STEP_PY'
        #!/usr/bin/env python3
        """Execute exactly one trusted V31.6 FIX2 build step on this GitHub job runner.

        Important: The outer workflow invokes this script in separate GitHub Actions
        steps, so env additions in GITHUB_ENV are reloaded by GitHub after each step.
        """
        import os, sys, subprocess
        from pathlib import Path
        import yaml

        if len(sys.argv) != 2:
            raise SystemExit('Usage: python3 lydra_run_base_step.py "EXACT STEP NAME"')
        workflow = Path(os.environ['RUNNER_TEMP'])/'lydra_v316_base.yml'
        if not workflow.is_file():
            raise RuntimeError('V31.6 FIX2 baseline workflow missing')
        source=yaml.safe_load(workflow.read_text(encoding='utf-8'))
        steps=source['jobs']['build']['steps']
        wanted=sys.argv[1]
        found=[s for s in steps if s.get('name')==wanted and isinstance(s.get('run'),str)]
        if len(found)!=1:
            raise RuntimeError('Expected exactly one V31.6 step '+repr(wanted)+', got '+str(len(found)))
        print('V31.6 BASIS:',wanted, flush=True)
        subprocess.run(['bash','-euo','pipefail','-c',found[0]['run']],
                       check=True,env=os.environ.copy())
        print('FERTIG:',wanted,flush=True)
        LYDRA_BASE_STEP_PY
        python3 -m py_compile "$RUNNER_TEMP/lydra_run_base_step.py"
    - name: V31.6 Basis | Funktionierende V30.1 Build-Schritte laden
      shell: bash
      run: |
        set -euo pipefail
        python3 "$RUNNER_TEMP/lydra_run_base_step.py" 'Funktionierende V30.1 Build-Schritte laden'
    - name: V31.6 Basis | Stabile V27-Quellkette laden
