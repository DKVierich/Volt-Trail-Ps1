          import os
          import re
          from pathlib import Path

          path = Path(os.environ['PROJECT_DIR']) / 'src/main.c'
          code = path.read_text(encoding='utf-8')

          def replace_once(old, new):
              global code
              n = code.count(old)
              if n != 1:
                  raise RuntimeError(f'V24 anchor expected once, found {n}: {old[:100]!r}')
              code = code.replace(old, new, 1)

