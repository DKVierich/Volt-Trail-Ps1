        \ 1;','return 0;')\nfor token in checks:\n    if token not in old:raise RuntimeError('FIX21 unknown camera logic:\
        \ '+token)\nnew=r\"\"\"/* FIX21: avoid view oscillation when passing house edges. A short\n   grace period preserves\
        \ perspective through minor frame-to-frame occlusions.\n   No camera-yaw, collision, region or save-data changes.\
        \ */\nstatic int vt_v281_camera_obstructed(void) {\n    static int hold_frames=0;\n    static int previous_region=-1;\n\
        \    unsigned int i;\n    int blocked=0;\n    if(previous_region!=region) {\n        previous_region=region;\n\
        \        hold_frames=0;\n    }\n    for(i=0;i<sizeof(vt_v281_houses)/sizeof(vt_v281_houses[0]);i++) {\n     \
        \   const vt_v281_blocker_t *h=&vt_v281_houses[i];\n        int dx=vt_v281_abs(px-h->x);\n        int dz=h->z-pz;\n\
        \        if(h->map_region==region &&\n           dx<h->half+76 &&\n           dz>-CAMERA_Z-h->half && dz<h->half+60)\
        \ {\n            blocked=1;\n            break;\n        }\n    }\n    if(blocked) hold_frames=9;\n    else if(hold_frames>0)hold_frames--;\n\
        \    return hold_frames>0;\n}\"\"\"\ns=s[:a]+new+s[b:]\n\n# House proximity uses the SAME 75% turning and movement\
        \ controls as FIX12.\n# Raise/shorten camera slightly ONLY when the existing house detector is active.\nwanted_pat=r'int\\\
        s+wanted\\s*=\\s*vt_v281_camera_obstructed\\s*\\(\\s*\\)\\s*\\?\\s*35\\s*:\\s*0\\s*;'\ns,n=re.subn(wanted_pat,'int\
        \ wanted = vt_v281_camera_obstructed() ? 52 : 0;',s)\nif n!=1:raise RuntimeError('FIX21 camera house target changed;\
        \ nothing written')\n# FIX21.2: the actual FIX20 camera uses 48 + blend/4, while a separate\n# camera setup assigns\
        \ 62 unconditionally. Never touch that static setup.\n# Some older project variants used blend/2 or blend/3 instead.\
        \ All use one\n# dynamic expression. Retain its existing baseline Y and raise modestly when\n# the obstruction\
        \ hold mode increases the target blend from 35 to 52.\nheight_pat=(r'camera_pos\\.vy\\s*=\\s*'\n            r'(?P<base>48|62)\\\
        s*\\+\\s*'\n            r'(?:\\(\\s*)?vt_v28_camera_blend\\s*/\\s*'\n            r'(?P<divisor>2|3|4)\\s*(?:\\\
        )\\s*)?;')\ncandidates=list(re.finditer(height_pat,s))\nif len(candidates)!=1:\n    current=re.findall(r'camera_pos\\\
        .vy\\s*=\\s*[^;]+;',s)\n    raise RuntimeError('FIX21.2: expected one dynamic camera height; found '+repr(current[:6]))\n\
        match=candidates[0]\n# At target blend=52 this gives +20 camera units instead of the former +13\n# for the FIX20\
        \ 48+blend/4 expression; no change when blend has settled to 0.\nbase=match.group('base')\nnew_height='camera_pos.vy\
        \ = '+base+' + (vt_v28_camera_blend * 2) / 5;'\ns=s[:match.start()]+new_height+s[match.end():]\nassert s.count(new_height)==1\n\
        \n# Preserve older stable source and 75-percent gameplay, including all region portals.\nrequired=('LYDRA_FIX12_GLOBAL_PERCENT\
        \ 75','vt_v281_resolve_movement();',\n          'vt_v281_is_blocked(nx,nz)','vt_v282_house_wall(',\n        \
        \  'vt_v241_building(-175,125,52,1,1);',\n          'no automatic region 0->1 from step count',\n          'no\
        \ automatic region 1->2 from step count',\n          'vt_save_game(void)','vt_load_game(void)',\n          'vt_v31987_ground_rect(','vt_v3194_perf_hud(')\n\
        for token in required:\n    if token not in s:raise RuntimeError('FIX21 inherited feature missing '+token)\n\
        if s.count('static int vt_v281_camera_obstructed(void)')!=1:\n    raise RuntimeError('FIX21 duplicate camera\
        \ routine')\np.write_text(s,encoding='utf-8')\nPath('artifacts').mkdir(exist_ok=True)\nPath('artifacts/KAMERA_FIX21_2_DIAGNOSE.txt').write_text(\n\
        \  'FIX21.2: obstruction retained 9 frames; camera base height preserved and dynamic lift adjusted moderately.\\\
        n'\n  'City/region boundaries, relocated central building, collision, saves, FIX12 75% movement unchanged.\\\
        n'\n  'Only viewing angle/height near houses was modified. Runtime emulator test required.\\n',encoding='utf-8')\n\
        print('FIX21.2: recognized actual 48+blend/4 expression, preserved static 62, cities and 75 percent tempo')\n\
        LYDRA_FIX21_PATCH\npython3 \"$RUNNER_TEMP/lydra_fix21_camera.py\"\n"
