        cat > android/scripts/V21World.gd <<'LWOD_V22_WORLD'
        extends Node

        # Lydra World Of Dragon V23: 32000 x 32000 Welt, chunk-basiertes Wald-Streaming.
        # Kamera, Spielstand, Menues, Figur und Tag/Nacht aus V21 bleiben erhalten.
        const LIMIT := 15950.0
        const WORLD_SIZE := 32000.0
