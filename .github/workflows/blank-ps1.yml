          grep -Fqx 'version/code=18' android/export_presets.cfg
      - name: Godot Ressourcen importieren
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path android --editor --import --quit
          test -s android/scripts/PhoenixMenu.gd
      - name: Skripte zur Laufzeit pruefen
        shell: bash
        run: |
          set -euo pipefail
          # Kurztest des GDScript-Loadings; Fehler brechen den Build ab.
          godot --headless --path android --quit-after 5 > "$RUNNER_TEMP/lwod_v18_test.log" 2>&1 || {
            cat "$RUNNER_TEMP/lwod_v18_test.log"
            exit 1
          }
          cat "$RUNNER_TEMP/lwod_v18_test.log"
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Invalid call\.|Failed to load script' "$RUNNER_TEMP/lwod_v18_test.log"; then
            echo '::error::GDScript oder UI-Fehler im Laufzeittest'
            exit 1
          fi
      - name: Android V18 APK bauen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android
          godot --headless --path android --export-debug 'Android' \
            "$GITHUB_WORKSPACE/build/android/LWOD-Android-V18.apk"
          test -s build/android/LWOD-Android-V18.apk
          unzip -t build/android/LWOD-Android-V18.apk >/dev/null
      - name: Diagnose bei Fehlern hochladen
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: LWOD_V18_FEHLERLOG
          path: ${{ runner.temp }}/lwod_v18_test.log
          if-no-files-found: warn
          retention-days: 14
      - name: APK zum Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: LWOD_ANDROID_V18_PHOENIX_APK
          path: build/android/LWOD-Android-V18.apk
          if-no-files-found: error
          retention-days: 14
