name: Build Volt Trail PS1 V24.2 3D Landschaft

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build unzip curl jq tar \
            ffmpeg python3-pil python3-yaml

      - name: Load working V18 instructions
        shell: bash
        run: |
          set -euo pipefail

          V18_COMMIT="343091814e0c9771e5c885b75377b9af439f746e"

          curl --retry 3 -fsSL \
            "https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/$V18_COMMIT/.github/workflows/blank-ps1.yml" \
            -o "$RUNNER_TEMP/v18-fixed.yml"

          cat > "$RUNNER_TEMP/run_previous_step.py" <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path
          import yaml

          source = Path(os.environ["RUNNER_TEMP"]) / "v18-fixed.yml"
          steps = yaml.safe_load(source.read_text())["jobs"]["build"]["steps"]
          name = sys.argv[1]
          matches = [step for step in steps if step.get("name") == name]
          if len(matches) != 1:
              raise RuntimeError("V18 step missing: " + name)
          print("Running:", name, flush=True)
          subprocess.run(
              ["bash", "-euo", "pipefail", "-c", matches[0]["run"]],
              env=os.environ.copy(), check=True
          )
          PY

          python3 "$RUNNER_TEMP/run_previous_step.py" \
            "Load original V18 build"

      # Each action step reads GITHUB_ENV from the preceding step.
      # PROJECT_DIR is created by Prepare game project and must be
      # available to the following restore steps.
      - name: Prepare V18 game project
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/run_previous_step.py" \
            "Prepare game project"

      - name: Restore V17 intro and gameplay
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PROJECT_DIR:-}" || {
            echo "::error::PROJECT_DIR was not exported"
            exit 1
          }
          python3 "$RUNNER_TEMP/run_previous_step.py" \
            "Restore V17 intro and gameplay"

      - name: Restore V18 dragons and graphics
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/run_previous_step.py" \
            "Restore V18 dragons and graphics"

      - name: Apply working V18 compiler fix
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/run_previous_step.py" \
            "Repair V18 battle menu compiler error"

      - name: Add V19 dragon species and battle effects
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["PROJECT_DIR"]) / "src/main.c"
          code = path.read_text(encoding="utf-8")

          def replace_once(old, new):
              global code
              count = code.count(old)
              if count != 1:
                  raise RuntimeError(
                      "V19 expected one occurrence of " + repr(old[:70])
                      + "; found " + str(count)
                  )
              code = code.replace(old, new, 1)

          replace_once("VOLT TRAIL V18 - %s", "VOLT TRAIL V19 - %s")
          replace_once("VOLT TRAIL V18 - MENUE", "VOLT TRAIL V19 - MENUE")

          dragon_code = r'''
          /* V19: 0 Mosslet, 1 Flamyr, 2 Aquar, 3 Glacir. */
          static int vt_v19_kind = 0;
          static unsigned int vt_v19_mask = 0;

          static const char *vt_v19_name(int kind) {
              switch (kind) {
                  case 1: return "FLAMYR";
                  case 2: return "AQUAR";
                  case 3: return "GLACIR";
                  default: return "MOSSLET";
              }
          }

          static int vt_v19_caught_count(void) {
              unsigned int mask = vt_v19_mask;
              int i;
              int count = 0;
              if (caught_mosslet) mask |= 1u;
              for (i = 0; i < 4; i++) {
                  if (mask & (1u << i)) count++;
              }
              return count;
          }

          static void vt_v19_hit_effect(int x, int z) {
              int wave;
              if (game_mode != 1 || action_flash <= 0) return;
              wave = (30 - action_flash) & 15;

              /* Electrical flashes around the enemy dragon. */
              vt_pyramid(
                  x - 25, -10 - wave, z - 23,
                  6, 22, 250, 228, 54
              );
              vt_pyramid(
                  x + 23, -19 + wave, z - 27,
                  6, 18, 94, 219, 251
              );
              vt_pyramid(
                  x, -31, z - 31,
                  5 + wave / 4, 13, 255, 247, 138
              );
          }

          static void vt_v19_wild_dragon(int x, int z, int kind) {
              int r = 62;
              int g = 172;
              int b = 92;
              int flap = (vt_v18_tick / 7) & 1;

              if (kind == 1) {
                  r = 225; g = 87; b = 46;
              } else if (kind == 2) {
                  r = 61; g = 139; b = 221;
              } else if (kind == 3) {
                  r = 135; g = 216; b = 232;
              }

              /* Body, neck, dragon head and long muzzle. */
              draw_box(x, 23, z, 15, r, g, b);
              draw_box(x, 5, z - 8, 10, r, g, b);
              draw_box(x, -7, z - 16, 12, r, g, b);
              draw_box(x, -5, z - 29, 6, r, g, b);
              vt_dragon_eyes(x, -10, z - 31, 7);

              /* Horns and two animated wings. */
              vt_pyramid(x - 9, -16, z - 12,
                         6, 22, r, g, b);
              vt_pyramid(x + 9, -16, z - 12,
                         6, 22, r, g, b);
              vt_dragon_wing(x, z, -1, 39,
                             flap ? 9 : -1, r, g, b);
              vt_dragon_wing(x, z, 1, 39,
                             flap ? -1 : 9, r, g, b);

              /* Long tail, feet and pointed spikes. */
              draw_box(x + 12, 23, z + 23, 9, r, g, b);
              draw_box(x + 17, 18, z + 36, 6, r, g, b);
              vt_pyramid(x + 19, 17, z + 42,
                         8, 19, r, g, b);
              draw_box(x - 10, 39, z, 6, r, g, b);
              draw_box(x + 10, 39, z, 6, r, g, b);

              vt_v19_hit_effect(x, z);
          }
          '''

          # Keep all original dragon and menu functions in place.
          replace_once(
              "static void vt_sparkit(int x, int z) {",
              dragon_code + "\nstatic void vt_sparkit(int x, int z) {"
          )

          # Pick different species for wild encounters, without
          # modifying how trainer and arena fights work.
          replace_once(
              "                encounter++;",
              "                encounter++;\n"
              "                vt_v19_kind = (encounter + region) & 3;"
          )

          # Wild encounters use the species-specific 3D model.
          call_pattern = (
              r"vt_mosslet\s*\(\s*px\s*-\s*38\s*,\s*"
              r"pz\s*\+\s*135\s*,\s*encounter_kind\s*\);"
          )
          replacement = (
              "if (encounter_kind == 0) {\n"
              "                      vt_v19_wild_dragon(\n"
              "                          px - 38, pz + 135, vt_v19_kind\n"
              "                      );\n"
              "                  } else {\n"
              "                      vt_mosslet(\n"
              "                          px - 38, pz + 135, encounter_kind\n"
              "                      );\n"
              "                  }"
          )
          code, count = re.subn(call_pattern, replacement, code)
          if count != 1:
              raise RuntimeError("Wild dragon drawing call missing")

          # Keep special enemy labels for trainers and leaders.
          replace_once(
              '"TRAINER" : "MOSSLET");',
              '"TRAINER" : vt_v19_name(vt_v19_kind));'
          )

          # Record successful captures without overwriting the
          # older Mosslet quest and Memory Card format.
          replace_once(
              "if (encounter_kind==0) caught_mosslet=1;",
              "if (encounter_kind==0) {\n"
              "                        vt_v19_mask |= 1u << vt_v19_kind;\n"
              "                        if (vt_v19_kind == 0) caught_mosslet=1;\n"
              "                    }"
          )

          # Display the true total number of captured species.
          if code.count("1 + caught_mosslet") < 2:
              raise RuntimeError("Team-counter anchors missing")
          code = code.replace(
              "1 + caught_mosslet", "1 + vt_v19_caught_count()"
          )

          # Monster menu: show all collected dragon species.
          team_pattern = r'(?m)^(\s*)FntPrint\(\s*2,\s*"TEAM: %d MONSTER\\n"'
          match = re.search(team_pattern, code)
          if not match:
              raise RuntimeError("Monster submenu missing")
          indent = match.group(1)
          new_lines = (
              'FntPrint(\n'
              '    2, "FLAMYR:%s AQUAR:%s\\n",\n'
              '    (vt_v19_mask & 2u) ? "JA" : "NEIN",\n'
              '    (vt_v19_mask & 4u) ? "JA" : "NEIN"\n'
              ');\n'
              'FntPrint(\n'
              '    2, "GLACIR:%s\\n",\n'
              '    (vt_v19_mask & 8u) ? "JA" : "NEIN"\n'
              ');\n'
          )
          new_lines = "\n".join(
              indent + line if line else line
              for line in new_lines.rstrip("\n").split("\n")
          ) + "\n"
          code = code[:match.start()] + new_lines + code[match.start():]

          # Store an extension in the unused part of the original
          # PS1 save block. The original checksum and its first 19
          # words remain unchanged, so V17/V18 saves still load.
          replace_once(
              "words[18] = vt_save_checksum(words);",
              "words[18] = vt_save_checksum(words);\n"
              "              words[19] = 0x56313944u;\n"
              "              words[20] = vt_v19_mask | (caught_mosslet ? 1u : 0u);\n"
              "              words[21] = words[19] ^ words[20] ^ 0xa592c3d6u;"
          )

          replace_once(
              "caught_mosslet = (int)w[7];",
              "caught_mosslet = (int)w[7];\n"
              "              if (w[19] == 0x56313944u &&\n"
              "                  w[21] == (w[19] ^ w[20] ^ 0xa592c3d6u) &&\n"
              "                  (w[20] & ~15u) == 0) {\n"
              "                  vt_v19_mask = w[20];\n"
              "              } else {\n"
              "                  vt_v19_mask = caught_mosslet ? 1u : 0u;\n"
              "              }"
          )

          required = [
              "VOLT TRAIL V19", "vt_v19_wild_dragon(",
              "vt_v19_hit_effect(", "vt_v19_caught_count(",
              "vt_save_game(void)", "vt_load_game(void)",
              "InitCARD(1);", "vt_menu_open",
              "vt_play_intro();", "PAD_SQUARE", "PAD_CIRCLE"
          ]
          for marker in required:
              if marker not in code:
                  raise RuntimeError("Missing V19 feature: " + marker)

          path.write_text(code, encoding="utf-8")
          print("V19 ready: Flamyr, Aquar and Glacir added")
          print("Battle lightning effects added")
          print("Old saves remain compatible")
          print("V18 controller, intro, quests and menu preserved")
          PY

      - name: Add V20 Dragon Codex and elemental battles
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          path=Path(os.environ['PROJECT_DIR'])/'src/main.c'
          code=path.read_text(encoding='utf-8')

          def replace_once(old,new):
           global code
           n=code.count(old)
           if n!=1: raise RuntimeError(f'V20 marker mismatch {old[:85]!r}: {n}')
           code=code.replace(old,new,1)

          replace_once('VOLT TRAIL V19 - %s','VOLT TRAIL V20 - %s')
          replace_once('VOLT TRAIL V19 - MENUE','VOLT TRAIL V20 - MENUE')

          # World state for the codex: four wild species, plus starter/evolution
          replace_once('static unsigned int vt_v19_mask = 0;', '''static unsigned int vt_v19_mask = 0;

          /* Discoveries and the chosen battle dragon. */
          static unsigned int vt_v20_seen_mask = 0;
          static int vt_v20_active_dragon = 0;
          static int vt_v20_menu_dragon = 0;
          static int vt_v20_attack_timer = 0;
          static int vt_v20_attack_kind = 0;
          '''.rstrip())

          helpers=r'''
          /* Dragon slots: 0 starter, 1 Mosslet, 2 Flamyr, 3 Aquar, 4 Glacir. */
          static const char *vt_v20_dragon_name(int slot) {
              switch (slot) {
                  case 0: return evolved ? "VOLTIGON" : "SPARKIT";
                  case 1: return "MOSSLET";
                  case 2: return "FLAMYR";
                  case 3: return "AQUAR";
                  case 4: return "GLACIR";
                  default: return "UNBEKANNT";
              }
          }

          static int vt_v20_owned(int slot) {
              if (slot == 0) return 1;
              if (slot < 1 || slot > 4) return 0;
              if (slot == 1 && caught_mosslet) return 1;
              return (vt_v19_mask & (1u << (slot - 1))) != 0;
          }

          static const char *vt_v20_entry(int species) {
              unsigned int bit;
              if (species == 0) return "GEFANGEN"; /* Starter Sparkit */
              if (species == 1) return evolved ? "GEFANGEN" : "???";
              if (species < 2 || species > 5) return "???";
              bit = 1u << (species - 2);
              if (vt_v19_mask & bit) return "GEFANGEN";
              if (species == 2 && caught_mosslet) return "GEFANGEN";
              if (vt_v20_seen_mask & bit) return "GESEHEN";
              return "???";
          }

          static const char *vt_v20_entry_name(int species) {
              if (species == 0) return "SPARKIT";
              if (species == 1) return evolved ? "VOLTIGON" : "???";
              if (!(vt_v20_seen_mask & (1u << (species - 2))) &&
                  !vt_v20_owned(species - 1)) return "???";
              switch (species) {
                  case 2: return "MOSSLET";
                  case 3: return "FLAMYR";
                  case 4: return "AQUAR";
                  case 5: return "GLACIR";
              }
              return "???";
          }

          static void vt_v20_next_dragon(void) {
              int try_slot;
              int slot;
              for (try_slot = 1; try_slot <= 5; try_slot++) {
                  slot = (vt_v20_active_dragon + try_slot) % 5;
                  if (vt_v20_owned(slot)) {
                      vt_v20_active_dragon = slot;
                      return;
                  }
              }
          }

          /* Each selected dragon has its own elemental attack. */
          static int vt_v20_attack_damage(void) {
              int damage = evolved ? 13 :
                  (companion_level >= enemy_level ? 10 : 7);
              int slot = vt_v20_active_dragon;
              if (slot == 1) damage = 8 + companion_level / 2;  /* Leaf */
              if (slot == 2) damage = 10 + companion_level / 2; /* Fire */
              if (slot == 3) damage = 9 + companion_level / 2;  /* Water */
              if (slot == 4) damage = 9 + companion_level / 2;  /* Ice */

              /* Simple first elemental advantages against wild dragons. */
              if (encounter_kind == 0) {
                  if ((slot == 0 && vt_v19_kind == 2) ||
                      (slot == 1 && vt_v19_kind == 2) ||
                      (slot == 2 && vt_v19_kind == 3) ||
                      (slot == 3 && vt_v19_kind == 1) ||
                      (slot == 4 && vt_v19_kind == 2)) damage += 4;
              }
              return damage;
          }

          static void vt_v20_element_effect(int x, int z) {
              int t = vt_v20_attack_timer;
              int r = 255, g = 221, b = 58;
              int i;
              if (!t || game_mode != 1 || vt_menu_open) return;
              if (vt_v20_attack_kind == 1) {r=68; g=202; b=98;}
              if (vt_v20_attack_kind == 2) {r=247; g=88; b=35;}
              if (vt_v20_attack_kind == 3) {r=50; g=158; b=247;}
              if (vt_v20_attack_kind == 4) {r=162; g=235; b=252;}
              for (i = 0; i < 4; i++) {
                  int side = (i & 1) ? 1 : -1;
                  int rise = ((20 - t + i * 3) & 15);
                  vt_pyramid(x + side * (9 + i * 9),
                             -13 - rise, z - 15 - i * 4,
                             5 + (i & 1) * 2, 12 + rise,
                             r, g, b);
              }
          }
          '''
          # Existing V19 render code is defined before draw_hud. Add V20 code
          # after V17 menu state and all 3D helper function declarations.
          replace_once('static void draw_hud(void) {',helpers+'\nstatic void draw_hud(void) {')

          # Register observations at the moment a battle begins. This includes
          # NPC trainers/arena, whose current models are Mosslet variants.
          kind_marker='vt_v19_kind = (encounter + region) & 3;'
          if code.count(kind_marker)!=1: raise RuntimeError('Encounter marker missing')
          start=code.index(kind_marker)
          end=code.find('game_mode=1;',start,start+1800)
          if end<0: raise RuntimeError('Battle-entry point missing')
          code=code[:end]+('game_mode=1;\n'
           '                if (encounter_kind == 0) {\n'
           '                    vt_v20_seen_mask |= 1u << vt_v19_kind;\n'
           '                } else {\n'
           '                    /* NPC battle: the displayed opponent is a Mosslet. */\n'
           '                    vt_v20_seen_mask |= 1u;\n'
           '                }')+code[end+len('game_mode=1;'):]

          # Make the companion visibly change when the user chooses a captured dragon.
          pattern=r'vt_sparkit\s*\(\s*px\s*\+\s*26\s*,\s*pz\s*\+\s*105\s*\);'
          replacement='''if (vt_v20_active_dragon == 0) {
                            vt_sparkit(px + 26, pz + 105);
                        } else {
                            vt_v19_wild_dragon(px + 26, pz + 105,
                                               vt_v20_active_dragon - 1);
                        }'''
          code,n=re.subn(pattern,replacement,code)
          if n!=1: raise RuntimeError(f'Companion draw marker missing: {n}')
          # Keep Voltigon's extra horn only while Voltigon is the selected dragon.
          loc=code.index('vt_v20_active_dragon - 1);')
          p=code.find('if (evolved) {',loc,loc+700)
          if p!=-1:code=code[:p]+'if (evolved && vt_v20_active_dragon == 0) {'+code[p+len('if (evolved) {'):]

          # Distinct element damage and animation, without altering battle buttons.
          pattern=r'int damage\s*=\s*evolved\s*\?\s*13\s*:\s*\(companion_level\s*>=\s*enemy_level\s*\?\s*10\s*:\s*7\);'
          main_begin = code.index('int main(void) {')
          combat_code = code[main_begin:]
          combat_code,n=re.subn(pattern,('int damage = vt_v20_attack_damage();\n'
           '                vt_v20_attack_timer = 24;\n'
           '                vt_v20_attack_kind = vt_v20_active_dragon;'),combat_code)
          if n!=1:raise RuntimeError(f'Elemental battle attack location missing: {n}')
          code=code[:main_begin]+combat_code
          replace_once('        vt_v18_tick++;',
                       '        vt_v18_tick++;\n'
                       '        if (vt_v20_attack_timer > 0) vt_v20_attack_timer--;')
          # Show effect after the landscape draws.
          replace_once('        vt_v18_battle_bars();',
                       '        vt_v20_element_effect(px - 38, pz + 135);\n'
                       '        vt_v18_battle_bars();')

          # Always allow quick dragon-switch in battle without replacing X/O/Square.
          key='        previous_pad = pad;'
          replace_once(key,key+'''\n
                  if (game_mode == 1 && !vt_menu_open &&
                      (pressed & PAD_L1)) {
                      vt_v20_next_dragon();
                      pressed &= ~PAD_L1;
                  }
          ''')

          # Save codex seen states and the active dragon in an independent extension
          # to existing V17/V18/V19 block. First 22 words stay unchanged for compatibility.
          replace_once('words[21] = words[19] ^ words[20] ^ 0xa592c3d6u;',
          '''words[21] = words[19] ^ words[20] ^ 0xa592c3d6u;
                        words[22] = 0x5632304bu;
                        words[23] = (vt_v20_seen_mask | vt_v19_mask |
                                      (caught_mosslet ? 1u : 0u)) & 15u;
                        words[24] = (uint32_t)vt_v20_active_dragon;
                        words[25] = words[22] ^ words[23] ^ words[24] ^ 0xdec0de20u;''')
          # Restore V19 block first; insert the V20 addendum immediately after V19
          # validation branch to avoid overriding old saves.
          old='vt_v19_mask = caught_mosslet ? 1u : 0u;'
          pos=code.index(old)
          brace=code.find('}',pos,pos+180)
          if brace<0:raise RuntimeError('V19 load extension end missing')
          load_extra='''
                        if (w[22] == 0x5632304bu &&
                            w[25] == (w[22] ^ w[23] ^ w[24] ^ 0xdec0de20u) &&
                            (w[23] & ~15u) == 0 && w[24] <= 4) {
                            vt_v20_seen_mask = w[23];
                            vt_v20_active_dragon = (int)w[24];
                        } else {
                            /* Older saves: known captures are discovered. */
                            vt_v20_seen_mask = vt_v19_mask |
                                (caught_mosslet ? 1u : 0u);
                            vt_v20_active_dragon = 0;
                        }
                        vt_v20_seen_mask |= vt_v19_mask |
                            (caught_mosslet ? 1u : 0u);
                        if (!vt_v20_owned(vt_v20_active_dragon))
                            vt_v20_active_dragon = 0;
          '''
          code=code[:brace+1]+load_extra+code[brace+1:]

          # Revise only the rendered menu in draw_hud.
          hud_start=code.index('static void draw_hud(void) {')
          menu_start=code.index('if (vt_menu_open) {',hud_start)
          menu_end=code.index('FntFlush(0);',menu_start)
          menu=code[menu_start:menu_end]
          if 'DRACHEN-MENUE' not in menu:raise RuntimeError('V19 main menu missing')
          if '"%c MONSTER\\n\\n"' not in menu:raise RuntimeError('Monster menu label mismatch')

          # Shift the four existing menu rows down one slot.
          shifts=[]
          def shift_choice(m):
           shifts.append(m.group(1))
           return 'vt_menu_choice == '+str(int(m.group(1))+1)
          menu=re.sub(r'vt_menu_choice\s*==\s*([0-3])',shift_choice,menu)
          if sorted(shifts)!=['0','1','2','3']:
           raise RuntimeError('Unexpected main menu selections: '+repr(shifts))
          line=menu.index('"%c MONSTER\\n\\n"')
          beg=menu.rfind('FntPrint(',0,line)
          if beg<0:raise RuntimeError('Monster row call not found')
          codex_row='''FntPrint(
                                    2, "%c DRACHEN KODEX\\n\\n",
                                    vt_menu_choice == 0 ? '>' : ' '
                                );
                                '''
          menu=menu[:beg]+codex_row+menu[beg:]

          # A separate codex page, always the first item.
          if_marker='} else if (vt_menu_page == 1) {'
          if menu.count(if_marker)!=1:raise RuntimeError('Monster-page start marker changed')
          codex_page='''} else if (vt_menu_page == 4) {
                                FntPrint(2, "DRACHEN KODEX\\n\\n");
                                FntPrint(2, "SPARKIT: GEFANGEN\\n");
                                FntPrint(2, "%s: %s\\n",
                                    vt_v20_entry_name(1), vt_v20_entry(1));
                                FntPrint(2, "%s: %s\\n",
                                    vt_v20_entry_name(2), vt_v20_entry(2));
                                FntPrint(2, "%s: %s\\n",
                                    vt_v20_entry_name(3), vt_v20_entry(3));
                                FntPrint(2, "%s: %s\\n",
                                    vt_v20_entry_name(4), vt_v20_entry(4));
                                FntPrint(2, "%s: %s\\n\\n",
                                    vt_v20_entry_name(5), vt_v20_entry(5));
                                FntPrint(2, "GESEHEN / GEFANGEN / ???\\n");
