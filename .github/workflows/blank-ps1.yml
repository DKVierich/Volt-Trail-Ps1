          code=code[:a]+switch_code+code[b:]

          helpers=r'''
          /* V23: Keep the selected, living dragon at the front of the team.
           * If the active dragon has 0 HP outside battle, use a living teammate.
           * Never heal a KO dragon or force a dead dragon to follow the player. */
          static void vt_v23_check_field_leader(void) {
              int species;
              int position;

              if (game_mode != 0 || vt_v21_force_switch) return;
              vt_v21_setup();
              if (vt_v21_count <= 0 || vt_v21_active < 0 ||
                  vt_v21_active >= vt_v21_count) return;

              species = vt_v21_party[vt_v21_active];
              if (species < 0 || species > 4) return;

              if (companion_hp > 0) return;

              vt_v21_hp[species] = 0;
              companion_hp = 0;

              /* Prefer an available living dragon, including a healed teammate. */
              for (position = 0; position < vt_v21_count; position++) {
                  if (position != vt_v21_active && vt_v21_can_switch_to(position)) {
                      vt_v21_switch_to(position);
                      return;
                  }
              }
              /* Everyone is at 0 HP: the player walks without a dragon until healed. */
          }

          /* Return -1 when no living companion should be drawn in the overworld. */
          static int vt_v23_field_dragon(void) {
              if (!vt_v21_ready || vt_v21_count < 1 ||
                  vt_v21_active < 0 || vt_v21_active >= vt_v21_count ||
                  companion_hp <= 0) return -1;
              return vt_v21_party[vt_v21_active];
          }
          '''
          once('static void vt_v22_knockout(void) {',helpers+'\nstatic void vt_v22_knockout(void) {')

          # This is the frame boundary just before the 3-D scene is rendered in V22.
          once('        vt_v21_post_frame();',
               '        vt_v21_post_frame();\n'
               '        vt_v23_check_field_leader();')

          # Use the actual chosen team member for overworld and battle companion geometry.
          # A 0 HP follower is intentionally omitted (never appear next to the trainer).
          render_pattern = re.compile(
              r'if\s*\(\s*vt_v20_active_dragon\s*==\s*0\s*\)\s*\{'
              r'\s*vt_sparkit\s*\(\s*px\s*\+\s*26\s*,\s*pz\s*\+\s*105\s*\)\s*;'
              r'\s*\}\s*else\s*\{'
              r'\s*vt_v19_wild_dragon\s*\(\s*px\s*\+\s*26\s*,\s*pz\s*\+\s*105\s*,'
              r'\s*vt_v20_active_dragon\s*-\s*1\s*\)\s*;'
              r'\s*\}', re.M)
          replace_render=r'''{
                      int field_dragon = vt_v23_field_dragon();
                      if (field_dragon == 0) {
                          vt_sparkit(px + 26, pz + 105);
                      } else if (field_dragon > 0) {
                          vt_v19_wild_dragon(px + 26, pz + 105,
                                             field_dragon - 1);
                      }
                  }'''
          code,n=render_pattern.subn(lambda m:replace_render,code)
          if n!=1:raise RuntimeError(f'V23 active follower drawing location not found uniquely: {n}')

          # The additional Voltigon evolution spike belongs only to the displayed dragon.
          # Otherwise KO Voltigon would still appear as a floating piece in the field.
          spike_pat=re.compile(r'if\s*\(\s*evolved\s*&&\s*vt_v20_active_dragon\s*==\s*0\s*\)')
          code,n=spike_pat.subn('if (evolved && vt_v23_field_dragon() == 0)',code)
          if n > 1:raise RuntimeError(f'V23 ambiguous evolution render anchors: {n}')

          required=['VOLT TRAIL V23','vt_v23_check_field_leader();',
                    'vt_v23_field_dragon();','vt_v21_party[0] = new_species;',
                    'vt_v22_knockout();','vt_v22_heal_selected(vt_v21_team_cursor)',
                    'vt_save_game(void)','vt_load_game(void)','InitCARD(1);',
                    'PAD_CROSS','PAD_SQUARE','PAD_TRIANGLE','vt_play_intro();']
          for needle in required:
              if needle not in code:raise RuntimeError('V23 expected feature missing: '+needle)
          path.write_text(code,encoding='utf-8')
          print('V23: Selected living dragon moves to front of party')
          print('V23: Overworld and battle render the selected active dragon')
          print('V23: KO dragon at 0 HP is never drawn as the follower')
          print('V23: If another party dragon is healthy, switch to it in the field')
          print('V23: When all dragons are KO the player has no companion until healed')
          print('V23: Intro, controls, fights, party HP and save files preserved')
          PY

      - name: Expand V24 world and improve retro adventure graphics
