
# LWOD FIX36 HD - korrigierter Compileraufbau
# Nicht automatisch uebersetzen lassen.
name: LWOD FIX36 HD - PS1 SDK Reparatur

'on':
  workflow_dispatch:
    inputs:
      video_width:
        description: "PS1 Grafikbreite (640 Test / 320 stabil)"
        required: true
        default: "640"
        type: choice
        options: ["640", "320"]
  push:
    branches: [main]
    paths:
      - .github/workflows/blank-ps1.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LWOD_VIDEO_WIDTH: ${{ github.event.inputs.video_width || '640' }}

    steps:
      - name: Quellprojekt laden
        uses: actions/checkout@v4

      - name: Buildwerkzeuge installieren
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build unzip curl ffmpeg python3-pil python3-yaml

      - name: FIX35R-Patch aus festem GitHub-Stand laden
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            'https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/fc0906e7faf760b13e8a683d44925268d4b3e696/.github/workflows/blank-ps1.yml' \
            -o "$RUNNER_TEMP/lwod_fix35r_pinned.yml"
          python3 - <<'PY'
          import os,yaml,hashlib
          from pathlib import Path
          file=Path(os.environ['RUNNER_TEMP'])/'lwod_fix35r_pinned.yml'
          raw=file.read_bytes()
          digest=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert digest=='8eeec1f6ef32e9d79ab20e6ca520baa7fee6e750', 'Vorlage unvollstaendig oder veraendert'
          steps=yaml.safe_load(raw)['jobs']['build']['steps']
          assert len(steps)==62, ('Schrittzahl unerwartet',len(steps))
          print('FIX35R-Vorlage unveraendert geladen:',len(steps),'Schritte')
          PY
          cat > "$RUNNER_TEMP/lwod_fix36_replay.py" <<'PY'
          import os,sys,yaml,subprocess
          from pathlib import Path
          src=Path(os.environ['RUNNER_TEMP'])/'lwod_fix35r_pinned.yml'
          steps=yaml.safe_load(src.read_bytes())['jobs']['build']['steps']
          name=sys.argv[1]
          matches=[s for s in steps if s.get('name')==name and isinstance(s.get('run'),str)]
          if len(matches)!=1: raise SystemExit('Buildschritt fehlt oder mehrfach: '+name)
          subprocess.run(['bash','-euo','pipefail','-c',matches[0]['run']],check=True)
          PY

      - name: FIX32 Basis vorbereiten
        run: python3 "$RUNNER_TEMP/lwod_fix36_replay.py" 'Originalschritte herunterladen und pruefen'

      - name: PS1 Basis 03
        run: python3 "$RUNNER_TEMP/lwod_run.py" 3
      - name: PS1 Basis 04
        run: python3 "$RUNNER_TEMP/lwod_run.py" 4
      - name: PS1 Basis 05
        run: python3 "$RUNNER_TEMP/lwod_run.py" 5
      - name: PS1 Basis 06
        run: python3 "$RUNNER_TEMP/lwod_run.py" 6
