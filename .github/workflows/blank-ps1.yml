        from pathlib import Path
        import re, os
        B=Path('android/scripts')
        Q=Path('android/tests')
        
        def once(s,a,b):
            assert s.count(a)==1, f'FIX41 source anchor {s.count(a)}: {a[:110]}'
            return s.replace(a,b,1)
        
        def edit(name,fn):
            p=B/name
            p.write_text(fn(p.read_text(encoding='utf-8')),encoding='utf-8')
        
        def landmarks(s):
            # Remove the exact former 4 pillars and oversized floating lintel at the source.
            pat=r'(?ms)^    elif id == "Ruine":\n.*?(?=^    elif |^    return root)'
            m=re.search(pat,s)
            assert m and '_block(' in m[0], 'FIX41: original ruin branch not found'
            s,n=re.subn(pat,'''    elif id == "Ruine":
                var castle := preload("res://scripts/V441Castle.gd").new()
                root.add_child(castle)
                castle.setup(game,terrain)
        ''',s,count=1)
            assert n==1
            return s
        edit('V417Landmarks.gd',landmarks)
        
        def motion(s):
            anchor='func _floor_at(p: Vector3) -> float:\n'
            return once(s,anchor,anchor+'''    if is_instance_valid(terrain) and V441Layout.in_dungeon(terrain,p):
                return V441Layout.dungeon_floor(terrain,p)
        ''')+'\nconst V441Layout = preload("res://scripts/V441Layout.gd")\n'
        edit('V31TerrainMotion.gd',motion)
        
        def fusion(s):
            anchor='func toggle_fusion() -> void:\n    if not _playing():\n        return\n'
            return once(s,anchor,anchor+'''    var v441_actor: CharacterBody3D = game.get("hero") as CharacterBody3D
            var v441_terrain: Node = game.get_node_or_null("V27ContinuousTerrain")
            if is_instance_valid(v441_actor) and is_instance_valid(v441_terrain) and V441Layout.in_dungeon(v441_terrain,v441_actor.global_position):
                return # Flight is not available in the underground rooms.
        ''')+'\nconst V441Layout = preload("res://scripts/V441Layout.gd")\n'
        edit('V414Fusion.gd',fusion)
        # FIX42: the actual camera controller owns the indoor view as well. No second writer.
        p=B/'V27CameraMap.gd'
        s=p.read_text(encoding='utf-8')
        anchor='func _physics_process(delta: float) -> void:\n'
        s=once(s,anchor,anchor+"""    if _v442_indoor_camera():
                return
        """)
        s += r'''
        const V441Layout = preload("res://scripts/V441Layout.gd")
        var v442_indoor_active: bool = false
        var v442_previous_env: Environment
        var v442_dark_env: Environment
        
        func _v442_indoor_camera() -> bool:
            if not is_instance_valid(game):
                return false
            var cam: Camera3D = game.get("camera_node") as Camera3D
            var actor: CharacterBody3D = game.get("hero") as CharacterBody3D
            if not is_instance_valid(cam):
                return false
            var indoors: bool = int(game.get("state"))==2 and is_instance_valid(actor) and is_instance_valid(terrain) and V441Layout.in_dungeon(terrain,actor.global_position)
            if not indoors:
                if v442_indoor_active:
                    cam.environment = v442_previous_env
                    v442_previous_env = null
                    v442_indoor_active = false
                return false
            if not v442_indoor_active:
                v442_previous_env = cam.environment
                if v442_dark_env==null:
                    v442_dark_env = Environment.new()
                    v442_dark_env.background_mode = Environment.BG_COLOR
                    v442_dark_env.background_color = Color("#211a15")
                    v442_dark_env.ambient_light_source = Environment.AMBIENT_SOURCE_COLOR
                    v442_dark_env.ambient_light_color = Color("#b7a28a")
                    v442_dark_env.ambient_light_energy = 0.30
                cam.environment = v442_dark_env
                v442_indoor_active = true
            V441Layout.dungeon_camera(actor,cam,yaw_offset,pitch)
            return true
        '''
        p.write_text(s,encoding='utf-8')
        print('FIX42 indoor camera branch installed')
        # Old decoration exclusion was 160 m around Ruine, covering entire 128 x 144 m castle.
        # Preserve it, existing map / teleporter / landscape and the old streaming fixes.
