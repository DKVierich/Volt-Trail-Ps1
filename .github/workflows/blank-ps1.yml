      - name: Apply V24.1 camera background villages and roads fixed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          source = Path(os.environ['PROJECT_DIR']) / 'src/main.c'
          code = source.read_text(encoding='utf-8')

          def once(old, new):
              global code
              n=code.count(old)
              if n != 1:
                  raise RuntimeError('V24.1 marker unexpected: %r count=%d' % (old[:80], n))
              code=code.replace(old,new,1)

          def function_range(s, name):
              pat = r'\bstatic\s+void\s+' + re.escape(name) + r'\s*\([^;]*?\)\s*\{'
              ms = list(re.finditer(pat,s))
              if len(ms) != 1: raise RuntimeError('Function '+name+' count='+str(len(ms)))
              a=ms[0].start(); op=s.index('{',a); depth=0
              quote=None; escape=False; block=False; line=False
              i=op
              while i<len(s):
                  c=s[i]; nextc=s[i+1] if i+1<len(s) else ''
                  if line:
                      if c=='\n':line=False
                  elif block:
                      if c=='*' and nextc=='/':block=False;i+=1
                  elif quote:
                      if escape: escape=False
                      elif c=='\\':escape=True
                      elif c==quote:quote=None
                  elif c=='/' and nextc=='/':line=True;i+=1
                  elif c=='/' and nextc=='*':block=True;i+=1
                  elif c in '"\'':quote=c
                  elif c=='{':depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0:return a,i+1
                  i+=1
              raise RuntimeError('Unclosed function '+name)

          once('VOLT TRAIL V24 - %s','VOLT TRAIL V24.1 - %s')
          once('VOLT TRAIL V24 - MENUE','VOLT TRAIL V24.1 - MENUE')
          once('#define WORLD_LIMIT 1600','#define WORLD_LIMIT 2100')
          once('#define CAMERA_Z 190','#define CAMERA_Z 255')
          # The V23/V24 source may format the camera initializer differently.
          # CAMERA_Z was already increased above. Modify the camera height
          # only if a compatible declaration is actually present.
          camera_re = re.compile(
              r'(\b(?:VECTOR|SVECTOR)\s+camera_pos\s*=\s*\{\s*0\s*,\s*)'
              r'[-+]?\d+(\s*,\s*CAMERA_Z\b)'
          )
          code, camera_count = camera_re.subn(
              lambda match: match.group(1) + '-28' + match.group(2),
              code
          )
          if camera_count > 1:
              raise RuntimeError('Ambiguous camera declarations')
          if camera_count == 0:
              print('Camera height unchanged; wider CAMERA_Z=255 is applied.')
          else:
              print('Camera height adjusted for the wider view.')
          # The V23 source may set RGB colors on one line, several lines,
          # or use different starting values. Change only existing DRAWENV fields.
          # Never make a cosmetic sky-color change block the entire build.
          for i in (0, 1):
              count = 0
              for channel, value in (('r0', 24), ('g0', 53), ('b0', 102)):
                  pattern = re.compile(
                      r'(\bdraw\s*\[\s*' + str(i) + r'\s*\]\s*\.\s*'
                      + channel + r'\s*=\s*)\d+(\s*;)'
                  )
                  code, replaced = pattern.subn(
                      lambda m, v=value: m.group(1) + str(v) + m.group(2),
                      code, count=1
                  )
                  count += replaced
              if count not in (0, 3):
                  print('NOTICE: Only', count, 'color channels found for DRAWENV', i)
              elif count == 0:
                  print('NOTICE: DRAWENV', i, 'uses another background setup; keeping it.')
              else:
                  print('DRAWENV', i, 'background color updated.')

          new_helpers = r'''
          /* V24.1 scene details: draw only places near the player to preserve PS1 RAM/GPU time. */
          static int vt_v241_visible(int x, int z, int distance) {
              int dx=x-px;
