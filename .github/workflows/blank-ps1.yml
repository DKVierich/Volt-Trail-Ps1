    - name: FIX16.1 Braune Baumkloetze korrekt aendern
      shell: bash
      run: "set -euo pipefail\npython3 - <<'LYDRA_FIX16_PATCH'\nimport os,re\nfrom pathlib import Path\np=Path(os.environ['PROJECT_DIR'])/'src/main.c'\ns=p.read_text(encoding='utf-8')\n# FIX16 modifies only the low-poly tree trunk; leaves canopy, placement and physics alone.\npat=r'\\bstatic\\s+void\\s+vt_v24_tree\\s*\\([^;]*?\\)\\s*\\{'\nhits=list(re.finditer(pat,s,re.S))\nif len(hits)!=1:raise RuntimeError('FIX16: expected exactly one tree model')\na=hits[0].start();i=hits[0].end();depth=1\nwhile i<len(s) and depth:\n    if s[i]=='{':depth+=1\n    elif s[i]=='}':depth-=1\n    i+=1\nif depth:raise RuntimeError('FIX16: tree body not closed')\nbody=s[a:i]\noriginal_body=body\nold=r'draw_box\\s*\\(\\s*x\\s*,\\s*14\\s*,\\s*z\\s*,\\s*9\\s*\\+\\s*scale\\s*/\\s*6\\s*,\\s*96\\s*,\\s*62\\s*,\\s*38\\s*\\)\\s*;'\nnew='/* FIX16: slimmer earthy trunk; same draw calls and leaf geometry. */\\n    draw_box(x,14,z,5+scale/10,83,64,45);'\nbody,n=re.subn(old,new,body,count=1)\nif n!=1:raise RuntimeError('FIX16: old tree trunk geometry was not recognized')\nif body.count('vt_pyramid(')!=original_body.count('vt_pyramid(') or body.count('draw_box(')!=original_body.count('draw_box('):\n    raise RuntimeError('FIX16.1: tree crowns or draw calls unexpectedly changed')\ns=s[:a]+body+s[i:]\nfor marker in ('LYDRA_FIX12_GLOBAL_PERCENT 75', 'vt_v31987_ground_rect(',\n               'vt_v319881_solid_quad(', 'vt_v24_draw_overworld(',\n               'vt_v300_horizon(', 'vt_v3194_perf_hud(',\n               'vt_save_game(void)', 'vt_load_game(void)'):\n    if marker not in s:raise RuntimeError('FIX16: missing stable feature '+marker)\nif 'for(i=0;i<14;i++)' not in s:raise RuntimeError('FIX16: FIX14 horizon missing')\np.write_text(s,encoding='utf-8')\nPath('artifacts').mkdir(exist_ok=True)\nPath('artifacts/BAUM_FIX16_DIAGNOSE.txt').write_text(\n    'V31.9.9.1 FIX16: narrow earthy tree trunks; old radius 9+scale/6 -> 5+scale/10.\\n'\n    'Tree crowns, positions, number of polygons, physics, bridge and road unchanged.\\n'\n    'Global walking and camera movement at FIX12 75 percent.\\n',encoding='utf-8')\nprint('FIX16: tree trunks slimmer, no additional polygons; speed remains 75 percent')\nLYDRA_FIX16_PATCH\n"
