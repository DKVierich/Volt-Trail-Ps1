
# Lydra World Of Dragon FIX40
# Stabiler PS1-Build mit 320x240
# Technischen Code nicht automatisch uebersetzen!

name: LWOD FIX40 STABIL - PS1 Build Reparatur

'on':
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - .github/workflows/blank-ps1.yml

permissions:
  contents: read

jobs:
  build:
    name: FIX40 PS1 Spiel erstellen
    runs-on: ubuntu-latest

    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Buildwerkzeuge installieren
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build unzip curl ffmpeg python3-pil python3-yaml

      - name: Funktionierende FIX36-Buildbasis laden
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            'https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/efb8cdbb05262caf1a714bae16fccaa5984b719a/.github/workflows/blank-ps1.yml' \
            -o "$RUNNER_TEMP/lwod_fix36.yml"

          python3 - <<'PY_BASE'
          from pathlib import Path
          import os,hashlib,yaml

          p=Path(os.environ['RUNNER_TEMP'])/'lwod_fix36.yml'
          data=p.read_bytes()
          h=hashlib.sha1(
              b'blob '+str(len(data)).encode()+b'\0'+data
          ).hexdigest()

          assert h=='3f40dc4623f5fe438329b12c33e8453c9177e1f0', 'FIX36 Vorlagendatei unvollstaendig'

          steps=yaml.safe_load(data)['jobs']['build']['steps']
          assert len(steps)==68, 'FIX36 Vorlagenschritte unerwartet'
          print('FIX36 Original-Vorlage geprueft')
          PY_BASE

          cat > "$RUNNER_TEMP/lwod_fix40_step.py" <<'PY_REPLAY'
          import os,sys,yaml,subprocess
          from pathlib import Path

          p=Path(os.environ['RUNNER_TEMP'])/'lwod_fix36.yml'
          steps=yaml.safe_load(p.read_bytes())['jobs']['build']['steps']
          name=sys.argv[1]

          found=[
              s for s in steps
              if s.get('name')==name
              and isinstance(s.get('run'),str)
          ]

          if len(found)!=1:
              raise SystemExit('FIX40 Schritt nicht eindeutig: '+name)

          print('FIX40 Replay:',name,flush=True)
          subprocess.run(
              ['bash','-euo','pipefail','-c',found[0]['run']],
              check=True
          )
          PY_REPLAY

      - name: Vorgaenger-Workflow vorbereiten
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/lwod_fix40_step.py" 'FIX35R-Patch aus festem GitHub-Stand laden'
          test -s "$RUNNER_TEMP/lwod_fix36_replay.py"
          python3 "$RUNNER_TEMP/lwod_fix40_step.py" 'FIX32 Basis vorbereiten'
          test -s "$RUNNER_TEMP/lwod_run.py"
          echo 'FIX40 Basis vollstaendig vorbereitet'

      # Wichtig: Jeder Basisschritt wird einzeln ausgefuehrt.
      # GitHub uebernimmt dadurch die Umgebungsvariablen.

      - {name: Basis 03, shell: bash, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 3'}
      - {name: Basis 04, shell: bash, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 4'}
      - {name: Basis 05, shell: bash, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 5'}
      - {name: Basis 06, shell: bash, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 6'}
      - {name: Basis 07, shell: bash, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 7'}
      - {name: Basis 08, shell: bash, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 8'}
      - {name: Basis 09, shell: bash, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 9'}
      - {name: Basis 10, shell: bash, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 10'}
      - {name: Basis 11, shell: bash, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 11'}
      - {name: Basis 12, shell: bash, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 12'}
      - {name: Basis 13, shell: bash, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 13'}
      - {name: Basis 14, shell: bash, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 14'}
      - {name: Basis 15, shell: bash, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 15'}
      - {name: Basis 16, shell: bash, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 16'}
      - {name: Basis 17, shell: bash, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 17'}
      - {name: Basis 18, shell: bash, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 18'}
      - {name: Basis 19, shell: bash, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 19'}
      - {name: Basis 20, shell: bash, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 20'}
      - {name: Basis 21, shell: bash, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 21'}
      - {name: Basis 22, shell: bash, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 22'}
