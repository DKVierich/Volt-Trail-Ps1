        def people(s):
            m=function(s,'_build_people');q=m.group()
            places={'Nela':(-10,-7),'Keno':(9,-7),'Lio':(-8,-19),'Yara':(8,-16),'Dorin':(-7,-36),'Ari':(8,-42)}
            for label,(x,z) in places.items():
