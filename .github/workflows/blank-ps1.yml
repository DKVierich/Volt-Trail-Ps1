name: LWOD Android V40.4 Handel Inventar
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/blank-ps1.yml
permissions:
  contents: read
jobs:
  android:
    name: LWOD Android V40.4 APK
    runs-on: ubuntu-latest
    timeout-minutes: 55
    container:
      image: barichello/godot-ci:4.7.2
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: /usr/lib/android-sdk
    steps:
    - name: Repository laden
      uses: actions/checkout@v4
    - name: V40.3 FIX5 Basis aus festem Commit wiederherstellen
      shell: bash
      run: |
        set -euo pipefail
        url='https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/bd620945e3341472a8d00b93b35dfb2bb3957717/.github/workflows/blank-ps1.yml'
        wget -q --https-only --tries=3 --timeout=60 -O "$RUNNER_TEMP/lwod_v403fix5.yml" "$url"
        test -s "$RUNNER_TEMP/lwod_v403fix5.yml"
        actual="$(git hash-object "$RUNNER_TEMP/lwod_v403fix5.yml")"
        if [ "$actual" != '60b9bd5775052a3b9d51784267556ff08926eb4f' ]; then
          echo "::error::V40.3 FIX5 Quelle geaendert. Erwarteter Blob stimmt nicht: $actual"
          exit 42
        fi
        cat > "$RUNNER_TEMP/replay_v403fix5.sh" <<'REPLAY'
        #!/bin/bash
        set -euo pipefail
        wanted="$1"
        awk -v wanted="$wanted" '
          $0 == "    - name: " wanted { found=1; next }
          found && $0 == "      run: |" { active=1; next }
          active && /^    - name:/ { exit }
          active && /^        / { sub(/^        /, ""); print; next }
          active && /^$/ { print ""; next }
          END { if (active != 1) exit 57 }
        ' "$RUNNER_TEMP/lwod_v403fix5.yml" > "$RUNNER_TEMP/v403fix5_step.sh"
        test -s "$RUNNER_TEMP/v403fix5_step.sh"
        bash -n "$RUNNER_TEMP/v403fix5_step.sh"
        echo "::group::V40.3 FIX5: $wanted"
        bash "$RUNNER_TEMP/v403fix5_step.sh"
        echo "::endgroup::"
        REPLAY
        chmod 0755 "$RUNNER_TEMP/replay_v403fix5.sh"
        bash "$RUNNER_TEMP/replay_v403fix5.sh" 'V40.2 Grundlage und FIX5 Dateien wiederherstellen'
        bash "$RUNNER_TEMP/replay_v403fix5.sh" 'FIX5 Alte Dachrahmen und Kollisionen entfernen'
