        # Die funktionierende Quest- und Haendlerlogik nicht umschreiben.
        # Das neue Tagebuch ist ein eigenes Godot-Add-on nach dem Questmarker.
        # Nur awk verwenden: Im Godot-Android-CI-Container ist Python nicht installiert.
        awk '
          $0 == "    v405.setup(self)" {
            count++
            print
            print "    var v406 = load(\"res://scripts/V406JournalHUD.gd\").new()"
            print "    add_child(v406)"
            print "    v406.setup(self)"
            next
          }
          { print }
          END {
            if (count != 1) {
              print "Fehler: Questmarker-Startstelle erwartet 1x, gefunden " count > "/dev/stderr"
              exit 46
            }
          }
        ' android/scripts/Main.gd > android/scripts/Main.gd.v406
        mv android/scripts/Main.gd.v406 android/scripts/Main.gd
        grep -Fqx '    v406.setup(self)' android/scripts/Main.gd
        # Die Versionsnummer wird nach V40.5.5 FIX1 geaendert.
        grep -Fqx 'version/code=54' android/export_presets.cfg
        grep -Fqx 'version/name="4.0.5.5"' android/export_presets.cfg
        sed -i 's@version/code=54@version/code=62@; s@version/name="4.0.5.5"@version/name="4.0.6.2"@' android/export_presets.cfg
        grep -Fqx 'version/code=62' android/export_presets.cfg
        grep -Fqx 'version/name="4.0.6.2"' android/export_presets.cfg
    - name: Godot Ressourcen importieren
      shell: bash
      run: |
        set -euo pipefail
        bash "$RUNNER_TEMP/replay_v404.sh" 'Godot Ressourcen importieren'
        test -s android/scripts/V404Market.gd
        test -s android/tests/V404WeaponSmoke.gd
    - name: Bisherige Handels- und Dorf-Tests
      shell: bash
      run: |
        set -euo pipefail
        bash "$RUNNER_TEMP/replay_v404.sh" 'Bisherige Spieltests V31 bis FIX5 ausfuehren'
        bash "$RUNNER_TEMP/replay_v404.sh" 'V40.4 Handel und Inventar testen'
    - name: V40.4.3 Waffenslot automatisch testen
      shell: bash
      run: |
        set -euo pipefail
        godot --headless --path android --script res://tests/V404WeaponSmoke.gd > "$RUNNER_TEMP/v4043_weapon.log" 2>&1 || {
          cat "$RUNNER_TEMP/v4043_weapon.log"
          exit 1
        }
        cat "$RUNNER_TEMP/v4043_weapon.log"
        grep -Fq 'V404_WEAPON_TEST_OK:' "$RUNNER_TEMP/v4043_weapon.log"
    - name: V40.4.3 Goldrahmen und Haendlerhinweise pruefen
      shell: bash
      run: |
        set -euo pipefail
        godot --headless --path android --script res://tests/V4043UISmoke.gd > "$RUNNER_TEMP/v4043_ui.log" 2>&1 || {
          cat "$RUNNER_TEMP/v4043_ui.log"
          exit 1
        }
        cat "$RUNNER_TEMP/v4043_ui.log"
        grep -Fq 'V4043_UI_OK:' "$RUNNER_TEMP/v4043_ui.log"
    - name: V40.5.5 Questmarker und entfernten Reisehinweis testen
      shell: bash
      run: |
        set -euo pipefail
        godot --headless --path android --script res://tests/V405QuestMarkersSmoke.gd > "$RUNNER_TEMP/v405_markers.log" 2>&1 || {
          cat "$RUNNER_TEMP/v405_markers.log"
          exit 1
        }
        cat "$RUNNER_TEMP/v405_markers.log"
        grep -Fq 'V4055_MARKERS_TEST_OK:' "$RUNNER_TEMP/v405_markers.log"
    - name: V40.6.2 Questregister und Fundmeldung links testen
      shell: bash
      run: |
        set -euo pipefail
        godot --headless --path android --script res://tests/V406JournalSmoke.gd > "$RUNNER_TEMP/v406_journal.log" 2>&1 || {
          cat "$RUNNER_TEMP/v406_journal.log"
          exit 1
        }
        cat "$RUNNER_TEMP/v406_journal.log"
        grep -Fq 'V406_SMOKE_OK:' "$RUNNER_TEMP/v406_journal.log"
    - name: LWOD Android V40.6.2 APK erstellen
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p build/android
        godot --headless --path android --export-debug 'Android' "$GITHUB_WORKSPACE/build/android/LWOD-Android-V40.6.2-Fundmeldung.apk"
        test -s build/android/LWOD-Android-V40.6.2-Fundmeldung.apk
        unzip -t build/android/LWOD-Android-V40.6.2-Fundmeldung.apk >/dev/null
        ls -lh build/android/LWOD-Android-V40.6.2-Fundmeldung.apk
    - name: Fehlerdiagnose speichern
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: LWOD_V40_5_5_DIAGNOSE
        path: |-
          android/scripts/Main.gd
          android/scripts/V404Market.gd
          android/tests/V404WeaponSmoke.gd
          ${{ runner.temp }}/v4043_weapon.log
          android/tests/V4043UISmoke.gd
          ${{ runner.temp }}/v4043_ui.log
          android/scripts/V405QuestMarkers.gd
          android/tests/V405QuestMarkersSmoke.gd
          ${{ runner.temp }}/v405_markers.log
        if-no-files-found: warn
        retention-days: 14
    - name: Android V40.6.2 APK hochladen
      uses: actions/upload-artifact@v4
      with:
        name: LWOD_ANDROID_V40_6_2_APK
        path: build/android/LWOD-Android-V40.6.2-Fundmeldung.apk
        if-no-files-found: error
        retention-days: 14
