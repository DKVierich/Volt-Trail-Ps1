        cat android/scripts/V4082TerrainOverlay.part >> android/scripts/V27Terrain.gd
        grep -Fq 'func surface_height_at(x: float, z: float) -> float:' android/scripts/V27Terrain.gd
        test "$(grep -Fxc '    return float(terrain.call("height_at", p.x, p.z))' android/scripts/V31TerrainMotion.gd)" -eq 1
        sed -i 's/call("height_at", p.x, p.z)/call("surface_height_at", p.x, p.z)/' android/scripts/V31TerrainMotion.gd
        grep -Fq 'surface_height_at' android/scripts/V31TerrainMotion.gd
        test "$(grep -Fxc 'version/code=81' android/export_presets.cfg)" -eq 1
        test "$(grep -Fxc 'version/name="4.0.8.1"' android/export_presets.cfg)" -eq 1
        sed -i 's@version/code=81@version/code=82@; s@version/name="4.0.8.1"@version/name="4.0.8.2"@' android/export_presets.cfg
        grep -Fqx 'version/code=82' android/export_presets.cfg
        grep -Fqx 'version/name="4.0.8.2"' android/export_presets.cfg
        echo 'V4082_INSTALL_OK: Hoehenmesh=Dreiecksinterpolation Dorfplateaus=7 Wege=8m Teleport=2 Tore'
    - name: V40.8.1 bewährte Tests inklusive Ressourcenimport
      shell: bash
      run: |
        set -euo pipefail
        python3 "$RUNNER_TEMP/lwod_v4081_replay.py" "$RUNNER_TEMP/lwod_v4081_baseline.yml" tests
    - name: V40.8.2 Terrain, Dorfplateaus und Wege kontrollieren
      shell: bash
      run: |
        set -euo pipefail
        godot --headless --path android --script res://tests/V4082GroundSmoke.gd > "$RUNNER_TEMP/v4082_ground.log" 2>&1 || {
          cat "$RUNNER_TEMP/v4082_ground.log"
          exit 1
        }
        cat "$RUNNER_TEMP/v4082_ground.log"
        grep -Fq 'V4082_GROUND_TEST_OK:' "$RUNNER_TEMP/v4082_ground.log"
    - name: LWOD Android V40.8.2 FIX2 APK erstellen
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p build/android
        godot --headless --path android --export-debug 'Android' "$GITHUB_WORKSPACE/build/android/LWOD-Android-V40.8.2-HoehenTeleport.apk"
        test -s build/android/LWOD-Android-V40.8.2-HoehenTeleport.apk
        unzip -t build/android/LWOD-Android-V40.8.2-HoehenTeleport.apk >/dev/null
        ls -lh build/android/LWOD-Android-V40.8.2-HoehenTeleport.apk
    - name: V40.8.2 FIX2 Fehlerdiagnose
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: LWOD_V40_8_2_FIX2_DIAGNOSE
        path: 'android/scripts/Main.gd

          android/scripts/V404Market.gd

          android/tests/V404WeaponSmoke.gd

