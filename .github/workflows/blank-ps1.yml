                      vt_pyramid(-180 + i * 120, -18, 320 + i * 80, 10, 32, 124, 228, 255);
                      draw_box(210 - i * 110, 18, 380 + i * 70, 15, 112, 194, 235);
                      vt_pyramid(210 - i * 110, -16, 380 + i * 70, 9, 28, 138, 238, 255);
                  }
                  vt_v24_ruin_arch(0, 690, 150, 156, 170);
              } else {
                  /* Storm Arena: huge approach and arena gate. */
                  draw_box(-180, 16, 540, 54, 110, 66, 42);
                  draw_box(180, 16, 540, 54, 110, 66, 42);
