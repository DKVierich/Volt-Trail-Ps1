    - name: Godot Ressourcen importieren
      shell: bash
      run: 'set -euo pipefail

        bash "$RUNNER_TEMP/replay_v404.sh" ''Godot Ressourcen importieren''

        test -s android/scripts/V404Market.gd

        test -s android/tests/V404WeaponSmoke.gd

        '
    - name: Bisherige Handels- und Dorf-Tests
      shell: bash
      run: 'set -euo pipefail

        bash "$RUNNER_TEMP/replay_v404.sh" ''Bisherige Spieltests V31 bis FIX5 ausfuehren''

        bash "$RUNNER_TEMP/replay_v404.sh" ''V40.4 Handel und Inventar testen''

        '
    - name: V40.4.3 Waffenslot automatisch testen
      shell: bash
      run: "set -euo pipefail\ngodot --headless --path android --script res://tests/V404WeaponSmoke.gd\
        \ > \"$RUNNER_TEMP/v4043_weapon.log\" 2>&1 || {\n  cat \"$RUNNER_TEMP/v4043_weapon.log\"\n\
        \  exit 1\n}\ncat \"$RUNNER_TEMP/v4043_weapon.log\"\ngrep -Fq 'V404_WEAPON_TEST_OK:' \"$RUNNER_TEMP/v4043_weapon.log\"\
        \n"
    - name: V40.4.3 Goldrahmen und Haendlerhinweise pruefen
      shell: bash
      run: "set -euo pipefail\ngodot --headless --path android --script res://tests/V4043UISmoke.gd\
        \ > \"$RUNNER_TEMP/v4043_ui.log\" 2>&1 || {\n  cat \"$RUNNER_TEMP/v4043_ui.log\"\n  exit 1\n\
        }\ncat \"$RUNNER_TEMP/v4043_ui.log\"\ngrep -Fq 'V4043_UI_OK:' \"$RUNNER_TEMP/v4043_ui.log\"\
        \n"
    - name: V40.5.4 Questmarker und Reisehinweis testen
      shell: bash
      run: "set -euo pipefail\ngodot --headless --path android --script res://tests/V405QuestMarkersSmoke.gd\
        \ > \"$RUNNER_TEMP/v405_markers.log\" 2>&1 || {\n  cat \"$RUNNER_TEMP/v405_markers.log\"\n\
        \  exit 1\n}\ncat \"$RUNNER_TEMP/v405_markers.log\"\ngrep -Fq 'V4054_MARKERS_TEST_OK:' \"\
        $RUNNER_TEMP/v405_markers.log\"\n"
    - name: LWOD Android V40.5.4 APK erstellen
      shell: bash
      run: 'set -euo pipefail

        mkdir -p build/android

        godot --headless --path android --export-debug ''Android'' "$GITHUB_WORKSPACE/build/android/LWOD-Android-V40.5.4-Reisehinweis-Fade.apk"

        test -s build/android/LWOD-Android-V40.5.4-Reisehinweis-Fade.apk

        unzip -t build/android/LWOD-Android-V40.5.4-Reisehinweis-Fade.apk >/dev/null

        ls -lh build/android/LWOD-Android-V40.5.4-Reisehinweis-Fade.apk

        '
    - name: Fehlerdiagnose speichern
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: LWOD_V40_5_4_DIAGNOSE
        path: 'android/scripts/Main.gd

          android/scripts/V404Market.gd

          android/tests/V404WeaponSmoke.gd

          ${{ runner.temp }}/v4043_weapon.log

          android/tests/V4043UISmoke.gd

          ${{ runner.temp }}/v4043_ui.log

          android/scripts/V405QuestMarkers.gd

          android/tests/V405QuestMarkersSmoke.gd

          ${{ runner.temp }}/v405_markers.log'
        if-no-files-found: warn
        retention-days: 14
    - name: Android V40.5.4 APK hochladen
      uses: actions/upload-artifact@v4
      with:
        name: LWOD_ANDROID_V40_5_4_APK
        path: build/android/LWOD-Android-V40.5.4-Reisehinweis-Fade.apk
        if-no-files-found: error
        retention-days: 14
