    - name: FIX74 Kampfdesign und Testszene vorbereiten
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p build/diagnose
        cat > android/tests/V473VisualSmoke.gd <<'V473_TEST'
        extends SceneTree
        const B = preload("res://scripts/V469Battle.gd")

        func _initialize() -> void:
            call_deferred("_run")

        func _fail(msg: String) -> void:
            push_error("FIX74: " + msg)
            quit(1)

        func _run() -> void:
            var b := B.new()
            root.add_child(b)
            b._build_battle_screen()
            if b._screen == null or b._actions == null:
                _fail("battle UI was not built")
                return
            var panel: PanelContainer = b._hud.get_node_or_null("BottomPanel") as PanelContainer
            var camera: Camera3D = b._arena.get_node_or_null("Camera3D") as Camera3D
            if panel == null or camera == null:
                _fail("camera or panel missing")
                return
            if camera.position.y < 5.0 or camera.position.z > 7.3 or camera.fov > 55:
                _fail("new close elevated camera was not applied")
                return
            if panel.anchor_top < 0.58:
                _fail("button panel must stay at the bottom")
                return
            b._show_choices(B.hero_actions())
            if b._actions.get_child_count() != 7:
                _fail("hero action count changed")
                return
            for button in b._actions.get_children():
                if not (button is Button) or button.custom_minimum_size.y < 56.0:
                    _fail("buttons not enlarged")
                    return
            if b._arena.get_child_count() < 75:
                _fail("decorated arena missing")
                return
            if B.companion_actions().size()!=5 or B.binding_chance(20,86)<0.4:
                _fail("combat logic regression")
                return
            print("FIX74_VISUAL_TEST_OK: high-resolution arena, forest ring, enhanced dragon, responsive large buttons")
            quit(0)
        V473_TEST
        python3 - <<'FIX74_ASSERT'
        from pathlib import Path
        s=Path('android/scripts/V469Battle.gd').read_text(encoding='utf-8')
        for name in ['msaa_3d = Viewport.MSAA_2X','screen_space_aa = Viewport.SCREEN_SPACE_AA_FXAA','WaldbodenMoos_','Steinkreis_','func _finish_binding()','func _on_save_pressed()','func _sync_team_and_save_buttons()']:
            assert name in s,name
        compile(Path('android/tests/V473VisualSmoke.gd').read_text(),'<gdscript-test-text>','exec') if False else None
        print('FIX74_STATIC_OK: gameplay binding unchanged')
        FIX74_ASSERT
    - name: FIX74 Android Updateversion eindeutig setzen
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'FIX74_VERSION'
        from pathlib import Path
        p=Path('android/export_presets.cfg')
        s=p.read_text(encoding='utf-8')
        assert 'version/name="4.1.7.73"' in s, 'FIX74: graphic upgrade not applied'
        s=s.replace('version/name="4.1.7.73"','version/name="4.1.7.74"',1)
        # Increment a version-code in the export to allow clean Android updates.
        import re
        m=re.search(r'(?m)^version/code=(\d+)$',s)
        assert m, 'FIX74: Android version code missing'
        s=s[:m.start()]+f'version/code={int(m.group(1))+1}'+s[m.end():]
        p.write_text(s,encoding='utf-8')
        print('FIX74_ANDROID_VERSION_OK')
        FIX74_VERSION
