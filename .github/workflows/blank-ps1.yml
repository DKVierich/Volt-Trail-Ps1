        #!/usr/bin/env python3
        # V31.8.7: source frames, 256x192, 256 colors, 8fps GPU crossfade.
        # No final still; keep original game/menu/save/option handling.
        import os,re
        from pathlib import Path
        from PIL import Image, ImageSequence
        source=Path(os.environ['RUNNER_TEMP'])/'lydra_v3187_source.webp'
        project=Path(os.environ['PROJECT_DIR'])/'src'
        main=project/'main.c'
        s=main.read_text(encoding='utf-8')
        with Image.open(source) as im:
            frames=[fr.convert('RGB').copy() for fr in ImageSequence.Iterator(im)]
        if len(frames)!=28 or any(x.size!=(256,192) for x in frames):
            raise RuntimeError('Originalvideo: 28 Bilder 256x192 erforderlich')

        pixels=[]
        palettes=[]
        for im in frames:
            # 8bpp, full 256 colors for the entire frame. No 16-color posterization.
            q=im.quantize(colors=256,method=Image.Quantize.MEDIANCUT,dither=Image.Dither.NONE)
            ids=bytes(q.getdata())
            pal=(q.getpalette() or [])[:768]
            pal.extend([0]*(768-len(pal)))
            packed=[ids[i] | ids[i+1]<<8 for i in range(0,49152,2)]
            clut=[]
            for i in range(256):
                r,g,b=pal[3*i:3*i+3]
                # Set STP to let the GPU crossfade images on every alternate 1/8 second.
                clut.append((r>>3)|((g>>3)<<5)|((b>>3)<<10)|0x8000)
            pixels.append(packed)
            palettes.append(clut)

        h=['/* 28 original MP4 frames, 256x192 PS1 8bpp, GPU crossfade to 8fps. */',
           '#ifndef LYDRA_V3187_MOVIE_H',
           '#define LYDRA_V3187_MOVIE_H',
           'static const unsigned short vt_v3187_pixels[28][24576] __attribute__((aligned(4)))={']
        for frame in pixels:
            h.append('{')
            for a in range(0,len(frame),32):
                h.append(','.join('0x%04x'%v for v in frame[a:a+32])+',')
            h.append('},')
        h.append('};')
        h.append('static const unsigned short vt_v3187_palettes[28][256] __attribute__((aligned(4)))={')
        for pal in palettes:
            h.append('{'+','.join('0x%04x'%v for v in pal)+'},')
        h.extend(['};','#endif'])
        (project/'lydra_v3187_movie.h').write_text('\n'.join(h)+'\n',encoding='utf-8')

        def fspan(name):
            rx=r'\bstatic\s+(?:int|void)\s+'+re.escape(name)+r'\s*\([^;]*?\)\s*\{'
            matches=list(re.finditer(rx,s,re.S))
            if len(matches)!=1:raise RuntimeError('Function count '+name+': '+str(len(matches)))
            start=matches[0].start();i=matches[0].end();depth=1;state='code'
            while i<len(s) and depth:
                c=s[i];n=s[i+1] if i+1<len(s) else ''
                if state=='code':
                    if c=='/' and n=='/': state='line';i+=1
                    elif c=='/' and n=='*':state='block';i+=1
                    elif c=='"':state='string'
                    elif c=="'":state='char'
                    elif c=='{':depth+=1
                    elif c=='}':depth-=1
                elif state=='line':
                    if c=='\n':state='code'
                elif state=='block':
                    if c=='*' and n=='/':state='code';i+=1
                elif c=='\\':i+=1
                elif (state=='string' and c=='"') or (state=='char' and c=="'"):state='code'
                i+=1
            if depth:raise RuntimeError('Unbalanced braces '+name)
            return start,i

        def swap(name,body):
            global s
            a,b=fspan(name)
            s=s[:a]+body.strip()+'\n'+s[b:]

        swap('vt_v314_choice_frame',r'''
        static int vt_v314_choice_frame(void) {
            if(vt_v314_phase==-1) {
                int f=(vt_v314_elapsed*2)/15; /* 8 image changes/sec at NTSC 60Hz */
                if(f<0)f=0;
                if(f>55)f=55;
                return f;
            }
            return 56; /* interactive menu immediately after original 7 seconds */
        }
        ''')

        swap('vt_v314_draw',r'''
        static void vt_v314_draw(void) {
            RECT r;
            POLY_FT4 *q;
            unsigned int a;
            int current=vt_v314_choice_frame();
            int side;
            if(current<0)return;

            if(current<56) {
                int frame=current/2;
                int next=frame<27?frame+1:27;
                int layer;
                /* Two full 256-color movie frames are cached in VRAM.
                   Every odd 1/8-second, PS1 GPU blends the frames 50/50,
                   so there are 8 visible steps/s using 4 source images/s. */
                if(vt_v314_vram_frame/2!=frame || vt_v314_vram_frame<0) {
                    DrawSync(0);
                    setRECT(&r,640,0,128,192);
                    LoadImage(&r,(u_long*)(void*)vt_v3187_pixels[frame]);
                    setRECT(&r,768,0,128,192);
                    LoadImage(&r,(u_long*)(void*)vt_v3187_pixels[next]);
                    setRECT(&r,640,242,256,1);
                    LoadImage(&r,(u_long*)(void*)vt_v3187_palettes[frame]);
                    setRECT(&r,640,243,256,1);
                    LoadImage(&r,(u_long*)(void*)vt_v3187_palettes[next]);
                    DrawSync(0);
                    vt_v314_vram_frame=current;
                    vt_v3182_menu_uploaded=0;
                }
                /* addPrim prepends: enqueue translucent overlay first so that
                   the opaque base is rendered before the 50% overlay. */
                for(layer=(current&1)?1:0;layer>=0;layer--) {
                    a=(prim_used+3u)&~3u;
                    if(a+sizeof(POLY_FT4)>sizeof(prim_arena[db]))return;
                    q=(POLY_FT4*)(prim_arena[db]+a);
                    prim_used=a+sizeof(POLY_FT4);
                    setPolyFT4(q);
                    setXY4(q,0,0,320,0,0,240,320,240);
                    setUV4(q,0,0,255,0,0,191,255,191);
                    setTPage(q,1,0,layer?768:640,0);
                    q->clut=getClut(640,layer?243:242);
                    setSemiTrans(q,layer?1:0);
                    setShadeTex(q,0);
                    setRGB0(q,128,128,128);
                    addPrim(ot[db],q);
                }
                return;
            }

            if(!vt_v3182_menu_uploaded) {
                DrawSync(0);
                setRECT(&r,640,0,160,240);
                LoadImage(&r,(u_long*)(void*)vt_v3182_menu_8bpp);
                setRECT(&r,640,242,256,1);
                LoadImage(&r,(u_long*)(void*)vt_v3182_clut);
                DrawSync(0);
                vt_v3182_menu_uploaded=1;
                vt_v314_vram_frame=56;
            }
            vt_v3172_menu_slots();
            for(side=0;side<2;side++) {
                int left=side?256:0;
                int width=side?64:256;
                a=(prim_used+3u)&~3u;
                if(a+sizeof(POLY_FT4)>sizeof(prim_arena[db]))return;
                q=(POLY_FT4*)(prim_arena[db]+a);
                prim_used=a+sizeof(POLY_FT4);
                setPolyFT4(q);
                setXY4(q,left,0,left+width,0,left,240,left+width,240);
                setUV4(q,0,0,width-1,0,0,239,width-1,239);
                setTPage(q,1,0,side?768:640,0);
                q->clut=getClut(640,242);
                setSemiTrans(q,0);setShadeTex(q,0);
                setRGB0(q,128,128,128);
                addPrim(ot[db],q);
            }
        }
        ''')
        if '#include "lydra_v3187_movie.h"' not in s:
            anchor='static void vt_v314_draw(void)'
            if s.count(anchor)!=1:raise RuntimeError('Draw anchor count: '+str(s.count(anchor)))
            s=s.replace(anchor,'#include "lydra_v3187_movie.h"\n'+anchor,1)
        for marker in ('vt_load_game(void)','vt_save_game(void)','vt_v281_resolve_movement();','vt_v3172_menu_slots();','vt_v3182_menu_8bpp'):
            if marker not in s:raise RuntimeError('Existing game system missing '+marker)
        main.write_text(s,encoding='utf-8')
        print('V31.8.7 ready: original HD-sourced movie, 256 colors, 8 fps, 7s, no appended still.')

        LYDRA_V3187_PATCH
        python3 "$RUNNER_TEMP/lydra_v3187_patch.py"
