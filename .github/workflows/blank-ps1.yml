
# Lydra World Of Dragon - FIX38 STABIL
# Grafikfix 320x240, FIX33 3D-Modelle
# Reparierte GitHub-Buildkette
# Code NICHT automatisch uebersetzen!

name: LWOD FIX38 STABIL - Grafik und Build

'on':
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - .github/workflows/blank-ps1.yml

permissions:
  contents: read

jobs:
  build:
    name: LWOD FIX38 PS1 erstellen
    runs-on: ubuntu-latest

    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Werkzeuge installieren
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build unzip curl ffmpeg python3-pil python3-yaml

      - name: FIX36 Referenz und Replay laden
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --location --silent --show-error --retry 3 \
            'https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/efb8cdbb05262caf1a714bae16fccaa5984b719a/.github/workflows/blank-ps1.yml' \
            -o "$RUNNER_TEMP/fix36.yml"

          python3 - <<'PY_VERIFY'
          from pathlib import Path
          import os
          import hashlib
          import yaml

          root = Path(os.environ['RUNNER_TEMP'])
          source = root / 'fix36.yml'
          raw = source.read_bytes()

          blob = hashlib.sha1(
              b'blob' + b' ' + str(len(raw)).encode()
              + b'\0' + raw
          ).hexdigest()

          expected = '3f40dc4623f5fe438329b12c33e8453c9177e1f0'

          if blob != expected:
              raise SystemExit('FIX36 Referenz unvollstaendig')

          steps = yaml.safe_load(raw)['jobs']['build']['steps']

          if len(steps) != 68:
              raise SystemExit(
                  'FIX36 Schrittzahl falsch: ' + str(len(steps))
              )

          script = '''import os,sys,yaml,subprocess
          from pathlib import Path

          path=Path(os.environ["RUNNER_TEMP"])/"fix36.yml"
          steps=yaml.safe_load(path.read_bytes())["jobs"]["build"]["steps"]

          name=sys.argv[1]
          found=[
              x for x in steps
              if x.get("name")==name
              and isinstance(x.get("run"),str)
          ]

          if len(found)!=1:
              raise SystemExit("FIX36 Schritt fehlt: "+name)

          subprocess.run(
              ["bash","-euo","pipefail","-c",found[0]["run"]],
              check=True
          )
          '''
          import textwrap
          script = textwrap.dedent(script)
          (root/'fix38_step.py').write_text(
              script, encoding='utf-8'
          )
          print('FIX38: Referenz und Replay bereit')
          PY_VERIFY

      - name: FIX35R Vorbereitung wiederherstellen
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/fix38_step.py" \
            'FIX35R-Patch aus festem GitHub-Stand laden'

          test -s "$RUNNER_TEMP/lwod_fix36_replay.py"
          echo "FIX38: Fehlende Vorbereitungsdatei erstellt"

      - name: FIX32 Basis vorbereiten
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/fix38_step.py" \
            'FIX32 Basis vorbereiten'

          test -s "$RUNNER_TEMP/lwod_run.py"
          echo "FIX38: Basis erfolgreich vorbereitet"

      # Originale PS1-Buildschritte einzeln ausfuehren.
      # Wichtig fuer die GitHub-Umgebungsvariablen.

      - {name: Basis 03, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 3'}
      - {name: Basis 04, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 4'}
      - {name: Basis 05, run: 'python3 "$RUNNER_TEMP/lwod_run.py" 5'}
