name: Lydra World Of Dragon V31.8.7 - Originalvideo 256 Farben ohne Endbild
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Quellprojekt auschecken
      uses: actions/checkout@v4
    - name: Werkzeuge installieren
      shell: bash
      run: 'set -euo pipefail

        sudo apt-get update

        sudo apt-get install -y cmake ninja-build unzip curl ffmpeg python3-pil python3-yaml

        '
    - name: Stabile V31.8.1 Build-Basis laden und pruefen
      shell: bash
      run: 'set -euo pipefail

        curl -fLsS --retry 4 --retry-delay 2 ''https://raw.githubusercontent.com/DKVierich/Volt-Trail-Ps1/d8a0a68f96195710f1f0f2ad7bd33c7ceb793cec/.github/workflows/blank-ps1.yml''
        -o "$RUNNER_TEMP/lydra_v3181_reference.yml"

        test -s "$RUNNER_TEMP/lydra_v3181_reference.yml" || { echo ''::error::V31.8.1 Basis fehlt''; exit 1; }

        cat > "$RUNNER_TEMP/lydra_v3182_replay.py" <<''LYDRA_REPLAY_PY''

        import os,sys,subprocess,yaml

        from pathlib import Path

        path=Path(os.environ[''RUNNER_TEMP''])/''lydra_v3181_reference.yml''

        base=yaml.safe_load(path.read_text(encoding=''utf-8''))

        steps=base[''jobs''][''build''][''steps'']

        name=sys.argv[1]

        found=[s for s in steps if s.get(''name'')==name and ''run'' in s]

        if len(found)!=1:raise RuntimeError(''Basis-Schritt fehlt oder ist mehrdeutig: ''+name)

        print(''Wiederherstellen:'',name,flush=True)

        subprocess.run([''bash'',''-euo'',''pipefail'',''-c'',found[0][''run'']],env=os.environ.copy(),check=True)

        LYDRA_REPLAY_PY

        python3 - "$RUNNER_TEMP/lydra_v3181_reference.yml" <<''LYDRA_CHECK_BASE''

        import yaml,sys

        p=yaml.safe_load(open(sys.argv[1]))

        steps=p[''jobs''][''build''][''steps'']

        assert len(steps)==46, ''Referenz-Build wurde geaendert''

        assert steps[37][''name'']==''V31.8 Originalvideo 7 Sekunden Hauptmenue und PS1 Grafiken einbauen''

        assert steps[41][''name'']==''V31.6 Basis | V31.6 FIX2 PS1-Spiel kompilieren''

        print(''Verifizierte stabile V31.8.1 Basis:'',len(steps),''Schritte'')

        LYDRA_CHECK_BASE

        '
    - name: V31.8.1 Basis | Funktionierende V31.6 FIX2 herunterladen
