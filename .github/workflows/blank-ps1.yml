          android/tests/V4043UISmoke.gd

          ${{ runner.temp }}/v4043_ui.log

          android/scripts/V405QuestMarkers.gd

          android/tests/V405QuestMarkersSmoke.gd

          ${{ runner.temp }}/v405_markers.log

          android/scripts/V408Regions.gd

          android/tests/V408RegionSmoke.gd

          ${{ runner.temp }}/v408_regions.log'
        if-no-files-found: warn
        retention-days: 14
    - name: Android V40.8.2 FIX2 APK hochladen
      uses: actions/upload-artifact@v4
      with:
        name: LWOD_ANDROID_V40_8_2_FIX2_APK
