name: Build Volt Trail PS1 image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Volt Trail
        uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake unzip curl jq

      - name: Download and locate PSn00bSDK
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/Lameguy64/PSn00bSDK/releases/latest"
          curl -fsSL "$API" -o "$RUNNER_TEMP/psn00bsdk-release.json"
          URL="$(jq -r '[.assets[] | select(.name | ascii_downcase | endswith(".zip")) | select(.name | ascii_downcase | contains("linux"))][0].browser_download_url // empty' "$RUNNER_TEMP/psn00bsdk-release.json")"
          if [ -z "$URL" ]; then
            echo "Could not find a Linux ZIP asset in the latest release."
            jq -r '.assets[]?.name' "$RUNNER_TEMP/psn00bsdk-release.json"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/psn00bsdk"
          curl -fL "$URL" -o "$RUNNER_TEMP/psn00bsdk.zip"
          unzip -q "$RUNNER_TEMP/psn00bsdk.zip" -d "$RUNNER_TEMP/psn00bsdk"
          echo "SDK toolchain files found:"
          find "$RUNNER_TEMP/psn00bsdk" -type f \( -name 'sdk.cmake' -o -name 'mipsel-none-elf-gcc' -o -name 'mkpsxiso' \) -print
          SDK_CMAKE="$(find "$RUNNER_TEMP/psn00bsdk" -type f -name 'sdk.cmake' -print -quit)"
          if [ -z "$SDK_CMAKE" ]; then
            echo "The downloaded release archive does not contain sdk.cmake."
            echo "Archive contents (first 160 paths):"
            find "$RUNNER_TEMP/psn00bsdk" -maxdepth 5 -print | head -n 160
            exit 1
          fi
          echo "PSN00BSDK_CMAKE=$SDK_CMAKE" >> "$GITHUB_ENV"
          SDK_BIN="$(find "$RUNNER_TEMP/psn00bsdk" -type f -name 'mipsel-none-elf-gcc' -print -quit | xargs -r dirname)"
          if [ -n "$SDK_BIN" ]; then echo "$SDK_BIN" >> "$GITHUB_PATH"; fi

      - name: Verify project and SDK
        run: |
          test -f CMakeLists.txt
          test -f src/main.c
          test -f iso.xml
          cmake --version
          test -f "$PSN00BSDK_CMAKE"
          mipsel-none-elf-gcc --version
          mkpsxiso --help || true

      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$PSN00BSDK_CMAKE"
          cmake --build build --verbose

      - name: List generated PlayStation files
        if: success()
        run: |
          find build -type f \( -iname '*.bin' -o -iname '*.cue' -o -iname '*.exe' \) -printf '%p (%s bytes)\n'

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VoltTrail-PS1-build
          path: |
            build/**/*.bin
            build/**/*.cue
            build/**/*.exe
          if-no-files-found: error
          retention-days: 14
